### ideas ###

HWI_restore_monarchy:0 "Restore The Monarchy"
HWI_restore_monarchy_desc:0 "It is time to restore the Monarchy and bring back our Queen."

HWI_david_I:0 "Liliuokalani I"
HWI_david_I_desc:0 "Queen of Hawaii and protector of the people and protector of the Gods."

HWI_kingdom:0 "Kingdom Of Hawaii"

HWI_kingdom_restored:0 "Restore The Kingdom."
HWI_kingdom_restored_desc:0 "It is time to restore the kingdom and remove the shame of being illegally annexed by the United States."

HWI_royal_guard:0 "Royal Guard"
HAW_royal_guard_desc:0 "Protectors of the Monarch and the Temples."

HWI_restore_royal_guard:0 "Create The Royal Guard"
HWI_restore_royal_guard_desc:0 "To prevent another illegal coup the monarch needs a royal guard to protect them and the temples."

HWI_invite_japanese:0 "Invite Japanese Settlers"
HWI_invite_japanese_desc:0 "Hawaii already has a population of Japanese settlers on the islands. With Japan in ruins we can invite more to come to Hawaii"

HWI_japanese_minority:0 "Japanese Minority"
HWI_japanese_minority_desc:0 "Japanese Settlers in Hawaii have some political power and influence in the nation"

HWI_new_islands:0 "New Islands"
HWI_new_islands_desc:0 "We need to expand to other islands in order to increase the size of our economy and our military."

HWI_new_settlers:0 "New Settlers For New Islands"
HWI_new_settlers_desc:0 "We need to invite Settlers to come to our new lands and help us build up our country."

HWI_nation_unity:0 "National Unity"
HWI_nation_unity_desc:0 "Unite Fellow Hawaiians! Long Live The Queen!"

HWI_new_soldiers:0 "New Divisions"
HWI_new_soldiers_desc:0 "The Veterans from multiple wars are ready to join the army once again to defend our Kingdom."

HWI_new_schools:0 "Reformed Schools"
HWI_new_schools_desc:0 "The Education System has been modernized and reformed for our students."

HWI_education_reforms:0 "Education Reforms"
HWI_education_reforms_desc:0 "The Education System is outdated and needs to be reformed and modernized to educate our students better."

HWI_new_farms:0 "Reformed Farming"
HWI_new_farms_desc:0 "Government reforms have helped the farmers use better equipment and farming skills."

HWI_land_reforms:0 "Land Reforms"
HWI_land_reforms_desc:0 "The farmers need out help and we are happy to help them with anything they need"

HWI_first_war:0 "the First War"
HWI_first_war_desc:0 "It is time to start taking our new lands and expanding our kingdom. the western powers are must be defeated"

HWI_king_speech:0 "The Queen's Speech"

HWI_princess:0 "Princess Liliuokalani"
HWI_princess_desc:0 "Daughter of Queen Liliuokalani and Heir to the Hawaiian Throne. Future protector of the kingdom and the temples."

HWI_the_new_princess:0 "The New Princess"
HWI_the_new_princess_desc:0 "The Gods have blessed the king with a healthy baby girl! Heir to the throne!"
 
HWI_build_up:0 "Building Up The Kingdom"
HWI_build_up_desc:0 "It is time that we build up the kingdom in order to improve our economy and help us in times of war."

HWI_next_war:0 "Our Next Target."
HWI_next_war_desc:0 "With France defeated and our claim now ours it is time to move on to our next target. Britian."

HWI_american_war:0 "The American War"
HWI_american_war_desc:0 "Our next target is the United States. They will now pay for illegally annexing us and repressing our culture and religion." 

HWI_conservative_ban:0 "Extremist Parties Banned"

HWI_ban_extremeist_parties:0 "Outlaw Extremist Parties"
HWI_ban_extremeist_parties_desc:0 "In order to protect our nation and our monarchy we must ban extremist parties."

HWI_police_force:0 "Royal Hawaiian Police Force"
HWI_police_force_desc:0 "Enforcers of the law and protectors of the people."

HWI_royal_police:0 "Create A Police Force"
HWI_royal_police_desc:0 "The Kingdom needs a police force in order to protect our people and to enforce the law."

HWI_diplomatic_visits:0 "Diplomatic Visits"
HWI_diplomatic_visits_desc:0 "We need to make friends with other nations and to create trade agreements with other nations."

HWI_destroy_mao:0 "Destroy Mao"
HWI_destroy_mao_desc:0 "Mao is a monster and has killed millions of people. It is time to liberate China and bring democracy back to it."

HWI_temple:0 "Rebuild The Temples"
HWI_temple_desc:0 "It is time to rebuild the temples and our relationships with the gods."

HWI_restored_temples:0 "Temple Of The Gods"

HWI_the_navy_reforms:0 "The Navy Reforms"
HWI_the_navy_reforms_desc:0 "More Ships, More Sailors, More Strength!

HWI_Royal_Navy:0 "The Royal Navy"
HWI_Royal_Navy_desc:0 "Hawaii needs a navy in order to protect our islands and to transport our troops overseas."

HWI_army_reforms:0 "Army Reforms"
HWI_army_reforms_desc:0 "Better Training Better Equipment and Better Soldiers."

HWI_Royal_Army:0 "Royal Army Reforms"
HWI_Royal_Army_desc:0 "The army needs reforms in order to improve our soldiers and equipment."

HWI_empire_building:0 "Building An Empire"
HWI_empire_building_desc:0 "It is time to start building an empire of our own. This will help us gain respect along the world nations."

HWI_even_more_islands:0 "Second Island Grab"
HWI_even_more_islands_desc:0 "It is time to expand again and take more islands."