l_english:

 ##### FOCUSES

 CAN_niobe_and_rainbow:0 "Niobe and Rainbow"
 CAN_niobe_and_rainbow_desc:0 "Eleven thousand tons at Halifax in October and thirty-six hundred at Esquimalt in November, both struck off the Admiralty list. They are schoolrooms with guns, and the country will call them a tin-pot navy before the year is out."

 CAN_a_cheque_to_whitehall:0 "A Cheque to Whitehall"
 CAN_a_cheque_to_whitehall_desc:0 "The estimate is written out to the Admiralty and not to a Canadian yard. London gets its ships years sooner than Halifax could lay a keel, and the Dominion gets a receipt."

 CAN_the_navy_league_of_canada:0 "The Navy League"
 CAN_the_navy_league_of_canada_desc:0 "Branches in every Ontario town, lantern lectures on the German programme, cadet corps in the schools. It is the loudest voice in the country for the contribution and it does not hold a seat in Quebec."

 CAN_the_churchill_memorandum:0 "The Churchill Memorandum"
 CAN_the_churchill_memorandum_desc:0 "Sir Robert sits at the Committee of Imperial Defence and comes away with a paper signed by the First Lord: the German programme, the margin, and a request for great ships now rather than a flotilla later."

 CAN_the_naval_aid_bill:0 "The Naval Aid Bill"
 CAN_the_naval_aid_bill_desc:0 "Thirty-five millions for three ships of the Dreadnought type, given outright, with no Canadian flag and no Canadian yard. Mr Monk leaves the Cabinet rather than sit for it."

 CAN_the_first_closure:0 "The Closure"
 CAN_the_first_closure_desc:0 "Six months of obstruction, one sitting that ran a fortnight without adjourning, and a new standing order to end debate by vote. It carries the Bill through the Commons in May and it is never given back."

 CAN_the_senate_says_no:0 "The Senate Says No"
 CAN_the_senate_says_no_desc:0 "The chamber Sir Wilfrid filled will not consent at second reading until the measure has been submitted to the judgment of the country. Thirty-five millions die there, and so does the fleet unit refused to get them."

 CAN_the_ministry_of_the_naval_service:0 "A Department for the Service"
 CAN_the_ministry_of_the_naval_service_desc:0 "Whatever was decided, the ships and the men need estimates, stores, pay and a deputy minister. The Naval Service gets a department of its own and a file of its own at last."

 CAN_the_ships_lie_at_the_wall:0 "The Ships Lie at the Wall"
 CAN_the_ships_lie_at_the_wall_desc:0 "No vote, no estimate, no policy. The two cruisers are reduced to care and maintenance with a handful of hands aboard, and the country keeps the money it never agreed to spend."

 CAN_a_coast_without_a_guard:0 "A Coast Without a Guard"
 CAN_a_coast_without_a_guard_desc:0 "Two oceans, a gulf, a river and the fisheries steamers. Nothing else is asked for and nothing else is voted."

 CAN_the_money_goes_to_the_west:0 "The Money Goes West"
 CAN_the_money_goes_to_the_west_desc:0 "Three millions a year that were to have gone into hulls go into elevators, branch lines and the terminals at the Lakehead. The Prairies have paid for the tariff since 1879 and this is the first year they collect."

 CAN_the_admiralty_keeps_the_stations:0 "The Admiralty Keeps the Stations"
 CAN_the_admiralty_keeps_the_stations_desc:0 "London is asked to go on watching both coasts as it did before the withdrawal. It costs nothing, and it means the Dominion cannot say a word about how either ocean is defended."

 CAN_champlain_and_vancouver:0 "Champlain and Vancouver"
 CAN_champlain_and_vancouver_desc:0 "Two destroyers of the S class are handed over from British stock and renamed, the only ships added in the decade. They are worn and they are ten years old, and they keep a service alive that has nothing else to steam."

 CAN_the_uganda_vote:0 "The Uganda Votes"
 CAN_the_uganda_vote_desc:0 "The cruiser's company is asked to volunteer for the Pacific and most of her men decline. She leaves the theatre under her own pennant, the only Allied warship taken out of action by a ballot of her crew."

 CAN_the_third_navy_in_the_world:0 "The Third Largest Fleet"
 CAN_the_third_navy_in_the_world_desc:0 "Three hundred and seventy-three warships and ninety-five thousand men, from thirteen ships and thirty-five hundred hands in 1939. Two navies in the world are larger and neither was built in six years."

 ##### IDEAS

 CAN_idea_the_fleet_unit_precedent:0 "The Fleet Unit Precedent"
 CAN_idea_the_fleet_unit_precedent_desc:0 "Australia said the same thing in the same room. On the naval question the Dominion is not standing against the Empire alone; it is standing beside Melbourne against the cash contribution."

 CAN_idea_a_seat_at_the_admiralty_table:0 "A Seat at the Admiralty Table"
 CAN_idea_a_seat_at_the_admiralty_table_desc:0 "Money buys attention in Whitehall: drawings, patterns and the loan of officers come freely. Nothing that floats is built on this side of the ocean."

 CAN_idea_the_naval_estimate_goes_to_london:0 "The Estimate Goes to London"
 CAN_idea_the_naval_estimate_goes_to_london_desc:0 "The whole naval vote crosses the Atlantic every year. The Treasury is content, the Admiralty is content, and no yard in the Dominion learns to build a warship."

 CAN_idea_the_navy_league:0 "The Navy League"
 CAN_idea_the_navy_league_desc:0 "Lectures, cadet corps and a subscription list in every Ontario town. It makes the sea popular in half the country."

 CAN_idea_the_german_emergency:0 "The German Emergency"
 CAN_idea_the_german_emergency_desc:0 "The First Lord's figures are on the Cabinet table: keels laid, margins closing, and a date by which the margin is gone."

 CAN_idea_thirty_five_millions:0 "Thirty-Five Millions"
 CAN_idea_thirty_five_millions_desc:0 "A single vote larger than the whole militia estimate, carried on the credit of a young country. It is felt in every other estimate for a decade."

 CAN_idea_the_closure_rule:0 "The Closure Rule"
 CAN_idea_the_closure_rule_desc:0 "Debate can now be ended by a vote of the majority. Every government after this one will have the instrument, and every opposition will remember who forged it."

 CAN_idea_the_bill_is_dead:0 "The Bill Is Dead"
 CAN_idea_the_bill_is_dead_desc:0 "Neither battleships nor a flotilla. The estimate lapses, the yards get nothing, and the coast is defended by two cruisers that were old when they were bought."

 CAN_idea_the_naval_service_department:0 "The Naval Service Department"
 CAN_idea_the_naval_service_department_desc:0 "Stores, pay, dockyard accounts and a deputy minister who answers for them. It is not a fleet, but it is the machinery a fleet cannot exist without."

 CAN_idea_the_ships_at_the_wall:0 "Care and Maintenance"
 CAN_idea_the_ships_at_the_wall_desc:0 "Boilers cold, magazines empty, a caretaker party aboard. The ships are kept because selling them would settle a question the country refuses to settle."

 CAN_idea_a_coast_without_a_guard:0 "A Coast Without a Guard"
 CAN_idea_a_coast_without_a_guard_desc:0 "Two oceans watched by fisheries steamers and goodwill. The saving is real and so is the risk, and only one of them appears in the estimates."

 CAN_idea_the_money_went_west:0 "The Money Went West"
 CAN_idea_the_money_went_west_desc:0 "Elevators, branch lines and terminal capacity at the head of the Lakes. The grain moves and the tidewater waits."

 CAN_idea_the_imperial_stations:0 "The Imperial Stations"
 CAN_idea_the_imperial_stations_desc:0 "The squadrons stay, the flag stays, and the Dominion pays nothing and decides nothing. Defence remains a subject on which Ottawa is a spectator."

 CAN_idea_niobe_and_rainbow:0 "Niobe and Rainbow"
 CAN_idea_niobe_and_rainbow_desc:0 "Two old cruisers on two oceans, worth little in action and everything as schools. Every Canadian seaman of the next war is taught by a man who was taught aboard them."

 CAN_idea_champlain_and_vancouver:0 "Champlain and Vancouver"
 CAN_idea_champlain_and_vancouver_desc:0 "Second-hand destroyers with Canadian names. They keep a nucleus of trained hands together through the leanest decade the service will ever see."

 CAN_idea_the_uganda_vote:0 "No Man Without His Consent"
 CAN_idea_the_uganda_vote_desc:0 "The promise made in 1939 is kept to the letter, aboard a ship in a war zone, and the country sees what the letter costs."

 CAN_idea_the_third_navy:0 "Third Among the Fleets"
 CAN_idea_the_third_navy_desc:0 "Escort groups, support groups, a theatre command and the men to work them. Keeping any of it in peacetime will be argued about for ten years."

 ##### PRESS

 CAN_news_500_t:0 "Ottawa Creates a Navy of Its Own"
 CAN_news_500_d:0 "The Royal Assent of the fourth of May establishes a naval service, a department to administer it and a college to officer it. A clause permits the Governor in Council to place the ships at the Admiralty's disposal in an emergency."

 CAN_news_501_t:0 "The Dominions Answer at London"
 CAN_news_501_d:0 "New Zealand offers to pay for a battle cruiser outright. Australia and Canada decline the cheque and undertake to raise fleet units of their own. Ottawa is not alone against the Empire; it stands beside Melbourne against the contribution."

 CAN_news_502_t:0 "Thirty-Five Millions for the Empire"
 CAN_news_502_d:0 "The Prime Minister asks the Commons for three ships of the Dreadnought type, built in British yards and given to the Royal Navy without condition. His Quebec lieutenant resigns from the Cabinet the same season."

 CAN_news_503_t:0 "Canada Pays for Three Capital Ships"
 CAN_news_503_d:0 "The contribution is carried and the money crosses the Atlantic. Three great ships will fly the White Ensign; not one keel is laid on this side of it, and the Dominion has no voice in where they steam."

 CAN_news_504_t:0 "The Senate Refuses the Naval Bill"
 CAN_news_504_d:0 "The Upper House declines to consent at second reading until the measure has been submitted to the judgment of the country. The Dominion will have neither imperial battleships nor a fleet of its own."

 CAN_news_505_t:0 "Submarines Off the Nova Scotia Coast"
 CAN_news_505_d:0 "Cruiser submarines have crossed the ocean and are sinking schooners within sight of the shore. The war has reached the coast of North America, and the vessels sent against it are trawlers with one gun apiece."

 CAN_news_506_t:0 "A Dominion Takes Half an Ocean"
 CAN_news_506_d:0 "From St John's the Royal Canadian Navy assumes the western half of the North Atlantic convoy run. The corvettes are months out of the yard and the ratings months out of civil life."

 CAN_news_507_t:0 "The River Is Closed to Ocean Traffic"
 CAN_news_507_d:0 "After a season of sinkings in the Gulf and the estuary, ocean cargoes are ordered to Halifax and the St Lawrence is shut. The censor forbids the newspapers to say why, and the ports below Quebec fall silent."

 CAN_news_508_t:0 "A Canadian Admiral Takes the Ocean"
 CAN_news_508_d:0 "The convoy conference divides the Atlantic and gives its north-western quarter to Halifax. Every ship and aircraft inside it answers to a Canadian flag officer, whatever flag they fly."

 CAN_news_509_t:0 "A Ship's Company Votes Itself Home"
 CAN_news_509_d:0 "Asked to volunteer for the Pacific under the rule that no man is sent without his consent, the cruiser's people decline by a majority and she comes out of the line. No other navy in the alliance has had to ask."
