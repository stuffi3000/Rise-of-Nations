l_english:
 MNT_the_petersburg_subvention:0 "The Petersburg Subvention"
 MNT_the_petersburg_subvention_desc:0 "Almost every rifle in the armoury and almost every gun on the Lovcen came from Russia as a gift, never as a purchase. A gift is cheaper than a loan and costs more than either."
 MNT_the_money_from_montana:0 "The Money from Montana"
 MNT_the_money_from_montana_desc:0 "The mines of Montana, the yards of Pittsburgh, the Alaskan rush. The money our emigrants send home owes nothing to any court in Europe. It is the only clean revenue we have, and every krone of it is a man who did not stay."
 MNT_a_coin_of_our_own:0 "A Coin of Our Own"
 MNT_a_coin_of_our_own_desc:0 "A state bank in Cetinje and a currency with our own prince on it. We enter the money economy sixty years after our neighbours, and we enter it owing rather less."
 MNT_the_road_to_the_sea:0 "The Road to the Sea"
 MNT_the_road_to_the_sea_desc:0 "Antivari is a harbour on paper. Made a harbour in fact, it becomes our door to the world; it does not become a naval base, because the Congress of Berlin says it may not."
 MNT_the_narrow_gauge_to_the_lake:0 "The Narrow Gauge to the Lake"
 MNT_the_narrow_gauge_to_the_lake_desc:0 "Sixty kilometres of track from Bar to Virpazar, laid with Italian capital on Italian terms. The tobacco monopoly is already theirs. Now the railway is too."
 MNT_the_prince_of_the_black_mountain:0 "The Prince of the Black Mountain"
 MNT_the_prince_of_the_black_mountain_desc:0 "Forty years of rule without a constitution, without a parliament and without parties, over a coast we may not arm, an army that is not standing, and a treasury paid from abroad."
 MNT_the_saint_nicholas_constitution:0 "The Nikoljdan Constitution"
 MNT_the_saint_nicholas_constitution_desc:0 "A constitution granted on Saint Nicholas' day, and the first elected assembly in the history of the country. A chamber is also, and forever after, a place where the end of the country can be voted for."
 MNT_rule_as_before:0 "Rule as Before"
 MNT_rule_as_before_desc:0 "No assembly, no parties, no vote that anyone need count. What cannot be debated cannot be conceded - and what cannot be debated is settled with bombs and with trials."
 MNT_a_daughter_on_the_throne_of_italy:0 "A Daughter on the Throne of Italy"
 MNT_a_daughter_on_the_throne_of_italy_desc:0 "Elena Petrovic-Njegos has been Queen of Italy since the summer of 1900. This costs nothing to decide, because it has already happened, and it will be charged to us for fifty years."
 MNT_the_clubmen:0 "The Club of the People's Deputies"
 MNT_the_clubmen_desc:0 "Young men schooled in Belgrade, who want a government answerable to the chamber and a union with Serbia, in that order. They are the first legal opposition this country has ever had."
 MNT_the_true_peoples_party:0 "The True People's Party"
 MNT_the_true_peoples_party_desc:0 "A loyal opposition, invented by the throne so that the disloyal one has a rival. It comes with a bomb plot, a set of arrests and a verdict Belgrade will not forget."
 MNT_the_clubmen_take_the_house:0 "The Clubmen Take the House"
 MNT_the_clubmen_take_the_house_desc:0 "Ministers answerable to the Skupstina at last. Serbian money and Serbian officers arrive with the reform, and a quarter of the kingdom passes, quietly and legally, into another family's hands."
 MNT_a_crown_for_the_jubilee:0 "A Crown for the Jubilee"
 MNT_a_crown_for_the_jubilee_desc:0 "Fifty years of rule, and the assembly petitions him to take the title he has earned. Prince Nikola becomes King Nikola, and Montenegro raises a royal army of forty-four thousand men."
 MNT_the_neutral_mountain:0 "The Neutral Mountain"
 MNT_the_neutral_mountain_desc:0 "Vienna has been offering for two years. Take the offer and the army is whole in 1918, the border is where it was, and no capital in Europe will receive our envoy again."
 MNT_the_assembly_decides_for_war:0 "The Assembly Decides for War"
 MNT_the_assembly_decides_for_war_desc:0 "The National Assembly votes for war on the first of August. The guns come down off the Lovcen and point at Cattaro, and the allied loan begins to arrive in weekly instalments."
 MNT_the_crown_in_a_suitcase:0 "The Crown in a Suitcase"
 MNT_the_crown_in_a_suitcase_desc:0 "Lyon, then Bordeaux, then a house at Neuilly-sur-Seine. A government with a seal, a newspaper and a treasury exactly the size of what the courts still send, and not one square metre of Montenegro."
 MNT_the_balkan_league:0 "The Balkan League"
 MNT_the_balkan_league_desc:0 "Four kingdoms against one empire, and we are the smallest of the four by a wide margin. Nobody expects us to open."
 MNT_first_to_fire:0 "First to Fire"
 MNT_first_to_fire_desc:0 "The eighth of October, ten days before our allies. Forty-four thousand men, no reserve, no depot and no second plan. It wins us nothing on the field and everything in the story we tell about ourselves."
 MNT_the_walls_of_scutari:0 "The Walls of Scutari"
 MNT_the_walls_of_scutari_desc:0 "Six months in front of a fortress that finally falls because a pasha sells it. Three thousand men we cannot replace, for a city the Powers have already decided we may not keep."
 MNT_we_do_not_leave_scutari:0 "We Do Not Leave Scutari"
 MNT_we_do_not_leave_scutari_desc:0 "The king announced the evacuation; the war party at Cetinje and Prince Danilo's officers wanted the place held. Hold it, and Montenegro has a real port and a real hinterland - and every fleet in the Adriatic anchored across its mouth."
 MNT_the_treaty_of_london:0 "The Treaty of London"
 MNT_the_treaty_of_london_desc:0 "Plav, Gusinje, Pec, Djakovica, Berane, Bijelo Polje, Pljevlja. The country roughly doubles, and for the first time in its history it shares a border with a Serbian army corps."
 MNT_a_serbian_chief_of_staff:0 "A Serbian Chief of Staff"
 MNT_a_serbian_chief_of_staff_desc:0 "General Bozidar Jankovic comes from Belgrade to command the royal army. He is the best soldier we will ever have, and after him the army has two capitals."
 MNT_hold_the_lovcen:0 "Hold the Lovcen"
 MNT_hold_the_lovcen_desc:0 "The mountain is the country's roof and the gun platform over Cattaro. Hold it and the capitulation is postponed, the allied loan stops, and every White in Montenegro remembers who was left on the Tara."
 MNT_cover_the_retreat:0 "Cover the Retreat"
 MNT_cover_the_retreat_desc:0 "Mojkovac, the sixth of January. Vukotic's sandzak army holds the Tara so a Serbian army can cross Albania alive. Half of ours does not come back, the Lovcen falls three weeks later, and Serbia owes us a debt it will repay by absorbing us."
 MNT_the_green_lists:0 "The Green Lists"
 MNT_the_green_lists_desc:0 "The Podgorica assembly can vote a union without conditions, a union with conditions, or nothing at all. The Greens want a king and a parliament of our own first, and union afterwards, and they are willing to shoot about it."
 MNT_a_throne_without_a_protector:0 "A Throne Without a Protector"
 MNT_a_throne_without_a_protector_desc:0 "Petersburg is a memory, Rome wants its railway paid for, and Belgrade already holds the title deed. A throne that funds itself answers to nobody and can afford almost nothing."
 MNT_the_mandates_from_america:0 "The Mandates from America"
 MNT_the_mandates_from_america_desc:0 "The remittances come back larger than before the war, from men who will not. It is the last money in Europe that arrives without a claim attached, and it will stop of its own accord."
 MNT_the_christmas_rising:0 "The Christmas Rising"
 MNT_the_christmas_rising_desc:0 "Cetinje at Orthodox Christmas, 1919. Krsto Popovic and Jovan Plamenac against the Serbian garrison and the men who voted for union. Whichever side wins, Montenegrins will have shot Montenegrins over the answer."
 MNT_the_gaeta_declaration:0 "The Gaeta Declaration"
 MNT_the_gaeta_declaration_desc:0 "A depot in an Italian port, Italian rifles, Italian rations, and a king in exile who signs for all of it. Rome is not a charity and it keeps its receipts."
 MNT_the_army_of_gaeta:0 "The Army of Gaeta"
 MNT_the_army_of_gaeta_desc:0 "A landing with Italian weapons off Italian ships, and Montenegro is on the map again. A country brought back to life by one creditor belongs to that creditor, and thirty points is the going rate."
 MNT_the_komiti_of_the_highlands:0 "The Komiti of the Highlands"
 MNT_the_komiti_of_the_highlands_desc:0 "No depot, no rear, no rations but what the villages give. The gendarmerie cannot find us and we cannot hold anything. The amnesty will be offered every year, and it is real, and taking it ends the branch."
 MNT_the_federalist_party:0 "The Federalist Party"
 MNT_the_federalist_party_desc:0 "The Green cause without the rifle: a party, a newspaper, a bloc in the Belgrade chamber. Everything is now argued rather than shot over, and the men in the hills are on their own."
 MNT_the_party_of_the_mountains:0 "The Party of the Mountains"
 MNT_the_party_of_the_mountains_desc:0 "Illegal, small, and the only organisation in the kingdom that recruits equally in Cetinje and in the villages. Its cells are broken every second year and reappear every third."
 MNT_the_comintern_on_the_national_question:0 "The Comintern on the National Question"
 MNT_the_comintern_on_the_national_question_desc:0 "In 1925 the International names Montenegro a distinct nation with a right to its own state. It is the only body in Europe that says so, and it says so for its own reasons. Accepting the answer means accepting the whole of it."
 MNT_the_sporazum_and_the_others:0 "The Sporazum and the Others"
 MNT_the_sporazum_and_the_others_desc:0 "Croatia has just been granted a banovina of its own. The precedent is open, it is open for months rather than years, and every other nation in the kingdom is now in the queue behind it."
 MNT_a_banovina_of_our_own:0 "A Banovina of Our Own"
 MNT_a_banovina_of_our_own_desc:0 "An autonomous Montenegrin unit obtained by negotiation. The country exists administratively in 1939 instead of 1945, the offices are handed over intact, and nobody has to go to the hills to earn it."
 MNT_the_petrovdan_crown:0 "The Petrovdan Crown"
 MNT_the_petrovdan_crown_desc:0 "A kingdom restored on Saint Peter's day by an Italian proclamation, with an Italian garrison and a regent nobody chose. It is a throne, it is Montenegrin, and it is theirs. The country rises within forty-eight hours."
 MNT_the_thirteenth_of_july:0 "The Thirteenth of July"
 MNT_the_thirteenth_of_july_desc:0 "Thirty-two thousand men in arms within a week, the first general rising in occupied Europe. It has no plan for what happens in August, and the winter in the sandzak will be paid for by the villages."
 MNT_the_lovcen_brigade:0 "The Lovcen Brigade"
 MNT_the_lovcen_brigade_desc:0 "The only men who will still enlist under a crown the Italians handed back. They fight well, they are Montenegrins, and no one will thank them for it afterwards."
 MNT_a_republic_of_our_own:0 "A Republic of Our Own"
 MNT_a_republic_of_our_own_desc:0 "A federated unit with its own government, its own borders and its own name. The question asked at Podgorica in 1918 is finally answered yes - and the answer is given by a party rather than by an assembly, so the title has merely changed owner."
 MNT_titograd:0 "Titograd"
 MNT_titograd_desc:0 "The capital moves out of the mountains and down to the plain, where a factory can be built and a railway can reach. Cetinje keeps the monastery, the graves and nothing else."
 MNT_a_republic_among_six:0 "A Republic Among Six"
 MNT_a_republic_among_six_desc:0 "An academy, a language commission, a republican administration and a seat at the federal table. Everything Montenegro asked for in 1918, granted by a state that will not permit it to be asked for again."
 MNT_the_men_of_forty_eight:0 "The Men of Forty-Eight"
 MNT_the_men_of_forty_eight_desc:0 "Moscow's break arrives with a quota of names attached, and this republic supplies more of them per head than any other. Goli Otok is a bare rock in the Adriatic, and filling the quota is the cheapest thing on offer."
 MNT_the_kingdom_that_endured:0 "The Kingdom That Endured"
 MNT_the_kingdom_that_endured_desc:0 "The Petrovic still reign, the last foreign court that paid for them is gone, and the treasury balances on its own receipts for the first time since 1878. There is nobody left to owe, and nobody left to inherit."
 MNT_idea_article_twenty_nine_of_berlin:0 "Article Twenty-Nine of Berlin"
 MNT_idea_article_twenty_nine_of_berlin_desc:0 "The Congress gave us a coast and forbade us a navy on it. Antivari's waters are policed from Vienna, and no Montenegrin warship may enter them."
 MNT_idea_no_standing_army:0 "No Standing Army"
 MNT_idea_no_standing_army_desc:0 "Every man owns a rifle and no man is a soldier. The country can raise forty thousand men in a fortnight and cannot keep four thousand in barracks for a year."
 MNT_idea_a_treasury_paid_abroad:0 "A Treasury Paid Abroad"
 MNT_idea_a_treasury_paid_abroad_desc:0 "The budget of Cetinje is written in Cetinje and funded in Petersburg. What arrives is generous, unpredictable, and revocable."
 MNT_idea_a_treasury_half_our_own:0 "A Treasury Half Our Own"
 MNT_idea_a_treasury_half_our_own_desc:0 "The perper circulates, the state bank discounts, and about half of what the government spends is now money it has actually raised."
 MNT_idea_the_emigrant_remittances:0 "The Emigrant Remittances"
 MNT_idea_the_emigrant_remittances_desc:0 "The money comes home from Montana and Pennsylvania every month. The men do not."
 MNT_idea_the_antivari_concession:0 "The Antivari Concession"
 MNT_idea_the_antivari_concession_desc:0 "The port, the railway and the tobacco monopoly are worked with Italian capital under Italian management. The concession runs to 1920 and cannot be bought back before it."
 MNT_idea_the_king_who_did_not_fight:0 "The King Who Did Not Fight"
 MNT_idea_the_king_who_did_not_fight_desc:0 "The army is intact, the treasury is Viennese, and there is not an allied chancellery in Europe that will take our envoy's card."
 MNT_idea_a_throne_that_pays_itself:0 "A Throne That Pays Itself"
 MNT_idea_a_throne_that_pays_itself_desc:0 "No subvention, no protector and no instructions. The government does as it pleases with an income that will not build anything larger than a road."
 MNT_idea_a_throne_held_by_foreigners:0 "A Throne Held by Foreigners"
 MNT_idea_a_throne_held_by_foreigners_desc:0 "The crown is Montenegrin, the regent is a formality and the garrison is Italian. Every recruit knows which of the three is real."
 MNT_idea_the_adriatic_blockade:0 "The Adriatic Blockade"
 MNT_idea_the_adriatic_blockade_desc:0 "We kept Scutari. In exchange, every Power with a fleet has anchored one across our only harbour mouth."
 MNT_idea_the_debt_of_mojkovac:0 "The Debt of Mojkovac"
 MNT_idea_the_debt_of_mojkovac_desc:0 "A Serbian army crossed Albania alive because ours stood on the Tara. Belgrade acknowledges the debt warmly, and will settle it by taking the creditor."
 MNT_idea_brother_against_brother:0 "Brother Against Brother"
 MNT_idea_brother_against_brother_desc:0 "Greens and Whites are not parties, they are families. The quarrel is settled at weddings and funerals, and sometimes on the road between them."
 MNT_idea_no_depot_no_rear:0 "No Depot, No Rear"
 MNT_idea_no_depot_no_rear_desc:0 "Nothing to capture, nothing to besiege and nothing to supply. The gendarmerie cannot find the band, and the band cannot hold a village for a night."
 MNT_idea_the_ready_made_administration:0 "The Ready-Made Administration"
 MNT_idea_the_ready_made_administration_desc:0 "Offices, registers, a budget line and a set of civil servants, handed over rather than taken. It works from the first morning, and it owes its existence to a signature in Belgrade."
 MNT_idea_the_old_capital_emptied:0 "The Old Capital Emptied"
 MNT_idea_the_old_capital_emptied_desc:0 "Cetinje keeps the monastery, the legations and the graves. Everything that decides anything is now sixty kilometres downhill."
 MNT_the_petersburg_subvention_tt:0 "The Dowry rises by 12 and the Claim by 3. Opens the repeatable decision Renew the Petersburg Subvention."
 MNT_the_money_from_montana_tt:0 "The Dowry rises by 6 and the Claim not at all. Recruitable population falls by 8 percent, permanently."
 MNT_a_coin_of_our_own_tt:0 "A Treasury Paid Abroad softens into A Treasury Half Our Own."
 MNT_the_road_to_the_sea_tt:0 "Article Twenty-Nine of Berlin is not lifted. The port exists; warships remain forbidden."
 MNT_the_narrow_gauge_to_the_lake_tt:0 "The Dowry rises by 10 and the Claim by 6. The Antivari Concession cannot be removed before 1920."
 MNT_the_prince_of_the_black_mountain_tt:0 "Opens the ledger of the Dowry and the Claim, and places the three conditions the country begins in."
 MNT_the_saint_nicholas_constitution_tt:0 "The Claim rises by 4. An elected Skupstina opens the choice between the two parties."
 MNT_rule_as_before_tt:0 "No Skupstina. The Green branch can only be opened by conspiracy, and the Bomb Trials become unavoidable."
 MNT_a_daughter_on_the_throne_of_italy_tt:0 "Free, because it is already true. The Dowry rises by 8 and the Claim by 4, and Rome becomes a court of ours."
 MNT_the_clubmen_tt:0 "The Claim rises by 6. Legal opposition, at eight points of stability."
 MNT_the_true_peoples_party_tt:0 "Opens the Bomb Trials. Convicting installs A Verdict Belgrade Will Not Forget for the rest of the game."
 MNT_the_clubmen_take_the_house_tt:0 "Divergence. The Dowry falls by 20 for good and the Claim is set to 25. Serbia gains a peaceful annexation option from 1913."
 MNT_a_crown_for_the_jubilee_tt:0 "The principality becomes a kingdom, and the royal army is constituted. The Dowry rises by 4 and the Claim by 2."
 MNT_the_neutral_mountain_tt:0 "Divergence. The Claim falls by 25 and the army survives 1918 whole. No Entente power will deal with Montenegro again."
 MNT_the_assembly_decides_for_war_tt:0 "War with Austria-Hungary. Opens the allied loan, and the weekly Serbian payment that comes with it."
 MNT_the_crown_in_a_suitcase_tt:0 "The kingdom survives without territory. Its treasury is exactly the size of the Dowry that remains."
 MNT_the_balkan_league_tt:0 "War with the Ottoman Empire, alongside Serbia, Bulgaria and Greece."
 MNT_first_to_fire_tt:0 "The Claim rises by 6. Fifteen percent war support, and no combat bonus of any kind."
 MNT_the_walls_of_scutari_tt:0 "The Claim rises by 8. Three thousand men are lost permanently."
 MNT_we_do_not_leave_scutari_tt:0 "Divergence. Scutari stays Montenegrin. The Dowry falls by 25 and the Adriatic closes."
 MNT_the_treaty_of_london_tt:0 "The Claim rises by 10. The sandzak is annexed and the country roughly doubles."
 MNT_a_serbian_chief_of_staff_tt:0 "The Claim rises by 12, the largest single step in the mechanic. Serbian doctrine and Serbian equipment follow the general."
 MNT_hold_the_lovcen_tt:0 "Divergence. The Dowry falls by 30 as the allied loan stops, and the White side of the country does not forget."
 MNT_cover_the_retreat_tt:0 "The Claim rises by 20. Half the engaged force is lost permanently and the Lovcen falls within three weeks."
 MNT_the_green_lists_tt:0 "Divergence. The Claim falls by 15 and the tag survives 1918 holding its cores, at the price of an open quarrel."
 MNT_a_throne_without_a_protector_tt:0 "The Claim stops rising. The Dowry is capped at 20 for the rest of the game and no subvention is possible again."
 MNT_the_mandates_from_america_tt:0 "The Dowry rises by 8 and the Claim not at all. The source dries up on a date the player cannot move."
 MNT_the_christmas_rising_tt:0 "Open war with Serbia over the answer given at Podgorica."
 MNT_the_gaeta_declaration_tt:0 "The Claim rises by 8. Recruitment and equipment off Montenegrin soil, opening the repeatable decision Draw on Gaeta."
 MNT_the_army_of_gaeta_tt:0 "Divergence. The Claim rises by 30. The tag returns to the map owing everything to one creditor."
 MNT_the_komiti_of_the_highlands_tt:0 "No depot and no rear. Opens Accept the Amnesty: a small real gain, and a permanent cost."
 MNT_the_federalist_party_tt:0 "The legal and parliamentary road. The armed Green branch closes for the rest of the game."
 MNT_the_party_of_the_mountains_tt:0 "Opens the communist road, and the decision The Cell at Mitrovica, whose gain is small and whose repression is not."
 MNT_the_comintern_on_the_national_question_tt:0 "Montenegro stated as a distinct nation. Every parliamentary road closes."
 MNT_the_sporazum_and_the_others_tt:0 "A short window, held open by the Croatian precedent rather than by a date."
 MNT_a_banovina_of_our_own_tt:0 "Divergence. Montenegro exists administratively from 1939, and the partisan inheritance closes with it."
 MNT_the_petrovdan_crown_tt:0 "Divergence. A restored kingdom under Italian arms. The Claim rises by 15, and the rising fires at full strength regardless."
 MNT_the_thirteenth_of_july_tt:0 "A general rising, and war with Italy. Opens The Left Errors and The Winter in the Sandzak, neither of which pays."
 MNT_the_lovcen_brigade_tt:0 "The only recruiting ground left under a foreign-held throne. No compliance and no morale are gained."
 MNT_a_republic_of_our_own_tt:0 "Cores restored and a government of our own. The Claim does not fall by a single point."
 MNT_titograd_tt:0 "Infrastructure and industry in the plain, and a permanent ten percent off political adherence in the old capital's state."
 MNT_a_republic_among_six_tt:0 "The Claim is fixed at 95 and will never fall again. The title now belongs to a party."
 MNT_the_men_of_forty_eight_tt:0 "Opens The Bare Island. Filling the quota buys stability now and An Island of Our Own Making for ever."
 MNT_the_kingdom_that_endured_tt:0 "The Dowry reaches zero because the last court is gone. The state pays for itself, and answers to nobody."
