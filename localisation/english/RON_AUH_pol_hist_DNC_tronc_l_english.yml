l_english:

###############################################################################################################################
# Austria-Hungary - the constitutional trunk of the Dawn of a New Century era, 1900-1909.
# Lot L5b. 73 focus and 36 ideas. Every key below is new; none of them exists anywhere else in
# the loaded English localisation.
###############################################################################################################################

# --- ROOT ---------------------------------------------------------------------------------------

 AUHDNC_pol_the_dual_monarchy:0 "The Dual Monarchy"
 AUHDNC_pol_the_dual_monarchy_desc:0 "There is no Austro-Hungarian state. There are two states and a list of what they do together: foreign affairs, war, and the ministry that pays for both. It was drawn up in 1867 to be revised once."

# --- THE COMMON AFFAIRS -------------------------------------------------------------------------

 AUHDNC_pol_the_common_ministerial_council:0 "The Common Ministerial Council"
 AUHDNC_pol_the_common_ministerial_council_desc:0 "Three common ministers, two prime ministers, and since 1899 the heir, meeting at the Ballhausplatz with no constitutional existence at all. Somebody must be in the room when the two halves disagree, and the law provides for nobody."

 AUHDNC_pol_the_house_and_foreign_ministry:0 "The Ministry of the House and of Foreign Affairs"
 AUHDNC_pol_the_house_and_foreign_ministry_desc:0 "One man holds the household of the dynasty and the foreign policy of the realm. Goluchowski has had the post since 1895 and has made a doctrine of undertaking nothing."

 AUHDNC_pol_the_common_ministry_of_war:0 "The Common Ministry of War"
 AUHDNC_pol_the_common_ministry_of_war_desc:0 "The one ministry that spends in both halves and is loved in neither. It equips an army of eleven languages on the smallest budget per head in Europe, and justifies it twice."

 AUHDNC_pol_the_common_ministry_of_finance:0 "The Common Ministry of Finance"
 AUHDNC_pol_the_common_ministry_of_finance_desc:0 "It has no revenue of its own: it takes what the two treasuries send under the quota and pays the diplomats and the soldiers. By an accident of 1878 it also governs Bosnia."

 AUHDNC_pol_the_ministers_answerable_to_no_chamber:0 "Ministers Answerable to No Chamber"
 AUHDNC_pol_the_ministers_answerable_to_no_chamber_desc:0 "The three common ministers can be dismissed only by the sovereign. Since no chamber can turn them out, none has any interest in helping them, and both find it cheaper to attack them."

 AUHDNC_pol_the_common_citizenship_question:0 "The Question of Common Citizenship"
 AUHDNC_pol_the_common_citizenship_question_desc:0 "A subject of the Emperor and a subject of the King are two different persons in law, and the joint passport is a courtesy. Mending it would require both parliaments to admit there is one state."

 AUHDNC_pol_the_eleventh_article:0 "The Eleventh Article"
 AUHDNC_pol_the_eleventh_article_desc:0 "Article 11 of the Hungarian Law XII of 1867 reserves the language of the army to the King. Budapest calls it a concession lent to a monarch; Vienna calls it the last clause before two armies."

 AUHDNC_pol_the_eighty_words_of_command:0 "The Eighty Words of Command"
 AUHDNC_pol_the_eighty_words_of_command_desc:0 "Every soldier learns some eighty German words of command and no more, and the regiment does its business in whatever tongue a fifth of its men speak. The army holds together; the officer corps lives at the language board."

 AUHDNC_pol_the_language_of_the_regiment:0 "The Language of the Regiment"
 AUHDNC_pol_the_language_of_the_regiment_desc:0 "Let the service language follow the men rather than the officers. The recruits understand their orders at last, and an officer can be posted only where his own tongue is spoken."

 AUHDNC_pol_the_single_officer_corps:0 "The Single Officer Corps"
 AUHDNC_pol_the_single_officer_corps_desc:0 "One list of officers, one academy, one seniority, whatever was settled about the men. It is dear, it is resented in Budapest, and it makes the only k. u. k. men in the realm."

 AUHDNC_pol_the_reichsland_of_bosnia:0 "The Reichsland of Bosnia"
 AUHDNC_pol_the_reichsland_of_bosnia_desc:0 "Occupied in 1878 and administered ever since, belonging in law to neither half. The common finance ministry governs it with no diet, no franchise and no appeal."

 AUHDNC_pol_the_debt_of_before_1867:0 "The Debt of Before 1867"
 AUHDNC_pol_the_debt_of_before_1867_desc:0 "Hungary holds that the old debts were contracted by an Austria with no right to bind her, and pays a fixed contribution never revised. Vienna carries the difference in perpetuity."

# --- THE DELEGATIONS ----------------------------------------------------------------------------

 AUHDNC_pol_the_delegations_of_sixty:0 "The Delegations of Sixty"
 AUHDNC_pol_the_delegations_of_sixty_desc:0 "Sixty members from the Reichsrat, sixty from the Diet, voting the common estimates each year and never in the same room. They write to each other three times; if that fails they assemble and vote without debate."

 AUHDNC_pol_carry_the_estimates_by_the_crown:0 "Carry the Estimates by the Crown"
 AUHDNC_pol_carry_the_estimates_by_the_crown_desc:0 "Budapest is obstructing the common budget again; very well, it is carried on the authority of the sovereign. The counties will resolve that the levy is unlawful, and Budapest has learned that its consent was never needed."

 AUHDNC_pol_buy_the_estimates_from_budapest:0 "Buy the Estimates from Budapest"
 AUHDNC_pol_buy_the_estimates_from_budapest_desc:0 "Or one may simply pay. Budapest will vote the estimates and name its figure, a yard at Fiume or a point on the quota, and the figure is never the same twice and never goes down."

 AUHDNC_pol_the_exchange_of_nuntien:0 "The Exchange of Nuntien"
 AUHDNC_pol_the_exchange_of_nuntien_desc:0 "Three letters each way, carried across the Ring and read aloud where nobody from the other side is present. It makes agreement possible by making conversation impossible."

 AUHDNC_pol_the_alternating_seat:0 "The Alternating Seat"
 AUHDNC_pol_the_alternating_seat_desc:0 "One year in Vienna, the next in Budapest, because the year the rule is broken is the year the Monarchy is admitted to have a capital. The files travel by train each autumn."

 AUHDNC_pol_the_joint_sitting_without_debate:0 "The Joint Sitting Without Debate"
 AUHDNC_pol_the_joint_sitting_without_debate_desc:0 "When three written exchanges have failed, the hundred and twenty assemble and vote at once, with no speech and no amendment. It has never failed, because nobody wishes to see an unvoted budget."

 AUHDNC_pol_the_supreme_audit_office:0 "The Supreme Audit Office"
 AUHDNC_pol_the_supreme_audit_office_desc:0 "A joint court of accounts, reporting to both delegations and free to open the books of the war ministry. It is the only reason anyone outside the ministries knows what the common affairs cost."

 AUHDNC_pol_the_right_of_interpellation:0 "The Right of Interpellation"
 AUHDNC_pol_the_right_of_interpellation_desc:0 "A common minister cannot be voted out, but he can be made to stand at a rail and answer. Give the question a printed record, and both capitals will resent it equally."

 AUHDNC_pol_the_delegates_of_the_upper_houses:0 "The Delegates of the Upper Houses"
 AUHDNC_pol_the_delegates_of_the_upper_houses_desc:0 "A fifth of each delegation comes not from the elected chamber but from the house of lords of its half. Whichever way an election goes, those votes were appointed by the sovereign."

 AUHDNC_pol_the_credits_of_the_delegations:0 "The Credits of the Delegations"
 AUHDNC_pol_the_credits_of_the_delegations_desc:0 "Every battleship and every embassy is a separate credit, argued twice. The trick is to hang a Hungarian order on an Austrian ship, so that refusing costs the refuser."

 AUHDNC_pol_the_delegations_reformed:0 "The Delegations Reformed"
 AUHDNC_pol_the_delegations_reformed_desc:0 "A standing committee between sessions, an interpellation that must be answered, and a joint sitting that may debate. Both halves lose a veto they were promised in 1867."

# --- THE TERM -----------------------------------------------------------------------------------

 AUHDNC_pol_the_quota_deputations:0 "The Quota Deputations"
 AUHDNC_pol_the_quota_deputations_desc:0 "Two committees meet every ten years to settle what share of the common expenditure Hungary shall pay. It was thirty in the hundred in 1867 and has crept up at every renewal, because the deputations bargain rather than calculate."

 AUHDNC_pol_the_pauschalquote:0 "The Lump Quota"
 AUHDNC_pol_the_pauschalquote_desc:0 "Take the pre-1867 debt out of the percentage and settle it as a fixed sum, once and for good. The best term Budapest ever won is frozen beyond recall along with it."

 AUHDNC_pol_the_quota_of_1899:0 "The Quota of 1899"
 AUHDNC_pol_the_quota_of_1899_desc:0 "The deputations of 1897 failed and the arrangement was prorogued: the old percentage runs on until the parliaments can do better. The contract itself has already expired."

 AUHDNC_pol_the_quota_fixed_by_the_crown:0 "The Quota Fixed by the Crown"
 AUHDNC_pol_the_quota_fixed_by_the_crown_desc:0 "Where the deputations cannot agree, the monarch fixes the figure for one year at a time. It is lawful, and it teaches both sides that failing to agree costs them nothing and hands the blame to a man nobody may blame."

 AUHDNC_pol_the_customs_and_commercial_treaty:0 "The Customs and Commercial Treaty"
 AUHDNC_pol_the_customs_and_commercial_treaty_desc:0 "The single market of fifty million people, renewed by treaty every ten years since 1867 and falling due on the last day of 1907. Both halves are sure the other does better out of it."

 AUHDNC_pol_the_ischl_clause:0 "The Ischl Clause"
 AUHDNC_pol_the_ischl_clause_desc:0 "Agreed at Ischl in 1899: should the parliaments fail to renew the commercial union, it may be prorogued by ordinance on the Hungarian side. The Crown has strung a net beneath the tightrope, and everyone on the wire knows it."

 AUHDNC_pol_the_tariff_of_1906:0 "The Tariff of 1906"
 AUHDNC_pol_the_tariff_of_1906_desc:0 "Not one tariff enacted by one legislature but two identical tariffs enacted by two. A schedule that each half enacts for itself is a schedule that each half can amend for itself."

 AUHDNC_pol_the_deputations_are_summoned:0 "The Deputations Are Summoned"
 AUHDNC_pol_the_deputations_are_summoned_desc:0 "The term approaches, and the deputations and the commercial negotiators are called. Nothing that follows can be postponed: the treaty expires on the last day of 1907 whether Vienna is ready or not."

 AUHDNC_pol_the_settlement_of_1907:0 "The Settlement of 1907"
 AUHDNC_pol_the_settlement_of_1907_desc:0 "Renew for ten years, and pay for it in the wording: what is signed is no longer one customs territory but two that agree to raise no barrier. The union becomes a renewable contract instead of a constitutional fact."

 AUHDNC_pol_let_the_treaty_lapse:0 "Let the Treaty Lapse"
 AUHDNC_pol_let_the_treaty_lapse_desc:0 "Justh and the Independence Party have wanted a separate army, bank and tariff for twenty years. Let the term run out, govern by ordinance, and see which half first finds it cannot do without the other."

 AUHDNC_pol_the_customs_barrier_of_bohemia:0 "The Customs Barrier"
 AUHDNC_pol_the_customs_barrier_of_bohemia_desc:0 "The Bohemian manufacturers want a tariff wall across the Leitha rather than another year of pleading with Budapest. The industrial belt is protected outright, and Budapest is handed the separate tariff it has demanded since 1848."

 AUHDNC_pol_the_provisorium_by_ordinance:0 "The Provisional Regime"
 AUHDNC_pol_the_provisorium_by_ordinance_desc:0 "The estimates are carried by ordinance, year by year, while the settlement is in abeyance. A constitution that can be dispensed with for three years can be dispensed with for thirty."

 AUHDNC_pol_the_quota_raised_to_forty:0 "The Quota Raised to Forty"
 AUHDNC_pol_the_quota_raised_to_forty_desc:0 "The recruit contingent has stood at the figure of 1889 because the Diet will not vote another for an army it does not call its own. Let Budapest pay the larger share and the contingent is unfrozen; the counties will never forgive it."

 AUHDNC_pol_the_term_of_1917:0 "The Term of 1917"
 AUHDNC_pol_the_term_of_1917_desc:0 "The clock is wound again and the date entered in the almanacs: the last day of 1917. Whoever sits at the Ballhausplatz then will have this same afternoon to live through."

 AUHDNC_pol_the_separate_tariff_line:0 "The Separate Tariff Line"
 AUHDNC_pol_the_separate_tariff_line_desc:0 "Customs houses on the Leitha, at Pressburg, Marchegg and Bruck. Every wagon between the capitals is cleared twice, and the two halves share only a sovereign and a flag."

# --- THE TWO CHAMBERS ---------------------------------------------------------------------------

 AUHDNC_pol_the_two_parliaments_of_the_monarchy:0 "The Two Parliaments"
 AUHDNC_pol_the_two_parliaments_of_the_monarchy_desc:0 "The Reichsrat and the Diet are the two parties to the contract, and neither binds the other by so much as a comma. Everything of substance passes twice, by majorities that share no interest but the fear of being blamed."

 AUHDNC_pol_the_closure_of_debate:0 "The Closure of Debate"
 AUHDNC_pol_the_closure_of_debate_desc:0 "A determined minority can talk out an empire, and since 1897 it has. Give the chair the guillotine and a fixed hour for the division; Tisza did precisely that at Budapest in 1904, and his chamber was wrecked six weeks later."

 AUHDNC_pol_the_right_of_unlimited_speech:0 "The Right of Unlimited Speech"
 AUHDNC_pol_the_right_of_unlimited_speech_desc:0 "Leave the rules alone. A deputy may speak for as long as he can stand, and the budget of a great power waits on any eleven men who can stay awake."

 AUHDNC_pol_the_statistics_of_the_realm:0 "The Statistics of the Realm"
 AUHDNC_pol_the_statistics_of_the_realm_desc:0 "The census is not an inventory but a constitutional instrument: schools, curias and court languages all follow from the count. The only question that matters is what the enumerator is told to ask."

 AUHDNC_pol_the_language_of_daily_use:0 "The Language of Daily Use"
 AUHDNC_pol_the_language_of_daily_use_desc:0 "Ask a man what tongue he uses at his work, and the servant answers in his master's. The two ruling registers swell, and four peoples know exactly how the arithmetic was done."

 AUHDNC_pol_the_mother_tongue_registered:0 "The Mother Tongue Registered"
 AUHDNC_pol_the_mother_tongue_registered_desc:0 "Ask instead what tongue his mother taught him, as the law of nationalities of 1868 always implied. Four registers grow overnight, and the German and Magyar positions in the mixed districts go with them."

 AUHDNC_pol_the_order_of_business:0 "The Order of Business"
 AUHDNC_pol_the_order_of_business_desc:0 "However the argument about the rules was settled, they must now be written down and lived with. The standing orders are the dullest page in a constitution and the most read."

 AUHDNC_pol_the_diet_and_the_recruit_bill:0 "The Diet and the Recruit Bill"
 AUHDNC_pol_the_diet_and_the_recruit_bill_desc:0 "The contingent of recruits is voted for ten years at a time and has not moved since 1889, while the population has passed fifty millions. The Diet knows what it holds."

 AUHDNC_pol_the_crown_and_the_dissolution:0 "The Crown and the Dissolution"
 AUHDNC_pol_the_crown_and_the_dissolution_desc:0 "The sovereign may prorogue either chamber, dissolve it, or decline to summon it, and a government may legislate by ordinance while it is not sitting. It makes the settlement workable and needless at once."

 AUHDNC_pol_the_year_without_a_budget:0 "The Year Without a Budget"
 AUHDNC_pol_the_year_without_a_budget_desc:0 "The estimates have not passed. The taxes are collected and the recruits called on last year's authority, and the state discovers that it can run for a year on habit alone."

 AUHDNC_pol_the_upper_house_of_the_empire:0 "The Upper Houses"
 AUHDNC_pol_the_upper_house_of_the_empire_desc:0 "The Herrenhaus in Vienna and the House of Magnates in Budapest: archdukes, prelates, peers and men appointed for life. No reform of the lower house is final until they are persuaded, bought or enlarged."

 AUHDNC_pol_flood_the_upper_house:0 "A Creation of Peers"
 AUHDNC_pol_flood_the_upper_house_desc:0 "The peers will not have the bill; then let there be more peers, enough appointed in one morning to carry the division by daylight. Beck threatened it to force the franchise through in 1906, and an argument once shown can be counted."

 AUHDNC_pol_the_national_clubs_recognised:0 "The National Clubs Recognised"
 AUHDNC_pol_the_national_clubs_recognised_desc:0 "The chamber divides by nation and not by party, and the standing orders should say so: speaking time and committee seats for the Polish, Czech, Ruthene and South Slav clubs. There is no longer any such thing as an imperial majority."

 AUHDNC_pol_the_chamber_of_the_empire:0 "The Chamber of the Empire"
 AUHDNC_pol_the_chamber_of_the_empire_desc:0 "Refuse to recognise them: the house sits by party, and a deputy from Lemberg is a deputy of the Empire before he is a Pole. There is a majority again, and eleven nations have been called a procedural inconvenience."

# --- THE CROWN ----------------------------------------------------------------------------------

 AUHDNC_pol_the_prerogatives_of_the_crown:0 "The Prerogatives of the Crown"
 AUHDNC_pol_the_prerogatives_of_the_crown_desc:0 "Every question the negotiators of 1867 could not settle was left to the sovereign: the army, foreign policy, the common ministers, the summoning of both parliaments. They are the sinew of the Monarchy, and they depend on one man being alive."

 AUHDNC_pol_the_pragmatic_sanction:0 "The Pragmatic Sanction"
 AUHDNC_pol_the_pragmatic_sanction_desc:0 "The act of 1713, accepted by the Hungarian Diet in 1723, by which the lands of the House are held indivisibly by one heir. It is the only document both capitals concede to be binding."

 AUHDNC_pol_the_kabinettskanzlei:0 "The Cabinet Chancellery"
 AUHDNC_pol_the_kabinettskanzlei_desc:0 "The sovereign's own office: a handful of men who read everything, minute everything and sign nothing. Every paper of consequence in either half crosses their desks twice."

 AUHDNC_pol_the_supreme_war_lord:0 "The Supreme War Lord"
 AUHDNC_pol_the_supreme_war_lord_desc:0 "The army is not an organ of the state but the sovereign's own, and the oath is sworn to him. That is why no parliament has taken it away, and why none has felt obliged to pay for it."

 AUHDNC_pol_the_pre_sanction:0 "The Pre-Sanction"
 AUHDNC_pol_the_pre_sanction_desc:0 "No bill touching the common affairs reaches a chamber until the sovereign has permitted it. It is not a veto, which must be exercised in public, but the quieter thing: the bill that is never tabled."

 AUHDNC_pol_the_right_of_nomination:0 "The Right of Nomination"
 AUHDNC_pol_the_right_of_nomination_desc:0 "The common ministers are named by the sovereign and by nobody else, as are the two prime ministers and the ban of Croatia. It is how a state with two parliaments contrives to have one policy."

 AUHDNC_pol_the_family_statute:0 "The Family Statute"
 AUHDNC_pol_the_family_statute_desc:0 "The house law of the Habsburgs is unpublished, is not justiciable, and governs some seventy archdukes. When it collides with the succession to two thrones, the family law wins."

 AUHDNC_pol_the_fifty_second_year_of_the_reign:0 "The Fifty-Second Year of the Reign"
 AUHDNC_pol_the_fifty_second_year_of_the_reign_desc:0 "Franz Joseph came to the throne in December 1848 and is now seventy. Every quarrel in the Monarchy is deferred until after him, and nobody is permitted to say so aloud."

 AUHDNC_pol_the_act_of_renunciation:0 "The Act of Renunciation"
 AUHDNC_pol_the_act_of_renunciation_desc:0 "On 28 June 1900, before the archdukes and the primates of both realms, the heir swore that the children of his marriage should have no right to the throne. He married Sophie Chotek three days later."

 AUHDNC_pol_the_two_courts:0 "The Two Courts"
 AUHDNC_pol_the_two_courts_desc:0 "The Hofburg decides; the Belvedere waits, and while it waits it collects files. Officials answer the Belvedere with a care they never give a ministry, because ministries change and heirs do not."

 AUHDNC_pol_recall_the_heir_to_the_hofburg:0 "Recall the Heir to the Hofburg"
 AUHDNC_pol_recall_the_heir_to_the_hofburg_desc:0 "Bring the heir inside the Hofburg, fold his military chancellery into the sovereign's own, and let there be one address in Vienna again. The Croats and Romanians who hoped somebody at the top was theirs are told otherwise."

 AUHDNC_pol_let_the_belvedere_govern:0 "Let the Belvedere Govern"
 AUHDNC_pol_let_the_belvedere_govern_desc:0 "Recognise the military chancellery for what it has been since Brosch took it in 1906: a government in waiting, with a draft programme and a file on every governor. Every Magyar in public life now counts the Emperor's years."

# --- THE REFORM OF THE WHOLE --------------------------------------------------------------------

 AUHDNC_pol_the_popovici_memorandum:0 "The Popovici Memorandum"
 AUHDNC_pol_the_popovici_memorandum_desc:0 "Aurel Popovici, a Romanian of the Banat close to the Belvedere, published at Leipzig in 1906 a map of the United States of Greater Austria: fifteen units drawn by language."

 AUHDNC_pol_the_fifteen_lands:0 "The Fifteen Lands"
 AUHDNC_pol_the_fifteen_lands_desc:0 "Take the map seriously and do the work: draw the boundaries, count the villages, settle Trieste and the Szekler counties. It is a decade of surveying before a single diet meets."

 AUHDNC_pol_the_third_crown_examined:0 "The Third Crown Examined"
 AUHDNC_pol_the_third_crown_examined_desc:0 "Not fifteen lands but a third kingdom: Croatia, Dalmatia, Slavonia and Bosnia under the crown of Zvonimir, beside Austria and Hungary as an equal. The Fiume resolution of 1905 went to Budapest because Vienna would not bid."

 AUHDNC_pol_reform_by_agreement:0 "Reform by Agreement"
 AUHDNC_pol_reform_by_agreement_desc:0 "Both parliaments, both governments and the fifteen diets, at two thirds in every one of them. Nothing carried this way can be undone, and nothing can be carried quickly."

 AUHDNC_pol_reform_by_octroi:0 "Reform by Patent"
 AUHDNC_pol_reform_by_octroi_desc:0 "The way the military chancellery actually drafted: a patent read from the throne in the first week of a new reign, the Hungarian constitution suspended, and the army standing behind the reader."

 AUHDNC_pol_the_constitutional_court_of_the_empire:0 "A Court for the Constitution"
 AUHDNC_pol_the_constitutional_court_of_the_empire_desc:0 "Forty years late, a court competent to decide which half a question belongs to. It is the first body in the realm with standing to tell the Crown that it is wrong."

 AUHDNC_pol_the_charter_of_the_peoples:0 "The Charter of the Peoples"
 AUHDNC_pol_the_charter_of_the_peoples_desc:0 "Fifteen lands, each with its diet, its language of office and its school board, and above them a court, an army and a crown. Nothing anywhere can be decided until fifteen assemblies have been asked."

 AUHDNC_pol_the_indivisible_realm:0 "Indivisibiliter ac Inseparabiliter"
 AUHDNC_pol_the_indivisible_realm_desc:0 "One realm, proclaimed by patent and held by the common army: one budget, one tariff, one language of command, one parliament. The Monarchy will garrison itself for ever."

###############################################################################################################################
# IDEAS
###############################################################################################################################

 AUH_the_common_affairs:0 "The Common Affairs"
 AUH_the_common_affairs_desc:0 "Foreign affairs, war, and the ministry that pays for both. It is the whole of what the Monarchy still does as one country, and every crown of it is voted twice, in two cities."

 AUH_the_ministers_of_no_chamber:0 "Ministers of No Chamber"
 AUH_the_ministers_of_no_chamber_desc:0 "The three k. u. k. ministers can be dismissed by the sovereign and by nobody else. They are free of every parliamentary consideration and friendless in both parliaments."

 AUH_two_subjecthoods:0 "Two Subjecthoods"
 AUH_two_subjecthoods_desc:0 "There is no Austro-Hungarian citizenship, only an Austrian subject and a Hungarian subject; the passport that says otherwise is a courtesy. The two civil services do not interchange."

 AUH_the_eleventh_article:0 "The Eleventh Article"
 AUH_the_eleventh_article_desc:0 "Six words in a Hungarian statute of 1867 reserve the language of the army to the King. The Crown wins the argument every time it is made, and pays in men it may not enlist."

 AUH_the_eighty_words_of_command:0 "The Eighty Words of Command"
 AUH_the_eighty_words_of_command_desc:0 "German for the commands, the regimental tongue for the rest, and three years for an officer to learn whichever of the eleven he has drawn. It holds the army together and costs it the hours spent at the language board."

 AUH_the_language_of_the_regiment:0 "The Language of the Regiment"
 AUH_the_language_of_the_regiment_desc:0 "The service language follows the men. The recruits understand their orders at last, and an officer can be posted only where his own tongue is spoken."

 AUH_the_single_officer_corps:0 "The Single Officer Corps"
 AUH_the_single_officer_corps_desc:0 "One list, one academy, one seniority, whatever was settled about the men. They are the only body here who give their nationality as imperial and royal, and the dearest establishment of the realm."

 AUH_the_reichsland_statute:0 "The Reichsland Statute"
 AUH_the_reichsland_statute_desc:0 "Bosnia is governed by the common finance ministry, which was made to fund two ministries and now administers a province. No diet, no franchise, and therefore no obstruction."

 AUH_the_debt_of_before_1867:0 "The Debt of Before 1867"
 AUH_the_debt_of_before_1867_desc:0 "Hungary pays a fixed contribution towards the old debt and not a florin more. Vienna carries the rest in perpetuity, and holds the better credit because the bankers know who pays."

 AUH_the_estimates_by_the_crown:0 "The Estimates by the Crown"
 AUH_the_estimates_by_the_crown_desc:0 "The common budget is carried on the sovereign's authority over Budapest's objection. The money arrives, and so do the county resolutions declaring the levy unlawful."

 AUH_the_price_of_budapests_vote:0 "The Price of Budapest's Vote"
 AUH_the_price_of_budapests_vote_desc:0 "The estimates are bought rather than imposed: a yard at Fiume, a share of the artillery orders, a point on the quota. The figure is never the same twice and has never once gone down."

 AUH_the_delegations_reformed:0 "The Delegations Reformed"
 AUH_the_delegations_reformed_desc:0 "A standing committee, an interpellation that must be answered, and a joint sitting that may debate. Both halves have surrendered a veto they were promised in 1867."

 AUH_the_pauschalquote:0 "The Lump Quota"
 AUH_the_pauschalquote_desc:0 "The pre-1867 debt leaves the percentage and is settled as a fixed sum. The largest item of dispute leaves the deputations, and Budapest's best term is frozen beyond recall."

 AUH_the_quota_by_ordinance:0 "The Quota by Ordinance"
 AUH_the_quota_by_ordinance_desc:0 "When the deputations fail, the monarch fixes the figure a year at a time. It teaches both of them that failing to agree costs nothing at all."

 AUH_the_ischl_clause:0 "The Ischl Clause"
 AUH_the_ischl_clause_desc:0 "If the parliaments cannot renew the commercial union, it may be prorogued by ordinance. The Crown has strung a net beneath the tightrope, and everyone on the wire walks accordingly."

 AUH_the_autonomous_tariff:0 "The Autonomous Tariff"
 AUH_the_autonomous_tariff_desc:0 "Two tariff schedules, enacted separately, word for word the same. The trade goes on as before; the law it goes on under is now two laws, either amendable by one party alone."

 AUH_the_ordinance_budget:0 "The Ordinance Budget"
 AUH_the_ordinance_budget_desc:0 "The common estimates carried by decree while the settlement is in abeyance. The longer it lasts the more ordinary it looks, and what is dispensed with for three years can be dispensed with for thirty."

 AUH_the_customs_barrier:0 "The Customs Barrier"
 AUH_the_customs_barrier_desc:0 "The Bohemian manufacturers have their wall against Hungarian grain, and the largest free market in central Europe ends with it. The Hungarian landowner discovers Hamburg instead."

 AUH_the_separate_tariff_line:0 "The Separate Tariff Line"
 AUH_the_separate_tariff_line_desc:0 "Customs houses at Pressburg, Marchegg and Bruck. Every wagon between the capitals is cleared twice, and the two halves are foreign countries that share a sovereign and a flag."

 AUH_the_closure_of_debate:0 "The Closure of Debate"
 AUH_the_closure_of_debate_desc:0 "The guillotine, a fixed hour for the division, and a chair who counts a standing vote as he judges it. The chamber can legislate again, and every party has learned that the rules are a weapon."

 AUH_the_right_of_unlimited_speech:0 "The Right of Unlimited Speech"
 AUH_the_right_of_unlimited_speech_desc:0 "No minority is ever gagged by a procedural trick, and the chamber keeps the authority Budapest has thrown away. The budget waits on any eleven deputies who can stay on their feet."

 AUH_the_language_of_daily_use:0 "The Language of Daily Use"
 AUH_the_language_of_daily_use_desc:0 "The census counts the servant and the clerk in the language of the man who employs them. The two ruling registers swell, and four peoples know how the arithmetic was done."

 AUH_the_mother_tongue_register:0 "The Mother Tongue Register"
 AUH_the_mother_tongue_register_desc:0 "The census asks after the mother tongue instead. Four registers grow overnight, and the school estimates of both halves rise before a classroom is built."

 AUH_the_creation_of_peers:0 "A Creation of Peers"
 AUH_the_creation_of_peers_desc:0 "Enough new lords appointed in one morning to carry the division by daylight. It is the last unanswerable argument the Crown has, and it lasts until somebody counts it."

 AUH_the_national_clubs:0 "The National Clubs"
 AUH_the_national_clubs_desc:0 "Speaking time, committee seats and a right of consultation for the Polish, Czech, Ruthene and South Slav clubs. There is no longer any such thing as an imperial majority."

 AUH_the_chamber_of_the_empire:0 "The Chamber of the Empire"
 AUH_the_chamber_of_the_empire_desc:0 "The clubs have no standing and the house sits by party. There is a government majority again, and eleven nations have been called a procedural inconvenience."

 AUH_the_supreme_war_lord:0 "The Supreme War Lord"
 AUH_the_supreme_war_lord_desc:0 "The army is the sovereign's own and the oath is sworn to him. No parliament has ever taken it away, and none has ever felt obliged to pay for it properly."

 AUH_the_pre_sanction:0 "The Pre-Sanction"
 AUH_the_pre_sanction_desc:0 "No bill touching the common affairs reaches a chamber until the sovereign has permitted it. Nothing unwelcome is ever tabled, and nothing unwelcome is therefore ever settled."

 AUH_the_two_courts:0 "The Two Courts"
 AUH_the_two_courts_desc:0 "The Hofburg decides and the Belvedere waits. Officials answer the Belvedere with a care they do not give a ministry, because ministries change and heirs do not."

 AUH_the_heir_recalled:0 "The Heir Recalled"
 AUH_the_heir_recalled_desc:0 "One address in Vienna again. The officials know whom they serve, and the only office in the capital that was planning for the next reign has been folded up and put away."

 AUH_the_belvedere_governs:0 "The Belvedere Governs"
 AUH_the_belvedere_governs_desc:0 "The heir's military chancellery is recognised for what it has been since 1906: a government in waiting. The peoples of the south take heart; every Magyar counts the Emperor's years."

 AUH_reform_by_agreement:0 "Reform by Agreement"
 AUH_reform_by_agreement_desc:0 "Both parliaments, both governments and the fifteen diets, at two thirds in every one of them. Nothing carried this way can be undone, and nothing can be carried quickly either."

 AUH_the_octroi:0 "Reform by Patent"
 AUH_the_octroi_desc:0 "A patent read from the throne, a ministry of officials, and the army standing behind the reader. The reform is done in an afternoon, and so is the worth of a signature here."

 AUH_the_constitutional_court:0 "A Court for the Constitution"
 AUH_the_constitutional_court_desc:0 "Competent to decide which half a question belongs to, and to say so against the government of either. It is the first body with standing to tell the Crown that it is wrong."

 AUH_the_charter_of_the_peoples:0 "The Charter of the Peoples"
 AUH_the_charter_of_the_peoples_desc:0 "Fifteen lands with their diets and their school boards, and above them a court, an army and a crown. Nothing anywhere can be decided until fifteen assemblies have been asked."

 AUH_the_indivisible_realm:0 "Indivisibiliter ac Inseparabiliter"
 AUH_the_indivisible_realm_desc:0 "One budget, one tariff, one language of command, one parliament, and the two ancient constitutions folded into them. The Monarchy will garrison itself against its own peoples."
