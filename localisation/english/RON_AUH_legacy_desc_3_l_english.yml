l_english:
 AUHDNC_stay_neutral_desc:0 "The Monarchy borders eight states and has a quarrel with most of them. Standing out of other men's wars is not timidity when the army needs a decade and the Compromise expires before that."
 AUHDNC_our_role_desc:0 "A power holding eleven nationalities cannot pretend the Balkans are somebody else's business. Deciding now what the Monarchy will actually fight for beats another decade of waiting to be asked."
 AUHDNC_prepare_for_the_worst_desc:0 "The war plans assume Russia needs six weeks to mobilise and that Serbia can be finished before then. Neither assumption has been tested, and the depots are stocked as though both were certain."
 AUHDNC_acquire_weapons_desc:0 "Steyr and the Budapest arsenal cannot fill the depots at the rate the mobilisation tables assume. A new works, and orders placed before the delegations argue over the bill again."
 AUHDNC_extend_the_conscription_desc:0 "Barely a fifth of each year's cohort is actually called up, because Hungary blocks any rise in the recruit contingent without concessions on the army's language. Paying that price fills the ranks."
 AUHDNC_proper_military_training_desc:0 "Reservists are called up for a few weeks and spend most of it on parade drill. Longer manoeuvres against a thinking opponent cost the harvest some hands and return soldiers instead of recruits."
 AUHDNC_appeasement_policy_desc:0 "The Monarchy has no quarrel it can win alone. Berlin, London, Paris and St Petersburg all keep embassies in Vienna, and a foreign minister who offends none of them buys the years the army needs."
 AUHDNC_league_of_armed_neutrality_desc:0 "Armed neutrality has precedent: the Baltic powers twice formed leagues of that name against British search of neutral shipping. A bloc that refuses to choose sides needs a sponsor, and Vienna can be it."
 AUHDNC_deterrence_desc:0 "Conrad wants a preventive war against Serbia and Italy; the Emperor does not. An army visibly ready and plainly not marching is the argument the foreign ministry would rather make."
 AUHDNC_fortification_effort_desc:0 "Przemysl and Krakow guard Galicia and the Tyrol has its forts facing Italy, but the ground between is open. Concrete along the frontier is slow and dull, and it buys mobilisation its first fortnight."
 AUHDNC_home_defense_desc:0 "The Landsturm exists on paper for men past their landwehr years, with rifles in district depots and no training. Formed into real divisions they garrison the interior so the field army need not."
 AUHDNC_why_we_fight_desc:0 "A conscript from Bukovina and one from the Tyrol share a uniform, a drill book and eighty words of German. Telling them plainly what the Monarchy is for is harder than teaching them to march."
 AUHDNC_the_best_defense_is_a_good_offense_desc:0 "Conrad has argued since taking the General Staff in 1906 that the Monarchy must strike first or be struck. The compromise is an army built to attack, held on the frontier, and not yet let loose."
 AUHDNC_improve_relations_with_germany_desc:0 "The Dual Alliance of 1879 binds Vienna to Berlin against Russia and has been renewed without much argument since. Making it warm rather than merely signed costs little while Russia rearms."
 AUHDNC_oppose_german_ambitions_desc:0 "Berlin treats the alliance of 1879 as a junior partnership and expects Vienna to follow its Balkan and naval policy. Refusing costs the Monarchy its only certain friend and buys back its own foreign policy."
 AUHDNC_improve_relations_with_france_desc:0 "Vienna and Paris share no border and no territorial quarrel. The obstacle is the alliance with Berlin, and French bankers have financed Habsburg railways and ironworks regardless of it."
 AUHDNC_oppose_french_ambitions_desc:0 "France is Russia's creditor and Russia's ally, and every franc lent in St Petersburg pays for railways pointed at Galicia. Obstructing Paris slows the mobilisation Vienna most fears."
 AUHDNC_condemn_the_boxers_desc:0 "Marines from the cruiser Zenta helped hold the legation quarter at Peking through the summer of 1900. Saying plainly who besieged them costs nothing and keeps the Monarchy inside the concert of powers."
 AUHDNC_smuggle_weapons_to_legations_desc:0 "The legations were cut off in June 1900 with a few hundred defenders and one old gun patched together from scrap. Rifles and cartridges are worth more to them than any protest note delivered in Peking."
 AUHDNC_smuggle_a_military_advisor_to_legations_desc:0 "An officer who has watched a siege from the inside is worth a shelf of manuals. Getting him through the Boxer lines and into the legation quarter is a matter of money and a Chinese coat."
 AUHDNC_sanction_china_desc:0 "The Monarchy signed the Boxer Protocol in 1901 alongside the other powers and was assigned its share of the indemnity. Pressing Peking for payment is thankless, and not pressing looks like weakness."
 AUHDNC_sell_weapons_to_both_sides_desc:0 "Steyr sells rifles wherever they are paid for, and the crates carry no foreign ministry stamp. Arming the court and the rising at once keeps the trade open whichever of them survives the year."
 AUHDNC_negotiations_with_britain_desc:0 "London has no quarrel with Vienna and every quarrel with Berlin. An understanding that keeps the Royal Navy indifferent to the Adriatic is worth more than the ships the delegations will not fund."
 AUHDNC_north_america_desc:0 "Austria-Hungary holds no fleet base beyond the Adriatic and no coaling station anywhere. Any American design begins with the sober admission that Trieste is a very long way from the Gulf."
 AUHDNC_a_habsburg_on_the_mexican_throne_desc:0 "Maximilian, the Emperor's own brother, took the Mexican crown in 1864 and was shot at Queretaro three years later. Vienna never formally renounced the claim, and Mexico is short of friends."
 AUHDNC_viceroyalty_of_new_spain_desc:0 "New Spain ran from Mexico down to Costa Rica under a viceroy answering to Madrid, and the Habsburgs held that crown for two centuries. The republics that replaced it have quarrelled since 1838."
 AUHDNC_ultimatum_to_america_desc:0 "Washington has invoked the Monroe Doctrine against European crowns since 1823 and enforced it on Maximilian in 1867. Testing it again means measuring the Atlantic against the Adriatic fleet."
 AUHDNC_balkan_membership_desc:0 "Bulgaria, Greece and Albania lie between Vienna and Constantinople with no protector they trust. One bloc is cheaper than garrisoning the Balkans, and it shuts Russia out of Sofia."
 AUHDNC_friendship_with_greece_desc:0 "Athens wants Macedonia and Crete and fears Bulgaria more than it fears Vienna. A friendly Greece keeps the Aegean end of the Balkans out of Russian hands without a single Habsburg garrison."
 AUHDNC_expell_the_ottomans_from_europe_desc:0 "The Ottomans still hold Macedonia, Albania and Thrace, and the reform scheme agreed at Murzsteg in 1903 has settled nothing. Driving them past the straits leaves Vienna to decide who inherits."
 AUHDNC_annex_romania_desc:0 "Three million Romanians live in Transylvania under Hungarian county government, and Bucharest has never stopped counting them. Taking the kingdom outright settles that argument the other way."
 AUHDNC_dismantle_italy_desc:0 "Lombardy went in 1859 and Venetia in 1866, and Italian maps still print Trieste and the Trentino as theirs. The kingdom is barely forty years old and was assembled from states that could be states again."
 AUHDNC_secret_negotiations_with_the_vatican_desc:0 "The Pope has refused to leave the Vatican since 1870 and recognises no kingdom in Rome. Franz Joseph used the imperial veto in the conclave of 1903, so Vienna knows the way into those rooms."
 AUHDNC_we_dont_need_the_pope_desc:0 "Joseph II dissolved the contemplative monasteries and made bishops into state officials, and Rome has never quite forgiven it. Vienna can act in Italy without the Curia's blessing, as it has before."
 AUHDNC_send_weapons_to_separatists_desc:0 "The south was taken by Garibaldi's thousand in 1860 and governed from Turin ever since, badly. Bourbon loyalists are still to be found, and rifles landed quietly cost less than an army corps."
 AUHDNC_execute_italian_breakup_desc:0 "The separatists have their weapons and their contacts in the south. Once the rising starts Vienna either backs it openly or watches it collapse and sees the men it armed hanged."
 AUHDNC_victory_over_italy_desc:0 "Custoza was won in 1866 and Venetia was lost anyway, at the negotiating table. Settling with Italy on the ground this time answers forty years of maps printed in Rome with Trieste inside the border."
