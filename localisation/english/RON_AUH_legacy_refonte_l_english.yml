###############################################################################################################################
# Austria-Hungary - the spirits and named modifiers of the legacy tree.
# Companion to common/national_focus/RON_Austria_Hungary.txt
# and common/ideas/RON_AUH_legacy_refonte_ideas.txt.
###############################################################################################################################

# --- the spirits the legacy focuses now install ------------------------------

 AUH_lgc_the_export_order_book:0 "The Export Order Book"
 AUH_lgc_the_export_order_book_desc:0 "Belgrade ordered its guns from Creusot within six months of Peter's accession, on a French loan paid in pigs. The plants stay hot on foreign orders, and the men they arm are the ones the tariff made hostile."

 AUH_lgc_the_atlantic_station:0 "The Atlantic Station"
 AUH_lgc_the_atlantic_station_desc:0 "Montecuccoli laid down the first two dreadnoughts in 1910 against thirty-two million crowns he pledged himself, before any vote. Coaling stations come out of the same common budget the army eats from."

 AUH_lgc_the_tientsin_concession:0 "The Tientsin Concession"
 AUH_lgc_the_tientsin_concession_desc:0 "A few streets of warehouses, reached by a mail line that lives on subsidy and postal contract. Two parliaments vote the money every year, and neither electorate can find the place on a map."

 AUH_lgc_the_emptying_countryside:0 "The Emptying Countryside"
 AUH_lgc_the_emptying_countryside_desc:0 "Bremen and Hamburg shipped 62,605 subjects overseas in 1900, against 7,626 in 1876. The money returns as postal orders and buys land at the village. The men do not return, and the recruiting district still counts them."

 AUH_lgc_the_tegetthoff_programme:0 "The Tegetthoff Programme"
 AUH_lgc_the_tegetthoff_programme_desc:0 "Montecuccoli pledged thirty-two million crowns on his own responsibility in 1910 so the first two dreadnoughts could be laid down before any vote. Trieste and Skoda began the work at their own expense and sent the bill afterwards."

 AUH_lgc_the_accident_fund:0 "The Accident Fund"
 AUH_lgc_the_accident_fund_desc:0 "Hungarian law brings farm servants and day labourers into accident cover and makes the employer liable for the contributions. The fund is run by the same men who own the land, and the harvest is still no time to strike."

 AUH_lgc_the_quota_settled:0 "The Quota Settled"
 AUH_lgc_the_quota_settled_desc:0 "Own revenue and customs come off first, two per cent is charged to Hungary for the Military Frontier, and the rest is split. The share went from 30 per cent in 1867 to 36.4 in 1907, and never once the other way."

 AUH_lgc_the_kriegsleistungsgesetz:0 "The War Services Act"
 AUH_lgc_the_kriegsleistungsgesetz_desc:0 "RGBl 236/1912 lets the ministry requisition goods, firms and labour and put a factory under military discipline. Voted in full peace, twenty months before anyone needed it. No parliament takes the keys back before 1917."

 AUH_lgc_the_grip_eased:0 "The Grip Eased"
 AUH_lgc_the_grip_eased_desc:0 "A militarised works is run by officers and the man at the lathe may not leave it for better pay. Wiener Neustadt struck over the flour ration in January 1918 and the strike ran to Cattaro before the month was out."

 AUH_lgc_the_pilsen_ledger:0 "The Pilsen Ledger"
 AUH_lgc_the_pilsen_ledger_desc:0 "Skoda at Pilsen, the steel of Witkowitz and Resita: real middle-power industry, with no coal on the German scale behind it. The directors wring more out of the same plant, and the ministries rarely ask how."

# --- named modifiers and tooltips --------------------------------------------

 AUH_lgc_kriegsschule_staff_ride:0 "Kriegsschule Staff Ride"

 AUH_lgc_contingent_raised_tt:0 "The annual recruit contingent has stood at 103,000 men since the military law of 1889. Every rise since has been bought from Budapest."

 AUH_lgc_atlantic_claim:0 "Austrian Claims in the Americas"

 AUH_lgc_tientsin_claim:0 "Austrian Ambitions in the East"
