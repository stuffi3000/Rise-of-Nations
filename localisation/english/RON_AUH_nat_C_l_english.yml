###############################################################################################################################
# Austria-Hungary - Slovaks, Romanians, Bosnians, Italians
###############################################################################################################################


# =============================================================================================
# SLOVAKS - the Slovak National Party, x 110-113
# =============================================================================================

 AUHNAT_SLO_the_slovak_national_party:0 "The Slovak National Party"
 AUHNAT_SLO_the_slovak_national_party_desc:0 "Two million Slovaks in the northern counties send seven deputies to Budapest, and the party that speaks for them is edited from Martin rather than organised. It is a hole in the floor of the Hungarian state."

 AUHNAT_SLO_the_lex_apponyi:0 "The Lex Apponyi"
 AUHNAT_SLO_the_lex_apponyi_desc:0 "Count Apponyi's school acts of 1907 make the state subsidy conditional on children fluent in Hungarian. Confessional schools comply or close, and the villages return a conscript who reads no manual at all."

 AUHNAT_SLO_the_martin_memorandum:0 "Hear the Memorandum of Martin"
 AUHNAT_SLO_the_martin_memorandum_desc:0 "The party asks only what the Nationalities Law of 1868 already promises: the language in the courts and the schools. It costs the Crown nothing countable and Budapest the free hand of its counties."

 AUHNAT_SLO_leave_it_to_budapest:0 "Leave It to Budapest"
 AUHNAT_SLO_leave_it_to_budapest_desc:0 "The Uplands are an internal affair of the Kingdom of Hungary, and the Compromise says so. Vienna gains a grateful ministry for the price of a file left unopened."

 AUHNAT_SLO_magyarise_the_uplands:0 "Magyarise the Uplands"
 AUHNAT_SLO_magyarise_the_uplands_desc:0 "Hungarian in the schools, on the station signs and in every county office from Pozsony to Kassa. Within a generation the market towns are Hungarian and the countryside is only silenced."

 AUHNAT_SLO_reopen_matica_slovenska:0 "Reopen the Matica Slovenska"
 AUHNAT_SLO_reopen_matica_slovenska_desc:0 "The Slovak cultural society was dissolved in 1875 on the ground that a Slovak nation did not exist. Reopening it in Martin costs a building, and Budapest a doctrine of thirty years."

 AUHNAT_SLO_the_hlasist_generation:0 "The Hlasist Generation"
 AUHNAT_SLO_the_hlasist_generation_desc:0 "Vavro Srobar and the young men of the review Hlas were taught in Prague by Masaryk. They hold the Slovak question to be one of schools and cooperatives, and their eyes are on Bohemia."

 AUHNAT_SLO_hodza_and_the_belvedere:0 "Hodza and the Belvedere"
 AUHNAT_SLO_hodza_and_the_belvedere_desc:0 "Milan Hodza edits an agrarian weekly for Slovak peasants and instructs the Heir Presumptive on Hungarian affairs. Committing to him closes the door on the clerical party."

 AUHNAT_SLO_a_slovak_curia_in_the_diet:0 "A Slovak Curia"
 AUHNAT_SLO_a_slovak_curia_in_the_diet_desc:0 "The Moravian model carried across the Danube: the northern electorate is registered by nationality and votes in its own curia. It ends the gerrymander, and obliges every man to declare what he is."

 AUHNAT_SLO_the_upper_hungarian_land:0 "The Upper Hungarian Land"
 AUHNAT_SLO_the_upper_hungarian_land_desc:0 "A named territory inside the Crown of Saint Stephen, with its own inspectorate, administration and budget. It is the least that could be called autonomy, and it costs Budapest a fifth of its kingdom."

 AUHNAT_SLO_slovensko_a_land_of_the_crown:0 "Slovensko, a Land of the Crown"
 AUHNAT_SLO_slovensko_a_land_of_the_crown_desc:0 "Slovensko takes its seat as a land of the Monarchy, with a diet in Martin and a governor answerable to it. There is now a third party to every bargain between Vienna and Budapest."

 AUHNAT_SLO_the_school_inspectorate:0 "The School Inspectorate"
 AUHNAT_SLO_the_school_inspectorate_desc:0 "Inspectors travel the northern counties to certify that the Lex Apponyi is applied. Schools that fail lose the subsidy. Schools that lose the subsidy close."

 AUHNAT_SLO_dissolve_the_national_party:0 "Dissolve the National Party"
 AUHNAT_SLO_dissolve_the_national_party_desc:0 "The party is struck off and its editors prosecuted for incitement against the Hungarian nation. Everything in the Uplands that could have been negotiated with ceases to be visible."

 AUHNAT_SLO_the_upland_gendarmerie:0 "The Upland Gendarmerie"
 AUHNAT_SLO_the_upland_gendarmerie_desc:0 "Gendarmerie posts across the northern counties, with orders to attend every consecration and every funeral that might turn into a demonstration. The army learns the policing of a countryside."

 AUHNAT_SLO_magyarise_the_place_names:0 "Magyarise the Place Names"
 AUHNAT_SLO_magyarise_the_place_names_desc:0 "Every settlement in the Kingdom receives one official Hungarian name and no other, and the gazetteer and the land register follow. A country so renamed cannot be described in its own language."

 AUHNAT_SLO_no_slovak_nation:0 "There Is No Slovak Nation"
 AUHNAT_SLO_no_slovak_nation_desc:0 "One political nation in Hungary, and those who speak Slovak are Hungarians who happen to speak Slovak. The Monarchy buys quiet recruits and sells the most usable grievance in central Europe."

 AUHNAT_SLO_the_nationalities_law_of_1868:0 "The Law of 1868 Still Stands"
 AUHNAT_SLO_the_nationalities_law_of_1868_desc:0 "Vienna reminds Budapest, politely and in writing, that the Nationalities Law has never been repealed. Budapest agrees, politely and in writing, and applies as much of it as before."

 AUHNAT_SLO_the_question_deferred:0 "The Question Deferred"
 AUHNAT_SLO_the_question_deferred_desc:0 "A commission is appointed and a report received. Deferral can be repeated indefinitely; the men who would have accepted a settlement in 1900 are no longer the men one deals with."

 AUHNAT_SLO_the_american_emigration:0 "The Emigration to America"
 AUHNAT_SLO_the_american_emigration_desc:0 "Half a million Slovaks have gone to the mines of Pennsylvania, and their remittances are the largest source of cash in the northern counties. The loud men are all in Pittsburgh."

 AUHNAT_SLO_hlinkas_peoples_party:0 "Hlinka's People's Party"
 AUHNAT_SLO_hlinkas_peoples_party_desc:0 "Father Hlinka's party is clerical, populist and rooted in every parish between the Vah and the Hron. It holds the countryside against the Archduke's court as firmly as against socialism."

 AUHNAT_SLO_stem_the_emigration:0 "Stem the Emigration"
 AUHNAT_SLO_stem_the_emigration_desc:0 "Roads, credit and wages in the northern counties, on the argument that a state which cannot feed its subjects cannot complain that they leave. The men stay, and bring opinions with them."

 AUHNAT_SLO_the_upland_ironworks:0 "The Upland Ironworks"
 AUHNAT_SLO_the_upland_ironworks_desc:0 "Podbrezova iron, Ruzomberok paper and the timber of the Tatras. The Uplands are the industrial half of a kingdom that thinks itself agrarian, and Budapest fears a proletariat of the wrong language."


# =============================================================================================
# ROMANIANS OF TRANSYLVANIA - the Romanian National Party, x 114-117
# =============================================================================================

 AUHNAT_ROM_the_romanian_national_party:0 "The Romanian National Party"
 AUHNAT_ROM_the_romanian_national_party_desc:0 "Three million Romanians east of the Tisza, a majority in Transylvania, and a party in Sibiu that cannot win under districts it did not draw. Its grievance is addressed beyond the Carpathians."

 AUHNAT_ROM_the_memorandum_of_1892:0 "The Memorandum of 1892"
 AUHNAT_ROM_the_memorandum_of_1892_desc:0 "Three hundred delegates carried the Memorandum to Vienna in 1892; the Emperor returned it unopened to Budapest, which tried its authors for incitement. A subject has no address above his ministry."

 AUHNAT_ROM_open_the_memorandum:0 "Open the Memorandum"
 AUHNAT_ROM_open_the_memorandum_desc:0 "The Emperor reads what was put into his hands. Constitutionally it changes nothing; practically it establishes a court of appeal above Budapest, and every nationality notes the address."

 AUHNAT_ROM_returned_unopened:0 "Returned Unopened"
 AUHNAT_ROM_returned_unopened_desc:0 "The document goes back to the Hungarian ministry with the seal intact, as the Compromise requires. Relations with Budapest have never been better and with three million subjects never worse."

 AUHNAT_ROM_dissolve_the_national_party:0 "Dissolve the National Party"
 AUHNAT_ROM_dissolve_the_national_party_desc:0 "The party is dissolved by decree and its committee prosecuted. Transylvanian politics loses its address and keeps three million adherents, who meet in two churches the state cannot dissolve."

 AUHNAT_ROM_the_confessional_schools:0 "The Confessional Schools"
 AUHNAT_ROM_the_confessional_schools_desc:0 "Sibiu and Blaj maintain some thousands of elementary schools on parish money. Exempting them from the language law keeps them open, and leaves them answering to a bishop."

 AUHNAT_ROM_the_activist_turn:0 "The Activist Turn"
 AUHNAT_ROM_the_activist_turn_desc:0 "The party conference abandons two decades of abstention, and Romanian deputies take their seats in Budapest to be a visible minority rather than an eloquent absence."

 AUHNAT_ROM_the_tisza_negotiations:0 "The Negotiations with Tisza"
 AUHNAT_ROM_the_tisza_negotiations_desc:0 "Districts redrawn, schools left alone, the language admitted in the county courts: the offer Tisza made and never carried through. It buys nothing visible for two full years."

 AUHNAT_ROM_redraw_the_electoral_districts:0 "Redraw the Electoral Districts"
 AUHNAT_ROM_redraw_the_electoral_districts_desc:0 "A Transylvanian district of eight hundred Magyar voters returns a deputy; one of five thousand Romanians returns one too. Redrawing on the census gives every Hungarian party a grievance."

 AUHNAT_ROM_a_romanian_land_in_transylvania:0 "A Romanian Land"
 AUHNAT_ROM_a_romanian_land_in_transylvania_desc:0 "Transylvania is administered from Sibiu, in Romanian, by men who live there. Hungary loses a third of its territory, and the doctrine of the indivisible Crown loses its only support."

 AUHNAT_ROM_the_grand_principality_restored:0 "The Grand Principality Restored"
 AUHNAT_ROM_the_grand_principality_restored_desc:0 "The Grand Principality of Transylvania, abolished by the Union of 1867, takes its place again among the lands of the Monarchy. Budapest would see the Monarchy dissolved before conceding it."

 AUHNAT_ROM_apponyi_in_transylvania:0 "Apponyi in Transylvania"
 AUHNAT_ROM_apponyi_in_transylvania_desc:0 "The school acts fall on the Romanian confessional schools as heavily as on the Slovak ones, and there are far more of them. The bishops hold out, and do not forget who made them."

 AUHNAT_ROM_the_settlement_policy:0 "The Settlement Policy"
 AUHNAT_ROM_the_settlement_policy_desc:0 "State land in the Banat and the Crisana is sold on easy terms to Magyar colonists from the plain. The arithmetic of a county changes in a decade, and so does the temper of its sons."

 AUHNAT_ROM_the_state_schools_of_the_banat:0 "The State Schools of the Banat"
 AUHNAT_ROM_the_state_schools_of_the_banat_desc:0 "Where the confessional school has closed, the state school opens, better funded and better built. The children attend, and leave unable to read their grandmother's prayer book."

 AUHNAT_ROM_break_the_liga_culturala:0 "Break the Cultural League"
 AUHNAT_ROM_break_the_liga_culturala_desc:0 "The Cultural League in Bucharest funds Transylvanian newspapers, students and lawsuits. The Evidenzbureau opens its post, and Bucharest must now defend what had embarrassed it."

 AUHNAT_ROM_one_political_nation:0 "One Political Nation"
 AUHNAT_ROM_one_political_nation_desc:0 "There is one political nation in the lands of the Crown of Saint Stephen, and no other in law. The Monarchy gets its regiments, and the men in them are informed that they do not exist."

 AUHNAT_ROM_the_carpathian_frontier:0 "The Carpathian Frontier"
 AUHNAT_ROM_the_carpathian_frontier_desc:0 "The General Staff holds that a kingdom claiming three million of our subjects is no ally, and that the passes should be taken while Russia rebuilds. They must then be garrisoned for ever."

 AUHNAT_ROM_the_secret_alliance_of_1883:0 "The Secret Alliance of 1883"
 AUHNAT_ROM_the_secret_alliance_of_1883_desc:0 "Romania is bound to us by a treaty so secret its own parliament has never seen it, signed by a Hohenzollern embarrassed by his Transylvanian kinsmen. It lapses with the king's life."

 AUHNAT_ROM_king_carols_silence:0 "King Carol's Silence"
 AUHNAT_ROM_king_carols_silence_desc:0 "Bucharest is asked, and declines to raise the Transylvanian question as it has for twenty-five years. The Crown Council keeps its treaty; the Cultural League keeps its subscribers."

 AUHNAT_ROM_the_question_adjourned:0 "The Question Adjourned"
 AUHNAT_ROM_the_question_adjourned_desc:0 "The Transylvanian question is referred to the next session and, in due course, to the one after. The file grows heavier every year without ever being opened."

 AUHNAT_ROM_the_orthodox_metropolitanate:0 "The Metropolitanate of Sibiu"
 AUHNAT_ROM_the_orthodox_metropolitanate_desc:0 "The metropolitan of Sibiu governs a church, a school system and a press, and answers to a synod rather than a ministry. Provoked, he can fill every church in Transylvania at once."

 AUHNAT_ROM_the_see_of_blaj:0 "The See of Blaj"
 AUHNAT_ROM_the_see_of_blaj_desc:0 "The Greek Catholic see of Blaj is in communion with Rome and therefore counted as ours. Its seminary taught the men who wrote the Memorandum their Latin and their history."

 AUHNAT_ROM_the_astra_society:0 "The ASTRA Society"
 AUHNAT_ROM_the_astra_society_desc:0 "The Transylvanian Association for Romanian Literature runs reading rooms and agricultural courses out of Sibiu, and is scrupulously legal. Its goodwill costs less than the budget would notice."

 AUHNAT_ROM_the_resita_ironworks:0 "The Resita Ironworks"
 AUHNAT_ROM_the_resita_ironworks_desc:0 "Resita and Anina: furnaces, rolling mills and locomotive shops in the Banat hills, the second industrial district of the Hungarian half and the only one whose workforce is Romanian."

 AUHNAT_ROM_vaida_voevod_at_the_belvedere:0 "Vaida-Voevod at the Belvedere"
 AUHNAT_ROM_vaida_voevod_at_the_belvedere_desc:0 "Alexandru Vaida-Voevod sits in the Archduke's chancery and drafts the Transylvanian clauses of a reign that has not begun. It makes a settlement with the Magyar gentry impossible."

 AUHNAT_ROM_popovici_and_the_fifteen_states:0 "Popovici and the Fifteen States"
 AUHNAT_ROM_popovici_and_the_fifteen_states_desc:0 "Aurel Popovici, a Romanian of the Banat writing in Vienna, would redraw the Monarchy as fifteen federal states delimited by language under one sovereign. It creates fifteen parties to consult."


# =============================================================================================
# BOSNIANS - the Muslim National Organisation, x 130-133
# =============================================================================================

 AUHNAT_BOS_the_muslim_national_organisation:0 "The Muslim National Organisation"
 AUHNAT_BOS_the_muslim_national_organisation_desc:0 "The Muslim notables organise to defend their endowments, schools and estates against an administration that arrived in 1878 and never left. They are also the landlords of the Orthodox."

 AUHNAT_BOS_the_occupation_of_1878:0 "The Occupation of 1878"
 AUHNAT_BOS_the_occupation_of_1878_desc:0 "Thirty years of Austro-Hungarian administration over a province that remains, in law, Ottoman. Since the Young Turks the ambiguity has a deadline: an Ottoman province elects Ottoman deputies."

 AUHNAT_BOS_a_constitution_for_bosnia:0 "A Constitution for Bosnia"
 AUHNAT_BOS_a_constitution_for_bosnia_desc:0 "Burian has had a provincial statute in his drawer for years. Granting it without an annexation gives the three communities a chamber, and leaves our claim to the province still missing."

 AUHNAT_BOS_the_kallay_system:0 "The Kallay System Continues"
 AUHNAT_BOS_the_kallay_system_desc:0 "Kallay governed for twenty years on the theory that Bosnia held neither Serbs nor Croats but Bosnians. It did not take. Continuing it costs nothing and settles nothing."

 AUHNAT_BOS_end_the_condominium:0 "End the Condominium"
 AUHNAT_BOS_end_the_condominium_desc:0 "The rescript is drafted and the Sultan compensated: the provinces are ours in law as they have been in fact since 1878. It costs the Russian entente and a hundred million crowns of trade."

 AUHNAT_BOS_the_waqf_autonomy:0 "The Waqf Autonomy"
 AUHNAT_BOS_the_waqf_autonomy_desc:0 "The statute of religious and educational autonomy places the Islamic endowments and schools under an elected Muslim assembly. The schooling of a third of the province leaves our hands."

 AUHNAT_BOS_the_landesstatut_of_1910:0 "The Landesstatut of February 1910"
 AUHNAT_BOS_the_landesstatut_of_1910_desc:0 "A diet of ninety-two members elected in confessional curiae, with no responsible ministry and a governor who may dissolve it. After thirty-two years of decree, it is still the first question asked."

 AUHNAT_BOS_the_sabor_of_sarajevo:0 "The Sabor of Sarajevo"
 AUHNAT_BOS_the_sabor_of_sarajevo_desc:0 "The diet sits, and the Muslim, Serb and Croat clubs discover they can pass a budget together when the alternative is a governor's decree. Nobody in Vienna expected it to matter."

 AUHNAT_BOS_redeem_the_kmet_holdings:0 "Redeem the Kmet Holdings"
 AUHNAT_BOS_redeem_the_kmet_holdings_desc:0 "Some ninety thousand families work land they do not own, almost all Orthodox and almost all of their landlords Muslim. Buying them out dispossesses the only community that supports us."

 AUHNAT_BOS_the_third_land:0 "The Third Land"
 AUHNAT_BOS_the_third_land_desc:0 "Bosnia is declared a corpus separatum: neither Cisleithanian nor Transleithanian, but a land of the Monarchy with a delegation of its own. The dualist arithmetic no longer closes."

 AUHNAT_BOS_a_crownland_of_its_own:0 "A Crownland of Its Own"
 AUHNAT_BOS_a_crownland_of_its_own_desc:0 "Sarajevo receives a governor, a budget, a diet with real powers and a seat where the common expenditure is divided. Two governments that refused to pay for it must now negotiate with it."

 AUHNAT_BOS_the_sandjak_railway:0 "The Sandjak Railway"
 AUHNAT_BOS_the_sandjak_railway_desc:0 "A line south through the Sandjak of Novi Pazar towards Salonika, announced to the Delegations before Saint Petersburg. Every chancellery reads it as the end of the Muerzsteg understanding."

 AUHNAT_BOS_incorporate_the_reichsland:0 "Incorporate the Reichsland"
 AUHNAT_BOS_incorporate_the_reichsland_desc:0 "The provinces are written into the body of the Monarchy: our courts, our cadastre, our conscription. What was held under an international mandate is now held as of right."

 AUHNAT_BOS_dissolve_the_three_organisations:0 "Dissolve the Three Organisations"
 AUHNAT_BOS_dissolve_the_three_organisations_desc:0 "The Muslim, Serb and Croat organisations are struck off together, on the ground that a province with three national parties has three national questions. Nobody may now speak for anybody."

 AUHNAT_BOS_the_exceptional_measures:0 "The Exceptional Measures"
 AUHNAT_BOS_the_exceptional_measures_desc:0 "The Statute is suspended, the diet prorogued and the province governed by decree from the Konak. The constitution that justified the annexation lasted three years."

 AUHNAT_BOS_a_province_like_any_other:0 "A Province Like Any Other"
 AUHNAT_BOS_a_province_like_any_other_desc:0 "Bosnia is taxed, conscripted and policed like a province. The four Bosniaken regiments are among our best infantry, and the country behind them is held by gendarmes."

 AUHNAT_BOS_the_bosnian_nation_doctrine:0 "The Bosnian Nation"
 AUHNAT_BOS_the_bosnian_nation_doctrine_desc:0 "There are no Serbs and no Croats in Bosnia, only Bosnians of three confessions, printed in the schoolbooks and enforced in the press law. Two of the three decline to forget who they are."

 AUHNAT_BOS_burian_and_the_common_finances:0 "Burian and the Common Finances"
 AUHNAT_BOS_burian_and_the_common_finances_desc:0 "The common Ministry of Finance runs Bosnia as a going concern: railways, forests, mines and a budget that balances without a subvention. No Bosnian ever voted a line of it."

 AUHNAT_BOS_neither_half_will_pay:0 "Neither Half Will Pay"
 AUHNAT_BOS_neither_half_will_pay_desc:0 "Vienna holds that Bosnia is a common expense, Budapest that a province neither kingdom owns cannot be charged to the quota. The administration spends on and Hungary's price goes up."

 AUHNAT_BOS_evacuate_the_sandjak:0 "Evacuate the Sandjak"
 AUHNAT_BOS_evacuate_the_sandjak_desc:0 "The garrisons come out of Novi Pazar and the right of occupation goes back to the Porte. The strip that kept Serbia and Montenegro apart is given away, and only a war recovers it."

 AUHNAT_BOS_the_bosniaken_regiments:0 "The Bosniaken Regiments"
 AUHNAT_BOS_the_bosniaken_regiments_desc:0 "Four regiments of Bosnian-Herzegovinian infantry from all three confessions, with the fez as headgear and a reputation the common army relies on. They work exactly as intended."

 AUHNAT_BOS_the_narrow_gauge_network:0 "The Narrow Gauge Network"
 AUHNAT_BOS_the_narrow_gauge_network_desc:0 "Seven hundred and sixty millimetres of gauge through the Bosnian gorges, built by military engineers because no company would touch it. It carries the timber, the coal and the garrisons."

 AUHNAT_BOS_the_sarajevo_tobacco_monopoly:0 "The Tobacco Monopoly"
 AUHNAT_BOS_the_sarajevo_tobacco_monopoly_desc:0 "The Herzegovinian leaf is bought at a price the administration sets and sold at a price it sets. The difference is the largest provincial revenue, taken from the poorest growers we have."

 AUHNAT_BOS_the_serb_national_organisation:0 "The Serb National Organisation"
 AUHNAT_BOS_the_serb_national_organisation_desc:0 "The Serbs of Bosnia are recognised as a party with a name, a committee and a school council, like the Muslims and the Croats. Every question is now decided by a vote two-thirds of it loses."


# =============================================================================================
# ITALIANS - the Littoral and the Trentino, x 134-137
# =============================================================================================

 AUHNAT_ITA_the_italians_of_the_littoral:0 "The Italians of the Littoral"
 AUHNAT_ITA_the_italians_of_the_littoral_desc:0 "Trieste is the richest port the Monarchy possesses and its council is Italian and national; Istria is contested street by street; the Trentino is loyal. All three read the same foreign press."

 AUHNAT_ITA_the_facts_of_innsbruck:0 "The Facts of Innsbruck"
 AUHNAT_ITA_the_facts_of_innsbruck_desc:0 "An Italian law faculty opens in a German town, and Innsbruck riots for two days: one dead, a hundred and thirty students arrested, the faculty closed within the week."

 AUHNAT_ITA_a_faculty_for_trieste:0 "A Faculty for Trieste"
 AUHNAT_ITA_a_faculty_for_trieste_desc:0 "The Italian university opens where the Italians asked for it, and the irredentists lose the grievance they have lived on since 1866. The Slovene societies learn they are abandoned."

 AUHNAT_ITA_a_faculty_anywhere_but_trieste:0 "A Faculty Anywhere But Trieste"
 AUHNAT_ITA_a_faculty_anywhere_but_trieste_desc:0 "Rovereto is proposed, and Wiener Neustadt, and a faculty attached to Vienna. Each offer is serious, each is refused, and each refusal is printed in Rome."

 AUHNAT_ITA_no_faculty_at_all:0 "No Faculty At All"
 AUHNAT_ITA_no_faculty_at_all_desc:0 "There will be no Italian university in the Monarchy, because a university is a capital and a capital is a claim. The Italian deputies leave the Reichsrat and address themselves elsewhere."

 AUHNAT_ITA_autonomy_for_the_trentino:0 "Autonomy for the Trentino"
 AUHNAT_ITA_autonomy_for_the_trentino_desc:0 "The Italian districts south of Salurn are separated from the Tyrolean diet at Innsbruck and given an administration of their own. The German Tyroleans have refused it for sixty years."

 AUHNAT_ITA_de_gasperi_and_the_popular_union:0 "De Gasperi and the Popular Union"
 AUHNAT_ITA_de_gasperi_and_the_popular_union_desc:0 "The Catholic movement of the Trentino is autonomist, not irredentist: it wants its own diet and an emperor above it. Degasperi's Italians mean to remain subjects, on terms of their own."

 AUHNAT_ITA_the_immediate_city_of_trieste:0 "The Immediate City of Trieste"
 AUHNAT_ITA_the_immediate_city_of_trieste_desc:0 "Trieste's ancient standing as a city immediate to the Crown is confirmed: its own statute, its own port, its own revenues. The Statthalter loses every appointment that matters."

 AUHNAT_ITA_the_littoral_land:0 "The Littoral Land"
 AUHNAT_ITA_the_littoral_land_desc:0 "Trieste, Gorizia and Istria are constituted as one land with one diet, in which Italians, Slovenes and Croats sit together. It gives each of the three a veto over the other two."

 AUHNAT_ITA_an_italian_land_of_the_empire:0 "An Italian Land of the Empire"
 AUHNAT_ITA_an_italian_land_of_the_empire_desc:0 "From the Trentino to Istria, an Italian land of the Monarchy with Trieste as its capital. Rome's unredeemed brothers are redeemed by Vienna, and the Alpine deputies will not forgive it."

 AUHNAT_ITA_the_hohenlohe_decrees:0 "The Hohenlohe Decrees"
 AUHNAT_ITA_the_hohenlohe_decrees_desc:0 "The Statthalter strikes subjects of the Kingdom of Italy off the municipal payroll of Trieste, correctly and legally. The commercial houses of the port are the same families."

 AUHNAT_ITA_german_and_slovene_trieste:0 "German and Slovene Trieste"
 AUHNAT_ITA_german_and_slovene_trieste_desc:0 "The government funds the Slovene savings bank, schools and candidates, on the principle that the way to break an Italian town council is to enfranchise the countryside around it."

 AUHNAT_ITA_dissolve_the_lega_nazionale:0 "Dissolve the Lega Nazionale"
 AUHNAT_ITA_dissolve_the_lega_nazionale_desc:0 "The Lega Nazionale keeps Italian schools in villages the state has left to the Slovenes, and is funded from Milan. The subscriptions continue; they stop arriving through the post."

 AUHNAT_ITA_the_evidenzbureau_in_the_littoral:0 "The Evidenzbureau in the Littoral"
 AUHNAT_ITA_the_evidenzbureau_in_the_littoral_desc:0 "A station in Trieste, informers in the Lloyd offices, and the irredentist press read in proof. The port is governed as a security district rather than as a market."

 AUHNAT_ITA_the_littoral_is_austrian:0 "The Littoral Is Austrian"
 AUHNAT_ITA_the_littoral_is_austrian_desc:0 "Administered from Vienna, in German, conscripted like Carinthia and policed like a frontier. The Adriatic trade pays for the fleet and stays settled as long as the garrisons do."

 AUHNAT_ITA_article_seven_of_the_alliance:0 "Article VII of the Alliance"
 AUHNAT_ITA_article_seven_of_the_alliance_desc:0 "Neither Vienna nor Rome may alter the Balkan status quo without compensating the other. It keeps Italy in the Triple Alliance, and admits her claim on our conquests."

 AUHNAT_ITA_the_ally_across_the_isonzo:0 "The Ally Across the Isonzo"
 AUHNAT_ITA_the_ally_across_the_isonzo_desc:0 "Rome is an ally on paper, a rival in the Adriatic and a magnet for our Italian subjects, and the policy is to notice only the first. It commits nothing at all."

 AUHNAT_ITA_the_stabilimento_tecnico_triestino:0 "The Stabilimento Tecnico Triestino"
 AUHNAT_ITA_the_stabilimento_tecnico_triestino_desc:0 "The yard at Trieste builds the Monarchy's capital ships, and its workforce and draughtsmen are Italian. Every battleship is laid down by the community the staff would most like to disarm."

 AUHNAT_ITA_lloyd_austriaco:0 "The Austrian Lloyd"
 AUHNAT_ITA_lloyd_austriaco_desc:0 "The imperial mail line sails from Trieste to Alexandria, Bombay and Shanghai on a subsidy voted in Vienna. It is our claim to be a maritime power, questioned by Hungary every year."

 AUHNAT_ITA_battisti_and_the_socialists:0 "Battisti and the Socialists"
 AUHNAT_ITA_battisti_and_the_socialists_desc:0 "Cesare Battisti prints a socialist paper in Trento which is also an irredentist paper, and the state permits it because a legal opposition is easier to watch than an illegal one."

 AUHNAT_ITA_renew_the_triple_alliance:0 "Renew the Triple Alliance"
 AUHNAT_ITA_renew_the_triple_alliance_desc:0 "The treaty is renewed ahead of time and the Italian frontier becomes a diplomatic question. In exchange the Monarchy binds itself not to move alone in the Balkans."

 AUHNAT_ITA_conrads_memorandum_on_italy:0 "Conrad's Memorandum on Italy"
 AUHNAT_ITA_conrads_memorandum_on_italy_desc:0 "The Chief of the General Staff has demanded this war in writing two dozen times, holding that an ally who claims our provinces is an enemy. He proposes the second front we exist to avoid."


# =============================================================================================
# IDEAS - Slovaks
# =============================================================================================

 AUH_SLO_the_slovak_question:0 "The Slovak Question"
 AUH_SLO_the_slovak_question_desc:0 "Two million subjects and a grievance that will not close. Vienna holds it over Budapest at every settlement; anyone else may have it for a printing press."

 AUH_SLO_the_school_laws_of_1907:0 "The School Laws of 1907"
 AUH_SLO_the_school_laws_of_1907_desc:0 "The subsidy buys the language and the language buys the town. It does not buy the village, which returns a recruit taught to distrust the state."

 AUH_SLO_the_martin_programme:0 "The Martin Programme"
 AUH_SLO_the_martin_programme_desc:0 "The law of 1868 applied at last, in the courts and the schools. The counties quieten, and their administration is answerable for the first time in forty years."

 AUH_SLO_the_uplands_deferred:0 "The Uplands Deferred"
 AUH_SLO_the_uplands_deferred_desc:0 "A commission has been appointed and will report in due course. Deferral is the cheapest instrument of government, and the only one whose price rises every year."

 AUH_SLO_magyarisation_of_the_uplands:0 "Magyarisation of the Uplands"
 AUH_SLO_magyarisation_of_the_uplands_desc:0 "One language in the schools, on the signs and in the courts. The counties are governable; their regiments obey an order and do nothing further."

 AUH_SLO_hodza_at_the_belvedere:0 "Hodza at the Belvedere"
 AUH_SLO_hodza_at_the_belvedere_desc:0 "The Heir Presumptive has a Slovak adviser and a plan for a reign that has not begun. A government in waiting fixes every hope on the death of an old man."

 AUH_SLO_the_slovak_peoples_party:0 "The Slovak People's Party"
 AUH_SLO_the_slovak_peoples_party_desc:0 "Clerical, populist and parish by parish. It holds the countryside against liberalism and against every scheme drawn up in a capital city, including ours."

 AUH_SLO_the_upper_hungarian_land:0 "The Upper Hungarian Land"
 AUH_SLO_the_upper_hungarian_land_desc:0 "A named territory with its own schools, administration and budget line. Everything it administers, Budapest no longer does, and Budapest has an itemised memory."

 AUH_SLO_slovensko_the_ninth_land:0 "Slovensko"
 AUH_SLO_slovensko_the_ninth_land_desc:0 "A land of the Monarchy with a diet in Martin. The emigration reverses and the recruiting lists fill. Every bargain that used to have two parties now has three."

 AUH_SLO_the_uplands_under_administration:0 "The Uplands Under Administration"
 AUH_SLO_the_uplands_under_administration_desc:0 "No party, no committee, no legal press. The province is quiet in the way a room is quiet when the conversation has moved to the corridor."

 AUH_SLO_one_political_nation_in_hungary:0 "One Political Nation"
 AUH_SLO_one_political_nation_in_hungary_desc:0 "The doctrine is official: there are Hungarians who speak Slovak, and nobody else. The conscripts come, and so does the most usable grievance in central Europe."

 AUH_SLO_the_american_emigration:0 "The Emigration to America"
 AUH_SLO_the_american_emigration_desc:0 "Remittances from Pittsburgh keep the northern counties solvent, and the absence of their senders keeps them quiet. The state cannot bank one without the other."


# =============================================================================================
# IDEAS - Romanians
# =============================================================================================

 AUH_ROM_the_transylvanian_question:0 "The Transylvanian Question"
 AUH_ROM_the_transylvanian_question_desc:0 "Three million subjects, five deputies, and a kingdom of the same name across the mountains. An asset in every negotiation with Bucharest, until Bucharest stops."

 AUH_ROM_the_memorandum_returned:0 "The Memorandum Returned"
 AUH_ROM_the_memorandum_returned_desc:0 "The petition came back with the seal unbroken and its authors went to prison. The forms of dualism were preserved; there is no address above the Hungarian ministry."

 AUH_ROM_the_crown_hears_the_petition:0 "The Crown Hears the Petition"
 AUH_ROM_the_crown_hears_the_petition_desc:0 "The Emperor has read a document his ministers wished him not to read. The constitution is unchanged, and every nationality now knows there is somewhere to write."

 AUH_ROM_the_party_dissolved:0 "The National Party Dissolved"
 AUH_ROM_the_party_dissolved_desc:0 "Struck off, prosecuted and dispersed. Transylvanian politics has no treasurer and no programme, and meets in two churches the state cannot dissolve."

 AUH_ROM_the_transylvanian_settlement:0 "The Transylvanian Settlement"
 AUH_ROM_the_transylvanian_settlement_desc:0 "Districts, schools and courts conceded in full. The kingdom across the Carpathians keeps its army, and loses the argument that would have made its peasants march."

 AUH_ROM_the_price_of_the_talks:0 "The Price of the Talks"
 AUH_ROM_the_price_of_the_talks_desc:0 "Two years of concessions granted in advance and results visible to nobody. Every settlement worth having first looks exactly like a surrender."

 AUH_ROM_the_romanian_land:0 "The Romanian Land"
 AUH_ROM_the_romanian_land_desc:0 "Transylvania administered from Sibiu, in Romanian, by men who live there. The Crown of Saint Stephen has been divided, and the doctrine that it could not be with it."

 AUH_ROM_the_grand_principality:0 "The Grand Principality"
 AUH_ROM_the_grand_principality_desc:0 "The Grand Principality sits again among the lands of the Monarchy, with its diet and its governor. It is what Budapest swore, at any price, to prevent."

 AUH_ROM_the_state_school_network:0 "The State School Network"
 AUH_ROM_the_state_school_network_desc:0 "Where the confessional school closes, a better-funded state school opens. The children learn to read a Hungarian newspaper and lose whatever their families wrote."

 AUH_ROM_the_transylvanian_surveillance:0 "The Transylvanian Surveillance"
 AUH_ROM_the_transylvanian_surveillance_desc:0 "The Cultural League's post is read and its couriers turned back at the passes. A province is now administered by a bureau answerable to nobody who lives in it."

 AUH_ROM_one_political_nation:0 "One Political Nation"
 AUH_ROM_one_political_nation_desc:0 "From the Leitha to the Carpathians, one nation in law and several in fact. The recruiting offices fill with men officially informed that they do not exist."

 AUH_ROM_the_carpathian_frontier:0 "The Carpathian Frontier"
 AUH_ROM_the_carpathian_frontier_desc:0 "The passes are held and the frontier commissions sit. The army has its mountain line, and the Monarchy has one more border to man in every year of peace."

 AUH_ROM_the_uniate_church:0 "The Uniate Church"
 AUH_ROM_the_uniate_church_desc:0 "Blaj is in communion with Rome and therefore reliable, and its seminary taught the men who wrote the Memorandum. Latin and history lead where they lead."

 AUH_ROM_the_belvedere_memorandum:0 "The Belvedere Memorandum"
 AUH_ROM_the_belvedere_memorandum_desc:0 "The Archduke's chancery holds a Transylvanian programme, a Romanian drafter and a date it cannot name. Every party in the Monarchy is waiting for a funeral."

 AUH_ROM_the_fifteen_states:0 "The United States of Greater Austria"
 AUH_ROM_the_fifteen_states_desc:0 "Fifteen federal states drawn by language, one army, one currency, one sovereign. It answers the question avoided since 1867 and asks a smaller one fifteen times a year."


# =============================================================================================
# IDEAS - Bosnians
# =============================================================================================

 AUH_BOS_the_condominium:0 "The Condominium"
 AUH_BOS_the_condominium_desc:0 "Administered by the common Ministry of Finance, owned by neither half, claimed by a Sultan not obeyed there since 1878. Nobody can be held responsible for it."

 AUH_BOS_thirty_years_of_occupation:0 "Thirty Years of Occupation"
 AUH_BOS_thirty_years_of_occupation_desc:0 "Railways, cadastre, courts and gendarmerie, in a country we govern and do not own. The administration is excellent; the title is missing, and Sarajevo knows it."

 AUH_BOS_the_bosnian_diet:0 "The Bosnian Diet"
 AUH_BOS_the_bosnian_diet_desc:0 "A chamber for three communities, granted without an annexation. The province is quieter than ever, and our title to it would not survive a conference table."

 AUH_BOS_the_provincial_deadlock:0 "The Provincial Deadlock"
 AUH_BOS_the_provincial_deadlock_desc:0 "A press law, an invented nation and no decision. It holds the way a lid holds: perfectly, until it does not."

 AUH_BOS_the_annexed_provinces:0 "The Annexed Provinces"
 AUH_BOS_the_annexed_provinces_desc:0 "Ours in law at last. The ambiguity of thirty years is over, the Russian understanding with it, and in Belgrade men who were not conspirators are forming societies."

 AUH_BOS_the_ottoman_boycott:0 "The Ottoman Boycott"
 AUH_BOS_the_ottoman_boycott_desc:0 "The Porte answers with a boycott and the Levant trade stops. A hundred million crowns of exports are lost by manufacturers nobody consulted."

 AUH_BOS_the_waqf_statute:0 "The Waqf Statute"
 AUH_BOS_the_waqf_statute_desc:0 "The endowments and schools of the Muslim community pass to an elected assembly of it. The notables become supporters; a third of the province leaves our schools."

 AUH_BOS_the_landesstatut:0 "The Landesstatut"
 AUH_BOS_the_landesstatut_desc:0 "Ninety-two members, confessional curiae, no ministry and no control of the budget. Designed to be harmless, it is now where everything of consequence must pass."

 AUH_BOS_the_agrarian_redemption:0 "The Agrarian Redemption"
 AUH_BOS_the_agrarian_redemption_desc:0 "The kmet becomes a freeholder and the beg is compensated in state paper. The Orthodox peasantry is bought outright, and so is the enmity of the notables."

 AUH_BOS_the_corpus_separatum:0 "The Corpus Separatum"
 AUH_BOS_the_corpus_separatum_desc:0 "Neither Cisleithanian nor Transleithanian, but a land of the Monarchy in its own right. The dualist arithmetic no longer closes, and it was written never to reopen."

 AUH_BOS_the_bosnian_crownland:0 "The Bosnian Crownland"
 AUH_BOS_the_bosnian_crownland_desc:0 "A governor, a budget, a diet with teeth and a delegation where the common expenditure is divided. Sarajevo has become a capital, and it will send its bill like one."

 AUH_BOS_izvolskys_grievance:0 "Izvolsky's Grievance"
 AUH_BOS_izvolskys_grievance_desc:0 "The Sandjak line runs south towards Salonika, and Saint Petersburg was told after the Delegations were. The understanding it cost was worth more than the railway."

 AUH_BOS_the_common_finance_ministry:0 "The Common Finance Ministry"
 AUH_BOS_the_common_finance_ministry_desc:0 "A province run from a ministry answerable to the Delegations and nobody else. It is the most competent administration we have, and both halves resent every crown."

 AUH_BOS_the_dissolved_organisations:0 "The Dissolved Organisations"
 AUH_BOS_the_dissolved_organisations_desc:0 "Muslim, Serb and Croat, struck off together. Nobody in Sarajevo is authorised to speak for anybody, which is convenient until somebody must be spoken to."

 AUH_BOS_the_suspended_statute:0 "The Suspended Statute"
 AUH_BOS_the_suspended_statute_desc:0 "The diet is prorogued and the Konak governs by decree. The garrisons are safe, and the constitution that justified the annexation lasted three years."

 AUH_BOS_the_reichsland:0 "The Reichsland"
 AUH_BOS_the_reichsland_desc:0 "Taxed, conscripted and policed like any other province. Four excellent regiments march out of a country held down by gendarmes, and both cannot stay true."

 AUH_BOS_burians_administration:0 "Burian's Administration"
 AUH_BOS_burians_administration_desc:0 "State railways, forests, mines and a tobacco monopoly, balancing a budget without a subvention from either capital. No Bosnian ever voted a line of it."

 AUH_BOS_the_sandjak_abandoned:0 "The Sandjak Abandoned"
 AUH_BOS_the_sandjak_abandoned_desc:0 "The garrisons come out and the Porte is satisfied. The strip that kept Serbia and Montenegro from touching is gone, and only a war would recover it."

 AUH_BOS_the_three_communities:0 "The Three Communities"
 AUH_BOS_the_three_communities_desc:0 "Muslim, Serb and Croat, each with a name and a school council. It is the honest description of the province, and it guarantees a vote two-thirds of it loses."


# =============================================================================================
# IDEAS - Italians
# =============================================================================================

 AUH_ITA_the_littoral_question:0 "The Littoral Question"
 AUH_ITA_the_littoral_question_desc:0 "The richest port of the Monarchy, governed by a council that reads its politics in a foreign capital. Loyalty in Trieste is renewed annually, like a lease."

 AUH_ITA_the_university_question:0 "The University Question"
 AUH_ITA_the_university_question_desc:0 "One dead in Innsbruck and a hundred and thirty students arrested over a faculty of law. No answer exists that does not cost the government a majority."

 AUH_ITA_the_university_of_trieste:0 "The University of Trieste"
 AUH_ITA_the_university_of_trieste_desc:0 "The faculty opens in the one town Vienna swore it never would, and the irredentists lose the grievance of 1866. The Slovene societies learn what their subsidy was worth."

 AUH_ITA_the_german_tyrol:0 "The German Tyrol"
 AUH_ITA_the_german_tyrol_desc:0 "German from the Brenner to the Salurner Klause, and no university south of it. The Alpine deputies are satisfied; the Italian deputies have merely stopped attending."

 AUH_ITA_the_trentine_notables:0 "The Trentine Notables"
 AUH_ITA_the_trentine_notables_desc:0 "Catholic, autonomist and legalist: they want a diet of their own and an emperor above it. They are the most loyal Italians we have, on condition of being asked."

 AUH_ITA_the_littoral_diet:0 "The Littoral Diet"
 AUH_ITA_the_littoral_diet_desc:0 "Italians, Slovenes and Croats in one chamber, voting the revenues of the port. It is the only honest arrangement here, and it hands each a veto over the other two."

 AUH_ITA_the_italian_land:0 "The Italian Land"
 AUH_ITA_the_italian_land_desc:0 "From the Trentino to Istria, administered in Italian from Trieste. Rome's unredeemed brothers are redeemed by Vienna, and the Tyrol has stopped being German."

 AUH_ITA_the_hohenlohe_decrees:0 "The Hohenlohe Decrees"
 AUH_ITA_the_hohenlohe_decrees_desc:0 "Foreign nationals struck off the municipal payroll of Trieste, correctly and legally. The clerks lose their posts and the commercial houses take note."

 AUH_ITA_the_lega_dissolved:0 "The Lega Nazionale Dissolved"
 AUH_ITA_the_lega_dissolved_desc:0 "The schools are closed and the buildings confiscated. The subscriptions from Milan continue and simply stop arriving through the post."

 AUH_ITA_the_littoral_surveillance:0 "The Littoral Surveillance"
 AUH_ITA_the_littoral_surveillance_desc:0 "Informers in the shipping offices and the irredentist press read in proof. Little now happens here that Vienna does not know, and the port is a security district."

 AUH_ITA_the_austrian_littoral:0 "The Austrian Littoral"
 AUH_ITA_the_austrian_littoral_desc:0 "German administration, Austrian conscription, imperial police. The Adriatic trade goes on paying for the fleet and has ceased entirely to care whose flag it flies."

 AUH_ITA_article_seven:0 "Article VII"
 AUH_ITA_article_seven_desc:0 "Neither party alters the Balkan status quo without compensating the other. It keeps Rome in the alliance and prices every acre we might gain in the Balkans."

 AUH_ITA_lloyd_austriaco:0 "The Austrian Lloyd"
 AUH_ITA_lloyd_austriaco_desc:0 "Trieste to Alexandria, Bombay and Shanghai under an imperial subsidy. The Monarchy has a claim to be a maritime power, and a bill Hungary queries every year."

 AUH_ITA_the_irredentist_press:0 "The Irredentist Press"
 AUH_ITA_the_irredentist_press_desc:0 "A legal opposition is easier to watch than an illegal one, so Battisti prints and the censor reads. The workers stay inside the law and are argued out of it weekly."

 AUH_ITA_the_triple_alliance_renewed:0 "The Triple Alliance Renewed"
 AUH_ITA_the_triple_alliance_renewed_desc:0 "The Isonzo becomes a diplomatic frontier and the corps behind it can be counted elsewhere. In exchange the Monarchy will not move alone in the Balkans."

 AUH_ITA_the_preventive_war_on_italy:0 "The Preventive War on Italy"
 AUH_ITA_the_preventive_war_on_italy_desc:0 "The General Staff has the offensive it planned for two decades, and the Monarchy has the second front its policy existed to avoid. Conrad was right too late."
