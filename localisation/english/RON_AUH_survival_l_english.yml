 AUH_the_army_that_came_home:0 "The Army That Came Home"
 AUH_the_army_that_came_home_desc:0 "Three million men are demobilised into a state that still exists, and the prisoners returning from Russia bring back more than their kit. Hands for the mills, and a quarrel in every barracks."
 AUH_the_answer_of_the_eighteenth:0 "The Answer of the Eighteenth"
 AUH_the_answer_of_the_eighteenth_desc:0 "The manifesto was signed on the sixteenth and printed on the seventeenth. On the eighteenth the answer came back that federalism no longer sufficed, and every chancellery in Europe read it."
 AUH_the_national_councils:0 "The National Councils Seated"
 AUH_the_national_councils_desc:0 "Each crownland sends a council that speaks for a people rather than a province. They keep the peace and they veto everything, because that is what a council is for."
 AUH_fifteen_maps_one_decree:0 "Fifteen Maps, One Decree"
 AUH_fifteen_maps_one_decree_desc:0 "Popovici drew fifteen national states in 1906. Imposing them by decree means the crown rules without asking, which is fast, and which nobody has consented to."
 AUH_the_delegations_deadlocked:0 "The Delegations Deadlocked"
 AUH_the_delegations_deadlocked_desc:0 "Two sets of sixty, in two cities, voting apart. Nothing new is voted, so nothing new is spent, and the yards wait for credits that arrive a year after the ships are needed."
 AUH_the_bohemian_diet_sits_again:0 "The Bohemian Diet Sits Again"
 AUH_the_bohemian_diet_sits_again_desc:0 "The obstruction that shut Prague since 1908 is bought off with a national cadastre. Bohemia works again, and the price is paid in patronage every single week."
 AUH_the_crown_of_zvonimir:0 "The Crown of Zvonimir"
 AUH_the_crown_of_zvonimir_desc:0 "Croatia is crowned beside Austria and Hungary rather than under Saint Stephen. The Croatian regiments notice. So does Budapest, and Budapest holds the purse."
 AUH_the_littoral_and_its_port:0 "The Littoral and Its Port"
 AUH_the_littoral_and_its_port_desc:0 "Trieste, Fiume and the Istrian coast are administered from the third crown. The yards prosper and Rome reads the Treaty of London again over breakfast."
 AUH_the_census_of_1920:0 "The Census of 1920"
 AUH_the_census_of_1920_desc:0 "Every ten years the Empire asks its subjects what they are. A box for each people is a school, a court and a clerk for each people, and the bill arrives before the loyalty does."
 AUH_the_thousand_holdings_broken:0 "The Thousand Holdings Broken"
 AUH_the_thousand_holdings_broken_desc:0 "The great estates are cut into farms. The villages fill with smallholders who can be conscripted and taxed, and the towns lose the cheap grain the estates used to send them."
 AUH_the_land_without_buyers:0 "Land Without Buyers"
 AUH_the_land_without_buyers_desc:0 "Taken outright, the land changes hands without a price, so no bank will lend against it. The peasant has his field and nothing to work it with."
 AUH_the_valve_at_fiume:0 "The Valve at Fiume"
 AUH_the_valve_at_fiume_desc:0 "The emigrant traffic is licensed through our own port. The money orders come back to the village; the young men do not."
 AUH_the_returning_americans:0 "The Returning Americans"
 AUH_the_returning_americans_desc:0 "Tens of thousands come home with savings, a trade, and a year of American union meetings behind them. They buy land and they organise the men who did not leave."
 AUH_the_physicians_report:0 "The Physicians' Report"
 AUH_the_physicians_report_desc:0 "Charles is thirty-four and his lungs are watched. The court closes ranks around a sovereign it is quietly preparing to survive."
 AUH_the_bank_of_two_boards:0 "The Bank of Two Boards"
 AUH_the_bank_of_two_boards_desc:0 "The charter is renewed and the note issue stays common, governed by two boards that must agree. Money keeps its value and nothing is ever decided quickly."
 AUH_the_two_treasuries:0 "The Two Treasuries"
 AUH_the_two_treasuries_desc:0 "Each half stabilises its own money and answers for its own budget. Vienna stops paying for Budapest, and the old single market becomes an exchange rate."
 AUH_the_five_preferences:0 "The Preference of Five"
 AUH_the_five_preferences_desc:0 "A Danubian preferential grouping, first among equals with Belgrade and Bucharest. Trade flows again on terms that must be renegotiated with four capitals."
 AUH_the_price_written_in_london:0 "The Price Written in London"
 AUH_the_price_written_in_london_desc:0 "Rome asks for what the Treaty of London promised in 1915: the Trentino, the Tyrol to the Brenner, Trieste and the Istrian coast. Friendship at that price is bought, not made."
 AUH_the_schools_across_the_border:0 "Schools Across the Border"
 AUH_the_schools_across_the_border_desc:0 "Romanian and Serb schools funded better than the kingdoms next door fund theirs. The best answer to the ring is a village that compares and stays."
 AUH_the_orthodox_metropolitans:0 "The Orthodox Metropolitans"
 AUH_the_orthodox_metropolitans_desc:0 "Karlowitz and Sibiu are paid from the common purse and left to run their own schools. The clergy calms the villages and never quite belongs to us."
 AUH_the_ninety_eight_percent:0 "The Question Not Put"
 AUH_the_ninety_eight_percent_desc:0 "Tyrol and Salzburg answered this question in 1921 and the answer was almost unanimous. So it is not asked again, and everyone knows exactly why."
 AUH_the_burschenschaften:0 "The Duelling Fraternities"
 AUH_the_burschenschaften_desc:0 "The German student corporations are courted with chairs and stipends. The lecture halls fill and so do the ranks of a movement that wants a different capital."
 AUH_the_crown_council_of_1919:0 "The Crown in Commission"
 AUH_the_crown_council_of_1919_desc:0 "A council exercises the royal prerogative while the throne stands empty. Ministers can be argued with, which is new, and the army no longer knows whose oath it swore."
 AUH_the_two_books:0 "The Two Books"
 AUH_the_two_books_desc:0 "Two federal plans printed in London in 1942: eight states and some hundred and ten million in one, a democratic Danubian confederation in the other. Both assume we lose the habit of ruling."
 AUH_the_land_question_opened:0 "The Land Question Opened"
 AUH_the_land_question_opened_desc:0 "The neighbours reformed their land and we did not. The estates still feed the towns cheaply, and every Romanian and Slovak village has an argument nobody had to invent."
 AUH_the_dynastic_question:0 "The Dynastic Question"
 AUH_the_dynastic_question_desc:0 "A crown that survived the war must now survive its own succession. It still decides, and it decides in a country that has learned to imagine doing without it."
