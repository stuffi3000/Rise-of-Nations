###############################################################################
# Phase C: the four debts, the spirits that carry them, and the facts behind them
###############################################################################

 AUHSUR_tt_four_debts:0 "An empire that outlives 1918 does not return to 1913. It comes out with four debts: a constitution, a currency, the land, and the neighbours."
 AUHSUR_tt_manifesto_in_time:0 "Applied before Wilson answered, the manifesto federalises Cisleithania alone: the crownlands become national states and Hungary is not touched."
 AUHSUR_tt_nine_languages:0 "Article 19 recognised nine languages of daily use and no more. A language without a box on the form has no school and no clerk."
 AUHSUR_tt_no_majority:0 "1910, language of daily use in Cisleithania: German 35.58, Czech 23.02, Polish 17.77, Ruthene 12.58, Slovene 4.48. No people reaches thirty-six percent."
 AUHSUR_tt_two_votes:0 "Sixty delegates from each parliament, forty from the lower house and twenty from the upper, sitting alternately at Vienna and Budapest, voting separately."
 AUHSUR_tt_three_ministries:0 "Three common ministries only: foreign affairs, war, and a common finance that pays for the other two and administers Bosnia for nobody in particular."
 AUHSUR_tt_fifty_millions:0 "One customs area of close to fifty million people, one crown, one bank. The Hungarian agrarians and the Bohemian mills need each other more than either says aloud."
 AUHSUR_tt_contingent:0 "The recruit contingent was frozen by the law of 1889 at an order of magnitude of 103,000 men until 1912, while the population went from 45.4 to 49.5 million."
 AUHSUR_tt_zvonimir:0 "Croatia-Slavonia holds its own crown, its Ban and its Sabor, and holds them from Budapest under the Nagodba of 1868. Taking it out of Saint Stephen means taking it from Hungary."
 AUHSUR_tt_banja_luka:0 "Banja Luka, verdict 22 April 1916: 156 accused, sixteen sentenced to hang. The 1917 pardon came through Alfonso XIII and Benedict XV, not through Vienna."
 AUHSUR_tt_amnesty:0 "Kramar was arrested on 21 May 1915 and sentenced to death on 3 June 1916; the sentence became fifteen years, then the amnesty of 1917. Charles freed Hilsner on 24 March 1918."
 AUHSUR_tt_regency:0 "Otto was born on 20 November 1912. A regency is a government that must hand power back on a date everyone can count to."
 AUHSUR_tt_paragraph_fourteen:0 "From March 1914 to May 1917 the Empire was governed by paragraph 14, without a Reichsrat. Ordinance is quick, and it teaches the country that its parliament is optional."
 AUHSUR_tt_neighbours_reformed:0 "Romania, Czechoslovakia and Yugoslavia all made their land reform between 1919 and 1921. Hungary did not. Our peasants can see across the border."
 AUHSUR_tt_upper_house:0 "The Chamber of Magnates is the floor the Compromise stands on. Break the great estates and the men who vote the Ausgleich lose the ground they vote from."
 AUHSUR_tt_landless:0 "Around a million and a half landless labourers, and the farm-servant laws of 1898 and 1907 that punish a man for walking off a contract."
 AUHSUR_tt_fiume:0 "Hungarian Law IV of 1903 did not forbid emigration, it channelled it: the licence went to the Fiume route, so the men left through our own port and sent their money back to it."
 AUHSUR_tt_royal_rescript:0 "Kristoffy's weapon of 1905: universal male suffrage in a kingdom where 6.2 percent voted, in the open. It would not democratise Hungary, it would change which nation rules it."
 AUHSUR_tt_war_loans:0 "The first war loan was covered in eight days, the next three in thirty each, the last four in forty-six on average. Eight, thirty, forty-six: a country emptying itself."
 AUHSUR_tt_prague_overstamp:0 "Prague, night of 25 February 1919: borders shut to people, goods and post. From 3 to 9 March the notes were overstamped and a third of the cash withheld at one percent."
 AUHSUR_tt_geneva:0 "The Geneva protocols of 4 October 1922 bought a currency and paid for it with a commissioner living in the capital. Then a schilling in 1925 and a pengo in 1927."
 AUHSUR_tt_belvedere:0 "The Belvedere workshop: Popovici with his map, Hodza with his contacts, and an heir who never reigned. Every plan of 1919 was drafted there before 1914."
 AUHSUR_tt_older_capital:0 "Vienna carried an imperial title until 1806. Berlin's is younger, and Berlin knows it. Two German capitals is one more than Europe has room for."
 AUHSUR_tt_innsbruck:0 "Innsbruck, 3 November 1904: the Italian law faculty opened, four days of rioting followed, and among the 138 arrested were De Gasperi and Battisti."
 AUHSUR_tt_friedjung:0 "Zagreb in 1909, then the Friedjung trial at Vienna in December: the state prosecuted on papers its own legation had supplied, and Masaryk showed they were forged."
 AUHSUR_tt_tyrol_plebiscite:0 "The German Austrians said yes to union in November 1918, and Tyrol and Salzburg said it again by plebiscite in the spring of 1921, in the high nineties."
 AUHSUR_tt_bread_war:0 "From 1914 Hungary held the grain surplus, cut deliveries across the Leitha and refused fixed prices. Vienna rationed. The Compromise was never only about money."

