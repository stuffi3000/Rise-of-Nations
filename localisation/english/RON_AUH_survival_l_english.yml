l_english:

###############################################################################
# Austria-Hungary - phase C, the empire that outlived 1918. Lot H. Every key below is new.
###############################################################################

 AUHSUR_tt_counterfactual:0 "The Monarchy did not exist after 1918. Every step of this branch is a counterfactual built on a project that was really written down."
 AUHSUR_tt_manifesto:0 "The imperial manifesto was signed 16 October 1918 and published the 17th. Wilson answered on the 18th that federalism no longer sufficed."
 AUHSUR_tt_oath:0 "The coronation oath sworn at Budapest on 30 December 1916 binds the King to the Hungarian constitution."
 AUHSUR_tt_renewal:0 "The decennial term still falls due in 1927, 1937 and 1947, and it can still fail."
 AUHSUR_tt_quota:0 "Hungary's share of common spending: 30 percent in 1867, 33.06 in 1897, 36.4 in 1907. Never once downward."
 AUHSUR_tt_cadastre:0 "The Moravian Compromise of 1905, Bukovina 1910, Galicia 1914: a national register, a curia for each people."
 AUHSUR_tt_may_declaration:0 "Read in the Reichsrat on 30 May 1917 by the Yugoslav Club: one South Slav body, under the Habsburg sceptre."
 AUHSUR_tt_popovici:0 "Aurel Popovici, Leipzig 1906: Die Vereinigten Staaten von Gross-Oesterreich, fifteen national states and a map."
 AUHSUR_the_empire_that_did_not_fall:0 "The Empire That Did Not Fall"
 AUHSUR_the_empire_that_did_not_fall_desc:0 "No Saint-Germain, no Trianon. Fifty-one million subjects from the 1910 census, a war ended, a manifesto never applied, and a contract that still falls due every ten years."
 AUHSUR_con_the_manifesto_completed:0 "The Manifesto Completed"
 AUHSUR_con_the_manifesto_completed_desc:0 "Signed on the 16th, printed on the 17th, dead on the 18th. Applied in time it federalises Cisleithania alone: the crownlands become national states, and Hungary is not touched."
 AUHSUR_con_the_third_crown:0 "The Third Crown"
 AUHSUR_con_the_third_crown_desc:0 "The Yugoslav Club asked for it out loud on 30 May 1917, under the Habsburg sceptre. A South Slav kingdom beside Austria and Hungary, and the Crown of Saint Stephen loses Croatia."
 AUHSUR_con_the_fifteen_states:0 "The United States of Greater Austria"
 AUHSUR_con_the_fifteen_states_desc:0 "Popovici printed the map in Leipzig in 1906 and the Belvedere kept a copy. Fifteen national states under one crown, granted by decree, with the common army standing behind the decree."
 AUHSUR_con_the_quota_renegotiated:0 "The Quota Renegotiated"
 AUHSUR_con_the_quota_renegotiated_desc:0 "No new constitution. The old contract, priced again, with the same two delegations and the same arithmetic that has only ever moved one way."
 AUHSUR_con_the_national_councils_seated:0 "The National Councils Seated"
 AUHSUR_con_the_national_councils_seated_desc:0 "In October 1918 the national councils formed faster than the ministries could answer them. Seated as chambers instead of chased as rivals, a secession becomes a constitution."
 AUHSUR_con_the_language_law_at_last:0 "The Language Law At Last"
 AUHSUR_con_the_language_law_at_last_desc:0 "Badeni's ordinances brought riots in 1897 and Clary-Aldringen withdrew them in 1899. Nothing replaced them for nineteen years. A statute cannot be repealed by the next minister in office."
 AUHSUR_con_the_moravian_model_extended:0 "The Moravian Model Extended"
 AUHSUR_con_the_moravian_model_extended_desc:0 "Moravia settled in 1905, Bukovina copied it in 1910, Galicia in 1914. Every voter is entered on a national register and votes in his own curia. It worked three times at provincial scale."
 AUHSUR_con_the_bohemian_deadlock_broken:0 "The Bohemian Deadlock Broken"
 AUHSUR_con_the_bohemian_deadlock_broken_desc:0 "The one province where the register never took. Germans and Czechs live in the same towns, not in separate districts, and both sides read partition into every line of the draft."
 AUHSUR_con_a_chamber_of_nationalities:0 "A Chamber of Nationalities"
 AUHSUR_con_a_chamber_of_nationalities_desc:0 "An upper house where peoples sit instead of provinces, and where a veto costs a vote instead of an obstruction. The Reichsrat spent twenty years being shouted down."
 AUHSUR_con_the_dualism_that_remains:0 "The Dualism That Remains"
 AUHSUR_con_the_dualism_that_remains_desc:0 "Half a federation. Beyond the Leitha the county gentry still elect a Hungarian chamber on an open ballot, and every reform of this branch stops at the river."
 AUHSUR_con_the_federal_constitution:0 "The Federal Constitution"
 AUHSUR_con_the_federal_constitution_desc:0 "Cisleithania is a federation of national states and Hungary is a kingdom that shares an army with it. It is not tidy, and no one drew it that way on purpose."
 AUHSUR_con_the_may_declaration_honoured:0 "The May Declaration Honoured"
 AUHSUR_con_the_may_declaration_honoured_desc:0 "Thirty-three deputies of the Yugoslav Club, 30 May 1917, the day the Reichsrat reopened. They asked inside the Monarchy, not outside it, and no one in Vienna answered them."
 AUHSUR_con_the_crown_of_zvonimir:0 "A Crowning at Zagreb"
 AUHSUR_con_the_crown_of_zvonimir_desc:0 "Vienna, Budapest, and now a third coronation. A ceremony is not a constitution, but in this monarchy the oath sworn at a coronation is what the courts read afterwards."
 AUHSUR_con_croatia_leaves_saint_stephen:0 "Croatia Leaves Saint Stephen"
 AUHSUR_con_croatia_leaves_saint_stephen_desc:0 "The Nagodba of 1868 tied Zagreb to Budapest and gave the Sabor forty delegates in the Hungarian chamber. Cutting it is the whole price of the third crown, and Hungary sends the bill."
 AUHSUR_con_the_littoral_in_the_third_crown:0 "The Littoral Question"
 AUHSUR_con_the_littoral_in_the_third_crown_desc:0 "Trieste, Gorizia, Istria and Fiume. An Italian city inside a South Slav kingdom, and a Hungarian port that Budapest ran directly. Somebody loses whichever way the line is drawn."
 AUHSUR_con_the_ban_and_the_sabor:0 "The Ban and the Sabor"
 AUHSUR_con_the_ban_and_the_sabor_desc:0 "A parliament at Zagreb with a budget of its own and a Ban who answers to it rather than to Budapest. Khuen-Hedervary ran Croatia for twenty years the other way round."
 AUHSUR_con_the_serbs_of_the_monarchy_answered:0 "The Serbs of the Monarchy"
 AUHSUR_con_the_serbs_of_the_monarchy_answered_desc:0 "Karlowitz keeps its church autonomy, the Zagreb treason trial of 1909 is disavowed, and the forged papers of the Friedjung case are named for what they were."
 AUHSUR_con_the_trialist_constitution:0 "The Trialist Constitution"
 AUHSUR_con_the_trialist_constitution_desc:0 "Three crowns, one army, one foreign ministry. Franz Ferdinand's people argued for this from the Belvedere for fourteen years and never had the chance to try it."
 AUHSUR_con_the_map_of_1906:0 "The Map of 1906"
 AUHSUR_con_the_map_of_1906_desc:0 "Popovici drew fifteen states, and he drew them where the languages actually were, not where the crownlands were. Every border on that map cuts a province that exists."
 AUHSUR_con_the_oath_set_aside:0 "The Oath Set Aside"
 AUHSUR_con_the_oath_set_aside_desc:0 "On 30 December 1916 the King swore at Budapest to keep the Hungarian constitution. That oath is exactly why the manifesto of October 1918 stopped at the Leitha."
 AUHSUR_con_the_army_behind_the_decree:0 "The Army Behind the Decree"
 AUHSUR_con_the_army_behind_the_decree_desc:0 "The one institution that is neither Austrian nor Hungarian: one oath, one officer corps, some seventy German words of command and regimental languages for everything else."
 AUHSUR_con_the_hungarian_revolt:0 "The Hungarian Revolt"
 AUHSUR_con_the_hungarian_revolt_desc:0 "The county assemblies refuse the tax, the Honved officers refuse the transfer, and Budapest calls the decree what it is. This is the bill for governing by octroi."
 AUHSUR_con_the_new_cadastre:0 "The Register of Peoples"
 AUHSUR_con_the_new_cadastre_desc:0 "Every subject entered under a nationality, every school and court assigned to one. It is the Moravian machinery run at the scale of an empire, and it fixes identities that used to drift."
 AUHSUR_con_the_fifteen_diets:0 "The Fifteen Diets"
 AUHSUR_con_the_fifteen_diets_desc:0 "Fifteen assemblies with a school budget, a police and a language, and one imperial parliament above them that does defence, tariffs and the crown. Nobody has ever run a state this way."
 AUHSUR_con_gross_oesterreich:0 "Gross-Oesterreich"
 AUHSUR_con_gross_oesterreich_desc:0 "Granted, not agreed. It gives every people what the parliaments never would, and it teaches all of them that a decree is how this empire settles things."
 AUHSUR_con_the_delegations_reformed:0 "The Delegations Reformed"
 AUHSUR_con_the_delegations_reformed_desc:0 "Sixty members from each side, two thirds from the lower house, sitting alternately at Vienna and Budapest and never in the same room. They vote the common budget and nothing else."
 AUHSUR_con_the_common_ministries_pruned:0 "The Common Ministries Pruned"
 AUHSUR_con_the_common_ministries_pruned_desc:0 "Three common ministers: war, foreign affairs, and the finance that pays for both. Everything else has been duplicated twice over since 1867, at two capitals and two payrolls."
 AUHSUR_con_the_term_of_1927:0 "The Term of 1927"
 AUHSUR_con_the_term_of_1927_desc:0 "Ten years of tariffs, bank charter and quota, renewed all at once or not at all. It has failed before: the provisorium of 1907 ran on decrees while the two governments shouted."
 AUHSUR_con_the_customs_clause:0 "The Customs Clause"
 AUHSUR_con_the_customs_clause_desc:0 "The Szell formula of 1899 put a clock on the customs union, and every renewal since has restarted it. One market of fifty millions holds only as long as the clause is signed again."
 AUHSUR_con_two_states_one_army:0 "Two States, One Army"
 AUHSUR_con_two_states_one_army_desc:0 "The contingent was frozen at 103 100 recruits by the law of 1889 and only unfrozen in 1912, because one half of the empire held a veto over the other half's soldiers."
 AUHSUR_con_the_personal_union_approaches:0 "The Personal Union Approaches"
 AUHSUR_con_the_personal_union_approaches_desc:0 "Every renewal has given Budapest a little more and taken a little less. Carried to its end the common state is one man wearing two crowns, and the Kossuth party has said so since 1848."
 AUHSUR_con_the_dual_monarchy_endures:0 "The Dual Monarchy Endures"
 AUHSUR_con_the_dual_monarchy_endures_desc:0 "Nothing has been solved and everything has been paid for. This is the cheapest of the four roads and the only one that guarantees the same argument again in ten years."
 AUHSUR_tt_land:0 "Romania, Czechoslovakia and Yugoslavia all carried a land reform in 1919-1921. Hungary did not, and the villages could see across the border."
 AUHSUR_tt_apponyi:0 "Laws XXVI and XXVII of 31 May 1907: Hungarian compulsory in every primary school, four hours a week at least for non-Magyar children."
 AUHSUR_tt_franchise:0 "The Hungarian electorate stayed well under a tenth of the population, and the rural ballot was cast out loud."
 AUHSUR_tt_emigration:0 "Official Hungarian emigration: 38 888 in 1900, 55 377 in 1901, of whom 31 092 sailed for America."
 AUHSUR_hun_the_crown_of_saint_stephen:0 "The Crown of Saint Stephen"
 AUHSUR_hun_the_crown_of_saint_stephen_desc:0 "Budapest ended the war with its grain, its gentry and its constitution intact. The kingdom is the pillar the Compromise rests on, and it is also the part of the empire nothing has yet reached."
 AUHSUR_hun_the_imperial_land_reform:0 "The Imperial Land Reform"
 AUHSUR_hun_the_imperial_land_reform_desc:0 "Every neighbour did it between 1919 and 1921. Doing it here means the crown breaking up the estates of the men who have carried the Compromise since 1867, and doing it in their own kingdom."
 AUHSUR_hun_the_magnates_bargain:0 "The Magnates Keep Their Land"
 AUHSUR_hun_the_magnates_bargain_desc:0 "The upper house at Budapest is a chamber of landowners and bishops, and it is where the Compromise is actually voted. Leave the estates alone and the kingdom stays loyal at everyone else's expense."
 AUHSUR_hun_the_franchise_instead:0 "The Franchise Instead"
 AUHSUR_hun_the_franchise_instead_desc:0 "In 1905 the crown threatened Budapest with universal suffrage and the magnates folded within a year. The threat was real, it was never carried out, and it costs the crown no land at all."
 AUHSUR_hun_the_thousand_holdings:0 "The Land of the Thousand Holdings"
 AUHSUR_hun_the_thousand_holdings_desc:0 "A handful of families hold estates counted in thousands of holds, and something like a million and a half day labourers hold nothing at all. The census of 1910 counted them as agricultural workers."
 AUHSUR_hun_the_land_commission:0 "The Land Commission"
 AUHSUR_hun_the_land_commission_desc:0 "A commission that surveys, values and divides, sitting in the county towns where the county gentry are also the magistrates. Every neighbour that did this needed five years and a police force."
 AUHSUR_hun_compensation_in_bonds:0 "Compensation in Bonds"
 AUHSUR_hun_compensation_in_bonds_desc:0 "The state buys the estates and pays in paper, as Bucharest and Prague did. It is slow, it is expensive, and it leaves the great families rich enough to stay loyal."
 AUHSUR_hun_expropriation_without_payment:0 "Expropriation Without Payment"
 AUHSUR_hun_expropriation_without_payment_desc:0 "The land is taken and the village is told who took it for them. It is the fastest reform in Europe and it makes an enemy of the class that votes the common budget."
 AUHSUR_hun_the_farm_servants_freed:0 "The Farm Servants Freed"
 AUHSUR_hun_the_farm_servants_freed_desc:0 "The servant laws of 1898 and 1907 punished a labourer who walked off a contract. Repealing them turns a bound workforce into a market, and the estates find out what wages cost."
 AUHSUR_hun_the_villages_of_transylvania:0 "The Villages of Transylvania"
 AUHSUR_hun_the_villages_of_transylvania_desc:0 "A Romanian village on this side of the Carpathians can see what a Romanian village on the other side was given in 1921. That comparison is the whole argument, and it now runs our way."
 AUHSUR_hun_the_upper_lands_kept:0 "The Upper Lands Kept"
 AUHSUR_hun_the_upper_lands_kept_desc:0 "The Slovak highlands sent their young men to Pennsylvania and their money home in postal orders. Land at home is the only argument that has ever beaten a steamship ticket."
 AUHSUR_hun_a_kingdom_of_smallholders:0 "A Kingdom of Smallholders"
 AUHSUR_hun_a_kingdom_of_smallholders_desc:0 "The Chamber of Magnates is a debating society, the plain is full of freeholders, and the crown has bought the loyalty of four nationalities with land it did not own."
 AUHSUR_hun_the_chamber_of_magnates_holds:0 "The Chamber of Magnates Holds"
 AUHSUR_hun_the_chamber_of_magnates_holds_desc:0 "Reformed in 1885 and still an assembly of landowners, prelates and princes. It is the veto that no Hungarian election can move, and while it is fed it delivers the kingdom."
 AUHSUR_hun_the_land_credit_institute:0 "The Land Credit Institute"
 AUHSUR_hun_the_land_credit_institute_desc:0 "Mortgage credit at rates only an estate can get, secured on land that entail forbids anyone to sell. The system is designed so that great property cannot be broken by debt."
 AUHSUR_hun_the_emigration_valve:0 "The Emigration Valve"
 AUHSUR_hun_the_emigration_valve_desc:0 "Thirty-eight thousand left in 1900 and fifty-five thousand in 1901. A man who sails does not join a party, and the estates keep both their acres and their quiet."
 AUHSUR_hun_the_gendarmerie_in_the_villages:0 "The Gendarmerie in the Villages"
 AUHSUR_hun_the_gendarmerie_in_the_villages_desc:0 "The agrarian socialists organised the harvest strikes of the plain, and the answer was a squadron of gendarmes per county. It works, and it is remembered for a generation."
 AUHSUR_hun_the_lex_apponyi_renewed:0 "The Lex Apponyi Renewed"
 AUHSUR_hun_the_lex_apponyi_renewed_desc:0 "Laws XXVI and XXVII of 1907 made Hungarian compulsory in every primary school, church schools included. It made teachers of the state out of village priests, and enemies of their pupils."
 AUHSUR_hun_the_comparison_across_the_border:0 "The Comparison Across the Border"
 AUHSUR_hun_the_comparison_across_the_border_desc:0 "Bucharest and Prague hand out land and we hand out school inspectors. The argument writes itself in every market town from Kassa to Brasso, and nobody has to invent a word of it."
 AUHSUR_hun_the_kingdom_unchanged:0 "The Kingdom Unchanged"
 AUHSUR_hun_the_kingdom_unchanged_desc:0 "Saint Stephen's crown comes out of the war exactly as it went in, which is what its parliament wanted. The bill is paid quietly, in villages, by people who do not sit in it."
 AUHSUR_hun_the_crowns_old_weapon:0 "The Crown's Old Weapon"
 AUHSUR_hun_the_crowns_old_weapon_desc:0 "In 1905 Franz Joseph put in the Fejervary cabinet and let it threaten universal suffrage. The coalition that had defied him surrendered inside a year rather than face a wider electorate."
 AUHSUR_hun_the_secret_ballot:0 "The Secret Ballot"
 AUHSUR_hun_the_secret_ballot_desc:0 "The rural voter states his choice aloud in front of the county official who collects his taxes. Cisleithania had the secret ballot; the other half of the empire never did."
 AUHSUR_hun_the_nationalities_vote:0 "The Nationalities Vote"
 AUHSUR_hun_the_nationalities_vote_desc:0 "Four Slovak deputies entered the Budapest chamber in 1901 after seventeen years of abstention, out of four hundred and thirteen seats. A real franchise changes that number entirely."
 AUHSUR_hun_the_party_of_work_breaks:0 "The Party of Work Breaks"
 AUHSUR_hun_the_party_of_work_breaks_desc:0 "Tisza built the majority by rewriting the rules of order in 1912 and 1913 so that obstruction became impossible. A mass electorate breaks the machine that trick was built to protect."
 AUHSUR_hun_the_lex_apponyi_repealed:0 "The Lex Apponyi Repealed"
 AUHSUR_hun_the_lex_apponyi_repealed_desc:0 "The school laws of 1907 go, and with them the requirement that a Slovak or Romanian child master Hungarian by the fourth year. The teachers stay; the inspectors do not."
 AUHSUR_hun_a_hungary_of_all_its_peoples:0 "A Hungary of All Its Peoples"
 AUHSUR_hun_a_hungary_of_all_its_peoples_desc:0 "The kingdom keeps its land and loses its monopoly. The gentry hold their acres and no longer hold the chamber, which is the reverse of every bargain struck since 1867."
 AUHSUR_tt_sixtus:0 "Charles wrote to Prince Sixtus of Bourbon-Parma on 24 March 1917. Clemenceau printed the letter on 12 April 1918 and Spa followed in May."
 AUHSUR_tt_dynasty:0 "Charles was born 17 August 1887, Zita on 9 May 1892, Otto on 20 November 1912. In the world without the empire, Charles died at Funchal on 1 April 1922, aged thirty-four."
 AUHSUR_tt_habsburg_law:0 "On 3 April 1919 the Austrian assembly banished the House unless it renounced, confiscated its property, and abolished nobility the same day."
 AUHSUR_dyn_the_house_that_stayed:0 "The House That Stayed"
 AUHSUR_dyn_the_house_that_stayed_desc:0 "A sovereign who never abdicated, a wife of thirty, a son of six. Everything the dynasty is worth after the war depends on which of the three the state is arranged around."
 AUHSUR_dyn_charles_reigns:0 "Charles Reigns"
 AUHSUR_dyn_charles_reigns_desc:0 "He is thirty-one, he is crowned, and half of Europe has read his letter to Prince Sixtus. A reign that continues has to answer for it rather than wait for it to be forgotten."
 AUHSUR_dyn_the_regency_for_otto:0 "A Regency for Otto"
 AUHSUR_dyn_the_regency_for_otto_desc:0 "Abdication in favour of the boy, with a council of regency: the solution the entourage discussed at Eckartsau and did not take. It removes the man the Sixtus affair compromised."
 AUHSUR_dyn_the_crown_in_commission:0 "The Crown in Commission"
 AUHSUR_dyn_the_crown_in_commission_desc:0 "The empire keeps the House and stops being run by it. A crown council governs, the civil list is voted, and the throne becomes an office with an occupant."
 AUHSUR_dyn_the_sixtus_letter_answered:0 "The Sixtus Letter Answered"
 AUHSUR_dyn_the_sixtus_letter_answered_desc:0 "He wrote it, his brother-in-law carried it, and Clemenceau published it. Owning the letter costs him Berlin and buys him every capital that wanted the war ended in 1917."
 AUHSUR_dyn_the_amnesty_renewed:0 "The Amnesty Renewed"
 AUHSUR_dyn_the_amnesty_renewed_desc:0 "In July 1917 he pardoned the men his father's courts had condemned, Kramar among them. Doing it again after the war empties the prisons of everyone the war made a traitor."
 AUHSUR_dyn_the_second_coronation:0 "The Second Coronation"
 AUHSUR_dyn_the_second_coronation_desc:0 "The oath of 30 December 1916 was sworn on a constitution that the war then suspended. Swearing it again in peacetime is either a promise kept or a promise the crown must now keep."
 AUHSUR_dyn_the_imperial_health:0 "The Imperial Health"
 AUHSUR_dyn_the_imperial_health_desc:0 "He is thirty-four in 1922 and his lungs are bad. In the world where the empire fell, that was enough to kill him on an island off Africa. Here it is a risk with a court behind it."
 AUHSUR_dyn_the_family_statute:0 "The Family Statute"
 AUHSUR_dyn_the_family_statute_desc:0 "Who may marry, who may sit, who may inherit. Franz Ferdinand swore away his children's rights on 28 June 1900 under this rule, and it has been the House's private law ever since."
 AUHSUR_dyn_the_emperor_who_lived:0 "The Emperor Who Lived"
 AUHSUR_dyn_the_emperor_who_lived_desc:0 "A sovereign in his fifties in the 1940s, with a reign that began in war and a son grown up in public. The one thing the House has that no successor state has is continuity."
 AUHSUR_dyn_the_council_of_regency:0 "The Council of Regency"
 AUHSUR_dyn_the_council_of_regency_desc:0 "A board of three: the widow, the primate and the common finance minister. Regencies govern by ordinance because they cannot risk a vote, and everyone knows how long this one has to run."
 AUHSUR_dyn_zita_of_bourbon_parma:0 "Zita of Bourbon-Parma"
 AUHSUR_dyn_zita_of_bourbon_parma_desc:0 "Born 9 May 1892, of a family the Vienna press called Italian and the Vienna army called French. She carried the Sixtus letter's whole reputation and she never once denied it."
 AUHSUR_dyn_the_regency_by_ordinance:0 "The Regency by Ordinance"
 AUHSUR_dyn_the_regency_by_ordinance_desc:0 "Paragraph 14 was written for a chamber that would not sit. Used by a regency it becomes the ordinary way of governing, and the parliament learns to wait the boy out."
 AUHSUR_dyn_the_tutors_of_the_boy_king:0 "The Tutors of the Boy King"
 AUHSUR_dyn_the_tutors_of_the_boy_king_desc:0 "Eleven languages in the household, a Hungarian tutor, a Czech confessor and a Croatian nurse. It is the only education in Europe designed to produce a man of no single nationality."
 AUHSUR_dyn_the_majority_of_1930:0 "The Majority of 1930"
 AUHSUR_dyn_the_majority_of_1930_desc:0 "He turns eighteen on 20 November 1930. A regency ends on a date fixed in advance, which is the one advantage it has over every other provisional government in the empire's history."
 AUHSUR_dyn_the_king_crowned_at_budapest:0 "The King Crowned at Budapest"
 AUHSUR_dyn_the_king_crowned_at_budapest_desc:0 "Saint Stephen's crown, the mound of earth from every county, the oath on the constitution. The kingdom has never accepted a king who skipped it, and this one will not skip it."
 AUHSUR_dyn_the_crown_council:0 "The Crown Council"
 AUHSUR_dyn_the_crown_council_desc:0 "The common ministerial council decided on war in July 1914 with seven men in a room. Made permanent and answerable to the delegations, it becomes a cabinet instead of a conspiracy."
 AUHSUR_dyn_our_own_habsburg_law:0 "Our Own Habsburg Law"
 AUHSUR_dyn_our_own_habsburg_law_desc:0 "Vienna passed one on 3 April 1919: renounce or be banished, and the estates confiscated. Passing our own version means the House keeps the throne and loses the private empire around it."
 AUHSUR_dyn_the_nobility_abolished:0 "The Nobility Abolished"
 AUHSUR_dyn_the_nobility_abolished_desc:0 "Titles, particles and coats of arms went in Austria on the same day as the House, by one page of law. Here it takes the Chamber of Magnates with it, and the Compromise leans on that chamber."
 AUHSUR_dyn_the_president_of_the_federation:0 "The President of the Federation"
 AUHSUR_dyn_the_president_of_the_federation_desc:0 "An emperor who opens the session, signs what the chamber sends him and commands an army he does not deploy alone. Nobody proposed this in 1919, and every year after it makes more sense."
 AUHSUR_dyn_a_crowned_republic:0 "A Crowned Republic"
 AUHSUR_dyn_a_crowned_republic_desc:0 "The House survives by giving up what made it a house. It is the least likely of the three roads and the only one that no successor state could have called illegitimate."
 AUHSUR_tt_crown:0 "The crown was fixed at 0.3049 grams of fine gold at 900 thousandths in the reform a Hungarian minister, Sandor Wekerle, began in 1892."
 AUHSUR_tt_two_moneys:0 "In the world where the empire fell there were two currencies for one old market: an Austrian schilling in 1924-1925, a Hungarian pengo in 1927."
 AUHSUR_tt_hantos:0 "Elemer Hantos, 1880-1942: Hungarian state secretary for commerce in 1917, League of Nations economic expert in 1924. His programme is a Danubian economy with Germany left out of it."
 AUHSUR_tt_tardieu:0 "The Tardieu plan of 1932 proposed a preferential group of five Danubian states. Berlin and Rome killed it at London the same spring."
 AUHSUR_threat_berlin_bloc:0 "A German bloc on the Danube"
 AUHSUR_threat_danube_free_hand:0 "A free hand up the Danube"
 AUHSUR_tt_london_price:0 "Rome's price was written down on 26 April 1915: Trentino, South Tyrol to the Brenner, Trieste, Gorizia-Gradisca, Istria and a share of Dalmatia."
 AUHSUR_eco_the_war_paid_in_paper:0 "The War Paid in Paper"
 AUHSUR_eco_the_war_paid_in_paper_desc:0 "Four years of war were financed by printing, and the note issue is now a common institution with two governments behind it. Without one money there is no one market."
 AUHSUR_eco_one_crown_one_bank:0 "One Crown, One Bank"
 AUHSUR_eco_one_crown_one_bank_desc:0 "The Austro-Hungarian Bank keeps its privilege and both governments keep their hands off the press. It is dear, it is deflationary, and it is the only version where the market survives whole."
 AUHSUR_eco_two_stabilisations:0 "Two Stabilisations"
 AUHSUR_eco_two_stabilisations_desc:0 "Each half saves its own money with its own foreign loan and its own customs house. It is what the successor states actually did, and it turns one market into two overnight."
 AUHSUR_eco_the_paper_repudiated:0 "The Paper Repudiated"
 AUHSUR_eco_the_paper_repudiated_desc:0 "Let the note issue run and the war debt burn with it. Industry buys its plant with worthless money, and every war loan bought by a schoolteacher becomes wallpaper."
 AUHSUR_eco_the_bank_charter_renewed:0 "The Bank Charter Renewed"
 AUHSUR_eco_the_bank_charter_renewed_desc:0 "The note-issuing privilege comes up with the rest of the contract, and it is the one clause both halves have always signed. A bank with two head offices is still one bank."
 AUHSUR_eco_the_gold_parity:0 "The Gold Parity"
 AUHSUR_eco_the_gold_parity_desc:0 "Wekerle put the empire on gold in 1892 and it held until 1914. Getting back on means years of dear money and taxes that fall on the two capitals hardest."
 AUHSUR_eco_one_market_of_fifty_millions:0 "One Market of Fifty Millions"
 AUHSUR_eco_one_market_of_fifty_millions_desc:0 "The census of 1910 counted 51 390 223 people behind a single tariff wall. Bohemian industry and the Hungarian plain need each other far more than either says out loud."
 AUHSUR_eco_the_common_budget_balanced:0 "The Common Budget Balanced"
 AUHSUR_eco_the_common_budget_balanced_desc:0 "Own revenue first, then the customs yield, then two per cent charged to Hungary for the old Military Frontier, then the quota on what is left. That is the whole arithmetic of the empire."
 AUHSUR_eco_the_loan_from_geneva:0 "The Loan from Geneva"
 AUHSUR_eco_the_loan_from_geneva_desc:0 "A League loan with a commissioner attached to watch the budget. Austria took one on 4 October 1922 and paid for it in sovereignty; taking two of them costs twice."
 AUHSUR_eco_two_customs_houses:0 "Two Customs Houses"
 AUHSUR_eco_two_customs_houses_desc:0 "A tariff line on the Leitha, staffed on both banks. Every wagon of Bohemian cloth going east and every wagon of Hungarian wheat coming west now stops and pays."
 AUHSUR_eco_the_crown_and_its_rival:0 "The Crown and Its Rival"
 AUHSUR_eco_the_crown_and_its_rival_desc:0 "Budapest wants its own unit and its own note issue, and the arguments for it are the arguments of 1867 said again in the language of finance."
 AUHSUR_eco_the_tariff_wall_within:0 "The Tariff Wall Within"
 AUHSUR_eco_the_tariff_wall_within_desc:0 "Two treasuries, two tariffs and one army to pay for. The quota argument stops being about percentages and starts being about whether there is a common state left to fund."
 AUHSUR_eco_the_printing_press:0 "The Printing Press"
 AUHSUR_eco_the_printing_press_desc:0 "The state owes more than it can tax and it owns the press. Inflation is a tax nobody votes for, and it is collected first from whoever holds paper."
 AUHSUR_eco_the_rentiers_ruined:0 "The Rentiers Ruined"
 AUHSUR_eco_the_rentiers_ruined_desc:0 "War loans were sold to clerks, widows and village savings banks as a patriotic duty. They are now worth the paper, and the class that bought them was the crown's most reliable one."
 AUHSUR_eco_the_debt_burned:0 "The Debt Burned"
 AUHSUR_eco_the_debt_burned_desc:0 "Four years of war borrowing settled at a fraction of a crown in the crown. No foreign lender will look at the empire for a decade, and no domestic one will either."
 AUHSUR_eco_the_industry_bought_cheap:0 "The Industry Bought Cheap"
 AUHSUR_eco_the_industry_bought_cheap_desc:0 "Whoever holds plant instead of paper comes out of the inflation owning the country. In Bohemia and Lower Austria that is a very short list of banks and families."
 AUHSUR_eco_hantos_and_mitteleuropa:0 "Hantos and Mitteleuropa"
 AUHSUR_eco_hantos_and_mitteleuropa_desc:0 "A Hungarian who wants a Danubian economy and wants Germany kept out of it. In the world without the empire he spent twenty years trying to rebuild what we still have."
 AUHSUR_eco_the_institute_at_vienna:0 "The Institute at Vienna"
 AUHSUR_eco_the_institute_at_vienna_desc:0 "January 1929. A research bureau that publishes tariff schedules, freight rates and clearing balances until governments start quoting them back."
 AUHSUR_eco_the_institute_at_brno:0 "The Institute at Brno"
 AUHSUR_eco_the_institute_at_brno_desc:0 "September 1929, in the one province where a national compromise actually worked. Putting the Czech economists inside the programme is the whole point of putting it there."
 AUHSUR_eco_the_institute_at_budapest:0 "The Institute at Budapest"
 AUHSUR_eco_the_institute_at_budapest_desc:0 "May 1930, and the last of the three. Hantos was a deputy of the Party of Work and a state secretary for commerce: this is Budapest arguing for the common market, not against it."
 AUHSUR_eco_the_offer_from_berlin:0 "The Offer from Berlin"
 AUHSUR_eco_the_offer_from_berlin_desc:0 "In March 1931 Berlin and Vienna announced a customs union and France broke it inside six months, with a court at The Hague to help. Offered to an empire it is a bigger prize and a bigger leash."
 AUHSUR_eco_the_tardieu_plan:0 "The Tardieu Plan"
 AUHSUR_eco_the_tardieu_plan_desc:0 "Paris proposed a preferential group of five Danubian states in 1932 and Berlin and Rome killed it at London. Proposed to an empire that still exists, there is nobody left to kill it."
 AUHSUR_eco_the_rome_protocols:0 "The Rome Protocols"
 AUHSUR_eco_the_rome_protocols_desc:0 "Rome answered Paris on 17 March 1934 with a bloc of its own. Italy will recognise anything the empire wants inland, and the bill is the one written on 26 April 1915."
 AUHSUR_eco_the_customs_union_signed:0 "The Customs Union Signed"
 AUHSUR_eco_the_customs_union_signed_desc:0 "Seventy millions in one tariff area, with the heavy industry and the coal on the northern side of it. Vienna sets the schedule of goods and Berlin sets the price of everything."
 AUHSUR_eco_the_junior_partner:0 "The Junior Partner"
 AUHSUR_eco_the_junior_partner_desc:0 "Spa in May 1918 tied the Monarchy to Germany by an alliance of arms and a customs treaty. This is the same bargain signed in peacetime, and it ends the same way."
 AUHSUR_eco_the_danubian_settlement:0 "The Danubian Settlement"
 AUHSUR_eco_the_danubian_settlement_desc:0 "Preferential tariffs among five states, with the empire as the largest of them. It is the arrangement everyone in Central Europe agreed was needed and nobody could ever sign."
 AUHSUR_eco_the_preference_of_five:0 "The Preference of Five"
 AUHSUR_eco_the_preference_of_five_desc:0 "Grain moves west, machines move east, and the tariff on both is lower for members than for anyone else. The empire is first among equals and pays for the privilege in vetoes."
 AUHSUR_eco_the_price_of_the_littoral:0 "The Price of the Littoral"
 AUHSUR_eco_the_price_of_the_littoral_desc:0 "Trieste, Gorizia, Istria and the Brenner. Rome has been asking the same price since 1915 and it has never once lowered it, whoever was sitting in Vienna."
 AUHSUR_eco_the_adriatic_bargain:0 "The Adriatic Bargain"
 AUHSUR_eco_the_adriatic_bargain_desc:0 "Italy gets the coast it wants and the empire gets a free hand up the Danube. It is a clean trade and it sells the loyalty of the people who live on the coast."
 AUHSUR_eco_the_steel_of_witkowitz:0 "The Steel of Witkowitz"
 AUHSUR_eco_the_steel_of_witkowitz_desc:0 "Moravian ore, Silesian coke and the largest ironworks in the Monarchy. It is what makes this a middle power rather than a large market with a good army."
 AUHSUR_eco_skoda_at_pilsen:0 "Skoda at Pilsen"
 AUHSUR_eco_skoda_at_pilsen_desc:0 "Guns for the common army and guns for anyone who pays. The works at Pilsen are the reason a Czech secession would have cost Vienna its artillery, and everyone in the Hofburg knew it."
 AUHSUR_eco_the_oil_of_boryslaw:0 "The Oil of Boryslaw"
 AUHSUR_eco_the_oil_of_boryslaw_desc:0 "Galician crude, and the only oil the empire has. It is not enough for a modern war and it is exactly enough to make Galicia worth quarrelling over."
 AUHSUR_eco_the_works_at_resita:0 "The Works at Resita"
 AUHSUR_eco_the_works_at_resita_desc:0 "Iron in the Banat, worked since the eighteenth century, in a district where the villages are Romanian, German and Serb by turns. Industry sits exactly where the nationality question is worst."
 AUHSUR_tt_entente:0 "The Little Entente was built by three conventions: Prague and Belgrade on 14 August 1920, Prague and Bucharest on 23 April 1921, Bucharest and Belgrade on 7 June 1921."
 AUHSUR_tt_entente_object:0 "Its declared object was to prevent a Habsburg restoration. Against an empire that still exists it needs a different reason, and Paris pays for one."
 AUHSUR_tt_awards:0 "In the world without the empire, two border awards were dictated in a Vienna palace, in November 1938 and August 1940, by Berlin and Rome."
 AUHSUR_dip_the_ring_that_forms_anyway:0 "The Ring That Forms Anyway"
 AUHSUR_dip_the_ring_that_forms_anyway_desc:0 "Belgrade, Bucharest and Prague bound themselves together in 1920 and 1921 to keep the Habsburgs out. An empire that survived gives them a better reason, not a smaller one."
 AUHSUR_dip_better_treated_than_theirs:0 "Better Treated Than Theirs"
 AUHSUR_dip_better_treated_than_theirs_desc:0 "The only answer to the ring that is not military. A Romanian in Transylvania who is better schooled, better paid and better represented than one in the kingdom is an argument Bucharest cannot answer."
 AUHSUR_dip_split_belgrade_from_bucharest:0 "Split Belgrade from Bucharest"
 AUHSUR_dip_split_belgrade_from_bucharest_desc:0 "Three conventions, three capitals and one banker in Paris. Two of the three want the Banat, and a treaty between rivals is only as strong as the quarrel it postpones."
 AUHSUR_dip_the_arbiter_of_the_danube:0 "The Arbiter of the Danube"
 AUHSUR_dip_the_arbiter_of_the_danube_desc:0 "Redraw the national borders around us by award instead of by campaign. Whoever holds the pen at the table decides, and everyone who signs learns where the pen lives."
 AUHSUR_dip_the_romanian_schools_funded:0 "The Romanian Schools Funded"
 AUHSUR_dip_the_romanian_schools_funded_desc:0 "State money for confessional schools that teach in Romanian, which is the exact opposite of what the school laws of 1907 were written to do."
 AUHSUR_dip_the_orthodox_metropolitans:0 "The Orthodox Metropolitans"
 AUHSUR_dip_the_orthodox_metropolitans_desc:0 "Karlowitz for the Serbs, Sibiu for the Romanians, each with its schools, its endowments and its synod. Vienna conceded church autonomy in Bosnia in 1905 and learned it bought more than a garrison."
 AUHSUR_dip_the_slovak_gymnasia:0 "The Slovak Gymnasia"
 AUHSUR_dip_the_slovak_gymnasia_desc:0 "Three Slovak secondary schools were closed in 1874 and not one replaced them for forty years. Reopening them costs Budapest nothing it can name out loud."
 AUHSUR_dip_the_border_that_people_cross:0 "The Border That People Cross"
 AUHSUR_dip_the_border_that_people_cross_desc:0 "Market days, seasonal labour and relatives on both sides. Once the comparison runs our way the traffic across the Carpathians becomes an argument we do not have to make."
 AUHSUR_dip_the_entente_without_a_cause:0 "The Entente Without a Cause"
 AUHSUR_dip_the_entente_without_a_cause_desc:0 "An alliance built to stop a restoration cannot explain itself against an empire that treats its minorities better than its accusers treat theirs. Paris keeps paying; the argument stops working."
 AUHSUR_dip_the_pact_of_1933:0 "The Pact of 1933"
 AUHSUR_dip_the_pact_of_1933_desc:0 "On 16 February 1933 the three of them turned a set of conventions into a standing council with a permanent secretariat. It is a real institution and it can be attacked as one."
 AUHSUR_dip_paris_the_banker:0 "Paris the Banker"
 AUHSUR_dip_paris_the_banker_desc:0 "France lends, arms and guarantees, and in exchange the three of them stay pointed at us. Money is the weakest of the three bonds and the easiest to outbid."
 AUHSUR_dip_bucharest_bought:0 "Bucharest Bought"
 AUHSUR_dip_bucharest_bought_desc:0 "Romania joined the ring against Budapest, not against Vienna. Wheat, oil and a settled Banat frontier are worth more to Bucharest than a guarantee signed in a third capital."
 AUHSUR_dip_prague_isolated:0 "Prague Isolated"
 AUHSUR_dip_prague_isolated_desc:0 "Take away the Romanian leg and the ring is a bilateral treaty with a secretariat. Prague built the thing and Prague is the one that cannot afford to lose it."
 AUHSUR_dip_the_entente_dissolved:0 "The Entente Dissolved"
 AUHSUR_dip_the_entente_dissolved_desc:0 "Three signatures withdrawn in three capitals over four years. Nothing was fought for and nothing was conceded; the alliance simply ran out of a reason its members could still agree on."
 AUHSUR_dip_the_table_at_the_belvedere:0 "The Table at the Belvedere"
 AUHSUR_dip_the_table_at_the_belvedere_desc:0 "A palace, a map, two delegations and a third party who decides. It is a way of moving a frontier that costs no lives and creates a grievance with a date on it."
 AUHSUR_dip_the_first_award:0 "The First Award"
 AUHSUR_dip_the_first_award_desc:0 "The empire summons its neighbours and hands down a line. Everyone attends because refusing to attend is the only worse option, and everyone remembers who was not asked."
 AUHSUR_dip_the_award_for_budapest:0 "The Award Read for Budapest"
 AUHSUR_dip_the_award_for_budapest_desc:0 "The line is drawn where the Magyar villages are, and the kingdom is paid in territory for everything the Compromise has cost it. Bucharest is told to sign."
 AUHSUR_dip_the_award_for_bucharest:0 "The Award Read for Bucharest"
 AUHSUR_dip_the_award_for_bucharest_desc:0 "The line follows the plain and not the memory, and the kingdom of Saint Stephen is told that the arbiter is not its lawyer. It costs Budapest and buys the Romanians of both sides."
 AUHSUR_dip_the_minorities_exchanged:0 "The Minorities Exchanged"
 AUHSUR_dip_the_minorities_exchanged_desc:0 "Populations moved to fit the lines, by treaty and with compensation. It is the tidiest solution anyone proposed between the wars and it is the cruellest thing in this branch."
 AUHSUR_dip_borders_by_consent:0 "Borders by Consent"
 AUHSUR_dip_borders_by_consent_desc:0 "Every frontier in the basin signed rather than stormed, with the empire's name on each award. It holds exactly as long as the empire can enforce it and not one day longer."
 AUHSUR_threat_the_ring:0 "The Little Entente stands"
 AUHSUR_threat_prague_alone:0 "Prague left alone"
 AUHSUR_threat_the_award:0 "An award handed down at Vienna"
 AUHSUR_tt_germans:0 "Asked in November 1918 and again in the Tyrol and Salzburg votes of spring 1921, the German Austrians chose union with Germany by 98 to 99 per cent."
 AUHSUR_tt_german_share:0 "The 1910 census: Germans 23.9 per cent of the Monarchy, Magyars 20.2, Czechs 12.6, Poles 10.0, Ruthenes 7.9, Romanians 6.4."
 AUHSUR_ger_no_anschluss_to_be_had:0 "No Anschluss To Be Had"
 AUHSUR_ger_no_anschluss_to_be_had_desc:0 "There is no German-Austrian republic for Berlin to annex, because it never had to be founded. So the German question comes home: pan-Germanism here is a secession, not a foreign policy."
 AUHSUR_ger_the_second_german_pole:0 "The Second German Pole"
 AUHSUR_ger_the_second_german_pole_desc:0 "Vienna wore the imperial crown of the Germans until 1806 and has never conceded that Berlin inherited it. Claiming the mantle is the only offer that outbids being a majority."
 AUHSUR_ger_the_germans_bought:0 "The Germans Bought"
 AUHSUR_ger_the_germans_bought_desc:0 "They are a fifth of the empire and nearly all of its ministries, courts and officer corps. Guaranteeing that in writing keeps them, and tells every other people what loyalty is worth."
 AUHSUR_ger_the_wing_broken:0 "The Greater German Wing Broken"
 AUHSUR_ger_the_wing_broken_desc:0 "Dissolve the associations, prosecute the deputies, watch the student corps. It works on organisations and it does nothing at all about why ninety-eight per cent of them voted that way."
 AUHSUR_ger_the_older_german_capital:0 "The Older German Capital"
 AUHSUR_ger_the_older_german_capital_desc:0 "Franz II laid down the old crown in 1806 and the House has never said a word conceding the title since. In a Europe with two German states, precedence is an argument worth money."
 AUHSUR_ger_the_catholic_germany:0 "The Catholic Germany"
 AUHSUR_ger_the_catholic_germany_desc:0 "Schoenerer preached leaving Rome because the dynasty was Catholic and he was right about the fault line. Standing on it turns a weakness into the border between two German ideas."
 AUHSUR_ger_the_hand_offered_to_munich:0 "The Hand Offered to Munich"
 AUHSUR_ger_the_hand_offered_to_munich_desc:0 "Bavaria was the other Catholic German kingdom and it has resented Prussia since long before either of us lost a war. A southern German understanding is not an alliance, and it is not nothing."
 AUHSUR_ger_the_germans_of_bohemia_at_home:0 "The Germans of Bohemia at Home"
 AUHSUR_ger_the_germans_of_bohemia_at_home_desc:0 "Three million of them, a fifth of the province, and in the world without the empire they became the grievance of 1938. Here they are a minority inside a state that is not a nation."
 AUHSUR_ger_two_german_capitals:0 "Two German Capitals"
 AUHSUR_ger_two_german_capitals_desc:0 "Berlin cannot offer our Germans a majority they would rather have than the empire they already run. That is the whole defence, and it lasts as long as they keep running it."
 AUHSUR_ger_the_german_register:0 "The German Register"
 AUHSUR_ger_the_german_register_desc:0 "The same national cadastre that protects a Czech in Brno protects a German in Budweis. Once everyone is on a register, being a minority somewhere is survivable."
 AUHSUR_ger_the_offices_reserved:0 "The Offices Reserved"
 AUHSUR_ger_the_offices_reserved_desc:0 "German stays the language of the ministries, the general staff and the railways, and the quota of German officials is written down instead of merely inherited."
 AUHSUR_ger_the_burschenschaften_courted:0 "The Student Corps Courted"
 AUHSUR_ger_the_burschenschaften_courted_desc:0 "The duelling fraternities are where the Greater German idea is taught and where the next generation of officials drinks. Buying them is cheaper than watching them."
 AUHSUR_ger_the_plebiscite_not_held:0 "The Plebiscite Not Held"
 AUHSUR_ger_the_plebiscite_not_held_desc:0 "The Tyrol and Salzburg voted in spring 1921 and the answer was ninety-eight per cent for Berlin. The lesson every government drew was never to ask the question again."
 AUHSUR_ger_a_loyalty_that_is_rented:0 "A Loyalty That Is Rented"
 AUHSUR_ger_a_loyalty_that_is_rented_desc:0 "It holds, and it holds only while the rent is paid. Every other people in the empire can read the price list, and after 1933 Berlin can offer terms the empire cannot match."
 AUHSUR_ger_the_nationalverband_dissolved:0 "The Nationalverband Dissolved"
 AUHSUR_ger_the_nationalverband_dissolved_desc:0 "The German National Union was the largest club in the Reichsrat before the war. Dissolving a parliamentary group does not dissolve the fifth of the empire that voted for it."
 AUHSUR_ger_the_frontier_watched:0 "The Frontier Watched"
 AUHSUR_ger_the_frontier_watched_desc:0 "The Evidenzbureau turned outward for forty years and never once had to watch its own Germans. Now the interesting traffic is money and pamphlets coming south."
 AUHSUR_ger_the_trials_for_treason:0 "The Trials for Treason"
 AUHSUR_ger_the_trials_for_treason_desc:0 "Kramar was condemned in 1916 and amnestied in 1917, and the state got nothing out of either. Prosecuting a nationality's leaders has a record in this empire, and it is a poor one."
 AUHSUR_ger_the_tyrol_garrisoned:0 "The Tyrol Garrisoned"
 AUHSUR_ger_the_tyrol_garrisoned_desc:0 "The province that voted ninety-nine per cent for Berlin is also the one with the passes. Kaiserjaeger battalions in their own valleys, watching their own villages."
 AUHSUR_ger_a_loyalty_by_law:0 "A Loyalty by Law"
 AUHSUR_ger_a_loyalty_by_law_desc:0 "The wing is broken, the associations are gone and the sentiment is exactly where it was. This is the road that keeps the empire and never finds out whether it is wanted."
 AUHSUR_threat_two_germanies:0 "Two German states in Europe"
 AUHSUR_tt_middle_power:0 "Fifty-five to sixty million people, Bohemian and Styrian industry, Skoda and Boryslaw. No German coal, no fleet that leaves the Adriatic, no single political command."
 AUHSUR_tt_two_books:0 "Two books published in London in 1942: Milan Hodza's Federation in Central Europe, eight states and some 110 million people, and Otto von Habsburg's Danubian Reconstruction."
 AUHSUR_tt_no_clean_win:0 "There is no ending here where the empire wins everything. The decennial term can fail in 1947 as easily as it failed in 1907."
 AUHSUR_war_the_storm_from_the_north:0 "The Storm from the North"
 AUHSUR_war_the_storm_from_the_north_desc:0 "A middle power with two capitals, eleven nationalities and a general staff that has not fought since 1918. The next European war will be decided by where this empire stands, and by nothing it can do alone."
 AUHSUR_war_march_with_berlin:0 "March with Berlin"
 AUHSUR_war_march_with_berlin_desc:0 "Spa in May 1918 bound the Monarchy to Germany by an alliance of arms and a customs treaty, and the Piave offensive followed to prove it. Doing it again is the shortest road and the oldest mistake."
 AUHSUR_war_the_armed_middle:0 "The Armed Middle"
 AUHSUR_war_the_armed_middle_desc:0 "Hold Central Europe against both of them. It requires an army neither side wants to pay for, a line in the Carpathians, and the nerve to keep the Danube shut to everyone."
 AUHSUR_war_stand_with_the_west:0 "Stand with the West"
 AUHSUR_war_stand_with_the_west_desc:0 "The Sixtus letter said out loud in 1917 what this option is. It buys the empire a seat at the peace and costs it the loyalty of every German who reads the newspapers."
 AUHSUR_war_the_second_alliance_of_arms:0 "The Second Alliance of Arms"
 AUHSUR_war_the_second_alliance_of_arms_desc:0 "A joint command, a common tariff and a general staff in Berlin that plans for both. Every clause of it was signed once before, in May 1918, by an emperor who had no choice."
 AUHSUR_war_the_grain_of_the_plain:0 "The Grain of the Plain"
 AUHSUR_war_the_grain_of_the_plain_desc:0 "Hungary held the surplus in the last war and cut the deliveries west while Vienna rationed. Whoever eats first in the next one is a political question, not an agricultural one."
 AUHSUR_war_the_eastern_march:0 "The Eastern March"
 AUHSUR_war_the_eastern_march_desc:0 "Galicia was lost in six weeks in 1914 and cost some four hundred thousand men. The plans have not changed and neither has the railway net that carries them."
 AUHSUR_war_the_bill_for_the_victory:0 "The Bill for the Victory"
 AUHSUR_war_the_bill_for_the_victory_desc:0 "Oil, wheat, and the Danube traffic, priced by the partner who wins. The last time the empire won a campaign beside Germany it discovered what a junior partner is allowed to keep."
 AUHSUR_war_a_place_in_the_new_order:0 "A Place in the New Order"
 AUHSUR_war_a_place_in_the_new_order_desc:0 "The empire keeps its crown, its army and its markets, and holds them at Berlin's pleasure. It is a real ending, and it is the one where the last fifty years of argument stop mattering."
 AUHSUR_war_neither_berlin_nor_moscow:0 "Neither Berlin Nor Moscow"
 AUHSUR_war_neither_berlin_nor_moscow_desc:0 "Both of them want the basin and neither of them can hold it while the other is standing. An empire in the middle is a fact of geography before it is a policy."
 AUHSUR_war_the_carpathian_line:0 "The Carpathian Line"
 AUHSUR_war_the_carpathian_line_desc:0 "The passes are the only frontier this empire has ever been able to hold cheaply. Fortifying them is an admission that the plains beyond them are not defensible at all."
 AUHSUR_war_the_danube_closed:0 "The Danube Closed"
 AUHSUR_war_the_danube_closed_desc:0 "Grain, oil and iron move on that river, and the empire sits across the middle of it. Closing it to both sides is the one piece of leverage a middle power actually owns."
 AUHSUR_war_the_refugees_admitted:0 "The Refugees Admitted"
 AUHSUR_war_the_refugees_admitted_desc:0 "A state that is not a nation has no principled reason to ask a refugee what he is. It costs food and housing, and it is the cheapest argument for the empire anyone will ever make."
 AUHSUR_war_the_empire_that_stayed_out:0 "The Empire That Stayed Out"
 AUHSUR_war_the_empire_that_stayed_out_desc:0 "Armed, fed, unbombed, and disliked by both victors. Staying out of a European war is not a moral position here, it is an expensive one, and it has to be paid for every month."
 AUHSUR_war_the_western_guarantee:0 "The Western Guarantee"
 AUHSUR_war_the_western_guarantee_desc:0 "Paris and London will guarantee the basin if somebody in it is worth guaranteeing. The empire is the only state between the Alps and the Carpathians large enough to be worth the paper."
 AUHSUR_war_the_war_on_two_frontiers:0 "The War on Two Frontiers"
 AUHSUR_war_the_war_on_two_frontiers_desc:0 "North and east at once, which is the problem the general staff failed to solve in 1914 and never revisited. This time the plans are written before the mobilisation, not during it."
 AUHSUR_war_the_bohemian_bastion:0 "The Bohemian Bastion"
 AUHSUR_war_the_bohemian_bastion_desc:0 "The industry, the mountains and the fortifications all sit in the same province, and so do three million Germans. It is the strongest position in Central Europe and the most awkward one."
 AUHSUR_war_the_levy_of_the_kingdom:0 "The Levy of the Kingdom"
 AUHSUR_war_the_levy_of_the_kingdom_desc:0 "The contingent was frozen at 103 100 men from 1889 to 1912 because Budapest held a veto over recruits. A war on the western side needs that veto lifted and paid for."
 AUHSUR_war_a_seat_at_the_table:0 "A Seat at the Table"
 AUHSUR_war_a_seat_at_the_table_desc:0 "The empire ends the war on the winning side with an army in the field and a claim to be heard. In 1919 it was not in the room at all; this is the whole difference."
 AUHSUR_war_the_settlement_of_1945:0 "The Settlement of 1945"
 AUHSUR_war_the_settlement_of_1945_desc:0 "Whatever it did in the war, the empire is now the largest thing between two blocs that have divided everything else. What it becomes is the last question the branch asks."
 AUHSUR_end_the_federal_empire:0 "The Federal Empire"
 AUHSUR_end_the_federal_empire_desc:0 "The manifesto of October 1918 finished forty years late. Solid inside, slow to decide anything, and militarily weaker than the sum of its provinces because no one of them fears the others enough."
 AUHSUR_end_the_danubian_confederation:0 "The Danubian Confederation"
 AUHSUR_end_the_danubian_confederation_desc:0 "Hodza and Otto von Habsburg both published the design in London in 1942. The empire is first among equals from the Alps to the Black Sea, and it pays for the place in sovereignty."
 AUHSUR_end_the_long_partition:0 "The Long Partition"
 AUHSUR_end_the_long_partition_desc:0 "The crown keeps the Alps and Bohemia and loses the rest a province at a time. It is a defeat, it takes thirty years, and it is still a state at the end of it."
 AUHSUR_end_the_army_of_a_middle_power:0 "The Army of a Middle Power"
 AUHSUR_end_the_army_of_a_middle_power_desc:0 "Eleven regimental languages, one language of command, and a budget two parliaments argue over. It cannot invade anyone and it can make invading the basin expensive."
 AUHSUR_end_the_eight_states:0 "The Eight States"
 AUHSUR_end_the_eight_states_desc:0 "Hodza counted eight members and about a hundred and ten million people. On paper it is the largest free market in Europe; in practice it is eight vetoes with a common tariff."
 AUHSUR_end_the_third_force:0 "The Third Force"
 AUHSUR_end_the_third_force_desc:0 "Between two blocs that have divided the rest of the continent, with an army that frightens neither and a market both of them want. It is a narrow place to stand and it is a place."
 AUHSUR_end_the_alpine_and_bohemian_crown:0 "The Alpine and Bohemian Crown"
 AUHSUR_end_the_alpine_and_bohemian_crown_desc:0 "What is left when the plains and the coast are gone: the mountains, the factories and about half the people. Smaller, richer, and finally speaking two languages instead of eleven."
 AUHSUR_end_the_term_of_1947:0 "The Term of 1947"
 AUHSUR_end_the_term_of_1947_desc:0 "The contract falls due again, as it did in 1907, 1917, 1927 and 1937. Nothing in this branch has made it impossible to fail, and that is the point of the branch."
 AUHSUR_threat_river_closed:0 "The Danube shut to both sides"
 AUH_the_constituent_decade:0 "The Constituent Decade"
 AUH_the_constituent_decade_desc:0 "Ten years in which every institution of the Monarchy is on the table at once. Nothing is settled, everybody argues, and for once everybody is listened to."
 AUH_the_manifesto_completed:0 "The Manifesto Completed"
 AUH_the_manifesto_completed_desc:0 "Cisleithania is a union of national states and Hungary is not. Half an empire has been settled and the settled half is now the slower one to move."
 AUH_the_south_slav_crown:0 "The South Slav Crown"
 AUH_the_south_slav_crown_desc:0 "A third contracting party, and a third set of ministries to pay for. The Croat and Slovene regiments are loyal to a crown that now exists on paper as well as in the oath."
 AUH_gross_oesterreich_by_octroi:0 "Gross-Oesterreich by Decree"
 AUH_gross_oesterreich_by_octroi_desc:0 "The constitution the peoples wanted, granted by a sovereign who did not ask them. Everything moves quickly now, and nothing that moves quickly is thought legitimate."
 AUH_the_quota_of_1927:0 "The Quota of 1927"
 AUH_the_quota_of_1927_desc:0 "Hungary's share is renegotiated upward again, and the common budget is smaller for it. The contract holds, and everything the contract pays for gets a little thinner."
 AUH_the_language_statute:0 "The Language Statute"
 AUH_the_language_statute_desc:0 "Voted, not decreed, and therefore unrepealable by the next cabinet. The courts and schools of Bohemia and Moravia finally know which language they work in."
 AUH_the_chamber_of_nationalities:0 "The Chamber of Nationalities"
 AUH_the_chamber_of_nationalities_desc:0 "An upper house of peoples rather than provinces. Obstruction is now a vote instead of a shouting match, and every vote takes a season to arrange."
 AUH_the_half_federation:0 "The Half Federation"
 AUH_the_half_federation_desc:0 "One side of the Leitha is a union of nations and the other is a kingdom of counties. Every reform now stops at a river."
 AUH_the_federal_empire:0 "The Federal Empire"
 AUH_the_federal_empire_desc:0 "Solid at home, slow abroad, and militarily weaker than the sum of its provinces because none of them is frightened enough of the others to pay for an army."
 AUH_the_nagodba_undone:0 "The Nagodba Undone"
 AUH_the_nagodba_undone_desc:0 "The settlement of 1868 that tied Zagreb to Budapest is cancelled, and forty Croat delegates leave the Hungarian chamber. Budapest costs the crown something every week for it."
 AUH_the_trialist_settlement:0 "The Trialist Settlement"
 AUH_the_trialist_settlement_desc:0 "Three crowns, one army, one foreign ministry, and three treasuries arguing about all of it. The Belvedere argued for this from 1900 and never got to test it."
 AUH_the_broken_oath:0 "The Broken Oath"
 AUH_the_broken_oath_desc:0 "The King swore at Budapest to keep the Hungarian constitution, and then did not. Nothing legal in the kingdom is certain afterwards, including the crown's own title."
 AUH_the_hungarian_revolt:0 "The Hungarian Revolt"
 AUH_the_hungarian_revolt_desc:0 "County assemblies refusing the tax, Honved officers refusing the transfer, and a gendarmerie that will not fire on its own gentry."
 AUH_the_granted_federation:0 "The Granted Federation"
 AUH_the_granted_federation_desc:0 "Fifteen states, each with a diet, a school budget and a language, none of which asked for the decree that created it. It works. Nobody quite believes in it."
 AUH_the_pruned_ministries:0 "The Pruned Ministries"
 AUH_the_pruned_ministries_desc:0 "War, foreign affairs and the finance that pays for both. Everything duplicated since 1867 is cut, and every cut office was somebody's client."
 AUH_the_renewed_customs_union:0 "The Renewed Customs Union"
 AUH_the_renewed_customs_union_desc:0 "The Szell formula put a clock on the customs union in 1899 and every renewal has restarted it. Signed again, the market of fifty millions holds for another term."
 AUH_the_drift_to_personal_union:0 "The Drift to Personal Union"
 AUH_the_drift_to_personal_union_desc:0 "Each renewal gives Budapest a little more. Carried far enough the common state is one man in two crowns, which is what the party of 1848 always wanted."
 AUH_dualism_by_arithmetic:0 "Dualism by Arithmetic"
 AUH_dualism_by_arithmetic_desc:0 "Nothing solved, everything paid for, and the same argument booked for ten years hence. It is the cheapest of the four roads and it guarantees the quarrel returns."
 AUH_the_imperial_land_reform:0 "The Imperial Land Reform"
 AUH_the_imperial_land_reform_desc:0 "The crown divides estates in a kingdom whose upper house is made of the men who own them. Every neighbour did this between 1919 and 1921; none of them had a Chamber of Magnates."
 AUH_the_magnates_bargain:0 "The Magnates Keep Their Land"
 AUH_the_magnates_bargain_desc:0 "The kingdom votes the common budget and the great estates stay whole. The plain empties westward one steamship at a time and nobody in Budapest counts it as a cost."
 AUH_the_hungarian_franchise:0 "The Hungarian Franchise"
 AUH_the_hungarian_franchise_desc:0 "The weapon the crown drew in 1905 and never fired. A mass electorate in Hungary breaks the party machine, and it also breaks the majority the crown relies on."
 AUH_land_bought_with_paper:0 "Land Bought With Paper"
 AUH_land_bought_with_paper_desc:0 "The state buys the estates and pays in bonds, as Bucharest and Prague did. The former owners stay rich, stay loyal, and stay in the upper house."
 AUH_land_taken_outright:0 "Land Taken Outright"
 AUH_land_taken_outright_desc:0 "The fastest agrarian reform in Europe, and an enemy made of the class that votes the common budget. The village knows exactly who gave it the field."
 AUH_the_land_commission:0 "The Land Commission"
 AUH_the_land_commission_desc:0 "Surveyors and valuers sitting in county towns where the county gentry are also the magistrates. Five years of work and a police escort."
 AUH_the_peasant_kingdom:0 "A Kingdom of Smallholders"
 AUH_the_peasant_kingdom_desc:0 "The plain is full of freeholders and the Chamber of Magnates is a debating society. Four nationalities have been bought with land the crown did not own."
 AUH_the_land_credit_institute:0 "The Land Credit Institute"
 AUH_the_land_credit_institute_desc:0 "Mortgage credit at rates only an estate can obtain, secured on land that entail forbids anyone to sell. Great property cannot be broken by debt here, only by law."
 AUH_the_gendarmerie_of_the_plain:0 "The Gendarmerie of the Plain"
 AUH_the_gendarmerie_of_the_plain_desc:0 "A squadron per county, and the harvest strikes end. It is remembered in the villages for a generation, and the men who remember it emigrate."
 AUH_magyarisation_by_schooling:0 "Magyarisation by Schooling"
 AUH_magyarisation_by_schooling_desc:0 "The laws of 1907 made Hungarian compulsory in every primary school, church schools included. It made state officials out of village priests, and enemies of their pupils."
 AUH_the_comparison_at_the_border:0 "The Comparison at the Border"
 AUH_the_comparison_at_the_border_desc:0 "Bucharest and Prague hand out land; we hand out school inspectors. Every market town from Kassa to Brasso makes the comparison without being told."
 AUH_the_kingdom_unchanged:0 "The Kingdom Unchanged"
 AUH_the_kingdom_unchanged_desc:0 "Saint Stephen's crown leaves the war exactly as it entered it. The bill is paid in villages, by people who do not sit in the chamber that sent it."
 AUH_the_secret_ballot:0 "The Secret Ballot"
 AUH_the_secret_ballot_desc:0 "The rural Hungarian voter has always named his choice aloud in front of the official who collects his taxes. Cisleithania stopped doing that in 1907."
 AUH_the_broken_majority:0 "The Broken Majority"
 AUH_the_broken_majority_desc:0 "Tisza rewrote the rules of order in 1912 and 1913 so that obstruction became impossible. A mass electorate breaks the machine those rules were built to protect."
 AUH_hungary_of_all_its_peoples:0 "A Hungary of All Its Peoples"
 AUH_hungary_of_all_its_peoples_desc:0 "The gentry keep their acres and lose the chamber, which is the reverse of every bargain struck since 1867. Slovak, Romanian and Serb deputies sit in Budapest."
 AUH_the_reign_continues:0 "The Reign Continues"
 AUH_the_reign_continues_desc:0 "A crowned sovereign in his thirties with a letter to Prince Sixtus behind him. Half of Europe has read it and none of them has forgotten who wrote it."
 AUH_the_council_of_regency:0 "The Council of Regency"
 AUH_the_council_of_regency_desc:0 "The widow, the primate and the common finance minister, governing for a boy of six. Regencies do not risk votes, and everyone knows when this one ends."
 AUH_the_crown_in_commission:0 "The Crown in Commission"
 AUH_the_crown_in_commission_desc:0 "The House keeps the throne and stops running the state. The civil list is voted, the crown council answers to the delegations, and the army loses its personal sovereign."
 AUH_the_family_statute:0 "The Family Statute"
 AUH_the_family_statute_desc:0 "Who may marry, who may sit, who may inherit. Franz Ferdinand swore his children out of the succession under this rule on 28 June 1900."
 AUH_the_long_reign:0 "The Long Reign"
 AUH_the_long_reign_desc:0 "A sovereign in his fifties in the 1940s, with a son grown up in public and a reign that began in a war. Continuity is the one asset no successor state has."
 AUH_the_regency_council:0 "The Regency Council"
 AUH_the_regency_council_desc:0 "Three signatures instead of one, and a chancery that has learned to work without a sovereign in the room."
 AUH_government_by_ordinance:0 "Government by Ordinance"
 AUH_government_by_ordinance_desc:0 "Paragraph 14 was written for a chamber that would not sit. Used by a regency it becomes the ordinary way of governing, and the chamber learns to wait."
 AUH_the_minority_years:0 "The Minority Years"
 AUH_the_minority_years_desc:0 "Nine years in which the sovereign is a schoolboy and every faction in the empire is planning for the day he is not."
 AUH_the_young_emperor:0 "The Young Emperor"
 AUH_the_young_emperor_desc:0 "Eighteen on 20 November 1930, raised in eleven languages by tutors chosen for the purpose. He is the first Habsburg educated to belong to no single nationality."
 AUH_the_crowned_successor:0 "The Crowned Successor"
 AUH_the_crowned_successor_desc:0 "Saint Stephen's crown, the mound of earth from every county, and the oath on the Hungarian constitution. The kingdom has never accepted a king who skipped it."
 AUH_the_civil_list_voted:0 "The Civil List Voted"
 AUH_the_civil_list_voted_desc:0 "The House is paid a salary instead of owning an empire. It is what Vienna legislated on 3 April 1919, done here without the banishment."
 AUH_the_crowned_republic:0 "The Crowned Republic"
 AUH_the_crowned_republic_desc:0 "The House survives by giving up what made it a house. No successor state could call this illegitimate, and no officer of the old army recognises it."
 AUH_the_paper_war_debt:0 "The Paper War Debt"
 AUH_the_paper_war_debt_desc:0 "Four years of war paid for by printing. Whatever is decided about the currency, somebody is going to be told their savings were a contribution."
 AUH_one_crown_one_bank:0 "One Crown, One Bank"
 AUH_one_crown_one_bank_desc:0 "The note issue stays common and both governments keep their hands off it. Dear money, a deflation, and the only version in which the market survives whole."
 AUH_two_stabilisations:0 "Two Stabilisations"
 AUH_two_stabilisations_desc:0 "Each half saves its own currency with its own foreign loan. It is exactly what the successor states did, and it turns one market into two."
 AUH_the_paper_repudiated:0 "The Paper Repudiated"
 AUH_the_paper_repudiated_desc:0 "The war debt burns with the currency. Whoever held plant comes out owning the country; whoever held paper comes out with wallpaper."
 AUH_the_inflation_year:0 "The Inflation Year"
 AUH_the_inflation_year_desc:0 "Prices rewritten weekly, wages monthly, and pensions once. The tax nobody voted for is collected first from whoever trusted the state."
 AUH_the_single_currency_area:0 "The Single Currency Area"
 AUH_the_single_currency_area_desc:0 "One unit of account from Bregenz to Brasso, and a bank with two head offices that is still one bank."
 AUH_back_to_gold:0 "Back to Gold"
 AUH_back_to_gold_desc:0 "The crown was 0.3049 grams of fine gold from 1892 to 1914. Getting back to it means years of dear money and taxes that fall hardest on the two capitals."
 AUH_one_market_of_fifty_millions:0 "One Market of Fifty Millions"
 AUH_one_market_of_fifty_millions_desc:0 "Bohemian industry and the Hungarian plain inside one tariff wall, needing each other far more than either admits in its own parliament."
 AUH_the_league_commissioner:0 "The League Commissioner"
 AUH_the_league_commissioner_desc:0 "A foreign official with a desk in the finance ministry and a signature on the budget. Austria took that bargain on 4 October 1922 and paid for it in sovereignty."
 AUH_the_wall_on_the_leitha:0 "The Wall on the Leitha"
 AUH_the_wall_on_the_leitha_desc:0 "A tariff line inside the empire, staffed on both banks. Every wagon of cloth going east and every wagon of wheat coming west now stops and pays."
 AUH_the_ruined_rentiers:0 "The Ruined Rentiers"
 AUH_the_ruined_rentiers_desc:0 "War loans were sold to clerks, widows and village savings banks as a patriotic duty. That class was the crown's most reliable one, and it is gone."
 AUH_industry_in_few_hands:0 "Industry in Few Hands"
 AUH_industry_in_few_hands_desc:0 "The inflation transferred the plant of Bohemia and Lower Austria to a very short list of banks and families, and they are now the state's only lenders."
 AUH_the_customs_union_with_berlin:0 "The Customs Union with Berlin"
 AUH_the_customs_union_with_berlin_desc:0 "Seventy millions in one tariff area, with the coal and the heavy industry on the northern side of it. Vienna sets the schedule of goods; Berlin sets every price in it."
 AUH_the_junior_partner:0 "The Junior Partner"
 AUH_the_junior_partner_desc:0 "Spa in May 1918 was an alliance of arms and a customs treaty signed by an emperor with no choice. This is the same bargain signed in peacetime."
 AUH_the_rome_protocols:0 "The Rome Protocols"
 AUH_the_rome_protocols_desc:0 "Italy recognises whatever the empire wants inland. The price was written on 26 April 1915 and Rome has never once lowered it."
 AUH_the_adriatic_bargain:0 "The Adriatic Bargain"
 AUH_the_adriatic_bargain_desc:0 "Italy takes the coast and the empire takes the Danube. It is a clean trade, and it is paid for by the people who live on the coast."
 AUH_outbidding_paris:0 "Outbidding Paris"
 AUH_outbidding_paris_desc:0 "France lends, arms and guarantees, and the three of them stay pointed at us. Money is the weakest of the three bonds and the only one that can be matched."
 AUH_the_ring_of_neighbours:0 "The Ring of Neighbours"
 AUH_the_ring_of_neighbours_desc:0 "Belgrade, Bucharest and Prague, bound by three conventions whose declared object is to keep the Habsburgs out. They signed them against a dynasty that no longer needs restoring."
 AUH_better_treated_than_theirs:0 "Better Treated Than Theirs"
 AUH_better_treated_than_theirs_desc:0 "Schools, churches and land for the Romanians and Serbs of the empire, funded to a standard the neighbouring kingdoms cannot match. It is expensive and it cannot be argued with."
 AUH_the_argument_that_holds:0 "The Argument That Holds"
 AUH_the_argument_that_holds_desc:0 "An alliance built to prevent a restoration cannot explain itself against an empire that treats its minorities better than its accusers treat theirs."
 AUH_the_wedge_in_the_ring:0 "The Wedge in the Ring"
 AUH_the_wedge_in_the_ring_desc:0 "Two of the three want the Banat and the third pays for both of their armies. A treaty between rivals is only as strong as the quarrel it postpones."
 AUH_the_ring_undone:0 "The Ring Undone"
 AUH_the_ring_undone_desc:0 "Three signatures withdrawn in three capitals over four years. Nothing was fought for; the alliance ran out of a reason its members could still agree on."
 AUH_the_arbiters_table:0 "The Arbiter's Table"
 AUH_the_arbiters_table_desc:0 "A palace, a map, two delegations and a third party who decides. It moves a frontier without a campaign and it creates a grievance with a date on it."
 AUH_the_exchange_of_peoples:0 "The Exchange of Peoples"
 AUH_the_exchange_of_peoples_desc:0 "Populations moved to fit the lines, by treaty and with compensation. It is the tidiest arrangement anyone proposed between the wars and the cruellest thing in this branch."
 AUH_borders_by_award:0 "Borders by Award"
 AUH_borders_by_award_desc:0 "Every frontier in the basin signed rather than stormed, with the empire's name on each award. It holds as long as the empire can enforce it and not a day longer."
 AUH_the_german_question_at_home:0 "The German Question at Home"
 AUH_the_german_question_at_home_desc:0 "There is no German-Austrian republic to annex, so pan-Germanism here is a secession. After 1933 Berlin can offer our Germans something we cannot: being a majority."
 AUH_the_second_german_pole:0 "The Second German Pole"
 AUH_the_second_german_pole_desc:0 "Vienna wore the imperial crown of the Germans until 1806 and has never conceded that Berlin inherited it. It is the only offer that outbids being a majority."
 AUH_the_catholic_german_idea:0 "The Catholic German Idea"
 AUH_the_catholic_german_idea_desc:0 "Schoenerer preached leaving Rome because the dynasty was Catholic, and he had found the fault line. Standing on it makes a border out of a weakness."
 AUH_the_rival_german_state:0 "The Rival German State"
 AUH_the_rival_german_state_desc:0 "Berlin cannot offer our Germans a majority they would rather have than the empire they already run. That is the whole defence and it lasts while they run it."
 AUH_the_german_guarantee:0 "The German Guarantee"
 AUH_the_german_guarantee_desc:0 "A fifth of the empire, nearly all of its ministries and courts, and now a written promise that this stays so. Every other people can read the price list."
 AUH_the_offices_reserved:0 "The Offices Reserved"
 AUH_the_offices_reserved_desc:0 "German remains the language of the ministries, the staff and the railways, and the quota of German officials is written down instead of merely inherited."
 AUH_the_rented_loyalty:0 "A Loyalty That Is Rented"
 AUH_the_rented_loyalty_desc:0 "It holds while the rent is paid, and the rent rises every year after 1933. The other ten nationalities are watching the arrangement closely."
 AUH_the_wing_suppressed:0 "The Greater German Wing Suppressed"
 AUH_the_wing_suppressed_desc:0 "Associations dissolved, deputies prosecuted, student corps watched. It works on organisations and does nothing about why they were popular."
 AUH_the_watch_on_the_north:0 "The Watch on the North"
 AUH_the_watch_on_the_north_desc:0 "The Evidenzbureau spent forty years looking east and never once had to watch its own Germans. The interesting traffic now is money and pamphlets coming south."
 AUH_the_treason_courts:0 "The Treason Courts"
 AUH_the_treason_courts_desc:0 "Kramar was condemned in 1916 and amnestied in 1917, and the state gained nothing from either. Prosecuting a nationality's leaders has a record here, and a poor one."
 AUH_loyalty_by_statute:0 "A Loyalty by Statute"
 AUH_loyalty_by_statute_desc:0 "The wing is broken, the associations are gone and the sentiment is exactly where it was. This road keeps the empire and never learns whether it is wanted."
 AUH_the_second_alliance_of_arms:0 "The Second Alliance of Arms"
 AUH_the_second_alliance_of_arms_desc:0 "A joint command and a general staff in Berlin that plans for both armies. Every clause was signed once already, in May 1918, and the war was lost anyway."
 AUH_the_armed_middle:0 "The Armed Middle"
 AUH_the_armed_middle_desc:0 "An army large enough to make the basin expensive and useless for anything else, paid for by a population that is not at war."
 AUH_the_western_guarantee:0 "The Western Guarantee"
 AUH_the_western_guarantee_desc:0 "Paris and London will guarantee the basin if somebody in it is worth guaranteeing. Every German in the empire reads the announcement the same morning."
 AUH_the_grain_committee:0 "The Grain Committee"
 AUH_the_grain_committee_desc:0 "Hungary held the surplus in the last war and cut deliveries west while Vienna rationed. A common committee is the only thing that stops it happening twice."
 AUH_the_partners_bill:0 "The Partner's Bill"
 AUH_the_partners_bill_desc:0 "Oil, wheat and the Danube traffic, priced by the partner who won. A junior partner keeps what the senior one has no use for."
 AUH_the_place_in_the_new_order:0 "A Place in the New Order"
 AUH_the_place_in_the_new_order_desc:0 "Crown, army and markets all kept, all held at Berlin's pleasure. It is a real ending, and the one in which fifty years of constitutional argument stop mattering."
 AUH_the_river_held:0 "The River Held"
 AUH_the_river_held_desc:0 "Grain, oil and iron move on the Danube and the empire sits across the middle of it. Closing it to both sides is the leverage a middle power actually owns."
 AUH_the_open_door:0 "The Open Door"
 AUH_the_open_door_desc:0 "A state that is not a nation has no principled reason to ask a refugee what he is. It costs food and housing and it is the best argument for the empire anyone will make."
 AUH_the_neutrality_that_held:0 "The Neutrality That Held"
 AUH_the_neutrality_that_held_desc:0 "Armed, fed, unbombed and disliked by both victors. Staying out of a European war is not a moral position here; it is an expensive one, paid monthly."
 AUH_the_seat_at_the_table:0 "The Seat at the Table"
 AUH_the_seat_at_the_table_desc:0 "The empire ends the war on the winning side with an army in the field. In 1919 it was not in the room at all, and that is the whole difference."
 AUH_the_finished_manifesto:0 "The Finished Manifesto"
 AUH_the_finished_manifesto_desc:0 "October 1918, completed thirty years late. Solid at home, slow at everything, and quite unable to frighten anyone."
 AUH_the_danubian_confederation:0 "The Danubian Confederation"
 AUH_the_danubian_confederation_desc:0 "Hodza counted eight states and about a hundred and ten million people; Otto von Habsburg argued the same year for a democratic confederation. Both published in London in 1942."
 AUH_the_third_force:0 "The Third Force"
 AUH_the_third_force_desc:0 "Between two blocs that divided the rest of the continent, with an army that frightens neither and a market both of them want. A narrow place to stand."
 AUH_the_long_partition:0 "The Long Partition"
 AUH_the_long_partition_desc:0 "The crown keeps the Alps and Bohemia and loses the rest a province at a time. Smaller, richer, and finally speaking two languages instead of eleven."
 AUH_survival_shortcut:0 "The Empire After 1918"
 auh_survival.1.t:0 "The Physicians Are Called"
 auh_survival.1.d:0 "A cold taken at a review has gone to the lungs. He is thirty-four. In the world where the empire fell, this was what killed him, on an island off Africa, in April 1922."
 auh_survival.1.a:0 "He is up again within the month."
 auh_survival.1.b:0 "The Empress is called to the bedside."
 auh_survival.2.t:0 "The Question of the Regency"
 auh_survival.2.d:0 "The heir was born on 20 November 1912 and comes of age in 1930. Until then somebody signs in his name, and the two governments have very different views about who."
 auh_survival.2.a:0 "A council of three, and no ordinances."
 auh_survival.2.b:0 "Budapest names the second regent."
 auh_survival.3.t:0 "The Term Falls Due"
 auh_survival.3.d:0 "Tariffs, bank charter and quota, all renewed at once or not at all. It failed in 1907 and the empire ran for months on decrees while the two governments shouted at each other."
 auh_survival.3.a:0 "Pay Budapest and sign."
 auh_survival.3.b:0 "Let it lapse and govern by decree."
 auh_survival.4.t:0 "The Neighbours Reply"
 auh_survival.4.d:0 "Belgrade, Bucharest and Prague have read the announcement. Their three conventions were signed to prevent a Habsburg restoration, and they are now looking for the sentence that replaces that one."
 auh_survival.4.a:0 "Send the ambassadors with assurances."
 auh_survival.4.b:0 "Let them find their own words."
 auh_survival.5.t:0 "The Commission Reports"
 auh_survival.5.d:0 "Acreage, tenancies and wages, county by county, in a volume nobody in the upper house wants printed. The comparison with Romania and Czechoslovakia is on the last page."
 auh_survival.5.a:0 "Print it, and print the comparison."
 auh_survival.5.b:0 "File it and thank the commissioners."
 auh_survival.6.t:0 "The Offer from Paris"
 auh_survival.6.d:0 "A preferential group of five Danubian states, tariffs cut inside it and held outside. In 1932 Berlin and Rome killed the same paper at London within weeks of its publication."
 auh_survival.6.a:0 "Sign it as it stands."
 auh_survival.6.b:0 "Hold out for better terms."
 auh_survival.7.t:0 "Rome Names the Price"
 auh_survival.7.d:0 "The list has not changed since 26 April 1915: Trentino, South Tyrol to the Brenner, Trieste, Gorizia-Gradisca, Istria and a share of the Dalmatian coast."
 auh_survival.7.a:0 "The coast for the Danube."
 auh_survival.7.b:0 "The fleet stays where it is."
 auh_survival.8.t:0 "The Award Must Be Enforced"
 auh_survival.8.d:0 "The line was read out at the Belvedere and both delegations signed it. Neither of the two gendarmeries on the ground is willing to be the one that moves the posts."
 auh_survival.8.a:0 "Our own troops move the posts."
 auh_survival.8.b:0 "They signed it; let them keep it."
 auh_survival.9.t:0 "A Delegation from the Tyrol"
 auh_survival.9.d:0 "They have brought the figures from the votes of spring 1921, which ran between ninety-eight and ninety-nine per cent for union with Germany, and they would like them read into the record."
 auh_survival.9.a:0 "Receive them at the Hofburg."
 auh_survival.9.b:0 "The chancery is not at home."
 auh_survival.10.t:0 "Between Two Blocs"
 auh_survival.10.d:0 "The continent has been divided and the basin has not. Two books published in London in 1942 describe what could stand here: a federation of eight states, or a democratic confederation on the Danube."
 auh_survival.10.a:0 "The confederation, as Hodza wrote it."
 auh_survival.10.b:0 "An army, and no signatures."
 auh_survival.10.c:0 "Nothing announced, and nothing conceded."
 auh_survival_the_emperor_recovers_tt:0 "The sovereign returns to the desk. The question is postponed, not answered."
 auh_survival_provisorium_tt:0 "The empire runs on decrees until the two governments can agree a text."
 auh_survival_survey_buried_tt:0 "The volume is not printed. The county assemblies are relieved and the villages hear about it anyway."
 auh_survival_hold_out_tt:0 "Paris will wait, but not for long, and Berlin and Rome are drafting their answers."
 auh_survival_let_them_settle_tt:0 "An award nobody enforces is a suggestion, and everyone at the table now knows it."
 auh_survival_delegation_received_tt:0 "Receiving them concedes that the question exists. It is the price of not having to hear it in the street."
 auh_survival_hodza_tt:0 "Eight states and some 110 million people, as Milan Hodza published it in London in 1942."
 auh_survival_armed_tt:0 "A standing army in the middle of Europe, and no obligations to anybody who wants to use it."
 auh_survival_quiet_tt:0 "The empire says nothing, signs nothing, and is still there in ten years."
 AUH_news_701_t:0 "The Monarchy Stands"
 AUH_news_701_d:0 "No delegation went to Saint-Germain and none to Trianon. Fifty-one million subjects, eleven nationalities and one contract that falls due every ten years. The war is over; the argument is not."
 AUH_news_702_t:0 "The Crownlands Become States"
 AUH_news_702_d:0 "The manifesto signed on 16 October 1918 is law at last. Bohemia, Galicia and the Bukovina become national states within the Austrian half. Beyond the Leitha the kingdom is untouched, and says so."
 AUH_news_703_t:0 "A Third Crown at Zagreb"
 AUH_news_703_d:0 "The programme the Yugoslav Club read out in the Reichsrat on 30 May 1917 is granted. Croats, Slovenes and Serbs of the Monarchy receive a crown of their own. Budapest calls it a theft of Saint Stephen."
 AUH_news_704_t:0 "Fifteen States by Imperial Decree"
 AUH_news_704_d:0 "The map Aurel Popovici printed at Leipzig in 1906 has been proclaimed as law. Fifteen national states, granted from above, with the common army standing behind the proclamation. The Hungarian counties refuse the tax."
 AUH_news_705_t:0 "The Crown Divides the Great Estates"
 AUH_news_705_d:0 "A land commission will survey, value and divide the great Hungarian estates, as Bucharest, Prague and Belgrade did between 1919 and 1921. The Chamber of Magnates has asked what the crown intends to pay with."
 AUH_news_706_t:0 "One Crown, One Bank"
 AUH_news_706_d:0 "The note-issuing privilege of the Austro-Hungarian Bank is renewed and neither government will touch the press. Dear money and a common market: the two halves keep one currency where the rest of Europe made new ones."
 AUH_news_707_t:0 "The Danube Signs at Last"
 AUH_news_707_d:0 "A preferential group of five Danubian states, tariffs cut inside and held outside. The plan Paris put forward and Berlin and Rome buried at London in 1932 has been signed in Vienna."
 AUH_news_708_t:0 "Rome and Vienna Come to Terms"
 AUH_news_708_d:0 "Italy recognises the Monarchy's standing on the Danube. The price is the one written into the Treaty of London on 26 April 1915, and the Slovene and Croat press has printed the list in full."
 AUH_news_709_t:0 "The Little Entente Dissolves"
 AUH_news_709_d:0 "Three conventions signed between 1920 and 1921 to prevent a Habsburg restoration are withdrawn in three capitals. Paris keeps its loans and loses the argument they were meant to pay for."
 AUH_news_710_t:0 "Vienna Claims the German Mantle"
 AUH_news_710_d:0 "The Hofburg observes that the imperial crown of the Germans was laid down in Vienna in 1806 and never conceded to Berlin. Two German states, two capitals, and one question put to every German who lives between them."
 AUH_news_711_t:0 "An Award Read at the Belvedere"
 AUH_news_711_d:0 "A frontier moved by arbitration and not by campaign. Both delegations signed; both went home saying they had been robbed. The empire has made itself the arbiter of Central Europe, and the arbiter is now responsible."
 AUH_news_712_t:0 "The Danube Between Two Blocs"
 AUH_news_712_d:0 "The continent has been divided and the basin has not. What stands here will be a confederation, an armed neutral, or a crown with fewer provinces than it started the century with."

