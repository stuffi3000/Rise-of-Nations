l_english:
 ECU_titles_without_garrisons:0 "Titles Without Garrisons"
 ECU_titles_without_garrisons_desc:0 "Two hundred thousand square kilometres of Amazon that every chancellery agrees are ours on paper, and on which we have never posted a single soldier. The file is impeccable. The ground is empty."
 ECU_the_tobar_treaty:0 "The Tobar Treaty"
 ECU_the_tobar_treaty_desc:0 "Give up the north-eastern claims and Brazil will co-sign the rest. A claim nobody else will put their name to is not a claim, it is a grievance."
 ECU_not_one_league_to_brazil:0 "Not One League to Brazil"
 ECU_not_one_league_to_brazil_desc:0 "The map is the map, and it is not for sale by the league. We keep the whole file and we keep it alone, and every Amazon conference from here on will be held without us."
 ECU_the_liberal_revolution_in_arms:0 "The Liberal Revolution in Arms"
 ECU_the_liberal_revolution_in_arms_desc:0 "Alfaro came down from the coast with an army and took the country in a month. What is won by an army is thereafter governed by one."
 ECU_the_law_of_dead_hands:0 "The Law of Dead Hands"
 ECU_the_law_of_dead_hands_desc:0 "The estates of the mortmain pass to the state: hospitals, schools, and a treasury that can pay its own soldiers for once. The sierra will not forgive it in this generation or the next."
 ECU_the_january_revolution:0 "The January Revolution"
 ECU_the_january_revolution_desc:0 "The barracks decide the presidency again, and the radical constitution of 1906 follows. From this day every head of state in Ecuador holds office at the pleasure of a garrison."
 ECU_let_garcia_govern:0 "Let Garcia Govern"
 ECU_let_garcia_govern_desc:0 "The general stands aside and the elected president serves out his term. It is a small thing, it is unprecedented, and it is the only way this country ever stops overthrowing itself."
 ECU_the_first_cacao_in_the_world:0 "The First Cacao in the World"
 ECU_the_first_cacao_in_the_world_desc:0 "One in every three beans traded anywhere comes from the Guayas. The price is set in Hamburg and New York, and nobody in Guayaquil has any say in it whatsoever."
 ECU_the_iron_road_to_quito:0 "The Iron Road to Quito"
 ECU_the_iron_road_to_quito_desc:0 "Four hundred and fifty kilometres and the Devil's Nose. It joins the coast to the sierra for the first time in history, and it is paid for with customs revenue pledged decades ahead."
 ECU_an_army_of_montoneras:0 "An Army of Montoneras"
 ECU_an_army_of_montoneras_desc:0 "Coastal horsemen who have brought down four governments and expect to bring down a fifth. They are not a faction, they are how the coast talks to Quito."
 ECU_we_will_not_be_judged:0 "We Will Not Be Judged"
 ECU_we_will_not_be_judged_desc:0 "The Spanish arbitration is going against us, so we withdraw before it is read out. Nobody who leaves a hearing is ever again believed when he asks for one."
 ECU_abide_by_the_award:0 "Abide by the Award"
 ECU_abide_by_the_award_desc:0 "Take the verdict, lose the territory it takes, and gain something no argument has ever bought us: a border that can be pointed at, and a reputation for standing by a ruling."
 ECU_the_esmeraldas_campaign:0 "The Esmeraldas Campaign"
 ECU_the_esmeraldas_campaign_desc:0 "Three years hunting the concha rebels through the coastal forest. The province is ruined for five years, the army is somewhere it is not needed, and the montoneras learn how to hide."
 ECU_amnesty_for_the_colonel:0 "Amnesty for the Colonel"
 ECU_amnesty_for_the_colonel_desc:0 "Pardon them, disarm them, and take back the army. It costs authority and it saves a province, and the networks that hid them do not go away."
 ECU_the_end_of_concertaje:0 "The End of Concertaje"
 ECU_the_end_of_concertaje_desc:0 "Debt peonage abolished, and the men of the sierra are free to leave the estates. They will leave, the estates will not forgive it, and the land tax will fall the year after."
 ECU_the_moratorium_law:0 "The Moratorium Law"
 ECU_the_moratorium_law_desc:0 "The war closes the cacao markets and the state suspends convertibility. The power to issue money passes, without anyone quite deciding it, to a private bank in Guayaquil."
 ECU_the_royal_decree_of_1802:0 "The Royal Decree of 1802"
 ECU_the_royal_decree_of_1802_desc:0 "Every cedula, every visita, every colonial boundary marker, catalogued and cross-referenced. It is the best-argued claim in South America, and it argues, among other things, that the ground is not ours to garrison."
 ECU_the_vote_for_women:0 "The Vote for Women"
 ECU_the_vote_for_women_desc:0 "Matilde Hidalgo registers to vote and the courts uphold her: the first women's suffrage in the Americas. It arrives in the exact year the sierra clergy find their new political footing."
 ECU_the_ring_of_guayaquil:0 "The Ring of Guayaquil"
 ECU_the_ring_of_guayaquil_desc:0 "The bank lends to the state, the state cannot refuse the bank, and the president is a debtor. Credit is unlimited for as long as the interest is served, and only for that long."
 ECU_send_for_doctor_kemmerer:0 "Send for Doctor Kemmerer"
 ECU_send_for_doctor_kemmerer_desc:0 "The money doctor comes from Princeton with a central bank, a gold standard and a customs service. It works, it lasts, and it is written by a man who will never live here."
 ECU_our_own_remedy:0 "Our Own Remedy"
 ECU_our_own_remedy_desc:0 "The junta nationalises credit without a foreign mission and takes a first cautious bite at sierra land. It is ours, it is untested, and there is nobody to blame if it fails."
 ECU_the_workers_of_guayaquil:0 "The Workers of Guayaquil"
 ECU_the_workers_of_guayaquil_desc:0 "The general strike of November 1922 was answered with rifles and the bodies went into the river. What survives it is the first real labour movement the coast has had."
 ECU_the_military_league:0 "The Military League"
 ECU_the_military_league_desc:0 "Young officers take the state to reform it, which is the one thing armies are worst at and the one thing this country keeps asking them to do."
 ECU_the_compactacion:0 "The Compactacion"
 ECU_the_compactacion_desc:0 "Six-year terms, a disciplined party and a militia the state does not command. Twenty-five points of stability, and a rifle behind every one of them."
 ECU_the_congress_decides:0 "The Congress Decides"
 ECU_the_congress_decides_desc:0 "Legality holds, the Compactacion is broken up, and the presidency returns to being decided by people who can be voted out of it."
 ECU_washington_will_not_decide:0 "Washington Will Not Decide"
 ECU_washington_will_not_decide_desc:0 "The good offices produce meetings, minutes and nothing at all. The file has one use in it and the moment to spend it is not ours to pick, so pick what to do before then."
 ECU_shell_comes_to_the_oriente:0 "Shell Comes to the Oriente"
 ECU_shell_comes_to_the_oriente_desc:0 "A royalty, a landing strip and a road east, in exchange for signing a concession inside a zone we have spent forty years calling undisputed."
 ECU_the_oriente_is_not_for_sale:0 "The Oriente Is Not for Sale"
 ECU_the_oriente_is_not_for_sale_desc:0 "The file stays clean. There is no revenue, no track, no airstrip east of the Andes, and no argument that we ever treated the province as anything but our own."
 ECU_ratify_the_protocol:0 "Ratify the Protocol"
 ECU_ratify_the_protocol_desc:0 "Sign at Rio, accept the line, and the file is spent. It will not be spendable again, and the country will spend the next fifty years discovering what that means."
 ECU_we_will_not_sign:0 "We Will Not Sign"
 ECU_we_will_not_sign_desc:0 "Refuse, and the claim stays legally alive. Nothing whatsoever changes about who is standing on the ground, and everything changes about what can be said in front of a tribunal."
 ECU_the_labour_code:0 "The Labour Code"
 ECU_the_labour_code_desc:0 "Hours, contracts, unions and a right to strike, written into law where a decree cannot reach them. It closes the authoritarian road for good, which is the point."
 ECU_the_golden_fruit:0 "The Golden Fruit"
 ECU_the_golden_fruit_desc:0 "Cacao is dead of witches' broom and bananas take its place, on the same ships, through the same port, at a price set in the same foreign offices."
 ECU_a_dictatorship_of_order:0 "A Dictatorship of Order"
 ECU_a_dictatorship_of_order_desc:0 "Full powers, a censored press and a budget that balances. It is efficient, it is quiet, and it lasts exactly as long as the garrison that granted it."
 ECU_a_constituent_assembly:0 "A Constituent Assembly"
 ECU_a_constituent_assembly_desc:0 "A new constitution, drafted in the open, argued over for months. No authority is gained and the waltz of presidents slows by one beat."
 ECU_the_glorious_twenty_eighth:0 "The Glorious Twenty-Eighth"
 ECU_the_glorious_twenty_eighth_desc:0 "Conservatives and communists in one coalition, agreed on precisely one thing: that the man in the palace should not be. It works, and it will not hold."
 ECU_dissolve_the_assembly:0 "Dissolve the Assembly"
 ECU_dissolve_the_assembly_desc:0 "The president tears up the constitution that made him and writes another. The alliance falls apart, the defence minister goes back to his regiment, and the country is governable again for a while."
 ECU_govern_with_the_alliance:0 "Govern with the Alliance"
 ECU_govern_with_the_alliance_desc:0 "The 1945 constitution holds and the president spends the rest of his term being governed by his own coalition. It is slow, it is humiliating, and nobody is shot."
 ECU_guns_before_archives:0 "Guns Before Archives"
 ECU_guns_before_archives_desc:0 "Three years arming the south instead of arguing about it. The Zarumilla line holds in July 1941, and every rifle sent there is a rifle not standing behind the palace."
 ECU_the_carabineros:0 "The Carabineros"
 ECU_the_carabineros_desc:0 "A national gendarmerie, well paid and loyal to the presidency. No coup will succeed against it, and no division it holds at home can be sent to the frontier."
 ECU_beta_base:0 "Beta Base"
 ECU_beta_base_desc:0 "The Galapagos to the United States for the duration, and lend-lease, two guarantors and a four-level airfield in exchange. Sovereignty is suspended, not sold, and the distinction is thinner than it sounds."
 ECU_sovereignty_over_the_archipelago:0 "Sovereignty Over the Archipelago"
 ECU_sovereignty_over_the_archipelago_desc:0 "The islands stay wholly ours. There is nothing left to offer the one power whose signature at Rio would have been worth anything."
 ECU_the_protocol_is_inexecutable:0 "The Protocol Is Inexecutable"
 ECU_the_protocol_is_inexecutable_desc:0 "The Cordillera del Condor is not where the treaty says it is, so the demarcation stops. It is a real argument, it is permanent, and it is all we have left."
 ECU_the_thesis_of_nullity:0 "The Thesis of Nullity"
 ECU_the_thesis_of_nullity_desc:0 "A treaty signed under occupation is void. The four guarantors, asked directly, reply that it is valid. The claim is alive and the claim is alone."
 ECU_the_coastal_highway:0 "The Coastal Highway"
 ECU_the_coastal_highway_desc:0 "The banana plantations need a road out and the road needs a loan. It is the second infrastructure debt in this file, and it is contracted the same way as the first."
 ECU_a_term_completed:0 "A Term Completed"
 ECU_a_term_completed_desc:0 "Galo Plaza finishes his four years and hands over to an elected successor. It is the first time in half a century, and it is the point at which Ecuador stops being a country governed by barracks."
 ECU_idea_a_party_in_uniform:0 "A Party in Uniform"
 ECU_idea_a_party_in_uniform_desc:0 "The liberal party and the army are the same institution seen from two angles, and neither can be reformed without disarming the other."
 ECU_idea_a_party_in_uniform_2:0 "A Party Half in Uniform"
 ECU_idea_a_party_in_uniform_2_desc:0 "The party has civilians in it again, and the officers still decide which of them stands."
 ECU_idea_power_by_barracks:0 "Power by Barracks"
 ECU_idea_power_by_barracks_desc:0 "Fourteen presidents in as many years, and not one of them left office by the door he came in through."
 ECU_idea_the_church_against_the_state:0 "The Church Against the State"
 ECU_idea_the_church_against_the_state_desc:0 "The mortmain estates are the state's now. The sierra parishes will remember it every Sunday for two generations."
 ECU_idea_the_compactacion_governs:0 "The Compactacion Governs"
 ECU_idea_the_compactacion_governs_desc:0 "A disciplined party with a militia of its own, six-year terms, and the quietest streets in South America."
 ECU_idea_the_carabineros:0 "The Carabineros"
 ECU_idea_the_carabineros_desc:0 "Well paid, well armed and stationed where the presidency needs them, which is never the frontier."
 ECU_idea_the_bank_is_the_treasury:0 "The Bank Is the Treasury"
 ECU_idea_the_bank_is_the_treasury_desc:0 "The power to issue money sits in a private house in Guayaquil, and the government asks it for permission."
 ECU_idea_paper_sucre:0 "Paper Sucre"
 ECU_idea_paper_sucre_desc:0 "The note in your hand is worth what the bank says it is worth this morning."
 ECU_idea_a_foreign_prescription:0 "A Foreign Prescription"
 ECU_idea_a_foreign_prescription_desc:0 "A central bank, a gold standard and a customs service that works, all of it designed by a man in Princeton."
 ECU_idea_bonds_of_the_railway:0 "Bonds of the Railway"
 ECU_idea_bonds_of_the_railway_desc:0 "The customs are pledged to the bondholders until the line pays for itself, which the line will not do."
 ECU_idea_the_second_road_debt:0 "The Second Road Debt"
 ECU_idea_the_second_road_debt_desc:0 "The same pledge, the same lenders, a different decade and a different crop."
 ECU_idea_a_single_fruit:0 "A Single Fruit"
 ECU_idea_a_single_fruit_desc:0 "Cacao is two-thirds of what leaves this country, and its price is decided in a room nobody here has ever seen."
 ECU_idea_another_single_fruit:0 "Another Single Fruit"
 ECU_idea_another_single_fruit_desc:0 "Bananas now. Same ships, same port, same room."
 ECU_idea_we_refused_the_verdict:0 "We Refused the Verdict"
 ECU_idea_we_refused_the_verdict_desc:0 "We walked out of an arbitration we had asked for. No chancellery in the hemisphere has forgotten it."
 ECU_idea_the_archive_case:0 "The Archive Case"
 ECU_idea_the_archive_case_desc:0 "The best-argued territorial claim in South America, and it argues that the province is legally ours rather than practically reachable."
 ECU_idea_a_line_on_the_map:0 "A Line on the Map"
 ECU_idea_a_line_on_the_map_desc:0 "Signed at Rio in January 1942, with a foreign army on our soil and four hurried guarantors in the room."
 ECU_idea_the_claim_still_lives:0 "The Claim Still Lives"
 ECU_idea_the_claim_still_lives_desc:0 "Unsigned, unextinguished and unenforceable, which is three more than it was worth signed."
 ECU_idea_nothing_to_trade_in_rio:0 "Nothing to Trade in Rio"
 ECU_idea_nothing_to_trade_in_rio_desc:0 "The archipelago was never leased, so there is no favour outstanding when the one favour we need comes due."
 ECU_titles_without_garrisons_tt:0 "Opens the file: Title 65, effective possession 22, guarantors 0."
 ECU_the_tobar_treaty_tt:0 "Title +8 and one guarantor gained. The north-eastern Amazon claims are given up."
 ECU_not_one_league_to_brazil_tt:0 "No Title gained and no guarantor. The ceiling on guarantors falls to three."
 ECU_the_liberal_revolution_in_arms_tt:0 "A Party in Uniform softens by one step. Each step costs a point of sierra stability."
 ECU_the_law_of_dead_hands_tt:0 "Immediate revenue from the mortmain estates, and The Church Against the State for the rest of the game."
 ECU_the_january_revolution_tt:0 "The liberal camp is whole again, and Power by Barracks is installed permanently."
 ECU_let_garcia_govern_tt:0 "Divergence. Power by Barracks is never installed, and no coup roll is made for the rest of the game."
 ECU_the_first_cacao_in_the_world_tt:0 "Installs A Single Fruit and the exogenous world price, which no Ecuadorian decision can move."
 ECU_the_iron_road_to_quito_tt:0 "Infrastructure in the coast and the sierra, and customs pledged to the bondholders for decades."
 ECU_an_army_of_montoneras_tt:0 "Opens the opposition branch. Available from 1900 behind a discontent threshold, never behind a date."
 ECU_we_will_not_be_judged_tt:0 "Title falls by 25 in one stroke. One guarantor fewer for ever, and every future arbitration starts against us."
 ECU_abide_by_the_award_tt:0 "Divergence. Title +20 and one guarantor: the only submit-and-do-not-withdraw in the game."
 ECU_the_esmeraldas_campaign_tt:0 "Three years of internal war. Effective possession falls by 8 and the coastal province is ruined for five years."
 ECU_amnesty_for_the_colonel_tt:0 "Authority spent now, one step of the blood debt erased, and the army free for the frontier."
 ECU_the_end_of_concertaje_tt:0 "Sierra manpower rises. Landowner adherence and land revenue both fall, and the player cannot have both."
 ECU_the_moratorium_law_tt:0 "Liquidity now. The power to issue money passes to a private bank, at 0.20 political power a day."
 ECU_the_royal_decree_of_1802_tt:0 "Title +3. Army experience falls by 20 percent and deployment east is hard-capped while the case is argued."
 ECU_the_vote_for_women_tt:0 "Democratic adherence and political manpower rise, at the cost of the sierra clergy in the worst possible year."
 ECU_the_ring_of_guayaquil_tt:0 "Unlimited state credit for as long as the bank is served, at one point of stability a year."
 ECU_send_for_doctor_kemmerer_tt:0 "Paper Sucre and The Bank Is the Treasury are removed. International credit opens under a foreign prescription."
 ECU_our_own_remedy_tt:0 "Divergence. Credit nationalised without a foreign mission, and a limited sierra land reform."
 ECU_the_workers_of_guayaquil_tt:0 "A legal labour movement on the coast. Opens the decision The Fifteenth of November."
 ECU_the_military_league_tt:0 "The junta rebuilds the state, and opens both the monetary and the political crossroads of the era."
 ECU_the_compactacion_tt:0 "Divergence. Twenty-five points of stability, six-year terms, and a militia the state does not command."
 ECU_the_congress_decides_tt:0 "Legality preserved and the Compactacion broken up. Democratic adherence rises."
 ECU_washington_will_not_decide_tt:0 "Good offices produce nothing. The file has one use in it, and the moment is not ours to choose."
 ECU_shell_comes_to_the_oriente_tt:0 "Title -6 and possession +2. Money now, an airstrip east, and a concession inside the disputed zone."
 ECU_the_oriente_is_not_for_sale_tt:0 "Title +4. No revenue, no track, and no air infrastructure east of the Andes in 1941."
 ECU_ratify_the_protocol_tt:0 "The Title goes to zero for the rest of the game. It cannot be spent twice."
 ECU_we_will_not_sign_tt:0 "Divergence. The Title is not spent and the claim stays legally alive."
 ECU_the_labour_code_tt:0 "Lasting worker adherence, at the employers' expense. The authoritarian road closes for good."
 ECU_the_golden_fruit_tt:0 "A Single Fruit is removed by installing Another Single Fruit: the same dependence, a different crop."
 ECU_a_dictatorship_of_order_tt:0 "Full powers, immediate stability, a censored press, and Power by Barracks one step deeper."
 ECU_a_constituent_assembly_tt:0 "The 1938 constitution. Slow stability, restored legality, and no authority gained at all."
 ECU_the_glorious_twenty_eighth_tt:0 "A coalition from conservatives to communists. Two steps of Fifteen Presidents erased."
 ECU_dissolve_the_assembly_tt:0 "Authority and decision speed, the presidential constitution of 1946, and the alliance in pieces."
 ECU_govern_with_the_alliance_tt:0 "Divergence. The 1945 constitution holds, at the price of being governed by one's own coalition."
 ECU_guns_before_archives_tt:0 "Divergence. Effective possession +15. The Zarumilla line holds in July 1941."
 ECU_the_carabineros_tt:0 "Order at home and coup-proofing, with a hard ceiling on the divisions that can go south."
 ECU_beta_base_tt:0 "Two guarantors gained, lend-lease opened, and sovereignty over the archipelago suspended for the duration."
 ECU_sovereignty_over_the_archipelago_tt:0 "The archipelago stays wholly Ecuadorian, and there is nothing left to trade at Rio."
 ECU_the_protocol_is_inexecutable_tt:0 "The demarcation stops. A permanent diplomatic instrument against Peru."
 ECU_the_thesis_of_nullity_tt:0 "The claim on the eastern province is regenerated. All four guarantors hold the protocol valid."
 ECU_the_coastal_highway_tt:0 "Infrastructure on the coast, and the second infrastructure debt in this file."
 ECU_a_term_completed_tt:0 "The last step of Fifteen Presidents is removed and the coup roll is switched off for good."
