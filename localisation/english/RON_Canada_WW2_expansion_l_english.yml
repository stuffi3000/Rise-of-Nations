l_english:

 ##############################################################################
 # RON_Canada_WW2_expansion - localisation of the 1933-1948 expansion focuses.
 # 36 focus names, 36 descriptions, 36 tooltips, 21 research bonus labels and
 # 50 keys for the 25 ideas of common/ideas/CAN_WW2_expansion_ideas.txt.
 # Every key was checked against the whole loaded English localisation before
 # being written; none of them is defined anywhere else.
 ##############################################################################

 ##### BRANCH 07 - ARMY ########################################################

 CAN_operation_husky:0 "Operation Husky"
 CAN_operation_husky_desc:0 "The First Division and the First Armoured Brigade go ashore in Sicily on the tenth of July, because Ottawa asked for them to be there."
 CAN_operation_husky_tt:0 "The First Division sails for the Mediterranean and does not return. §GLand doctrine research is advanced.§! §RThe infantry reinforcement deficit begins to run from this day.§!\n§YStill unwritten§!: the detachment of the division and the armoured brigade to the theatre, and the 1943 assault template."

 CAN_breaking_the_hitler_line:0 "Breaking the Hitler Line"
 CAN_breaking_the_hitler_line_desc:0 "The twenty-third of May, in the Liri valley: the heaviest single day the First Corps will know, and the only occasion on which a Canadian formation breaks a prepared German line by frontal assault."
 CAN_breaking_the_hitler_line_tt:0 "The First Corps breaks a prepared line. §GArtillery research is advanced.§! §RThe reinforcement deficit rises again.§!\n§YStill unwritten§!: the fortification-assault army spirit, and General Burns as corps commander."

 CAN_the_ram_at_montreal:0 "The Ram"
 CAN_the_ram_at_montreal_desc:0 "Montreal Locomotive Works will build near enough two thousand cruiser tanks to a Canadian design, on Canadian tooling, with a Canadian gun. Not one will fire a shot in action: they are judged unfit for the line and spent on training in England."
 CAN_the_ram_at_montreal_tt:0 "Canada designs and builds its own armour. §GA full armour research bonus and faster arms production.§! §RThe tanks are unfit for the line: Canadian armour fights at a lasting disadvantage until the chassis is put to another use.§!\n§YStill unwritten§!: the two military factories at Montreal and the Canadian armoured division template."

 CAN_the_pattern_of_the_allies:0 "The Pattern of the Allies"
 CAN_the_pattern_of_the_allies_desc:0 "The Grizzly is a Sherman assembled at Montreal to American drawings, and the armoured regiments will fight in Shermans whatever else is decided here. Building to a pattern already proved saves two years and a great many crews."
 CAN_the_pattern_of_the_allies_tt:0 "Canada builds allied designs under licence. §GMedium armour research advanced twice over, and licences bought at half price.§! §RNo Canadian armour is designed again: national research is permanently slower.§!"

 CAN_the_sexton:0 "The Sexton"
 CAN_the_sexton_desc:0 "Put a twenty-five pounder on the rejected chassis and the whole Commonwealth wants it. Two thousand one hundred and fifty are built and they serve in every British and Canadian armoured division to the end of the war."
 CAN_the_sexton_tt:0 "The failed chassis becomes a self-propelled gun. §GArtillery research advanced, and the Ram penalty is lifted.§!"

 CAN_the_military_vehicle_programme:0 "Wheels for the Empire"
 CAN_the_military_vehicle_programme_desc:0 "Better than eight hundred thousand military vehicles, the greater part of them Canadian Military Pattern trucks, and a British division in the desert moves on them. This is the real armoured contribution of the country and nobody photographs it."
 CAN_the_military_vehicle_programme_tt:0 "The Dominion becomes the motor works of the alliance. §GMotorised research advanced, faster arms production, faster divisions.§! §RA fixed share of production is exported by contract and cannot be recalled.§!"

 CAN_the_pacific_command:0 "Pacific Command"
 CAN_the_pacific_command_desc:0 "Hong Kong is lost on Christmas Day and British Columbia wants an army. Three divisions are stood up on the coast, the panic subsides, and that is the whole of what they achieve, for no enemy ever comes."
 CAN_the_pacific_command_tt:0 "Three divisions garrison the Pacific coast. §GThe coastal panic on the Pacific states is lifted.§! §RThe men are raised for home defence only: the recruitable pool available for the war overseas is smaller.§!\n§YStill unwritten§!: the three home defence divisions and the Home Defence Only marker on their templates."
 CAN_the_canadian_womens_army_corps:0 "The Women's Army Corps"
 CAN_the_canadian_womens_army_corps_desc:0 "Some twenty-one thousand women are enlisted to release a man for the fighting line, which is the motto of the Corps and the exact truth of it. They are paid two thirds of a soldier's rate and they will be discharged first."
 CAN_the_canadian_womens_army_corps_tt:0 "Women are enlisted to release men for the line. §GThe recruitable pool grows.§! §RThe munitions plants lose the same hands: factory output falls.§!"
 CAN_clear_the_scheldt:0 "Clear the Scheldt"
 CAN_clear_the_scheldt_desc:0 "Antwerp has been in Allied hands since September and not a ton has been landed there, because the Germans hold the estuary."
 CAN_clear_the_scheldt_tt:0 "Five weeks of polder to open Antwerp. §GLand doctrine research is advanced.§! §RThe reinforcement deficit rises sharply: this is the battle that makes the crisis of November.§!\n§YStill unwritten§!: the allied convoy capacity returned by the opening of Antwerp, and the attrition of flooded ground."

 CAN_operation_goldflake:0 "Operation Goldflake"
 CAN_operation_goldflake_desc:0 "The First Corps is taken out of Italy in February and moved across France to join the Second, and for the first and only time the First Canadian Army fights whole. It is what McNaughton demanded for four years and was refused."
 CAN_operation_goldflake_tt:0 "The Army is concentrated at last. §GOrganisation and planning improve across the whole force.§! §ROne army on one very long line of supply: supply consumption rises.§!"

 CAN_the_mediterranean_corps:0 "The Mediterranean Corps"
 CAN_the_mediterranean_corps_desc:0 "The First Corps stays in Italy under British command, where it is wanted and where it has learned its trade. Two Canadian armies in two theatres, and Ottawa commands neither of them entire."
 CAN_the_mediterranean_corps_tt:0 "The Corps remains in Italy under British command. §GVeteran experience and morale.§! §RThe Army fights divided: organisation suffers and supply consumption rises.§!"

 CAN_the_hunger_winter:0 "The Hunger Winter"
 CAN_the_hunger_winter_desc:0 "The liberation of the Netherlands costs the Army more than seven thousand six hundred dead, and Operation Manna drops some seven thousand tons of food upon towns still held by the enemy."
 CAN_the_hunger_winter_tt:0 "The Netherlands are liberated and fed. §GThe Dominion is thanked by a nation it fed.§! §RThe last winter of infantry fighting: the reinforcement deficit rises again.§!\n§YStill unwritten§!: the permanent Dutch opinion and the annual commemoration that comes out of it."
 CAN_the_mobile_striking_force:0 "The Mobile Striking Force"
 CAN_the_mobile_striking_force_desc:0 "A million men have gone home and the defence estimates have fallen to two hundred millions. What is left is one airborne brigade group held ready for the North, upon the theory that the only ground threat to Canada arrives across the Arctic."
 CAN_the_mobile_striking_force_tt:0 "One airborne brigade for the North. §GParatroop research advanced; the force moves and plans faster and defends the country better.§! §RThis is the whole of the peacetime Army.§!"

 ##### BRANCH 08 - AIR FORCE ###################################################

 CAN_ferry_command:0 "Ferry Command"
 CAN_ferry_command_desc:0 "Seven Hudsons leave Gander in formation in November and cross the Atlantic in a night, which the airlines had said could not be made a routine. The organisation grown out of it delivers better than nine thousand aircraft and saves months of shipping."
 CAN_ferry_command_tt:0 "The Atlantic is flown as a delivery route. §GTransport research advanced; longer range and faster air experience.§! §RThe ocean takes its share of the crews: accidents rise.§!"

 CAN_the_lancaster_at_malton:0 "The Ruhr Express"
 CAN_the_lancaster_at_malton_desc:0 "Victory Aircraft at Malton builds four hundred and thirty Lancasters, the first handed over in August 1943. A country that could not assemble an airliner in 1938 is turning out four-engined heavy bombers."
 CAN_the_lancaster_at_malton_tt:0 "Heavy bombers are built in Ontario. §GStrategic bomber research advanced; heavier bomb loads and better factory efficiency.§! §RThe plant is a Crown works building somebody else's design: consumer goods rise.§!\n§YStill unwritten§!: the military factory at Malton and the British heavy bomber licence."

 CAN_the_burma_squadrons:0 "The Burma Squadrons"
 CAN_the_burma_squadrons_desc:0 "Four hundred and thirty-five and four hundred and thirty-six Squadrons fly Dakotas over the Arakan, supplying the Fourteenth Army from the air because there is no road. It is the whole presence of the Air Force in Asia."
 CAN_the_burma_squadrons_tt:0 "Transport squadrons are sent to the Burma front. §GTransport research advanced and a great deal of air experience.§! §RThey are not available to the European theatre while they are there.§!"

 CAN_the_area_offensive:0 "The Area Offensive"
 CAN_the_area_offensive_desc:0 "Six Group flies what Bomber Command directs, and what Bomber Command directs is the cities. The Group will finish the war with the best record in the Command and the worst casualty rolls in the Service."
 CAN_the_area_offensive_tt:0 "The Group is given to the city offensive. §GStrategic bombing is greatly more destructive.§! §RThe Group is burned out: crew experience is lost with every wing, and the country is unsettled by the casualty rolls.§!"

 CAN_oil_and_the_railways:0 "Oil and the Railways"
 CAN_oil_and_the_railways_desc:0 "The Minister for Air asks that Canadian squadrons be put against oil plants and marshalling yards rather than town centres, upon the argument that the Dominion is paying and may therefore say where. London grants it slowly and remembers it."
 CAN_oil_and_the_railways_tt:0 "Ottawa directs its own squadrons to oil and rail. §GAir superiority tells on the ground; the country is steadier.§! §RStrategic bombing is much weaker, and London takes it badly.§!"

 CAN_tiger_force:0 "Tiger Force"
 CAN_tiger_force_desc:0 "Eight squadrons are promised to the Commonwealth very long range bomber force for the war against Japan. Every man in them volunteers again, individually, for a second war, and that is the condition upon which the Cabinet will send anyone at all."
 CAN_tiger_force_tt:0 "Eight squadrons are offered for the war against Japan. §GStrategic bomber research advanced.§! §RA second war on volunteers alone: war support falls and the wings are under establishment.§!"

 CAN_avro_canada:0 "A. V. Roe Canada"
 CAN_avro_canada_desc:0 "Malton passes to Hawker Siddeley in 1945 and begins work upon a jet transport and an all-weather fighter of its own design. It is the first aircraft industry the country has owned outright."
 CAN_avro_canada_tt:0 "The Dominion acquires an aircraft design house of its own. §GJet research advanced; research is faster and accidents fewer.§! §RA first-rank works with a single customer: consumer goods rise for good.§!"

 ##### BRANCH 09 - NAVY ########################################################

 CAN_the_newfoundland_escort_force:0 "The Newfoundland Escort Force"
 CAN_the_newfoundland_escort_force_desc:0 "From St John's in May the Navy takes the western half of the North Atlantic run, the first time a Dominion has been given a share of an ocean. The corvettes are three months out of the yard and the ratings eight months out of civil life."
 CAN_the_newfoundland_escort_force_tt:0 "Canada takes the western ocean. §GEscort efficiency, convoys and naval experience.§! §RThe ships are slow and the crews are green.§!\n§YStill unwritten§!: the naval base at St John's, which belongs to Newfoundland until the thirty-first of March 1949."

 CAN_close_the_river:0 "Close the River"
 CAN_close_the_river_desc:0 "Twenty ships and the Sydney ferry are lost in the Gulf and the river in one season, within sight of the shore. In September the St Lawrence is shut to ocean traffic and the cargoes go by Halifax, which saves them."
 CAN_close_the_river_tt:0 "The St Lawrence is shut to ocean traffic. §GConvoy losses fall away and the escorts return to the ocean run.§! §RThe river provinces lose their port trade and the country is the less united for it.§!\n§YStill unwritten§!: the draw upon the linguistic fracture counter. The table of causes in the blood tax effect has no entry for the closing of the river, and no cause may be invented here."

 CAN_escort_the_gulf:0 "Escort the Gulf"
 CAN_escort_the_gulf_desc:0 "The river stays open and must therefore be escorted, upstream as far as Rimouski, in fog, in ice, and against submarines that can lie upon the bottom and wait. The province keeps its port traffic and its argument."
 CAN_escort_the_gulf_tt:0 "The river is held open and escorted. §GThe river provinces keep their trade.§! §RThe escort groups are drawn off the ocean run: convoy escort suffers everywhere else.§!"
 CAN_nelles_is_relieved:0 "The Minister Asks a Question"
 CAN_nelles_is_relieved_desc:0 "The Minister for Naval Services learns from his own officers that the escorts sent to the battle do not carry the centimetric sets he was told they carried, and that the Chief of the Naval Staff knew it. He relieves him in January."
 CAN_nelles_is_relieved_tt:0 "The Chief of the Naval Staff is relieved. §GRadar research advanced; detection and dockyard output improve.§! §RThe staff is in disorder for months: naval experience is gained more slowly.§!"

 CAN_the_naval_staff_closes_ranks:0 "The Service Closes Ranks"
 CAN_the_naval_staff_closes_ranks_desc:0 "The Admiral stays, the file is closed, and the Navy keeps its cohesion at the moment when it is expanding faster than any fleet in the alliance. The groups go back out with the equipment they had."
 CAN_the_naval_staff_closes_ranks_tt:0 "The Service is protected from the inquiry. §GNaval experience, and a staff that answers to nobody outside it.§! §RThe equipment gap is never closed: detection stays poor.§!"
 CAN_the_tribal_class_at_halifax:0 "Tribals at Halifax"
 CAN_the_tribal_class_at_halifax_desc:0 "Halifax Shipyards lays down fleet destroyers, the heaviest warships ever built in the Dominion, with turrets and fire control the country has never made before."
 CAN_the_tribal_class_at_halifax_tt:0 "Fleet destroyers are laid down in Canada. §GDestroyer research advanced; the fleet is faster and shoots better.§! §RDockyard capacity is taken from the escort programme.§!"

 CAN_the_river_class_frigates:0 "The River-class Frigates"
 CAN_the_river_class_frigates_desc:0 "The corvette was a whale-catcher with a gun upon it. The frigate is designed from the keel up to escort: twice the size, twice the endurance, and room for the sets and for the men to work them."
 CAN_the_river_class_frigates_tt:0 "A purpose-built escort at last. §GAnti-submarine research advanced and convoys delivered.§!\n§YStill unwritten§!: the River-class frigate hull, promised by the escort group reform and carried by no hull file yet."

 CAN_operation_neptune:0 "Neptune"
 CAN_operation_neptune_desc:0 "One hundred and ten Canadian ships and something near ten thousand men go to Normandy: landing craft flotillas at Juno, minesweepers at the head of the channels, destroyers upon the flanks."
 CAN_operation_neptune_tt:0 "The Navy puts the Army ashore. §GNaval doctrine research advanced, and experience for both services.§!"

 CAN_the_naval_air_arm:0 "A Naval Air Arm"
 CAN_the_naval_air_arm_desc:0 "Two Fleet Air Arm squadrons pass to the Royal Canadian Navy in January 1946, because a borrowed carrier is of no use without aircrew of one's own. The men come out of an Air Force that is being demobilised in the same season."
 CAN_the_naval_air_arm_tt:0 "The fleet acquires aircrew of its own. §GNaval aviation research advanced and experience for both services.§!"

 CAN_the_ocean_escort_force:0 "The Ocean Escort Force"
 CAN_the_ocean_escort_force_desc:0 "What survives of four hundred ships is a hard core of ocean escorts kept in commission in peacetime, working the approaches and the ice."
 CAN_the_ocean_escort_force_tt:0 "A peacetime escort force is kept in commission. §GConvoy defence research advanced and naval experience.§!"

 ##### BRANCHES 05 AND 06 - ECONOMY ############################################

 CAN_the_montreal_laboratory:0 "The Montreal Laboratory"
 CAN_the_montreal_laboratory_desc:0 "A British, Canadian and French team is installed at Montreal in January 1943 to work upon heavy water and plutonium."
 CAN_the_montreal_laboratory_tt:0 "An allied atomic laboratory is established at Montreal. §GNuclear research advanced and national research faster.§! §RThe results are the Committee's, not the Dominion's.§!"

 CAN_zeep_at_chalk_river:0 "ZEEP"
 CAN_zeep_at_chalk_river_desc:0 "The zero energy experimental pile goes critical at Chalk River upon the fifth of September 1945, the first reactor to operate outside the United States. The country holds the ore, the heavy water, the site and now the pile."
 CAN_zeep_at_chalk_river_tt:0 "The first reactor outside the United States. §GA research slot and a full nuclear research bonus.§!"

 CAN_an_independent_bomb:0 "An Independent Bomb"
 CAN_an_independent_bomb_desc:0 "Everything required is in Canadian hands except the will and the money."
 CAN_an_independent_bomb_tt:0 "The Dominion builds a weapon of its own. §GNuclear production is greatly increased.§! §RThe civil programme pays for it, the government loses authority, and both partners take it as a breach.§!"

 CAN_atomic_energy_of_canada:0 "Atomic Energy of Canada"
 CAN_atomic_energy_of_canada_desc:0 "The pile is turned to research, medical isotopes and power, and the Government states publicly that there will be no Canadian weapon."
 CAN_atomic_energy_of_canada_tt:0 "The pile is turned to peaceful use. §GResearch and industry both improve.§! §RThe country renounces the weapon: nuclear production is halved for good.§!"

 CAN_the_abbott_plan:0 "The Abbott Plan"
 CAN_the_abbott_plan_desc:0 "The American dollar reserve has fallen from twelve hundred millions to under five hundred in a year, because the country sells to Europe upon credit and buys from the United States in cash."
 CAN_the_abbott_plan_tt:0 "Imports are restricted by order in council. §GThe dollar gap is closed and home industry is protected.§! §RConsumer goods rise, exports are cut and the trading partners resent it.§!"

 CAN_the_marshall_dollars:0 "The Marshall Dollars"
 CAN_the_marshall_dollars_desc:0 "Washington agrees that European recovery credits may be spent outside the United States, and Canadian wheat, timber and steel go to Europe paid for in American dollars. The exchange crisis is over in eighteen months without a single quota."
 CAN_the_marshall_dollars_tt:0 "European recovery credits are spent in Canada. §GThe dollar gap is closed, industry expands and trade improves.§! §RThe export trade now depends upon a foreign appropriation: the government has less freedom of action.§!"

