 ##### IDEAS ###################################################################

 CAN_idea_a_tank_that_never_fought:0 "A Tank That Never Fought"
 CAN_idea_a_tank_that_never_fought_desc:0 "Near two thousand Ram cruisers built at Montreal, and every one of them relegated to the training establishments in England. The tooling and the trade are real; the fighting vehicle is not."

 CAN_idea_the_sexton:0 "The Sexton"
 CAN_idea_the_sexton_desc:0 "A twenty-five pounder upon the Ram chassis. Two thousand one hundred and fifty built, in service with every armoured division of the Commonwealth, and the only Canadian armoured vehicle that anybody asked for twice."

 CAN_idea_designs_from_elsewhere:0 "Designs from Elsewhere"
 CAN_idea_designs_from_elsewhere_desc:0 "The armoured regiments get a tank that works and the country gets no drawing office. Licences are cheap, patterns arrive ready, and nothing of Canadian design will roll out of a Canadian works again."

 CAN_idea_wheels_for_the_empire:0 "Wheels for the Empire"
 CAN_idea_wheels_for_the_empire_desc:0 "Eight hundred thousand vehicles and the Canadian Military Pattern truck under half the British Army. A fixed proportion of the output is committed abroad by contract before a Canadian division is served."

 CAN_idea_the_pacific_command:0 "Pacific Command"
 CAN_idea_the_pacific_command_desc:0 "Three divisions upon the coast against an enemy who never arrives, raised under an act that forbids their employment outside the continent. The Dominion has soldiers it may not use."

 CAN_idea_the_womens_army_corps:0 "The Women's Army Corps"
 CAN_idea_the_womens_army_corps_desc:0 "Twenty-one thousand women in uniform at two thirds of a soldier's pay, each of them releasing a man for the line. They are drawn from the same benches that fill the shell shops."

 CAN_idea_one_army_at_last:0 "One Army at Last"
 CAN_idea_one_army_at_last_desc:0 "Both corps under one Canadian commander in one theatre, which is what the Army was formed for and what it was denied for three years. It is fed down a single road from the Mediterranean."

 CAN_idea_two_theatres:0 "Two Theatres"
 CAN_idea_two_theatres_desc:0 "The best infantry in the Dominion is in Italy under a British army commander and the rest of it is in Holland. Veterans in both, and a single staff trying to supply and command across a continent."

 CAN_idea_the_mobile_striking_force:0 "The Mobile Striking Force"
 CAN_idea_the_mobile_striking_force_desc:0 "One airborne brigade group, trained for the Arctic, held at readiness. It is the only formation in the country that can move at short notice, and there is no second one behind it."

 CAN_idea_the_ruhr_express:0 "The Ruhr Express"
 CAN_idea_the_ruhr_express_desc:0 "Four hundred and thirty heavy bombers out of Malton, to English drawings, in a Crown plant. The country can build anything it is given the plans for, and it is given plans and not designs."

 CAN_idea_ferry_command:0 "Ferry Command"
 CAN_idea_ferry_command_desc:0 "Nine thousand aircraft flown across the Atlantic instead of crated and shipped. The route is navigated by dead reckoning in winter, and the losses are entered as delivery wastage."

 CAN_idea_the_area_offensive:0 "The Area Offensive"
 CAN_idea_the_area_offensive_desc:0 "Six Group flies against the cities, as the Command directs. The bomb loads tell; so do the casualty rolls, and every telegram is addressed to a Canadian town."

 CAN_idea_oil_and_the_railways:0 "Oil and the Railways"
 CAN_idea_oil_and_the_railways_desc:0 "Canadian squadrons directed against fuel plants and marshalling yards. The armies in the field feel the difference at once, and the Command does not conceal what it thinks of a Dominion that chooses its own targets."

 CAN_idea_avro_canada:0 "A. V. Roe Canada"
 CAN_idea_avro_canada_desc:0 "A design house of the first rank at Malton, with jet transports and an all-weather fighter upon the boards. Eleven million people are paying for it and the Air Force is the only customer."

 CAN_idea_the_newfoundland_escort_force:0 "The Newfoundland Escort Force"
 CAN_idea_the_newfoundland_escort_force_desc:0 "The western ocean is a Canadian responsibility from St John's. The corvettes are new, the ratings are newer, and the convoys go through because there is nothing else to send."

 CAN_idea_the_river_is_closed:0 "The River Is Closed"
 CAN_idea_the_river_is_closed_desc:0 "No ocean-going ship enters the St Lawrence. The convoys are safe at Halifax, the river ports are idle, and a province has been shown in writing where it stands in the order of defence."

 CAN_idea_the_gulf_stays_open:0 "The Gulf Stays Open"
 CAN_idea_the_gulf_stays_open_desc:0 "The river is held open and escorted to Rimouski. The province keeps its trade and its dignity; the mid-Atlantic keeps neither the ships nor the crews that are doing it."

 CAN_idea_a_minister_who_asks_questions:0 "A Minister Who Asks Questions"
 CAN_idea_a_minister_who_asks_questions_desc:0 "The Chief of the Naval Staff is relieved for concealing the state of the escorts. The sets are fitted and the civil power is established over the Service, at the price of a staff that will not speak freely for a year."

 CAN_idea_the_service_closes_ranks:0 "The Service Closes Ranks"
 CAN_idea_the_service_closes_ranks_desc:0 "The Admiral is retained and the report is filed. The Navy expands with its command structure whole and its escorts still fitted with the sets of 1941."

 CAN_idea_the_tribals:0 "The Tribals"
 CAN_idea_the_tribals_desc:0 "Fleet destroyers building at Halifax, the first heavy warships ever laid down in the Dominion. The slips they occupy were producing escorts a month ago."

 CAN_idea_the_montreal_laboratory:0 "The Montreal Laboratory"
 CAN_idea_the_montreal_laboratory_desc:0 "British, Canadian and French physicists at work upon heavy water in a Canadian city, upon Canadian ore, under a committee that sits in Washington."

 CAN_idea_an_independent_bomb:0 "An Independent Bomb"
 CAN_idea_an_independent_bomb_desc:0 "Separation plant, weapons establishment and a decade of the civil construction vote. The Dominion will have a weapon of its own and will be alone at the table where it is discussed."

 CAN_idea_atomic_energy_of_canada:0 "Atomic Energy of Canada"
 CAN_idea_atomic_energy_of_canada_desc:0 "Research, isotopes and power, and a public undertaking that there will be no Canadian weapon. It is the first renunciation of its kind, and it is worth more than the weapon."

 CAN_idea_the_import_restrictions:0 "The Import Restrictions"
 CAN_idea_the_import_restrictions_desc:0 "Excise taxes, quotas and twenty-six prohibited classes of American goods. The exchange is defended, the shelves are thinner, and the neighbours have taken note."

 CAN_idea_offshore_purchases:0 "Offshore Purchases"
 CAN_idea_offshore_purchases_desc:0 "Wheat, timber and steel sent to Europe and paid for out of American recovery credits. The exchange crisis is over and half the export trade now waits upon a vote in Congress."
