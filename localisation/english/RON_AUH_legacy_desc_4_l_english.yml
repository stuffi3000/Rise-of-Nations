l_english:
 AUHDNC_support_free_speech_desc:0 "Censorship in the Austrian half comes after printing: the papers publish, then the police seize the edition. Letting them alone will fill the Reichsrat with things the ministers would rather not hear."
 AUHDNC_the_imperial_diet_desc:0 "The Reichsrat has been governed by emergency decree under paragraph fourteen more often than by its own votes. Making it work again means the generals answer to deputies, which is precisely their objection."
 AUHDNC_economic_liberalism_desc:0 "The customs union between the two halves is renegotiated every ten years and each round ends in new tariffs. Opening the market instead trusts Bohemian industry to outsell what it can no longer keep out."
 AUHDNC_currency_reform_desc:0 "The krone replaced the gulden in 1892 on a gold standard at two to the florin, and the changeover took years to reach every till. Another adjustment buys the treasury room while prices settle."
 AUHDNC_tax_reductions_desc:0 "Bohm-Bawerk raised direct taxes to balance the common budget and resigned when the army asked for more. Cutting them back wins over the taxpayers and leaves the quota argument with Budapest untouched."
 AUHDNC_ordoliberal_paradise_desc:0 "The economists teaching at Vienna argue that the state should set the rules and then keep out of the market. A clear commercial code and honest courts draw the capital that subsidies have failed to buy."
 AUHDNC_establish_hegemonic_dominance_desc:0 "Bosnia was occupied in 1878 and run for thirty years by the joint finance ministry, the only school of colonial administration the Monarchy has. Its graduates can now govern more than one province."
 AUHDNC_manfrd_weiss_steel_and_metal_works_desc:0 "Manfred Weiss began with a cannery on Csepel island, moved into cartridges and then into steel. His works are now the largest in Hungary and the army's chief supplier of ammunition."
 AUHDNC_economic_reforms_desc:0 "Hungarian industrial policy has subsidised new factories by law since 1881, exempting them from tax for fifteen years. Vienna can copy the method it has spent twenty years resenting."
 AUHDNC_expand_military_industry_desc:0 "Skoda at Pilsen casts the heavy guns and the Csepel works fill the shells. Both run below what a two-front mobilisation would demand, and neither will expand on army orders alone."
 AUHDNC_vertical_integration_desc:0 "Witkowitz owns its ore, its coke and its mills, and Skoda would like the same. A works that buys nothing from a competitor cannot be squeezed by one, and the Vienna banks prefer lending to it."
 AUHDNC_sphere_of_influence_desc:0 "Serbia, Romania and the Ottoman lands buy Habsburg machinery and sell the Monarchy their grain and pigs. The tariff war with Belgrade after 1906 showed how fast that leverage turns into an enemy."
 AUHDNC_moderate_imperialism_desc:0 "The Monarchy holds no colonies and keeps a merchant fleet at Trieste with nowhere of its own to call. The North African coast is Ottoman in name and Italian in ambition, and Vienna's claim is no worse."
 AUHDNC_revise_weltpolitik_desc:0 "Weltpolitik is Berlin's word and Berlin's programme, and Vienna has paid for it in isolation without gaining a colony. Setting out what the Monarchy actually wants abroad is bound to alarm somebody."
 AUHDNC_cooperative_military_research_desc:0 "Steyr, Skoda and the German works already trade patents and machine tools across the border. Formal exchange of trial results spares the army testing a rifle that Spandau has already rejected."
 AUHDNC_revising_the_evidenzbureau_desc:0 "Military intelligence has run since 1850 on a handful of officers and a very small budget, and it is expected to watch Russia, Italy and Serbia at once. More men and better pay is the obvious answer."
 AUHDNC_bundesministerium_fr_landesverteidigung_desc:0 "Beside the common War Ministry each half keeps its own ministry for the territorial troops. Strengthening Vienna's gives the Austrian half soldiers Budapest cannot bargain away at the next Compromise."
 AUHDNC_bundesministerium_fr_inneres_desc:0 "The interior ministry runs the police, the district offices and the census that decides which language a town is recorded as speaking. A firmer hand there reaches further than any law the Reichsrat passes."
 AUHDNC_sterreichisches_bundesheer_desc:0 "The Austrian landwehr is a second army with a ministry of its own, kept clear of the common force Budapest bargains over every ten years. Training it properly gives Vienna troops it need not share."
 AUHDNC_zivildienst_desc:0 "Men excused the ranks are simply lost to the state. Putting them to roads, hospitals and the railways under military discipline returns the labour and keeps the recruiting rolls honest."
 AUHDNC_new_military_ethos_desc:0 "The Common Army drills in German while its recruits answer in twelve tongues, and its senior officers still study the campaign of 1866. A service arguing about method rather than language would learn faster."
 AUHDNC_crack_down_on_secret_societies_desc:0 "Freemasonry is banned in the Austrian half and tolerated in Hungary, so the lodges simply meet across the Leitha. The army runs the sweep itself, loses the officers it arrests, and learns about its own men."
 AUHDNC_loyalty_to_the_kaiser_desc:0 "Franz Joseph has reigned since 1848 and outlived his brother, his son and his wife. Whatever the nationalities want, nearly all still swear to the person of the Emperor rather than to any parliament."
 AUHDNC_indivisibiliter_ac_inseparabiliter_desc:0 "The old imperial motto promises a realm indivisible and inseparable, and the Compromise of 1867 made that a polite fiction. Enforcing it means governing eleven nations as one, admitting no exceptions."
 AUHDNC_nationalism_on_the_rise_desc:0 "Schonerer's Pan-Germans and the Young Czechs have both learned that the street answers faster than the Reichsrat. Once nationality is the only question, the parties that shout it loudest gain."
 AUHDNC_opress_minorities_desc:0 "The Hungarian school laws of 1879 and 1907 made Magyar compulsory in every classroom and produced riots rather than Magyars. Applying that method across the whole Monarchy will not go any quieter."
 AUHDNC_promote_austrian_nationalism_desc:0 "Barely a third of the Austrian half speaks German, and Schonerer's followers answer that by looking to Berlin instead of Vienna. A German nationalism loyal to the Habsburgs has to be built on purpose."
 AUHDNC_bohemia_is_austrian_desc:0 "The Badeni ordinances of 1897 made Czech equal to German in the Bohemian offices and brought the Reichsrat to a standstill. Repealing them settles the language question by refusing to hear it."
 AUHDNC_autonomy_for_minorities_desc:0 "Eleven nationalities, none of them a majority, and only Germans and Magyars hold a parliament of their own. Conceding to the rest costs Vienna and Budapest their monopoly and buys quiet in the provinces."
 AUHDNC_autonomy_for_hungarians_desc:0 "Hungary already has its parliament, its government and its honved under the 1867 Compromise. What remains is the customs union and the three common ministries, which Budapest has wanted gone for decades."
 AUHDNC_autonomy_for_bohemians_desc:0 "The Bohemian Diet has demanded its own coronation oath since 1871, when Franz Joseph accepted the Fundamental Articles and then withdrew them under German and Hungarian pressure. This time it is kept."
 AUHDNC_autonomy_for_galicia_desc:0 "Galicia has run its own schools and a Polish-language university at Krakow since the 1870s, with a minister for Galician affairs sitting in Vienna. Formal home rule only admits what already works."
 AUHDNC_autonomy_for_croatians_desc:0 "The Nagodba of 1868 gave Croatia its own Sabor and a ban appointed from Budapest. Widening that into real self-government, with Dalmatia and Bosnia attached, makes one Slav kingdom out of scattered lands."
 AUHDNC_the_united_states_of_greater_austria_desc:0 "Aurel Popovici published his map of fifteen federal states in 1906, and Franz Ferdinand's circle at the Belvedere read it seriously. Dualism ends and every nationality is given a unit of its own."
 AUHDNC_promote_belarussian_nationalism_desc:0 "Belarusian was barely a printed language before the paper Nasha Niva began appearing in 1906, and St Petersburg treated it as a dialect. Vienna funded Ukrainian schools in Galicia for the same reason."
 AUH_DNC_army_efforts_desc:0 "The Common Army has not fought since the Bosnian occupation of 1878, and its senior officers learned their trade against Prussia in 1866. Manoeuvres at campaign scale are the only way to see what is left."
 AUH_DNC_new_navy_desc:0 "The fleet spent the 1890s building coast-defence ships for a sea it never expected to leave. Officers trained on the Monarch class must learn a different service before the first big ships commission."
