 CAN_the_alaska_tribunal:0 "The Alaska Tribunal"
 CAN_the_alaska_tribunal_desc:0 "Six impartial jurists sat at London, and one of them was Lord Alverstone. He voted with the Americans, the Panhandle is theirs, and our two commissioners have refused to put their names to the award."
 CAN_the_alaska_tribunal_tt:0 "Ottawa abides by the award of 20 October 1903. Sets §YBetrayed at London§!: §Gpolitical power is gathered faster along this road§!; §RBritish opinion falls, and the coastal strip is surrendered for good and may never be claimed§!."
 CAN_a_department_of_our_own:0 "A Department of Our Own"
 CAN_a_department_of_our_own_desc:0 "Sir Joseph Pope has for years kept the Dominion's correspondence with the world in a desk drawer, and the Alaska business has shown what that is worth."
 CAN_a_department_of_our_own_tt:0 "Establishes the §YDepartment of External Affairs§!. §YDominion Without a Foreign Office§! falls from IV to III: §Ga diplomatic adviser slot is opened and attaches may be posted abroad§!.\n§YBypassed§! if the Dominion is already nobody's subject."
 CAN_the_conciliation_act:0 "The Conciliation Act"
 CAN_the_conciliation_act_desc:0 "Strikes on the railways and in the coal fields have twice brought the country to a halt, and the Militia cannot be sent to every pithead. A Department of Labour will be created, with power to send a conciliator before a dispute becomes a war."
 CAN_the_conciliation_act_tt:0 "Creates the §YDepartment of Labour§! and the office of conciliator. §GStability rises and political power is gained.§! Opens the labour road."
 CAN_the_autonomy_bills:0 "The Autonomy Bills"
 CAN_the_autonomy_bills_desc:0 "Alberta and Saskatchewan will enter Confederation as provinces this year, and the terms are ours to write. Ottawa keeps the lands and the minerals in trust, as it has since 1870, and pays the new governments a subsidy in lieu."
 CAN_the_autonomy_bills_tt:0 "Erects §YAlberta§! and §YSaskatchewan§! as provinces. Sets §YCrown Lands Reserved§!: §Gthe Dominion keeps the lands, mines and timber of the Prairie provinces§!; §Ra subsidy is paid in their place, and the grievance is remembered in the West§!."
 CAN_the_industrial_disputes_act:0 "The Industrial Disputes Act"
 CAN_the_industrial_disputes_act_desc:0 "The Lemieux measure will forbid any strike or lockout in a mine, a railway or a public utility until a board of investigation has reported. Thirty days of enforced patience have broken more strikes than any magistrate ever did."
 CAN_the_industrial_disputes_act_tt:0 "Passes the §YIndustrial Disputes Investigation Act§!: no strike or lockout in a mine, railway or utility until a board has reported. §GStability and compliance rise.§! §RLabour grievance accumulates.§!"
 CAN_recognize_the_unions:0 "Recognize the Unions"
 CAN_recognize_the_unions_desc:0 "The alternative to the cooling-off board is to admit what the shop floor already knows: the union is the workingman's bargaining agent, and the law may as well say so."
 CAN_recognize_the_unions_tt:0 "Trade unions are recognized in law as bargaining agents. §GLabour grievance falls sharply and the labour road opens on better terms.§! §RStability falls and industrial opinion turns against the government.§!"
 CAN_pay_the_imperial_levy:0 "Pay the Imperial Levy"
 CAN_pay_the_imperial_levy_desc:0 "The Admiralty asks the Dominions for a cash contribution to the fleet that keeps our trade afloat, and the sum is not beyond us. Paying it buys a hearing in Whitehall that no amount of resolution-passing has ever bought."
 CAN_pay_the_imperial_levy_tt:0 "Ottawa votes the Admiralty its contribution. §GA hearing in Whitehall, and the imperial road opens.§! §RNationalist opinion hardens.§!"
 CAN_the_nationalist_league:0 "The Nationalist League"
 CAN_the_nationalist_league_desc:0 "Mr Bourassa has left the Liberal benches and taken a good part of Quebec with him. His Ligue nationaliste asks the question the Cabinet has been careful never to answer: whether the Dominion is a nation or a recruiting ground."
 CAN_the_nationalist_league_tt:0 "The §YLigue nationaliste canadienne§! is tolerated and grows. §GPolitical power is gained and the nationalist road opens.§! §RWar support falls.§!"
 CAN_a_seat_on_the_imperial_council:0 "A Seat on the Imperial Council"
 CAN_a_seat_on_the_imperial_council_desc:0 "Having paid, Ottawa may now ask. The Dominion will press for a standing seat at the Colonial Conference table rather than an invitation renewed every four years at London's pleasure."
 CAN_a_seat_on_the_imperial_council_tt:0 "The Dominion presses for a permanent place at the Imperial Conference table. §GPolitical power is gained and Canadian standing in imperial councils rises.§!"
 CAN_reject_the_alaska_award:0 "Reject the Alaska Award"
 CAN_reject_the_alaska_award_desc:0 "Jette and Aylesworth would not sign, and the Cabinet will stand with them. Ottawa declines to treat the Alverstone award as binding upon the Dominion, whatever London has undertaken on our behalf."
 CAN_reject_the_alaska_award_tt:0 "Ottawa refuses to be bound by the award of 1903. §GPolitical power and war support rise, and the constitutional road opens.§! §RRelations with London and Washington suffer.§!"
 CAN_treat_direct_with_washington:0 "Treat Direct with Washington"
 CAN_treat_direct_with_washington_desc:0 "If the Empire will not defend our boundary, the Dominion will negotiate its own. Ottawa will seek to deal with the State Department directly, without a British minister sitting between us as interpreter and censor."
 CAN_treat_direct_with_washington_tt:0 "Ottawa opens direct dealings with the State Department. §GAmerican opinion improves and the continental road opens.§! §RBritish opinion falls.§!"
 CAN_let_the_admiralty_stay:0 "Let the Admiralty Stay"
 CAN_let_the_admiralty_stay_desc:0 "Halifax and Esquimalt were handed to us in 1906 and we have made a poor showing of them since. Rather than raise a service we cannot man, the Dominion will leave the coasts and the dockyards in the Admiralty's keeping and pay for the privilege."
 CAN_let_the_admiralty_stay_tt:0 "The Royal Navy keeps the coasts and the dockyards. §GNaval experience is gained.§! §RNo fleet of our own will ever be built: the Canadian naval road is closed.§!"
 CAN_the_lynn_canal_posts:0 "The Lynn Canal Posts"
 CAN_the_lynn_canal_posts_desc:0 "Superintendent Steele put a Maxim gun and a handful of red coats on the summits of the Chilkoot and the White Pass, and that line held when nothing else would have."
 CAN_the_lynn_canal_posts_tt:0 "The Mounted Police posts on the passes are reinforced and held. §GArmy experience is gained and the northern frontier is secured.§! §RTension with the United States rises.§!"
 CAN_the_grain_growers_guide:0 "The Grain Growers' Guide"
 CAN_the_grain_growers_guide_desc:0 "The grain growers have a paper of their own now, printed in Winnipeg and read at every crossroads elevator from Brandon to Lethbridge. Week after week it sets out the freight rate, the tariff and the elevator combine in figures no farmer can misread."
 CAN_the_grain_growers_guide_tt:0 "The farmers' press is established in the West. §GPolitical power is gained and the agrarian movement takes shape.§! §RStability falls and prairie anger begins to accumulate.§!"
 CAN_the_last_best_west:0 "The Last Best West"
 CAN_the_last_best_west_desc:0 "Mr Sifton has covered Europe and the American Middle West with handbills promising a hundred and sixty free acres to any man who will break them."
 CAN_the_last_best_west_tt:0 "The immigration campaign is opened in earnest. §GManpower and political power are gained, and the western road opens.§!"
 CAN_the_sheepskin_coat_men:0 "Men in Sheepskin Coats"
 CAN_the_sheepskin_coat_men_desc:0 "Sir Clifford's test is not the passport but the plough: a stalwart peasant in a sheep-skin coat, born on the soil, whose forefathers have been farmers for ten generations, with a stout wife and a half-dozen children."
 CAN_the_sheepskin_coat_men_tt:0 "Immigration is opened to central and eastern Europe. §GA great gain of manpower and far faster settlement of the Prairies.§! §RStability falls as nativist feeling rises in Ontario and the West.§!"
 CAN_a_british_west:0 "A British West"
 CAN_a_british_west_desc:0 "The West will be filled, but it will be filled with British and American farmers who need no schooling in our institutions. The agents in Kiev and Lemberg will be recalled and the bonus on continental families withdrawn."
 CAN_a_british_west_tt:0 "Settlement is restricted to British and American arrivals. §GStability and political power rise, and the West remains loyal.§! §RManpower grows far more slowly.§!"
 CAN_the_marquis_wheat:0 "Marquis Wheat"
 CAN_the_marquis_wheat_desc:0 "Dr Saunders has crossed Red Fife with a Himalayan hard red and produced a wheat that ripens a week earlier than anything now in the ground. A week is the difference between a crop and a frost, and it carries the wheat line two hundred miles north."
 CAN_the_marquis_wheat_tt:0 "§YMarquis§! wheat is distributed from the Central Experimental Farm. §GAgricultural output rises across the Prairies and the wheat line moves north.§!"
 CAN_three_roads_to_the_pacific:0 "Three Roads to the Pacific"
 CAN_three_roads_to_the_pacific_desc:0 "Mackenzie and Mann have their charter and the Grand Trunk wants another; with the Canadian Pacific that makes three roads where one is now full."
 CAN_three_roads_to_the_pacific_tt:0 "Bonds are guaranteed for two further transcontinental lines. §GInfrastructure and construction expand across the West.§! Sets §YRailway Overbuild§!: §Rthe Dominion carries the guarantees, and the debt with them§!."
 CAN_one_road_is_enough:0 "One Road Is Enough"
 CAN_one_road_is_enough_desc:0 "The Canadian Pacific carries every bushel the West can grow and half its cars run empty in winter. The Cabinet will refuse the second and third charters and let the promoters find their money in London if they can."
 CAN_one_road_is_enough_tt:0 "The further transcontinental charters are refused. §GA large gain of political power, and the treasury is spared.§! §RThe West is embittered and building in the Prairies is slower.§!"
 CAN_bounties_of_iron_and_steel:0 "Bounties of Iron and Steel"
 CAN_bounties_of_iron_and_steel_desc:0 "A bounty of three dollars the ton on pig iron, and rather more on steel rails, has raised furnaces at Sydney, Hamilton and the Soo where there was nothing a decade ago."
 CAN_bounties_of_iron_and_steel_tt:0 "The iron and steel bounties are renewed. §GHeavy industry expands in Ontario and Nova Scotia.§! §RPolitical power is spent and the West resents the subsidy.§!"
 CAN_power_at_cost:0 "Power at Cost"
 CAN_power_at_cost_desc:0 "Mr Beck has carried Ontario on a single phrase, and the phrase is power at cost. The current from Niagara will be generated and distributed by a public commission answering to the municipalities, not by a syndicate answering to Buffalo."
 CAN_power_at_cost_tt:0 "Niagara power is placed under a public commission and sold at cost. §GCheap current across Ontario: industry expands and political power is gained.§! §RPrivate and foreign capital take offence.§!"
 CAN_the_syndicate_at_the_falls:0 "The Syndicate at the Falls"
 CAN_the_syndicate_at_the_falls_desc:0 "The Electrical Development Company and its friends have the charters, the capital and the turbines already turning. Leaving the falls in their hands costs the Treasury nothing and brings American money into the province by the trainload."
 CAN_the_syndicate_at_the_falls_tt:0 "The Niagara franchises are left with private capital. §GPolitical power is gained at no cost to the treasury, and foreign investment flows in.§! §RPower is dear, and much of it is sold across the river.§!"
 CAN_the_militia_act_of_1904:0 "The Militia Act of 1904"
 CAN_the_militia_act_of_1904_desc:0 "Sir Frederick's Bill will abolish the office of General Officer Commanding and put a Militia Council in its place, on the Army Council model."
 CAN_the_militia_act_of_1904_tt:0 "Passes the §YMilitia Act of 1904§!: a Militia Council replaces the General Officer Commanding, and a Canadian may hold the command. §GArmy experience and political power are gained, and the army road opens.§!"
 CAN_the_general_officer_commanding:0 "An Imperial Officer Commands"
 CAN_the_general_officer_commanding_desc:0 "The Militia is a force of clerks and farmers who drill twelve days a year, and it has never yet been commanded by a Canadian who knew his business."
 CAN_the_general_officer_commanding_tt:0 "A British officer is retained as §YGeneral Officer Commanding§!. §GArmy experience is gained and imperial staff training is available.§! §RThe Militia never learns to command itself.§!"

 ##### ere WW1 (1910-1918) - 20 focus
 CAN_the_imperial_secretariat:0 "The Imperial Secretariat"
 CAN_the_imperial_secretariat_desc:0 "Ottawa will press for what the Colonial Conference has always refused: a standing imperial secretariat, sitting permanently in London, with the Dominions at the table where policy is made."
 CAN_the_imperial_secretariat_tt:0 "§RThis road can never fall below Colonial Deference II, its later focuses take far longer, and both Chanak and the choice of 1939 are closed to the Dominion.§!"
 CAN_no_permanent_imperial_council:0 "No Permanent Imperial Council"
 CAN_no_permanent_imperial_council_desc:0 "A permanent council in London would bind the Dominion to decisions taken in its absence and call it consultation. Ottawa will attend the conferences, sign nothing it has not read, and reserve every question for Parliament."
 CAN_no_permanent_imperial_council_tt:0 "Ottawa refuses a standing imperial council. Removes §YImperial Consultation Required§!: §Gthe Dominion may negotiate without the Foreign Office's leave, and focuses on this road cost less political power§!."
 CAN_a_share_of_the_burden:0 "A Share of the Burden"
 CAN_a_share_of_the_burden_desc:0 "The Empire's fleet keeps our wheat moving and our coasts quiet, and we have paid nothing towards it in a generation."
 CAN_a_share_of_the_burden_tt:0 "The Dominion votes its contribution and takes a permanent seat on the §YCommittee of Imperial Defence§!. §GBritish naval doctrine is shared and two capital ships are loaned.§!"
 CAN_a_voice_in_imperial_policy:0 "A Voice in Imperial Policy"
 CAN_a_voice_in_imperial_policy_desc:0 "If we are to be at war whenever Britain is at war, we shall at least know why beforehand. Ottawa will insist on notice of any policy that may lead to hostilities, in time for the Cabinet to consider it."
 CAN_a_voice_in_imperial_policy_tt:0 "§YDominion Without a Foreign Office§! falls from III to II. §GThirty days' warning before the faction leader justifies any war aim, and the penalty to Canadian influence is lifted.§!"
 CAN_resolution_the_ninth:0 "Resolution the Ninth"
 CAN_resolution_the_ninth_desc:0 "The Conference has resolved that the Dominions are autonomous nations of an Imperial Commonwealth, entitled to an adequate voice in foreign policy and to continuous consultation. Sir Robert did not obtain it by argument."
 CAN_resolution_the_ninth_tt:0 "§YResolution IX§! of the Imperial War Conference is carried. §YDominion Without a Foreign Office§! falls from II to I, and a seat in the §YImperial War Cabinet§! is unlocked.\n§YRequires§!: Britain at war with a major power, Canada co-belligerent, and the standing won at Vimy."
 CAN_settle_it_now:0 "Settle It Now"
 CAN_settle_it_now_desc:0 "The war has made us indispensable, and a debt is best collected while the creditor still needs the lender."
 CAN_settle_it_now_tt:0 "The constitutional bill is presented while the war is still on. §G§YColonial Deference§! falls from III to I at a stroke, and political power accrues far faster.§! Sets §YThe Bill Presented Early§!: §RBritish aid and munitions contracts are halved until the war ends, British opinion collapses, and equality of status is closed for good§!."
 CAN_plebiscite_on_the_navy:0 "Plebiscite on the Navy"
 CAN_plebiscite_on_the_navy_desc:0 "Neither the Laurier cruisers nor Sir Robert's three dreadnoughts have been put to the country, and the country has been asked for neither. Before a dollar is voted for any fleet, the question will go to the people."
 CAN_plebiscite_on_the_navy_tt:0 "No fleet is built; the naval question goes to the people. Sets §YThe Referendum Precedent§!: §Gstability rises§!; §Rno service may be raised beyond volunteers without a plebiscite carried first§!. §RThe Canadian naval road is closed.§!"
 CAN_a_paper_of_our_own:0 "A Paper of Our Own"
 CAN_a_paper_of_our_own_desc:0 "Mr Bourassa has founded a daily in Montreal and given it the motto Fais ce que dois. It will print what no English paper in the Dominion will print: that a French Canadian owes Canada everything and the Empire nothing."
 CAN_a_paper_of_our_own_tt:0 "§GImperial war measures bite only half as hard in the French-speaking states.§!"
 CAN_reciprocity_1911:0 "Reciprocity 1911"
 CAN_reciprocity_1911_desc:0 "Mr Fielding and Mr Paterson have brought back from Washington the freest trade in natural products since 1866, and it is tabled in the House this January. It needs no treaty and no royal assent, only a vote in both capitals."
 CAN_reciprocity_1911_tt:0 "The reciprocity agreement is negotiated and tabled in the Commons. Sets §YThe Agreement Is Tabled§! for 180 days and calls the House to decide. §RIf the window closes without ratification, the government falls, the agreement dies, and the continental road stays shut until the thirties.§!"
 CAN_the_new_national_policy:0 "The New National Policy"
 CAN_the_new_national_policy_desc:0 "The Council of Agriculture has published a platform, and it is a programme of government rather than a petition: the tariff down, the railways public, war profits taxed, and a graduated levy on income and inheritance."
 CAN_the_new_national_policy_tt:0 "The farmers' platform becomes a party. §GAn agrarian party enters the field and grows while the West is angry.§! §RTariff revenue falls.§!\n§YRequires§!: the tariff demand refused, or prairie anger already high."
 CAN_a_ministry_not_a_board:0 "A Ministry, Not a Board"
 CAN_a_ministry_not_a_board_desc:0 "The Shell Committee has left a scandal that will not be lived down, and London proposes to take the business out of our hands entirely."
 CAN_a_ministry_not_a_board_tt:0 "§REquipment production falls for 180 days, and British opinion falls.§! §GA military factory is raised in Quebec and another in Ontario, and the Dominion alone may lay down the Ottawa arsenal.§!"
 CAN_the_imperial_munitions_board:0 "The Imperial Munitions Board"
 CAN_the_imperial_munitions_board_desc:0 "Sir Joseph Flavelle will take the business over as London's agent in Canada, with London's money and London's orders. Plants will be built here at imperial expense and they will belong to the Imperial Munitions Board, not to us."
 CAN_the_imperial_munitions_board_tt:0 "§GTwo military factories are built at London's expense.§! §RThe plants remain British property, and a Canadian arsenal is closed for good.§!"
 CAN_the_canadian_expeditionary_force:0 "The Canadian Expeditionary Force"
 CAN_the_canadian_expeditionary_force_desc:0 "Colonel Hughes has torn up the mobilization scheme and called the militia battalions to a camp that did not exist a month ago. Thirty-three thousand men are under canvas at Valcartier and the first contingent sails in October."
 CAN_the_canadian_expeditionary_force_tt:0 "Grants the §YCEF Infantry Division§! template. §GFar faster training for 360 days, and two extra division slots.§!"
 CAN_raise_french_canadian_battalions:0 "Raise French-Canadian Battalions"
 CAN_raise_french_canadian_battalions_desc:0 "Every recruiting poster in Quebec is printed in English and every officer above captain speaks it."
 CAN_raise_french_canadian_battalions_tt:0 "§GEvery later levy on the blood tax weighs a fifth less, for the rest of the game.§! §RThe first division of the Force is delayed by 90 days, and British opinion falls.§!"
 CAN_the_vimy_method:0 "The Vimy Method"
 CAN_the_vimy_method_desc:0 "General Byng sent his officers to study Verdun and General Currie came back with a method: every man given the map, the platoon rebuilt round its Lewis gun, the counter-battery work done by mathematics, and the barrage timed to the yard."
 CAN_the_vimy_method_tt:0 "Grants the army spirit §YSet-Piece Perfectionists§!."
 CAN_the_voluntary_compact:0 "The Voluntary Compact"
 CAN_the_voluntary_compact_desc:0 "Sir Wilfrid warned that conscription would break the country in two, and the recruiting returns say he was right about Quebec. The government will give its word, in the House and in writing, that no man will be sent overseas who did not offer."
 CAN_the_voluntary_compact_tt:0 "The government pledges that no man will be compelled to serve overseas. §GThe Military Service Act can raise the blood tax no further, and the levies of 1944 weigh half as much.§! §RNo more than four divisions may serve overseas, and no man may be compelled until the Dominion is herself attacked.§!"
 CAN_the_military_service_act:0 "The Military Service Act"
 CAN_the_military_service_act_desc:0 "The Corps is losing men faster than the recruiting offices can find them and the voluntary system is finished. The Act will call up unmarried men of twenty to thirty-four, and the exemptions will be tightened until the drafts come."
 CAN_the_military_service_act_tt:0 "§GReinforcements rise for 360 days.§!"
 CAN_the_naval_service_act:0 "The Naval Service Act"
 CAN_the_naval_service_act_desc:0 "The Act of the fourth of May creates a naval service of the Dominion, a department to administer it and a college at Halifax to train its officers. Two elderly cruisers, Niobe and Rainbow, are all we can buy this year."
 CAN_the_naval_service_act_tt:0 "Creates the Department of the Naval Service and the Royal Naval College at Halifax. §GA dockyard slot is opened in Nova Scotia and another in British Columbia.§!"
 CAN_a_fleet_unit_of_our_own:0 "A Fleet Unit of Our Own"
 CAN_a_fleet_unit_of_our_own_desc:0 "If the Dominion is to have ships, they will be designed and built here, at Halifax and at Vickers in Montreal, and not bought second-hand from the Admiralty list. The first hulls will be slow, dear and imperfect."
 CAN_a_fleet_unit_of_our_own_tt:0 "Canadian yards are built up at Halifax and Montreal. §GTwo dockyard slots are opened, destroyer and escort hulls may be designed at home, and light warships cost a quarter less.§!"
 CAN_dreadnoughts_for_the_empire:0 "Dreadnoughts for the Empire"
 CAN_dreadnoughts_for_the_empire_desc:0 "Sir Robert will vote thirty-five millions for three dreadnoughts, to be built in British yards and placed at the Admiralty's disposal. It buys the Empire a battle squadron at once instead of a Canadian flotilla in ten years."
 CAN_dreadnoughts_for_the_empire_tt:0 "§GTwo destroyers are loaned on every entry into war.§! §RNo Canadian warship may be designed.§! The Senate will have its say."

 ##### ere INT (1919-1932) - 59 focus
 CAN_sign_as_the_empire:0 "Sign as the Empire"
 CAN_sign_as_the_empire_desc:0 "The peace can be signed once, by the Empire, with the Dominions inside the delegation and the King's plenipotentiaries speaking for all."
 CAN_sign_as_the_empire_tt:0 "Canada signs within the imperial delegation. Keeps §YContracts from London§!: §Gimperial aid, Royal Navy doctrine and two cruisers§!. Seals §YDominion Subordination§!: §Rno international seat of our own, and the whole constitutional road from the Statute of Westminster onward is closed§!. The question of imperial defence is settled."
 CAN_a_signature_of_our_own:0 "A Signature of Our Own"
 CAN_a_signature_of_our_own_desc:0 "Sir Robert has insisted, against Whitehall and against Mr Lloyd George's convenience, that Canada sign the treaty in her own name and sit in the Assembly at Geneva in her own right."
 CAN_a_signature_of_our_own_tt:0 "Canada signs at Versailles in her own name and takes her seat in the League and the Labour Organization. §YDominion Without a Foreign Office§! falls from I to nothing in multilateral affairs. §GEvery treaty passes through Parliament, and political power accrues faster.§!\n§YRequires§!: the war Canada fought in is over."
 CAN_the_pacific_understanding:0 "The Pacific Understanding"
 CAN_the_pacific_understanding_desc:0 "London wishes the Japanese alliance renewed and asks the Dominions to say so. Canada will go further and take her place inside the imperial delegation at Washington, speaking through the British plenipotentiary as before."
 CAN_the_pacific_understanding_tt:0 "Canada speaks through the imperial delegation at Washington. §GA seat in the delegation and British naval doctrine; two cruisers are ceded.§! Seals §YLondon Speaks For Us§! permanently: §Rthe continental agreements at Ogdensburg and the Basic Security Plan can never be reached§!."
 CAN_no_automatic_commitments:0 "No Automatic Commitments"
 CAN_no_automatic_commitments_desc:0 "When the Empire is at war this Dominion is legally at war, and the Cabinet proposes to make that legality mean as little as possible."
 CAN_no_automatic_commitments_tt:0 "Ottawa asserts that an imperial call to arms may be declined. §YColonial Deference§! falls from III to II: §Ga call from the faction leader may be refused without loss of prestige or cohesion§!."
 CAN_break_the_japanese_alliance:0 "Break the Japanese Alliance"
 CAN_break_the_japanese_alliance_desc:0 "Mr Meighen has told the Imperial Conference what no other Dominion would say: that the alliance with Japan must not be renewed, because it sets the Empire athwart the United States in the Pacific."
 CAN_break_the_japanese_alliance_tt:0 "Ottawa refuses the renewal of the Anglo-Japanese Alliance. Removes §YLondon Speaks For Us§!. §RBritish and Japanese opinion fall sharply.§! §GAmerican opinion improves and the Washington naval treaties are opened.§!"
 CAN_ready_aye_ready:0 "Ready, Aye, Ready"
 CAN_ready_aye_ready_desc:0 "London has wired the Dominions asking for troops at Chanak, and told the newspapers before it told us. Mr Meighen's answer is Sir Wilfrid's own phrase: Ready, aye ready; we stand by you. A brigade will be found and the Straits will be held."
 CAN_ready_aye_ready_tt:0 "Canada answers the Chanak telegram at once. §GBritish land doctrine is shared and a brigade sails for the Straits; the imperial column opens.§! Sets §YThe Blood Tax Renewed§!: §Rthe levy rises by 10§!. Will lead to war with Turkey."
 CAN_parliament_will_decide:0 "Parliament Will Decide"
 CAN_parliament_will_decide_desc:0 "The telegram from London arrived in the newspapers before it arrived in the East Block, and Mr King's answer is three words: Parliament will decide. No Canadian soldier leaves this country without a vote of the House, whatever the Empire's necessity."
 CAN_parliament_will_decide_tt:0 "No expeditionary force may sail without a vote of the Commons. §YColonial Deference§! falls from II to I. Sets §YNo Commitments in Advance§!: §Ghalf the world tension is generated§!; §Rarmy experience falls by a quarter and no faction may be joined until a separate declaration is made§!."
 CAN_the_halibut_precedent:0 "The Halibut Precedent"
 CAN_the_halibut_precedent_desc:0 "The fisheries treaty concerns Canada and the United States and nobody else, and Mr Lapointe will sign it alone. The Foreign Office insists that the British ambassador must sign beside him, as has always been done."
 CAN_the_halibut_precedent_tt:0 "Canada signs the Halibut Treaty alone, without a British co-signatory. Removes §YDominion Without a Foreign Office§! entirely. §GPolitical power accrues faster.§! §RBritish opinion falls.§!"
 CAN_a_fireproof_house:0 "A Fireproof House"
 CAN_a_fireproof_house_desc:0 "Senator Dandurand has told the Assembly at Geneva that we live in a fire-proof house, far from inflammable materials, and Ottawa does not disown him. Article X will not be enforced by Canadian bayonets."
 CAN_a_fireproof_house_tt:0 "Ottawa disclaims the League's military obligations. Removes §YLeague Obligations§! and sets §YFireproof House§!: §Ghalf the world tension is generated and guarantees hold little attraction§!; §Rwar justifications take a quarter longer§!."
 CAN_not_bound_at_lausanne:0 "Not Bound at Lausanne"
 CAN_not_bound_at_lausanne_desc:0 "The Treaty of Lausanne was negotiated without a Canadian in the room and London proposes that it bind us all the same."
 CAN_not_bound_at_lausanne_tt:0 "No imperial treaty binds Canada without the assent of Parliament. Removes §YBound by Imperial Treaties§!: §Gthe Dominion is no longer automatically party to the faction leader's treaties§!."
 CAN_the_imperial_bloc:0 "The Imperial Bloc"
 CAN_the_imperial_bloc_desc:0 "The alternative to drifting apart is to draw together and say so plainly. Canada will bind herself to a common imperial policy: common defence, common tariff preference, and a common list of enemies."
 CAN_the_imperial_bloc_tt:0 "Canada binds herself to a common imperial policy. Sets §YThe Imperial Bloc§!: §GBritish doctrine, templates and licences free in perpetuity, a Royal Navy squadron stationed here, and British opinion at its height§!; §RCanada enters every British war automatically, Colonial Deference is sealed, the constitutional road and its twenty-four focuses are closed, and the blood tax rises by 6§!."
 CAN_equal_in_status:0 "Equal in Status"
 CAN_equal_in_status_desc:0 "The Conference has agreed the formula: autonomous communities within the British Empire, equal in status, in no way subordinate one to another in any aspect of their domestic or external affairs."
 CAN_equal_in_status_tt:0 "The Balfour formula is agreed at the Imperial Conference. Removes §YColonial Deference§! entirely: §Gthe Governor General ceases to be London's agent, autonomy rises sharply, and legations may be opened§!."
 CAN_the_advice_of_canadian_ministers:0 "The Advice of Canadian Ministers"
 CAN_the_advice_of_canadian_ministers_desc:0 "Lord Byng refused Mr King a dissolution and granted one to Mr Meighen four days later, and the country has not stopped talking about it since."
 CAN_the_advice_of_canadian_ministers_tt:0 "The Governor General acts only on the advice of Canadian ministers. Removes §YThe Governor General's Reserve Power§! and unlocks the appointment of a §YHigh Commissioner§!."
 CAN_legations_abroad:0 "Legations Abroad"
 CAN_legations_abroad_desc:0 "Mr Massey goes to Washington this year, and Paris and Tokyo will follow. Each legation is a small house, a handful of clerks and a flag, and each is an argument that cannot be withdrawn."
 CAN_legations_abroad_tt:0 "Canadian legations are opened abroad. Removes §YNo Mission Abroad§! and unlocks the repeatable decision §YOpen a Legation§!, which builds up §YIndependent Diplomacy§! to a maximum of three."
 CAN_a_seat_at_geneva:0 "A Seat at Geneva"
 CAN_a_seat_at_geneva_desc:0 "Canada has been elected to a non-permanent seat on the Council, the first Dominion so chosen, and against the quiet preference of the Foreign Office. Senator Dandurand will speak for us there and for nobody else."
 CAN_a_seat_at_geneva_tt:0 "Canada takes a non-permanent seat on the Council of the League. Removes §YA Dominion Does Not Sit§!: §Gpolitical power accrues faster§!, and the Pact of Paris may be signed."
 CAN_the_conference_on_dominion_legislation:0 "The Conference on Dominion Legislation"
 CAN_the_conference_on_dominion_legislation_desc:0 "The lawyers have met for four months and produced the machinery the politicians promised in 1926."
 CAN_the_conference_on_dominion_legislation_tt:0 "The lawyers draft the machinery of Dominion equality. §YDominion Subordination§! falls from II to I: §Gthe Colonial Laws Validity Act ceases to bind future statutes, and Canadian law acquires extraterritorial effect§!."
 CAN_a_statute_for_westminster:0 "A Statute for Westminster"
 CAN_a_statute_for_westminster_desc:0 "The Statute will enact what Balfour declared: no Act of the Parliament at Westminster extends to Canada unless Canada requests it, and Canadian law may repeal imperial law. The King's declaration of war no longer carries this Dominion with it."
 CAN_a_statute_for_westminster_tt:0 "The §YStatute of Westminster§! is enacted. Removes §YDominion Subordination§! entirely: §Gwar may be declared on our own authority, commercial treaties made in our own name, and political power accrues far faster§!."
 CAN_section_seven:0 "Section Seven"
 CAN_section_seven_desc:0 "Section seven excepts the British North America Act from the Statute: the constitution stays at Westminster, because Ottawa and the provinces cannot agree on a means of amending it here."
 CAN_section_seven_tt:0 "The constitution remains at Westminster for want of an amending formula. Sets §YNo Amending Formula§!: §Rconstitutional decisions and centralizing focuses cost a quarter more while the constitution stays in London§!."
 CAN_patriate_the_constitution:0 "Patriate the Constitution"
 CAN_patriate_the_constitution_desc:0 "Ottawa will ask Westminster for the Act itself, and an amending formula with it, and will not wait for the unanimous consent of nine provinces that will never be given."
 CAN_patriate_the_constitution_tt:0 "The constitution is brought home without provincial agreement, at a cost of 300 political power. Removes §YNo Amending Formula§!: §Gstability rises and fiscal centralization is opened at once§!. Sets §YA Constitution Imposed§!: §Rcompliance falls in Quebec and Ontario, and the Newfoundland question takes far longer§!."
 CAN_section_ninety_eight:0 "Section Ninety-Eight"
 CAN_section_ninety_eight_desc:0 "Section ninety-eight was written in the fortnight after Winnipeg and it makes membership in an unlawful association a crime carrying twenty years. It does not require an act; it requires an opinion and a card."
 CAN_section_ninety_eight_tt:0 "Section 98 of the Criminal Code is retained and enforced. Sets §YSection 98§!: §Gcompliance rises for two years in states where a general strike has been broken§!; §Rfactory output and national stability fall permanently, and the debt to civil liberties grows§!. Unlocks its invocation and locks the labour charter until it is repealed."
 CAN_the_mathers_commission:0 "The Mathers Commission"
 CAN_the_mathers_commission_desc:0 "The Commission has travelled the country and heard the men themselves, and its report recommends the eight-hour day, a minimum wage, unemployment insurance and old age pensions."
 CAN_the_mathers_commission_tt:0 "The Commission's report is adopted. §GSets §YThe Eight-Hour Day§!, clears the accumulated labour grievance, and opens either old age pensions or unemployment insurance, never both.§! §RSection 98 can never be enacted; factory output and consumer goods suffer; political power is lost daily; socialist support grows while unemployment is high; and grievance begins again with the first war mobilization law.§!"
 CAN_twenty_dollars_a_month:0 "Twenty Dollars a Month"
 CAN_twenty_dollars_a_month_desc:0 "Mr Woodsworth holds the balance in a minority House and his price is a pension. Twenty dollars a month at seventy, means-tested, and half the cost borne by any province that will come in."
 CAN_twenty_dollars_a_month_tt:0 "Old age pensions are voted at twenty dollars a month. Sets §YOld Age Pensions§!: §Gstability and recruitable population rise§!; §Rconsumption is dearer§!. Provinces that join fare better than those that refuse; unlocks their accession."
 CAN_compromise_on_bilingual_schools:0 "Compromise on Bilingual Schools"
 CAN_compromise_on_bilingual_schools_desc:0 "The Merchant, Scott and Cote report finds what everyone in eastern Ontario has known for fifteen years: that the regulation has taught nobody English and has cost us Quebec."
 CAN_compromise_on_bilingual_schools_tt:0 "Regulation 17 is set aside without repeal. §GThe blood tax falls by 10, and the yearly grievance of Regulation 17 ceases to grow.§! §RCompliance falls in Ontario, stability suffers for two years, and the Ontario administrative focus is closed.§!"
 CAN_the_covenant_of_geneva:0 "The Covenant of Geneva"
 CAN_the_covenant_of_geneva_desc:0 "Canada will accept Article X as it is written and undertake to preserve against external aggression the territorial integrity of every member of the League. Senator Dandurand's fire-proof house is repudiated."
 CAN_the_covenant_of_geneva_tt:0 "Canada accepts Article X of the Covenant in full. Sets §YCollective Security§!: §Ga defensive guarantee to every League member, world opinion at its height, and guarantees cost nothing§!; §Rno League call to arms may be refused, and Colonial Deference stays at III until Balfour§!."
 CAN_a_mission_to_washington:0 "A Mission to Washington"
 CAN_a_mission_to_washington_desc:0 "A permanent trade commission will be established at Washington, staffed by men who know lumber, newsprint and wheat, and instructed to work the tariff schedules line by line."
 CAN_a_mission_to_washington_tt:0 "A permanent trade delegation is established at Washington. §GAmerican opinion improves, tariffs fall and trade revenue rises.§! §RBritish opinion falls and the government loses support in the Prairies.§!"
 CAN_an_empire_customs_union:0 "An Empire Customs Union"
 CAN_an_empire_customs_union_desc:0 "Mr Chamberlain's old dream, offered to us again: a common external tariff round the whole Empire, free entry within it, and the British market secured for Canadian wheat for ever. Ontario and Quebec would sell manufactures to half the world."
 CAN_an_empire_customs_union_tt:0 "A common external tariff is adopted throughout the Empire. §GTrade within the imperial bloc is far more efficient, and civil industry expands in Ontario and Quebec.§! §RTrade outside the bloc collapses, Prairie incomes fall, and no American trade agreement is ever possible again.§!"
 CAN_reciprocity_with_washington:0 "Reciprocity with Washington"
 CAN_reciprocity_with_washington_desc:0 "The agreement of 1911 will be taken down, dusted and signed. Natural products cross free both ways and the schedules on manufactures come down by stages."
 CAN_reciprocity_with_washington_tt:0 "Reciprocity is concluded with the United States. Sets §YContinental Market§!: §Gtrade with the United States expands greatly and American opinion reaches its height§!. §RBritish opinion collapses and the imperial road closes for the rest of the game.§! Continental alignment rises by 2."
 CAN_the_free_state_precedent:0 "The Free State Precedent"
 CAN_the_free_state_precedent_desc:0 "Dublin has abolished the appeal to the Privy Council and reduced its Governor General to a signature, and the heavens have not fallen."
 CAN_the_free_state_precedent_tt:0 "Canada follows Dublin: appeals to the Privy Council are abolished and the Governor General reduced to ceremony. §GPolitical power accrues far faster.§! Sets §YConstitutional Rupture§!: §RBritish opinion collapses, no British licence may be obtained, and stability falls for two years§!. The republican road is opened."
 CAN_the_deep_waterway_treaty:0 "The Deep Waterway Treaty"
 CAN_the_deep_waterway_treaty_desc:0 "Ottawa and Washington will canalize the St Lawrence together, twenty-seven feet from the Lakehead to Montreal, and share the power at the International Rapids. Ocean ships would load wheat at Fort William."
 CAN_the_deep_waterway_treaty_tt:0 "The St Lawrence is to be canalized jointly with the United States. §GInfrastructure rises in Ontario and Quebec, a civilian factory is built, and convoy capacity on the Lakes increases.§! §RCivilian production is committed for three years.§!\n§YBypassed§! if Washington will not ratify."
 CAN_the_western_labour_conference:0 "The Western Labour Conference"
 CAN_the_western_labour_conference_desc:0 "The western delegates met at Calgary in March, cheered the Soviets, and voted to leave the Trades and Labour Congress for one industrial union of the whole working class. A general strike is to be the weapon and Winnipeg will be the test."
 CAN_the_western_labour_conference_tt:0 "The One Big Union is formed in the West. §GA labour party enters the field and the sympathetic strike is unlocked.§! Sets §YThe One Big Union§!: §Rcivil industry and stability fall, communist support grows while unemployment is high, the Winnipeg general strike becomes certain within the year, and the debt to civil liberties grows§!."
 CAN_a_third_party_in_the_house:0 "A Third Party in the House"
 CAN_a_third_party_in_the_house_desc:0 "Sixty-five Progressives have come out of the West and the Ontario countryside, and the government has lost its majority to men who have never sat in a caucus."
 CAN_a_third_party_in_the_house_tt:0 "The agrarian movement becomes the second group in the Commons. Sets §YThe Minority Parliament§! at two levels: §Rnational political power gain falls by a quarter, centralizing focuses cost half as much again, and an early election is forced whenever national unity falls below half§!. §GLabour grievance falls.§! The four roads of 1922 are opened."
 CAN_take_the_front_bench:0 "Take the Front Bench"
 CAN_take_the_front_bench_desc:0 "Mr Crerar's men are the second largest group in the House, and the Speaker has offered them the seats and the salary of the Official Opposition. Taking them means a whip, a shadow cabinet and the discipline of a party."
 CAN_take_the_front_bench_tt:0 "The agrarians accept the standing of Official Opposition. §GThe party is inside the system and its drift is halved.§! §RPrairie anger is capped, and the radical wing never breaks away.§!"
 CAN_refuse_the_front_bench:0 "Refuse the Front Bench"
 CAN_refuse_the_front_bench_desc:0 "The Progressives were sent to Ottawa to end party government, not to become the other party. The front bench and its salaries will be declined, and every member will vote as his association instructs him."
 CAN_refuse_the_front_bench_tt:0 "The agrarians refuse the standing of Official Opposition. §RNo legislative concessions are won, and the freight rate grievance is kept for the rest of the game.§! §GPrairie anger grows without limit, and labour grievance may be turned into socialist support.§!"
 CAN_a_tariff_for_the_producer:0 "A Tariff for the Producer"
 CAN_a_tariff_for_the_producer_desc:0 "The tariff was built to protect the manufacturer and it is paid by the man who buys the binder. The schedules on agricultural implements, wire and machinery will come down, and the revenue will be found somewhere else."
 CAN_a_tariff_for_the_producer_tt:0 "The tariff schedules on farm implements are struck down. Sets §YProgressive Tariff Pressure§!: §Gagricultural construction is faster§!; §Rconsumption revenue falls, and the Ottawa Agreements are blocked while it lasts§!."
 CAN_the_ginger_group:0 "The Ginger Group"
 CAN_the_ginger_group_desc:0 "A dozen members will not follow Mr Forke into any arrangement with the Liberals and have constituted themselves separately in the corner of the House."
 CAN_the_ginger_group_tt:0 "The radical wing breaks away. §GA socialist party enters the field.§! Sets §YThe Ginger Group§!: §Rany government without a majority gains political power more slowly§!, and socialist support grows while unemployment is high."
 CAN_the_united_farmers_in_office:0 "The United Farmers in Office"
 CAN_the_united_farmers_in_office_desc:0 "The United Farmers hold three provincial governments now, and they are governing rather better than the men they turned out. Roads, rural credit, power at cost and a school in every township."
 CAN_the_united_farmers_in_office_tt:0 "Farmer governments take office in three provinces. §GEach gains two shared building slots.§! §RFederal compliance in those states falls and prairie anger rises.§!"
 CAN_the_price_of_our_votes:0 "The Price of Our Votes"
 CAN_the_price_of_our_votes_desc:0 "Labour holds two seats, the government holds a plurality, and Mr Woodsworth has done the arithmetic. He will sustain the ministry, and the ministry will legislate: pensions first, and the rest of the programme by instalments."
 CAN_the_price_of_our_votes_tt:0 "Labour sells its votes for social legislation. Sets §YLabour Holds the Balance§!: §Gsocialist support rises and social policy costs the government a quarter less§!; §Rstability falls if no social measure is passed within four years§!.\n§YBypassed§! if old age pensions have already been voted."
 CAN_the_liberal_progressive_fusion:0 "The Liberal-Progressive Fusion"
 CAN_the_liberal_progressive_fusion_desc:0 "Mr King has offered the Progressives the tariff schedules they wanted, a seat in the Cabinet and the Crow's Nest rates restored, and most of them have taken it."
 CAN_the_liberal_progressive_fusion_tt:0 "The agrarian movement is absorbed into the government. Removes §YThe Minority Parliament§!: §Gstability rises sharply and an agrarian adviser enters the Cabinet§!. §RPrairie anger subsides and the movement disappears from the field.§!"
 CAN_a_government_of_delegates:0 "A Government of Delegates"
 CAN_a_government_of_delegates_desc:0 "Mr Wise Wood holds that party government is a fraud and that men should be represented by what they do: farmers by farmers, labour by labour, each group sending delegates and the groups co-operating. The United Farmers will attempt it at Ottawa."
 CAN_a_government_of_delegates_tt:0 "A federal government of occupational delegates is formed. Sets §YGovernment by Delegate§!: §Gcivilian construction is a quarter faster§!; §Rpolitical power gain is halved and the economy can rise no higher than partial mobilization§!. The point of no return on this road."
 CAN_the_goglu_press:0 "The Goglu Press"
 CAN_the_goglu_press_desc:0 "Mr Arcand's weeklies began as satire and have become something else: Le Goglu, Le Miroir, Le Chameau, printed in Montreal and sold at every tram stop. The humour is now a list of names, and the names are all the same kind of name."
 CAN_the_goglu_press_tt:0 "Arcand's weeklies find their audience. §GA fascist party enters the field.§! Sets §YThe Pamphlet War§!: fascist support grows only while unemployment is severe, and §Rstability falls§!. The spirit lifts after two years below eight per cent.\n§YRequires§!: severe unemployment, or the unsold wheat of the West."
 CAN_the_new_national_policy_enacted:0 "The New National Policy Enacted"
 CAN_the_new_national_policy_enacted_desc:0 "The farmers' platform will be enacted entire: the tariff back to the schedules of 1897, the railways wholly public, the war profits tax continued, and a graduated income and inheritance duty."
 CAN_the_new_national_policy_enacted_tt:0 "The farmers' platform is enacted in full. §GExternal trade efficiency rises by a third.§! §RMilitary factory output falls by a quarter, and imperial preference is closed for good.§!"
 CAN_the_league_for_social_reconstruction:0 "The League for Social Reconstruction"
 CAN_the_league_for_social_reconstruction_desc:0 "Professor Underhill and Mr Scott have gathered the university men into a society for the study of social reconstruction, on the Fabian model."
 CAN_the_league_for_social_reconstruction_tt:0 "The universities are enlisted in the cause of reform. §GAn adviser slot reserved to academics, and civil industry research a tenth faster.§! Required for the manifesto."
 CAN_the_prophetic_bible_institute:0 "The Prophetic Bible Institute"
 CAN_the_prophetic_bible_institute_desc:0 "Mr Aberhart's school in Calgary broadcasts every Sunday afternoon and half the farmhouses in Alberta have the set on. Since he discovered Major Douglas the sermons have carried an economic appendix, and the appendix is what the audience repeats."
 CAN_the_prophetic_bible_institute_tt:0 "Aberhart's broadcasts turn to monetary reform. §GA Social Credit party enters the field and grows quickly in a Prairie state while the drought lasts.§!\n§YRequires§!: prairie anger already high."
 CAN_unemployment_or_war:0 "Unemployment or War"
 CAN_unemployment_or_war_desc:0 "Major Douglas holds that industry never distributes purchasing power equal to the prices it charges, and that the gap is filled only by debt or by war. The remedy is the national dividend, paid to every citizen out of the credit of the community."
 CAN_unemployment_or_war_tt:0 "The A plus B theorem becomes public doctrine. Sets §YThe A+B Theorem§!: §Gthe decisions of parallel currency are unlocked§!; §Rfactory output falls§!."
 CAN_the_calgary_convention:0 "The Calgary Convention"
 CAN_the_calgary_convention_desc:0 "Farmer, labour and socialist groups met at Calgary this August and agreed upon a common federation with Mr Woodsworth at its head. It is not a party so much as a treaty between movements that have spent a decade refusing to speak to one another."
 CAN_the_calgary_convention_tt:0 "The farmer, labour and socialist movements federate under Woodsworth. §GTheir combined support, and five per cent more.§!\n§YRequires§!: mass unemployment. §YBypassed§! if a socialist party already stands above a quarter of the country."
 CAN_the_wheat_pools:0 "The Wheat Pools"
 CAN_the_wheat_pools_desc:0 "The growers have signed their acreage to the Pool for five years and the Pool will sell it, one seller against the world instead of a hundred thousand. Initial payment at delivery, interim and final payments as the crop is sold."
 CAN_the_wheat_pools_tt:0 "The wheat pools take over the marketing of the crop. §GAgricultural output and political adherence rise across the Prairies, and democratic support grows in the West.§! Unlocks the restoration of the Crow's Nest Pass rates."
 CAN_the_golden_harvest:0 "The Golden Harvest"
 CAN_the_golden_harvest_desc:0 "Five hundred and sixty-six million bushels, the greatest crop ever grown in this country, and the price is holding. The Pool has taken more acreage than it can handle and the elevators at the Lakehead are full."
 CAN_the_golden_harvest_tt:0 "A record crop is brought in. §GAgricultural resources and trade efficiency rise sharply for 360 days.§! §RWhen the year is out, the unsold mountain remains.§!"
 CAN_the_natural_resources_transfer:0 "The Natural Resources Transfer"
 CAN_the_natural_resources_transfer_desc:0 "The Prairie provinces have asked since 1905 for what Ontario and Quebec have always had, and the Acts will give it: the lands, the mines, the timber and the water powers, transferred to the provincial Crowns."
 CAN_the_natural_resources_transfer_tt:0 "Lands and resources are transferred to the Prairie provinces. Removes §YCrown Lands Reserved§!: §Geach Prairie state gains two building slots and adherence rises in the West§!. Sets §YTerms of the Transfer§!: §Rpolitical power is lost permanently, and a Crown oil company can never be created§!. Provincial autonomy falls by 3."
 CAN_canadian_national_railways:0 "Canadian National Railways"
 CAN_canadian_national_railways_desc:0 "The Canadian Northern and the Grand Trunk Pacific are bankrupt and their bonds are guaranteed by this Dominion, so the country owns them whether it wishes to or not."
 CAN_canadian_national_railways_tt:0 "The bankrupt lines are consolidated into the §YCanadian National Railways§!. §GInfrastructure rises in four states, a civilian factory is built, and infrastructure is built faster.§! Two levels of §YRailway Overbuild§! are cleared, never the last. Sets §YThe Dominion Owns the Deficit§! in addition: §Rthe country carries the losses§!."
 CAN_the_ottawa_agreements:0 "The Ottawa Agreements"
 CAN_the_ottawa_agreements_desc:0 "Mr Bennett has brought the Empire to Ottawa, having promised the electorate that he would blast a way into the markets of the world."
 CAN_the_ottawa_agreements_tt:0 "Imperial preference is agreed at Ottawa. §GTrade within the imperial bloc is far more efficient, the British market is secured for our wheat, and opinion improves with every Dominion.§! §RThe American market closes for the rest of the game, the dollar gap widens permanently, and Prairie incomes fall.§!\n§YRequires§!: the Statute of Westminster."
 CAN_one_department_of_defence:0 "One Department of Defence"
 CAN_one_department_of_defence_desc:0 "Three departments, three deputy ministers and three sets of accounts, for a force smaller than the Toronto police. The Militia, the Naval Service and the Air Board will be merged into a single Department of National Defence on the first of January."
 CAN_one_department_of_defence_tt:0 "The three services are merged into the §YDepartment of National Defence§!. §GAll military focuses cost a tenth less political power, and a military adviser slot is opened.§! Sets §YPeace Dividend§!: §Rthe estimates are cut to the bone§!.\n§YBypassed§! if imperial defence has already been settled."
 CAN_the_air_board:0 "The Air Board"
 CAN_the_air_board_desc:0 "The Air Board Act creates a body to license aerodromes, register machines and control all flying in the Dominion, civil and military alike. What it will actually do is fly forest patrols, photograph the North and chase liquor across the lakes."
 CAN_the_air_board_tt:0 "The §YAir Board§! is constituted and civil aviation begins. §GAir research is raised a step and air experience begins to accumulate.§! §RThe Canadian Air Force remains a part-time militia: no wing templates and no permanent aerodromes.§! Required for the merger of the services."
 CAN_the_royal_canadian_air_force:0 "The Royal Canadian Air Force"
 CAN_the_royal_canadian_air_force_desc:0 "The Canadian Air Force receives the Royal prefix on the first of April and becomes a permanent component of the Department of National Defence."
 CAN_the_royal_canadian_air_force_tt:0 "The §YRoyal Canadian Air Force§! is constituted. Removes §YNo Air Service of Our Own§! and sets §YCivil Government Air Operations§!. §GAn air research slot is opened§!, and the light aeroplane clubs may be subsidized."
 CAN_the_northern_air_survey:0 "Fires, Photographs and Smugglers"
 CAN_the_northern_air_survey_desc:0 "The estimates will not pay for fighters, but Parliament will always pay for something useful. The squadrons will map the North from the air, patrol the timber limits for fire, and meet the liquor boats on the lakes."
 CAN_the_northern_air_survey_tt:0 "The service is set to survey, fire patrol and preventive work. §GInfrastructure rises in four northern states, aircraft range increases, and the photographic survey is unlocked.§! §RAir experience accumulates more slowly still.§!"
 CAN_the_school_at_trenton:0 "The School at Trenton"
 CAN_the_school_at_trenton_desc:0 "A permanent station will be built at Trenton with the flying school, the armament school and the instructors' course under one command."
 CAN_the_school_at_trenton_tt:0 "A central flying training station is built at Trenton. §GAircrew training costs a quarter less, and the pool of trained aircrew grows every year.§! Air Commodore §YRobert Leckie§! is available."
 CAN_the_trans_canada_airway:0 "The Trans-Canada Airway"
 CAN_the_trans_canada_airway_desc:0 "A chain of lighted aerodromes and radio ranges will be built from Halifax to Vancouver, with emergency fields every hundred miles. It is a relief work as much as an aviation project and the men will be paid twenty cents a day."
 CAN_the_trans_canada_airway_tt:0 "The airway is built from coast to coast. §GAn air base level is added in six states, and air bases are built far faster.§! Replaces §YCivil Government Air Operations§! with §YAerodromes Without Aircraft§!."
 CAN_not_a_works_department:0 "Not a Works Department"
 CAN_not_a_works_department_desc:0 "The service will stop flying the forestry patrol and the mail and start preparing for war. The civil operations will be transferred elsewhere, the establishment reorganized into squadrons, and the estimates asked to buy fighters."
 CAN_not_a_works_department_tt:0 "The service abandons civil work and prepares for war. Removes §YCivil Government Air Operations§!. §GAn air research slot is opened, and fighter and tactical bomber templates are granted.§! §RStability falls sharply, communist support grows for three years, and no aerodrome will be given free again.§!"
 CAN_the_volunteer_reserve:0 "The Volunteer Reserve"
 CAN_the_volunteer_reserve_desc:0 "The permanent force is six hundred men and the country will not pay for more, so the Dominion will raise a volunteer reserve instead."
 CAN_the_volunteer_reserve_tt:0 "The §YRoyal Canadian Naval Volunteer Reserve§! is raised. Sets §YThe Volunteer Navy§!: §Gcrews train twice as fast, recruiting is opened to the inland states, and a thousand reservists cost no manpower in peace§!; §Rthey begin with little experience§!. Removes §YA Paper Navy§!."
 CAN_the_first_ships_built_for_us:0 "The First Ships Built for Us"
 CAN_the_first_ships_built_for_us_desc:0 "Saguenay and Skeena are commissioned this year, the first warships ever built to a Canadian order and a Canadian specification. They are destroyers of the Royal Navy pattern, altered for ice and for North Atlantic weather."
 CAN_the_first_ships_built_for_us_tt:0 "Two destroyers are built to Canadian order. Removes §YThe Tin-Pot Navy§!. §GDelivered within eighteen months; an escort destroyer template and a dockyard slot are granted.§! The Admiralty's offer of the rivers is opened."

 ##### ere WW2 (1933-1948) - 85 focus
 CAN_no_commitments_in_advance:0 "No Commitments in Advance"
 CAN_no_commitments_in_advance_desc:0 "Mr King has repeated it at every conference and in every session: no commitments in advance, and Parliament will decide. The last administrative traces of the old subordination will be swept out of the departments."
 CAN_no_commitments_in_advance_tt:0 "The doctrine of no commitments is made absolute. Removes the last administrative trace of §YColonial Deference§!. §YNo Commitments in Advance§! is hardened: §RCanada may join a faction only by a vote of the House§!."
 CAN_champion_of_collective_security:0 "Champion of Collective Security"
 CAN_champion_of_collective_security_desc:0 "If the League is worth belonging to it is worth defending, and Ottawa will say so at Geneva rather than sit through another speech about the fire-proof house. Canada will press for sanctions with teeth and accept a share of enforcing them."
 CAN_champion_of_collective_security_tt:0 "Canada takes the lead for collective security. Removes §YFireproof House§! and §YNo Automatic Commitments§!: §Ga collective security faction may be founded at once, and French and British opinion improve§!. Sets §YSanctions and Their Price§!: §RItalian and Japanese opinion collapse, stability falls in French Canada, and neutrality in 1939 is closed§!. Will lead to war with Italy."
 CAN_we_follow_the_crown:0 "We Follow the Crown"
 CAN_we_follow_the_crown_desc:0 "The King has declared war and this Dominion is at war with him, in law, from the same hour. There will be no separate declaration, no seven days of pretence, and no argument about the divisibility of the Crown while the Poles are being overrun."
 CAN_we_follow_the_crown_tt:0 "Canada is at war from the same hour as the King. Removes §YA Militia, Not an Army§! entirely: §Gimmediate mobilization, British templates and equipment delivered, reinforcements greatly increased for the first year, war support rises in English Canada, and British opinion reaches its height§!. §RDominion sovereignty and middle power standing are closed for good.§! Sets §YThe Pledge Broken§!: §Rthe blood tax rises by 15§!."
 CAN_a_separate_declaration:0 "A Separate Declaration"
 CAN_a_separate_declaration_desc:0 "Parliament is summoned for the seventh and the address will be carried; nobody doubts it. The seven days are the point."
 CAN_a_separate_declaration_tt:0 "Canada declares war in her own name, a week later, on a vote of the Commons. Removes §YNo Commitments in Advance§! and sets §YDominion Sovereignty§!: §Gpolitical power rises by a quarter, war support rises in French Canada, and the blood tax falls by 8§!. §RSeven days without a war economy or British contracts; British opinion falls, English-Canadian support dips, and the Militia is still not an army.§!"
 CAN_the_neutrality_of_a_dominion:0 "The Neutrality of a Dominion"
 CAN_the_neutrality_of_a_dominion_desc:0 "Dublin has stayed out and the Commonwealth has survived it. The Dominion will declare its neutrality, close its ports to belligerents, and defend its own coasts and nobody else's. Every promise made to Quebec since 1917 is kept in a single afternoon."
 CAN_the_neutrality_of_a_dominion_tt:0 "Canada stands out of the war. Sets §YThe Pledge Kept§!: §Gstability and national unity rise greatly, and no conscription crisis can ever occur§!. Sets §YArmed Neutrality of North America§!: §Rmilitary production is halved, no faction may be joined, and the air training plan and the British contracts are cancelled§!. The wartime branches are closed; the ports are shut and the republican road opens."
 CAN_host_the_quebec_conferences:0 "Host the Quebec Conferences"
 CAN_host_the_quebec_conferences_desc:0 "The President and the Prime Minister will meet at the Citadelle and the Chateau Frontenac, and Canada will provide the rooms, the security and the photographs. Mr King is host at his own table and not a party to the conference held upon it."
 CAN_host_the_quebec_conferences_tt:0 "The great conferences are held at Quebec. Removes §YNo Standing to Convene§!: §GBritish and American opinion improve, and a Commonwealth conference may be called.§!"
 CAN_a_seat_at_the_boards:0 "A Seat at the Boards"
 CAN_a_seat_at_the_boards_desc:0 "The Combined Boards allot the food and the raw material of the alliance, and Canada, the fourth producer among the Allies, has not been asked to sit upon them."
 CAN_a_seat_at_the_boards_tt:0 "Canada is admitted to the Combined Boards. §YA Dominion Is Not a Power§! falls from II to I.\n§YRequires§!: Canada at war alongside at least two major powers."
 CAN_a_citizenship_of_our_own:0 "A Citizenship of Our Own"
 CAN_a_citizenship_of_our_own_desc:0 "Until now a man born in Trois-Rivieres has been a British subject resident in Canada, and there has been no such person in law as a Canadian citizen."
 CAN_a_citizenship_of_our_own_tt:0 "The §YCanadian Citizenship Act§! is passed. Removes §YSubjects of the Crown§!: §Gmanpower growth and stability rise, and a Canadian passport is issued§!. The decisions of forced repatriation are locked. §GThe fuller citizenship is granted only if no wartime injustice stands upon the record.§!"
 CAN_the_gray_lecture:0 "The Gray Lecture"
 CAN_the_gray_lecture_desc:0 "Mr St-Laurent has told a Toronto audience what no Canadian minister has said aloud: that this country's external policy rests upon national unity, political liberty, the rule of law, human values, and the acceptance of international responsibility."
 CAN_the_gray_lecture_tt:0 "The foundations of a Canadian foreign policy are set out. Removes §YFireproof House§! entirely: §Gtension is generated again, a faction may be founded, missions are a quarter more effective, and the decisions of the United Nations are opened§!. §YEscott Reid§! enters the Department."
 CAN_the_newfoundland_question:0 "The Newfoundland Question"
 CAN_the_newfoundland_question_desc:0 "Newfoundland gave up responsible government in 1934 and has been ruled by a commission of six ever since, and London wishes to be rid of the responsibility."
 CAN_the_newfoundland_question_tt:0 "Ottawa opens the question of Newfoundland's future. Removes §YA Dominion Cannot Annex§!: the two referendums and the §YTerms of Union§! are unlocked.\n§RIf Newfoundland recovers responsible government, the negotiation fails.§!"
 CAN_the_premier_speaks_to_the_people:0 "The Premier Speaks to the People"
 CAN_the_premier_speaks_to_the_people_desc:0 "Mr Bennett has bought five evenings of radio time and told the country that the old order is gone and that he will reform capitalism or its opponents will end it. A minimum wage, an eight-hour day, unemployment insurance and a marketing board."
 CAN_the_premier_speaks_to_the_people_tt:0 "The Prime Minister legislates by broadcast. §GStability and recruitable population rise sharply.§! §RConsumer goods are dearer, and the reference to the courts is armed.§!\n§YRequires§!: the relief camps opened three times, or severe unemployment."
 CAN_the_consent_of_the_provinces:0 "The Consent of the Provinces"
 CAN_the_consent_of_the_provinces_desc:0 "The Judicial Committee has struck down half the programme as an invasion of provincial rights, and there is only one way past it."
 CAN_the_consent_of_the_provinces_tt:0 "The social programme is founded upon provincial consent, at a cost of 150 political power and a tax field to each province. Sets §YModern Welfare State§!: §Gthe legislation survives the courts§!. Sets §YThe Provincial Compact§!: §Rpolitical power is lost daily, centralizing focuses are a quarter slower, and the wartime tax agreements can never be made§!."
 CAN_unemployment_insurance:0 "Unemployment Insurance"
 CAN_unemployment_insurance_desc:0 "The amendment has been obtained, every province consenting, and the Act will be law before the year is out. Contributions from the worker, the employer and the Dominion, and a benefit paid as of right rather than as relief."
 CAN_unemployment_insurance_tt:0 "Unemployment insurance is enacted. Sets §YUnemployment Insurance§!: §Gstability and recruitable population rise§!; §Rpolitical power is lost daily§!. The unemployment events of the economic branch cease."
 CAN_the_wartime_tax_agreements:0 "Ottawa Takes the Income Tax"
 CAN_the_wartime_tax_agreements_desc:0 "The war cannot be financed by nine treasuries competing for the same taxpayer. The provinces will vacate the personal and corporate income tax for the duration and receive a rental payment in exchange."
 CAN_the_wartime_tax_agreements_tt:0 "The provinces vacate the income tax fields for a rental. Sets §YOttawa Holds the Purse§!: §Gcivilian output and state revenue rise sharply§!; §Rcompliance falls in the four wealthy provincial states, and provincial autonomy grows each year§!."
 CAN_the_provinces_keep_their_fields:0 "The Provinces Keep Their Fields"
 CAN_the_provinces_keep_their_fields_desc:0 "Mr Hepburn and Mr Duplessis will not surrender the income tax, and Ottawa will not compel them. The war will be financed by borrowing and by the excise, and the federal structure will come out of it as it went in."
 CAN_the_provinces_keep_their_fields_tt:0 "The provinces keep their fields of taxation. §GCivilian construction is faster in the provincial states, stability rises, and provincial autonomy is frozen.§! §RState revenue falls, family allowances are halved, and the postwar reconstruction proposals are impossible.§!"
 CAN_hold_the_line_on_spending:0 "Hold the Line on Spending"
 CAN_hold_the_line_on_spending_desc:0 "The war debt is the largest sum this country has ever owed, and the Cabinet will not add a social programme to it. The estimates will be held, the wartime controls kept a little longer, and the surplus applied to the debt. The Treasury is content."
 CAN_hold_the_line_on_spending_tt:0 "The estimates are held and the war debt paid down. §GPolitical power accrues faster, consumer goods are easier, and the war debt shrinks.§! §RCCF support grows steadily and stability falls; the socialist breakthrough in Saskatchewan will now occur whether it is sought or not.§!"
 CAN_family_allowances:0 "Family Allowances"
 CAN_family_allowances_desc:0 "Five dollars a month for each child under six, paid to the mother, without a means test and without inquiry. It is the first universal payment this Dominion has ever made and it will reach every household in the country."
 CAN_family_allowances_tt:0 "The family allowance is voted. Sets §YCradle of the Welfare State§!: §Gmanpower growth and stability rise, and compliance improves in French Canada§!; §Rpolitical power is lost daily, consumer goods are dearer, and English Ontario and the West resent it§!."
 CAN_a_labour_charter:0 "A Charter for Labour"
 CAN_a_labour_charter_desc:0 "Order in Council 1003 gave the unions certification, compulsory bargaining and a labour board for the duration, and the duration is ending. The Act will make it permanent: recognition as of right, the check-off, and a procedure to replace the strike."
 CAN_a_labour_charter_tt:0 "Collective bargaining is made permanent in statute. Removes §YCompulsory Conciliation§! and §YSection 98§!, and freezes labour grievance for good. Sets §YIndustrial Relations Act§!: §Gfactory output rises§!; §Rconsumer goods are dearer§!. No general strike will occur again.\n§YRequires§!: Order in Council 1003."
 CAN_uncle_louis:0 "Uncle Louis"
 CAN_uncle_louis_desc:0 "Mr St-Laurent came to Ottawa in 1941 for the duration and has stayed to become the most trusted man in the Dominion, in both languages."
 CAN_uncle_louis_tt:0 "St-Laurent takes the leadership. §GThe blood tax falls by 20 at a stroke, and §YLouis St-Laurent§! becomes head of government.§! §RThe Department loses its minister and his daily political power, 200 political power is spent, and the decisions restricting civil liberties cost a quarter more. The blood tax will never fall below 10.§!\n§YRequires§!: a year of peace, a Quebec lieutenant long in office, a debt still owing, and the citizenship or the Gray Lecture behind us."
 CAN_answer_the_riddell_telegram:0 "Answer the Riddell Telegram"
 CAN_answer_the_riddell_telegram_desc:0 "Dr Riddell proposed at Geneva that oil be added to the sanctions against Italy, and the world called it the Canadian proposal because a Canadian made it. He had no instructions. Ottawa may disown him and be safe, or endorse him and mean it."
 CAN_answer_the_riddell_telegram_tt:0 "Ottawa stands behind its delegate and endorses the oil sanction. §RItalian opinion collapses and stability falls sharply in French Canada.§!\n§YRequires§!: that the Dominion has not bound itself to make no commitments."
 CAN_the_kingston_pledge:0 "The Kingston Pledge"
 CAN_the_kingston_pledge_desc:0 "The President told a Kingston audience that the United States will not stand idly by if Canadian soil is threatened by any other empire."
 CAN_the_kingston_pledge_tt:0 "The continental understanding is exchanged in public. Sets §YA Continental Understanding§!: §Ghalf the coastal garrison is required and American opinion improves§!; §RBritish opinion falls, and no belligerent may be granted passage§!. Continental alignment rises by 1."
 CAN_a_common_foreign_policy:0 "A Common Foreign Policy"
 CAN_a_common_foreign_policy_desc:0 "The Dominions have gone their separate ways for fifteen years, and the result is an Empire that cannot say what it will do until the day it must do it. Ottawa will accept a common policy of imperial defence, settled in London and binding upon all."
 CAN_a_common_foreign_policy_tt:0 "Canada accepts a common imperial policy of defence. §GDoctrine research is faster.§! §RBritain may call upon Canadian divisions.§! Sets §YNo Voice of Our Own§!: §Rinfluence in international bodies is halved§!."
 CAN_ogdensburg:0 "Ogdensburg"
 CAN_ogdensburg_desc:0 "The President's train stopped at Ogdensburg and in an evening the two governments agreed upon a Permanent Joint Board on Defence: standing, for both countries, permanently."
 CAN_ogdensburg_tt:0 "The §YPermanent Joint Board on Defence§! is created. §GAmerican licences are far more efficient, American doctrine is opened, and two garrison divisions are released.§! §RBritish opinion falls sharply.§! Continental alignment rises by 2."
 CAN_a_dominion_no_longer:0 "A Dominion No Longer"
 CAN_a_dominion_no_longer_desc:0 "The Crown has been a legal fiction here for twenty years and the fiction will be ended."
 CAN_a_dominion_no_longer_tt:0 "The Republic is proclaimed. Removes §YDominion Subordination§!, §YColonial Deference§! and §YSubjects of the Crown§!: §Gpolitical power accrues far faster§!. Sets §YA Country Without Friends§!: §Rloyalist insurrection in Ontario and the Maritimes§!. A flag of our own and the internment of the loyalist leagues are opened."
 CAN_the_northwest_staging_route:0 "The Northwest Staging Route"
 CAN_the_northwest_staging_route_desc:0 "The Americans will build the highway to Alaska, the pipeline from Norman Wells and the chain of aerodromes up the Mackenzie, and they will build them with their own troops upon our territory. Thirty thousand of them are in the North already."
 CAN_the_northwest_staging_route_tt:0 "The Americans build the highway, the pipeline and the airfields of the North. §GInfrastructure rises by three levels, four aerodromes are built in the North, and supply range increases greatly.§! Sets §YOccupied by Our Friends§!: §Rnational unity falls§!. Continental alignment rises by 1."
 CAN_imperial_standardisation:0 "Imperial Standardisation"
 CAN_imperial_standardisation_desc:0 "One pattern of rifle, one gun, one tank and one set of spares from Halifax to Suez. Canadian divisions will fight in British corps and must be supplied from British depots, and every departure from the imperial pattern costs lives in the field."
 CAN_imperial_standardisation_tt:0 "The Dominion standardizes upon British patterns. Sets §YImperial Standard§!: §Gshared doctrine research is faster, British equipment is supplied free, and British-pattern land equipment is produced more efficiently§!. §RAmerican licences and doctrine are closed for good.§!"
 CAN_the_basic_security_plan:0 "The Basic Security Plan"
 CAN_the_basic_security_plan_desc:0 "The Joint Board has drawn a plan for the defence of the continent as one theatre, with common patterns of equipment, common procedure and interchangeable formations."
 CAN_the_basic_security_plan_tt:0 "The continent is planned as one theatre. §GLand production is more efficient, and American licences and doctrine are opened.§! §RThe imperial standard is removed if it was adopted, and British naval doctrine is closed.§!"
 CAN_buy_back_the_north:0 "Buy Back the North"
 CAN_buy_back_the_north_desc:0 "Every aerodrome, weather station and telephone line the Americans have built upon Canadian soil will be bought at cost, and bought now, while they are still willing to sell."
 CAN_buy_back_the_north_tt:0 "The American installations are bought out at cost. Removes §YOccupied by Our Friends§!: §Gnational unity is restored§!. §RA quarter of the political power reserve and a year of civilian production are spent.§!\n§YBypassed§! if there are no foreign installations."
 CAN_continental_free_trade:0 "Continental Free Trade"
 CAN_continental_free_trade_desc:0 "The negotiators have a draft that would abolish the tariff between the two countries within five years, and the officials on both sides think it the best commercial bargain ever offered to this country."
 CAN_continental_free_trade_tt:0 "The tariff between the two countries is abolished. §GBilateral trade and civil industry expand greatly.§! Sets §YThe 49th State Question§!.\n§YRequires§!: continental alignment already deep. §RIt cannot be had if the Dominion has chosen to stand alone.§!"
 CAN_the_incumbents_of_the_slump:0 "The Incumbents of the Slump"
 CAN_the_incumbents_of_the_slump_desc:0 "It does not matter greatly what a government does in a depression; what matters is that it was there when the depression came. Mr Bennett inherited the crash within four months of taking office and will be destroyed by it. So will whoever follows."
 CAN_the_incumbents_of_the_slump_tt:0 "The slump falls upon whoever holds office. Sets §YThey Were In Office§!: §Rthe governing party loses support every year that unemployment is severe§!; §Gthe CCF, Social Credit and the National Unity Party are each capped at fifteen per cent for good§!."
 CAN_twenty_five_dollars_a_month:0 "Twenty-Five Dollars a Month"
 CAN_twenty_five_dollars_a_month_desc:0 "Mr Aberhart's platform is a single figure: twenty-five dollars a month to every adult Albertan, paid out of the credit of the province. He cannot say by what machinery, and says instead that one need not understand electricity to use a light switch."
 CAN_twenty_five_dollars_a_month_tt:0 "The dividend is promised across the Prairies. §GSocial Credit support surges for 180 days.§! Sets §YThe Promise of the Dividend§!: §Gstability rises§!. §RAfter two years, if no dividend has been paid, the promise destroys itself.§!"
 CAN_the_canadian_nationalist_party:0 "The Canadian Nationalist Party"
 CAN_the_canadian_nationalist_party_desc:0 "Mr Whittaker's men parade in Winnipeg in brown shirts and hold their meetings in the Ukrainian districts, which is the point of holding them there. The party is small, loud and English-speaking, and it is the first of its kind west of the Lakehead."
 CAN_the_canadian_nationalist_party_tt:0 "The fascist movement takes root in the English-speaking Prairies. §GFascist support becomes possible there and grows.§! §RStability and local compliance fall.§!\n§YRequires§!: prairie anger already high."
 CAN_the_regina_manifesto:0 "The Regina Manifesto"
 CAN_the_regina_manifesto_desc:0 "The federation has adopted its programme at Regina, and it ends with a sentence that will be quoted against it for thirty years: no CCF government will rest content until it has eradicated capitalism and put into operation the full programme of."
 CAN_the_regina_manifesto_tt:0 "The manifesto is adopted at Regina. Sets §YEradication of Capitalism§!: §Gsupport grows steadily§!; §Rcivil industry falls, and British and American opinion sour§!."
 CAN_fifty_six_of_sixty_three:0 "Fifty-Six of Sixty-Three"
 CAN_fifty_six_of_sixty_three_desc:0 "Fifty-six seats out of sixty-three, for a party that did not exist three years ago and whose leader has never sat in a legislature. The old parties are wiped from the map of Alberta in a single night."
 CAN_fifty_six_of_sixty_three_tt:0 "Social Credit sweeps a Prairie province. §GTwo shared building slots there, and Social Credit support rises nationally.§! §RThe province withholds its transfers and federal political power falls.§!\n§YRequires§!: Social Credit at forty-five per cent in that state."
 CAN_the_parti_national_social_chretien:0 "Parti National Social Chrétien"
 CAN_the_parti_national_social_chretien_desc:0 "Mr Arcand has turned his readers into a party, with a blue-shirted militia, a swastika upon a blue ground, and a programme of corporatism and exclusion."
 CAN_the_parti_national_social_chretien_tt:0 "The blue shirts are organized in Quebec. §GFascist support rises in the French-speaking states.§! §RNational stability falls, and the Church and the Union Nationale are lastingly hostile.§!\n§YRequires§!: mass unemployment, and a shameful record upon the immigration files."
 CAN_a_producers_commonwealth:0 "A Producers' Commonwealth"
 CAN_a_producers_commonwealth_desc:0 "The programme is the farmer's own: the co-operative in place of the middleman, the elevator and the creamery owned by those who use them, credit at cost, and no man's labour bought cheap."
 CAN_a_producers_commonwealth_tt:0 "The co-operative programme becomes the party's own. Sets §YThe Producers' Commonwealth§!: §Gagricultural resource output rises§!; §Rmilitary factory output falls sharply, and conscription can rise no higher than a limited call-up§!."
 CAN_the_manifesto_stands:0 "The Manifesto Stands"
 CAN_the_manifesto_stands_desc:0 "The moderates want the eradication clause struck out so that the party may be spoken to in polite society. The convention refuses. A movement that trims its programme in order to be respectable will be respectable and nothing else."
 CAN_the_manifesto_stands_tt:0 "The eradication clause is kept. §GSupport grows twice as fast while the depression lasts.§! §RCivil industry falls further, the party may never enter a coalition, and it can never pass forty per cent.§!"
 CAN_a_farmer_labour_alliance:0 "A Farmer-Labour Alliance"
 CAN_a_farmer_labour_alliance_desc:0 "The eradication clause will be struck out and the programme rewritten, so that a farmer with a quarter section and a hired man may vote for it without believing himself a Bolshevik. The party becomes electable and coalitions become possible."
 CAN_a_farmer_labour_alliance_tt:0 "The programme is moderated for the farm vote. Removes §YEradication of Capitalism§!: §Gcoalitions are permitted and the ceiling rises to fifty-five per cent§!. §RThe left wing splits away, communist support rises permanently, and the road to a federal CCF government grows five years longer.§!"
 CAN_the_first_default:0 "The First Default"
 CAN_the_first_default_desc:0 "Alberta will not meet the interest upon its maturing bonds and will pay half. It is the first default by a Canadian government since Confederation, and the money markets of London, New York and Toronto have taken careful note."
 CAN_the_first_default_tt:0 "Alberta defaults upon its bonds. Sets §YThe Default of 1936§!: §Rall economic decisions cost half as much again, political power is lost daily, and no foreign loan or lend-lease may be had§!; §GSocial Credit support rises across the country§!. Only the settlement of 1945 will lift it."
 CAN_the_loan_council:0 "The Loan Council"
 CAN_the_loan_council_desc:0 "Ottawa will refinance the maturing issues at a rate the province can bear, and in exchange a Loan Council will approve every future provincial borrowing. No default, no repudiation, and no more speeches about the money power."
 CAN_the_loan_council_tt:0 "The province submits to federal supervision of its borrowing. §GThe issues are refinanced, no default occurs, stability rises sharply, and the promise of the dividend is withdrawn without penalty.§! §RA Social Credit federal government becomes impossible for good.§!"
 CAN_the_corporate_chambers:0 "The Corporate Chambers"
 CAN_the_corporate_chambers_desc:0 "Parliament will be reconstituted upon the basis of occupation rather than locality: chambers of agriculture, industry, labour and the professions, each sending its representatives, each bound to the national interest as the state defines it."
 CAN_the_corporate_chambers_tt:0 "Parliament is reconstituted upon corporate lines. Sets §YA Corporate Order§!: §Gindustrial unrest disappears entirely and authoritarian support grows faster§!; §Rfactory output falls sharply§!. The repeal of Section 98 is locked."
 CAN_the_party_line_on_the_war:0 "The Party Line on the War"
 CAN_the_party_line_on_the_war_desc:0 "Moscow has determined that this is an imperialist war and the party has fallen into line within the week, against the judgement of most of its own membership. In English Canada it is political suicide and the losses are immediate."
 CAN_the_party_line_on_the_war_tt:0 "The party adopts the line against the imperialist war. §RTwelve per cent of its support in English Canada is lost at once.§! §GSix per cent is gained in the French-speaking states, and the party becomes the only English-language home of the anti-conscription vote.§!"
 CAN_the_fifty_big_shots:0 "The Fifty Big Shots"
 CAN_the_fifty_big_shots_desc:0 "Mr Aberhart has told the province that fifty big shots in Toronto and Montreal own the credit of Canada and mean to keep it."
 CAN_the_fifty_big_shots_tt:0 "The province legislates against the banks and the press. §GThe Alberta Statutes are unlocked, along with the federal power of disallowance against them; Social Credit support rises.§! §RBritish opinion falls sharply.§!"
 CAN_the_national_unity_party:0 "The National Unity Party"
 CAN_the_national_unity_party_desc:0 "The Montreal, Winnipeg and Toronto groups have met at Kingston and merged under Mr Arcand, who is now styled the Canadian leader. A single party, blue shirts in both languages, and a programme Ottawa can no longer describe as a local nuisance."
 CAN_the_national_unity_party_tt:0 "The fascist groups merge under Arcand. §GThe party is unified in both languages.§! §RNational unity falls permanently, and the party can never rise above thirty-five per cent.§!\n§YRequires§!: fascist support and unemployment both high, and a debt of blood already owing."
 CAN_the_alberta_treasury_branches:0 "The Alberta Treasury Branches"
 CAN_the_alberta_treasury_branches_desc:0 "The courts have struck down every attempt to control the chartered banks, so the province will simply open its own. The Treasury Branches will take deposits, issue transfer vouchers, and pay a bonus upon goods made in Alberta."
 CAN_the_alberta_treasury_branches_tt:0 "The province opens its own deposit institutions. §GAlberta is immune to the penalties of the default, and civilian construction there is faster.§! §RNational trade revenue falls.§!"
 CAN_no_war_for_the_english_kings:0 "No War for the English Kings"
 CAN_no_war_for_the_english_kings_desc:0 "The party's line is that this is a war for the English kings and the English bankers, and that no Canadian, and above all no French Canadian, owes it a day of his life."
 CAN_no_war_for_the_english_kings_tt:0 "The party campaigns openly against the war. §GFascist support grows steadily while the war lasts and the casualties mount.§! §RThe internment order is armed, and grows likelier the weaker the party becomes.§!"
 CAN_social_credit_canada:0 "Social Credit Canada"
 CAN_social_credit_canada_desc:0 "The movement takes Ottawa, and the national dividend ceases to be a provincial impossibility and becomes a federal policy. Credit is issued against the productive capacity of the country and paid to every citizen as of right."
 CAN_social_credit_canada_tt:0 "Social Credit forms the federal government and Canada goes non-aligned. Sets §YThe National Dividend§!: §Gstability rises greatly and no faction may call upon us§!; §Rconsumer goods and factory construction cost far more, and external trade collapses§!.\n§YRequires§!: Social Credit at forty-five per cent, and a central bank in being."
 CAN_forty_seven_of_fifty_two:0 "Forty-Seven of Fifty-Two"
 CAN_forty_seven_of_fifty_two_desc:0 "Forty-seven seats of fifty-two, and the first socialist government in North America is sworn in at Regina."
 CAN_forty_seven_of_fifty_two_tt:0 "The CCF takes Saskatchewan. §GNational socialist support rises sharply, and the province gains two shared building slots.§! §RFederal stability falls.§!\n§YRequires§!: socialist support at thirty per cent. §YBypassed§! if the estimates were held and the party is already strong."
 CAN_the_hour_of_the_conscripts:0 "The Hour of the Conscripts"
 CAN_the_hour_of_the_conscripts_desc:0 "The men called up under the National Resources Mobilization Act are being sent overseas after all, and every word said in Quebec since 1917 has been proved right by a single order in council."
 CAN_the_hour_of_the_conscripts_tt:0 "The betrayal is turned to account. §GFascist support rises in the French-speaking states.§! §RCompliance in Quebec collapses, and desertion rises in the home defence units.§!\n§YRequires§!: that Quebec has been betrayed."
 CAN_the_douglas_experiment:0 "The Douglas Experiment"
 CAN_the_douglas_experiment_desc:0 "Saskatchewan will do what no government in North America has attempted: hospital insurance for every resident, paid by the province, and a bill of rights protecting conscience, assembly and equality before the law."
 CAN_the_douglas_experiment_tt:0 "Hospital insurance and a provincial bill of rights are enacted at Regina. §GA building slot in Saskatchewan, and the prairie is answered at last.§! §RSocialist support grows across the country, and the other premiers are asked why they have not done the same.§!"
 CAN_the_corporative_dominion:0 "The Corporative Dominion"
 CAN_the_corporative_dominion_desc:0 "The party takes power and the parliamentary constitution is set aside in favour of the corporate chambers and the leader. The Dominion becomes something no part of this country has ever voted for and only a fraction of it will accept."
 CAN_the_corporative_dominion_tt:0 "The National Unity Party forms a government. Sets §YA Dominion Without a Nation§!: §Gtotal war legislation is unlocked§!; §Rstability collapses, two states are in permanent resistance, no faction may be joined, and British and American opinion are lost§!. Will lead to war with the United States."
 CAN_the_co_operative_commonwealth:0 "The Co-operative Commonwealth"
 CAN_the_co_operative_commonwealth_desc:0 "The federation takes office at Ottawa and begins with the banks, the transport and the utilities. Four plants pass to public ownership in the first year, and the transition costs the country a year of output."
 CAN_the_co_operative_commonwealth_tt:0 "The CCF forms the federal government. §GFour civilian factories pass to the state, and output rises by a quarter after a year of transition.§! Sets §YThe Co-operative Commonwealth§!: §Gstability and civil construction rise§!; §Rexternal trade is halved for three years, British and American opinion fall, and conscription can never rise above volunteers§!."
 CAN_prairie_farm_rehabilitation:0 "Prairie Farm Rehabilitation"
 CAN_prairie_farm_rehabilitation_desc:0 "The topsoil of the Palliser triangle is in the ditches and upon the windows of Winnipeg, and the men who ploughed it did as they were taught."
 CAN_prairie_farm_rehabilitation_tt:0 "The rehabilitation of the dry belt begins. §GThe penalty of the drought is halved, and the community pastures are unlocked.§! §RHalf a civilian factory each year for five years.§!\n§YRequires§!: the drought upon us."
 CAN_the_canadian_wheat_board:0 "The Canadian Wheat Board"
 CAN_the_canadian_wheat_board_desc:0 "The pools are broken, the open market has collapsed twice in five years, and the grower will not carry the risk again. A Board will buy the crop at a guaranteed initial payment, sell it as it can, and pay the balance when the sale is made."
 CAN_the_canadian_wheat_board_tt:0 "The Board takes the crop at a guaranteed initial price. Removes §YUnsold Wheat Mountain§!: §Gstability rises across the Prairies§!. §RThe Treasury carries the difference whenever the world price falls below the guarantee.§!\n§YRequires§!: a central bank in being."
 CAN_the_leduc_field:0 "The Leduc Field"
 CAN_the_leduc_field_desc:0 "Imperial has drilled one hundred and thirty-three dry holes and the hundred and thirty-fourth came in at Leduc in February. The field is large, the province owns the mineral rights, and the royalties will be paid to Edmonton."
 CAN_the_leduc_field_tt:0 "The Leduc field is brought in by private capital. §GAlberta becomes an oil state with two refineries, infrastructure in the West is built faster, and American opinion improves.§! §RThe royalties are the province's, and the Dominion receives nothing.§!\n§YRequires§!: the discovery well."
 CAN_a_crown_oil_company:0 "A Crown Oil Company"
 CAN_a_crown_oil_company_desc:0 "The field lies beneath land whose minerals the Dominion has never transferred, and a Crown company will develop it. The rent will be paid to Ottawa and not to Edmonton, and the refining will be done to a national plan."
 CAN_a_crown_oil_company_tt:0 "The field is developed by a Crown company. §GTwo refineries, and the whole rent accrues to the central government.§! §RAmerican opinion collapses, no American refining licence may be had, and Alberta defies Ottawa.§! Provincial autonomy rises by 3.\n§YRequires§!: the Crown lands never transferred."
 CAN_a_central_bank_for_the_dominion:0 "A Central Bank for the Dominion"
 CAN_a_central_bank_for_the_dominion_desc:0 "The Macmillan Commission has reported that a country with a foreign trade the size of ours and no central bank is a country whose monetary policy is made in London and New York."
 CAN_a_central_bank_for_the_dominion_tt:0 "The §YBank of Canada§! is established. Removes §YNo Central Bank§!: §Geconomic decisions cost a quarter less, political power accrues faster, and the railway deficit is halved§!. Sets §YThe Bankers' Charter§!: §Rthe Bank is privately owned§!. The victory loan and the nationalization of the Bank are unlocked."
 CAN_the_minister_of_everything:0 "The Minister of Everything"
 CAN_the_minister_of_everything_desc:0 "Mr Howe will have the Department of Munitions and Supply and, under the War Measures Act, whatever else he decides he requires."
 CAN_the_minister_of_everything_tt:0 "The §YDepartment of Munitions and Supply§! is created under C. D. Howe. §GConversion is faster and costs half as much.§! Sets §YThe Controller of Everything§!.\n§YRequires§!: general mobilization, the compact still holding."
 CAN_twenty_eight_crown_corporations:0 "Twenty-Eight Crown Corporations"
 CAN_twenty_eight_crown_corporations_desc:0 "Where no company exists to do the work, the department will incorporate one: Victory Aircraft, Research Enterprises, Polymer at Sarnia, Wartime Housing, and twenty-four more. They pay their dividends to the Receiver General and answer to Mr Howe."
 CAN_twenty_eight_crown_corporations_tt:0 "Crown companies are incorporated wherever no firm exists. Unlocks §YIncorporate a Crown Company§!. Sets §YCrown Corporations§!: §Gmilitary factory output rises§!; §Rthey must be liquidated when the war is over§!."
 CAN_the_hyde_park_declaration:0 "The Hyde Park Declaration"
 CAN_the_hyde_park_declaration_desc:0 "Canada is buying American components to build British equipment and being paid in sterling that will not buy American components. The dollar reserve has three months to run."
 CAN_the_hyde_park_declaration_tt:0 "The dollar problem is settled with Washington. Removes §YThe American Dollar Gap§!: §Gequipment production rises, American licences are far more efficient, and American opinion improves greatly§!. Sets §YContinental Production§!: §Rmilitary output suffers if American opinion falls away, and British opinion falls§!.\n§YRequires§!: continental alignment already advanced."
 CAN_the_billion_dollar_gift:0 "A Billion for Britain"
 CAN_the_billion_dollar_gift_desc:0 "Britain cannot pay for what she is buying here and will not be allowed to stop buying. The Dominion will make an outright gift of a thousand million dollars and follow it with mutual aid appropriations for the rest of the war."
 CAN_the_billion_dollar_gift_tt:0 "A thousand million dollars is voted to Britain outright. Sets §YArsenal of the Commonwealth§!: §GBritish opinion reaches its height§!; §RAmerican opinion falls, and the dollar gap remains and worsens month by month§!. The mutual aid appropriation is unlocked."
 CAN_the_power_of_the_saguenay:0 "The Power of the Saguenay"
 CAN_the_power_of_the_saguenay_desc:0 "The Shipshaw development will be the largest hydro-electric plant in the world when the last unit is turned, and every kilowatt of it goes to the pots at Arvida. Nine-tenths of the aluminium of the Commonwealth will come out of one Quebec valley."
 CAN_the_power_of_the_saguenay_tt:0 "The Saguenay is dammed and Arvida enlarged. §GTwo civilian factories and a military factory in Quebec, aluminium in permanent supply, and aircraft production rises sharply.§!\n§YBypassed§! if the Saguenay states are not ours."
 CAN_fourth_among_the_allies:0 "Fourth Among the Allies"
 CAN_fourth_among_the_allies_desc:0 "The war ends with this country the fourth industrial power among the Allies, a merchant fleet built from nothing, and a debt that is owed entirely to Canadians."
 CAN_fourth_among_the_allies_tt:0 "The war economy is wound down in order. Sets §YFourth Arsenal of the United Nations§!: §Gthe railway deficit and the active war penalties are cleared, the war debt is settled, and the Crown companies are converted§!. Sets §YThe Fear of 1919§!: §Rmilitary output falls for 360 days§!."
 CAN_the_joint_staff_programme:0 "The Joint Staff Programme"
 CAN_the_joint_staff_programme_desc:0 "The Chiefs of Staff have asked for a field force and the Cabinet will not give them one."
 CAN_the_joint_staff_programme_tt:0 "The estimates are raised for home defence only. Removes §YA Militia, Not an Army§!: §Gtwo military factories, and priority to coast defence§!. Sets §YNo Plan for a Field Force§!: §Rthe peace dividend stands until war comes§!."
 CAN_a_field_force_for_overseas:0 "A Field Force for Overseas"
 CAN_a_field_force_for_overseas_desc:0 "The Chiefs will have their field force: divisions of the permanent force at full establishment, modern templates, and the transport to move them."
 CAN_a_field_force_for_overseas_tt:0 "A field force is raised for service overseas. Removes §YPeace Dividend§! and §YA Militia, Not an Army§! at once: §Gthree permanent force divisions, recruitable population rises greatly, and modern templates are granted§!. §RA civilian factory is converted.§! Sets §YThe Ghost of 1917§!: §Rnational unity falls, the crises come earlier, and the blood tax rises by 5§!.\n§YRequires§!: the compact still holding."
 CAN_the_first_canadian_army:0 "The First Canadian Army"
 CAN_the_first_canadian_army_desc:0 "Two corps, an armoured division and the corps troops, under a Canadian commander answering to Ottawa and not to the War Office. General McNaughton calls it a dagger pointed at the heart of Berlin, a phrase the British staff find trying."
 CAN_the_first_canadian_army_tt:0 "The §YFirst Canadian Army§! is formed under Canadian command. §GAn army group command, a field marshal slot and armoured templates.§! Grants the army spirit §YAn Army of Our Own§!.\n§YRequires§!: the compact still holding."
 CAN_little_stalingrad:0 "Little Stalingrad"
 CAN_little_stalingrad_desc:0 "The First Division has been a week in Ortona and is taking the town house by house, blowing through the party walls rather than crossing the streets."
 CAN_little_stalingrad_tt:0 "The Corps fights its way through Ortona. Grants the army spirit §YMouseholing§!. §RI Canadian Corps is detached to the Mediterranean: the army group bonus is suspended, and the reinforcement deficit grows half as fast again.§!"
 CAN_juno_beach:0 "Juno Beach"
 CAN_juno_beach_desc:0 "The Third Division goes ashore between the British beaches upon the sixth of June, with the armoured brigade and the engineers who cleared the obstacles."
 CAN_juno_beach_tt:0 "The Third Division assaults Juno. Grants the §Y3rd Canadian Infantry Division§! template. §GAn additional assault wave, and far faster invasion planning.§! §RThe reinforcement deficit is opened.§!\n§YRequires§!: the lessons of Dieppe."
 CAN_ralston_stays:0 "Ralston Stays"
 CAN_ralston_stays_desc:0 "Colonel Ralston has come back from Italy with the reinforcement figures and will not be talked out of them."
 CAN_ralston_stays_tt:0 "The Minister is kept and full conscription is imposed. §GEvery home defence man goes overseas: reinforcements are doubled for 360 days and manpower recovers faster.§! §RThe blood tax rises by 25, the heaviest levy of the war. Thirty days later the House is seized of the matter, and the government may not survive it.§!\n§YRequires§!: the reinforcement crisis, and the law permitting both measures."
 CAN_the_king_manoeuvre:0 "Not Necessarily Conscription"
 CAN_the_king_manoeuvre_desc:0 "Not necessarily conscription, but conscription if necessary: the formula has held the country together for five years and it will be made to do so once more."
 CAN_the_king_manoeuvre_tt:0 "A single levy of sixteen thousand is ordered. §GManpower rises and reinforcements are increased for 180 days; the government survives and the House is not seized of the matter.§! §RThe blood tax rises by 15. Ninety days pass before any effect is felt at the front, a minister resigns, and the home defence units mutiny at Terrace.§!\n§YRequires§!: the law permitting it."
 CAN_no_conscription:0 "The Pledge Holds"
 CAN_no_conscription_desc:0 "The pledge was given in 1939, repeated at the plebiscite, and it will be kept. No man who did not offer will be sent overseas, whatever the state of the battalions."
 CAN_no_conscription_tt:0 "The pledge is kept and no man is compelled. §GStability and national unity rise sharply, nationalist support in Quebec collapses, and no levy is made.§! Sets §YBattalions at Half Strength§!: §RBritish and American opinion fall, I Canadian Corps is withdrawn, and Canada's standing among the powers is lost again.§!\n§YBypassed§! if the voluntary compact was given."
 CAN_a_chief_of_the_air_staff:0 "A Chief of the Air Staff"
 CAN_a_chief_of_the_air_staff_desc:0 "The air force has been administered as a branch of the Militia since the departments were merged, and its senior officer has answered to the Chief of the General Staff."
 CAN_a_chief_of_the_air_staff_tt:0 "The air force is given its own Chief of Staff. The last of the civil operations spirits is removed. §GAn air research slot is opened and the whole of air doctrine is unlocked.§! Air Vice-Marshal §YG. M. Croil§! is available."
 CAN_the_aerodrome_of_democracy:0 "The Aerodrome of Democracy"
 CAN_the_aerodrome_of_democracy_desc:0 "The plan will train aircrew for the whole Commonwealth upon Canadian soil, at Canadian schools, and the Dominion will pay the greater part of the bill. A hundred and thirty thousand men will pass through it before the war ends."
 CAN_the_aerodrome_of_democracy_tt:0 "The §YBritish Commonwealth Air Training Plan§! begins. §GEvery air base becomes a school; war support and volunteering rise in the French-speaking states.§! §REnglish-Canadian support falls, and the blood tax rises by 3.§! The service flying training schools are unlocked."
 CAN_an_imperial_school_on_our_soil:0 "An Imperial School on Our Soil"
 CAN_an_imperial_school_on_our_soil_desc:0 "The plan may be run as London wishes it run: British command, British money, British establishments upon Canadian ground, and the graduates posted to Royal Air Force squadrons as the Air Ministry directs."
 CAN_an_imperial_school_on_our_soil_tt:0 "The plan is run and paid for by London. §GBritish opinion reaches its height, the schools cost no consumer goods, and the plan is running ninety days sooner.§! Sets §YTrained for Another Flag§!: §Rthe graduates go to British squadrons§!. §RThe blood tax rises by 1 only.§!"
 CAN_federal_aircraft_limited:0 "Federal Aircraft Limited"
 CAN_federal_aircraft_limited_desc:0 "The plan needs three thousand training machines and no Canadian firm can build them alone. A Crown company will hold the contracts and parcel the work among the plants: fuselages here, wings there, assembly at Malton."
 CAN_federal_aircraft_limited_tt:0 "A Crown company is formed to build the training aircraft. §GTwo military factories in the industrial states, and licence production of training airframes.§! Sets §YAirframes for the Plan§!. §RThe blood tax rises by 3.§!\n§YBypassed§! if the Ottawa arsenal was built."
 CAN_the_home_war_establishment:0 "The Home War Establishment"
 CAN_the_home_war_establishment_desc:0 "Eastern Air Command will fly the convoy escort from Newfoundland to the Gulf, and Western Air Command will watch the Pacific coast against a threat nobody seriously expects."
 CAN_the_home_war_establishment_tt:0 "The home squadrons are stood up for coastal defence. §GFour maritime patrol wings, and far more effective anti-submarine work in Canadian waters.§! Sets §YHome War Establishment§!: §Rthese wings may never leave the North American theatre, and the blood tax rises by 3§!."
 CAN_article_fifteen:0 "Article Fifteen"
 CAN_article_fifteen_desc:0 "Article fifteen of the agreement provides that Canadian graduates may be organized into Royal Canadian Air Force squadrons overseas, and the Air Ministry has been remarkably slow to notice it. Ottawa will insist."
 CAN_article_fifteen_tt:0 "The Canadianization of the overseas squadrons is enforced. §GUp to eight wings become national, and a quarter of the plan's air experience is retained.§! §RMission efficiency falls for 180 days, and British opinion falls.§!"
 CAN_no_six_group:0 "Six Group"
 CAN_no_six_group_desc:0 "Eight squadrons in Yorkshire will be formed into a Canadian group of Bomber Command, with a Canadian air officer commanding and Canadian ground crews. It is the only national bomber force in the Command."
 CAN_no_six_group_tt:0 "§YNo. 6 (RCAF) Group§! is formed in Bomber Command. §GA heavy bomber wing template, an air theatre commander, and strategic bombing experience gained far faster.§! Sets §YThe Price of Six Group§!: §Rthe losses are Canada's own§!."
 CAN_under_another_badge:0 "Under Another Badge"
 CAN_under_another_badge_desc:0 "The graduates will be posted where the Air Ministry needs them, in British squadrons, under British command, wearing Canada only upon the shoulder."
 CAN_under_another_badge_tt:0 "The graduates serve in British squadrons. §GAir efficiency rises for every member of the faction, British opinion improves, and no loss penalty is borne.§! §RNo national wing templates, and no national air experience is ever accumulated.§!"
 CAN_an_air_force_of_our_own:0 "An Air Force of Our Own"
 CAN_an_air_force_of_our_own_desc:0 "The plan is closing and the question is what is left when the schools are shut. Half the stations will be kept as permanent air force establishments and the rest sold or ploughed."
 CAN_an_air_force_of_our_own_tt:0 "The schools are wound up and the service made permanent. Removes §YThe Aerodrome of Democracy§! and converts half the schools into permanent stations. §GWith Six Group, sets §YFourth Air Force in the World§!.§! §RWithout it, sets §YA Training Command and Nothing More§!.§!"
 CAN_corvettes_by_the_hundred:0 "Corvettes by the Hundred"
 CAN_corvettes_by_the_hundred_desc:0 "The corvette is a whale-catcher with a gun upon it and it can be built in any yard on the Lakes or the St Lawrence that can weld a plate. Sixty-four are ordered in the first programme and there will be a great many more."
 CAN_corvettes_by_the_hundred_tt:0 "The corvette programme is laid down. §GGrants the corvette template, converts three river yards into dockyard slots, and halves the cost of escorts.§! Sets §YGreen Crews and Old Sets§!: §Rthe ships are new and the men are not§!.\n§YBypassed§! beyond forty escorts in service."
 CAN_escort_group_reform:0 "Refit the Escort Groups"
 CAN_escort_group_reform_desc:0 "The Canadian groups are escorting more convoys and losing more ships than anyone else in the North Atlantic, and the reason is not the men. They have the old set radar, no high-frequency direction finding, and no time ashore to train."
 CAN_escort_group_reform_tt:0 "The escort groups are withdrawn in turn to refit and work up. §REscort efficiency is halved for 180 days.§! Removes §YGreen Crews and Old Sets§! and sets §YRadar, HF/DF and Time to Train§!: §Gthe groups come back fit to fight§!. Grants the River-class frigate template."
 CAN_a_theatre_of_our_own:0 "A Theatre of Our Own"
 CAN_a_theatre_of_our_own_desc:0 "The Atlantic Convoy Conference has divided the ocean, and the north-western quarter of it will be a Canadian command. Rear-Admiral Murray will direct every ship and aircraft within it, whatever flag they fly."
 CAN_a_theatre_of_our_own_tt:0 "The §YCanadian Northwest Atlantic§! becomes a Canadian command. §GEscort efficiency rises for every ally crossing it, and British and American opinion improve.§! Admiral §YLeonard Murray§! may be recruited."
 CAN_a_carrier_for_the_dominion:0 "A Carrier for the Dominion"
 CAN_a_carrier_for_the_dominion_desc:0 "The Admiralty will lend a light fleet carrier, manned by Canadians and flying the Canadian ensign, upon the understanding that she remains British property."
 CAN_a_carrier_for_the_dominion_tt:0 "A light fleet carrier is loaned by the Admiralty. §GCarrier hulls and carrier air groups are unlocked.§! Sets §YA Fleet Worth the Name§!. §RTwo escorts are given up, consumer goods rise, and the ship may be recalled if British opinion falls away.§!"
 CAN_the_anti_submarine_navy:0 "The Anti-Submarine Navy"
 CAN_the_anti_submarine_navy_desc:0 "The service will be built for one purpose and will admit it: escort, detection and the killing of submarines in the North Atlantic. No battleships, no heavy cruisers, no fleet actions."
 CAN_the_anti_submarine_navy_tt:0 "The service is built round the escort. Sets §YThe North Atlantic Trade§!: §Ganti-submarine work and detection are far more effective, escorts are cheaper, and every ally benefits§!; §Rbattleship, heavy cruiser and carrier hulls are locked, and range outside the North Atlantic is halved§!."

 ##### ere CW (1949 et apres) - 10 focus
 CAN_the_massey_commission:0 "The Massey Commission"
 CAN_the_massey_commission_desc:0 "Mr Massey's commission will inquire into the arts, letters and sciences of this country and will report what everyone already suspects: that the magazines, the films and the broadcasts our people consume are made elsewhere."
 CAN_the_massey_commission_tt:0 "The commission upon the arts, letters and sciences reports. Sets §YCultural Sovereignty§!: §Gforeign propaganda is far less effective and compliance rises§!; §Rpolitical power is lost daily§!. The broadcasting and federal university decisions are opened.\n§YRequires§!: a citizenship of our own, or American influence grown too strong."
 CAN_a_constitution_of_our_own:0 "A Constitution of Our Own"
 CAN_a_constitution_of_our_own_desc:0 "The last piece of the colonial constitution is the Act itself, and it can be brought home the moment there is a formula for amending it here. Ottawa will legislate the formula and ask Westminster for the document."
 CAN_a_constitution_of_our_own_tt:0 "The constitution is brought home with an amending formula. Removes §YNo Amending Formula§!: §Gcentralizing focuses are a quarter faster and stability rises§!. §RCompliance falls in Quebec and Ontario for two years.§! §GIt costs less where the provinces have already been accommodated.§!"
 CAN_a_commonwealth_pact:0 "A Commonwealth Pact"
 CAN_a_commonwealth_pact_desc:0 "The alternative to an Atlantic alliance led from Washington is a Commonwealth defence pact led from London: mutual guarantee, common training, common patterns, and the Dominions consulted as equals."
 CAN_a_commonwealth_pact_tt:0 "A Commonwealth defence pact is formed under British leadership. §GDefensive guarantees, and opinion improves with every Dominion.§! §RThere is no economic article, and the offshore purchases of the Marshall Plan are lost: factory output falls for a year.§!"
 CAN_a_continental_union:0 "A Continental Union"
 CAN_a_continental_union_desc:0 "Customs union, monetary union, and the defence of the continent under a single command at Washington. The prosperity would be immediate and enormous, and no serious person disputes it."
 CAN_a_continental_union_tt:0 "Canada enters a customs, monetary and defence union with the United States. §GConversion is far faster, American licences are unlimited, and no garrison is required.§! §RThe American faction is permanent, all influence in international bodies is lost, and middle power standing is closed for good.§!\n§YRequires§!: continental alignment at its deepest."
 CAN_patriate_the_court:0 "Patriate the Court"
 CAN_patriate_the_court_desc:0 "Appeals from Canadian courts have gone to the Judicial Committee in London since Confederation, and that Committee has spent seventy years reading the British North America Act in favour of the provinces."
 CAN_patriate_the_court_tt:0 "Appeals to the Judicial Committee are abolished. Removes §YAppeals Lie to London§!: §Gthe Supreme Court becomes final, and stability is more effective§!. §GStability rises in English Canada§!; §Rand falls in French Canada§!."
 CAN_the_atlantic_pact:0 "The Atlantic Pact"
 CAN_the_atlantic_pact_desc:0 "The treaty will bind North America and western Europe in a single defensive undertaking, and Canada has argued for it from the first draft. Mr Reid's memorandum of 1947 anticipated the whole design."
 CAN_the_atlantic_pact_tt:0 "Canada helps to found the Atlantic alliance. Removes §YNo Automatic Commitments§! by choice: §Gan Atlantic faction is founded or joined, shared doctrine research is faster, and deployment to Europe is unlocked§!."
 CAN_the_tenth_province:0 "The Tenth Province"
 CAN_the_tenth_province_desc:0 "The second referendum has carried confederation by fifty-two per cent, and the Terms of Union are signed."
 CAN_the_tenth_province_tt:0 "Newfoundland enters Confederation. Removes §YThe Atlantic Gap§!: §Ga naval dockyard, the aerodromes at Gander and Torbay, seven seats in the Commons and six in the Senate§!. Sets §YTerms of Union§!."
 CAN_no_entangling_alliances:0 "No Entangling Alliances"
 CAN_no_entangling_alliances_desc:0 "The Dominion has fought two European wars in thirty years and buried a hundred thousand men for arrangements made in other capitals. There will be no third."
 CAN_no_entangling_alliances_tt:0 "Canada signs no alliance and stations no troops abroad. Removes §YOccupation Commitments§!: §Gconsumer goods are easier and stability rises§!. Sets §YAlone on the Rim§!: §Rdiplomacy is a quarter less effective, no foreign licence may be had, and Arctic sovereignty crises are far more frequent§!. Middle power standing is closed."
 CAN_the_canadian_article:0 "The Canadian Article"
 CAN_the_canadian_article_desc:0 "An alliance of guns alone will not outlast the emergency that produced it. Ottawa will insist that the treaty contain an undertaking to strengthen free institutions and to encourage economic collaboration between the parties."
 CAN_the_canadian_article_tt:0 "Article 2 is written into the treaty. Removes §YA Pact of Guns Only§!: §Gcivilian construction is more efficient for every member of the alliance, and Canadian influence within it rises by a quarter§!."
 CAN_a_middle_power:0 "A Middle Power"
 CAN_a_middle_power_desc:0 "The Dominion is not a great power and has stopped pretending to be a small one. It has the fourth industry among the Allies, a seat upon the Combined Boards, a hand in the Atlantic treaty and a foreign service of its own."
 CAN_a_middle_power_tt:0 "Canada takes her place as a middle power. Removes §YA Dominion Is Not a Power§!. §GThe full standing is granted if little is owed upon the record of civil liberties; otherwise the standing is granted encumbered, at half value.§!\n§YThis focus cannot be bypassed.§!"

