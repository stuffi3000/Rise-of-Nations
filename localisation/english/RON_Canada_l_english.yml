 ##### The head tax, 1900 and 1903
 CAN_raise_the_head_tax:0 "Raise the Head Tax"
 CAN_raise_the_head_tax_desc:0 "Fifty dollars is no longer held to be sufficient. The Minister of the Interior will move one hundred, and the Chinese Immigration Act of 1903 will move five hundred - about two years of a labourer's wages, payable at the wharf before a man may land. Those already in the country will not bring their wives and children over such a sum, and that is understood by everyone in the House to be the object of the measure. British Columbia will be quiet for a few years afterward."
 CAN_raise_the_head_tax_window_tt:0 "The second increase cannot be moved before §Y1903§!."
 CAN_raise_the_head_tax_pending_tt:0 "The measure is before the House and will have Royal Assent within the month."
 CAN_repeal_the_head_tax:0 "Repeal the Head Tax"
 CAN_repeal_the_head_tax_desc:0 "To take the tax off is to tell British Columbia that the Dominion will no longer collect its exclusion at the wharf. The agitation that was bought quiet will begin again in the same week, and the province will remember it at the next election. It also settles the question of 1923 in advance: a government cannot repeal the tax and then replace it with something worse."

 ##### Order-in-Council P.C. 1324, 12 August 1911
 CAN_proclaim_pc_1324:0 "Proclaim the Order"
 CAN_proclaim_pc_1324_desc:0 "Order-in-Council P.C. 1324, approved on 12 August 1911, prohibits for one year the landing of any immigrant belonging to the Negro race, that race being deemed unsuitable to the climate and requirements of Canada. Those are the words of the Order. To proclaim it is to put them in the statute book, where they may be read aloud in Washington, in London and in the House."
 CAN_approve_pc_1324:0 "Approve It and Never Proclaim It"
 CAN_approve_pc_1324_desc:0 "The Order stands approved in the register and is left there. The work is done at the border instead: medical examinations applied with a diligence reserved for particular applicants, and agents paid to travel through Oklahoma explaining that the Canadian winter cannot be survived by those who are coming. Nothing whatever is gained by this. It is simply what was done."
 CAN_strike_pc_1324:0 "Strike It from the Register"
 CAN_strike_pc_1324_desc:0 "The Order is struck out before it lapses of its own accord on 5 October. The Prairie boards of trade will complain, the Minister will be asked to explain himself in the House, and nothing else follows from it - which is the whole of the point."

 ##### The Oliver Act, 1911
 CAN_the_oliver_act:0 "The Oliver Act"
 CAN_the_oliver_act_desc:0 "Section 49A of the Indian Act, 1911: where a reserve adjoins a town of eight thousand souls or more, the land may be taken and the community removed without its consent. The Songhees reserve at Victoria goes first, by S.C. 1911 c. 24, because the harbour frontage is wanted. The files on the removals are closed to inspection."
 CAN_treaty_renewal:0 "Treaty Renewal"
 CAN_treaty_renewal_desc:0 "The Department sits down with the councils it has spent forty years going around. It cannot undo section 49A and it will not give the land back, but it can stop using the section, and it can put the outstanding claims before a body permitted to find against the Crown. It is half a remedy. There is no whole one on offer."
 CAN_treaty_renewal_gate_tt:0 "Requires §Yno more than two suppressed files§! and that §Ythe Bryce report was funded rather than buried§!. A department that buries does not renegotiate."
 CAN_indigenous_enlistment:0 "Indigenous Enlistment"
 CAN_indigenous_enlistment_desc:0 "Recruiting parties are sent to the reserves. Enlistment there has always been high in proportion to the population and has never once been rewarded with the vote, with a pension office of its own, or with the return of an acre. The men come anyway, and they come by their own councils' word rather than by ours."
 CAN_indigenous_enlistment_gate_tt:0 "Closed by §RThe Broken Treaties§!, by §RA National Crime§! and by §RThe Grand River Dispute§!. Men whose council was dissolved by the Mounted Police are not queueing at our armouries."
 CAN_indigenous_enlistment_closed_tt:0 "§RIndigenous enlistment is closed for the rest of the period.§! Two wars will be fought without it."

 ##### The Chinese Immigration Act, 1 July 1923
 CAN_the_exclusion_act:0 "The Exclusion Act"
 CAN_the_exclusion_act_desc:0 "The Chinese Immigration Act, 1923, comes into force on the first of July - Dominion Day, which those it excludes will keep every year afterward as the day of humiliation. Twenty-four years of it will produce a few dozen admissions in the whole country. It replaces a tax which could at least in principle be paid by somebody."
 CAN_the_exclusion_act_gate_tt:0 "Requires that §Ythe head tax was raised and never repealed§!, and cannot be moved after §Y1934§!. A government that took the tax off cannot now shut the door."
 CAN_refuse_the_exclusion_act:0 "Refuse the Act"
 CAN_refuse_the_exclusion_act_desc:0 "The government declines to move the Bill. The Vancouver members will cross the floor over it, the Asiatic Exclusion League will hold meetings all summer, and two hundred points of the Prime Minister's authority will be spent holding the caucus together. In 1939 there will be men available to us who would otherwise have been kept out."
 CAN_force_136_recruitment:0 "Force 136 Recruitment"
 CAN_force_136_recruitment_desc:0 "Chinese Canadians are wanted for special operations in Southeast Asia, where they can move where no other soldier of ours can. If the Act of 1923 was passed, the government must first explain to the same electors, and to the men themselves, why it now wants the service of people it spent twenty years keeping out. If it was never passed, the recruiting office simply opens."
 CAN_force_136_gate_tt:0 "Open from §Y1939§! if the Exclusion Act was never passed. Otherwise not before §Y1944§!, and at a price."
 CAN_repeal_the_exclusion_act:0 "Repeal the Exclusion Act"
 CAN_repeal_the_exclusion_act_desc:0 "The Act is repealed on 14 May 1947, twenty-four years to the summer after it came into force. The men who served in Force 136 came home entitled to vote in a country their families could not enter. That, and not any change of heart in the Department, is what carried the repeal."
 CAN_repeal_the_exclusion_act_gate_tt:0 "Locked before §Y14 May 1947§!, and until §YForce 136 recruitment§! has taken place. The door opens only because excluded men served."
 CAN_repeal_the_exclusion_act_opened_tt:0 "§GThe repeal of the Exclusion Act becomes possible after 14 May 1947.§!"
 CAN_pacific_manpower_closed_tt:0 "§RChinese Canadian recruitment is closed until 1944, and will then cost one hundred points and stability in the West.§!"
 CAN_pacific_manpower_open_tt:0 "§GChinese Canadian recruitment will be open from the outbreak of war, and will cost nothing.§!"

 ##### The deportations, 1931-1935
 CAN_deport_the_undesirables:0 "Deport the Undesirables"
 CAN_deport_the_undesirables_desc:0 "Any immigrant who becomes a public charge may be removed under the Immigration Act, and in a country where a third of the men are out of work that is a very large class of person. The trains go east to the ports in sealed cars. Relief rolls fall, the agitators in the camps are thinned out, and the Department reports a saving."
 CAN_open_the_doors:0 "Open the Doors"
 CAN_open_the_doors_desc:0 "The Order of 21 March 1931 is set aside and the files reopened. It will take a full year before anyone actually lands, the Opposition will ask in the House why foreigners are admitted while Canadians queue for relief, and the answer will not satisfy them. The country will be larger, later, and better staffed than it would have been."
 CAN_open_the_ports_opened_tt:0 "§GThe ports may now be opened to refugees, from the Evian conference onward.§!"

 ##### Evian and the door, 1938-1939
 CAN_close_the_door:0 "Close the Door"
 CAN_close_the_door_desc:0 "At Evian in July the powers are asked what each will take. The Canadian delegation is instructed to make no offer and to avoid any undertaking. The Director of Immigration Branch holds that the applicants are unsuitable for agriculture, which is the only class admitted, and that is the end of the file. It costs the Treasury nothing at all, and that is the worst of it."
 CAN_close_the_door_gate_tt:0 "Available from the §YEvian conference of July 1938§! until the end of the war."
 CAN_displaced_persons_deferred_tt:0 "§RAny displaced persons programme is deferred to 1948 at the earliest.§!"
 CAN_open_the_ports:0 "Open the Ports"
 CAN_open_the_ports_desc:0 "Halifax, Saint John and Quebec are opened to refugees, against the advice of the Immigration Branch and against a good part of the Cabinet. It will cost the government a tenth of its standing and a year of quarrels, and it will bring in men and women whose training this country has not got and cannot quickly make."
 CAN_open_the_ports_gate_tt:0 "Requires that §Ythe doors were opened in the thirties§!, and cannot be moved after §Y1939§!. A government that was deporting in 1935 does not receive in 1939, and to pretend otherwise would be false."

 ##### Order-in-Council P.C. 1486, 24 February 1942
 CAN_pc_1486:0 "Order-in-Council P.C. 1486"
 CAN_pc_1486_desc:0 "Every person of Japanese racial origin is to be removed from the protected area within one hundred miles of the coast. About twenty-one thousand people are covered by it, of whom roughly three quarters were born in Canada or naturalised. The Royal Canadian Mounted Police and the service chiefs have all advised that the measure is unnecessary. The British Columbia members have advised otherwise, and there is an election coming."
 CAN_pc_1486_gate_tt:0 "Requires §Ywar with Japan§!, and cannot be moved once the war is over."
 CAN_citizenship_for_all_closed_tt:0 "§RA citizenship for all is closed: the Dominion has just written an exception into it.§!"
 CAN_refuse_the_removal:0 "Refuse the Removal"
 CAN_refuse_the_removal_desc:0 "The government takes the advice of its own police and its own soldiers and declines to move anybody. The coast will be told that it is being left undefended, the British Columbia caucus will say so daily in the House, and the by-election will be lost. Nothing will be owed to anybody afterward, because nothing will have been taken."

 ##### The Custodian, January 1943
 CAN_the_auction_of_their_property:0 "The Auction of Their Property"
 CAN_the_auction_of_their_property_desc:0 "The Custodian of Enemy Property holds the farms, the boats and the houses in trust. An Order now permits their sale without the consent of the owners, and the proceeds are applied to the cost of maintaining the owners in the camps where they are being held. The detention will pay for itself, which is what the Order says in as many words."
 CAN_restitution_closed_tt:0 "§RThere will be nothing to give back in 1947.§!"
 CAN_freeze_the_estates:0 "Hold the Estates in Trust"
 CAN_freeze_the_estates_desc:0 "The Custodian keeps the property and sells nothing. The Treasury carries the cost of the camps itself, the boats rot at their moorings for want of anyone to work them, and in five years there will still be something on the register with a name against it."
 CAN_restitution_kept_open_tt:0 "§GThe property still exists. It can be returned in 1947.§!"

 ##### Ledger tooltips - counters
 CAN_the_ledger_tt:0 "§YThe Ledger§! - §HSuppressed files [?CAN_suppressed_evidence|0]/10§!, §Hdebt to civil liberties [?CAN_civil_liberties_debt|0]/20§!.\nWhat the Dominion knew and filed, and where it set the law aside. Neither figure is ever paid off in full, and both are read again in 1946."
 CAN_the_deportation_ledger_tt:0 "§RThirty thousand people were removed between 1930 and 1935.§! The country is smaller than it would have been, and it will notice when it comes to raise divisions."
 CAN_ledger_debt_one_tt:0 "§RThe debt to civil liberties rises by one.§!"
 CAN_ledger_debt_two_tt:0 "§RThe debt to civil liberties rises by two.§!"
 CAN_ledger_debt_three_tt:0 "§RThe debt to civil liberties rises by three.§!"
 CAN_ledger_evidence_one_tt:0 "§ROne more file is closed to inspection.§!"
 CAN_ledger_evidence_two_tt:0 "§RTwo more files are closed to inspection.§!"
 CAN_ledger_debt_remitted_one_tt:0 "§GOne point of the debt to civil liberties is remitted.§!"
 CAN_ledger_debt_remitted_two_tt:0 "§GTwo points of the debt to civil liberties are remitted.§!"
 CAN_ledger_no_refund_tt:0 "§RNo point of the ledger is returned. Repeal is not restitution.§!"
 CAN_the_mosaic_closed_tt:0 "§RA mosaic rather than a fortress is closed for good.§!"
 CAN_subjects_of_the_king_opened_tt:0 "§GSubjects of the King, all of them, becomes possible later.§!"
 CAN_treaty_renewal_opened_tt:0 "§GTreaty renewal becomes possible, while the files stay open.§!"
 CAN_status_of_the_first_nations_opened_tt:0 "§GThe status of the First Nations may now be raised as a question of state.§!"
 CAN_immigration_decisions_dearer_tt:0 "§REvery immigration decision after 1945 costs half again as much.§!"
 CAN_residential_schools_not_removed_tt:0 "§RThe schools are not closed. Attendance stays compulsory until 1951, which is beyond the end of this period.§!"
 CAN_the_property_has_been_sold_tt:0 "§RThe property has been sold.§!"

 ##### Ideas of the ledger
 CAN_exclusion_by_price:0 "Exclusion by Price"
 CAN_exclusion_by_price_desc:0 "Five hundred dollars at the wharf, about two years of a labourer's wages. The men who paid it in the nineties are still here, still working, and still without their families, because nobody can pay it twice. The canneries, the sawmills and the section gangs of the coast are short of hands and will stay short."
 CAN_exclusion:0 "The Exclusion Act"
 CAN_exclusion_desc:0 "The Act of 1923 does not tax the door, it shuts it. In twenty-four years it will admit a few dozen people to the whole Dominion. The universities notice it first: the students who were coming stop coming, and the laboratories that would have had them do not."
 CAN_the_colour_bar:0 "The Colour Bar"
 CAN_the_colour_bar_desc:0 "The prohibition stands proclaimed in the statute book, in the words of the Order: unsuitable to the climate and requirements of Canada. It is quoted with approval in one or two places abroad and with contempt in a good many more, and it will be read back to us for the rest of the century."
 CAN_the_colour_bar_in_practice:0 "The Colour Bar in Practice"
 CAN_the_colour_bar_in_practice_desc:0 "Nothing is proclaimed and nothing is written down twice. The medical examination at Emerson is thorough beyond anything a Scottish farmer ever faced, the agents in Oklahoma are eloquent about the winter, and the effect is the same as the Order would have had. It cannot be quoted against us, and it cannot be repealed either, because officially it does not exist."
 CAN_broken_treaties:0 "The Broken Treaties"
 CAN_broken_treaties_desc:0 "Section 49A permits the removal of a community without its consent whenever a town grows to eight thousand souls. Every council in the country now knows what a treaty with the Crown is worth when the land is wanted, and every recruiting sergeant sent to a reserve after this will be told so."
 CAN_broken_treaties_halved:0 "The Broken Treaties (Under Review)"
 CAN_broken_treaties_halved_desc:0 "The section is still on the books and the land is not coming back, but the Department has stopped using it and the outstanding claims are before a body that may find against the Crown. It is the difference between a wound and a wound being dressed."
 CAN_a_national_crime:0 "A National Crime"
 CAN_a_national_crime_desc:0 "Dr Bryce reported that of 1 537 children followed through fifteen western schools, a quarter were dead, and that in one institution with complete registers the figure was sixty-nine in the hundred. The report was received, filed, and not acted upon; his post was abolished in 1919 and he published the figures himself in 1922, at his own expense, under this title."
 CAN_residential_schools_reformed:0 "The Residential Schools (Reformed)"
 CAN_residential_schools_reformed_desc:0 "Sanatoria are built, day schools are opened where the churches will allow it, and the death rate falls to something a department can print. The system is not dismantled. Attendance remains compulsory, the churches keep the contracts, and the last of these schools will outlive everyone who signed this order."
 CAN_the_department_under_scrutiny:0 "The Department Under Scrutiny"
 CAN_the_department_under_scrutiny_desc:0 "The report is tabled and the Commons read it. Questions are asked for five years, the Minister answers them, the estimates pass unchanged and not one school closes. Knowing costs something and changes nothing, which is the hardest thing the file has to teach."
 CAN_the_grand_river_dispute:0 "The Grand River Dispute"
 CAN_the_grand_river_dispute_desc:0 "The hereditary council of the Six Nations was dissolved by Order-in-Council and the wampum taken into custody; an elected council sits in its place under the eye of the Mounted Police. The largest reserve in the country, which raised companies of volunteers in 1914 without being asked twice, will not be asked again."
 CAN_closed_doors:0 "Closed Doors"
 CAN_closed_doors_desc:0 "Order-in-Council P.C. 695 of 21 March 1931 admits British subjects and American citizens of means, and agriculturists able to farm. Everyone else is refused. It is the most restrictive admission policy in the history of the country and it will outlast the Depression that produced it."
 CAN_none_is_too_many:0 "None Is Too Many"
 CAN_none_is_too_many_desc:0 "Fewer than five thousand Jewish refugees will be admitted between 1933 and 1945, out of a continent of applicants. Asked how many the country would take after the war, an official will give the answer that names this policy. The country loses, permanently, the scientists and physicians it would otherwise have had."
 CAN_idea_a_mosaic_not_a_fortress:0 "A Mosaic, Not a Fortress"
 CAN_idea_a_mosaic_not_a_fortress_desc:0 "The doors were opened when it was least popular to open them, and the people who came brought the trades, the languages and the laboratories they were trained in. It cost the government of the day a great deal and it was never thanked for it."
 CAN_injustice_on_the_coast:0 "Injustice on the Coast"
 CAN_injustice_on_the_coast_desc:0 "Twenty-one thousand people removed from the coast under P.C. 1486, three quarters of them born here or naturalised. No charge of espionage or sabotage will ever be laid against any of them. The fishing fleet is impounded, Powell Street is emptied in a fortnight, and the province will take a generation to be honest about it."
 CAN_injustice_on_the_coast_aggravated:0 "Injustice on the Coast (The Sales)"
 CAN_injustice_on_the_coast_aggravated_desc:0 "The farms and the boats were sold over the owners' heads and the money spent on keeping the owners in the camps. There is now nothing to hand back, and everybody in the Department knows it."
 CAN_idea_pacific_manpower:0 "Pacific Manpower"
 CAN_idea_pacific_manpower_desc:0 "The Act of 1923 was never passed, and so the recruiting offices of the coast are open to everyone on the coast. It is a small addition to the strength of the country and it costs nothing, which is precisely what the exclusion cost us."
 CAN_a_shameful_ledger:0 "A Shameful Ledger"
 CAN_a_shameful_ledger_desc:0 "The file is thick enough that it is now raised by other governments before we have finished raising anything ourselves. A country that wants to be heard at San Francisco and at Washington finds that its own record is quoted back at it first."
 CAN_the_record_is_lost:0 "The Record Is Lost"
 CAN_the_record_is_lost_desc:0 "The departmental files were destroyed in regular lots, on written authority, in accordance with the schedule. What is missing will stay missing, and the numbers that were in it will be argued about for the rest of the century."
 CAN_a_revision_announced:0 "A Revision Announced"
 CAN_a_revision_announced_desc:0 "The joint committee has reported and the government has undertaken to revise the Indian Act. The revision will be passed in 1951. Until then the Act stands exactly as it is, and so does everything under it."

 ##### Dynamic modifiers of the ledger
 CAN_the_ledger_modifier:0 "The Ledger"
 CAN_the_deportation_ledger:0 "The Deportations"
 CAN_exclusion_by_price_coast:0 "Exclusion by Price: the Coast"
 CAN_exclusion_coast:0 "The Exclusion Act: the Coast"
 CAN_the_coast_under_order:0 "The Coast Under the Order"
