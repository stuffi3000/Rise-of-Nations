 # --- noms des modificateurs dynamiques (cle = identifiant du modificateur) --
 CAN_blood_tax_modifier:0 "The Blood Tax"
 CAN_blood_tax_modifier_desc:0 "Mr Bourassa gave the thing its name on 26 October 1899, resigning his seat over a contingent sent to South Africa by Order-in-Council and without a vote of the Commons. It does not measure Quebec's hostility to war: the province enlisted freely in 1914 as in 1939. It measures the credit Ottawa has already drawn upon its right to compel."
 CAN_a_war_not_ours_modifier:0 "A War That Is Not Ours"
 CAN_a_war_not_ours_half_modifier:0 "A War Not Wholly Ours"
 CAN_imperial_pride_modifier:0 "Imperial Pride"
 CAN_the_farmers_turned:0 "The Farmers Have Turned"

 # --- infobulle maitresse ---------------------------------------------------
 CAN_blood_tax_tt:0 "§YThe Blood Tax§! - §H[?CAN_blood_tax|0]§!/100  §G([GetCANBloodTaxTier])§!\n§WLast raised by:§! §R[GetCANBloodTaxCause]§!\n§WLast eased by:§! §G[GetCANBloodTaxRelief]§!\n§W--------------§!\nQuebec, the Saint Lawrence and Anticosti: §R[?global.CAN_bt_qc_manpower|%0]§! recruitable population, §R[?global.CAN_bt_qc_production|%0]§! construction\nAcadian New Brunswick: §R[?global.CAN_bt_acadian_manpower|%0]§! recruitable population\nEnglish Canada: §G[?global.CAN_bt_roc_manpower|%0]§! recruitable population\n§W--------------§!\n§RAt 100 the compact is called into question. The Dominion does not fall - it stops being one country.§!"

 # --- infobulles d'Etat -----------------------------------------------------
 CAN_a_war_not_ours_tt:0 "§YThe Blood Tax§! stands at §H[?CAN.CAN_blood_tax|0]§!/100. The recruiting depots of this province are emptying, and above sixty the works stop as well."
 CAN_a_war_not_ours_half_tt:0 "§YThe Blood Tax§! stands at §H[?CAN.CAN_blood_tax|0]§!/100. The grievance is real here and never of the same amplitude as in Quebec: half effect."
 CAN_imperial_pride_tt:0 "§YThe Blood Tax§! stands at §H[?CAN.CAN_blood_tax|0]§!/100. The same figure that empties the depots of Quebec fills the depots here - until eighty, past which rural Ontario turns as well."

 # --- infobulles d'effet ----------------------------------------------------
 CAN_blood_tax_raised_tt:0 "§RThe Blood Tax§! rises by §H[?CAN_bt_pending|0]§!, and stands at §H[?CAN_blood_tax|0]§!/100."
 CAN_blood_tax_eased_tt:0 "§GThe Blood Tax§! falls by §H[?CAN_bt_pending|0]§!, and stands at §H[?CAN_blood_tax|0]§!/100. §RIt will not go below ten, and nothing in this country can set it back to nothing.§!"
 CAN_blood_tax_compact_holds_tt:0 "§GThe Compact holds.§! The undertaking of 1917 was given to the whole country, and the Military Service Act cannot be charged against it. §YNo draw is made.§!"
 CAN_blood_tax_compact_halves_tt:0 "§GThe Compact of 1917 is still remembered§!, and it halves what this costs the country."
 CAN_blood_tax_battalions_temper_tt:0 "§GBattalions were raised under officers of their own§!, and every draw since has been the lighter for it."

 # --- paliers ---------------------------------------------------------------
 CAN_bt_tier_1:0 "A Question Not Yet Asked"
 CAN_bt_tier_2:0 "The Blood Tax Debated"
 CAN_bt_tier_3:0 "Two Recruiting Countries"
 CAN_bt_tier_4:0 "The Compact Strained"
 CAN_bt_tier_5:0 "The Compact Repudiated"
 CAN_bt_tier_6:0 "An Obstacle to the Union"

 # --- causes : tirages ------------------------------------------------------
 CAN_bt_cause_0:0 "nothing yet set down against the account"
 CAN_bt_cause_1:0 "the Order-in-Council of 13 October 1899, which sent a contingent to South Africa without a vote of the Commons"
 CAN_bt_cause_2:0 "Paardeberg, February 1900 - thirty-one dead, and two memories of the same feat of arms"
 CAN_bt_cause_3:0 "the school clause of the Autonomy Bills, rewritten by Mr Sifton and assented to on 20 July 1905"
 CAN_bt_cause_4:0 "Regulation 17, the circular of 25 June 1912"
 CAN_bt_cause_5:0 "the Naval Aid Bill of 5 December 1912, carried under closure after Mr Monk resigned"
 CAN_bt_cause_6:0 "the King's declaration of war, 4 August 1914 - there was no box marked refuse"
 CAN_bt_cause_7:0 "the New Year proclamation of 1916, calling for five hundred thousand men"
 CAN_bt_cause_8:0 "the Military Service Act, assented to on 29 August 1917"
 CAN_bt_cause_9:0 "the War-time Elections Act of 20 September 1917"
 CAN_bt_cause_10:0 "Easter in Quebec City, 28 March to 1 April 1918 - the troops in the streets, and four civilians dead"
 CAN_bt_cause_11:0 "the Order-in-Council of 20 April 1918, cancelling the exemptions of the farmers' sons"
 CAN_bt_cause_12:0 "the Chanak telegram of 16 September 1922, and the answer: Ready, Aye, Ready"
 CAN_bt_cause_13:0 "the Imperial Bloc, and the refusal of the Balfour report"
 CAN_bt_cause_14:0 "the Air Training Plan of 17 December 1939 - the Dominion pays near three-quarters of the account"
 CAN_bt_cause_15:0 "the National Resources Mobilization Act of 21 June 1940"
 CAN_bt_cause_16:0 "the internment of Mayor Houde, 5 August 1940, without charge and without trial"
 CAN_bt_cause_17:0 "the plebiscite of 27 April 1942 - the country released the government, and Quebec did not"
 CAN_bt_cause_18:0 "Bill 80, July 1942, and the resignation of Mr Cardin"
 CAN_bt_cause_19:0 "the sixteen thousand, ordered overseas on 23 November 1944"
 CAN_bt_cause_20:0 "home defence men sent beyond this continent"
 CAN_bt_cause_32:0 "not necessarily conscription, but conscription if necessary - the levy of November 1944"
 CAN_bt_cause_33:0 "the Assembly has spoken, and the province is a standing charge upon the Treasury"
 CAN_bt_cause_34:0 "the province governed from Ottawa, and the reckoning only deferred"

 # --- causes : remboursements ----------------------------------------------
 CAN_bt_cause_21:0 "French-Canadian battalions raised under officers of their own"
 CAN_bt_cause_22:0 "the compromise on bilingual schools, Ontario, 1927"
 CAN_bt_cause_23:0 "the Voluntary Compact of 1917"
 CAN_bt_cause_24:0 "a declaration of war of our own, September 1939"
 CAN_bt_cause_25:0 "the pledge of no conscription, kept"
 CAN_bt_cause_26:0 "a Quebec lieutenant at the Cabinet table"
 CAN_bt_cause_27:0 "Uncle Louis, and the convention of 7 August 1948"
 CAN_bt_cause_28:0 "years of peace, and nothing asked of the country"
 CAN_bt_cause_29:0 "a word from the lieutenant"
 CAN_bt_cause_30:0 "public works for the district"
 CAN_bt_cause_31:0 "the compact conceded"
 CAN_bt_relief_none:0 "nothing has yet been given back"

 ##################################################################
 ### starting national ideas
 ##################################################################

 CAN_idea_dominion_without_a_foreign_office_4:0 "Dominion Without a Foreign Office"
 CAN_idea_dominion_without_a_foreign_office_4_desc:0 "The Dominion has no foreign office, no minister charged with external affairs and no servant of its own in any foreign capital. What passes between Ottawa and Washington passes through the British Embassy; what passes between Ottawa and anyone else passes through the Colonial Office. Sir Wilfrid may protest. He may not sign."

 CAN_idea_dominion_without_a_foreign_office_3:0 "Dominion Without a Foreign Office"
 CAN_idea_dominion_without_a_foreign_office_3_desc:0 "A Department of External Affairs now exists, in three rooms above a barber shop on Bank Street, with a staff that can be counted on one hand. It files, it forwards and it advises. It still cannot put a Canadian name at the foot of a treaty."

 CAN_idea_dominion_without_a_foreign_office_2:0 "Dominion Without a Foreign Office"
 CAN_idea_dominion_without_a_foreign_office_2_desc:0 "Ottawa is told before London acts, which is not at all the same thing as being asked. A seat at the Committee of Imperial Defence has been granted without a vote attached to it, and our weight abroad remains that of a colony which has learned to write letters."

 CAN_idea_dominion_without_a_foreign_office_1:0 "Dominion Without a Foreign Office"
 CAN_idea_dominion_without_a_foreign_office_1_desc:0 "Canada sits at the interallied conferences in her own name and is bound by what is signed there. She is a party to the settlement and not a signatory of it: the pen is still held by the Empire, and the Foreign Office is confident that it always will be."

 CAN_idea_colonial_deference_3:0 "Colonial Deference"
 CAN_idea_colonial_deference_3_desc:0 "When the King is at war, Canada is at war. The Dominion has no means of declining a call to arms and no standing to ask what the war is for. The Governor General is the agent of the government of the United Kingdom before he is anything at all to the Cabinet he advises."

 CAN_idea_colonial_deference_2:0 "Colonial Deference"
 CAN_idea_colonial_deference_2_desc:0 "Canada may now decline a call to arms without disgrace, having spent three years at Geneva arguing that Article X binds a country which never voted for it. The rule is broken. The habit outlives it."

 CAN_idea_colonial_deference_1:0 "Colonial Deference"
 CAN_idea_colonial_deference_1_desc:0 "No expeditionary force leaves the Dominion until the House has voted it. Parliament will decide - a sentence which means nothing at all until the day it means everything."

 CAN_idea_dominion_subordination_2:0 "Dominion Subordination"
 CAN_idea_dominion_subordination_2_desc:0 "A Canadian statute repugnant to an Imperial Act is void to the extent of the repugnance. We legislate at the pleasure of Westminster, we cannot legislate one mile beyond our own shores, and we sign no commercial treaty that London has not signed first. War is declared for us in language we did not draft."

 CAN_idea_dominion_subordination_1:0 "Dominion Subordination"
 CAN_idea_dominion_subordination_1_desc:0 "The Colonial Laws Validity Act no longer touches the statutes we pass from this day forward. Everything passed before it, and the Constitution itself, remains in the keeping of Westminster - at our own request, because the provinces cannot agree upon how to amend what they will not surrender."

 CAN_idea_subjects_of_the_crown:0 "Subjects of the Crown"
 CAN_idea_subjects_of_the_crown_desc:0 "There is no Canadian nationality. A man born at Trois-Rivières and a man landed last week at Halifax are both British subjects resident in Canada, and the difference between them is whatever the Order-in-Council of the day declares it to be. A subject may be deported by order; a newcomer may never quite arrive."

 CAN_idea_appeals_lie_to_london:0 "Appeals Lie to London"
 CAN_idea_appeals_lie_to_london_desc:0 "The Judicial Committee of the Privy Council is the court of last resort for the Dominion. Five law lords in Downing Street, most of whom have never crossed the Atlantic, decide what the British North America Act permits Ottawa to do - and for fifty years they have read it as narrowly as the provinces could wish."

 CAN_idea_no_central_bank:0 "No Central Bank"
 CAN_idea_no_central_bank_desc:0 "The Dominion has no bank of issue. Currency is the affair of the chartered banks, and the Department of Finance improvises the remainder with Dominion notes and the good will of St James Street. To borrow for a war is to ask London first and New York second, upon terms set in both places and in neither of them by us."

 CAN_idea_colonial_defence_establishment_3:0 "Colonial Defence Establishment"
 CAN_idea_colonial_defence_establishment_3_desc:0 "The forces of the Dominion exist to hold the ground until the Imperial forces arrive. Doctrine, drill books, ammunition patterns and ship drawings all come from the War Office and the Admiralty, and whatever is learned here is written down as nobody's."

 CAN_idea_colonial_defence_establishment_2:0 "Colonial Defence Establishment"
 CAN_idea_colonial_defence_establishment_2_desc:0 "Four divisions took a ridge which the professionals of the Empire had twice failed to take, and for the first time the lesson has been written down in Canadian handwriting. The pattern books are still printed in London."

 CAN_idea_colonial_defence_establishment_1:0 "Colonial Defence Establishment"
 CAN_idea_colonial_defence_establishment_1_desc:0 "The staff is our own, the plans are our own, and the Department of National Defence answers to a Canadian minister. The drawings for a destroyer, and the specification of every round it fires, still arrive from the Admiralty by mail."

 CAN_idea_a_militia_not_an_army:0 "A Militia, Not an Army"
 CAN_idea_a_militia_not_an_army_desc:0 "Canada keeps a Permanent Force of a few thousand men and a Non-Permanent Active Militia of farmers, clerks and schoolmasters who drill twelve days a year in armouries built for parades. There is no army in this country, and no government has ever asked the Militia Department to raise one."

 CAN_idea_british_officer_commanding:0 "British Officer Commanding"
 CAN_idea_british_officer_commanding_desc:0 "The General Officer Commanding the Militia is a British regular sent out for a term, answerable to the War Office quite as much as to the Minister of Militia and Defence. Three have now quarrelled with Ottawa and been recalled. No Canadian may hold the appointment, and every Canadian officer knows exactly how far he may rise."

 CAN_idea_no_air_service_of_our_own_2:0 "No Air Service of Our Own"
 CAN_idea_no_air_service_of_our_own_2_desc:0 "Canadians who wish to fly enlist in the Royal Flying Corps and are trained, paid, promoted and buried by the Imperial authorities. The Dominion has no air service, no aerodrome of its own, and no officer in Ottawa whose business is aviation."

 CAN_idea_no_air_service_of_our_own_1:0 "No Air Service of Our Own"
 CAN_idea_no_air_service_of_our_own_1_desc:0 "An Air Board sits in Ottawa with a few dozen machines from the Imperial Gift, carrying the mail, dusting the forests and photographing the bush. It keeps a handful of pilots in practice and a smaller handful of mechanics in work. It is a civil department, and it is not a service."

 CAN_idea_no_fleet_of_our_own_2:0 "No Fleet of Our Own"
 CAN_idea_no_fleet_of_our_own_2_desc:0 "The Dominion owns two fisheries protection cruisers, and the Royal Navy owns the Atlantic. Every convoy, every cable and every port upon which the country depends is guarded by ships that Ottawa neither builds, mans, pays nor commands - and the account for them is presented at every Imperial Conference."

 CAN_idea_no_fleet_of_our_own_1:0 "No Fleet of Our Own (Designs Only)"
 CAN_idea_no_fleet_of_our_own_1_desc:0 "Canada will have ships of her own, and they will be laid down to the drawings of the Admiralty in yards which have never built a warship. The plans are given freely; the experience is not. Every keel is a first attempt."

 CAN_residential_schools:0 "The Residential Schools"
 CAN_residential_schools_desc:0 "By the Indian Act, by treaty and by contract with the churches, Indigenous children are taken from their families and held in schools where their languages are punished and where the rate of death is a matter of departmental correspondence. Dr Peter Bryce, chief medical officer of the Department, will put the figures on paper. The Department will file them."

 CAN_anti_asiatic_agitation:0 "Anti-Asiatic Agitation"
 CAN_anti_asiatic_agitation_desc:0 "A head tax upon every Chinese arrival, a gentlemen's agreement to keep Japanese labour out, and an Asiatic Exclusion League in Vancouver which marches upon Powell Street whenever the agreements are thought too generous. The riot of September 1907 cost the Dominion an indemnity, a royal commission, and no change of policy whatever."

 CAN_regulation_seventeen:0 "Regulation 17"
 CAN_regulation_seventeen_desc:0 "Ontario has confined the teaching of French to the first two years of school, and Quebec reads the circular as proof that the compact of 1867 holds only where English is spoken. Henri Bourassa asks in print whether the Prussians to be fought are those of Berlin or those of Ontario. The recruiting sergeants will settle the account."

 CAN_idea_london_speaks_for_us:0 "London Speaks For Us"
 CAN_idea_london_speaks_for_us_desc:0 "Canada has no quarrel with any country the United Kingdom is not quarrelling with, and no friend the Foreign Office has not chosen for her. The Anglo-Japanese Alliance was renewed without a Canadian being asked, and the Pacific coast learned of it from the newspapers."

 #################################################################
 ##### national ideas the focus tree adds and removes
 #################################################################

 ##### Branch 01 - Imperial autonomy
 CAN_idea_betrayed_at_london:0 "Betrayed at London"
 CAN_idea_betrayed_at_london_desc:0 "The Alaska boundary was settled by a tribunal of six, and the sixth man was the Lord Chief Justice of England. He voted with the Americans. The Dominion learned in a single afternoon what its interests are worth when another country's counsel is paid to argue them, and nothing has ever sharpened a national feeling so quickly as a verdict."
 CAN_idea_imperial_secretariat:0 "The Imperial Secretariat"
 CAN_idea_imperial_secretariat_desc:0 "A permanent staff sits in London to prepare the business of the Imperial Conferences, and the Dominion has a desk in it. The doctrines and the drawings arrive free of charge. So does the habit of waiting for the agenda to be written somewhere else."
 CAN_idea_bound_by_the_undertaking:0 "Bound by the Undertaking"
 CAN_idea_bound_by_the_undertaking_desc:0 "A permanent seat upon the Committee of Imperial Defence was not given away. In exchange Ottawa has undertaken that when the King is at war, Canada is at war, from the same hour and without a division of the House."
 CAN_idea_the_bill_presented_early:0 "The Bill Presented Early"
 CAN_idea_the_bill_presented_early_desc:0 "Ottawa asked for its constitutional settlement in the middle of the war rather than after it. London has answered by remembering, on every subsequent invoice, precisely who asked and when."
 CAN_idea_contracts_from_london:0 "Contracts from London"
 CAN_idea_contracts_from_london_desc:0 "The orders come from the Ministry of Munitions, the drawings from the Admiralty, and the cruisers on loan fly the White Ensign. It is an admirable arrangement for a country that has decided not to have arrangements of its own."
 CAN_idea_the_imperial_bloc:0 "The Imperial Bloc"
 CAN_idea_the_imperial_bloc_desc:0 "One Empire, one defence, one foreign policy. Doctrines, templates and licences are granted freely and in perpetuity, a squadron of the Royal Navy lies at Halifax, and the Dominion is at war whenever London is. There is no longer any question to settle, which is the whole of the gain and the whole of the cost."
 CAN_idea_the_blood_tax_renewed:0 "The Blood Tax Renewed"
 CAN_idea_the_blood_tax_renewed_desc:0 "Ready, aye, ready. The words were meant to reassure the Empire. In Quebec they have been heard as a promise to conscript, made a second time by the men who made it once before."
 CAN_idea_no_automatic_commitments:0 "No Automatic Commitments"
 CAN_idea_no_automatic_commitments_desc:0 "Parliament will not be informed that it is already at war. A call to arms from the head of the alliance may be declined without apology and without loss of standing, and one day it will be."
 CAN_idea_no_commitments_in_advance:0 "No Commitments in Advance"
 CAN_idea_no_commitments_in_advance_desc:0 "The government undertakes nothing it has not been asked to undertake, and it asks the House first. It is a policy that holds the country together and keeps the army very small."
 CAN_idea_fireproof_house:0 "A Fireproof House"
 CAN_idea_fireproof_house_desc:0 "Senator Dandurand told Geneva that Canada lives in a fireproof house, far from inflammable materials. The Assembly laughed at him. Ottawa has governed on that assumption ever since."
 CAN_idea_no_amending_formula:0 "No Amending Formula"
 CAN_idea_no_amending_formula_desc:0 "The British North America Act is a statute of the Parliament at Westminster and only Westminster may amend it. Every constitutional question therefore begins with a voyage and ends with a petition."
 CAN_idea_a_constitution_imposed:0 "A Constitution Imposed"
 CAN_idea_a_constitution_imposed_desc:0 "The constitution has come home without the consent of every province that must live under it. Ontario is offended. Quebec is a good deal worse than offended, and says so in the only language it trusts on the subject."
 CAN_idea_sanctions_and_their_price:0 "Sanctions and Their Price"
 CAN_idea_sanctions_and_their_price_desc:0 "Canada has voted for the embargo and will be counted among those who pressed it hardest. Collective security is a real instrument in the hands of a middle-sized country. It is also a list of governments that now remember our name."
 CAN_idea_the_pledge_broken:0 "The Pledge Broken"
 CAN_idea_the_pledge_broken_desc:0 "The government stood in the House and gave its word. It has now marched without asking, and the word is the second casualty of the war."
 CAN_idea_dominion_sovereignty:0 "Dominion Sovereignty"
 CAN_idea_dominion_sovereignty_desc:0 "Canada stood outside the war for seven days in order to enter it by her own vote. The seven days cost a great deal and purchased the one thing that could not be purchased in any other way."
 CAN_idea_the_pledge_kept:0 "The Pledge Kept"
 CAN_idea_the_pledge_kept_desc:0 "No man will be sent overseas against his will, because no man will be sent overseas at all. The promise of 1939 stands unbroken and the country stands whole, which is more than can be said for the last time."
 CAN_idea_armed_neutrality_of_north_america:0 "Armed Neutrality of North America"
 CAN_idea_armed_neutrality_of_north_america_desc:0 "The Dominion will defend this continent and no other. The plants turn back to civil work, the training plan is cancelled, the British orders lapse, and the Atlantic becomes somebody else's ocean."
 CAN_idea_terms_of_union:0 "Terms of Union"
 CAN_idea_terms_of_union_desc:0 "Newfoundland enters with its debts, its railway, its fishery and its poverty. The Terms of Union were generous because nothing less would have carried the second referendum."
 CAN_idea_a_citizenship_for_all:0 "A Citizenship for All"
 CAN_idea_a_citizenship_for_all_desc:0 "From the first day of 1947 there is such a thing as a Canadian citizen, and the register admits every person born or naturalised here without qualification of any kind. It is a short Act and it took fifty years."
 CAN_idea_a_citizenship_for_all_reduced:0 "A Citizenship for Some"
 CAN_idea_a_citizenship_for_all_reduced_desc:0 "There is a Canadian citizenship at last. The orders-in-council of the war years still stand upon the statute book, and the register still knows perfectly well who was interned and who was told to leave."
 CAN_idea_alone_on_the_rim:0 "Alone on the Rim"
 CAN_idea_alone_on_the_rim_desc:0 "No alliance, no licence, no obligation. The Dominion keeps its own counsel along a very long coast, and the Arctic is a great deal larger when nobody else is watching it for us."
 CAN_idea_alone_on_the_rim_ii:0 "Alone on the Rim"
 CAN_idea_alone_on_the_rim_ii_desc:0 "The isolation is now complete. No treaty binds us and no market is certain, the northern approaches are patrolled by whoever cares to patrol them, and the Dominion answers every sovereignty question by itself."
 CAN_idea_middle_power:0 "A Middle Power"
 CAN_idea_middle_power_desc:0 "Canada is not a great power and has stopped pretending to be a small one. A country is entitled to a voice in proportion to what it actually contributes, and this one has contributed the fourth industry among the Allies."
 CAN_idea_middle_power_encumbered:0 "A Middle Power, Encumbered"
 CAN_idea_middle_power_encumbered_desc:0 "The standing is granted, and so is the file. A delegation that has interned its own citizens, packed its own Senate or buried its own reports argues for the rights of small nations with a certain caution."

 ##### Branch 01 and 09 - encumbrances that exist only to be removed
 CAN_idea_imperial_consultation_required:0 "Imperial Consultation Required"
 CAN_idea_imperial_consultation_required_desc:0 "No negotiation may be opened with a foreign government without the concurrence of the Foreign Office. The Dominion may state its case, provided somebody in Whitehall agrees to carry it."
 CAN_idea_league_obligations:0 "League Obligations"
 CAN_idea_league_obligations_desc:0 "Article X binds every member to preserve the territorial integrity of every other member. Ottawa signed it, has tried to have it struck out at every Assembly since, and remains bound by it."
 CAN_idea_bound_by_imperial_treaties:0 "Bound by Imperial Treaties"
 CAN_idea_bound_by_imperial_treaties_desc:0 "A treaty signed by His Majesty binds His Majesty's dominions. Canada is a party to instruments it has never read, negotiated in cities it has never been invited to."
 CAN_idea_the_governor_generals_reserve_power:0 "The Governor General's Reserve Power"
 CAN_idea_the_governor_generals_reserve_power_desc:0 "The Governor General is the agent of the government in London as well as the representative of the Crown, and he may refuse a dissolution to a first minister who has the confidence of the House."
 CAN_idea_no_mission_abroad:0 "No Mission Abroad"
 CAN_idea_no_mission_abroad_desc:0 "Canadian interests abroad are attended to by British embassies, whose staffs are courteous, competent and entirely uninstructed in what those interests are."
 CAN_idea_a_dominion_does_not_sit:0 "A Dominion Does Not Sit"
 CAN_idea_a_dominion_does_not_sit_desc:0 "Membership of the League was conceded to the dominions; a seat upon its Council was not. Canada votes in the Assembly and reads about the Council in the newspapers."
 CAN_idea_no_standing_to_convene:0 "No Standing to Convene"
 CAN_idea_no_standing_to_convene_desc:0 "Conferences of the great powers are convened by the great powers. Ottawa may offer a hotel, a railway and a citadel, and has never yet been asked to offer an opinion."
 CAN_idea_a_dominion_cannot_annex:0 "A Dominion Cannot Annex"
 CAN_idea_a_dominion_cannot_annex_desc:0 "A dominion has no power to acquire territory. The addition of so much as an island requires an Act at Westminster, and Westminster is not in a hurry."
 CAN_idea_the_atlantic_gap:0 "The Atlantic Gap"
 CAN_idea_the_atlantic_gap_desc:0 "Between Cape Breton and the Grand Banks lies a stretch of ocean that Canada neither owns nor governs, and every convoy out of Halifax crosses it under somebody else's flag."
 CAN_idea_a_pact_of_guns_only:0 "A Pact of Guns Only"
 CAN_idea_a_pact_of_guns_only_desc:0 "The treaty binds the members to defend one another and to do nothing else together. An alliance of guns alone will not outlast the emergency that produced it."
 CAN_idea_occupation_commitments:0 "Occupation Commitments"
 CAN_idea_occupation_commitments_desc:0 "Canadian brigades garrison a corner of a defeated country at Canadian expense, for a period nobody has been willing to specify, under a command that is not Canadian."
 CAN_idea_a_dominion_is_not_a_power:0 "A Dominion Is Not a Power"
 CAN_idea_a_dominion_is_not_a_power_desc:0 "The Dominion supplies the wheat, the aluminium, the aircrew and the escorts, and is informed of the decisions afterwards. Contribution is not the same thing as standing, and the great powers have never confused the two."
 CAN_idea_a_dominion_is_not_a_power_reduced:0 "A Dominion Is Not a Power"
 CAN_idea_a_dominion_is_not_a_power_reduced_desc:0 "A seat upon the Combined Food Board and the Combined Production and Resources Board, and no further. It is not the Combined Chiefs of Staff, but it is a chair with a Canadian name upon it."
 CAN_idea_a_paper_navy:0 "A Paper Navy"
 CAN_idea_a_paper_navy_desc:0 "The Naval Service exists in the estimates, in the Act and in the Royal Naval College. It does not yet exist in the number of men who could take a ship to sea."

 ##### Branch 02 - The interior
 CAN_idea_industrial_conciliation:0 "Industrial Conciliation"
 CAN_idea_industrial_conciliation_desc:0 "A Department of Labour, a deputy minister who reads the files himself, and the settled conviction that most disputes will yield to a conciliator with time and patience. For a while it is even true."
 CAN_idea_crown_lands_reserved:0 "Crown Lands Reserved"
 CAN_idea_crown_lands_reserved_desc:0 "Alberta and Saskatchewan are provinces in every respect except the one that matters on the prairie: their lands, timber, coal and minerals remain the property of the Dominion, held in trust for the purposes of Canada."
 CAN_idea_compulsory_conciliation:0 "Compulsory Conciliation"
 CAN_idea_compulsory_conciliation_desc:0 "No strike may be called in a public utility or a mine until a board has sat and reported. The board sits slowly. That is understood to be the point of the board."
 CAN_idea_organized_labour:0 "Organized Labour"
 CAN_idea_organized_labour_desc:0 "The trades unions are recognised at law and may bargain for their members. Production rises with the men's consent instead of against it, and the government has admitted a second party to the room."
 CAN_idea_section_98:0 "Section 98"
 CAN_idea_section_98_desc:0 "It is an offence to belong to an association that advocates governmental change by force, and the burden of proof lies upon the accused. The section will be used against printers, foreigners and organisers, and it buys the state no lasting peace whatever."
 CAN_idea_the_eight_hour_day:0 "The Eight-Hour Day"
 CAN_idea_the_eight_hour_day_desc:0 "The Mathers Commission travelled the country, heard the men and wrote down what they said. The eight-hour day follows, and so does the bill for it."
 CAN_idea_old_age_pensions:0 "Old Age Pensions"
 CAN_idea_old_age_pensions_desc:0 "Twenty dollars a month at seventy years of age, half paid by Ottawa and half by whichever province will come in. Woodsworth asked for it as the price of his two votes, and got it."
 CAN_idea_modern_welfare_state:0 "A Modern Welfare State"
 CAN_idea_modern_welfare_state_desc:0 "The provinces have consented, so the statutes will survive the courts. It took a fiscal concession to each of nine governments, and it was worth every one of them."
 CAN_idea_the_provincial_compact:0 "The Provincial Compact"
 CAN_idea_the_provincial_compact_desc:0 "Confederation is a compact among the provinces and Ottawa is its creature. Every measure of centralisation must now be bought from nine treasuries before it is bought from the taxpayer."
 CAN_idea_unemployment_insurance:0 "Unemployment Insurance"
 CAN_idea_unemployment_insurance_desc:0 "A contributory fund against the next slump, carried at last by an amendment to the Act. The relief camps close, and the men in them are entered upon a register instead of a train."
 CAN_idea_ottawa_holds_the_purse:0 "Ottawa Holds the Purse"
 CAN_idea_ottawa_holds_the_purse_desc:0 "The provinces rent their income and corporation taxes to the Dominion for the duration and a year beyond. Ottawa promises to give them back. Ottawa has an excellent memory for promises of that kind."
 CAN_idea_cradle_of_the_welfare_state:0 "Cradle of the Welfare State"
 CAN_idea_cradle_of_the_welfare_state_desc:0 "A cheque every month for every child, paid to the mother and not to the father. It is the largest single measure of social policy the Dominion has ever passed, and it is aimed squarely at the next election."
 CAN_idea_industrial_relations_act:0 "The Industrial Relations Act"
 CAN_idea_industrial_relations_act_desc:0 "Compulsory recognition, compulsory bargaining, and a certified union in every plant that votes for one. The general strike passes out of Canadian life, and the grievance procedure takes its place."
 CAN_idea_cultural_sovereignty:0 "Cultural Sovereignty"
 CAN_idea_cultural_sovereignty_desc:0 "Vincent Massey reported that a country which imports all of its opinions will eventually import its politics as well. Ottawa has decided to pay for a national broadcasting service and a national council of the arts, and to say so out loud."
 CAN_idea_industrial_unrest:0 "Industrial Unrest"
 CAN_idea_industrial_unrest_desc:0 "Wages are frozen, prices are not, and the men have counted the difference. There were more days lost to strikes in the munitions plants this year than in any year since the Winnipeg spring."

 ##### Branch 03 - Constitutional rupture and continental alignment
 CAN_idea_imperial_defence_contribution:0 "Imperial Defence Contribution"
 CAN_idea_imperial_defence_contribution_desc:0 "An annual cheque to the Admiralty in place of a fleet. Mr Chamberlain is satisfied, the Royal Navy is a little larger, and the Dominion has bought the right not to think about the sea."
 CAN_idea_autonomist_agitation:0 "Autonomist Agitation"
 CAN_idea_autonomist_agitation_desc:0 "The Ligue nationaliste asks a plain question at every meeting from Quebec to Ottawa: for whose empire, exactly, are Canadians expected to pay? No government has yet produced an answer that survives the asking."
 CAN_idea_bound_by_the_council:0 "Bound by the Council"
 CAN_idea_bound_by_the_council_desc:0 "A permanent seat on the Imperial Council, with a voice in the deliberations and no power to leave the room. Every war declared in London is now a war declared here."
 CAN_idea_the_unratified_line:0 "The Unratified Line"
 CAN_idea_the_unratified_line_desc:0 "Ottawa has refused to ratify the award, and the Lynn Canal boundary remains, in Canadian law, an open question. Washington regards this as absurd and London regards it as ungrateful. Neither of them will sell us a rifle."
 CAN_idea_bypassing_london:0 "Bypassing London"
 CAN_idea_bypassing_london_desc:0 "Canadian ministers now treat directly with the State Department, and the British Ambassador at Washington learns of it from the newspapers. Whitehall has taken the point and is in no hurry with our files."
 CAN_idea_le_devoir:0 "Le Devoir"
 CAN_idea_le_devoir_desc:0 "A daily newspaper of ideas, funded by subscription and beholden to no party. It is read in every presbytery and every college in the province, and it will argue every imperial question for the next forty years."
 CAN_idea_the_referendum_precedent:0 "The Referendum Precedent"
 CAN_idea_the_referendum_precedent_desc:0 "Monk demanded that the country be consulted before the country was committed, and he was given his plebiscite. The precedent is now on the record, and no minister will ever be able to pretend it is not."
 CAN_idea_collective_security:0 "Collective Security"
 CAN_idea_collective_security_desc:0 "Article X is accepted in full. The Dominion guarantees the territorial integrity of every member of the League and will answer any call the Council makes, which is either the foundation of world order or a blank cheque, depending on the decade."
 CAN_idea_continental_market:0 "The Continental Market"
 CAN_idea_continental_market_desc:0 "The tariff wall comes down along the forty-ninth parallel. The natural direction of Canadian trade turns out to run north and south, as the geographers always said it did, and the imperial preference is finished."
 CAN_idea_constitutional_rupture:0 "Constitutional Rupture"
 CAN_idea_constitutional_rupture_desc:0 "Appeals to the Judicial Committee are abolished and the Governor General is reduced to ceremony. Dublin did it first, and Ottawa has followed the drafting closely enough that London recognises its own statute coming back at it."
 CAN_idea_a_continental_understanding:0 "A Continental Understanding"
 CAN_idea_a_continental_understanding_desc:0 "The President said at Kingston that the United States would not stand idly by if Canadian soil were threatened. The Prime Minister answered two days later that Canada would see to it that no enemy reached the United States by this road. Both statements are now policy."
 CAN_idea_no_voice_of_our_own:0 "No Voice of Our Own"
 CAN_idea_no_voice_of_our_own_desc:0 "A common foreign policy for the Empire means, in practice, the foreign policy of the largest partner. Canadian divisions may be asked for and Canadian opinions will be noted."
 CAN_idea_a_country_without_friends:0 "A Country Without Friends"
 CAN_idea_a_country_without_friends_desc:0 "The Republic is proclaimed. The Crown is gone, the Loyalist leagues are drilling in Ontario and the Maritimes, no licence will be sold to us, and every capital that mattered has recalled somebody."
 CAN_idea_occupied_by_our_friends:0 "Occupied by Our Friends"
 CAN_idea_occupied_by_our_friends_desc:0 "Thirty thousand American engineers and soldiers are building a highway, a pipeline and a chain of aerodromes across the North West. They are perfectly friendly. They are also there, and they have not said when they are leaving."
 CAN_idea_imperial_standard:0 "The Imperial Standard"
 CAN_idea_imperial_standard_desc:0 "Ammunition, wireless sets, drill and staff procedure standardised upon the British pattern for good. It is efficient, it is familiar, and it closes the American catalogue for ever."
 CAN_idea_the_49th_state_question:0 "The Forty-Ninth State Question"
 CAN_idea_the_49th_state_question_desc:0 "With free trade in almost everything, the boundary is a line on a map and a queue at a bridge. The newspapers in both countries have begun to ask what remains of the difference, and the answers are getting shorter."
 CAN_idea_continental_drift:0 "Continental Drift"
 CAN_idea_continental_drift_desc:0 "The agreement was ratified by Order-in-Council rather than by an election, because an election would have lost it. The country has been given a continental economy without having been asked for one."
 CAN_idea_a_packed_upper_house:0 "A Packed Upper House"
 CAN_idea_a_packed_upper_house_desc:0 "The Senate rejected the Bill, so the government appointed enough senators to pass it. The Bill is now law and nothing else has been gained, while every constitutional question that follows will be asked in the shadow of this one."
 CAN_idea_a_continental_union:0 "A Continental Union"
 CAN_idea_a_continental_union_desc:0 "A common tariff, a common currency and a common command. What remains is a flag, a parliament and a set of provincial governments with a great deal of time on their hands."

 ##### Branch 04 - The insurgencies
 CAN_idea_an_organized_countryside:0 "An Organized Countryside"
 CAN_idea_an_organized_countryside_desc:0 "The Guide reaches sixty thousand farm kitchens every week and tells them, in plain language and with the figures attached, exactly what the tariff costs a quarter-section. The old parties have no answer that will fit on a page."
 CAN_idea_the_one_big_union:0 "The One Big Union"
 CAN_idea_the_one_big_union_desc:0 "Industry by industry rather than craft by craft, and the general strike as the instrument. The Western Labour Conference has voted for it, and Winnipeg is going to find out what it means before the year is out."
 CAN_idea_the_minority_parliament:0 "The Minority Parliament"
 CAN_idea_the_minority_parliament_desc:0 "Two old parties and a bloc of farmers who will not join either. Nothing passes that has not been bargained for twice, and every division is an election that has not been called yet."
 CAN_idea_progressive_tariff_pressure:0 "Progressive Tariff Pressure"
 CAN_idea_progressive_tariff_pressure_desc:0 "The farm members have extracted their price in the schedules: implements, binder twine and freight. The manufacturers of Ontario have written to the Minister of Finance, at length."
 CAN_idea_the_ginger_group:0 "The Ginger Group"
 CAN_idea_the_ginger_group_desc:0 "A dozen members who would not take the front bench, would not take the whip, and will not take an instruction. They are the most tiresome men in the House and the most consistent."
 CAN_idea_labour_holds_the_balance:0 "Labour Holds the Balance"
 CAN_idea_labour_holds_the_balance_desc:0 "Two labour members hold the government in office and have named their terms: a pension bill, and another one in four years. Mr Woodsworth does not raise his voice, and does not need to."
 CAN_idea_government_by_delegate:0 "Government by Delegate"
 CAN_idea_government_by_delegate_desc:0 "The member is the servant of the constituency association and votes as it instructs. It is the purest democracy ever practised in this country and it makes the ordinary business of government nearly impossible."
 CAN_idea_the_pamphlet_war:0 "The Pamphlet War"
 CAN_idea_the_pamphlet_war_desc:0 "Le Goglu, Le Miroir and Le Chameau, printed cheaply, sold in the taverns and blaming the same people every week. It is nasty, it is small, and it grows with the unemployment figures."
 CAN_idea_the_a_b_theorem:0 "The A Plus B Theorem"
 CAN_idea_the_a_b_theorem_desc:0 "Major Douglas holds that purchasing power is always less than the price of the goods produced, and that the difference must be issued by the state. Trained economists say it is arithmetic nonsense. Sixty-three thousand Albertans have read the pamphlet and prefer it to the economists."
 CAN_idea_the_promise_of_the_dividend:0 "The Promise of the Dividend"
 CAN_idea_the_promise_of_the_dividend_desc:0 "Twenty-five dollars a month to every adult, promised from the platform and believed from the pew. It has not been paid yet. The government has eighteen months before that becomes the only question anyone asks."
 CAN_idea_they_were_in_office:0 "They Were In Office"
 CAN_idea_they_were_in_office_desc:0 "Whoever held power when the price of wheat collapsed will answer for the price of wheat for a generation. It is not fair and it has never once failed to happen."
 CAN_idea_eradication_of_capitalism:0 "Eradication of Capitalism"
 CAN_idea_eradication_of_capitalism_desc:0 "No CCF government will rest content until capitalism has been eradicated and the full programme of socialised planning put into operation. The sentence was written in Regina to be unmistakable, and it has been."
 CAN_idea_eradication_of_capitalism_ii:0 "Eradication of Capitalism"
 CAN_idea_eradication_of_capitalism_ii_desc:0 "The clause stands unamended and the party will make no coalition with anyone. It has kept the faith of the founders and put a ceiling over its own head."
 CAN_idea_the_default_of_1936:0 "The Default of 1936"
 CAN_idea_the_default_of_1936_desc:0 "On the first of April the province failed to meet its bonds, the first government in the Dominion ever to do so. Every lender in London and New York has drawn the appropriate conclusion about Canadian credit generally."
 CAN_idea_the_producers_commonwealth:0 "The Producers' Commonwealth"
 CAN_idea_the_producers_commonwealth_desc:0 "The men who grow the wheat, cut the timber and dig the ore now govern the country, and the country is run for their account. The munitions plants of the east are not part of the account."
 CAN_idea_a_corporate_order:0 "A Corporate Order"
 CAN_idea_a_corporate_order_desc:0 "Employers and workmen in a single chamber for each industry, with strikes abolished by definition rather than by settlement. Industrial peace is complete and industrial output has fallen with it."
 CAN_idea_the_national_unity_party:0 "The National Unity Party"
 CAN_idea_the_national_unity_party_desc:0 "The Montreal, Winnipeg and Toronto groups under one leader, one shirt and one programme. It will never be large. It does not need to be large to make a bilingual country ungovernable."
 CAN_idea_the_national_dividend:0 "The National Dividend"
 CAN_idea_the_national_dividend_desc:0 "The dividend is paid, in certificates, to every adult in the Dominion. Prices have found the money and gone to meet it, the export houses will not touch the paper, and the recipients are nonetheless grateful."
 CAN_idea_a_dominion_without_a_nation:0 "A Dominion Without a Nation"
 CAN_idea_a_dominion_without_a_nation_desc:0 "The corporative state is proclaimed over a country that contains at least two peoples, neither of which asked for it. Two provinces are in open resistance and no government abroad will receive our minister."
 CAN_idea_the_co_operative_commonwealth:0 "The Co-operative Commonwealth"
 CAN_idea_the_co_operative_commonwealth_desc:0 "Banks, transport and the public utilities pass to the Crown, and the Regina programme becomes the law of the Dominion. Capital has left the country by every available exit, and the men who stayed are building hospitals with what remains."

 ##### Branch 05 - The West
 CAN_idea_the_last_best_west:0 "The Last Best West"
 CAN_idea_the_last_best_west_desc:0 "Sifton advertises free homesteads in every language of central Europe and pays his agents by the head. The prairie fills at a rate no country in the world can match, and nobody in Ottawa has asked what those settlers will want when they arrive."
 CAN_idea_foreign_born_west:0 "Men in Sheepskin Coats"
 CAN_idea_foreign_born_west_desc:0 "A stalwart peasant in a sheepskin coat, born on the soil, whose forefathers have been farmers for ten generations. He is the best settler the Dominion has ever had and he did not come here to be conscripted for a European war."
 CAN_idea_a_british_west:0 "A British West"
 CAN_idea_a_british_west_desc:0 "The gates are set for settlers from the British Isles and nowhere else. The prairie will fill more slowly and there will be one language in the schoolhouse when it does."
 CAN_idea_the_dry_belt_under_the_plough:0 "The Dry Belt Under the Plough"
 CAN_idea_the_dry_belt_under_the_plough_desc:0 "Marquis ripens early enough to crop the short seasons, so the plough has gone south into country that Palliser marked as unfit for agriculture. It will grow wheat for twenty good years and then it will blow away."
 CAN_idea_prairie_drought:0 "Prairie Drought"
 CAN_idea_prairie_drought_desc:0 "Eight successive years without rain in the Palliser triangle. The topsoil is in the ditches and on the windowsills, the wells are dry, and the relief trains run east with families who came out in 1908."
 CAN_idea_prairie_drought_relieved:0 "Prairie Drought"
 CAN_idea_prairie_drought_relieved_desc:0 "The shelter belts are planted, the community pastures are back in grass and the dugouts hold water into August. The drought has not broken, but it is no longer carrying the province away."
 CAN_idea_railway_overbuild_1:0 "Railway Overbuild"
 CAN_idea_railway_overbuild_1_desc:0 "One transcontinental more than the traffic will bear, built on guarantees the Dominion has signed. The interest falls due whether the freight moves or not."
 CAN_idea_railway_overbuild_2:0 "Railway Overbuild"
 CAN_idea_railway_overbuild_2_desc:0 "Two transcontinentals more than the country can fill, competing for the same wheat over the same passes. The guarantees are now a standing charge upon the estimates."
 CAN_idea_railway_overbuild_3:0 "Railway Overbuild"
 CAN_idea_railway_overbuild_3_desc:0 "Three transcontinental railways for six million people. Every mile of it was voted for by acclamation and every mile of it will be paid for by a Parliament that had nothing to do with the decision."
 CAN_idea_transcontinental_debt:0 "Transcontinental Debt"
 CAN_idea_transcontinental_debt_desc:0 "The National Transcontinental was built by the state through the Abitibi at a cost that no estimate survived, and no receiver will ever take it off our hands. This charge does not come off the books. It is what the boom actually cost."
 CAN_idea_freight_rate_grievance:0 "Freight Rate Grievance"
 CAN_idea_freight_rate_grievance_desc:0 "The West buys in a protected market and sells in an open one, and pays the freight both ways. Eight hundred farmers came to Ottawa on the sixteenth of December to say so, and were heard out and sent home."
 CAN_idea_unsold_wheat_mountain:0 "Unsold Wheat Mountain"
 CAN_idea_unsold_wheat_mountain_desc:0 "The record crop of 1928 is still in the elevators, the pools held it for a better price, and the better price is not coming. Every bushel in store is a debt to a bank at Winnipeg, and there are five hundred million of them."
 CAN_idea_terms_of_the_transfer:0 "Terms of the Transfer"
 CAN_idea_terms_of_the_transfer_desc:0 "The prairie provinces receive their lands and resources at last, and Ottawa receives the bill: a subsidy in perpetuity, calculated in compensation for twenty-five years of administering what was never really ours."
 CAN_idea_alberta_defies_ottawa:0 "Alberta Defies Ottawa"
 CAN_idea_alberta_defies_ottawa_desc:0 "The oil is a Crown company's and the Crown is the Dominion's, which is not at all how the matter is understood in Edmonton. The province has begun to speak of its resources in the tone the West reserves for the tariff."

 ##### Branch 06 - Industry and finance
 CAN_idea_iron_and_steel_bounties:0 "Iron and Steel Bounties"
 CAN_idea_iron_and_steel_bounties_desc:0 "A bounty on every ton of pig iron and steel made from Canadian ore, paid from the Treasury until the industry can stand alone. Sydney and Hamilton have taken the money and built the furnaces."
 CAN_idea_power_at_cost:0 "Power at Cost"
 CAN_idea_power_at_cost_desc:0 "Adam Beck has carried his commission and the falls belong to the municipalities. Current is sold at what it costs to generate and deliver, and every manufacturer in the province has noticed."
 CAN_idea_power_at_the_market_price:0 "Power at the Market Price"
 CAN_idea_power_at_the_market_price_desc:0 "The syndicate has the charter, the falls and the rate book. The plants go up quickly because the capital is impatient, and the current will be sold at whatever the traffic will bear for the next forty years."
 CAN_idea_a_ministry_of_our_own:0 "A Ministry of Our Own"
 CAN_idea_a_ministry_of_our_own_desc:0 "Shells will be ordered by a Canadian minister answerable to the Canadian House, made in Canadian plants, and not one of them will be transferred to another government's account."
 CAN_idea_flavelles_board:0 "Flavelle's Board"
 CAN_idea_flavelles_board_desc:0 "Sir Joseph Flavelle runs the largest business in the Empire out of an office in Ottawa, and runs it superbly. The plants are British property, the contracts are British, and a third of everything made goes across the Atlantic each month."
 CAN_idea_the_dominion_owns_the_deficit:0 "The Dominion Owns the Deficit"
 CAN_idea_the_dominion_owns_the_deficit_desc:0 "The bankrupt roads have been gathered into a single national system, which is to say the Dominion has purchased the losses and left the shareholders whole. The deficit is now a line in the estimates and will be for thirty years."
 CAN_idea_the_dominion_owns_the_deficit_reduced:0 "The Dominion Owns the Deficit"
 CAN_idea_the_dominion_owns_the_deficit_reduced_desc:0 "With a central bank behind it the railway debt can at least be funded at a decent rate. It is still there. It is merely no longer an emergency every March."
 CAN_idea_the_bank_of_canada:0 "The Bank of Canada"
 CAN_idea_the_bank_of_canada_desc:0 "A central bank, a Canadian note issue and a governor who can be sent for. Ottawa has stopped borrowing its monetary policy from Threadneedle Street and Wall Street in alternate years."
 CAN_idea_the_bankers_charter:0 "The Bankers' Charter"
 CAN_idea_the_bankers_charter_desc:0 "The Bank is incorporated with private shareholders, as the Act of 1934 provides, and the chartered banks of Montreal and Toronto hold the stock. The governor is independent of the government and rather less independent of the board."
 CAN_idea_state_credit:0 "State Credit"
 CAN_idea_state_credit_desc:0 "The shares are bought out and the Bank belongs to the Crown. Credit is now an instrument of policy rather than a favour granted by St James Street, and the country will find out what that is worth."
 CAN_idea_the_american_dollar_gap:0 "The American Dollar Gap"
 CAN_idea_the_american_dollar_gap_desc:0 "We buy our components in the United States for dollars and sell our output to Britain for sterling that cannot be converted. Every month of successful war production makes the exchange position worse."
 CAN_idea_the_american_dollar_gap_2:0 "The American Dollar Gap"
 CAN_idea_the_american_dollar_gap_2_desc:0 "The reserve has fallen again. The Dominion is producing magnificently and running out of the one currency in which its suppliers insist upon being paid."
 CAN_idea_the_american_dollar_gap_3:0 "The American Dollar Gap"
 CAN_idea_the_american_dollar_gap_3_desc:0 "The gap is now the central fact of the war economy. Exchange control, gold shipments and the sale of Canadian holdings in the United States have all been tried, and the arithmetic has not moved."
 CAN_idea_continental_production:0 "Continental Production"
 CAN_idea_continental_production_desc:0 "Each country will produce what it is best fitted to produce and buy the rest across the line, and American components in British orders will be charged to Lend-Lease. The dollar problem disappears in an afternoon at Hyde Park."
 CAN_idea_continental_production_strained:0 "Continental Production"
 CAN_idea_continental_production_strained_desc:0 "The arrangement rests entirely upon American goodwill, and American goodwill has cooled. The components are slower coming, the priorities are set in Washington, and our plants are waiting."
 CAN_idea_arsenal_of_the_commonwealth:0 "Arsenal of the Commonwealth"
 CAN_idea_arsenal_of_the_commonwealth_desc:0 "A billion dollars given outright, with no interest, no repayment and no conditions. Britain can go on ordering, the plants stay full, and the dollar gap is now entirely our own affair."
 CAN_idea_the_controller_of_everything:0 "The Controller of Everything"
 CAN_idea_the_controller_of_everything_desc:0 "Mr Howe was asked in the House whether there was any limit to his powers under the Act and replied that he had not found one. Munitions and Supply builds what it likes, where it likes, and asks Parliament afterwards."
 CAN_idea_crown_corporations:0 "Crown Corporations"
 CAN_idea_crown_corporations_desc:0 "Twenty-eight companies incorporated by the Crown to do what no private firm would undertake at the price. Synthetic rubber, radar, uranium and cargo ships, and every one of them will have to be disposed of when the war ends."
 CAN_idea_fourth_arsenal_of_the_united_nations:0 "Fourth Arsenal of the United Nations"
 CAN_idea_fourth_arsenal_of_the_united_nations_desc:0 "Fourth among the Allies in production, from a standing start and a population of eleven millions. The country that could not make its own rifles in 1914 is fitting out other people's armies."
 CAN_idea_the_fear_of_1919:0 "The Fear of 1919"
 CAN_idea_the_fear_of_1919_desc:0 "Every economist in Ottawa expects the slump that followed the last war to follow this one, and industry is holding back its investment until it knows. The fear is doing more damage than the slump would."

 ##### Branch 07 - Army
 CAN_idea_improvised_mobilization:0 "Improvised Mobilization"
 CAN_idea_improvised_mobilization_desc:0 "Thirty thousand men were assembled at Valcartier in six weeks by a minister who tore up the mobilization plan and telegraphed the militia colonels directly. It worked, and nothing about it can be repeated."
 CAN_idea_birth_of_a_nation:0 "Birth of a Nation"
 CAN_idea_birth_of_a_nation_desc:0 "Four divisions of the Canadian Corps attacked the ridge together, on a plan of their own making, and took in a morning what two armies had failed to take in two years. Men who went up as Nova Scotians and Albertans came down as Canadians."
 CAN_idea_the_crisis_of_1917:0 "The Crisis of 1917"
 CAN_idea_the_crisis_of_1917_desc:0 "The Military Service Act is law and the country has split along the line everybody knew was there. There are riots in Quebec City at Easter and the Act will not produce, in the end, one division of infantry."
 CAN_idea_the_compact_of_1917:0 "The Compact of 1917"
 CAN_idea_the_compact_of_1917_desc:0 "The war will be fought by those who volunteer for it and by no one else. The reinforcements will be thin, the divisions overseas will be capped, and the Dominion will come out of this war in one piece."
 CAN_idea_peace_dividend:0 "Peace Dividend"
 CAN_idea_peace_dividend_desc:0 "One Department of National Defence, one staff, one estimate, and a saving to the Treasury that every finance minister will now defend as a matter of principle. The Permanent Force is four thousand men, the schools are closed, and the officers who remain are drawing plans nobody will read for sixteen years."
 CAN_idea_no_plan_for_a_field_force:0 "No Plan for a Field Force"
 CAN_idea_no_plan_for_a_field_force_desc:0 "The joint staff exists, the coast defences are manned, and there is no scheme whatever for putting a corps into another continent. That was the decision, and it was taken deliberately."
 CAN_idea_the_ghost_of_1917:0 "The Ghost of 1917"
 CAN_idea_the_ghost_of_1917_desc:0 "A field force for overseas has been authorised in peacetime, and every man in the House knows what a field force overseas leads to. The word has not been used and does not need to be."
 CAN_idea_one_time_levy:0 "A Single Levy"
 CAN_idea_one_time_levy_desc:0 "Sixteen thousand men, once, and no more. The government has conscripted the smallest number that could be described in the House as a measure, and hopes the war ends before anyone asks for the next one."
 CAN_idea_battalions_at_half_strength:0 "Battalions at Half Strength"
 CAN_idea_battalions_at_half_strength_desc:0 "The rifle companies in Italy and the Scheldt are at two thirds and falling, and the reinforcement depots in England are empty. The pledge has been kept and the infantry is paying for it by name."
 CAN_idea_the_pledge_of_no_conscription:0 "The Pledge of No Conscription"
 CAN_idea_the_pledge_of_no_conscription_desc:0 "Not necessarily conscription, but conscription if necessary. The government has given its word in both languages, and every month it keeps that word buys back a little of what 1917 destroyed."
 CAN_idea_lessons_of_dieppe:0 "Lessons of Dieppe"
 CAN_idea_lessons_of_dieppe_desc:0 "Nine hundred dead and nineteen hundred prisoners in nine hours, on a shingle beach in front of a town nobody needed. Every doctrine of amphibious assault written since has been paid for with the Second Division."

 ##### Branch 08 - Air force
 CAN_idea_civil_government_air_operations:0 "Civil Government Air Operations"
 CAN_idea_civil_government_air_operations_desc:0 "The air force spends its flying hours on forestry patrols, aerial photography, mail and the pursuit of rum runners. It is useful work, it is paid for by other departments, and it is not an air force."
 CAN_idea_civil_government_air_operations_surveying:0 "Civil Government Air Operations"
 CAN_idea_civil_government_air_operations_surveying_desc:0 "The survey has mapped a million square miles of the North and the aircraft have the range to prove it. Not one pilot on the establishment has fired a gun from the air."
 CAN_idea_aerodromes_without_aircraft:0 "Aerodromes Without Aircraft"
 CAN_idea_aerodromes_without_aircraft_desc:0 "A chain of lighted fields and wireless beacons from Halifax to Vancouver, built by relief labour and handed to a civil airline. The Service has the finest ground organisation in the Empire and almost nothing to put on it."
 CAN_idea_the_aerodrome_of_democracy:0 "The Aerodrome of Democracy"
 CAN_idea_the_aerodrome_of_democracy_desc:0 "The President called Canada the aerodrome of democracy and the phrase has stuck because it is exact. A hundred and thirty thousand aircrew will be trained on this soil, under Canadian command, for every air force in the Commonwealth."
 CAN_idea_trained_for_another_flag:0 "Trained for Another Flag"
 CAN_idea_trained_for_another_flag_desc:0 "The schools are on Canadian ground, the fuel and the food are Canadian, and the graduates are posted to Royal Air Force squadrons by an office in London. Britain pays the bill and takes the aircrew."
 CAN_idea_airframes_for_the_plan:0 "Airframes for the Plan"
 CAN_idea_airframes_for_the_plan_desc:0 "Anson fuselages built under licence in furniture factories and railway shops, because the British could no longer spare a single trainer. It is not glamorous production and the plan cannot run without it."
 CAN_idea_home_war_establishment:0 "The Home War Establishment"
 CAN_idea_home_war_establishment_desc:0 "Squadrons held on this side of the ocean for the defence of the coasts and the convoy routes, by a decision of the Cabinet that will not be revisited. They are among the best-trained maritime squadrons in the world and they will not be leaving."
 CAN_idea_the_price_of_six_group:0 "The Price of Six Group"
 CAN_idea_the_price_of_six_group_desc:0 "A Canadian bomber group with Canadian stations, Canadian commanders and a Canadian casualty list. The Dominion pays for its own aerodromes in Yorkshire and reads its own losses in the morning returns."
 CAN_idea_fourth_air_force_in_the_world:0 "Fourth Air Force in the World"
 CAN_idea_fourth_air_force_in_the_world_desc:0 "Squadrons of our own, a group of our own, aircrew of our own and the fourth air force on earth. In 1922 the whole establishment was sixty-two officers and a photographic section."
 CAN_idea_a_training_command_and_nothing_more:0 "A Training Command and Nothing More"
 CAN_idea_a_training_command_and_nothing_more_desc:0 "We trained more aircrew than any other country in the alliance and posted almost all of them to somebody else's squadrons. The schools are magnificent. There is nothing behind them."
 CAN_idea_a_bar_in_the_regulations:0 "A Bar in the Regulations"
 CAN_idea_a_bar_in_the_regulations_desc:0 "Candidates for aircrew must be of pure European descent. The words are printed in the regulations of a service that is short of men, and they will be quietly removed when the shortage becomes acute enough."

 ##### Branch 09 - Navy
 CAN_idea_the_tin_pot_navy:0 "The Tin-Pot Navy"
 CAN_idea_the_tin_pot_navy_desc:0 "Two elderly cruisers bought from the Admiralty, a college at Halifax and a service that the Opposition has christened the tin-pot navy in both official languages. It is a beginning, and it is being laughed at from both directions at once."
 CAN_idea_built_here_and_slowly:0 "Built Here, and Slowly"
 CAN_idea_built_here_and_slowly_desc:0 "The hulls will be laid down at Halifax and at Vickers in Montreal, by yards that have never built a warship and by men who are learning as they rivet. It will take years longer and the trade will stay in the country."
 CAN_idea_contribution_in_lieu_of_a_fleet:0 "Contribution in Lieu of a Fleet"
 CAN_idea_contribution_in_lieu_of_a_fleet_desc:0 "Thirty-five millions for three dreadnoughts, to be built in British yards, manned by British crews and disposed of by the Admiralty. Quebec has understood the proposal perfectly and will not forgive it."
 CAN_idea_the_volunteer_navy:0 "The Volunteer Navy"
 CAN_idea_the_volunteer_navy_desc:0 "A reserve open to men from Regina and Kitchener who have never seen salt water, drilling in armouries a thousand miles from a coast. They will be raw for a long time and there will be a great many of them."
 CAN_idea_green_crews_and_old_sets:0 "Green Crews and Old Sets"
 CAN_idea_green_crews_and_old_sets_desc:0 "Corvettes commissioned faster than crews can be trained, with the oldest asdic and no gyro compass, escorting the slow convoys because nobody else will. The losses in the mid-ocean gap are the arithmetic of that decision."
 CAN_idea_radar_hf_df_and_time_to_train:0 "Radar, HF/DF and Time to Train"
 CAN_idea_radar_hf_df_and_time_to_train_desc:0 "The groups have come off the run for six months to refit and work up: modern radar, high-frequency direction finding and a full training establishment at Halifax. It cost half a year of escort strength and it is the reason the escorts now find the boats first."
 CAN_idea_a_fleet_worth_the_name:0 "A Fleet Worth the Name"
 CAN_idea_a_fleet_worth_the_name_desc:0 "A light fleet carrier, cruisers and a balanced squadron under the Canadian ensign. It is more navy than the country has ever had and more navy than the country has ever been asked to pay for in peacetime."
 CAN_idea_the_north_atlantic_trade:0 "The North Atlantic Trade"
 CAN_idea_the_north_atlantic_trade_desc:0 "The largest escort force in the world after the two great navies, built for one ocean and one task. It cannot fight a fleet action and it has never once needed to."
 CAN_the_massey_commission_tt_rest:0 "In addition: the broadcasting and federal university decisions are opened, and the Dominion begins to pay for what it has always imported."
 CAN_a_constitution_of_our_own_tt_rest:0 "In addition: §Gcentralizing focuses are completed a quarter faster§!, and §Rcompliance falls in Quebec and Ontario for two years§!. The undertaking costs less where the provinces have already been accommodated."
 CAN_a_continental_union_tt_rest:0 "In addition: §Gno garrison is required anywhere in North America§!. §RThe American faction is permanent, and middle power standing is closed for good.§!"
 CAN_patriate_the_court_tt_rest:0 "In addition: §Gstability rises in English Canada§!, and §Rfalls in French Canada, which regarded the Judicial Committee as the guarantor of its rights§!."
 CAN_the_atlantic_pact_tt_rest:0 "In addition: §Gan Atlantic faction is founded or joined, research upon shared doctrine is a tenth faster, and the deployment of brigades to Europe is unlocked§!."
 CAN_the_tenth_province_tt_rest:0 "In addition: §Gseven members in the Commons and six in the Senate§!, and §Rthe island is poor and will cost the Treasury a great deal§!."
 CAN_no_entangling_alliances_tt_rest:0 "In addition: §RArctic sovereignty crises are far more frequent, and middle power standing is closed§!."
 CAN_the_canadian_article_tt_rest:0 "In addition: §Gcivilian construction is more efficient for every member of the alliance, and Canadian influence within it rises by a quarter§!."

 ##### Decisions - The Home Front (common/decisions/CAN_political_decisions.txt)
 CAN_the_relief_camps:0 "The Relief Camps"
 CAN_the_relief_camps_desc:0 "Single homeless men are to be taken off the streets of the cities and placed in camps in the bush, under the Department of National Defence, at twenty cents a day and found. They will cut roads, clear aerodromes and build the airway across the Shield, and they will be a very long way from any place where they might make trouble. The Commissioner of the Royal Canadian Mounted Police has already written that the camps will concentrate exactly the men we would rather see dispersed."
 CAN_the_relief_camps_tt:0 "§GA level of infrastructure is built at once in a Canadian state.§! §RStability falls, communist support grows, and the grievance of organized labour rises. The third intake sends the camps east.§!"
 CAN_on_to_ottawa_ready_tt:0 "§RThe British Columbia camps have emptied. The men are on the boxcars and the trek is moving east: On to Ottawa.§!"

 CAN_blast_a_way_into_the_markets:0 "Blast a Way into the Markets"
 CAN_blast_a_way_into_the_markets_desc:0 "The special session of September 1930 will raise the tariff wall higher than any Parliament has raised it since Confederation, and the Prime Minister has promised in as many words to use it to blast a way into the markets of the world. It is a threat aimed at Washington and it will be read there as one. Whatever comes of the markets, the road to imperial preference at Ottawa in 1932 now runs through this session."
 CAN_blast_a_way_into_the_markets_tt:0 "§GThe tariff wall goes up: political power and stability rise, and the Ottawa Agreements become possible.§! §RAmerican opinion of the Dominion collapses, and the mission to Washington is closed.§!"

 CAN_the_ottawa_arsenal:0 "The Ottawa Arsenal"
 CAN_the_ottawa_arsenal_desc:0 "A Dominion that refused to hand its war orders to an imperial board must fill the shells itself. The plant will be laid out on federal ground and run by a Canadian ministry, and it will be the seed of every ordnance contract this country signs afterwards, including the light machine gun."
 CAN_the_ottawa_arsenal_tt:0 "§GTwo military factories are built at once in Southern Ontario, and the Bren gun contract becomes possible.§!"

 CAN_float_a_victory_loan:0 "Float a Victory Loan"
 CAN_float_a_victory_loan_desc:0 "The first domestic war loan asked the country for fifty millions in November 1915 and was handed a hundred. Until that morning the Dominion had borrowed in London; from that morning it borrows from its own savers, and its own savers will expect to be paid. Bond drives, brass bands and a quota for every county."
 CAN_float_a_victory_loan_tt:0 "§GA great deal of equipment is delivered at once and war support rises.§! §RThe war debt grows by one, and only Fourth Among the Allies can settle it.§!"

 CAN_nationalize_the_bank:0 "Nationalize the Bank"
 CAN_nationalize_the_bank_desc:0 "The Bank of Canada opened in 1935 with its stock in private hands. The Government proposes to buy the majority, and then the remainder, until the central bank belongs to the country whose currency it issues. It is an act of a shareholder, not a project of seventy days, and the City of London will have an opinion about it."
 CAN_nationalize_the_bank_tt:0 "§GThe Bankers Charter is replaced by State Credit, and deficit finance is unlocked.§! §RBritish opinion of the Dominion falls.§!"

 CAN_deficit_finance:0 "Deficit Finance"
 CAN_deficit_finance_desc:0 "With the note issue in public hands the Treasury need not go to a syndicate for permission to build. The plant goes up now and the ledger is settled later, which is precisely the argument that every finance minister since Confederation has been taught to distrust."
 CAN_deficit_finance_tt:0 "§GA civilian factory is built at once.§! §RThe war debt grows by one and stability falls.§!"

 CAN_let_the_bounties_lapse:0 "Let the Bounties Lapse"
 CAN_let_the_bounties_lapse_desc:0 "The federal bounty on iron and steel has been paid by the ton since 1883 and it has built Sydney and Sault Ste. Marie. Letting it run out ends a charge on the Treasury that has outlived its argument. Cape Breton will hear about it before the order-in-council is printed."
 CAN_let_the_bounties_lapse_tt:0 "§GThe standing charge on the Treasury ends.§! §RStability falls, and the eastern steel towns will remember it.§!"

 CAN_the_wartime_prices_and_trade_board:0 "The Wartime Prices and Trade Board"
 CAN_the_wartime_prices_and_trade_board_desc:0 "A general ceiling on prices and a freeze on wages, announced on the eighteenth of October and effective on the first of December, with Donald Gordon at the head of it. No other belligerent has tried to hold the whole price level at once. It will hold, and it will require a clerk in every trade in the country."
 CAN_the_wartime_prices_and_trade_board_tt:0 "§GThe price level is held: stability and war support rise, and rationing is unlocked.§!"

 CAN_ration_gasoline:0 "Ration Gasoline"
 CAN_ration_gasoline_desc:0 "Coupon books by category, an A book for the ordinary motorist and enough for a few miles a week. The country accepts the queue because there is a war on. It accepts it a little less each year the war lasts."
 CAN_ration_gasoline_tt:0 "§GWar support rises: the fuel goes to the services.§! §RStability falls.§!"

 CAN_incorporate_a_crown_company:0 "Incorporate a Crown Company"
 CAN_incorporate_a_crown_company_desc:0 "A letter patent, a board of directors drawn from the trade, and a plant that would not otherwise be built. Victory Aircraft, Federal Aircraft, Research Enterprises, Polymer: twenty-eight of them before the war is out, and the State becomes an industrialist by order-in-council."
 CAN_incorporate_a_crown_company_tt:0 "§GA military factory is built at once.§! §ROne more Crown company for the reconversion to deal with.§!"

 CAN_take_over_eldorado:0 "Take Over Eldorado"
 CAN_take_over_eldorado_desc:0 "The mine at Port Radium on Great Bear Lake and the refinery at Port Hope pass under public control by order-in-council. The ore goes to the Allied programme; the laboratory at Montreal and the plant at Chalk River follow. The Dominion will pay for the science and will not be given a weapon at the end of it."
 CAN_take_over_eldorado_tt:0 "§GA research slot is opened and nuclear research is advanced.§! §RThe ore belongs to the Allied programme, not to Canada.§!"
 CAN_eldorado_bonus:0 "Eldorado Mining and Refining"

 CAN_mutual_aid_appropriation:0 "Mutual Aid Appropriation"
 CAN_mutual_aid_appropriation_desc:0 "The War Appropriation (United Nations Mutual Aid) Act votes a sum and gives the equipment away. No lend, no lease and no invoice: a Dominion of eleven millions hands more than two billions of production to its allies because they cannot pay and the war will not wait."
 CAN_mutual_aid_appropriation_tt:0 "§GA large consignment of equipment is transferred free to an ally at war, and their opinion of the Dominion rises.§! §RThe production leaves the country. The continental route pays double.§!"

 CAN_invoke_section_98:0 "Invoke Section 98"
 CAN_invoke_section_98_desc:0 "Section 98 of the Criminal Code makes membership in an unlawful association an offence, places the burden of proof upon the accused, and defines the association by its purposes rather than its acts. It was written for the winter after Winnipeg and it has never been repealed. The Mounted Police have the names."
 CAN_invoke_section_98_tt:0 "§GCommunist support falls and the authority of the State grows.§! §RThe grievance of labour rises sharply, the debt to civil liberties grows by one, and stability falls. Each further use costs more than the last.§!"

 CAN_repeal_section_98:0 "Repeal Section 98"
 CAN_repeal_section_98_desc:0 "Sixteen years of a section that reverses the burden of proof, and a Parliament at last willing to strike it out. Repeal returns the law to what it was. It does not return anything to the men who were tried under it, and the ledger of civil liberties is not written in pencil."
 CAN_repeal_section_98_tt:0 "§GThe section is struck from the Criminal Code and stability rises.§! §RCommunist support rises, and §Ynot one point of the debt to civil liberties is returned§!.§!"

 CAN_a_province_joins_the_pension:0 "A Province Joins the Pension"
 CAN_a_province_joins_the_pension_desc:0 "Ottawa will pay half of twenty dollars a month to a needy British subject of seventy years, and not a cent until the province signs. British Columbia signed in 1927, Prince Edward Island in 1933, Quebec and New Brunswick in 1936. The old age pension is federal money spent at provincial discretion, which is the shape of every social measure this country will pass for thirty years."
 CAN_a_province_joins_the_pension_tt:0 "§GStability rises. When the ninth province signs, the pension is national at last.§!"

 CAN_pc_1003:0 "Order-in-Council P.C. 1003"
 CAN_pc_1003_desc:0 "Compulsory recognition of a certified bargaining agent, a duty to bargain in good faith, and a labour board to enforce it, granted by war order in February 1944 after a year in which more days were lost to strikes than in any year since 1919. The Government is not converted. The Government cannot afford another shutdown."
 CAN_pc_1003_tt:0 "§GIndustrial unrest ends, the grievance of labour is wiped out, stability rises and communist support falls.§!"

 CAN_the_veterans_charter:0 "The Veterans Charter"
 CAN_the_veterans_charter_desc:0 "Re-establishment credits, university fees, land settlement and a mortgage the returning man can actually carry, all voted before the demobilization begins rather than after it. In 1919 the soldiers came home to a bonus argument and a general strike. This Parliament has read that page."
 CAN_the_veterans_charter_tt:0 "§GStability rises considerably and the demobilized return to the manpower pool.§!"

 CAN_the_tax_rental_agreements:0 "The Tax Rental Agreements"
 CAN_the_tax_rental_agreements_desc:0 "The provinces are asked to vacate the personal income tax and the corporation tax for the duration and one year after, in return for a rental payment from Ottawa. Ontario and Quebec object at length and sign. Nothing that a war has centralized has ever been fully handed back."
 CAN_the_tax_rental_agreements_tt:0 "§GThe Dominion holds the great tax fields: political power rises sharply.§! §RStability falls and provincial autonomy is reduced.§!"

 CAN_extend_the_provincial_boundaries:0 "Extend the Provincial Boundaries"
 CAN_extend_the_provincial_boundaries_desc:0 "The Boundaries Extension Acts of the first of April 1912 carry Quebec, Ontario and Manitoba north to the salt water. Ungava becomes Nouveau-Quebec, the Keewatin is divided, and the terms attached to the Quebec grant concerning the Indian title will be quietly left unperformed for fifty years."
 CAN_extend_the_provincial_boundaries_tt:0 "§GThe northern districts pass to the provinces and new ground is opened for building.§! §YUngava becomes Quebec ground, and is read as such thereafter.§!"

 CAN_establish_the_department_of_health:0 "Establish the Department of Health"
 CAN_establish_the_department_of_health_desc:0 "Fifty thousand dead of the influenza in a country of eight millions, and a federal government with no authority to do anything about it but bury the returning soldiers. The Act of June 1919 creates the department that the epidemic proved was missing."
 CAN_establish_the_department_of_health_tt:0 "§GStability rises and the manpower pool recovers.§!"

 CAN_arrest_the_strike_committee:0 "Arrest the Strike Committee"
 CAN_arrest_the_strike_committee_desc:0 "Ten leaders of the general strike taken from their beds before dawn under an immigration act amended in forty-five minutes at three in the morning, so that British-born agitators might be deported like any other alien. Two days later the Mounted Police ride down Main Street. The strike breaks. The bill for it does not."
 CAN_arrest_the_strike_committee_tt:0 "§GCommunist support falls and the strike is broken.§! §RStability falls, the debt to civil liberties grows by two, and labour will remember Bloody Saturday for a generation.§!"

 CAN_ask_the_nation_to_release_us:0 "Ask the Nation to Release Us"
 CAN_ask_the_nation_to_release_us_desc:0 "The Government did not promise the country that it would never conscript. It promised that it would not conscript without asking. The question on the ballot therefore asks the whole electorate to release the Government from an undertaking that was given to one province, and everybody in the country understands exactly what that means. The Ligue pour la defense du Canada is already in the field. The result is not in doubt and it is not the point."
 CAN_ask_the_nation_to_release_us_tt:0 "§YThe plebiscite is called. The country votes in ninety-five days, and the result is already written.§!"
 CAN_the_plebiscite_result_tt:0 "§YAbout sixty-five in the hundred vote yes across the Dominion. Nearly seventy-two in the hundred vote no in Quebec.§! §GThe Government is released from its pledge and war support rises.§! §RStability falls, nationalist support rises, and the blood tax rises by fifteen. One country has just given two answers, and both of them were honest.§!"

 CAN_bill_eighty:0 "Bill 80"
 CAN_bill_eighty_desc:0 "The clause of the National Resources Mobilization Act that forbids sending conscripts overseas is struck out. The Minister of Public Works resigns rather than vote for it, and the Prime Minister explains to the House that the measure is not necessarily conscription. The power will sit unused for two years and four months."
 CAN_bill_eighty_tt:0 "§GThe statutory bar to overseas service is removed and war support rises.§! §RStability falls and the blood tax rises by five.§!"

 ##### Decisions - The West (common/decisions/CAN_political_decisions.txt)
 CAN_recruit_european_settlers:0 "Recruit European Settlers"
 CAN_recruit_european_settlers_desc:0 "Agents in Galicia and the Bukovina, free homesteads of a hundred and sixty acres, and a pamphlet in eight languages calling the Prairies the last best west. The Minister of the Interior wants the sturdy peasant in the sheepskin coat and does not much mind what language he prays in. Half of Ontario minds a great deal."
 CAN_recruit_european_settlers_tt:0 "§GThe manpower pool grows and a building slot is opened on the Prairies.§! §YThe yield depends upon which West the Dominion chose to build.§!"

 CAN_close_the_gates:0 "Close the Gates"
 CAN_close_the_gates_desc:0 "The orders-in-council of June 1919 name the Doukhobors, the Hutterites and the Mennonites and shut the door against them, on the ground that their customs and their refusal of military service make them unsuited to Canadian citizenship. They were invited here on written guarantees of exactly those customs, and the guarantees are still in the files."
 CAN_close_the_gates_tt:0 "§GStability and political power rise: the country is quieter with the door shut.§! §RSettlement of the Prairies stops for as long as the gates are closed.§!"

 CAN_open_the_gates:0 "Open the Gates"
 CAN_open_the_gates_desc:0 "The prohibitory orders are revoked and the door stands open again. The land needs the men. The constituencies that cheered the closing will not cheer this."
 CAN_open_the_gates_tt:0 "§GThe manpower pool grows and settlement resumes.§! §RStability falls and nationalist feeling rises in the West.§!"

 CAN_restore_the_crows_nest_pass_rates:0 "Restore the Crows Nest Pass Rates"
 CAN_restore_the_crows_nest_pass_rates_desc:0 "The statutory rates on grain and flour eastbound out of the Prairies, suspended in the war, are restored by Act of Parliament and fixed by statute rather than by the Board. It is the one clean legislative victory the West wins in this period, and it freezes a freight tariff in place for the next sixty years."
 CAN_restore_the_crows_nest_pass_rates_tt:0 "§GThe freight rate grievance ends and grain moves cheaply for good.§! §ROne further level of railway overbuild is added, and §Ythis one is statutory: the Canadian National Railways can never liquidate it§!.§!"

 CAN_the_community_pastures:0 "The Community Pastures"
 CAN_the_community_pastures_desc:0 "A township that should never have been broken is bought back, seeded to grass and turned over to the district for common grazing. The soil stops leaving in the wind. The homesteads that were surveyed on it are gone, and they are not coming back."
 CAN_the_community_pastures_tt:0 "§GThe dust storms end in that district and stability rises.§! §RA building slot is lost permanently.§!"

 CAN_one_hundred_and_thirty_three_dry_holes:0 "One Hundred and Thirty-Three Dry Holes"
 CAN_one_hundred_and_thirty_three_dry_holes_desc:0 "Imperial Oil has drilled a hundred and thirty-three consecutive failures across the West and its board is preparing to stop. Another campaign in central Alberta costs money the company would rather not spend on ground the geologists cannot promise. The name of this decision is its own success rate."
 CAN_one_hundred_and_thirty_three_dry_holes_tt:0 "§YAnother drilling campaign in Alberta. Most of them fail.§!"
 CAN_the_dry_hole_tt:0 "§RDry. The rig is moved and the money is gone.§!"
 CAN_leduc_no_1_ready_tt:0 "§GThe well has come in. There is oil under Alberta, and everything about this country changes.§!"

 CAN_hold_the_surplus:0 "Hold the Surplus"
 CAN_hold_the_surplus_desc:0 "The Wheat Board will take the crop and store it, because there is no bottom in the ships to carry it and no market at the other end that can be reached. Acreage is cut, the elevators fill, and the Treasury carries the difference so that the farm does not."
 CAN_hold_the_surplus_tt:0 "§GStability rises on the Prairies: the farm is paid whatever the convoys can lift.§! §RThe cost of storage is carried by the country at war.§!"

 ##################################################################################
 ##### CAN_war_events.txt - namespace can_war
 ##### Les evenements militaires et les deux crises de la conscription (branche 07)
 ##################################################################################

 ##### can_war.1 - Paardeberg, 18-27 fevrier 1900
 can_war.1.t:0 "Paardeberg"
 can_war.1.d:0 "The second contingent has been in the field a month when, before dawn on the eighteenth of February, the Royal Canadian Regiment goes forward across the open veldt at Paardeberg Drift against Cronje's laager. Thirty-one Canadians are killed and more than a hundred wounded in an hour, and the ground is not taken. Nine days later two companies dig themselves in within three hundred yards of the Boer trenches during the night, and at first light the white flag goes up over the laager. It is the first British success of a war that has gone very badly, and it is the first time the name of the Dominion has been read out in a despatch from a field of battle.\n\nThe despatch is read in Toronto and in Quebec on the same morning, and it is not read the same way. In Ontario it is proof that the Dominion has come of age within the Empire. In Quebec it is proof of something else entirely: that a Canadian may be sent four thousand miles to die under an Order-in-Council, without a vote of the Commons, because London asked and the Prime Minister could not say no.\n\n§YThere is no answer to be given. It has already happened.§!"
 can_war.1.a:0 "The Dominion has been under fire."

 ##### can_war.2 - Le Ross s'enraye
 can_war.2.t:0 "The Rifle Will Not Fire"
 can_war.2.d:0 "Sir Charles Ross built the finest target rifle in the world, and the Militia bought it because it was bored and rifled at Quebec by Canadian hands. On the ranges at Petawawa it outshot everything the British service had. In the mud of Flanders, fed British service ammunition of a fraction under the Canadian chamber, the bolt seizes after a dozen rounds and cannot be worked. Men kick the handle open with the heel of a boot. Whole companies have thrown the rifle into the ditch and picked up the Lee-Enfields of the British dead, and their officers have not stopped them.\n\nThe Minister of Militia will not hear a word said against the rifle. The men at the front have already decided the question."
 can_war.2.a:0 "Re-arm them with the Lee-Enfield, and let the Minister answer for it."
 can_war.2.b:0 "The rifle is Canadian, and so is the works that makes it."

 ##### can_war.3 - Le gaz a Ypres, 22 avril 1915
 can_war.3.t:0 "Gas at Ypres"
 can_war.3.d:0 "At five in the afternoon of the twenty-second of April a yellow-green cloud comes out of the German line north of the salient and settles into the trenches of the French colonial division on our left. In ten minutes there is no division there: six thousand yards of open flank, and behind it nothing whatever but the First Canadian Division, eight weeks in the field, and whatever it can improvise before morning.\n\nThe medical officers pass the word to breathe through a handkerchief soaked in water, or in urine if there is no water. The counter-attack at Kitcheners Wood goes in at eleven that night, in the dark, across five hundred yards of open ground, by men who have never attacked anything.\n\n§YFour days of it. Six thousand casualties, a third of the division.§!"
 can_war.3.a:0 "Hold the flank. There is nothing behind us."
 can_war.3.b:0 "Fall back and reform. The salient is not worth a division."

 ##### can_war.4 - Le Corps canadien constitue, 13 septembre 1915
 can_war.4.t:0 "The Canadian Corps"
 can_war.4.d:0 "General Headquarters informs Ottawa - informs, it does not enquire - that the Canadian divisions in France will be grouped from the thirteenth of September as the Canadian Corps, and that Lieutenant-General Alderson of the British service will command it. The formation is a British administrative convenience that happens to be the largest thing the Dominion has ever put in the field.\n\nThe Militia Department is told the same day as the newspapers. The question that follows is not whether the Corps will exist, but whose officers will fill its staff, and whether a Canadian will ever be allowed to command above a division."
 can_war.4.a:0 "An Imperial officer will command the Corps. It is his trade, and ours is to fill it."
 can_war.4.b:0 "The Corps will have a Canadian staff, and in time a Canadian at its head."

 ##### can_war.5 - Currie prend le Corps, 9 juin 1917
 can_war.5.t:0 "Currie Takes the Corps"
 can_war.5.d:0 "Arthur Currie was a failed real-estate agent in Victoria with a hole in his regimental accounts and a militia gunner's commission. He is also the man who worked out, division by division and gun by gun, how Vimy Ridge was to be taken: aerial photography, sound ranging, the creeping barrage timed to the pace of a walking man, and every private soldier shown the map of his own objective before he went over.\n\nAfter the ninth of April there is no argument left to be had. On the ninth of June he is given the Canadian Corps - the first Canadian to command above a division, and the first time in the history of the Dominion that the Empire has taken its instruction from a colonial soldier."
 can_war.5.a:0 "The Corps will be commanded by a Canadian."

 ##### can_war.6 - L'election kaki, 17 decembre 1917
 can_war.6.t:0 "The Khaki Election"
 can_war.6.d:0 "The Military Service Act was assented to on the twenty-ninth of August. On the twentieth of September two further Acts remade the electorate to fit it: the Military Voters Act, which allows a soldier to assign his ballot to whatever constituency he pleases, and the War-time Elections Act, which gives the federal vote to the mothers, wives, sisters and daughters of servicemen and takes it away from naturalised subjects of enemy birth and from conscientious objectors.\n\nSir Wilfrid Laurier, seventy-six years old, refuses the coalition. A Union Government is sworn on the twelfth of October with the Liberals who would come - Rowell, Crerar, Sifton, Calder, Carvell - and the country goes to the polls on the seventeenth of December.\n\n§YUnionists 153 seats, Laurier 82; and 62 of the 65 seats of Quebec to the old chief who said no. The three Unionists returned in that province are all of them English-speaking.§!"
 can_war.6.a:0 "Take in every Liberal who will come, and call it a Union Government."
 can_war.6.b:0 "The Government will answer for its own Act, and alone."

 ##### can_war.7 - Paques a Quebec, 28 mars - 1er avril 1918
 can_war.7.t:0 "Easter in Quebec City"
 can_war.7.d:0 "On Thursday the twenty-eighth of March the Dominion Police take a young man out of a bowling alley in Saint-Roch because he cannot produce his exemption papers. He can: they are at his brother's house. By nightfall the crowd has the registry office of the Military Service Act, and the files of the district are burning in the street.\n\nA thousand troops are brought from Toronto because troops from the district cannot be relied upon. On Easter Monday the machine guns fire down Rue Saint-Joseph, and four civilians are killed - a machinist, a carpenter, a joiner and a boy of fourteen - none of whom had anything to do with the riot.\n\n§ROne hundred and fifty arrested. Habeas corpus suspended in the district by Order-in-Council.§!"
 can_war.7.a:0 "Send in the troops, and suspend habeas corpus in the district."
 can_war.7.b:0 "The Mayor and the Archbishop will speak first."
 can_war.7.c:0 "Cancel the exemptions of the farmers' sons while we are about it."

 ##### can_war.8 - Les Cent Jours, aout-novembre 1918
 can_war.8.t:0 "The Hundred Days"
 can_war.8.d:0 "Amiens, at twenty past four on the morning of the eighth of August, in fog, with the Corps moved down from Flanders in secret and two of its battalions sent conspicuously the other way to fool the enemy wireless. Twelve kilometres in a day, and Ludendorff calls it the black day of the German army.\n\nThen Arras, the Drocourt-Queant line, the dry bed of the Canal du Nord crossed at a two-hundred-yard front and fanned out on the far bank, Cambrai, Valenciennes, and Mons on the last morning of the war. The Corps is now used as the shock army of the Empire, put in wherever the line has to be broken.\n\n§YOne hundred days. Some forty-five thousand casualties - a fifth of everything the Dominion lost in four years of war.§!"
 can_war.8.a:0 "The Corps will lead. It is what it is for."
 can_war.8.b:0 "Bring the boys home. The war will be won without them."

 ##### can_war.9 - La force C appareille, 27 octobre 1941
 can_war.9.t:0 "C Force"
 can_war.9.d:0 "London asks for two battalions to reinforce the garrison of Hong Kong. The request is put as a matter of showing the flag in the Far East and of stiffening a garrison whose morale would benefit; it is not put as a military proposition, because the Imperial staff wrote the place off as indefensible eighteen months ago and has not changed its mind.\n\nThe two battalions available are the Royal Rifles of Canada and the Winnipeg Grenadiers, both graded as not recommended for operational duty, both fresh from garrison work in Newfoundland and Jamaica. They sail from Vancouver on the twenty-seventh of October. Their motor transport is still standing on the wharf when the ship clears the harbour."
 can_war.9.a:0 "Two battalions will sail. The Dominion does not refuse the Empire a garrison."
 can_war.9.b:0 "The place cannot be held, and it will not be reinforced by Canadians."

 ##### can_war.10 - Hong Kong tombe, 25 decembre 1941
 can_war.10.t:0 "Christmas Day at Hong Kong"
 can_war.10.d:0 "The colony capitulates on Christmas Day, seventeen days after the first shell. Two hundred and ninety Canadians are killed in the fighting. Two hundred and sixty-seven more will die in the camps and the mines of Japan in the three and a half years that follow, of beriberi, of diphtheria and of work.\n\nThe Opposition asks in the House how untrained battalions came to be sent without their transport to a place the staff had condemned. The Government appoints Sir Lyman Duff, Chief Justice of Canada, as Royal Commissioner. His report exonerates the Government in every particular and convinces nobody at all.\n\n§RThe first Canadian soldiers of this war to fight were sent to a place chosen for them, and lost.§!"
 can_war.10.a:0 "Let the Commissioner report."

 ##### can_war.11 - Jubilee, 19 aout 1942
 can_war.11.t:0 "Operation Jubilee"
 can_war.11.d:0 "Five thousand men of the Second Canadian Division are to go ashore at Dieppe at first light: a defended town, a shingle beach that will not take a tank, cliffs on both flanks, in daylight, without heavy naval gunfire and without a preliminary bombardment, because the town is French and the houses are full of Frenchmen.\n\nThe division has been in England for two and a half years and has not fired a shot at anybody. The country has begun to ask, in print, what its army is for.\n\n§RNine hours. 907 dead, 1,946 taken prisoner, fewer than half the force brought home. Every lesson of it is written into the plans that follow, and there is no Normandy without them.§!"
 can_war.11.a:0 "The Second Division will make the raid."
 can_war.11.b:0 "We will not spend a division on a beach to teach the planners their trade."

 ##### can_war.12 - La traversee, hiver 1942-1943
 can_war.12.t:0 "The Crossing"
 can_war.12.d:0 "Everything the army is has to cross an ocean: the drafts, the rifles, the flour, the mail. The Dominion escorts something near half the trade of the North Atlantic with corvettes commissioned faster than crews can be trained for them, carrying the oldest asdic sets in the alliance and no gyro compass, on the slow convoys that nobody else wants.\n\nThe boats are winning in the middle of the ocean, where no aircraft reaches. There is one ocean and there are two claims on it, and the Cabinet is asked which of them goes first."
 can_war.12.a:0 "The escorts first. Nothing crosses at all if the trade is sunk."
 can_war.12.b:0 "The drafts first. The army in England is eating its own reserves."

 ##### can_war.13 - L'Escaut, 2 octobre - 8 novembre 1944
 can_war.13.t:0 "The Scheldt"
 can_war.13.d:0 "Antwerp was taken on the fourth of September with its cranes and its locks intact, and not one ship can use it, because the eighty kilometres of estuary below the city are German on both banks. The First Canadian Army is given the job of opening it, and the job is five weeks of flooded polder, of dyke roads where a battalion advances on a one-platoon front, of the Breskens pocket and the causeway to Walcheren.\n\nOn the twenty-eighth of November the first convoy enters the port.\n\n§R6,367 Canadian casualties, and almost every one of them an infantryman. The rifle companies that cleared the estuary are at two-thirds strength on paper and less than that in fact, and the reinforcement depots in England are empty.§!"
 can_war.13.a:0 "Clear the estuary. The port is the war."
 can_war.13.b:0 "Antwerp can wait. The battalions cannot."

 ##### can_war.14 - La crise des renforts, novembre 1944
 can_war.14.t:0 "The Reinforcement Crisis"
 can_war.14.d:0 "The Minister of National Defence has come back from the front with a figure. He went to see for himself, and in Italy and in Belgium he was shown rifle companies commanded by lieutenants and made up of men remustered from the artillery and the service corps a fortnight ago. The figure is about fifteen thousand trained infantrymen short by the end of the year, and there is no arithmetic that makes it smaller.\n\nThere are sixty thousand men under arms in Canada, conscripted under the National Resources Mobilization Act, whom the law forbids to be sent beyond this continent. The country has the men. The country has promised not to use them.\n\n§YThe Cabinet has been round it for a fortnight. There are three ways out and the Government will be broken by whichever one it takes.§!"
 can_war.14.a:0 "Put the figure before the Cabinet."

 ##### can_war.15 - Les seize mille, 22-23 novembre 1944
 can_war.15.t:0 "The Sixteen Thousand"
 can_war.15.d:0 "The Order-in-Council goes to the Governor General on the twenty-third of November. Sixteen thousand men of the home defence army are made liable for service overseas - not conscription in general, the Prime Minister explains to the House, but conscription in this particular instance, which is a different thing.\n\nOf the sixteen thousand, 12,908 sail. Of those, 2,463 reach a front-line unit. Sixty-nine are killed.\n\n§YMilitarily it settles nothing that could not have been managed another way. Politically it is the second half of 1917, and the province has a long memory for the first half.§!"
 can_war.15.a:0 "They sail."

 ##### can_war.16 - Terrace, 24-29 novembre 1944
 can_war.16.t:0 "Terrace"
 can_war.16.d:0 "The 15th Infantry Brigade at Terrace, in the mountains of British Columbia, hears of the Order-in-Council on the depot telephone before its officers are told. The brigade is largely French-speaking and almost entirely conscripted, and it has been guarding a coast that has not been attacked for three years.\n\nThe men take the armoury, set up machine guns at the road and the rail line, and hold the camp for five days. Their own officers walk in and out among them. Nobody is fired upon. Not a line appears in any newspaper in the country: the censor sees to that, and the country will not learn of it for years."
 can_war.16.a:0 "Take the garrison back in hand. The ringleaders will be tried."
 can_war.16.b:0 "Nothing of the sort has occurred. Let it burn itself out."

 ##### Infobulles des effets scriptes
 CAN_war_reinforcement_crisis_tt:0 "§YThe three ways out of November are open, and the Cabinet may take any of them:§!\n  §YRalston Stays§! - the whole levy overseas, and Quebec does not forgive it.\n  §YNot Necessarily Conscription§! - sixteen thousand men, three months lost, and a minister with them.\n  §YThe Pledge Holds§! - the word is kept, and the battalions are never made whole again.\n§RThere is no fourth, and none of the three is good.§!"
