 ### CAN_domestic_events.txt - politique interieure et insurrections (namespace can_domestic)

 CAN_labour_grievance:0 "Labour Grievance"
 CAN_prairie_anger:0 "Prairie Anger"

 can_domestic.5.t:0 "Schools of the New Provinces"
 can_domestic.5.d:0 "The bills creating Alberta and Saskatchewan were laid before the House with a clause of the Prime Minister's own drafting: the separate schools of the Territories are to be continued by law in the new provinces. Mr Sifton resigned within the week, and the West sent word that it would not be governed from Quebec. The clause has since been rewritten until it guarantees very little and offends everyone. Both provinces will enter Confederation with a school question already inside them, and Ontario has taken careful note of how such a clause may be handled."
 can_domestic.5.a:0 "Let it stand as amended."

 can_domestic.3.t:0 "The Lethbridge Lockout"
 can_domestic.3.d:0 "The Galt mines have been shut since the spring, and the Prairies burn Galt coal. It is October, the elevators are full and the settlers are not, and the company will not treat with the miners' union on any terms whatever. The Conciliation Act of 1900 gives the Dominion a registrar, a form to be filled in, and no power at all to bring either party to a table. The Deputy Minister of Labour, a young man named King, has offered to go west himself and sit between them until it is settled."
 can_domestic.3.a:0 "Send the Deputy Minister to Lethbridge."
 can_domestic.3.a.tt:0 "The road of compulsory investigation is opened: no strike in a public utility until a board has reported."
 can_domestic.3.b:0 "The Act of 1900 is the law, and the law is enough."
 can_domestic.3.b.tt:0 "The road of recognition is opened: the unions may be dealt with as bodies known to the law."

 can_domestic.4.t:0 "The Spanish Influenza"
 can_domestic.4.d:0 "It came ashore with the troopships at Quebec and Halifax in September and was in every province by November. The theatres, the schools and the churches are shut; in Montreal the coffin makers cannot keep up, and in the northern settlements whole camps are found in the spring. Something near fifty thousand are dead, most of them between twenty and forty years of age, in a Dominion that has spent four years shipping men of exactly that age overseas. Ottawa has no Department of Health. It has never needed one, and the provinces have always said so."
 can_domestic.4.a:0 "The Dominion has no machinery for this."
 can_domestic.4.a.tt:0 "While the sickness runs, a federal Department of Health may be established."

 can_domestic.1.t:0 "The Winnipeg General Strike"
 can_domestic.1.d:0 "The building and metal trades went out on the fifteenth over the single question of whether an employer must meet a council of his own men. By eleven o'clock the Trades and Labour Council had taken the whole city out with them: thirty thousand, the street railway stopped, no telephones, and no bread or milk except by permit of the strike committee. It is the permits that everyone remarks upon. Against them stands the Citizens' Committee of One Thousand, drawn from the manufacturers, the banks and the law, which has already told Ottawa that this is Petrograd on the Red River. Mr Meighen and Senator Robertson have come from the capital and will not meet the strikers. Nothing has been decided. The Mounted Police are in the yards."
 can_domestic.1.a:0 "The city is stopped."
 can_domestic.1.a.tt:0 "While the city is stopped, the arrest of the strike committee may be ordered. Whatever is done or left undone, the reckoning falls on the twenty-first of June."

 can_domestic.2.t_charge:0 "Bloody Saturday"
 can_domestic.2.t_quiet:0 "The Strike Is Called Off"
 can_domestic.2.d_charge:0 "The committee was taken in its beds in the small hours of the seventeenth, ten men, four of them foreign born, and the deportation clause of the amended Immigration Act was quoted to their faces. On Saturday the returned soldiers held their silent parade regardless, the Mayor read the Riot Act from the steps of the City Hall, and the Mounted Police rode down Main Street twice, the second time with revolvers. Two men are dead, one shot in front of the Manitoba Hotel; there are some thirty wounded and eighty arrests, and the specials with their baseball bats hold the street tonight. The committee will give up the city on the twenty-fifth. It has taken six weeks to make a generation of labour members out of a wage dispute."
 can_domestic.2.d_quiet:0 "Nobody was arrested. The committee kept its permits, the Citizens' Committee ran its own bread wagons, the Mounted Police stayed in the yards, and by the twenty-fifth the men had gone back with nothing won and nothing broken. The employers still will not meet a council. The One Big Union has its first defeat and no martyrs to show for it, which is the worse of the two outcomes for it, and Ottawa has learned that it can afford to wait."
 can_domestic.2.a:0 "Two dead in Main Street."
 can_domestic.2.a.tt_section:0 "The unlawful associations clause is vindicated in the House. It will not be repealed while this Parliament sits."
 can_domestic.2.a.tt_nothing:0 "There is no law on the books that justifies what was done, and the country can see that there is not."
 can_domestic.2.b:0 "They go back on the employers' terms."

 can_domestic.7.t:0 "The Senate Says No to the Pension"
 can_domestic.7.d:0 "The Old Age Pensions Bill passed the Commons on the votes of the Progressives, who made it the price of their support, and it has died in the Senate upon second reading. Their lordships hold that a pension of twenty dollars a month, shared with the provinces, is a matter for the provinces alone; several of them hold besides that a pension is a charity, and that charity is no business of Parliament. The upper house is appointed for life, and the greater part of it was appointed by the other party."
 can_domestic.7.a:0 "Put it again when the electors have spoken."
 can_domestic.7.b:0 "Tell His Excellency we shall recommend the senators we need."
 can_domestic.7.b.tt:0 "The precedent of naming senators to carry a measure is on the record, and the opposition will remember that it is."

 can_domestic.6.t:0 "A Five-Cent Piece"
 can_domestic.6.d:0 "Asked in the House to help the provinces with their unemployed, the Prime Minister lost his temper on the floor and said he would not give a Tory government a five-cent piece. It is in Hansard. It will be on every Conservative platform in the country by June."
 can_domestic.6.a:0 "It is in Hansard."

 can_domestic.9.t:0 "Ultra Vires"
 can_domestic.9.d:0 "The Judicial Committee of the Privy Council has given judgment upon the reference, and given it against us. Unemployment insurance, the eight-hour day, the weekly rest and the minimum wage are struck down together: labour, property and civil rights in the province belong to the province, and a convention signed at Geneva does not enlarge this Parliament's power to legislate upon them. What survives is the marketing of natural products and very little else. Their lordships have not said the country may not have these laws. They have said that this Parliament may not pass them."
 can_domestic.9.a:0 "The Judicial Committee has spoken."
 can_domestic.9.a.tt:0 "Social legislation costs a great deal more until the fiscal question is settled with the provinces."

 can_domestic.8.t:0 "The Padlock Law"
 can_domestic.8.d:0 "Quebec has passed an Act respecting communistic propaganda. Any house used to propagate communism may be closed by order of the Attorney General for a year, any printed matter tending to propagate it may be seized, and the statute nowhere says what communism is. The Attorney General is also the Premier. The first padlocks went upon union halls and upon the offices of a paper that had criticized the Government of Quebec. The power to disallow a provincial statute rests with the Governor General in Council, which is to say with us, and it has not been used in this generation."
 can_domestic.8.a:0 "Quebec has legislated. Ottawa must decide whether to see it."
 can_domestic.8.a.tt:0 "The question of disallowance is now before the Council."

 can_domestic.10.t:0 "The Provinces Say No"
 can_domestic.10.d:0 "The conference upon the Rowell-Sirois report opened on the fourteenth and was over by the fifteenth. Ontario would not surrender the income tax, Alberta would not be lectured upon its debts, and British Columbia asked what the Dominion proposed to do about the freight rates before it asked for anything at all. Mr Hepburn told the delegates he had read the report twice and liked it less the second time. The country is at war and cannot raise what it must fight with while nine provinces tax the same field."
 can_domestic.10.a:0 "Then it must be done another way."
 can_domestic.10.a.tt:0 "Both fiscal roads are opened: the wartime tax agreements, or leaving the provinces their fields."

 can_domestic.11.t:0 "The Marsh Report"
 can_domestic.11.d:0 "Dr Marsh has given the parliamentary committee a scheme of social security drawn up in a fortnight: children's allowances, national health insurance, unemployment assistance, and a national investment programme against the demobilization. He costs it at something over a billion a year and says the country can carry it. The Minister of Finance says the country cannot. The report was printed cheaply and sold out in a week, which no government report in this Dominion has ever done, and the next poll is about to explain why."
 can_domestic.11.a:0 "It goes to the committee."
 can_domestic.11.a.tt:0 "The divergence of 1944 is armed, and the reckoning in Saskatchewan has begun to run."

 can_domestic.12.t:0 "The Green Book"
 can_domestic.12.d:0 "Ottawa has put the whole bargain upon the table at once: surrender the personal income tax, the corporation tax and the succession duties for good, and take in exchange a grant by head of population, old age pensions at sixty-five, health insurance by stages, and public investment against the next slump. Mr Drew calls it the end of the provinces. Mr Duplessis calls it the end of something a good deal older than the provinces. The conference will sit again in the spring, and it will fail again."
 can_domestic.12.a:0 "Then we shall rent the fields one at a time."
 can_domestic.12.a.tt:0 "The tax rental agreements may be concluded with the provinces that will sign. Ontario and Quebec will not sign."

 can_domestic.13.t:0 "The Cipher Clerk"
 can_domestic.13.d:0 "A clerk from the Soviet embassy walked out on the fifth of September with a hundred and nine documents under his shirt, and spent two days trying to find somebody who would take him seriously. The newspaper sent him away. The Department of Justice sent him away. He is now in a safe house with his wife and his child, and the documents describe a network reaching into External Affairs, into the National Research Council and into the atomic work at Chalk River, run from the embassy of an ally with whom we exchanged compliments four months ago. There is no offence in the Criminal Code that fits it, and no power to hold a man while the thing is examined, unless the War Measures Act is used in a country that has been at peace since August."
 can_domestic.13.a:0 "Take them in, and let the Order-in-Council do the rest."
 can_domestic.13.a.tt_rose:0 "The member for Cartier is arrested, tried, and expelled from the House of Commons."
 can_domestic.13.b:0 "Wait, and see who runs."
 can_domestic.13.c:0 "It never happened."
 can_domestic.13.b.tt:0 "Nothing is decided. The question will come back, and one of them will be gone by then."
 can_domestic.13.c.tt:0 "The file is closed and the alliance is undisturbed. Nobody is told what was in the documents, including the men whose work is in them."

 can_domestic.14.t:0 "Asbestos, 1949"
 can_domestic.14.d:0 "Five thousand men at Asbestos and Thetford Mines went out on the fourteenth without waiting for arbitration, which makes the strike unlawful under the provincial code before a word is said about wages. They are asking a dollar an hour, the check-off, and an end to the dust that is killing them. The province has sent its police and certified the strike illegal; the Archbishop of Montreal has ordered collections taken up in the churches for the strikers' families, which has never happened before in the history of this country. Labour in the mines is a provincial matter. The dust is in the lungs of Canadians."
 can_domestic.14.a:0 "Labour in the mines is a matter for Quebec."
 can_domestic.14.b:0 "Let the Archbishop and the courts of the province find the settlement."
 can_domestic.14.b.tt:0 "The reform clergy and the young lawyers of the strike are on the record, and they will be heard from again."
 can_domestic.14.c:0 "The Dominion will intervene."
 can_domestic.14.c.tt:0 "The federal power over labour is asserted against a province in its own field. It will be answered, and not only in Quebec."

 can_domestic.20.t:0 "The Estevan Shootings"
 can_domestic.20.d:0 "The Bienfait miners were told they might parade in Estevan and then told they might not, and the second order did not reach them in time. Three trucks of the Mounted Police met the parade in the main street; the firing lasted a few seconds, and three miners are dead. The town council has forbidden the word murdered to be cut into the stone above their grave. The company houses are what they were, the tonnage rate is what it was, and the union has three names to put upon a banner."
 can_domestic.20.a:0 "An inquiry, and the truth of it."
 can_domestic.20.b:0 "The law was upheld."

 can_domestic.21.t:0 "Christie Pits"
 can_domestic.21.d:0 "A club calling itself by a foreign emblem has spent the summer displaying it on the beaches to drive the Jewish families off them, and the city has told the police it can do nothing while no law is broken. At the end of a ball game in Willowvale Park the blanket was unrolled from the clubhouse roof, and six hours of fighting followed with bats and lead pipe, ten thousand people in the park and boys of fifteen carried out of it. Nobody was killed, which is the only thing to be said for the evening. The clubs are not unlawful. They have not yet done anything that is unlawful."
 can_domestic.21.a:0 "Prosecute the club."
 can_domestic.21.b:0 "A brawl between boys."

 can_domestic.22.t:0 "On to Ottawa"
 can_domestic.22.d:0 "The men walked out of the relief camps in British Columbia in April: twenty cents a day, no vote, no wife, and a numbered bunk in the bush until further notice. Fifteen hundred of them have been in Vancouver for two months and are now riding the box cars east, picking up more at every divisional point, drilled in fours under their own marshals and their own discipline, which is the part that alarms the Commissioner most. They reached Regina on the fourteenth. They ask for work and wages, a scale of pay, and the vote. They intend to put the request to the Prime Minister in person."
 can_domestic.22.a:0 "Receive the delegation, and hear them out."
 can_domestic.22.b:0 "The trek stops at Regina. The railways will carry no more of them."
 can_domestic.22.c:0 "Close the camps and be done with the system."

 can_domestic.23.t_riot:0 "The Market Square"
 can_domestic.23.t_quiet:0 "The Trek Disperses"
 can_domestic.23.d_riot:0 "A public meeting was called in Market Square on Dominion Day, and the police were told to take the leaders off the platform while the crowd was there to watch it done. The whistle went at eight o'clock. Four hours of it: the plate glass out along Eleventh Avenue, men fighting with the paving stones they had been standing on, the Mounted Police riding through and the city police behind them. A detective is dead of a fractured skull, and a trekker will die of his injuries. Some hundred and thirty men are under arrest and the rest have been given their fare home, which is what they were asking for in April."
 can_domestic.23.d_quiet:0 "The delegation was heard, the box cars were provided, and the men went home to the towns they came from without a shot or a stone. The camps are not settled and the twenty cents a day is not settled. But the Mounted Police did not ride in Regina on Dominion Day, and every prairie town knows which government it was that did not send them."
 can_domestic.23.a:0 "A hundred and thirty arrests, and two men are dead."
 can_domestic.23.b:0 "They were heard, and they went home."

 can_domestic.24.t:0 "The Dividend Is Not Paid"
 can_domestic.24.d:0 "Two years, and no basic dividend has been issued to any citizen of the province. The Board has explained that the monetary experts sent for from England were not the right experts, that the banks have obstructed, that the Dominion has obstructed, and that the dividend will come. The Premier has gone on the radio to say that it will come. In the meantime the province pays its teachers in scrip and its bondholders not at all, and the men who marked their ballots for twenty-five dollars a month have worked out that they have received nothing."
 can_domestic.24.a:0 "The promise cannot be kept."
 can_domestic.24.a.tt:0 "The promise of the dividend can never again be made to anyone who was here in 1935."

 can_domestic.25.t:0 "Alberta Defaults"
 can_domestic.25.d:0 "The first of April came and the province did not meet its maturity. No Canadian province has ever done this. The Dominion offered the money upon the condition that a loan council supervise the borrowing; the province would not have the council, and the Dominion would not have the borrowing without it, and so nobody decided anything and the date arrived by itself. Interest upon the outstanding debt has been cut in half by provincial statute. The bond houses of Toronto and London will lend the West nothing for a generation."
 can_domestic.25.a:0 "The date decided it for us."

 can_domestic.26.t:0 "Reference re Alberta Statutes"
 can_domestic.26.d:0 "The Supreme Court has answered the reference, and answered it entirely against the province. The bank taxation bill is legislation upon banking, and banking belongs to the Dominion. The credit of Alberta bill is currency, and is void. And the press bill, which would have obliged every newspaper in the province to print the Government's correction of anything it disliked and to name its informants upon demand, is void with a judgment attached upon free public discussion that will be quoted for fifty years. The province may appeal to London, or it may find another way to make credit."
 can_domestic.26.a:0 "We will go to London."
 can_domestic.26.b:0 "Then we will build our own bank."
 can_domestic.26.b.tt:0 "The road to provincial treasury branches is opened: if the chartered banks may not be taxed, they may be gone around."

 can_domestic.27.t:0 "The Certificates Come Back"
 can_domestic.27.d:0 "The prosperity certificate carries a dollar's face and a square for every week, and the holder must buy a one-cent stamp each Wednesday and stick it on, so that the paper redeems itself in two years out of its own stamps. The merchants have worked out that the stamps cost them more than the trade is worth. They are refusing the paper at the counter, the province is taking it back at the treasury, and the men who were paid in it upon the relief works have been paid in nothing."
 can_domestic.27.a:0 "Take them back at the wicket."

 can_domestic.28.t:0 "He Votes Alone"
 can_domestic.28.d:0 "The House met on the seventh and the question was put on the ninth. The member for Winnipeg North Centre rose and said that he had been through one war, that he had seen what it did to the men who came back and to the men who did not, that he would oppose this one whatever it cost him, and that he was perfectly aware what it would cost him. His own caucus had voted the day before to support the declaration. He divided the House alone and was not seconded. The Prime Minister paid him a tribute from the front bench, and then carried the motion without a recorded division."
 can_domestic.28.a:0 "He has been consistent for twenty-five years."
 can_domestic.28.a.tt:0 "The party is on the record for the war and its leader is on the record against it. It will pay for both."

 can_domestic.29.t:0 "The Leader Is Replaced"
 can_domestic.29.d:0 "The stroke took him in the spring and he has not recovered the use of his side. The convention has chosen the schoolmaster from Regina in his place: a man who supports the war, wants the wheat marketed by a board and the mines owned by the country, and has no intention whatever of dividing a House alone. The old man keeps his seat and his conscience, and is thanked at length."
 can_domestic.29.a:0 "The party will not do that twice."

 can_domestic.30.t:0 "York South"
 can_domestic.30.d:0 "The Conservative leader was chosen at a closed meeting of the caucus without a seat in the Commons, and York South was found for him: suburban, safe, and vacant. He fought it upon compulsory service for the whole war effort. The Liberals ran nobody at all. The seat has gone to a high school teacher standing for the C.C.F. by four thousand votes, and the leader of His Majesty's loyal opposition is out of Parliament altogether."
 can_domestic.30.a:0 "A schoolteacher has beaten a former Prime Minister."

 can_domestic.36.t:0 "The Party Takes His Name"
 can_domestic.36.d:0 "The Conservatives went to Winnipeg to find a leader and came back with the Progressive premier of Manitoba, an old Grain Growers man who has never sat as a Conservative in his life. His terms were accepted in full: floor prices for the farmer, family allowances, a national housing policy, and the word Progressive added to the name of the party upon every ballot in the country. It is the oldest manoeuvre in this Parliament and it has never once failed. The programme is taken, the word is taken, and the movement that made both is left explaining the difference to its own supporters."
 can_domestic.36.a:0 "They have taken the word."

 can_domestic.31.t:0 "The Gallup of September 1943"
 can_domestic.31.d:0 "Twenty-nine for the C.C.F., twenty-eight for the Liberals, twenty-eight for the Conservatives. It is the first time a party of the left has led a national poll in this country, and the Prime Minister has read the figures twice. The party took thirty-four seats in Ontario in August, it holds the balance in Saskatchewan, and the insurance companies have engaged a firm in Toronto to explain to the public what socialism would mean. There is a year and a half before the country must vote."
 can_domestic.31.a:0 "Answer them. Bring the allowances forward."
 can_domestic.31.a.tt:0 "Family allowances and the social security programme may be taken up at once, ahead of their time."
 can_domestic.31.b:0 "Let it run. These things pass."

 can_domestic.32.t:0 "Forty-Seven of Fifty-Two"
 can_domestic.32.d:0 "Saskatchewan has voted. Forty-seven seats of fifty-two, and the first social democratic government in North America is sworn in at Regina under a Baptist minister who was gassed in one war and is not much impressed by the second. He proposes to begin with hospital insurance for every citizen of the province, paid for out of taxation, and to find out whether the Dominion will stop him. The province that starved in the thirties has answered the thirties. Ottawa may now work out what a general election is going to look like."
 can_domestic.32.a:0 "Regina has answered the thirties."

 can_domestic.33.t:0 "The Member for Cartier"
 can_domestic.33.d:0 "Cartier has returned a Labour-Progressive to the House of Commons: the only communist ever elected to a legislature in this country, carried by a working-class riding in Montreal in the middle of a war in which his party is now enthusiastically upon our side. He was interned in 1940 under the Regulations and released in 1942 when the alliance changed. He sits below the gangway and votes for the war effort."
 can_domestic.33.a:0 "There is one of them in the House now."

 can_domestic.34.t:0 "Regulation 39C"
 can_domestic.34.d:0 "The Defence of Canada Regulations permit the Governor in Council to declare an organization unlawful; and once it is declared, membership is an offence, the presses may be seized, and the officers may be interned for the duration without charge, without trial and without appeal. The order went out at dawn. The leader was taken at his house at Lanoraie with the uniforms and the armbands still in their trunks, and the party's own papers show a membership a small fraction of what its pamphlets claimed. They will be held in a camp in New Brunswick until the war is over. There is no procedure by which they may ask why."
 can_domestic.34.a:0 "There is no appeal from an Order-in-Council."
 can_domestic.34.a.tt:0 "The movement is broken for five years. The power that broke it does not expire with it."

 can_domestic.35.t:0 "The Bloc Takes the Ground"
 can_domestic.35.d:0 "The men who fought the plebiscite have made a party out of it. It is nationalist, it is against conscription, it is against the trusts and against the war, and it is led by men who sit in the Commons and in the Legislative Assembly and who will be re-elected there. Whatever room existed upon nationalist ground in this province is now occupied by people who can win seats upon it. The shirted movement of the thirties never won one anywhere, and it will not win one now."
 can_domestic.35.a:0 "The ground is taken, and not by them."
 can_domestic.35.a.tt:0 "While the Bloc holds the nationalist ground, the shirted movement cannot grow in French Canada."

 can_domestic.40.t:0 "The First Referendum"
 can_domestic.40.d:0 "Newfoundland has voted upon its own future for the first time since it gave up self-government in 1934. Responsible government, 44.6 per cent; confederation with Canada, 41.1; the Commission of Government continued, 14.3. Nothing has a majority, the third choice is eliminated, and the two that remain will be put again in seven weeks. The confederate campaign is run out of a broadcasting studio by a former pig farmer with a printing press and a mailing list, and it is short of everything except argument."
 can_domestic.40.a:0 "Send them the terms, the money and Mr Bradley."
 can_domestic.40.b:0 "Publish the terms in full and let them be read."
 can_domestic.40.c:0 "It is their affair. We will not campaign upon the island."

 can_domestic.41.t_union:0 "The Second Referendum"
 can_domestic.41.t_out:0 "Responsible Government Restored"
 can_domestic.41.d_union:0 "Fifty-two and three tenths for confederation against forty-seven and seven tenths, upon something under a hundred and fifty thousand votes. The Avalon voted against and the outports voted for, and the margin is about seven thousand ballots. There will be no third referendum. The Terms of Union must now be settled at Ottawa with a delegation from a country that has no legislature, no responsible government and no legal existence apart from a Commission appointed in London, which is a constitutional difficulty that will be solved by not looking directly at it."
 can_domestic.41.d_out:0 "The island has voted to have its own House of Assembly back, and to owe nothing to anybody for it. The Commission will wind up, a general election will be called, and the fishery, the railway and the debt will be theirs again, along with the bases we do not control and the airfields we do not own. There will be no tenth province. There will be a neighbour astride the Atlantic approaches, and other people have already made her offers."
 can_domestic.41.a:0 "The Terms of Union will be settled at Ottawa."
 can_domestic.41.a.tt:0 "The union with Newfoundland may now be concluded."
 can_domestic.41.b:0 "They have chosen to govern themselves."
 can_domestic.41.b.tt:0 "Newfoundland remains outside Confederation."
 can_domestic.41.c:0 "Washington has been on the island since 1941."
 can_domestic.41.c.tt:0 "Gander and Argentia are secured by the Americans, and the Atlantic approaches with them."

