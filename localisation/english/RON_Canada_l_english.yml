 ##### Shared tooltips
 CAN_imperial_english_canada_rallies_tt:0 "§GEnglish Canada takes this as a victory§! and recruiting rises in Ontario, the Maritimes and the West for two years, while §Rthe same news is read as an affront in Quebec, in the Saint Lawrence valley and in Acadian New Brunswick§!."
 CAN_imperial_french_canada_rallies_tt:0 "§GFrench Canada takes this as a vindication§! and recruiting rises in Quebec, in the Saint Lawrence valley and in Acadian New Brunswick for two years, while §Rthe same news is read as a betrayal in Ontario, in the Maritimes and in the West§!."
 CAN_imperial_terms_of_union_tt:0 "The Terms of Union may now be settled at Ottawa. §GThe island is not annexed by a ballot: it is admitted by an Act, and the Act has still to be signed.§!"
 CAN_imperial_ports_warning_tt:0 "§RClosing the ports of the Dominion to a belligerent is an act that belligerent may answer.§! Ottawa has been warned in writing, and will not be able to say afterwards that it was not."

