 better_canada.1.t:0 "[CAN.GetNameDef] Demands Alaska"
 better_canada.1.d:0 "[CAN.GetNameDef] has demanded that we immediately cede Alaska to them. They cite that it is an affront to have a foreign military so deep within their lands, being a direct insult to their sovereignty."
 better_canada.2.t:0 "[CAN.GetNameDef] considers us an ally and a friend"
 better_canada.2.d:0 "[CAN.GetNameDef] will be founding their own faction it seems and is already in talks of inviting us potentially. While not formally inviting us yet, they are giving us a courtesy notice to consider the possibility of a future together." 
 better_canada.2.a:0 "We'll consider it"
 better_canada.3.t:0 "[CAN.GetNameDef] founds the 'North American League'"
 better_canada.3.d:0 "[CAN.GetNameDef], having grown tired of the politics of Europe, has founded the 'North American League'. Their goals are officially stated as maintaining the status quo on their continent, but not everyone fully trusts this statement. There are even rumours that [USA.GetNameDef] may even be considering joining this faction."
 better_canada.3.a:0 "Interesting"
 better_canada.3.b:0 "Greatness Awaits"
 better_canada.4.t:0 "A Plebiscite is Held"
 better_canada.4.d:0 "The results are in. Every territory and province, except Quebéc, votes in large majority for the expansion of conscription rules. The troublesome aspect is that not only did Quebéc vote no, they voted nearly 73% against it. It is very likely that things will not change in Quebec in terms of conscription. Perhaps in light of what their peers have said they will change their minds, even if just a little. Of course we could be more forceful instead."
 better_canada.4.a:0 "What a bother..."
 better_canada.5.t:0 "Newfoundland defies [ENG.GetNameDef]"
 better_canada.5.d:0 "It would seem that the local garrisons of Newfoundland were extremely shocked at [ENG.GetNameDef] refusing the results of the referendum of the locals. When an angry mob approached the bases instead of fighting they instead were told to stand down by local officers, citing that it should be the will of the people to decide their own fate. As a result the garrisons were allowed to leave safely and forthright Newfoundland and Labrador belong to us."
 better_canada.5.a:0 "Just as planned"
 better_canada.6.d:0 "Earlier this morning locals of Newfoundland and Labrador were incited to a mob and marched onto the various garrison bases demanding their independence from [ENG.GetName]. The officers, fearing a senseless bloodshed, gave in to their demands and the [ENG.GetNameDef] troops were allowed to leave peacefully. There are already whispers that this was far too coordinated to have simply have been a 'random' set of mobs and accusations have been already levied towards [CAN.GetName] as being the likely culprit."
 better_canada.7.t:0 "Adrien Arcand unites the Fascists"
 better_canada.7.d:0 "Earlier today the various fascist parties of Canada held a national convention in Kingston, Ontario. There it was decided to unite all of the parties into one new party led by a particularily charismatic person called 'Adrien Arcand'. As his first action of this newly unified party Arcand held a rally at Massey Hall to promote the party. Referring himself as the 'Canadian führer' it seems he seeks to emulate the Nazi party."
 better_canada.9.t:0 "The civil war is over"
 better_canada.9.d:0 "For better or worse, the civil war is over. Only time will tell what will happen as a result of it."
 better_canada.10.t:0 "Quebéc is no longer ours"
 better_canada.10.d:0 "As a result of losing Quebéc we obviously are no longer affected by their refusal to follow conscription laws." 
 better_canada.11.t:0 "The Quebécois reaffirm their stance"
 better_canada.11.d:0 "The Quebécois remind us that they will continue to support Canada no matter what." 
 better_canada.12.t:0 "[QUE.GetName] invites [USA.GetNameDef] to the Continental Alliance"
 better_canada.12.d:0 "[QUE.GetName] has noticed that were have not alligned ourselves to any faction and requested that we form a faction with them. They cite that it'd be in both of our best interests to do so since we are neighbours." 
 better_canada.12.a:0 "Sounds good"
 better_canada.13.t:0 "[QUE.GetName] claims the East Coast"
 better_canada.13.d:0 "[QUE.GetName] has issued a statement demanding that the UK and Canada cede the east coast to them, citing the Francophone population's demands to be a part of Quebéc. Already they are posturing on the borders seemingly ready to take it by force if needed."
 better_canada.14.t:0 "[QUE.GetName] claims the French Louisiana"
 better_canada.14.d:0 "[QUE.GetName] has issued a surprising statement demanding that [USA.GetNameDef] cede what was once considered a part of French Louisiana. Already they are posturing on the borders seemingly ready to take it by force if needed."
 better_canada.15.t:0 "[QUE.GetName] revives the Continental Alliance"
 better_canada.15.d:0 "Earlier today [QUE.GetNameDef] issued a statement declaring the revival of the "Continental Alliance of 1775". They are now looking for allies to join this alliance, although it is unclear what exactly their goals are."
 better_canada.16.t:0 "[QUE.GetNameDef] takes Paris"
 better_canada.16.d:0 "Earlier today [QUE.GetNameDef], in a case of what one could call 'reverse colonlialism', has ironically conquered the French capital of Paris. Quebécois troops march along the streets in pride. Already [QUE.GetLeader] is calling for this to be a national holiday from this day forward."
 better_canada.20.d:0 "[CAN.GetNameDef] has demanded that we immediately cede Newfoundland and Labrador to them. They cite that it is an affront to have a foreign military so deep within their lands, being a direct insult to their sovereignty."
 better_canada.20.t:0 "[CAN.GetNameDef] Demands Newfoundland and Labrador"
 better_canada.20.a:0 "Very Well"
 better_canada.20.b:0 "Absolutely Not!"
 better_canada.21.t:0 "Consider the options"
 better_canada.21.d:0 "Before doing anything we must decide how we approach this. We could just outright demand the land in question however there is a probably better route. The people of Labrador would most likely vote in our favor in a referendum making it much more likely for them to accept. Of course, they can still deny afterwards but it would give our cause much more credence if they were to do so."
 better_canada.21.a:0 "Hold the referendum"
 better_canada.21.b:0 "We need no referendum"
 better_canada.22.t:0 "The Newfoundland Referendum"
 better_canada.22.d:0 "It would seem that [CAN.GetNameDef] has encouraged the population of Newfoundland and Labrador to hold a referendum. They have overwhelmingly agreed that they would like to join Canada as one nation rather than stay under our rule. We could of course deny them this but it would give reason for a war if we do."
 better_canada.22.a:0 "We mustn't deny their will"
 better_canada.22.b:0 "Now is not the time for this"
 better_canada.23.t:0 "The Newfoundland Referendum"
 better_canada.23.d:0 "Earlier today the people of Newfoundland held a referendum and overwhelmingly agreed on requesting [ENG.GetNameDef] to release them to join Canada. [ENG.GetLeader] accepted the referendum as legal and gave the returned the land to [CAN.GetNameDef], including the debt the province already had to begin with."
 better_canada.23.a:0 "Interesting"
 better_canada.23.b:0 "Excellent"
 better_canada.23.c:0 "I hope this wasn't a mistake"
 better_canada.23.f:0 "Great News!"
 better_canada.24.t:0 "The Newfoundland Referendum"
 better_canada.24.d:0 "Earlier today the people of Newfoundland held a referendum and overwhelmingly agreed on requesting [ENG.GetNameDef] to release them to join Canada. [ENG.GetLeader] refused this referendum citing that they never approved of holding such a referendum in the first place and citing it as illegal. [CAN.GetLeader] is outraged by this news and vows to liberate the lands."
 better_canada.24.a:0 "Interesting"
 better_canada.24.b:0 "If it's war they  want..."
 better_canada.24.c:0 "The land is too valuable"
 better_canada.24.f:0 "We must prepare for the worst"
 better_canada.25.t:0 "[CAN.GetNameDef] Demands St. Pierre & Miquelon"
 better_canada.25.d:0 "[CAN.GetNameDef] has demanded that we immediately cede the islands of St. Pierre & Miquelon to them. They cite that it is an affront to have a foreign island so close to their lands, being a direct insult to their sovereignty."
 better_canada.30.t:0 "[USA.GetNameDef] Cedes Alaska to [CAN.GetNameDef]"
 better_canada.30.d:0 "Earlier today [CAN.GetNameDef] demanded [USA.GetNameDef] cede Alaska to them, citing an unfair military presence as a direct insult to their sovereignty. In a surprising turn of events [USA.GetLeader] agreed and allowed the Canadians to take the state peacefully."
 better_canada.30.a:0 "I see"
 better_canada.30.b:0 "Excellent"
 better_canada.30.c:0 "Perhaps a mistake..."
 better_canada.30.f:0 "Excellent"
 better_canada.31.d:0 "Earlier today [CAN.GetNameDef] demanded [USA.GetNameDef] cede Alaska to them, citing an unfair military presence as a direct insult to their sovereignty. In an unsurprising turn of events [USA.GetLeader] strongly disagreed citing that Alaska was fairly sold to them by Russia and that they'll never give it up for free."
 better_canada.31.a:0 "I see"
 better_canada.31.b:0 "Damn"
 better_canada.31.c:0 "What were they thinking?"
 better_canada.31.f:0 "We should prepare for war"
 better_canada.31.t:0 "[CAN.GetNameDef] Demands Alaska"
 better_canada.32.t:0 "[FRA.GetNameDef] Cedes St. Pierre & Miquelon to [CAN.GetNameDef]"
 better_canada.32.d:0 "\nEarlier today [CAN.GetNameDef] demanded [FRA.GetNameDef] cede the islands of St. Pierre & Miquelon to them, citing yet again unfair military presence as a direct insult to their sovereignty. In a surprising turn of events [FRA.GetLeader] agreed and allowed the Canadians to take the islands peacefully."
 better_canada.33.t:0 "[CAN.GetNameDef] Demands St. Pierre & Miquelon"  
 better_canada.33.d:0 "Earlier today [CAN.GetNameDef] demanded [FRA.GetNameDef] cede the islands of St. Pierre & Miquelon to them, citing yet again an unfair military presence as a direct insult to their sovereignty. In an unsurprising turn of events [FRA.GetLeader] strongly disagreed citing that the locals have neither interest in leaving France, nor in joining Canada."
 better_canada.40.a:0 "Very Well"
 better_canada.40.b:0 "Absolutely Not!"
 better_canada.40.t:0 "The UK Cedes Newfoundland and Labrador to [CAN.GetNameDef]"
 better_canada.40.d:0 "Earlier today [CAN.GetNameDef] demanded [ENG.GetNameDef] cede Newfoundland and Labrador to them, citing an unfair military presence as a direct insult to their sovereignty. In a surprising turn of events [ENG.GetNameDef] agreed and allowed the Canadians to take the land peacefully."
 better_canada.40.a:0 "I see"
 better_canada.40.b:0 "Excellent"
 better_canada.40.c:0 "Perhaps a mistake..."
 better_canada.40.f:0 "Excellent"
 better_canada.41.d:0 "Earlier today [CAN.GetNameDef] demanded [ENG.GetNameDef] cede Newfoundland and Labrador to them, citing an unfair military presence as a direct insult to their sovereignty. In an unsurprising turn of events [ENG.GetNameDef] strongly disagreed citing that Newfoundland and Labrador is merely a training ground and that they should not worry about hostile activities from there."
 better_canada.41.a:0 "I see"
 better_canada.41.b:0 "Damn"
 better_canada.41.c:0 "What were they thinking?"
 better_canada.41.f:0 "We should prepare for war"
 better_canada.41.t:0 "[CAN.GetNameDef] Demands Newfoundland and Labrador"
 better_canada.43.t:0 "They were convinced"
 better_canada.43.d:0 "The population was moved to reluctantly agree to some measure of conscription. While still lower than other provinces this should give us much more room to breathe now."
 better_canada.43.a:0 "This will help"
 better_canada.44.t:0 "They remain unconvinced"
 better_canada.44.d:0 "Your pleas fell on deaf ears. They cite having no interest in participating in the war machine of the Anglophones."
 better_canada.44.a:0 "They leave us with no choice..."
 better_canada.44.b:0 "Unfortunate"
 better_canada.45.t:0 "Strict Conscription Enforcement"
 better_canada.45.d:0 "You have moved the population to action with strict enforcement. While unwilling to listen originally the population is beginning to see some merit in the urgency."
 better_canada.45.a:0 "They left us with no choice..."
 better_canada.46.t:0 "Strict Conscription Enforcement Angers Them"
 better_canada.46.d:0 "You have moved the population to action with strict enforcement. This has severly upset the population and they are more than ever refusing to help."
 better_canada.46.a:0 "This could be bad..."  
 better_canada.47.d:0 "It would seem your demands on the Québecois eventually turned into a seperatist notion. They have cut all access to the province and are declaring themselves an independent nation."
 better_canada.47.a:0 "This is bad..."
 better_canada.47.b:0 "Vive le Québec libre!"
 better_canada.48.t:0 "[QUE.GetName] secedes from [CAN.GetNameDef]"
 better_canada.48.d:0 "In an attempt to enforce conscription upon the local French populace in [CAN.GetNameDef] [CAN.GetLeader] seems to have only enraged the population in Québec instead. They have seceded from [CAN.GetNameDef] effective immediately. [CAN.GetLeader] has already called for action against this illegal move by [QUE.GetLeader]."
 better_canada.48.a:0 "Interesting"
 better_canada.48.b:0 "Only military action will help now"
 better_canada.48.c:0 "An unfortunate turn of events"
 better_canada.49.t:0 "Leduc No. 1"
 better_canada.49.d:0 "After many years of failed drilling Imperial Oil has finally discovered a massive oil reserve in Alberta by drilling deeper than they ever had before. This will surely benefit us greatly."
 better_canada.49.a:0 "Black Gold!"
 better_canada.50.t:0 "Massive Oil Discovery in [CAN.GetNameDef]"
 better_canada.50.d:0 "Imperial Oil Ltd had spent years leading up to and during the war drilling unsuccessfully for oil. Their luck changed however earlier today. By drilling deeper than they ever had before they made one final attempt to get lucky and finally succeeded. Already this is proving to be a massive economic boon for the province of Alberta."
 better_canada.50.a:0 "Interesting"
 better_canada.50.b:0 "Help it already has"
 better_canada.50.c:0 "Fantastic News!"
 better_canada.51.t:0 "Tungsten Discovery in Northwestern Canada"
 better_canada.51.d:0 "Prior to the war the exploration and development of tungsten mines was a very limited affair, generally done as a side effect of other things. More recently however we had expanded and promoted endeavours to find the rare metal in British Columbia and surrounding areas as they've always had some amounts of Tungsten. Today we finally had some success and found a fairly large reserve of it in 'Red Rose'; far in the north-west of the country."
 better_canada.51.a:0 "This will certainly help the war"
 better_canada.52.t:0 "Artificial Rubber Made in Sarnia, Ontario"
 better_canada.52.d:0 "Up until now we have heavily relied on natural rubber imported from south-east Asia. With the the nature of war however we cannot rely on that source anymore as we it may get cut-off by convoy raids. As a result Polymer Corp. had been looking into possible alternatives and finally had a breakthrough. They found the means to make something they call 'synthetic rubber'. Already it is being made in Sarnia but we should promote this research further and expand the industry."
 better_canada.52.a:0 "Excellent"
 better_canada.53.t:0 "The Question of Governance"
 better_canada.53.d:0 "Now that we've broken free we must re-organize our government. We could keep the nationalist momentum going and embrace Fascism, or we could let the people decide what to do moving forward."
 better_canada.53.a:0 "Quebéc above all else!"
 better_canada.53.b:0 "Let the people decide"
 better_canada.54.t:0 "Quebec comes to our Aid"
 better_canada.54.d:0 "We have great news, it would seem the Quebecois are finally willing to fully support the war effort. Perhaps they were swayed by our previous, more diplomatic requests for help?"
 better_canada.54.a:0 "Fantastic!"

 north_american_faction:0 "North American League"
 continental_alliance:0 "Continental Alliance"

 canada_tepid_war_response:0 "Tepid Military Enthusiasm"
 canada_tepid_war_response_desc:0 "The Canadian people are for the most part unwilling to volunteer for war. They will need convincing in one way or another."
 canada_minor_war_response:0 "Minor Military Enthusiasm"
 canada_minor_war_response_desc:0 "The Canadian people are slowly heeding the call to arms. Their hesitation is still palpable however." 
 canada_vivid_war_response:0 "Vivid Military Enthusiasm"
 canada_vivid_war_response_desc:0 "The Canadian people have awoken to the call of war eagerly volunteering to help the cause."
 canada_canadian_war_response:0 "Full Canadian Support"
 canada_canadian_war_response_desc:0 "The Canadian people throw their full weight into the war now, boasting possibly the highest volunteer rates ever seen. Whether it be at the homefront in factories, or on the war front serving their country they will give their all and even their life if need be."
 quebecois_no_conscription:0 "Conscription Refusal"
 quebecois_no_conscription_desc:0 "Canadians are reluctant to answer conscription but the Québecois are especially so. It would be better to rely solely on volunteers from Quebec lest we anger them to more radical causes."
 quebecois_minor_conscription:0 "Minor Conscription Refusal"
 quebecois_minor_conscription_desc:0 "While conscription rates are not quite where they should be in Québec they have improved quite a bit thanks to recent actions."
 idea_cd_howe:0 "Clarence Decatur Howe"
 idea_cd_howe_desc:0 "The Minister of Munitions and Supply, C.D. Howe, is a brilliant man able to coordinate both ends of the political spectrum to work together in industry."
 idea_can_repurpose:0 "Bits and Pieces"
 idea_can_repurpose_desc:0 "By using every bit and piece we can find we can turn even the most innocuous of civilian factories rapidly into military factories."
 idea_can_paratroopers:0 "The Black Devils"
 idea_can_paratroopers_desc:0 "By working together with our allies we have improved the abilities of our special forces."
 idea_d_day:0 "Preparations for D-day"
 idea_d_day_desc:0 "By having extensive plans and preperations ready for potential naval invasions we are ready to strike faster when it comes to amphibious assaults."
 idea_can_vickers:0 "Battle of the Atlantic"
 idea_can_vickers_desc:0 "We must be ready to protect our convoys by striking at the enemy's navy."
 can_winter_bonus:0 "The Cold North"
 can_winter_bonus_desc:0 "We are no strangers to severe winters. Our troops can endure the elements better both with equipment optimized for such conditions and the experiences of it first hand."
 CAN_luigi_petrucci:0 "Luigi Petrucci"
 CAN_wilfred_curtis:0 "Wilfred Curtis"
 CAN_sydney_radley_walters:0 "Sydney Radley-Walters"
 CAN_harry_g_dewolf:0 "Harry G. DeWolf"
 que_socialist_science:0 "Socialist Science"
 que_french_knowledge_idea:0 "French Investment"
 que_industrial_revolution_idea:0 "Industrial Revolution"
 que_spirit_of_quebec_idea:0 "L'Esprit du Québec"
 joseph_hout:0 "Joseph Hout"
 joseph_hout_desc:0 "During the 'Great War' this person had designed a remarkably reliable fully automatic rifle. Sadly it never was implemented as it was far too late in the war to retool the Canadian army of the time. We have called him out of retirement to design us new even better rifles for our infantry."
 QUE_joseph_felix_roy:0 "Joseph-Félix Roy"
 QUE_louis_alexandre_taschereau:0 "Louis-Alexandre Taschereau"
 QUE_e_l_patenaude:0 "E.L. Patenaude"
 QUE_generic_fascist_demagogue:0 "Adolphe Marcoux"
 QUE_generic_democratic_reformer:0 "René Chaloult"
 QUE_generic_communist_revolutionary:0 "C.A. Perry"

 CAN_rocky_mountain_rangers:0 "Rocky Mountain Rangers"
 CAN_rocky_mountain_rangers_desc:0 "We have the advantage of having a wide range of mountains right in our country. By using these we can train troops that specialize in combat in them."
 CAN_winter_lessons:0 "The Cold North"
 CAN_winter_lessons_desc:0 "We are no strangers to severe winters. Our troops can endure the elements better both with equipment optimized for such conditions and the experiences of it first hand."
 CAN_industrial_bits_and_pieces:0 "War Purchasing Board"
 CAN_industrial_bits_and_pieces_desc:0 "To this point Canada never really had a military industrial complex. We shall establish a board for the purchasing and centralisation of whatever production we do have to repurpose them to military uses."
 CAN_wartime_housing:0 "Wartime Housing Ltd"
 CAN_wartime_housing_desc:0 "Our people must be relocated to the new industrial centers. By providing quality housing as a reward we can attract worker to expand our industrial production greatly. We may even be able to retool existing industrial sectors to more useful production."
 CAN_canadian_pacific_railway:0 "Canadian Pacific Railway"
 CAN_canadian_pacific_railway_desc:0 "The Canadian Pacific Railway saw some decline during the great depression. We must make sure this extremely important railroad, which connects the west and east coasts of Canada, is up to standards. Montreal is an ideal city to task with this project."
 CAN_canadian_maritime_railway:0 "Canadian Maritime Railway"
 CAN_canadian_maritime_railway_desc:0 "A war in Europe seems inevitable. We must improve infrastructure towards the Atlantic so that we can more easily ship supplies towards the war front."
 CAN_central_investment:0 "Central Investment"
 CAN_central_investment_desc:0 "The great depression hit us hard. Let us invest in the core of our nation so that we can better transport ores mined in northern Ontario to our mills in the south of the province."
 CAN_dominion_rifle_company:0 "Long Branch Arsenal"
 CAN_dominion_rifle_company_desc:0 "If we are to properly convert our militia to a proper army we must invest in small arms production and research."
 CAN_better_canada_rowell_sirois_commission:0 "Rowell-Sirois Commission"
 CAN_better_canada_rowell_sirois_commission_desc:0 "A commission must be called in order to establish what went wrong during the Great Depression and what must be done in order to improve the Canadian economy."
 CAN_artificial_rubber:0 "Polymer Corp."
 CAN_artificial_rubber_desc:0 "Our nation is totally dependent on natural rubber from outside the nation, especially south-east Asia. By establishing the Polymer Corporation we can invest into the research of possible alternatives to natural rubber, perferably by using materials already available to us."
 CAN_natural_oil:0 "Imperial Oil Ltd"
 CAN_natural_oil_desc:0 "While Imperial Oil is not a crown company it may still be wise to invest in their efforts to find oil in Alberta. The province has proven to at least have some oil reserves thus far, but luck has not been on our side."
 CAN_industrial_build_up:0 "Bennett's New Deal"
 CAN_industrial_build_up_desc:0 "Though previously speaking out against what he saw as wasteful spending & communist ambition, R.B. saw the writing on the wall and began to model his own 'New Deal'. The progressive reforms brought new socialist policies, an attempt to gain the vote of the working class. The change came as too little too late, losing the election. His 11th hour proposal lived on, continued by the succeeding government."
 CAN_crown_companies:0 "Crown Companies"
 CAN_crown_companies_desc:0 "The Great Depression hit us hard, much like our neighbor to the south. With proper legislature and support structures we can establish various so-called Crown Companies to kickstart our industry. We should also promote the pre-existing industry, perhaps nudging them into more useful production avenues." 
 CAN_angus_shops:0 "Angus Shops"
 CAN_angus_shops_desc:0 "As in the great war the CPR will repurpose its 'Angus Shops' to the production of military equipment, like say tanks for example."
 CAN_human_capital:0 "Human Capital"
 CAN_human_capital_desc:0 "We shall prove to the world that it is not merely the quantity of workers alone that decide the productivty of your nation, but also the quality of its industrious people."
 CAN_quebecois_alumina:0 "Aluminium Company of Canada Ltd"
 CAN_quebecois_alumina_desc:0 "Canada was the birthplace of the aluminum industry, right here in Quebec. By further promoting the mining and processing of alumina we can become a great asset in the war effort."
 CAN_waste_not_want_not:0 "Canadian Cycle and Motor Co. Ltd."
 CAN_waste_not_want_not_desc:0 "The Brits had rated many of our factories as 'little better than garages'. Let us prove them wrong by making use of every factory to its full extent, no matter how poorly fit it may seem. We will adapt and repurpose civilian factories for production, making use of every 'bit and piece' we can find."
 CAN_further_conversions:0 "Industrial Engineering Ltd."
 CAN_further_conversions_desc:0 "Not every factory needs to be strictly making guns, ammo and the like. By improving tools-of-trade themselves we can more effeciently produce armaments as well."
 CAN_natural_resources:0 "The Canadian Shield"
 CAN_natural_resources_desc:0 "Canada lies directly ontop of a wide variety of minerals and natural resources ripe for the taking. This is no surprise to the already existent companies present. By both promoting the companies there, as well as expanding crown companies to further exploit nature we can lower our dependence on foreign goods, like steel."
 CAN_military_repurposing:0 "Liquid Carbonic Canadian Corporation"
 CAN_military_repurposing_desc:0 "This Québec based company produces parts for soda fountains. We can repurpose the factories to instead build tank parts, further expanding our output."
 CAN_military_focus:0 "Canadian Armed Forces"
 CAN_military_focus_desc:0 "The population is unwilling to enter a war. This is not a good start with an already small pool of manpower so we must address the urgency of the potential coming conflicts. This will take much time, but the Prime Minister is sure he can eventually make them agree the cause is just."
 CAN_army_focus:0 "A Militia No More"
 CAN_army_focus_desc:0 "Up until now our army was merely considered a militia. We must establish a set of reforms in order to become a proper 'Canadian Army'"
 CAN_general_motors_company:0 "General Motors Company"
 CAN_general_motors_company_desc:0 "We are no strangers to the industrial world. By re-purposing GM's factories we can produce trucks allowing us to motorize our armies."
 CAN_support_regiments:0 "Royal Canadian Ordnance"
 CAN_support_regiments_desc:0 "Our numbers are limited so we must make the best use possible of what we do have. By promoting support regiments we can help cut down losses on the field, both of the human and machine variety. Every bit and piece counts after all."
 CAN_ontario_steel:0 "Dominion Steel and Coal Corp."
 CAN_ontario_steel_desc:0 "This crown company was established with the help of US interests. By investing in their facilities in Nova Scotia, as well as similar companies elsewhere, we can produce substantially more steel."
 CAN_rouse_their_hearts:0 "The North Thaws"
 CAN_rouse_their_hearts_desc:0 "The House of Commons, the British Crown and most important of all the Canadian people agree that the time is now. We must stand together against a common enemy. Already Canadians are lining up to volunteer for the war."
 CAN_naval_focus:0 "Royal Canadian Navy"
 CAN_naval_focus_desc:0 "A proper fleet needs proper tactics. Let us learn from our friends the British"
 CAN_destroyers_and_cruisers:0 "Halifax Royal Naval Dockyard"
 CAN_destroyers_and_cruisers_desc:0 "We must focus the production of our fleet on smaller vessels, such as destroyers and cruisers."
 CAN_canadian_marines:0 "Lessons from Hong Kong"
 CAN_canadian_marines_desc:0 "We have learned many lessons during the joint defense of Hong Kong with the UK. We can use what we learned to train specialized troops specializing in amphibious assault and defense."
 CAN_british_columbian_dockyard:0 "Esquimalt Royal Naval Dockyard"
 CAN_british_columbian_dockyard_desc:0 "We must not forgot the Pacific theater. As such it would be best to expand our naval dock yard on Vancouver island."
 CAN_aviation_focus:0 "Royal Canadian Air Force"
 CAN_aviation_focus_desc:0 "The Royal Canadian Air Force has a lot of work to do in order to catch up with its big British brother, the RAF. What it lacks in numbers it has in quality."
 CAN_rcaf_fighters:0 "Handley Page Ltd."
 CAN_rcaf_fighters_desc:0 "This company can provide us with a new and capable range of bombers. We should start production and distribution of these immediately."
 CAN_rcaf_tac_bombers:0 "The Plan"
 CAN_rcaf_tac_bombers_desc:0 "By cooperating with our allies we can pursue even new aerial tactics and plane designs, expanding into bombers and fighters."
 CAN_canadian_naval_bombers:0 "Canadian Vickers Ltd"
 CAN_canadian_naval_bombers_desc:0 "This promising Montreal based company can be used to help design and produce aircraft, such as naval bombers."
 CAN_statute_of_westminster:0 "Statute of Westminster"
 CAN_statute_of_westminster_desc:0 "Not much time has passed since the statute that elevated us to being equals among the other nations of the commonwealth. Let us make use of this new political influence to make changes."
 CAN_commonwealth_unity:0 "Unity of the Commonwealth"
 CAN_commonwealth_unity_desc:0 "We will stand together with the commonwealth, through thick and thin. While we may be independent we still all share a common history."
 CAN_defence_of_canada:0 "In Defence of Canada"
 CAN_defence_of_canada_desc:0 "War is brewing in Europe. Although an ocean away from us we cannot simply ignore this threat. By sending volunteers to our allies we can aid in the war effort, hopefully preventing the terrors of war from visiting our shores." 
 CAN_volunteers_abound:0 "All Us Brave Canadians"
 CAN_volunteers_abound_desc:0 "Despite its inital hesitation the citizens of Canada are now exceptionally eager to help in the cause. We should encourage this to help with the war effort."
 CAN_united_we_stand:0 "United We Stand"
 CAN_united_we_stand_desc:0 "We will not be defeated! We will fight for what is right, both at home and abroad if necessary."
 CAN_soviet_heart:0 "Committee for Industrial Organization"
 CAN_soviet_heart_desc:0 "By promoting unions in general we can achieve better work and pay standards to help further the agenda pushed by 'On-to-Ottawa Trek'. This will displease the more captilastic nations of the world no doubt."
 CAN_communism_abroad:0 "Mackenzie-Papineau Battalion"
 CAN_communism_abroad_desc:0 "In the face of growing communist sentiment around the world we shall push to help those struggling against their goverments and stand as one united front. Both China and Spain have such sentiment growing that could use support."
 CAN_fascist_ambitions:0 "Loyalty to One"
 CAN_fascist_ambitions_desc:0 "We do not need the commonwealth. We shall prove to the world that we too are a strong nation capable of achieving whatever we want, by ourselves and by force if necessary."
 CAN_better_canada_camp_x:0 "Camp X"
 CAN_better_canada_camp_x_desc:0 "This training facility teaches important lessons in a variey of clandestine techniques, including tapping into and decoding enemy transmissions. It would be ideal if we expand these teachings to our allies so that they too can benefit from it. We should also extend our Pacific theater's radio range by installing a listening post on the Charlottes."
 CAN_honorary_soviets:0 "A Red Leaf Follows a Red Banner"
 CAN_honorary_soviets_desc:0 "Our people have changed; No longer do we follow the whims of a foreign crown but instead follow our own path. The Soviets applaud our recent actions and are willing to send support our way; We need only ask."
 CAN_communist_volunteers:0 "The People's Home"
 CAN_communist_volunteers_desc:0 "Our comrades come in greater and greater numbers to aid us. Together we can make this nation truely a place of wonders. Like minded people from all around the world come to us in great numbers. Let us send them 'Vancouver Island' so that we can grow closer to our friends west of us."
 CAN_better_canada_swastika_clubs:0 "Swastika Clubs"
 CAN_better_canada_swastika_clubs_desc:0 "Canada does not have a strong nationalist party, yet. By uniting the varous small and spliteren 'Swastika Clubs' into one unified party can we truly set things in motion."
 CAN_canadian_parachute_battalion:0 "Canadian Parachute Battalion"
 CAN_canadian_parachute_battalion_desc:0 "By using a superior quality, instead of quantity, of specialized troops we can penetrate deep into enemy territory to cut off their supplies. These are dangerous missions however that require specially trained personnel."
 CAN_battle_of_the_atlantic:0 "The Battle of the Atlantic"
 CAN_battle_of_the_atlantic_desc:0 "In order to deliver supplies and materials across the Atlantic we must make sure our convoys are secure. Let us do so by bombing out enemy vessels."
 CAN_d_day:0 "D-Day"
 CAN_d_day_desc:0 "A naval invasion is an inevitable part of the war. We should plan ahead for this so that we can more hastily make appropriate plans to strike anywhere on the enemy's coastline."
 CAN_canadian_special_expertise:0 "The Black Devils"
 CAN_canadian_special_expertise_desc:0 "By collaborating with our allies we can train special forces like none have ever seen. They will be stronger, faster than other soliders but most important of all: They will strike fear in the enemy."
 CAN_military_zeal:0 "Unchecked Nationalism"
 CAN_military_zeal_desc:0 "Only with a strong push towards promoting nationalism both abroad and at home can we make ourselves noticed."
 CAN_start_them_early:0 "Start Them Early"
 CAN_start_them_early_desc:0 "By reforming the school curriculums we can start promoting our zeal to even younger people, allowing a deeper pool of recruits loyal to the cause."
 CAN_lay_west_claims:0 "The Lynn Canal Dispute"
 CAN_lay_west_claims_desc:0 "The US presence in the west is unacceptable. We had previously argued with the US on this very topic before over the Lynn Canal but we must be bolder in opposition to the internation tribunal's decision. We must have all of Alaska for ourselves if we are to secure our borders properly."
 CAN_lay_east_claims:0 "The Newfoundland Referendum"
 CAN_lay_east_claims_desc:0 "The British presence in the east is unacceptable. We must have Newfoundland and Labrador for ourselves if we are to secure our borders properly."
 CAN_lay_more_east_claims:0 "Claim St. Pierre and Miquelon"
 CAN_lay_more_east_claims_desc:0 "Now that we are the rightful owners of Newfoundland and Labrador we should see about removing the French from our coastline." 
 CAN_canada_first:0 "Canada First"
 CAN_canada_first_desc:0 "We refuse to be a part of the European political machinations. Instead we will stride forth as the master of our own destiny. Perhaps the USA is interested, if they aren't already aligned anyways."
 CAN_canada_strengthen_bonds:0 "Faction Unity"
 CAN_canada_strengthen_bonds_desc:0 "We do not have the manpower to truly stand alone. Let us stand united with our faction against external threats."
 CAN_technology_sharing:0 "Technology Sharing"
 CAN_technology_sharing_desc:0 "We can collaborate with our allies on matters of technology in order to pursue our goals."
 CAN_soviet_teachings:0 "The Regina Manifesto"
 CAN_soviet_teachings_desc:0 "By merging similarily alligned parties, such as the Co-operative Commonwealth Federation, into one unified party we can further push a common agenda amongst the populace. Together we can demolish the corrupt captilalists of the world."
 CAN_our_home_and_native_land:0 "Our Home and Native Land"
 CAN_our_home_and_native_land_desc:0 "This is our home and we must protect. Let us do everything in our power to make one final push, if not for us then for our children, or our children's children."
 CAN_question_of_quebec:0 "Conscription Plebiscite"
 CAN_question_of_quebec_desc:0 "We must hold a plebiscite on the rules of conscriptions, where they may be used and to what degree the provinces must commit. This especially affects Quebec that has been mostly unofficially exempted from conscription since the conscription crisis of 1917 during the great war."
 CAN_reason_with_quebec:0 "The Québec Referendum"
 CAN_reason_with_quebec_desc:0 "They are a part of our nation their people are our people. We should reason with them diplomatically surely they will understand our cause. Especially in light of the results of the plebiscite they may have a change of heart."
 CAN_quebec_propaganda:0 "Allons-y.. Canadiens!"
 CAN_quebec_propaganda_desc:0 "Regardless of their decision we can make use of war propaganda to potentially sway the rest of Québec to listen."
 CAN_force_quebec:0 "Place Québec under Curfew"
 CAN_force_quebec_desc:0 "The results of the plebiscite have clearly shown that the majority of Canada is for the conscription changes, with the exception of Quebec. They were the sole majority voter against these changes and continue to obstruct the process. We shall place them under strict curfews to prevent another conscription crisis while enforcing the conscription."
 CAN_force_quebec_part_2:0 "Amend the War Measures Act"
 CAN_force_quebec_part_2_desc:0 "Still they refuse to fully follow conscription laws. If they will not listen to our demands we will force them to listen to them by expanding the war measures act to intern those Québecois that still refuse to adhere to the plebiscite."
 CAN_quebec_agreement:0 "The Québec Agreement"
 CAN_quebec_agreement_desc:0 "We should hold a tripartite meeting with the USA and the UK in regards to a new weapons project. Our nation has an abundant supply of uranium and the USA seems interested in using it in a so-called 'Manhatten Project'. Assisting them in this may prove to be a good idea."
 CAN_nuclear_arms:0 "The White Stars of the North"
 CAN_nuclear_arms_desc:0 "Our lands are rich in many materials, including uranium. By studying this material we could potentially make weapons that would bring horror to our enemies. It may also be prudent to research other ways to deliver frightening destruction from afar."
 
 QUE_maitre_chez_nous:0 "Maître chez nous"
 QUE_maitre_chez_nous_desc:0 "Purge all instances of English within the government to institute French as the only language of the country."
 QUE_the_continental_alliance:0 "Review the Continental Alliance of 1775"
 QUE_the_continental_alliance_desc:0 "We can never forgive what the commonwealth has done to us but we also cannot allow ourselves to completely abandon democracy. Let us send emissaries to the US to promote old alliances."
 QUE_formalize_the_constitution:0 "Formalize the Constitution"
 QUE_formalize_the_constitution_desc:0 "Up until now we never had a proper constitution. Many times one was discussed and many drafts were written and ultimately forgotten. If we are to succeed as a nation that is recognized on the world stage we must establish a proper constitution."
 QUE_united_we_stand:0 "United We Stand"
 QUE_united_we_stand_desc:0 "We must stand together with our brothers and sisters against the common enemy of now and the future."
 QUE_establish_the_continental_alliance:0 "Revive the Continental Alliance"
 QUE_establish_the_continental_alliance_desc:0 "We must stand strong on our own feet. Instead of blindly following the commonwealth and their so called 'allies' we shall instead form our own faction. Perhaps even the US is interested?"
 QUE_invite_france:0 "Ancien Régime"
 QUE_invite_france_desc:0 "France would make a powerful friend and ally in our faction. We should seek to show them that it would be in their best interest to align themselves with us instead of others. We have after all deep common ties."
 QUE_mouvement_socialiste:0 "Mouvement Socialiste"
 QUE_mouvement_socialiste_desc:0 "We shall reshape this country to be one truly for the people and its workers."
 QUE_l_experience_du_saguenay:0 "L'Expérience du Saguenay"
 QUE_l_experience_du_saguenay_desc:0 " The people of Saguenay created a local communist paradise by applying communist theory into practice. The experiment was clearly a success and the rest of the country should follow their lead."
 QUE_soviet_support:0 "Soviet Support"
 QUE_soviet_support_desc:0 "Moscow has offered to train our best officers in order to further our own agenda. We should make use of their kind offer."
 QUE_pays_pour_tous:0 "Pays pour tous"
 QUE_pays_pour_tous_desc:0 "Following the Saguenay experiment it's been decided that all of Québec is finally ready to achieve the promised people's paradise of socialism. Every man, woman and child will participate in this glorious movement which shall push us to victory against our enemies."
 QUE_french_paradise:0 "French Paradise"
 QUE_french_paradise_desc:0 "Let us expand our bliss to the Canadians. Surely they will embrace our movement and should they stubbornly refuse, well then we shall do it by force."
 QUE_continental_revolution:0 "Continental Revolution"
 QUE_continental_revolution_desc:0 "Canada's assimilation is only further proof to the world that socialism is the way forward. We can't allow treacherous capitalist pigs to rule over the populations in North America. As decided by the Council of the people we will eliminate the United State's treacherous grip on the continent."
 QUE_mouvement_nationaliste:0 "Mouvement Nationaliste"
 QUE_mouvement_nationaliste_desc:0 "The anglophones tried to supress us for long enough; it is time to take back what is ours and establish our position in the world."
 QUE_quebec_is_best:0 "Vive le Québec libre!"
 QUE_quebec_is_best_desc:0 "Emotions runs strong among the population to defend their rights and not let the colonialists put them back in a hole. Taking up arms seems like the only right thing to do."
 QUE_mass_propaganda:0 "Mass Propaganda"
 QUE_mass_propaganda_desc:0 "We must endeavour to convince every last person in Quebec in the righteousness of our cause."
 QUE_start_them_early:0 "Start Them Early"
 QUE_start_them_early_desc:0 "We shall make use of our system of Catholic schools to promote nationalism above all else. By convincing our youth we can embolden the future of our nation."
 QUE_reform_nouvelle_france:0 "Reform Nouvelle-France"
 QUE_reform_nouvelle_france_desc:0 "Nouvelle-France used to stretch all across the North American continent however that is no more. Let us begin re-establishing the grandeur of this by taking the lands east of us."
 QUE_french_louisiana:0 "Louisiane Française"
 QUE_french_louisiana_desc:0 "We should consider expanding southwards into what used to be French Louisiana so that we can fully establish ourselves as a world power."
 QUE_rochette_plan:0 "Rochette's Plan"
 QUE_rochette_plan_desc:0 "By focusing on Québec's traditional industries we can establish a solid base for our future."
 QUE_drouin_plan:0 "Drouin's Plan"
 QUE_drouin_plan_desc:0 "We must focus on the future and with it the new technologies it brings to our nation to become a modern society."
 QUE_plan_nord:0 "Plan Nord"
 QUE_plan_nord_desc:0 "Our soil is rich in minerals, be it aluminum, steel, gold or even titanium. The development of the north will sever our dependence on exterior providers and help our independence from the imperialist powers."
 QUE_foundation_of_alque:0 "Foundation of Alqué"
 QUE_foundation_of_alque_desc:0 "The Aluminium Company of Canada started the exploitation of aluminium in Saguenay and the Mauricie. By nationalizing the company and the granting exploitation rights over all of Québec the company can increase its production drastically."
 QUE_anticosti_island:0 "Anticosti Island"
 QUE_anticosti_island_desc:0 "During a probe of Anticosti Island a large reserve of oil was found. Further plans to use these ressources can be established to help fuel our war machine."
 QUE_artificial_rubber:0 "The Rubber Problem"
 QUE_artificial_rubber_desc:0 "Québec may be rich in minerals, oil and other things however there is one thing we lack: natural rubber. We must research possible alternatives to this if we are to keep building planes, vehicles and other things that require this vital resource."
 QUE_french_knowledge:0 "French Investments"
 QUE_french_knowledge_desc:0 "French foreign investors as well as our very own brilliant minds could make a potent combination for the future of our nation."
 QUE_metropolitan_quebec:0 "Metropolitan Québec"
 QUE_metropolitan_quebec_desc:0 "We must improve the infrastucture along the Saint-Laurent. By doing so we can more easily expand the reach of our industry along it."
 QUE_industrialize_the_north:0 "Bringing in the Northern Resources"
 QUE_industrialize_the_north_desc:0 "The north is absolutely rich with resources, however until now we only barely scratched the surface. By expanding our infrastructure and promoting civil expansion in the area can we really tap into these resources."
 QUE_quebec_railway:0 "Roberval and Saguenay Railway"
 QUE_quebec_railway_desc:0 "By nationalizing this railway we can continue to promote the northwards expansion from Saguenay."
 QUE_caisse_de_depot:0 "Creation of the Caisse de dépôt"
 QUE_caisse_de_depot_desc:0 "To promote our industries the creation of the Caisse by the government will provide financing to the people of Québec as well as helping foreign investors notice us."
 QUE_industrial_revolution:0 "Industrial Revolution"
 QUE_industrial_revolution_desc:0 "With careful city planning, as well as proper construction practices, we can maximize our land usage for factories."
 QUE_expand_valcartier:0 "Expand Valcartier"
 QUE_expand_valcartier_desc:0 "With the help of the old 22nd Royal Regiment we can expand our military production in the area to fulfill our military needs."
 QUE_citadelle_of_quebec:0 "Citadelle of Québec"
 QUE_citadelle_of_quebec_desc:0 "We must fortify our capital if it is not to fall to even a gentle breeze."
 QUE_sorel_development:0 "Develop Sorel-Tracy"
 QUE_sorel_development_desc:0 "With Sorel-Tracy being a strong industrial centre already we can further promote the development of military factories. This will provide workers and easy deliveries of goods to military bases."
 QUE_military_college:0 "Military Collège of Trois-Rivières"
 QUE_military_college_desc:0 "The urbanisation of the Saint-Lawrence has brought more people from the surrounding regions looking for work and education. This college will provide us with quality officers as well as topnotch research into possible military equipment."
 QUE_quebec_national_forces:0 "Québecois Militia"
 QUE_quebec_national_forces_desc:0 "Similar to Canada we've never had a proper army. We should make steps to properly equip and train our men if we are to survive in this new era."
 QUE_inuit_and_first_nations:0 "The Inuit and First Nations"
 QUE_inuit_and_first_nations_desc:0 "We face a problem of not having enough manpower for extended military campaigns, perhaps we should see if the local natives might be convinced to help. For a long time these peoples have been living on the very edge of society perhaps even solely due to anglophone aggressions. Perhaps we can reach out to them and see if they require and help. They may even consider helping us."
 QUE_fulfill_promises:0 "Fulfill Promises"
 QUE_fulfill_promises_desc:0 "By completing our end of the bargain the natives have agreed to be more actively involved in the nation going forward even going so far so to commit a sizeable portion to help defend against any possible enemies."
 QUE_political_asylum:0 "Political Asylum"
 QUE_political_asylum_desc:0 "There is no lack of 'unwanted' people being unjustly imprisoned due to vague nationalist backgrounds. We should embrace these displaced and mistreated Japanese, German and other nationalities and provide to them the same we would our own citizens."
 QUE_welcome_refugees:0 "A New Home"
 QUE_welcome_refugees_desc:0 "The Jewish populace are escaping the horrors of the nazi war machine even as we speak. We should help their escape and even settled them down in our lands as proper citizens. Not only would they most likely be happy to work together with our people, they may even be convinced to fight for us as well."
 QUE_support_france:0 "Support France"
 QUE_support_france_desc:0 "France has been conquered their government in exile. Perhaps we should invite their government to our lands as well as openly take any and all French exiles in our nation, similar to the Jews and other victims of this war."
 QUE_volunteers_force:0 "Civil Volunteers"
 QUE_volunteers_force_desc:0 "By inspiring the people we can reach out to them to volunteer, young and old alike. In doing so they can greatly expedite the expansion of our industry. Every little bit helps."
 QUE_foreign_embassies:0 "Foreign Embassies"
 QUE_foreign_embassies_desc:0 "To legitimize our nation in the eyes of the nations of world we must establish foreign embassies in their countries, as well as allow them to establish the same here. By doing so hopefully we can gain global recognition as a seperate political entity to Canada."
 QUE_support_the_faction:0 "Support Our Allies"
 QUE_support_the_faction_desc:0 "We must stand strong with our allies if we are to succeed. Let us promote this thought with the people in the hopes that more will enlist."
 QUE_technology_sharing:0 "Technology Sharing"
 QUE_technology_sharing_desc:0 "We can collaborate with our allies on matters of technology in order to pursue our goals."
 QUE_industrial_ingenuity:0 "Industrial Ingenuity"
 QUE_industrial_ingenuity_desc:0 "Our industry is truly a wonder to behold. By promoting the smartest in the field we can push even further technologically. What we don't have in numbers, we have in heart and spirit instead."
 QUE_huot_automatic_rifle:0 "Huot's Automatic Rifles"
 QUE_huot_automatic_rifle_desc:0 "During the 'Great War' a local Québecois blacksmith designed a fantastically reliable full automatic rifle. Sadly it never saw production as it was too late in the war. We should seek out this individual to improve our weaponry for upcoming conflicts."
 QUE_french_officers:0 "Foreign Officers"
 QUE_french_officers_desc:0 "Our officers leave much to desire. We should invite foreign officers to help educate our own perhaps even to teach at our military college."
 QUE_engineer_spirit:0 "Engineer Spirit"
 QUE_engineer_spirit_desc:0 "We should adapt our armies to make better use of support brigades."
 QUE_army_theory:0 "The Theories of Trois-Rivières"
 QUE_army_theory_desc:0 "By further expanding and promoting our already existant military colleges we can improve our doctrines."
 QUE_commandos:0 "Forces Spéciales"
 QUE_commandos_desc:0 "Our troops are already well accustomed to fighting in harsh climates and conditions. We should nurture this by taking our best and training them even further so that these conditions become a boon, rather than a malus, to our troops."
 QUE_bombardier_limited:0 "L’Auto-Neige Bombardier Limitée"
 QUE_bombardier_limited_desc:0 "We should promote this company. They already make snowmobiles with the ability to easily change the front skis into wheels. This can be expanded upon to our troops as versatile motorized, or even mechanized, infantry. In addition they show promise of being a viable producer of planes given the means to do so."
 QUE_bombardier_b12:0 "Bombardier B12"
 QUE_bombardier_b12_desc:0 "Thanks to our investments Bombardier has managed to produce a mechanized variant of their snowmobiles, called the 'B12'. We should immediately start rolling this out to aid our efforts."
 QUE_montreal_locomotive_works:0 "Montreal Locomotive Works"
 QUE_montreal_locomotive_works_desc:0 "Similar to our investments into 'Bombardier' we should invest into this company. They are a prime candidate to promote the production of towed artillery as well as light tanks."
 QUE_light_tanks:0 "Light Army, Light Tanks"
 QUE_light_tanks_desc:0 "The MLW has made some breakthroughs in the design of light tanks and would like our permission to make use of them. We need only give the word."
 QUE_grand_strategy:0 "Grand Strategy"
 QUE_grand_strategy_desc:0 "An army is no good without support, both on land and in the skies. Neither is an airforce without feet on the ground. Our plans should make the most effecient use of their combined arms if we are to succeed."
 QUE_quebec_national_army:0 "Québec National Army"
 QUE_quebec_national_army_desc:0 "Finally, we truly have an army. There is however one last front, the home front. Let us unite the people driving home the importance of austerity in this time of war. With the people fully behind us we can push our military industrial complex to its very limits."
 QUE_naval_bombing:0 "Bomb Their Ships"
 QUE_naval_bombing_desc:0 "Our navy is very lacking, however our air force is something to behold. We should make use of it to destroy the enemy fleet; for what good is fleet if it can't even fight back?"
 QUE_tac_bomber:0 "Cut Them Off"
 QUE_tac_bomber_desc:0 "Similar to their fleets we should also bomb their production sites directly. By cutting of their supplies and reinforcements we can starve them out."
 QUE_rule_the_skies:0 "Rule The Skies"
 QUE_rule_the_skies_desc:0 "In order to maintain our bombing runs we must protect our bombers themselves. Therefore we should push for the control of the skies, allowing us to bomb them with impunity."


 CAN_east_claims_forts:0 "§YCanada§!: Fortifies the provinces and ports near Labrador and Newfoundland's border\n"
 CAN_west_claims_forts:0 "§YCanada§!: Fortifies the provinces and ports near [USA.GetNameDef]'s border\n"
 quebecois_propaganda_tooltip:0 "The people of Québec will eventually come to agree with us to start fully adhering to conscription calls.\n§GPatience will be rewarded.§!"
 home_and_native_land_other_effect:0 "This may convince more volunteers to sign up down the road.\n"
 quebec_angry:0 "Ignoring the wishes of Québec will §Ranger§! them\n"
 quebec_extremely_angry:0 "Ignoring the wishes of Québec will §Rgreatly anger§! them"
 imperial_oil_tooltip:0 "A concerted effort for the discovery of more oil will begin in §YAlberta§!\n"
 polymer_corp_tooltip:0 "A concerted effort for an alternative to rubber will begin in §YSouthern Ontario§!\n"
 que_population_migrates_north:0 "§Y300000§! people will migrate from §YSouthern Québec§! to §YNorthern Québec§! to follow the expansion of jobs settling in previously empty land.\n"
 que_claim_french_louisiana:0 "You will gain cores on the entirety of §YFrench Louisiana§!\n"
 canada_leaves_allies_tooltip:0 "Canada will §Yleave the Allies§!\n"
 que_independence_start:0 "Quebec is Independent"

 ### QUE - QUEBEC ###
 QUE_submarine_1:0 "L Class"
 QUE_submarine_1_desc:0 "The L-class were medium sized boats originally planned under the Emergency War Program as an improved version of the previous submarine classes. They were built in the late stages of World War I and were equipped with new, larger 21 in. torpedoes. They served until the beginning of World War II when they were mostly used for secondary and training duties."
 QUE_submarine_2:0 "T Class"
 QUE_submarine_2_desc:0 "The T-class or Triton-class boats were designed to replace the O, P, and R class large submarines. They were moderately large submarines with long range well-suited for the Atlantic and Pacific Ocean. These boats were well-armed, stable platforms and were used extensively during the conflict, as 25 percent of the constructed boats were lost during the war."
 QUE_submarine_3:0 "U Class"
 QUE_submarine_3_desc:0 "The U class were small-sized submarines built under the War Emergency 1940 and 1941 Programs. Originally designed as training submarines as the war broke out, the design changed, allowing these submarines to prove useful in the confined waters of the North Sea and the Mediterranean. Due to their smaller size, their range and the weaponry were limited. Three subclasses made up the class: Undine, Umpire and Uproar."
 QUE_submarine_4:0 "V Class"
 QUE_submarine_4_desc:0 "The V-class or Vampire-class submarines were based on the previous U-class smaller sized boats. They were larger but still relatively small, with better seagoing ability but limited operational range and weaponry."
 QUE_destroyer_1:0 "V/W Class"
 QUE_destroyer_1_desc:0 "These destroyers included the Admirality and Thornycroft V and W classes. They were built under the War Emergency Program. They were the ultimate evolution of British destroyer design during the First World War, embodying the improvements of their predecessors as well as new technological advances. Large numbers of these ships were built during the late stages of WWI and became the backbone of the Royal Navy's destroyer flotillas afterwards. Beginning in the 1930s, they were placed into reserve fleets, used eventually relegated to convoy escort duties. They were adequately-armed, fast vessels with good range."
 #QUE_destroyer_1b: "Sanguenay Class"
 QUE_destroyer_2:0 "Ottawa Class"
 QUE_destroyer_2_desc:0 "The Ottawa class was the Canadian designation for British G, H, and I class destroyers ordered as part of the 1933 and 1934 Naval Construction Programs. They were generally repeats of the preceding F class, with a slight reduction in size. Armament in the G and H classes was the same as in the F class, with both using on the 4.7 in. guns. These ships had long range, were adequately armed, and had a strong torpedo complement. They were used extensively during the war and suffered numerous losses."
 #QUE_destroyer_2b: "Athabaskan Class"
 QUE_destroyer_3:0 "J/K/N Class"
 QUE_destroyer_3_desc:0 "The J, K, and N classes were similar to the earlier Tribal class but rather than emphasizing gun armament, the designers returned to a more standard heavy torpedo and lighter gun setup. The ships were modified throughout their wartime service. Upgrades included improved anti-aircraft guns and radar. They were fast, long-ranged and well-armed vessels ideal for fleet escorts."
 QUE_destroyer_4:0 "Algonquin Class"
 QUE_destroyer_4_desc:0 "The Algonquin class was the Canadian designation for British Battle-class destroyers. The ships were ordered as part of the 1942 and 1943 Naval Programs. They were well-armed in terms of both their guns and their torpedoes. Their AA armament ASW capabilities, speed, and range made them versatile vessels. Their late introduction to the war led to a minimal contribution."
 QUE_light_cruiser_1:0 "C Class"
 QUE_light_cruiser_1_desc:0 "C-class light cruisers were a group of twenty-eight light cruisers of the Royal Navy. They were built before and during the First World War for the rough conditions of the North Sea. They proved to be rugged and capable vessels despite being somewhat small and cramped. Their armament was more than satisfactory, as they carried enough 6 in. guns to fight enemy surface targets and a heavy torpedo load to finish off enemy vessels and convoys. They saw extensive use during WWI and participated in many surface actions. Only a limited number of the vessels survived the scrap head to WWI. Only the Caledon, Ceres, and Carlisle subclasses were in service by the mid 1930's."
 QUE_light_cruiser_2:0 "Southampton Class"
 QUE_light_cruiser_2_desc:0 "The Southampton-class light cruisers were a subclass of the Town-class cruisers and were designed to counter the Japanese Mogami-class cruisers. These vessels were well-armored, had good speed and range, and carried a formidable armament of twelve 6 in. guns in four triple turrets. They were the basis for many of the subsequent RN wartime light cruiser designs."
 QUE_light_cruiser_3:0 "Quebec Class"
 QUE_light_cruiser_3_desc:0 "The Quebec class was the Canadian designation for British Crown Colony-class light cruisers. These were improved versions of the earlier Town class but with a simplified design to speed up construction and reduce costs. The ships carried the same guns as their predecessors, four triple turrets housing 6 in. guns. They were similarly armored but because of their smaller engines, their range were somewhat reduced. The type included two subclasses - Fiji and Ceylon."
 QUE_light_cruiser_4:0 "Ontario Class"
 QUE_light_cruiser_4_desc:0 "The Ontario class was the Canadian designation for British Minotaur-class (or Swiftsure-class) light cruisers. These cruisers were designed as a modified version of the Crown Colony class, incorporating war modifications that were authorized in 1941. They had a longer operational range and more numerous AA weaponry than the Crown Colony class, while the main armament was reduced to three triple turrets."
 QUE_heavy_cruiser_1:0 "Hawkins Class"
 QUE_heavy_cruiser_1_desc:0 "The Hawkins-class cruisers were the first heavy cruisers in the world. They were based on the earlier Town-class light cruisers, particularly the Birmingham subclass, but equipped with 7.5 in. guns and a thicker armor belt. They were designed to fight the large convoy raiders of Germany. They were well-armed, had reasonable speed and range, and good protection. Altogether, five ships were commissioned but only four were active at the start of WWII."
 QUE_heavy_cruiser_2:0 "Surrey Class"
 QUE_heavy_cruiser_2_desc:0 "The Surrey-class heavy cruisers were proposed under the 1928 Naval Program. They were improved versions of the earlier York-class heavy cruisers. Had they been completed, they would have been equipped with four twin 8 in. gun turrets, heavier armor, and more powerful engines. Two ships were ordered but none were laid down."
 QUE_heavy_cruiser_3:0 "Admiral Class"
 QUE_heavy_cruiser_3_desc:0 "The Admiral-class heavy cruisers (not to be confused with the Admiral-class battlecruisers) were the Royal Navy's last attempt to design and build cruisers armed with 8 in. guns. Design studies started in 1938 and ended in 1941, resulting in various proposals. The final proposals featured new 8 in. guns in triple turrets, a heavy AA armament, thick armor, and good speed. A lack of enemy cruisers and the cost efficiency of these vessels resulted in a focus on building more light cruisers instead."
 QUE_heavy_cruiser_4:0 "Churchill Design"
 QUE_heavy_cruiser_4_desc:0 "These ships were proposed by Sir Winston Churchill, Lord of the Admirality, in the early stages of WWII to counter the German Deutschland class big gun cruisers. These vessels would have had 9.2 in. cannons, heavy AA, and strong armor. They were designed to effectively battle the enemy capital ships. The ships were eventually cancelled because of high costs and a lack of demand for a new heavy cruiser. "
 QUE_battle_cruiser_1:0 "Renown Class"
 QUE_battle_cruiser_1_desc:0 "The Renown-class battlecruisers were originally laid down as improved versions of the Revenge-class battleships. Their construction was suspended at the outbreak of WWI. Admiral Lord Fisher managed to restart their construction as battlecruisers. These ships were the quintessential battlecruiser. They were well-armed, fast, and maneuverable, but had thinner armor and a shorter operational range. Only two of the original three ships, Repulse and Renown, were completed."
 QUE_battle_cruiser_2:0 "Princess Royal Class"
 QUE_battle_cruiser_2_desc:0 "The Princess Royal was a class of hypothetical battlecruisers that were a faster and cheaper version of the King George V-class battleships. These vessels carried a similar but reduced armament for both surface and anti-air combat: two triple 14 in. cannons and six twin 5.25 in. AA guns. Their fast speed and long range would provide the Royal Navy quick strike capabilities and convoy protection, but their limited armor would prove problematic if they had to fight modern battleships."
 QUE_battleship_1:0 "Queen Elizabeth Class"
 QUE_battleship_1_desc:0 "The Queen Elizabeth-class battleships were ordered under the 1912 Naval Program. These ships were the first to be equipped with 15 in. guns, and were considered the first fast battleships. They carried heavy armament for both primary and secondary roles and their thick armor made these vessels excellent warships, ideal for protecting the vast British Empire. Six ships were ordered but only five were commissioned and later modernized prior to WWII."
 QUE_battleship_2:0 "King George V Class"
 QUE_battleship_2_desc:0 "The King George V-class battleships were the result of the 1922 Washington and 1930 First London Naval Treaties which limited the maximum displacement and gunnery of capital ships. As such, these ships were equipped with smaller-caliber cannons than earlier and even contemporary battleships. Despite the smaller caliber, the ships were adequately armed, carried strong AA weaponry, and had adequate protection. Five ships were ordered and laid down as replacement for the old Queen Elizabeth Class battleships."
 QUE_battleship_3:0 "Lion Class"
 QUE_battleship_3_desc:0 "The Lion-class battleships were the follow-up class to King George V battleships, incorporating many of their features. Six ships were ordered in the 1938 Naval Program to replace the aging Revenge-class battleships but none were finished due to the erupting hostilities. The vessels would have been general similar to the King George-class, but the main armament would be heavier, introducing a new 16 in. cannon. They would also have thicker armor and more powerful engines."
 QUE_battleship_4:0 "Vanguard Class"
 QUE_battleship_4_desc:0 "The Vanguard-class battleship was the last battleship to be built for the Royal Navy. A single ship was ordered but four more were considered for the Pacific theater. Ordered under the 1940 Emergency War Program, construction did not gain a high priority and was finished after the war. The class had a sleek hull, which gave it an excellent stability and seaworthiness. The armament was the same as the Queen Elizabeth and Revenge class battleships, providing considerable firepower. Strong engines and good armor made the vessel fast and well protected."
 QUE_SH_battleship_1:0 "Centurion Class"
 QUE_SH_battleship_1_desc:0 "The Centurion was a class of hypothetical heavy battleships of the Royal Navy built to counter the large vessels of the German and Japanese navies. Large 18 in. guns and thick armor provide the ship with the necessary firepower and protection to battle these vessels. Strong AA armament, long range, and good speed were a necessity to cover the vast seas of the British Empire."
 QUE_SH_battleship_2:0 "Lion II Class"
 QUE_SH_battleship_2_desc:0 "The Lion II class battleships were designed in 1944 as an improved version of the earlier Lion-class battleship. Incorporating wartime lessons, this design was larger and heavier, and if completed, would carry either three or four triple 16 in. guns of the latest type. Thick armor plates protected the ship from any surface or aerial foe. The cost to build these ships, the defeat of enemy navies, and the need for aircraft carriers resulted in the abandonment of the project."
 QUE_carrier_1:0 "Courageous Class"
 QUE_carrier_1_desc:0 "These three aircraft carriers were converted battlecruisers and were the first fleet carriers of the Royal Navy. Their conversion was the result of the Washington Naval Treaty of 1922 and the work was finished in 1925. They were moderately-armored but well-armed vessels, with long range and good speed, but due to the nature of the conversion their aircraft complement was limited. Nonetheless, they gave the Royal Navy important experience in aircraft carrier construction and fleet air projection."
 QUE_carrier_2:0 "Ark Royal Class"
 QUE_carrier_2_desc:0 "The Ark Royal aircraft carrier was the first such vessel to be built to fit the restrictions of the Washington Naval Treaty. She was the first ship on which the hangars and flight deck were an integral part of the hull. Designed in 1934, the vessel was well-armored and armed. It carried a large complement of aircraft and had adequate operational range and speed to keep up with the major forces of the Royal Navy."
 QUE_carrier_3:0 "Illustrious Class"
 QUE_carrier_3_desc:0 "The Illustrious class was designed within the restrictions of the Second London Naval Treaty of 1936, which limited carrier size to an upper limit of 23,000 tons. She was the first British carrier to have an armored flight deck, which reduced its air group size. Heavy armor and AA weaponry provided a strong defense for the ships, while powerful engines and a large fuel store gave the ships long operational range."
 QUE_carrier_4:0 "Implacable Class"
 QUE_carrier_4_desc:0 "The Implacable-class aircraft carriers were ordered under the 1938 Naval Program and were essentially improved versions of the earlier Illustrious class. The war and the shift of priority to smaller vessels for convoy protection duties in the early and middle stages of the war slowed the constriction of these vessels. They were larger vessels able to carry more planes while maintaining thick armor on both the hull and flight deck. More powerful engines gave it greater speed and operational range compared to the Illustrious class."

 QUE_motorized_equipment_1:0 "Canadian Military Pattern"
 QUE_motorized_equipment_1_short:0 "CMP"
 QUE_motorized_equipment_1_desc:0 "Produced by Chevrolet, Ford Canada and crown corporations, the CMP was a designation for canadian trucks. They were used for transportation, supply, and utilities."

 QUE_mechanized_equipment_1:0 "M3 White"
 QUE_mechanized_equipment_1_short:0 "M3 White"
 QUE_mechanized_equipment_1_desc:0 "An earlier version of the half tracks, high speed and low capacity. Seeing considerable use in Commonwealth forces."

 QUE_mechanized_equipment_2:0 "C15TA"
 QUE_mechanized_equipment_2_short:0 "C15TA"
 QUE_mechanized_equipment_2_desc:0 "An armoured truck, capable of carrying heavy equipment and infantry. Plannned modifications included a half track variant as well as a full track, for harsh terrain and northern Canada."

 QUE_mechanized_equipment_3:0 "Ram Kangaroo"
 QUE_mechanized_equipment_3_short:0 "Kangaroo"
 QUE_mechanized_equipment_3_desc:0 "An armoured personnel carrier conversion of the Ram tank. So successful it started to be adopted by all Commonwealth forces."

 QUE_gw_tank_equipment:0 "M1917"
 QUE_gw_tank_equipment_short:0 "M17"
 QUE_gw_tank_equipment_desc:0 "Canada bought and obtained some two hundred M1917's from the U.S. at scrap prices and used them to equip her early armoured corps."

 QUE_light_tank_equipment_1:0 "Vickers Light"
 QUE_light_tank_equipment_1_short:0 "Vickers Light"
 QUE_light_tank_equipment_1_desc:0 "The Vickers Canada built a complete series of these light tanks, including an earlier tankette. The standard and most produced being the Vickers Light VI."

 QUE_light_tank_equipment_2:0 "Matilda"
 QUE_light_tank_equipment_2_short:0 "Matilda"
 QUE_light_tank_equipment_2_desc:0 "A good amount of Matilda's were produced in Canadian factories, with most heading overseas for British use, the rest remaining as training tanks."

 QUE_light_tank_equipment_3:0 "Valentine VI"
 QUE_light_tank_equipment_3_short:0 "Valentine"
 QUE_light_tank_equipment_3_desc:0 "Canada produced hundreds of Valentines for the lend lease programs, with many ending up in the Soviet Union."

 QUE_light_tank_artillery_equipment_1:0 "2/3 inch Mortar Carrier"
 QUE_light_tank_artillery_equipment_1_short:0 "Mortar Carrier"
 QUE_light_tank_artillery_equipment_1_desc:0 "A 2pdr mortar or 3 inch mortar placed in the open chasis of an earlier model."

 QUE_light_tank_artillery_equipment_2:0 "Matilda Close Support"
 QUE_light_tank_artillery_equipment_2_short:0 "Matilda CS"
 QUE_light_tank_artillery_equipment_2_desc:0 "A Matilda armed with a QF 3 inch howitzer."

 QUE_light_tank_artillery_equipment_3:0 "Valentine Bishop"
 QUE_light_tank_artillery_equipment_3_short:0 "Bishop"
 QUE_light_tank_artillery_equipment_3_desc:0 "A QF 25 pdr mounted on a Valentine chasis, a powerful self propelled gun."

 QUE_light_tank_destroyer_equipment_1:0 "2pdr Carrier"
 QUE_light_tank_destroyer_equipment_1_short:0 "Carrier 2pdr"
 QUE_light_tank_destroyer_equipment_1_desc:0 "The 2pdr Carrier was an anti-tank conversion of the Carden Lloyd chasis and later Windsor and Vicker lights."

 QUE_light_tank_destroyer_equipment_2:0 "Matilda Black Prince"
 QUE_light_tank_destroyer_equipment_2_short:0 "Matilda Black Prince"
 QUE_light_tank_destroyer_equipment_2_desc:0 "A larger gun mounted on the Matilda using the turret of a Centaur."

 QUE_light_tank_destroyer_equipment_3:0 "Valentine Archer"
 QUE_light_tank_destroyer_equipment_3_short:0 "Archer"
 QUE_light_tank_destroyer_equipment_3_desc:0 "The Archer uses the powerful QF 17 pdr gun, and its low silhouette gives it an advantage."

 QUE_light_tank_aa_equipment_1:0 "Vickers Anti-Air"
 QUE_light_tank_aa_equipment_1_short:0 "Vickers Light AA"
 QUE_light_tank_aa_equipment_1_desc:0 "Four 15mm Besa machineguns placed in a modified turret on a Vickers Light Mk VI."

 QUE_light_tank_aa_equipment_2:0 "Matilda Bofors"
 QUE_light_tank_aa_equipment_2_short:0 "Matilda Bofors"
 QUE_light_tank_aa_equipment_2_desc:0 "A concept involving mounting a 40mm Bofors on the Matilda tank by removing the turret and parts of the chasis or introducing a modified turret."

 QUE_light_tank_aa_equipment_3:0 "Crusader Anti-Air"
 QUE_light_tank_aa_equipment_3_short:0 "Crusader AA"
 QUE_light_tank_aa_equipment_3_desc:0 "Dual Oerlikon 20mm guns mounted in a modified turret."

 QUE_medium_tank_equipment_1:0 "Ram I"
 QUE_medium_tank_equipment_1_short:0 "Ram"
 QUE_medium_tank_equipment_1_desc:0 "The Ram was a Canadian designed and produced tank, with over 2,000 produced. With several variants being made, such as the Ram II, Skink, and Sexton."

 QUE_medium_tank_equipment_2:0 "Grizzly I"
 QUE_medium_tank_equipment_2_short:0 "Grizzly"
 QUE_medium_tank_equipment_2_desc:0 "A Canadian version of the M4 sherman, sporting better armour and a efficient design. Production starting in 1942."

 QUE_medium_tank_equipment_3:0 "Centaur"
 QUE_medium_tank_equipment_3_short:0 "Centaur"
 QUE_medium_tank_equipment_3_desc:0 "The Centaur was a rival version of the Cromwell, the main Centaur being used was the Centaur IV. "

 QUE_medium_tank_artillery_equipment_1:0 "Sexton I"
 QUE_medium_tank_artillery_equipment_1_short:0 "Sexton"
 QUE_medium_tank_artillery_equipment_1_desc:0 "The Sexton was a very successful self propelled gun. It was based on the Ram's chasis."

 QUE_medium_tank_artillery_equipment_2:0 "Sexton II"
 QUE_medium_tank_artillery_equipment_2_short:0 "Sexton II"
 QUE_medium_tank_artillery_equipment_2_desc:0 "The Sexton II was a conversion of the Grizzlys chasis, it used the QF 25pdr."

 QUE_medium_tank_artillery_equipment_3:0 "Centaur IV"
 QUE_medium_tank_artillery_equipment_3_short:0 "Centaur IV"
 QUE_medium_tank_artillery_equipment_3_desc:0 "A Centaur armed with a 95 mm Howitzer."

 QUE_medium_tank_destroyer_equipment_1:0 "Ram QF 3.7 inch"
 QUE_medium_tank_destroyer_equipment_1_short:0 "Ram 32pdr"
 QUE_medium_tank_destroyer_equipment_1_desc:0 "A plan to mount the QF 3.7 inch AA gun on the Ram chasis to make it a tank destroyer, it no further than testing."

 QUE_medium_tank_destroyer_equipment_2:0 "QF 17pdr Achilles"
 QUE_medium_tank_destroyer_equipment_2_short:0 "Achilles"
 QUE_medium_tank_destroyer_equipment_2_desc:0 "A motor carriage based on the M4 chassis, or in this case the Grizzly chassis. It used the 17 pounder gun and was a very mobile tank destroyer."

 QUE_medium_tank_destroyer_equipment_3:0 "Charioteer"
 QUE_medium_tank_destroyer_equipment_3_short:0 "Charioteer"
 QUE_medium_tank_destroyer_equipment_3_desc:0 "The FV4104 Charioteer was based on the Cromwell and Centaur chassis. It uses the 20pdr gun."

 QUE_medium_tank_aa_equipment_1:0 "Ram AA Mk I"
 QUE_medium_tank_aa_equipment_1_short:0 "Ram AA 'Huot'"
 QUE_medium_tank_aa_equipment_1_desc:0 "A concept involving the mounting of two 20mm Polsten anti air auto cannons."

 QUE_medium_tank_aa_equipment_2:0 "Grizzly 'Skink'"
 QUE_medium_tank_aa_equipment_2_short:0 "Skink"
 QUE_medium_tank_aa_equipment_2_desc:0 "With only 3 built, the Skink was a self propelled Anti Air gun using Quadruple 20mm Polsten guns in a fully enclosed cast turret."

 QUE_medium_tank_aa_equipment_3:0 "Centaur AA Mk I"
 QUE_medium_tank_aa_equipment_3_short:0 "Centaur AA"
 QUE_medium_tank_aa_equipment_3_desc:0 "A conversion of the Centaur, using dual 20mm Polsten guns and the Crusader Mk III AA Mk II & Mk III turrets."

 QUE_heavy_tank_equipment_1:0 "Vickers III"
 QUE_heavy_tank_equipment_1_short:0 "Vickers III"
 QUE_heavy_tank_equipment_1_desc:0 "A multi-turret tank, only 3 built. The concept itself being made to confront other mutli turret tanks, the tank was seen as useless. A good what-if."

 QUE_heavy_tank_equipment_2:0 "Churchill"
 QUE_heavy_tank_equipment_2_short:0 "Churchill"
 QUE_heavy_tank_equipment_2_desc:0 "While having produced their own churchills, their first use by the Canadians was at Dieppe, having been gifted them by the English. "

 QUE_heavy_tank_equipment_3:0 "Churchill II Oke"
 QUE_heavy_tank_equipment_3_short:0 "Churchill Oke"
 QUE_heavy_tank_equipment_3_desc:0 "A rather more powerful breakthrough tank, its secondary armament being the Ronson flamethrower"

 QUE_heavy_tank_artillery_equipment_2:0 "Churchill Close Support"
 QUE_heavy_tank_artillery_equipment_2_short:0 "Churchill CS"
 QUE_heavy_tank_artillery_equipment_2_desc:0 "A Churchill V armed with a 95mm Howitzer."

 QUE_heavy_tank_artillery_equipment_3:0 "Churchill AVRE"
 QUE_heavy_tank_artillery_equipment_3_short:0 "Churchill AVRE"
 QUE_heavy_tank_artillery_equipment_3_desc:0 "A design made by Canadian Engineers after their expierence at Dieppe."

 QUE_heavy_tank_destroyer_equipment_1:0 "Vickers Alecto"
 QUE_heavy_tank_destroyer_equipment_1_short:0 "Alecto"
 QUE_heavy_tank_destroyer_equipment_1_desc:0 "Though not based on the Vickers III chassis, the Alecto was based on a later Vickers chasis."

 QUE_heavy_tank_destroyer_equipment_2:0 "Churchill Gun Carrier"
 QUE_heavy_tank_destroyer_equipment_2_short:0 "Churchill 3 inch"
 QUE_heavy_tank_destroyer_equipment_2_desc:0 "The 3.5 inch gun 20 cwt was put in a ball mount in the chasis, the idea was to create a powerful tank destroyer." 

 QUE_heavy_tank_destroyer_equipment_3:0 "Churchill Black Prince"
 QUE_heavy_tank_destroyer_equipment_3_short:0 "Black Prince"
 QUE_heavy_tank_destroyer_equipment_3_desc:0 "A churchill tank using the deadly 17 pounder." 

 QUE_heavy_tank_aa_equipment_1:0 "Vickers III AA"
 QUE_heavy_tank_aa_equipment_1_short:0 "A6E1"
 QUE_heavy_tank_aa_equipment_1_desc:0 "The Vickers III with an Anti Aircraft turret."

 QUE_heavy_tank_aa_equipment_2:0 "Churchill AA"
 QUE_heavy_tank_aa_equipment_2_short:0 "Churchill AA Mk I"
 QUE_heavy_tank_aa_equipment_2_desc:0 "Though there were no plans for a self propelled anti air gun using the Churchill chassis, one could imagine it would've used a turret designed to hold dual or quadruple Polsten guns."

 QUE_heavy_tank_aa_equipment_3:0 "Churchill 3.7 inch"
 QUE_heavy_tank_aa_equipment_3_short:0 "Churchill AA Mk II"
 QUE_heavy_tank_aa_equipment_3_desc:0 "A radical design, removing the chasis and parts of the hull to make a platform for the QF 3.7 inch Anti Air gun."

 QUE_super_heavy_tank_equipment_1:0 "Excelsior"
 QUE_super_heavy_tank_equipment_1_short:0 "Excelsior"
 QUE_super_heavy_tank_equipment_1_desc:0 "After the disastrous Dieppe Raid, there was questions about the Churchill and its abilties. A better infantry and heavy tank was proposed."

 QUE_modern_tank_equipment_1:0 "Centurion"
 QUE_modern_tank_equipment_1_short:0 "Centurion"
 QUE_modern_tank_equipment_1_desc:0 "The Centurion would become the important staple tank of the Canadian military long into the Cold War."

 QUE_modern_tank_artillery_equipment_1:0 "FV 3082"
 QUE_modern_tank_artillery_equipment_1_short:0 "FV 3082"
 QUE_modern_tank_artillery_equipment_1_desc:0 "A self propelled 25 pounder artillery based on the Centurion."

 QUE_modern_tank_destroyer_equipment_1:0 "FV4004 Conway"
 QUE_modern_tank_destroyer_equipment_1_short:0 "Conway"
 QUE_modern_tank_destroyer_equipment_1_desc:0 "A self propelled gun using a 120mm gun."

 QUE_modern_tank_aa_equipment_1:0 "Centurion AA 20mm"
 QUE_modern_tank_aa_equipment_1_short:0 "Centurion AA"
 QUE_modern_tank_aa_equipment_1_desc:0 "A Centurion with a modified turret that houses 20mm Polsten guns."

 QUE_fighter_equipment_0:0 "Grumman Goblin"
 QUE_fighter_equipment_0_short:0 "Goblin"
 QUE_fighter_equipment_0_desc:0 "The Grumman Goblin or G-5 was produced by the Canadian Car & Foundry Co under liscense and was pressed into Canadian service under the designation Goblin I."

 QUE_fighter_equipment_1:0 "Hawker Hurricane"
 QUE_fighter_equipment_1_short:0 "Hurricane"
 QUE_fighter_equipment_1_desc:0 "The Hawker Hurricane was produced under liscense by the Canadian Car & Foundry Co and other facilities, becoming a staple fighter for the early part of the war."

 QUE_fighter_equipment_2:0 "P40 Kittyhawk"
 QUE_fighter_equipment_2_short:0 "Kittyhawk"
 QUE_fighter_equipment_2_desc:0 "A successful fighter, the Kittyhawk was adored by Canadian pilots using it. They were operated mostly in the Alaskan and Aluetian campaigns by Canadians. They were modified to use Rolls-Royce Merlin engines to increase performance."

 QUE_fighter_equipment_3:0 "Supermarine Spitfire"
 QUE_fighter_equipment_3_short:0 "Spitfire"

 QUE_heavy_fighter_equipment_1:0 "Bristol Bolingbroke"
 QUE_heavy_fighter_equipment_1_short:0 "Bolingbroke"
 QUE_heavy_fighter_equipment_1_desc:0 "The Bolingbroke was a modfied Blenheim, and it played an important role in protecting Canadian coastline in World War Two."

 QUE_heavy_fighter_equipment_2:0 "Lockheed Hudson"
 QUE_heavy_fighter_equipment_2_short:0 "Hudson"

 QUE_heavy_fighter_equipment_3:0 "de Havilland Mosquito BVII"
 QUE_heavy_fighter_equipment_3_short:0 "Mosquito B"

 QUE_strat_bomber_equipment_1:0 "Handley Page Halifax"
 QUE_strat_bomber_equipment_1_short:0 "Halifax"

 QUE_strat_bomber_equipment_2:0 "Avro Lancaster"
 QUE_strat_bomber_equipment_2_short:0 "Lancaster"

 QUE_strat_bomber_equipment_3:0 "Avro Lincoln"
 QUE_strat_bomber_equipment_3_short:0 "Lincoln"

 QUE_jet_fighter_equipment_1:0 "de Havilland Vampire"
 QUE_jet_fighter_equipment_1_short:0 "Vampire"

 QUE_jet_fighter_equipment_2:0 "Avro CF 100 Canuck"
 QUE_jet_fighter_equipment_2_short:0 "Canuck"

 QUE_jet_strat_bomber_equipment_1:0 "Vickers Valiant"
 QUE_jet_strat_bomber_equipment_1_short:0 "Valiant"

 QUE_tac_bomber_equipment_0:0 "Douglas B-18 Digby"
 QUE_tac_bomber_equipment_0_short:0 "Digby"

 QUE_tac_bomber_equipment_1:0 "Avro Anson"
 QUE_tac_bomber_equipment_1_short:0 "Anson"

 QUE_tac_bomber_equipment_2:0 "Handley Page Hampden"
 QUE_tac_bomber_equipment_2_short:0 "HP.52"

 QUE_tac_bomber_equipment_3:0 "NA B25 Mitchell"
 QUE_tac_bomber_equipment_3_short:0 "B25 Mitchell"

 QUE_jet_tac_bomber_equipment_1:0 "de Havilland Venom"
 QUE_jet_tac_bomber_equipment_1_short:0 "Venom"

 QUE_jet_tac_bomber_equipment_2:0 "English Electric Canberra"
 QUE_jet_tac_bomber_equipment_2_short:0 "Canberra"

 QUE_nav_bomber_equipment_1:0 "Blackburn Shark"
 QUE_nav_bomber_equipment_1_short:0 "Shark"
 QUE_nav_bomber_equipment_1_desc:0 "Introduced in 1933, it soon picked up interest with the Canadian Air Force. adding seven to their arsenal in 1936. Overall owning 26 or more of the craft at the end of the war."

 QUE_nav_bomber_equipment_2:0 "Fairey Albacore"
 QUE_nav_bomber_equipment_2_short:0 "Albacore"

 QUE_nav_bomber_equipment_3:0 "Fairey Barracuda"
 QUE_nav_bomber_equipment_3_short:0 "Barracuda"

 QUE_CAS_equipment_1:0 "Fairey Battle"
 QUE_CAS_equipment_1_short:0 "Battle"

 QUE_CAS_equipment_2:0 "Northrop Nomad"
 QUE_CAS_equipment_2_short:0 "Nomad"

