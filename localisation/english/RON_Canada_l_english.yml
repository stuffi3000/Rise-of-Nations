 ##### can_dark.1 - The Bryce Report, 1907
 can_dark.1.t:0 "The Bryce Report"
 can_dark.1.d:0 "Dr Peter Bryce, chief medical officer of the Department of Indian Affairs, has inspected fifteen residential schools in the western provinces and reported upon 1 537 children. Between twenty-four and twenty-five in the hundred are dead. In one school whose registers are complete the figure is sixty-nine in the hundred. He attributes it to buildings unfit for occupation, to tubercular children admitted deliberately, and to a per-capita grant that rewards enrolment and not survival. The report is not confidential. It has been printed, and the Department must decide what to do with it."
 can_dark.1.a:0 "Withdraw it from circulation"
 can_dark.1.b:0 "Fund the sanatoria and the day schools"
 can_dark.1.c:0 "Publish it and let Parliament read it"

 ##### can_dark.2 - Deskaheh goes to Geneva, 14 July 1923
 can_dark.2.t:0 "Deskaheh Goes to Geneva"
 can_dark.2.d:0 "Levi General, Deskaheh, speaker of the hereditary council of the Six Nations of the Grand River, has laid a petition before the League of Nations at Geneva. He asks that the Six Nations be heard as a state in treaty with the Crown, not as wards of a department. He travelled on a Haudenosaunee passport, several small powers are willing to give him a hearing, and Ottawa was not consulted before he went. London has asked what our position is."
 can_dark.2.a:0 "The matter is one of domestic jurisdiction"
 can_dark.2.b:0 "Let the League hear him"

 ##### can_dark.3 - The RCMP at Ohsweken, 7 October 1924
 can_dark.3.t:0 "The Mounted Police at Ohsweken"
 can_dark.3.d:0 "Having declared the question a domestic one, the government must now settle it at home. The hereditary council is to be dissolved and an elected council installed under the Indian Act. The council house at Ohsweken holds the records and the wampum belts, and the council will not adjourn of its own motion. There is no longer a question of whether. There is only a question of how."
 can_dark.3.a:0 "Dissolve it by force and take the records"
 can_dark.3.b:0 "Dissolve it by Order-in-Council and hold the election"

 ##### can_dark.4 - Deskaheh dies in exile, 25 June 1925
 can_dark.4.t:0 "Deskaheh Dies in Exile"
 can_dark.4.d:0 "Levi General died at Tuscarora, in the State of New York, a few miles from the Grand River and unable to cross to it: the passport he left on was not recognised for his return, and the government would not issue him another. He was fifty-two. His last address was made over a borrowed radio, and it was about the treaties."
 can_dark.4.a:0 "Note it"

 ##### can_dark.5 - Order-in-Council P.C. 695, 21 March 1931
 can_dark.5.t:0 "Order-in-Council P.C. 695"
 can_dark.5.d:0 "The Order is signed. Admission to Canada is henceforth confined to British subjects and citizens of the United States with means to maintain themselves, to agriculturists with capital enough to farm, and to the wives and minor children of men already lawfully here. Everyone else is refused at the port. It is the narrowest immigration policy the Dominion has ever had, and no vote of the House was required for it."
 can_dark.5.a:0 "The Order is signed"

 ##### can_dark.6 - Thirty thousand names
 can_dark.6.t:0 "Thirty Thousand Names"
 can_dark.6.d:0 "The Department has now removed some thirty thousand people from the country since 1930. Deportations of immigrants who have become a public charge are running at six times the figure of the twenties. Among them are men deported for holding meetings, and men deported because a relief officer struck them off a list. The registers are complete and they are not going to be published."
 can_dark.6.a:0 "File the registers"

 ##### can_dark.7 - P.C. 1324 expires, 5 October 1911
 can_dark.7.t:0 "The Order Lapses"
 can_dark.7.d:0 "Order-in-Council P.C. 1324 is repealed today without ever having been proclaimed. It was never needed. The border officers have their instructions, the medical examinations are thorough where they are meant to be thorough, and the agents in Oklahoma have been eloquent about the winter. In the year of the Order some fifteen hundred people were turned back. Nothing has been written down that anyone can produce."
 can_dark.7.a:0 "Nothing was written down"

 ##### can_dark.8 - The St. Louis, June 1939 (door closed)
 can_dark.8.t:0 "The St. Louis"
 can_dark.8.d:0 "The liner St. Louis has been refused at Havana and refused off the Florida coast, and is now standing off our own. There are 907 passengers aboard, all of them holding papers of one kind or another, all of them Jewish, and none of them within any class our Order admits. A petition signed by Toronto clergymen and university men has reached the Prime Minister. The Immigration Branch advises that the matter is not a Canadian question. She has coal enough to return to Europe."
 can_dark.8.a:0 "The Order stands"

 ##### can_dark.9 - The St. Louis, June 1939 (door open)
 can_dark.9.t:0 "The St. Louis"
 can_dark.9.d:0 "The liner St. Louis has been refused at Havana and refused off the Florida coast, and is now standing off our own with 907 passengers aboard. Since the ports were opened, the Immigration Branch has no ground on which to refuse them and knows it. There is no decision to take here. There are berths to find, and a landing to arrange at Halifax."
 can_dark.9.a:0 "Let them land"

 ##### can_dark.10 - The ledger presented, 1 January 1946
 can_dark.10.t:0 "The Ledger Is Presented"
 can_dark.10.d:0 "The war is over and the country means to be heard as a middle power. Before that, the Opposition, the press and two of our own commissions have begun to add up what was done at home while it was being fought: the internments without charge, the removals, the orders in council that nobody had to vote for. The Prime Minister is asked in the House whether the government intends to inquire into any of it."
 can_dark.10.a:0 "Appoint a royal commission"
 can_dark.10.b:0 "The Dominion has other business"

 ##### can_dark.11 - The repatriation orders rescinded, 24 January 1947
 can_dark.11.t:0 "The Repatriation Orders"
 can_dark.11.d:0 "The orders of December 1945 provided for the deportation to Japan of those who had signed for repatriation while in the camps, and of their dependants. Nearly four thousand have gone, more than half of them Canadian-born, a good many of them children who signed nothing. The Supreme Court has divided; the Judicial Committee has upheld the orders as lawful. Lawful is not the question being asked in the churches and in the Commons this month."
 can_dark.11.a:0 "Rescind the orders"
 can_dark.11.b:0 "Rescind them, and return their property"
 can_dark.11.c:0 "Rescind them, and compensate them"

 ##### can_dark.12 - The joint committee reports, 1948
 can_dark.12.t:0 "The Joint Committee Reports"
 can_dark.12.d:0 "The special joint committee of the Senate and the House of Commons has sat for two years upon the Indian Act. It has heard the councils, the churches and the Department, and it recommends the revision of the Act, the ending of compulsory enfranchisement, and the gradual replacement of the residential schools by day schools. It recommends. It does not enact, and the drafting will take three more years."
 can_dark.12.a:0 "Announce the revision"
 can_dark.12.b:0 "Table the report and adjourn"

 ##### can_dark.13 - The evidence that survived, 1949
 can_dark.13.t:0 "The Evidence That Survived"
 can_dark.13.d:0 "In the ordinary course of business the Department has destroyed its files in regular lots, on written authority, according to the retention schedule: the school registers, the inspection reports, the correspondence about the deaths. What is left is what happened to be duplicated elsewhere. There is no decision here. There is a shelf, and it is shorter than it was."
 can_dark.13.a:0 "Note it"

 ##### Ledger - date windows carried by available, never by visible
 CAN_pc_1324_window_tt:0 "The Order stands on the register from §Y12 August§! and lapses of its own accord on §Y5 October 1911§!."
 CAN_the_oliver_act_window_tt:0 "Section 49A is on the books from §Y1911§!. It falls out of departmental use after §Y1929§!."
 CAN_the_exclusion_act_window_tt:0 "The Bill of 1923 is before the House. It cannot be taken up after §Y1934§!."
 CAN_deport_the_undesirables_window_tt:0 "Removals under the Order run from §Y1931 to 1935§!. After that the relief rolls fall and the trains stop."
 CAN_open_the_doors_window_tt:0 "The Order of 1931 can be set aside at any time before §Y1939§!."
 CAN_patriate_the_court_tt_privy_council:0 "The Judicial Committee had been the guarantor of provincial right, and Quebec knows it: the Bar of Montreal will not thank the Ministry for bringing the last appeal home."
 CAN_ready_aye_ready_gate_tt:0 "The Chanak crisis has been answered with §YReady, aye ready§!, or the Commons have voted the contingent. If the telegram never reached Ottawa at all, the Ministry is free to answer as it pleases."
 CAN_parliament_will_decide_gate_tt:0 "The Chanak crisis has been answered with §YParliament will decide§!, or the Commons have withheld the contingent. If the telegram never reached Ottawa at all, the Ministry is free to answer as it pleases."
