 ##### 1907 - the Colonial Conference becomes Imperial
 can_imperial.1.t:0 "The Colonial Conference Becomes Imperial"
 can_imperial.1.d:0 "London, the fifteenth of April. The Conference has voted to call itself an Imperial Conference, to meet once in four years, and to write the word Dominion into its own record as something other than a Crown colony. Behind the vocabulary there is a proposal.\n\nMr. Lyttelton's Secretariat would sit permanently in Downing Street between conferences, correspond directly with each Dominion, prepare the agenda and - the part Sir Wilfrid has not failed to notice - decide what is on it. Mr. Deakin of Australia is enthusiastic. The Colonial Office is more enthusiastic still.\n\nThe Canadian answer is being waited for, and it will be quoted for forty years."
 can_imperial.1.a:0 "A Dominion is not a branch of the Colonial Office."
 can_imperial.1.b:0 "The Empire must be able to speak with one voice."

 ##### 1903 - the Alaska award
 can_imperial.2.t:0 "The Award of the Twentieth of October"
 can_imperial.2.d:0 "The Alaska Boundary Tribunal has ruled. Six impartial jurists of repute, the treaty said: three of them are Mr. Root, who is Secretary of War, Senator Lodge, who has said in print what he intends to find, and Mr. Turner, who is of the same mind.\n\nLord Alverstone, Lord Chief Justice of England, has voted with them. On the width of the coastal strip, on the heads of the inlets, on the division of the islands of the Portland Channel. The Dominion receives no deep-water port giving upon the Yukon, and the sea is closed to the whole of the northern country.\n\nSir Louis-Amable Jetté and Mr. Aylesworth have refused to sign the award. The Canadian case was not weak. It was traded, and the Prime Minister has said so in the House: we have no power to protect ourselves, because the treaty-making power lies elsewhere."
 can_imperial.2.a:0 "London has sold us."
 can_imperial.2.b:0 "London can no longer speak for us."
 can_imperial.2.c:0 "The Tribunal has ruled, and the Dominion abides by it."

 ##### 1914 - the King is at war
 can_imperial.3.t:0 "The King is at War, and Therefore So Are We"
 can_imperial.3.d:0 "There is no telegram to answer, no debate to hold, no vote to take. The King has declared war, and there is one King. The proclamation covers Halifax and Victoria exactly as it covers Portsmouth, and it did so from the hour it was signed, without the Dominion being asked, consulted, or informed in advance.\n\nParliament will meet in special session on the eighteenth of August, and it will meet to vote money and men for a war the country has been in for a fortnight. Sir Wilfrid, from the Opposition benches, has already given the answer of his party: ready, aye ready.\n\nIn Ontario the recruiting offices are full before the orders arrive. In Quebec the newspapers point out, in language of scrupulous loyalty, that the Dominion has just discovered what its status is worth."
 can_imperial.3.a:0 "There is no other answer to give."

 ##### 1922 - the Chanak telegram
 can_imperial.4.t:0 "The Chanak Telegram"
 can_imperial.4.d:0 "The Prime Minister read it in the Saturday papers. The communiqué was released to the press in London before the cipher reached Ottawa, and it asks the Dominions - publicly, and therefore in a manner that makes refusal an act - for contingents against Mustafa Kemal at the Dardanelles.\n\nNew Zealand has offered a battalion within the day. Newfoundland has followed. Australia has grumbled and agreed. Mr. Meighen is at Toronto this week and will certainly repeat Sir Wilfrid's phrase back at the Government: ready, aye ready, we stand by you.\n\nThere is no British Empire delegation now, no war, and no vote of any Parliament. There is a newspaper, and an answer to give."
 can_imperial.4.a:0 "Parliament will decide."
 can_imperial.4.b:0 "Ready, aye ready."
 can_imperial.4.c:0 "Summon Parliament, and let the Commons answer London."

 ##### 1923 - Lapointe signs alone
 can_imperial.5.t:0 "Lapointe Signs Alone"
 can_imperial.5.d:0 "The Convention for the Preservation of the Halibut Fishery of the Northern Pacific Ocean is a small treaty about a flat fish. It has been signed at Washington by Mr. Lapointe, Minister of Marine and Fisheries, and by nobody else.\n\nThe British Ambassador attended, was not asked to sign, and reported the fact to London within the hour. The Foreign Office has protested that the Crown is one and indivisible and that no Dominion may bind it alone. The Prime Minister answered that if His Excellency's signature were required, Canada would negotiate its next treaty without informing him.\n\nThe Senate at Washington has ratified with a reservation of its own. The precedent stands: the Dominion has made a treaty, and the Empire has not fallen down."
 can_imperial.5.a:0 "The Foreign Office may protest to whom it pleases."

 ##### 1926 - the King-Byng affair, first screen
 can_imperial.6.t:0 "The Customs Report"
 can_imperial.6.d:0 "The Committee on the Customs Department has reported. It is a catalogue of smuggling on the Vermont line conducted with the assistance of officers of the Crown, and it declines, carefully, to name a Minister.\n\nMr. Stevens has moved his amendment of censure. Mr. Woodsworth has moved an amendment to the amendment for a Royal Commission. Mr. Fansher of the Progressives is attempting a fusion of the two that nobody understands. The Chair has ruled, the House has overturned the ruling of the Chair, and the Government has now lost a division on the floor.\n\nThe Ministry has sixteen fewer seats than the Opposition and has governed for eight months on Progressive sufferance. That sufferance is spent."
 can_imperial.6.a:0 "Ask His Excellency for a dissolution."
 can_imperial.6.b:0 "Meet the censure, and take the verdict of the House."

 ##### 1926 - second screen, Byng refuses
 can_imperial.7.t:0 "His Excellency Declines to Sign"
 can_imperial.7.d:0 "The Governor General has refused the dissolution.\n\nLord Byng holds that a Parliament eight months old cannot be sent to the country twice in a year, that the leader of the largest party has never been asked to try, and that the reserve power exists for exactly this. He offered to consult London before deciding; the Prime Minister forbade it, and His Excellency agreed - which settles at least one constitutional question in Canada's favour and leaves the other wide open.\n\nNo representative of the Crown has refused the advice of a Canadian Prime Minister within living memory. The Government must now resign, or find some higher authority than the man who has just refused it."
 can_imperial.7.a:0 "Resign this afternoon, and let Mr. Meighen try."
 can_imperial.7.b:0 "Appeal over His Excellency's head, to the King himself."

 ##### 1926 - third screen, the division
 can_imperial.8.t:0 "The Second of July, Two in the Morning"
 can_imperial.8.d:0 "Mr. Meighen has been in office four days. To avoid the by-elections that swearing in full Ministers would force, he has appointed acting Ministers without portfolio, and the whole front bench of the Government is therefore composed of men who have taken no oath of office.\n\nThe former Prime Minister has spent three days demonstrating to the House, with the statute in his hand, that the Ministry does not legally exist. The Progressives, who brought down one Government a week ago, have listened.\n\nThe House has sat through the night. The bells are ringing for the division."
 can_imperial.8.a:0 "Divide the House."

 ##### 1926 - outcome A, the Ministry falls
 can_imperial.9.t:0 "Ninety-Five to Ninety-Four"
 can_imperial.9.d:0 "The Ministry is defeated by [?CAN_kb_noes|0] votes to [?CAN_kb_ayes|0]. One vote, at two in the morning, cast by a Progressive member who had spent the evening being persuaded.\n\nHis Excellency has granted Mr. Meighen the dissolution he refused a week ago to his predecessor - which is the whole of the argument, handed to the Opposition free of charge, and the country will be told so in every constituency.\n\nThe question is no longer whether a Governor General may refuse advice. It is whether he represents the King, or the Government at London. After this, no representative of the Crown in Canada will try it again, and the Imperial Conference in the autumn will find the ground already prepared."
 can_imperial.9.a:0 "The Crown acts on the advice of Canadian Ministers, and on no other."

 ##### 1926 - outcome B, the Ministry survives
 can_imperial.10.t:0 "The Ministry Holds"
 can_imperial.10.d:0 "The Government carries the division by [?CAN_kb_ayes|0] votes to [?CAN_kb_noes|0]. The acting Ministers remain acting, the legality of the front bench remains a matter of opinion, and the House rises at half past two.\n\nHis Excellency has been vindicated in the only way that counts: he refused a dissolution, the man he sent for was able to govern, and the constitution worked exactly as the textbooks at Westminster say it should.\n\nThe reserve power of the Governor General is now a live instrument of Canadian government rather than a dead letter, and every Prime Minister after this one will govern knowing it."
 can_imperial.10.a:0 "The King's representative has proved that he may say no."

 ##### 1930 - a five-cent piece
 can_imperial.11.t:0 "A Five-Cent Piece"
 can_imperial.11.d:0 "The question was about relief for the unemployed of the provinces, and the answer came across the floor without notes:\n\n§YMay I say that I would not give a single cent to any Tory government.§!\n\nThe Opposition was on its feet before he finished. Pressed, he went further, and the words went into Hansard exactly as spoken: not a five-cent piece.\n\nThere are more than three hundred thousand men out of work. Seven of the nine provinces have Conservative governments. The session ends in six weeks."
 can_imperial.11.a:0 "Not a five-cent piece."
 can_imperial.11.b:0 "Open the federal purse; the unemployed are not Tories."

 ##### 1935 - the Riddell telegram
 can_imperial.12.t:0 "The Canadian Proposal"
 can_imperial.12.d:0 "Dr. Riddell is Advisory Officer of the Dominion at Geneva. The post is one of observation. He has this week proposed to the Committee of Eighteen that oil, coal, iron and steel be added to the sanctions against Italy, and the international press has christened it, within a day, the Canadian proposal.\n\nHe had no instruction from Ottawa. The Government is ten days old, the Prime Minister is on holiday, and the Under-Secretary was not consulted either.\n\nItaly has let it be known that an oil embargo would be answered as an act of war. The Dominion has one delegate at Geneva, no instructions on file, and a Quebec that will not go to war over Abyssinia."
 can_imperial.12.a:0 "Canada owns the proposal."
 can_imperial.12.b:0 "Ottawa will not answer today."

 ##### 1935 - the Riddell affair
 can_imperial.13.t:0 "The Riddell Affair"
 can_imperial.13.d:0 "The oil sanction is before the Committee, and it is being called the Canadian proposal in every capital in Europe.\n\nMr. Lapointe, acting for the Prime Minister, is to make a statement to the press this afternoon. The draft on the desk says that the opinion expressed by Dr. Riddell was his own personal opinion, that it was not an opinion of the Canadian Government, and that the Dominion does not undertake to lead the world in these matters.\n\nThe Under-Secretary is for it: no commitments in advance, none at all, ever. The delegate at Geneva has not been told."
 can_imperial.13.a:0 "Dr. Riddell expressed only his personal opinion."
 can_imperial.13.b:0 "The Government stands behind its delegate."

 ##### 1938 - Kingston and Woodbridge
 can_imperial.14.t:0 "Kingston, and Forty-Eight Hours"
 can_imperial.14.d:0 "The President of the United States came up to take an honorary degree at Kingston, and said this from the platform:\n\n§YThe people of the United States will not stand idly by if domination of Canadian soil is threatened by any other empire.§!\n\nIt is the first time a President has given a guarantee to any part of the British Empire, and he gave it without asking London or Ottawa. Half the country is relieved. The Imperialist press is asking, correctly, what the Dominion is expected to give in exchange.\n\nThere is a ploughing match at Woodbridge on Saturday, and the Prime Minister is billed to speak."
 can_imperial.14.a:0 "Answer at Woodbridge: our soil will not be a road to the United States."
 can_imperial.14.b:0 "The Dominion says nothing."

 ##### The House decides
 can_imperial.15.t:0 "The House Will Decide"
 can_imperial.15.d.contingent:0 "The Commons have been summoned, the galleries are full, and the question before the House is whether a contingent of Canadian troops shall leave the Dominion.\n\nThe Government has moved the address. The Opposition is divided, the Quebec members are counted and re-counted in every lobby, and the whips of both parties have stopped predicting.\n\nTwo hundred and forty-five members. The bells are ringing."
 can_imperial.15.d.declaration:0 "The Cabinet has met, the proclamation is drafted, and it will not be signed until the Commons have voted it.\n\nThis is the whole of the Statute of Westminster reduced to one afternoon: the King is at war and the Dominion is not, and will not be, until two hundred and forty-five members in this room say so. A week has passed since London went in. The Government has asked for the address in reply, and the House is dividing on it.\n\nOne member has already given notice that he will vote against, alone, and be listened to in silence."
 can_imperial.15.d.confidence:0 "The Order-in-Council is signed and the men are going overseas, and the House must now say whether the Ministry that signed it still has its confidence.\n\nThe Quebec members have caucused for three days. The Minister who resigned is in his place below the gangway. The Opposition will vote against on the ground that the measure is too little, and a part of the Government's own following will vote against on the ground that it is a betrayal, which means the two of them are in the same lobby for opposite reasons.\n\nTwo hundred and forty-five members. There is no third answer."
 can_imperial.15.a:0 "Divide the House."

 ##### The House carries
 can_imperial.16.t:0 "Carried"
 can_imperial.16.d.contingent:0 "Carried, [?CAN_house_ayes|0] to [?CAN_house_noes|0]. The contingent will sail, and it will sail with the authority of Parliament behind it - which is not the same thing as sailing on the authority of a telegram, and every man in the House knows the difference.\n\nThe Dominion has committed itself. It has also established, for the first time, that it is the Dominion that commits itself."
 can_imperial.16.d.declaration:0 "Carried, [?CAN_house_ayes|0] to [?CAN_house_noes|0]. The proclamation will be signed at Ottawa, by the Governor General, on the advice of Canadian Ministers, and it will bear a date of its own.\n\nA week separates it from the British declaration. The week is the point. The Dominion is at war because its Parliament voted it, and there is now a precedent that no future Government can be argued out of."
 can_imperial.16.d.confidence:0 "Carried, [?CAN_house_ayes|0] to [?CAN_house_noes|0]. The Ministry stands, the Order-in-Council stands, and the men go.\n\nThe Government has spent everything it had in Quebec to hold the division, and it will find that out at the next election rather than this afternoon."
 can_imperial.16.a:0 "The House has spoken."

 ##### The House refuses
 can_imperial.17.t:0 "The Motion Is Lost"
 can_imperial.17.d.contingent:0 "Lost, [?CAN_house_noes|0] to [?CAN_house_ayes|0]. No contingent will leave the Dominion.\n\nThe Government has been told by its own Parliament that the country will not be committed, and there is nothing whatever to be done about it except to send the answer to London tonight. The Opposition benches are quiet. The members from Quebec are not."
 can_imperial.17.d.declaration:0 "Lost, [?CAN_house_noes|0] to [?CAN_house_ayes|0]. The address in reply is refused, and the proclamation stays in the drawer.\n\nThe King is at war. The Dominion is not. It is an answer no colony could have given and no Dominion had ever given, and the Governor General has already asked, in writing, what he is to tell London."
 can_imperial.17.d.confidence:0 "Lost, [?CAN_house_noes|0] to [?CAN_house_ayes|0]. The Ministry no longer has the confidence of the House.\n\nThe Government that carried the country through the war has been broken by the one question it spent five years promising never to ask. The Cabinet is meeting tonight and there is no arrangement of the same men that answers the arithmetic."
 can_imperial.17.a:0 "The House has withheld its word."

 ##### 1942 - the Combined Chiefs
 can_imperial.18.t:0 "The Combined Chiefs of Staff"
 can_imperial.18.d:0 "The machinery for running the war has been settled at Washington between two Governments. A Combined Chiefs of Staff, a Combined Munitions Assignments Board, a Combined Raw Materials Board, a Combined Shipping Adjustment Board - and two members on each.\n\nThe Dominion has the third army in the alliance in the field, feeds Britain, trains the aircrew of five nations, escorts the North Atlantic and has just handed over a billion dollars as a gift. It has no seat on any of the four boards, and no answer to its request for one beyond an assurance that its interests will be borne in mind.\n\nThe Prime Minister will host both leaders at Quebec next year, in his own citadel, and be photographed between them on the terrace. He will not be in the room."
 can_imperial.18.a:0 "Our interests will be borne in mind."

 ##### 1940 - Churchill takes it badly
 can_imperial.19.t:0 "Mr. Churchill Takes It Badly"
 can_imperial.19.d:0 "The agreement at Ogdensburg was made in a railway car in the President's train, written on the back of a memorandum, and announced before London was told. It creates a Permanent Joint Board on Defence: the first military commitment the Dominion has ever entered into outside the Empire, made in the month when the Empire could least afford to be reminded of it.\n\nThe telegram from Downing Street is courteous and it is not friendly. It observes that all these transactions will be judged in an after-time, that supreme sacrifices are being made here and not there, and that a Dominion which insures itself with Washington while Britain fights alone may find the policy read in a certain light.\n\nAn answer is expected."
 can_imperial.19.a:0 "We present our apologies to the Prime Minister."
 can_imperial.19.b:0 "Remind him who holds the line of the St. Lawrence."

 ##### 1946 - Alexander of Tunis
 can_imperial.20.t:0 "Another Briton at Rideau Hall"
 can_imperial.20.d:0 "Field Marshal the Viscount Alexander of Tunis has been appointed Governor General of Canada. He is a distinguished soldier, he commanded Canadians in Italy, he is personally liked by everyone who has met him, and he is a British peer appointed on the recommendation of a British Prime Minister to represent the King in a country that has just fought a world war as a principal.\n\nThe Statute of Westminster is fifteen years old. Canadian citizenship comes into force in January. The Dominion sits on the Security Council. And Rideau Hall has never once been occupied by a Canadian.\n\nNobody has raised the matter. It would be a simple thing to raise."
 can_imperial.20.a:0 "Receive His Excellency."
 can_imperial.20.b:0 "Ask the King for a Canadian."

 ##### 1947 - the UNTCOK crisis
 can_imperial.21.t:0 "The Commission on Korea"
 can_imperial.21.d:0 "The General Assembly has named Canada to the Temporary Commission on Korea without asking whether Canada wished to serve. The Prime Minister read the list in the newspaper and has been in a state of controlled fury since.\n\nHis case is that Korea is a quarrel between the great powers, that a Dominion of twelve millions has no business standing between them, and that the whole affair will end with Canadian names attached to somebody else's failure. He is not certainly wrong.\n\nThe Secretary of State for External Affairs and the Under-Secretary have both stated that they will resign if the appointment is withdrawn. Between them they are the Department. The Cabinet meets in the morning."
 can_imperial.21.a:0 "Withdraw the Canadian member."
 can_imperial.21.b:0 "Let the Minister have his way."

 ##### 1948 - the first Newfoundland referendum
 can_imperial.22.t:0 "The Third of June"
 can_imperial.22.d:0 "Newfoundland has voted, for the first time since it surrendered self-government in 1934.\n\n§YResponsible Government: 44.6 per cent.\nConfederation with Canada: 41.1 per cent.\nCommission of Government: 14.3 per cent.§!\n\nNo choice has a majority, and so there will be a second ballot with the Commission struck off. The fourteen per cent who voted for government by six appointed officials must now choose between a country and a province, and nobody in St. John's can predict them.\n\nWhat Ottawa does in the next seven weeks decides whether the Dominion acquires an Atlantic seaboard or a neighbour."
 can_imperial.22.a:0 "Put the whole weight of Ottawa behind Confederation."
 can_imperial.22.b:0 "Let Newfoundlanders decide without our money."
 can_imperial.22.c:0 "Sound out Washington about Gander and Argentia."

 ##### 1948 - the second Newfoundland referendum
 can_imperial.23.t:0 "The Twenty-Second of July"
 can_imperial.23.d:0 "About a hundred and fifty thousand Newfoundlanders have voted a second time, in the outports and in the city, in a campaign conducted largely by radio and almost entirely by two men who dislike each other.\n\nThe returns are in from every district. The margin is not large and it will not be disputed: it is the answer, and the Convention that was called to find one has found it."
 can_imperial.23.a:0 "Confederation, 52.3 per cent to 47.7."
 can_imperial.23.b:0 "Responsible Government, and the island keeps its own flag."
 can_imperial.23.c:0 "The Americans have made the better offer."

 ##### 1948 - the secret negotiation
 can_imperial.24.t:0 "The Negotiation Nobody Was Told About"
 can_imperial.24.d:0 "Officials of both Governments have been meeting quietly at Geneva and at Washington since the dollar crisis broke, and what they have on paper is not a trade agreement. It is the removal of nearly every duty between the two countries, phased over five years, with the Dominion free to keep the imperial preference on the other side of the Atlantic.\n\nIt would end the dollar shortage in a year. It would also mean that the two economies could not afterwards be separated by any Government of either country, and everyone who has read the draft knows it.\n\nThe file is marked secret. Neither Cabinet has seen it. Neither Parliament has heard of it."
 can_imperial.24.a:0 "Let the officials continue, and say nothing to the House."
 can_imperial.24.b:0 "Close the file."

 ##### 1948 - the offer lapses
 can_imperial.25.t:0 "The Offer Lapses"
 can_imperial.25.d:0 "Washington has waited six months for an answer and has stopped waiting. The draft is withdrawn without publicity, the officials who wrote it are reassigned, and the file goes into a cabinet where it will stay.\n\nNothing has been signed, nothing has been refused, and nothing has been decided. It is the most Canadian possible outcome, and it will be remembered as one."
 can_imperial.25.a:0 "The file is closed."

 ##### 1911 - no truck nor trade
 can_imperial.26.t:0 "No Truck nor Trade With the Yankees"
 can_imperial.26.d:0 "The reciprocity agreement is a schedule of duties on grain, fish and lumber. The country has decided to read it as a proposal of annexation, and two men are responsible.\n\nEighteen Liberals of Toronto - bankers, railway presidents, the men who financed the party - have published a manifesto against their own Government. And Mr. Champ Clark, who will be Speaker of the House of Representatives, has told that House that he hopes to see the day when the American flag floats over every square foot of British North America up to the North Pole.\n\nThe manifesto is being read from pulpits. Mr. Clark is being reprinted, in full, on handbills, by the Conservative party of Canada."
 can_imperial.26.a:0 "Go to the country on the agreement."
 can_imperial.26.b:0 "Withdraw the agreement and let the storm pass."

 ##### 1911 - the scare subsides
 can_imperial.27.t:0 "The Scare Subsides"
 can_imperial.27.d:0 "The handbills have stopped, the manifesto has been forgotten by everyone except the eighteen men who signed it, and the American flag has not been seen over British North America.\n\nWhat remains is a lesson that the trade departments of both countries will still be quoting forty years from now: in this Dominion, a tariff schedule can be turned into a question of loyalty in about six weeks."
 can_imperial.27.a:0 "The country has other things to think about."

 ##### The loyalist leagues
 can_imperial.28.t:0 "The Loyalist Leagues"
 can_imperial.28.d:0 "They began as veterans' associations and Orange lodges passing resolutions, and they are now something else. In Toronto, in Hamilton, in Saint John and in Halifax, the Leagues are drilling, refusing the new oath, flying the old flag from public buildings and, in three counties, obstructing the collection of federal taxes.\n\nTheir grievance is simple and it is not fraudulent: they swore allegiance to the King, the King has not released them, and no Order-in-Council can. Their leadership includes two retired generals and a former Lieutenant Governor.\n\nThe Attorney General has asked for instructions."
 can_imperial.28.a:0 "The law will deal with them."
 can_imperial.28.b:0 "Let them march."

 ##### The treaty ports demanded
 can_imperial.29.t:0 "Coal, Water, and Forty-Eight Hours"
 can_imperial.29.d:0 "A belligerent has asked for the use of the harbours of the Dominion: coal, water, repair, and the ordinary courtesies of the sea. The request is correct in form, it cites treaty and custom, and it has been made through the proper channel.\n\nIt is also a test, and the note attached says so with perfect politeness. A neutral that coals one fleet is not neutral. A neutral that closes its harbours to a fleet which has always used them is doing something for which there is a name in the international law books, and the Admiralty has appended the relevant page.\n\nHalifax, Sydney, Saint John and Esquimalt have been open to that fleet since before the Dominion existed."
 can_imperial.29.a:0 "Ottawa notes the request."
 can_imperial.29.b:0 "Grant the coaling."

 ##### London refuses the writ
 can_imperial.30.t:0 "The Writ of Summons"
 can_imperial.30.d:0 "The Upper House has killed the Bill, and the Government has resolved to deal with the Upper House.\n\nSection twenty-six of the British North America Act allows the Queen, on the recommendation of the Governor General, to summon additional Senators when the public interest requires it. It has never been used. The recommendation has gone forward, the names are chosen, and the whole thing now rests with a Colonial Secretary in Downing Street who has been asked to advise His Majesty on the internal politics of a Dominion.\n\nThe request is out of the Dominion's hands, and it has been from the moment it was posted."
 can_imperial.30.a:0 "The writ is granted. The Bill will pass."
 can_imperial.30.b:0 "London declines to advise His Majesty."

