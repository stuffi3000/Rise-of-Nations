l_english:
 AUH_DNC_chain_of_command_desc:0 "The Common Army drills in German and answers in twelve languages, so orders must survive translation twice over. Fixed channels from the War Ministry down through corps and brigade are what hold it together."
 AUH_DNC_war_economy_desc:0 "The War Service Law of 1912 lets the state put factories and their workers under military discipline. Drawing up the lists now decides which plants are seized first and which keep their own directors."
 AUH_DNC_marine_infantry_desc:0 "Sailors from SMS Zenta went ashore in China in 1900 and ended up holding part of the Peking legation wall as infantry. The fleet wants companies trained for landings, not gun crews improvised into soldiers."
 AUH_DNC_shovel_for_every_soldier_desc:0 "Observers came back from Port Arthur convinced that the spade decides as much as the rifle. Every man carries his own entrenching tool, and the support companies are built to make the digging count."
 AUH_DNC_liquidate_unprofital_business_desc:0 "The crash of 1873 left the Monarchy full of firms kept breathing by the banks that lent to them. Winding them up frees workshops, sites and skilled hands for trades that actually return money."
 AUH_DNC_dig_in_and_pray_desc:0 "The field regulations still teach the assault, but the Boer commandos and the lines before Port Arthur said otherwise. Engineers, telephone sections and medical trains keep a defence standing."
 AUH_DNC_loosen_restrictions_desc:0 "The trade code of 1859 swept the guilds away, then the amendments of 1883 put licences and proof of competence back. Lifting the limits again lets the factories hire whoever will work, at whatever hours they agree."
 AUH_DNC_old_doctrine_desc:0 "The delegations vote money for ships they can count, and that means battleships. Gunnery, armour and the line of battle keep their place in the academy at Fiume, and commerce raiding is left to poorer navies."
 AUH_DNC_impenetrable_fortress_desc:0 "Przemysl in Galicia is being rebuilt into one of the largest fortress rings in Europe. Doctrine follows the concrete. Hold the ground, and make the attacker pay for every metre of it."
 AUH_DNC_buy_out_dissident_farms_desc:0 "Buying out troublesome smallholders is cheaper than policing them. The land goes to loyal tenants or to the works, and the departing families take the Cunard boat from Fiume to New York."
