l_english:

 ##################################################################################
 ### Afghanistan - national focus trees, eras DNC / WW1 / INT / WW2 / CW
 ### Source : docs/nations/afghanistan/02_SQUELETTE.md
 ### 52 focus : name, _desc and _tt for each.
 ### The _tt keys carry the part of each focus that is NOT coded yet, because the
 ### idea, event, decision, character or rebel tag it needs does not exist in the
 ### mod today. Nothing here promises an effect the engine will not deliver: the
 ### tooltip says plainly what is written and what is still owed.
 ##################################################################################

 ##################################################################################
 ### ERA DNC - 1900 to 1909
 ##################################################################################

 AFG_the_iron_amirs_inheritance:0 "The Iron Amir's Inheritance"
 AFG_the_iron_amirs_inheritance_desc:0 "Abdur Rahman Khan has ruled since 1880, and he has spent twenty years making one country out of many. The Hazarajat war of 1891-1893, the conquest and forced conversion of Kafiristan in 1895-1896, the naqilin deportations northward: the unification was paid for, and the bill has not been settled. What he leaves his son is an apparatus that can name roughly one man and one field in three. That figure has a name in Kabul. It is the daftar - the registers - and everything this dynasty does for the next fifty years will be measured by it."
 AFG_the_iron_amirs_inheritance_tt:0 "Sets the registers to 30 and opens the six regional consents and the urban consent.\nStill owed: the permanent display idea The Registers, and the decision The Deported and the Settled."

 AFG_a_throne_passed_without_a_sword:0 "A Throne Passed Without a Sword"
 AFG_a_throne_passed_without_a_sword_desc:0 "Abdur Rahman dies on 1 October 1901. His son Habibullah takes the throne with no succession war, no rival claimant in arms, no province in revolt: the first peaceful transmission of the Afghan throne this century. It is a smaller achievement than it sounds and a larger one than it looks. The apparatus held. Nothing else in the region did."
 AFG_a_throne_passed_without_a_sword_tt:0 "Opens the Dane mission, the ratification crossroads and the amnesty question."

 AFG_open_the_prison_gates:0 "Open the Prison Gates"
 AFG_open_the_prison_gates_desc:0 "Habibullah opens his father's prisons, recalls the exiles, and softens the regime without dismantling its machinery. The Tarzi family comes home in 1905. An amnesty is a gift and an erasure at once: every name struck from a register is a name the state no longer holds. Kabul will spend the next twenty years finding out which of the two it bought."
 AFG_open_the_prison_gates_tt:0 "Registers -5. Mahmud Tarzi becomes available at court.\nStill owed: Tarzi as an advisor character."

 AFG_the_habibia_school:0 "The Habibia School"
 AFG_the_habibia_school_desc:0 "Opened in 1903, Habibia is the first modern educational establishment in the country, and the military school follows it. Within six years its graduates are the young officials of the second court in Kabul - the one that is not the ulama's. The Amir now has two courts and arbitrates between them without ever deciding. The method will hold for twelve years and then kill him."
 AFG_the_habibia_school_tt:0 "Still owed: the paired decisions Break the Mashruta and Protect the Circle, and the idea The Hanged Constitutionalists."

 AFG_refuse_to_ratify:0 "Refuse to Ratify"
 AFG_refuse_to_ratify_desc:0 "On 31 August 1907 London and Saint Petersburg sign a convention placing Afghanistan outside the Russian sphere - without Afghanistan. Kabul is informed on 10 September. Habibullah takes a full year to answer and then refuses to ratify. The convention is never applied to Afghanistan, and the refusal costs him nothing except the money he might have been offered for a signature."
 AFG_refuse_to_ratify_tt:0 "Still owed: the British opinion penalty of -20, which needs an opinion modifier that does not exist yet."

 AFG_a_signature_at_simla:0 "A Signature at Simla"
 AFG_a_signature_at_simla_desc:0 "DIVERGENCE. The court party that wants the subsidy exists, and it argued for twelve months against Nasrullah and the ulama. Sign, and the subsidy rises to 2.5 million rupees, London finances a modern arsenal, and Kabul can finally build something. Sign, and the Amir has sold the faith to the unbeliever, in the plain words of every mullah between Jalalabad and Khost - and they will say so for ten years, and one of them will be believed."
 AFG_a_signature_at_simla_tt:0 "Tribal consent falls by a further 0.3 a month for five years; the Khost revolt is pulled forward to 1912; Nasrullah becomes the head of a playable coup faction.\nStill owed: the idea The Amir Sold the Faith, the Khost event chain, and the coup faction."

 AFG_the_dane_mission:0 "The Dane Mission"
 AFG_the_dane_mission_desc:0 "The Anglo-Afghan treaty of 21 March 1905, negotiated at Kabul by Louis Dane after three months of talks, renews the paternal arrangement and raises the subsidy from 1.2 to 1.8 million rupees a year. Habibullah has sold continuity and bought time. From this year the subsidy is the first line of the budget, and nothing gets built in Afghanistan that London has not paid for."
 AFG_the_dane_mission_tt:0 "Still owed: the idea The Rupee Purse, which carries the political power and construction bonuses and locks British opinion at +40 while it holds."

 AFG_the_hasht_nafari:0 "The Hasht Nafari"
 AFG_the_hasht_nafari_desc:0 "One man in eight between twenty and forty - but designated by his tribe, not by the state. This is the single most important fact in the Afghan file: recruitment here is a contract with a qawm, not a conscription. The reserve it opens is enormous, immediate and free. It is also temporary, it will not leave the states it came from, and every man raised puts the tribe that supplied him in credit with the throne."
 AFG_the_hasht_nafari_tt:0 "Opens the lashkar manpower pool: immense, free, dissolved after 90 days, and not deployable outside its home state group. Each unit raised marks a debt against the supplying tribe.\nStill owed: the pool itself, the 90-day dissolution and the debt markers, all of which need decisions and dynamic modifiers."

 AFG_the_machine_house:0 "The Machine House"
 AFG_the_machine_house_desc:0 "The mashin khana, the royal arsenal of Kabul, is the only industry the country has. It casts its own guns and copies its own rifles, badly and slowly, and it is the difference between an army and a levy. Everything else the Amir fields was bought, captured or given."
 AFG_the_machine_house_tt:0 "Still owed: the +10% artillery production, which needs a national idea."

 AFG_the_court_of_the_ulama:0 "The Court of the Ulama"
 AFG_the_court_of_the_ulama_desc:0 "Nasrullah Khan, the Amir's brother, heads the conservative and anti-British party from 1901. Two courts now coexist in Kabul: the ulama and Nasrullah on one side, the young officials trained at Habibia on the other. The Amir arbitrates between them and never decides. This is not indecision. It is how an Afghan throne survives - until it does not."
 AFG_the_court_of_the_ulama_tt:0 "Still owed: Nasrullah Khan as an advisor character, and the recurring dilemma pair The Amir's Two Courts."

 AFG_the_prisons_stay_shut:0 "The Prisons Stay Shut"
 AFG_the_prisons_stay_shut_desc:0 "The amnesty of 1901-1905 is not granted. The Iron Amir's apparatus is kept intact, the exiles stay where they were put, and the Tarzi family stays in Ottoman exile. Nothing is destroyed and nothing is built. Seraj al-Akhbar is never founded, Habibia never opens, and the reformist road is closed for the rest of the game - which is precisely what this focus is for."
 AFG_the_prisons_stay_shut_tt:0 "Closes The Habibia School, Seraj al-Akhbar and the whole reformist branch for the game by withholding the flag they require."

 ##################################################################################
 ### ERA WW1 - 1910 to 1918
 ##################################################################################

 AFG_seraj_al_akhbar:0 "Seraj al-Akhbar"
 AFG_seraj_al_akhbar_desc:0 "Mahmud Tarzi founds Seraj al-Akhbar-i Afghaniyya in 1911 and it appears until 1918. Afghan nationalism, pan-Islamism, admiration for Meiji Japan and for the Young Turks, and a frank hostility to England: it is the intellectual matrix of everything that follows, including the things that will destroy the men who read it. Amanullah marries Soraya Tarzi in 1913, and the reformist party is now inside the royal family."
 AFG_seraj_al_akhbar_tt:0 "Still owed: the idea Seraj al-Akhbar, which carries +0.10 reformist drift a month, +0.10 political power a day, and +1 register a year while it runs; and Soraya Tarzi as a character. The one-off +2 written here stands in for the yearly accrual."

 AFG_the_treaty_that_cannot_be_delivered:0 "The Treaty That Cannot Be Delivered"
 AFG_the_treaty_that_cannot_be_delivered_desc:0 "DIVERGENCE. The Niedermayer-Hentig expedition reaches Kabul on 2 October 1915 and lays a draft treaty on the table on 24 January 1916: recognition of Afghan independence, diplomatic relations, and 100,000 rifles and 300 guns if Afghanistan enters the war. Habibullah signed a conditional friendship - applicable only if the Allies were already beaten - and did not move. Move, and Berlin owes you an army it cannot physically send. Berlin has no road to Kabul and never had one."
 AFG_the_treaty_that_cannot_be_delivered_tt:0 "The German delivery is drawn: 60% chance of nothing at all, 40% chance of 8,000 rifles at most. The subsidy disappears at once, four years early. The RAF bombs Kabul and Jalalabad from 1917.\nStill owed: the delivery draw, the production penalty on state 267, the four free lashkar divisions in Waziristan, and the resident imposed on Kabul on defeat - all of which need an event chain."

 AFG_the_model_battalion:0 "The Model Battalion"
 AFG_the_model_battalion_desc:0 "The qita-yi namuna is the only unit in the country trained on the European model, and it is the only one that will not simply dissolve when the season turns. It is also, with complete irony, the unit that produced Habibullah Kalakani - the water-carrier's son who will take Kabul in 1929 and hold it for nine months."
 AFG_the_model_battalion_tt:0 "Hard prerequisite of the 1928 divergence Crush the Shinwari Before the Snow, and of the Turkish military mission of 1937.\nStill owed: the trained division itself and the 1928 divergence."

 AFG_independence_or_nothing:0 "Independence or Nothing"
 AFG_independence_or_nothing_desc:0 "The war party at court in 1915-1916 is real and it is broad: Nasrullah, Inayatullah, Amanullah and Mahmud Tarzi all want war against British India, for reasons that do not agree with one another. Habibullah wants the subsidy. The mosque and the newspaper arrive at the same conclusion from opposite ends, which is why either court can open this door."
 AFG_independence_or_nothing_tt:0 "Opens The Treaty That Cannot Be Delivered."

 ##################################################################################
 ### ERA INT - 1919 to 1932
 ##################################################################################

 AFG_the_nizamnama:0 "The Nizamnama"
 AFG_the_nizamnama_desc:0 "The Nizamnama of 1923 is the first Afghan constitution: civil rights, the abolition of slavery, national identity cards, secular penal and civil codes, state courts, the Loya Jirga made an institution. It is the largest single jump in state apparatus of the whole period. It is also, precisely and in that order, the list of things the tribes will not forgive, and it arms the Khost rebellion of March 1924 by itself."
 AFG_the_nizamnama_tt:0 "Registers +12. Slavery abolished: recruitable manpower rises.\nStill owed: +20% construction speed, the identity cards and state courts as ideas, and the Khost event chain that this focus arms."

 AFG_the_jirga_of_paghman:0 "The Jirga of Paghman"
 AFG_the_jirga_of_paghman_desc:0 "August-September 1928, Paghman. Amanullah has been home from Europe for a month and is convinced his time is short. He calls the Loya Jirga and puts his programme in front of it. This focus grants nothing at all: it is a door, and it has three leaves, and the one the player chooses decides which Afghanistan the rest of the game is played in."
 AFG_the_jirga_of_paghman_tt:0 "No effect of its own. Opens the three-way crossroads of Paghman."

 AFG_unveil_the_nation:0 "Unveil the Nation"
 AFG_unveil_the_nation_desc:0 "The high road. Unveiling, western dress compulsory in Kabul, mixed schooling, a minimum age of marriage, and recruitment reform. It is the only path to an Afghanistan genuinely modernised before 1940. On 14 November 1928 the Shinwari rise and besiege Jalalabad with a ten-point manifesto, five points of which concern the status of women. The abdication of 14 January 1929 becomes probable, and it is not a bug."
 AFG_unveil_the_nation_tt:0 "Registers +20. Tribal consent -30 across all six regions.\nStill owed: the Shinwari Manifesto chain, which this focus is meant to trigger at full strength."

 AFG_a_reform_we_can_hold:0 "A Reform We Can Hold"
 AFG_a_reform_we_can_hold_desc:0 "The middle road, modelled on the constitutional amendment of 28 January 1925 - the concession torn out of Amanullah after Khost, which proved that a partial retreat was survivable. Take half the programme and keep the throne. The ceiling holds at 65 until 1933, which forbids The Registers Complete for five years and pushes the state army back by exactly as long."
 AFG_a_reform_we_can_hold_tt:0 "Registers +8, capped at 65 until 1933. The Shinwari chain fires at 40% reduced strength.\nStill owed: the cap itself and the reduced-strength chain."

 AFG_the_usul_i_asasi:0 "The Usul-i Asasi"
 AFG_the_usul_i_asasi_desc:0 "The constitution of October 1931 under Nadir Shah restores the primacy of the sharia, creates a partly appointed bicameral National Council and confirms the Loya Jirga. Registers down five, stability up fifteen: reaction here is an investment, not a free retreat. Nadir is buying the years that Amanullah spent."
 AFG_the_usul_i_asasi_tt:0 "Bypassed if Kabul is already saqqawist: Kalakani does not write constitutions."

 AFG_the_musahiban_compact:0 "The Musahiban Compact"
 AFG_the_musahiban_compact_desc:0 "Mohammad Hashim Khan is Prime Minister from 9 November 1929 to May 1946; Shah Mahmud holds War, Shah Wali the army, Mohammad Aziz the legation in Berlin. The king reigns and his uncles rule. The trait paternal_uncles, already written into this mod and already carried by the character, costs the throne ten per cent of its political power - and buys, in exchange, a government that does not fall."
 AFG_the_musahiban_compact_tt:0 "Still owed: the idea The Musahiban Compact, carrying the +2 advisor slots that pay for the paternal_uncles penalty."

 AFG_independence_in_foreign_affairs:0 "Independence in Foreign Affairs"
 AFG_independence_in_foreign_affairs_desc:0 "Complete independence is proclaimed on 28 February 1919. The Third Anglo-Afghan War runs from 3 May to 8 August, the RAF bombs Jalalabad and then Kabul - the first aerial bombardment in Afghan history, and Amanullah never forgets it - and the treaty of Rawalpindi recognises Afghan control of foreign affairs and abolishes the subsidy in the same paragraph. Kabul is free and broke on the same day."
 AFG_independence_in_foreign_affairs_tt:0 "Still owed: the removal of the starting idea No Foreign Office, and the first foreign legations in Kabul."

 AFG_two_protectors_and_no_master:0 "Two Protectors and No Master"
 AFG_two_protectors_and_no_master_desc:0 "The Soviet-Afghan treaty is signed at Moscow on 28 February 1921 and the Anglo-Afghan treaty at Kabul on 22 November 1921. Nine months apart, and neither capital is told anything it does not already know. Two protectors and no master is the definition of a buffer state, and it is not a resting position: it is a job, and the invoice arrives every month."
 AFG_two_protectors_and_no_master_tt:0 "Sets the leaning gauge at 0, between London at -100 and Moscow at +100.\nStill owed: the simultaneous +40 opinion with both London and Moscow."

 AFG_the_moscow_subsidy:0 "The Moscow Subsidy"
 AFG_the_moscow_subsidy_desc:0 "Rawalpindi took the British subsidy away. Moscow takes its place from the treaty of 28 February 1921: roubles, aircraft and a right of transit. Afghanistan has changed creditor without ever having had a budget of its own, and the old creditor does not leave without holding the door open for his rival."
 AFG_the_moscow_subsidy_tt:0 "Still owed: removal of the idea The Purse Is Empty, the idea The Ruble Purse, the Soviet aircraft delivery, and the 24-month British opinion penalty."

 AFG_the_ashami_company:0 "The Ashami Company"
 AFG_the_ashami_company_desc:0 "Abdul Majid Zabuli founds the Shirkat-i Ashami in 1932; it becomes the Bank-i Milli Afghan. It takes the import monopoly on sugar, oil and vehicles, and the export monopoly on cotton, wool and karakul - the lambskins that are the only Afghan product paid for in hard currency. For the first time the purse is held in Kabul. It is also held by a company, and the company has opinions about what the state may do with it."
 AFG_the_ashami_company_tt:0 "Still owed: the idea The Karakul Purse, and the idea The Bank Owns the Trade, which forbids the war economy until it is bought out for 200 political power."

 AFG_an_air_arm_of_our_own:0 "An Air Arm of Our Own"
 AFG_an_air_arm_of_our_own_desc:0 "The Afghan air force is born on 22 August 1924: Soviet Polikarpov R-1s flown by Soviet pilots, British Bristol Fighters bought the same year, a flying school in 1925. It is small, foreign-crewed and entirely dependent on the rouble that pays for it - and it will be destroyed to the last airframe in the civil war of 1928-1929."
 AFG_an_air_arm_of_our_own_tt:0 "Still owed: the air base in state 267, the fighter squadron, and the destruction of the whole arm if The Water-Carrier's Son succeeds."

 AFG_the_treasury_and_the_arsenal:0 "The Treasury and the Arsenal"
 AFG_the_treasury_and_the_arsenal_desc:0 "Habibullah is shot through the head under his hunting tent at Kalagosh in the Laghman on 20 February 1919. Amanullah is governor of Kabul and treasurer: he holds the capital, the arsenal and the cash box. In an Afghan succession those three things outrank a claim, and they outranked Nasrullah's six days at Jalalabad."
 AFG_the_treasury_and_the_arsenal_tt:0 "Still owed: the +60 modifier on the Six Days at Jalalabad event roll, which needs that event."

 AFG_the_eastern_court:0 "The Eastern Court"
 AFG_the_eastern_court_desc:0 "DIVERGENCE. Nasrullah has himself proclaimed Amir at Jalalabad and holds for six days, backed by the ulama and the eastern court; historically he then loses, and dies in prison in 1920. Here he does not lose. The result is a conservative, anti-British Afghanistan with no Nizamnama, no Paghman and no 1929 - and no schools, no bank and no aircraft either."
 AFG_the_eastern_court_tt:0 "Still owed: the +60 modifier on the Six Days at Jalalabad roll, the lock on the reformist branch until 1933, and the loss of the two Tarzi advisors."

 AFG_return_the_law_to_the_ulama:0 "Return the Law to the Ulama"
 AFG_return_the_law_to_the_ulama_desc:0 "The low road out of Paghman. The ulama break with Amanullah in August-September 1928; family law goes back to them, and the reformist road closes for the rest of the game. Kalakani will make this real in 1929 by simply doing it. Tribal consent rises across all six regions and the country is quiet until 1945 - and it enters 1941 with an army it cannot conscript."
 AFG_return_the_law_to_the_ulama_tt:0 "Registers -12. Opens the clerical terminal An Amirate, Not a Kingdom in the next era."

 AFG_the_kuhdaman_rising:0 "The Kuhdaman Rising"
 AFG_the_kuhdaman_rising_desc:0 "Habibullah Kalakani, a Tajik of the Kuhdaman, veteran of the model battalion and of the Third Anglo-Afghan War, comes down on Kabul in November 1928. He has no programme beyond the abolition of what Amanullah wrote, and that is enough: the registers are the grievance, and the man who promises to burn them can raise the Kuhdaman in a fortnight."
 AFG_the_kuhdaman_rising_tt:0 "Still owed: the Kalakani rebel tag and the event chain The Water-Carrier's Son."

 AFG_the_arsenal_at_jabal_al_siraj:0 "The Arsenal at Jabal al-Siraj"
 AFG_the_arsenal_at_jabal_al_siraj_desc:0 "The fort at Jabal al-Siraj falls on 11-12 December 1928 after eighteen days of siege, and the royal cash box and eighteen machine guns change sides with it. From 14 to 25 December, the first battle of Kabul: about two thousand men, largely armed with sticks and axes, against a capital that still has an air force. Kalakani is wounded on the 25th and withdraws. He will be back in three weeks."
 AFG_the_arsenal_at_jabal_al_siraj_tt:0 "Still owed: the transfer of eighteen machine guns and the royal treasury to the Kalakani tag, and the -25% production in state 267 for twelve months."

 AFG_the_law_of_the_kuhdaman:0 "The Law of the Kuhdaman"
 AFG_the_law_of_the_kuhdaman_desc:0 "DIVERGENCE. Kalakani rules from 17 January to 13 October 1929: schools shut, Amanullah's taxes abolished, the law handed back to the ulama. He is shot against the west wall of the Arg on 1 November 1929 with his brother and nine of his men. This is the only non-Pashtun Afghanistan of the period, and winning in 1929 is not winning - it is opening a decade of siege."
 AFG_the_law_of_the_kuhdaman_tt:0 "The registers are forced to 10.\nStill owed: -80% construction speed, -2 research slots, no foreign creditor available before 1935, and Nadir Khan as a permanent rebel tag fed from Waziristan while Pashtun tribal consent stays under 30."

 AFG_the_amanullah_question:0 "The Amanullah Question"
 AFG_the_amanullah_question_desc:0 "Amanullism does not die with the reign. It stays a living political force until 1947, and Nadir Shah knows it: Ghulam Nabi Charkhi, formerly ambassador in Moscow, is beaten to death on his orders in 1932. That killing buys the three assassinations of 1933 - Berlin in June, the British legation in September, and the king himself on 8 November."
 AFG_the_amanullah_question_tt:0 "Still owed: +0.15 amanullist popularity a month, and the underground network decisions covering the Charkhi, Mazrak Zadran and the Faqir of Ipi."

 AFG_the_debt_to_the_lashkar:0 "The Debt to the Lashkar"
 AFG_the_debt_to_the_lashkar_desc:0 "Nadir Khan crosses the frontier on 8 March 1929, rallies six thousand Mangal on 23 March, takes Gardez on 15 April, bogs down, and finally takes the Arg of Kabul on 13 October. The tribes put him on the throne. He will spend four years paying them for it, and the account never closes: an Afghan king who owes a lashkar cannot afford to count his subjects."
 AFG_the_debt_to_the_lashkar_tt:0 "Still owed: the six free lashkar divisions and the permanent idea The Debt to the Lashkar, which triggers an automatic revolt if the registers pass 60."

 ##################################################################################
 ### ERA WW2 - 1933 to 1948
 ##################################################################################

 AFG_the_nufus_registers:0 "The Nufus Registers"
 AFG_the_nufus_registers_desc:0 "The most important focus in the tree. Hashim's government abandons qawmi recruitment - the tribe names its men - for nufus recruitment, direct conscription by population census. The change removes the power of the Safi chiefs, and it was therefore fought ferociously. Add the sekoti tax on a third of the harvest, the trade monopolies and the surveillance, and the Pech valley rises in August 1945."
 AFG_the_nufus_registers_tt:0 "Registers +15. Switches recruitment from qawmi to nufus.\nStill owed: the six-month degradation of BOTH manpower pools - the exact Afghan situation of 1944-1945 - and the Kunar Khas event chain that this focus triggers."

 AFG_the_saadabad_pact:0 "The Saadabad Pact"
 AFG_the_saadabad_pact_desc:0 "Signed at Tehran on 8 July 1937 with Turkey, Iran and Iraq. It is a regional understanding and not an alliance: it commits Kabul to nothing and it obliges nobody to defend Kabul. That is exactly what a buffer state signs, and exactly why it signs it."
 AFG_the_saadabad_pact_tt:0 "Still owed: the +40 opinion with Turkey, Persia and Iraq."

 AFG_a_neutrality_with_two_frontiers:0 "A Neutrality with Two Frontiers"
 AFG_a_neutrality_with_two_frontiers_desc:0 "Afghanistan declares neutrality in 1939 and holds it, and holding it is work. In November 1941 Zahir Shah opens a Loya Jirga in person and the foreign minister restates the position in front of the chiefs. Afghan neutrality is not the absence of a policy; it is a policy that must be paid for every month, in political power, to two capitals that are not speaking to each other about anything else."
 AFG_a_neutrality_with_two_frontiers_tt:0 "Grants graveyard_of_empires, written into this mod and until now granted by nothing.\nStill owed: the permanent -0.10 political power a day, the immunity to neighbouring majors' war goals while leaning stays between -60 and +60, and the event Operation Countenance Next Door."

 AFG_the_bannu_question:0 "The Bannu Question"
 AFG_the_bannu_question_desc:0 "The Bannu resolution of 21 June 1947: Pashtun tribes demand the option of a Pashtunistan instead of the binary choice between India and Pakistan. The British refuse, and the NWFP referendum of July 1947 hands the province to Pakistan. On 30 September 1947 Afghanistan is the only state to vote against Pakistan's admission to the United Nations. This focus grants nothing: it opens three doors and closes none."
 AFG_the_bannu_question_tt:0 "No effect of its own. Opens the three-way crossroads of Bannu in the next era."

 AFG_the_berlin_air_route:0 "The Berlin Air Route"
 AFG_the_berlin_air_route_desc:0 "Experimental Berlin-Kabul flights in July 1936, a regular Lufthansa service in 1937, German technicians in the ministries and on the roads. Germany becomes the principal development partner of a country that has no other. Every year the arrangement runs, Kabul is a little further from a neutrality it can defend - and in October 1941 two ambassadors will arrive two days apart to say so."
 AFG_the_berlin_air_route_tt:0 "Opens the axis exposure counter, which hardens the Note of 9 October by one step a year.\nStill owed: the idea The German Technicians (+10% research and construction speed) and the note event itself. The figure of 70% of industrial imports is single-sourced and is deliberately not put into the game."

 AFG_karakul_for_dollars:0 "Karakul for Dollars"
 AFG_karakul_for_dollars_desc:0 "The Anglo-Soviet invasion of Iran in August 1941 cuts Kabul off from its trade routes to Germany, Japan and Czechoslovakia at a stroke. The karakul market moves to New York, the United States opens a resident legation in Kabul in June 1942, and Afghanistan builds its first hard-currency reserve. That reserve will pay for the Helmand, and the Helmand will eat it."
 AFG_karakul_for_dollars_tt:0 "Still owed: the idea The Dollar Purse replacing The Karakul Purse, +40 opinion with the United States, and -40 with Germany for 24 months."

 AFG_little_america_on_the_helmand:0 "Little America on the Helmand"
 AFG_little_america_on_the_helmand_desc:0 "In 1946 Kabul hires Morrison-Knudsen of Boise, Idaho, to take the Helmand and the Arghandab in hand: dams, canals, an airport at Kandahar. From that year, the salaries of the American engineers alone absorb the equivalent of the entire Afghan export trade. It is the perfect model of deferred debt - an infrastructure gain paid for by a currency haemorrhage that nobody in Kabul can stop."
 AFG_little_america_on_the_helmand_tt:0 "Still owed: two further civilian factories phased over five years, and the idea The Engineers' Payroll, -0.4% trade efficiency a year cumulative until 1953."

 AFG_the_turkish_mission:0 "The Turkish Mission"
 AFG_the_turkish_mission_desc:0 "In 1937 Kabul invites a Turkish military mission to reorganise an army of roughly sixty thousand men into divisions and brigades with staffs. This is the focus that carries the mechanical switch: above fifty registers the manpower stops coming from the lashkar and starts coming from the state - smaller, but permanent, trainable and projectable. Below fifty it is not offered, because below fifty there is no state to conscript from."
 AFG_the_turkish_mission_tt:0 "Above 50 registers, manpower now comes from the state pool. Modern conscription laws are unlocked.\nStill owed: the pool switch itself and the conscription law unlock. Not available if Amanullah has been restored: in that Afghanistan the mission of 1937 never happens."

 AFG_hinds_over_the_hindu_kush:0 "Hinds over the Hindu Kush"
 AFG_hinds_over_the_hindu_kush_desc:0 "The air force destroyed in the civil war is rebuilt from 1937 with British Hawker Hinds and Italian IMAM Ro.37s: something of the order of thirty aircraft by 1938. Nine of the Hinds will fly over the Pech valley in the autumn of 1945, dropping leaflets first and incendiaries afterwards."
 AFG_hinds_over_the_hindu_kush_tt:0 "Still owed: the thirty aircraft themselves, and the bombing option in the Kunar Khas event."

 AFG_an_amirate_not_a_kingdom:0 "An Amirate, Not a Kingdom"
 AFG_an_amirate_not_a_kingdom_desc:0 "Amanullah took the title of padshah - king - in 1926. The amirate that refuses to become a kingdom is the Afghanistan that Nasrullah wanted and that Kalakani briefly had. There will be no revolt, because there is nothing to revolt against. There will also be no army in 1941, and Iran next door was occupied in three weeks."
 AFG_an_amirate_not_a_kingdom_tt:0 "Still owed: the registers cap at 45, the suppression of all spontaneous tribal revolts, -40% construction speed and -1 research slot."

 AFG_the_king_returns:0 "The King Returns"
 AFG_the_king_returns_desc:0 "DIVERGENCE. Amanullah comes back, on the Charkhi, on Mazrak Zadran, on the Faqir of Ipi and on the exile networks in Rome and Moscow. The 1928 programme resumes where it stopped, with fifteen years fewer illusions. Against him stand the three Musahiban brothers, who hold the regular army: the player begins this war with thirty per cent of his divisions, and the Turkish mission of 1937 never takes place."
 AFG_the_king_returns_tt:0 "Still owed: war with the Musahiban rebel tag, the loss of 70% of divisions, and the Soviet and Italian backing. The +20 registers are applied here in one step rather than phased over five years."

 AFG_the_faqir_across_the_line:0 "The Faqir Across the Line"
 AFG_the_faqir_across_the_line_desc:0 "The Islam Bibi affair at Bannu in March 1936 sets off the revolt of the Faqir of Ipi in Waziristan; by 1937 the British have more than forty thousand men in the field against him. He had already fought in Afghanistan in 1933 for Amanullah's restoration and will do so again in 1944. Kabul is officially silent and materially porous, and both halves of that sentence are policy."
 AFG_the_faqir_across_the_line_tt:0 "Opens the frontier provocation counter.\nStill owed: the decision family The Faqir Across the Line - rifles, money, silence, nothing - and the -20 British opinion."

 AFG_restore_the_qawmi_levy:0 "Restore the Qawmi Levy"
 AFG_restore_the_qawmi_levy_desc:0 "Keep qawmi recruitment: the tribe names its men and its chiefs keep their power. The Safi revolt does not happen, the lashkar reserve doubles, and the subsidies are paid every month for ever. Modern conscription law stays locked, and Afghanistan enters the Cold War with no state army at all - which is, to be fair, exactly how it entered every other decade."
 AFG_restore_the_qawmi_levy_tt:0 "Registers -15. The Safi revolt does not occur.\nStill owed: the doubled lashkar reserve, the -0.05 political power a day for the tribal subsidies, and the lock on modern conscription laws."

 ##################################################################################
 ### ERA CW - from 1949
 ##################################################################################

 AFG_the_palace_keeps_the_keys:0 "The Palace Keeps the Keys"
 AFG_the_palace_keeps_the_keys_desc:0 "Shah Mahmud does not open the door. There is no seventh National Council, no press law, no legal opposition groups. Historically he did open it, in 1949, and dissolved what came out of it in 1952 - so the difference between the two options is three years of noise and a reputation. This focus buys the quiet directly and closes the democratic branch of the era for good."
 AFG_the_palace_keeps_the_keys_tt:0 "Still owed: -0.10 democratic drift a month."

 AFG_recognise_the_durand_line:0 "Recognise the Durand Line"
 AFG_recognise_the_durand_line_desc:0 "The option Kabul never took. The line was drawn in 1893, reaffirmed at Rawalpindi in 1919 and confirmed by the NWFP referendum of July 1947, and no Afghan government has ever accepted it. Accepting it closes the cross-frontier insurgency lever permanently - and the lever works in both directions, so closing it is also a door bolted against Karachi."
 AFG_recognise_the_durand_line_tt:0 "Still owed: +60 opinion with Pakistan, +30 with Britain and the United States, and the permanent closure of the cross-frontier decision file in both directions."

 AFG_the_pashtunistan_question:0 "The Pashtunistan Question"
 AFG_the_pashtunistan_question_desc:0 "On 30 September 1947 Afghanistan casts the only vote against Pakistan's admission to the United Nations. The claim is carried by diplomacy alone: no lashkar crosses, no war is declared, and Kabul spends the next twenty-five years being the only capital that says the word Pashtunistan out loud."
 AFG_the_pashtunistan_question_tt:0 "Still owed: -60 opinion with Pakistan, and the Pashtunistan branch of the era."

 AFG_the_liberal_parliament:0 "The Liberal Parliament"
 AFG_the_liberal_parliament_desc:0 "Hashim Khan leaves office in May 1946 and Shah Mahmud allows relatively free elections in 1949. The seventh National Council - the liberal parliament of 1949-1952 - lets criticism of the government be spoken aloud, sees opposition groups form, and passes press freedom laws. The Wish Zalmayan, the Awakened Youth, was founded in 1947. A state that cannot name its voters cannot hold an election, which is why the registers must stand above 55 for this door to open at all."
 AFG_the_liberal_parliament_tt:0 "Still owed: +0.15 democratic drift a month, the press freedom laws, and the democratic branch of the era."

 AFG_pashtunistan_by_lashkar:0 "Pashtunistan by Lashkar"
 AFG_pashtunistan_by_lashkar_desc:0 "DIVERGENCE. Kabul denounces the Durand line settlement and sends men rather than notes. Cross-frontier lashkars are raised in the Khyber Pass and the frontier is open. From this day the lever works in both directions with the same machinery: Karachi can feed the Zadran, the Safi and the Shinwari exactly as Kabul fed Waziristan, and it will."
 AFG_pashtunistan_by_lashkar_tt:0 "Still owed: -40 opinion with the United States and Britain, and the handover of the cross-frontier decision file to Pakistan."
