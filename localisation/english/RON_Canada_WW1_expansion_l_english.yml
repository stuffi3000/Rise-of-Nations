l_english:

 ##############################################################################
 # RON_Canada_WW1_expansion - localisation of the 1911-1919 expansion focuses.
 # 58 focus names, 58 descriptions and 58 tooltips for the focuses added to
 # common/national_focus/RON_Canada_WW1.txt after CAN_dreadnoughts_for_the_empire.
 # The first 20 focuses of that tree are localised in RON_Canada_l_english.yml
 # and are deliberately not repeated here.
 ##############################################################################

 ##### RESEARCH BONUS LABELS ###################################################

 CAN_ww1_shell_bonus:0 "Shells for the Empire"
 CAN_ww1_gas_bonus:0 "The Lessons of the Gas"
 CAN_ww1_barrage_bonus:0 "The Creeping Barrage"
 CAN_ww1_air_doctrine_bonus:0 "A Flying Corps of Our Own"
 CAN_ww1_trainer_bonus:0 "The Curtiss Canuck"
 CAN_ww1_naval_air_bonus:0 "The Naval Air Service"
 CAN_ww1_submarine_bonus:0 "McBride's Submarines"
 CAN_ww1_escort_bonus:0 "The Armed Trawlers"
 CAN_ww1_asw_bonus:0 "The Atlantic Lesson"

 ##### BRANCH - THE SCHOOLS QUESTION ###########################################

 CAN_the_ontario_schools_question:0 "The Ontario Schools Question"
 CAN_the_ontario_schools_question_desc:0 "Regulation 17 is a departmental circular, not a statute, and that is the whole of its cunning: it restricts French instruction to the first two years of the primary course without ever once being put to a vote."
 CAN_the_ontario_schools_question_tt:0 "The question is opened and must now be answered. §YOttawa may leave the province to legislate, or disallow the circular.§!"

 CAN_let_the_province_legislate:0 "Let the Province Legislate"
 CAN_let_the_province_legislate_desc:0 "Education is a provincial head of power and the Prime Minister says so, which is both constitutionally impeccable and exactly what a man says when he does not wish to act."
 CAN_let_the_province_legislate_tt:0 "Regulation 17 stands and the Dominion refuses to intervene. §GThe provincial compact is honoured and the government spends nothing to do it.§!\n§RThe grievance is added to the account Quebec is keeping.§!"

 CAN_disallow_the_circular:0 "Disallow the Circular"
 CAN_disallow_the_circular_desc:0 "The power of disallowance exists, it has been used ninety-six times, and using it here would cost the government Ontario."
 CAN_disallow_the_circular_tt:0 "The circular is struck down and the schools reopen. §GThe account Quebec is keeping is eased.§!\n§RThe lodges answer: Orange Ontario turns against the government.§!"

 ##### BRANCH - THE WARTIME STATE ##############################################

 CAN_the_war_measures_act:0 "The War Measures Act"
 CAN_the_war_measures_act_desc:0 "Four pages, passed in a single sitting in August 1914, and it hands the Governor in Council the power to censor, to arrest, to deport and to seize property on the sole ground that he deems it necessary."
 CAN_the_war_measures_act_tt:0 "The executive may now govern by Order-in-Council. §GA free hand in wartime administration.§!\n§RThe internments open the first entry in the ledger, and the account Quebec is keeping rises.§!"

 CAN_the_war_time_elections_act:0 "The War-Time Elections Act"
 CAN_the_war_time_elections_act_desc:0 "It gives the vote to the mothers, wives and sisters of serving soldiers, and takes it away from any subject naturalised out of an enemy country since 1902. Both halves are the same calculation."
 CAN_the_war_time_elections_act_tt:0 "The electorate is rewritten to suit the government. §GA majority is made certain before a vote is cast.§!\n§RA second entry in the ledger, and the account Quebec is keeping rises.§!"

 CAN_the_union_government:0 "The Union Government"
 CAN_the_union_government_desc:0 "Borden offers the Liberals half the cabinet and Laurier refuses, because to accept is to hand Quebec to Bourassa. Nine English-speaking Liberals accept anyway."
 CAN_the_union_government_tt:0 "Conscriptionist Liberals cross the floor. §GA national government with an overwhelming mandate for the war.§!\n§RQuebec is outside the government and knows it.§!"

 CAN_borden_stands_alone:0 "Borden Stands Alone"
 CAN_borden_stands_alone_desc:0 "Govern as a party, take the Military Service Act through the Commons on Conservative votes alone, and let the Liberals oppose it as Liberals. It is a smaller majority and a slower war."
 CAN_borden_stands_alone_tt:0 "The government governs as a party and the Opposition remains national. §GStability holds and the party system survives the war.§!\n§RThe war effort proceeds without a unity mandate.§!"

 CAN_votes_for_the_women_of_the_dominion:0 "Votes for the Women of the Dominion"
 CAN_votes_for_the_women_of_the_dominion_desc:0 "The franchise arrives sideways, as a war measure aimed at soldiers' relatives, and is then made general in 1918 because having given it for a purpose the government cannot decently take it back."
 CAN_votes_for_the_women_of_the_dominion_tt:0 "The federal franchise is extended to women. §GA lasting gain in national cohesion.§!"

 ##### BRANCH - QUEBEC AND THE COMPACT #########################################

 CAN_the_nationalists_and_the_tories:0 "The Nationalists and the Tories"
 CAN_the_nationalists_and_the_tories_desc:0 "Bourassa wants no navy and no imperial entanglement; Borden wants dreadnoughts for the Admiralty. They have nothing in common except that both would like Laurier out of office, and in 1911 that is enough."
 CAN_the_nationalists_and_the_tories_tt:0 "An alliance of convenience carries the election. §GPolitical capital, and a quieter Quebec for as long as it lasts.§!"
 CAN_monk_resigns:0 "Monk Resigns"
 CAN_monk_resigns_desc:0 "Frederick Monk came into the cabinet as the Nationalist price and leaves it in October 1912, when the government proposes to give the Admiralty thirty-five million dollars without the plebiscite he was promised."
 CAN_monk_resigns_tt:0 "The Nationalist minister resigns over the naval contribution. §GA bloc that owes the government nothing but says so honestly.§!\n§RQuebec has no voice at the cabinet table.§!"

 CAN_stay_in_the_cabinet:0 "Stay in the Cabinet"
 CAN_stay_in_the_cabinet_desc:0 "Keep him. Give him the plebiscite, or give him enough of it to let him stay, and accept that the naval bill will be slower and smaller for it."
 CAN_stay_in_the_cabinet_tt:0 "The minister from Quebec remains at the cabinet table. §GPolitical power, and a standing voice for the province in government.§!\n§GThe account Quebec is keeping is eased.§!"
 CAN_the_francoeur_motion:0 "The Francoeur Motion"
 CAN_the_francoeur_motion_desc:0 "On the twenty-first of December 1917, three weeks after the conscription election, Joseph-Napoleon Francoeur moves in the Legislative Assembly that Quebec would be prepared to accept the breaking of the Confederation pact of 1867 if the other."
 CAN_the_francoeur_motion_tt:0 "The question of the compact is put on the record of the Assembly. §RStability falls while the province debates its own departure.§!\n§YThe motion may be withdrawn, or put to a vote.§!"

 CAN_withdraw_the_motion:0 "Withdraw the Motion"
 CAN_withdraw_the_motion_desc:0 "The debate runs four days, the premier speaks against it, and Francoeur withdraws it without a division, which was always the intention. The threat was the point and the threat has been delivered."
 CAN_withdraw_the_motion_tt:0 "The motion is withdrawn without a division. §GThe point is made and the compact holds.§!"
 CAN_let_the_assembly_vote:0 "Let the Assembly Vote"
 CAN_let_the_assembly_vote_desc:0 "Take him at his word and put it to a division."
 CAN_let_the_assembly_vote_tt:0 "The Assembly divides on the compact itself. §GAn immense concentration of political authority in the province.§!\n§RStability collapses and the account Quebec is keeping rises sharply.§!"

 ##### BRANCH - THE FARM AND THE BARGAIN #######################################

 CAN_crerar_joins_the_union:0 "Crerar Joins the Union"
 CAN_crerar_joins_the_union_desc:0 "Thomas Crerar runs the United Grain Growers and speaks for the wheat farmer, and Borden makes him Minister of Agriculture to bring the prairie into the Union Government. He brings it."
 CAN_crerar_joins_the_union_tt:0 "The prairie enters the government on terms. §GWar support rises and the farm vote is secured.§!\n§YThe bargain is now owed.§!"

 CAN_the_farmers_march_on_ottawa:0 "The Farmers March on Ottawa"
 CAN_the_farmers_march_on_ottawa_desc:0 "In April 1918 the exemptions are cancelled by Order-in-Council and five thousand farmers come to Ottawa to say what they think of it. Borden receives them and tells them the men are needed."
 CAN_the_farmers_march_on_ottawa_tt:0 "The exemptions are cancelled and the men are taken. §GTwenty thousand additional recruits.§!\n§RThe farm vote is lost for a generation, and the account Quebec is keeping rises.§!"

 CAN_keep_the_exemptions:0 "Keep the Exemptions"
 CAN_keep_the_exemptions_desc:0 "The bargain was made and the government keeps it. The farmer's son stays on the section, the harvest comes in, and the Corps in France is short the men who would have brought it in."
 CAN_keep_the_exemptions_tt:0 "The bargain with the prairie is honoured. §GThe farm vote is kept and the harvest is brought in.§!\n§RThe Corps does not receive the men: war support and the recruiting pool both fall.§!"
 CAN_patriotism_and_production:0 "Patriotism and Production"
 CAN_patriotism_and_production_desc:0 "The Department of Agriculture's slogan for 1915, printed on everything, and it works: acreage under wheat rises by a third in two years."
 CAN_patriotism_and_production_tt:0 "The wheat campaign runs for four years. §GAgricultural output rises for the duration of the effort.§!"

 CAN_the_board_of_grain_supervisors:0 "The Board of Grain Supervisors"
 CAN_the_board_of_grain_supervisors_desc:0 "In 1917 Ottawa closes the futures market and fixes the price of wheat, which is to say that the Dominion government sets by fiat the income of every farmer west of the Lakehead."
 CAN_the_board_of_grain_supervisors_tt:0 "The price of wheat is fixed by the Dominion. §GStability and a guaranteed agricultural income.§!"

 CAN_let_winnipeg_trade:0 "Let Winnipeg Trade"
 CAN_let_winnipeg_trade_desc:0 "Reopen the Exchange and let the pit set the price."
 CAN_let_winnipeg_trade_tt:0 "The Grain Exchange reopens and the pit sets the price. §GA powerful boost to trade.§!\n§RStability falls as bread prices follow the market.§!"
 CAN_the_soldiers_of_the_soil:0 "The Soldiers of the Soil"
 CAN_the_soldiers_of_the_soil_desc:0 "Twenty-two thousand boys between fifteen and nineteen are enrolled, badged, and sent to farms for the 1918 harvest, because the men who would have done it are in France and the harvest will not wait for them."
 CAN_the_soldiers_of_the_soil_tt:0 "The boys are sent to the farms. §GThe harvest is brought in without taking a man from the depots.§!\n§RA nation visibly scraping the bottom of its manpower: stability falls.§!"
 CAN_break_the_last_prairie:0 "Break the Last Prairie"
 CAN_break_the_last_prairie_desc:0 "Plough the dry belt, the marginal quarter-sections, the land the surveyors marked as fit for grazing and nothing else. At 1917 wheat prices it pays handsomely and the Empire needs every bushel."
 CAN_break_the_last_prairie_tt:0 "The marginal land goes under the plough. §GA lasting increase in agricultural production.§!\n§RThe soil is spent and will not return.§!"

 ##### BRANCH - INDUSTRY AND THE TREASURY ######################################

 CAN_shells_for_the_empire:0 "Shells for the Empire"
 CAN_shells_for_the_empire_desc:0 "The Imperial Munitions Board at its height employs a quarter of a million people in six hundred factories and delivers a third of the shells fired by British artillery on the Western Front."
 CAN_shells_for_the_empire_tt:0 "The Dominion becomes an arsenal of the Empire. §GArtillery research is advanced and shell production rises.§!"

 CAN_thirty_thousand_women:0 "Thirty Thousand Women"
 CAN_thirty_thousand_women_desc:0 "They go into the shell plants because there is no one else, and they are paid rather less than the men whose lathes they are standing at."
 CAN_thirty_thousand_women_tt:0 "Women enter the munitions plants in numbers. §GA substantial increase in industrial output.§!"

 CAN_the_nickel_refinery_at_port_colborne:0 "The Nickel Refinery at Port Colborne"
 CAN_the_nickel_refinery_at_port_colborne_desc:0 "Sudbury has the world's nickel and has been shipping it to New Jersey to be refined, which was tolerable until it was pointed out in the House that some of it had reached Germany in submarine steel before 1917."
 CAN_the_nickel_refinery_at_port_colborne_tt:0 "Canadian nickel is refined in Canada. §GA lasting gain in industrial capacity and strategic resources.§!"

 CAN_the_income_war_tax:0 "The Income War Tax"
 CAN_the_income_war_tax_desc:0 "Sir Thomas White introduces it in July 1917 as a temporary measure, apologises for it, and promises the House it will be reviewed when the war ends. Eleven pages, four per cent above three thousand dollars. It has never been repealed."
 CAN_the_income_war_tax_tt:0 "A tax on incomes is imposed for the duration. §GA large and permanent increase in government revenue.§!\n§RThe measure is deeply unpopular: stability falls.§!"

 CAN_the_victory_loans:0 "The Victory Loans"
 CAN_the_victory_loans_desc:0 "The Dominion has always borrowed in London and in 1915 London has nothing to lend, so Ottawa turns to its own people and discovers, to its considerable surprise, that they will subscribe two billion dollars."
 CAN_the_victory_loans_tt:0 "The Dominion borrows from its own people. §GStability and a domestic capital market that did not exist before.§!"

 CAN_the_halifax_relief_commission:0 "The Halifax Relief Commission"
 CAN_the_halifax_relief_commission_desc:0 "The sixth of December 1917: the Mont-Blanc, loaded with picric acid and TNT, burns in the Narrows for twenty minutes with the whole north end watching from their windows, and then detonates."
 CAN_the_halifax_relief_commission_tt:0 "The Dominion rebuilds a destroyed city. §GA lasting national solidarity: stability rises.§!\n§RThe cost is borne by the treasury.§!"

 ##### BRANCH - THE RIFLE ######################################################

 CAN_the_ross_rifle_contract:0 "The Ross Rifle Contract"
 CAN_the_ross_rifle_contract_desc:0 "Sir Charles Ross builds a superb target rifle in a factory on the Plains of Abraham, and Sam Hughes, who shoots at Bisley, decides it will arm the Canadian Corps."
 CAN_the_ross_rifle_contract_tt:0 "The Dominion arms itself from a Canadian plant. §YThe rifle may be defended, or replaced from British stores.§!"

 CAN_stand_by_the_ross:0 "Stand By the Ross"
 CAN_stand_by_the_ross_desc:0 "Hughes defends it to the end and beyond it, and the men at Second Ypres kick the bolts open with their boots and pick up Lee-Enfields off the dead."
 CAN_stand_by_the_ross_tt:0 "The minister defends the rifle and the men in the line pay for it. §GExperience is bought at the front.§!\n§RThe rifle jams in the mud: Canadian infantry fight at a lasting disadvantage.§!"

 CAN_rifles_from_the_british_store:0 "Rifles from the British Store"
 CAN_rifles_from_the_british_store_desc:0 "Take the Lee-Enfield from the imperial store, admit publicly that the Canadian rifle failed, and arm the Corps with a weapon that works when it is dirty. It costs Hughes his reputation and Ross his factory, and it is unarguably the right decision."
 CAN_rifles_from_the_british_store_tt:0 "The Corps is rearmed from imperial stores. §GExperience rises and the infantry get a rifle that works.§!\n§RThe Canadian armaments industry is repudiated by its own government.§!"

 ##### BRANCH - THE BATTLES ####################################################

 CAN_second_ypres:0 "Second Ypres"
 CAN_second_ypres_desc:0 "The twenty-second of April 1915, and the First Division is four months out of Valcartier and holding a flank when the chlorine comes over on the evening breeze and the French colonial division beside them dissolves."
 CAN_second_ypres_tt:0 "The Division holds the gas attack and is made an army by it. §GA large gain in experience and war support, and support equipment research is advanced.§!"

 CAN_the_somme_and_courcelette:0 "The Somme and Courcelette"
 CAN_the_somme_and_courcelette_desc:0 "September 1916, and the Corps takes Courcelette behind the first creeping barrage it has ever fired and alongside the first tanks anyone has ever seen. It works."
 CAN_the_somme_and_courcelette_tt:0 "The Corps learns the barrage and pays for the lesson. §GExperience and artillery research are advanced.§!\n§RThe casualty lists weigh on the country for a year.§!"

 CAN_hill_seventy:0 "Hill Seventy"
 CAN_hill_seventy_desc:0 "Currie's first battle in command, and the Army asks him to take Lens."
 CAN_hill_seventy_tt:0 "The corps commander chooses his own ground and holds it. §GA large gain in experience, war support and command power.§!"

 CAN_passchendaele:0 "Passchendaele"
 CAN_passchendaele_desc:0 "Currie tells Haig the position is not worth sixteen thousand casualties and Haig tells him to take it anyway."
 CAN_passchendaele_tt:0 "The village is taken at the price the corps commander predicted. §GA very large gain in experience.§!\n§RThe mud of Passchendaele hangs over the Corps for eighteen months, and stability falls with the lists.§!"
 ##### BRANCH - THE COMMAND OF THE CORPS #######################################

 CAN_the_overseas_ministry:0 "The Overseas Ministry"
 CAN_the_overseas_ministry_desc:0 "Hughes has been running the Canadians in England through a private committee of his friends, and by 1916 Borden has had enough of it."
 CAN_the_overseas_ministry_tt:0 "The Corps is put under responsible administration. §GThe patronage army is ended and the Corps is administered from Ottawa, not from a minister's hotel suite.§!"
 CAN_a_canadian_commands_the_corps:0 "A Canadian Commands the Corps"
 CAN_a_canadian_commands_the_corps_desc:0 "Byng goes to the Third Army in June 1917 and Currie gets the Corps: a Victoria real-estate agent who was insolvent in 1914 and had taken regimental funds to cover it, and who is by 1917 the best corps commander on the Western Front."
 CAN_a_canadian_commands_the_corps_tt:0 "The Corps passes to Canadian command. §GA large gain in command power, and a corps commander of the first rank.§!\n§ROttawa is not consulted and does not care for the man.§!"
 CAN_an_imperial_corps_commander:0 "An Imperial Corps Commander"
 CAN_an_imperial_corps_commander_desc:0 "Keep Byng, or keep the principle he represents: that the Corps is a formation of the British Army and will be commanded by whoever the British Army thinks best. Byng is very good and the men are devoted to him."
 CAN_an_imperial_corps_commander_tt:0 "The Corps remains under an imperial commander. §GExperience and a competent, well-loved command.§!\n§RThe Dominion does not command its own army.§!"

 CAN_a_corps_of_our_own:0 "A Corps of Our Own"
 CAN_a_corps_of_our_own_desc:0 "Currie's one non-negotiable position: the four divisions fight together, under him, or he resigns. The British would rather feed them into whatever army needs a division that week, which is how every other dominion contingent was used."
 CAN_a_corps_of_our_own_tt:0 "The four divisions fight as one formation. §GA corps that learns as a whole, and a Canadian order of battle on the imperial map.§!"
 CAN_divisions_at_the_disposal_of_the_army:0 "Divisions at the Disposal of the Army"
 CAN_divisions_at_the_disposal_of_the_army_desc:0 "Let GHQ have them where they are needed, one division at a time, as it has the Australians and the New Zealanders. It is flexible, it is generous, and it is what a loyal dominion does when the Empire is fighting for its life."
 CAN_divisions_at_the_disposal_of_the_army_tt:0 "The divisions are dispersed as the Army requires. §GExperience and imperial goodwill.§!\n§RThe Corps never becomes a national instrument.§!"

 CAN_break_up_the_fifth_division:0 "Break Up the Fifth Division"
 CAN_break_up_the_fifth_division_desc:0 "The Fifth is in England, complete, and the Corps in France is short twenty thousand men."
 CAN_break_up_the_fifth_division_tt:0 "The Fifth is broken up to bring the fighting divisions to strength. §GThe corps stands at full establishment and its reinforcements arrive trained.§!"
 CAN_a_fifth_division_for_the_corps:0 "A Fifth Division for the Corps"
 CAN_a_fifth_division_for_the_corps_desc:0 "Keep it whole and put it in the line as a fifth division, which is what Hughes wants and what the officers of the Fifth have been promised."
 CAN_a_fifth_division_for_the_corps_tt:0 "The Fifth is retained as a formation. §GA fifth division and experience for its staff.§!\n§REvery division in the Corps fights below establishment.§!"

 CAN_the_hundred_days:0 "The Hundred Days"
 CAN_the_hundred_days_desc:0 "From Amiens on the eighth of August to Mons on the eleventh of November: the Corps advances eighty miles, breaks the Drocourt-Queant line and the Canal du Nord."
 CAN_the_hundred_days_tt:0 "The Corps becomes the spearhead of the British armies. §GA very large gain in experience, war support and command power, and a permanent reputation.§!"

 ##### BRANCH - THE AIR ########################################################

 CAN_the_canadian_aviation_corps:0 "The Canadian Aviation Corps"
 CAN_the_canadian_aviation_corps_desc:0 "It is authorised in September 1914, consists of two officers and a mechanic, and owns one Burgess-Dunne biplane bought for five thousand dollars that is crated to England, never flown there, and left to rot in a field. It is disbanded in 1915."
 CAN_the_canadian_aviation_corps_tt:0 "The Dominion makes its first attempt at an air service. §GA little political capital and the first air experience.§!"

 CAN_men_for_another_flag:0 "Men for Another Flag"
 CAN_men_for_another_flag_desc:0 "Twenty-two thousand Canadians fly, and every one of them does it in British uniform, because there is no Canadian service to join. By 1918 they are a quarter of the Royal Air Force's pilots."
 CAN_men_for_another_flag_tt:0 "Canadians fly under British colours. §GA very large gain in air experience.§!\n§RThe Dominion has airmen and no air service of its own.§!"

 CAN_a_flying_corps_of_our_own:0 "A Flying Corps of Our Own"
 CAN_a_flying_corps_of_our_own_desc:0 "Two squadrons are authorised in September 1918 and the Canadian Air Force exists for rather less than a year before the money runs out. It is not much."
 CAN_a_flying_corps_of_our_own_tt:0 "A Canadian air service is established. §GAir doctrine research is advanced and a national air arm is founded.§!\n§RLondon is not pleased and the treasury is emptied.§!"

 CAN_the_royal_flying_corps_canada:0 "The Royal Flying Corps Canada"
 CAN_the_royal_flying_corps_canada_desc:0 "Britain sets up a complete training organisation in Ontario in 1917 because Canada has the space, the weather and the timber, and by the armistice it has graduated three thousand pilots and built its own aircraft to do it."
 CAN_the_royal_flying_corps_canada_tt:0 "A complete flying-training organisation is built in Ontario. §GA very large and permanent gain in air experience.§!"

 CAN_the_schools_in_ontario:0 "The Schools in Ontario"
 CAN_the_schools_in_ontario_desc:0 "Camp Borden, Deseronto, North Toronto, Beamsville: aerodromes cut out of scrub in a single season, and the Canadian Aeroplanes company at Toronto turning out twelve hundred Curtiss JN-4 trainers on Canadian tooling."
 CAN_the_schools_in_ontario_tt:0 "The aerodromes and the trainer factories are built. §GAir experience and light aircraft research are advanced.§!"

 CAN_the_aces_of_the_dominion:0 "The Aces of the Dominion"
 CAN_the_aces_of_the_dominion_desc:0 "Bishop with seventy-two, Collishaw with sixty, Barker with fifty and a Victoria Cross for a single fight against fifteen."
 CAN_the_aces_of_the_dominion_tt:0 "The Dominion's airmen become famous. §GA very large gain in air experience and a lasting tradition.§!"

 CAN_the_royal_canadian_naval_air_service:0 "The Royal Canadian Naval Air Service"
 CAN_the_royal_canadian_naval_air_service_desc:0 "Authorised in September 1918 to fly anti-submarine patrols off the Atlantic coast, staffed by eighty cadets sent to Massachusetts to be trained, and disbanded in December without ever having flown an operational patrol from a Canadian station."
 CAN_the_royal_canadian_naval_air_service_tt:0 "A naval air service is authorised for the Atlantic coast. §GNaval bomber research is advanced.§!\n§RIt is stood up too late to fly a single patrol.§!"

 CAN_the_american_naval_air_stations:0 "The American Naval Air Stations"
 CAN_the_american_naval_air_stations_desc:0 "The United States Navy flies the anti-submarine patrols off Nova Scotia in 1918 from stations at Halifax and Sydney, with American aircraft and American crews, because Canada has neither. Ottawa asks for the help and gets it within weeks."
 CAN_the_american_naval_air_stations_tt:0 "Washington flies the patrols off Nova Scotia. §GAir experience and warmer relations with the United States.§!\n§RCanadian waters are defended by a foreign service.§!"

 ##### BRANCH - THE SEA ########################################################

 CAN_the_royal_naval_college:0 "The Royal Naval College"
 CAN_the_royal_naval_college_desc:0 "Opened at Halifax in 1911 to make Canadian naval officers instead of borrowing British ones, and blown apart by the Halifax explosion in 1917 with the cadets at their desks."
 CAN_the_royal_naval_college_tt:0 "The Dominion trains its own naval officers. §GA lasting gain in naval experience and a professional officer corps.§!"

 CAN_mcbrides_submarines:0 "McBride's Submarines"
 CAN_mcbrides_submarines_desc:0 "In August 1914 the Premier of British Columbia hears that a Seattle yard has two submarines built for Chile and unpaid for, and buys them for the province with a cheque for a million and a fifty-cent piece, at night, in international waters."
 CAN_mcbrides_submarines_tt:0 "Two submarines are bought without asking Ottawa. §GSubmarine research is advanced and the Pacific coast has a defence.§!\n§RThe federal government is presented with a fait accompli.§!"

 CAN_the_h_boats_of_canadian_vickers:0 "The H-Boats of Canadian Vickers"
 CAN_the_h_boats_of_canadian_vickers_desc:0 "The Montreal yard builds ten H-class submarines for the Royal Navy in five months in 1915, which is a remarkable performance for a yard that had never built one, and every single boat is handed to the Admiralty."
 CAN_the_h_boats_of_canadian_vickers_tt:0 "The Montreal yard builds submarines for the Admiralty. §GNaval experience, political capital and a shipyard that survives the peace.§!"

 CAN_the_saint_lawrence_patrol:0 "The Saint Lawrence Patrol"
 CAN_the_saint_lawrence_patrol_desc:0 "The river is the artery: every shell, every bushel and every battalion leaves through it, and in 1914 it is guarded by two elderly cruisers and goodwill."
 CAN_the_saint_lawrence_patrol_tt:0 "The river approaches are patrolled. §GNaval experience and secure home waters.§!"

 CAN_the_armed_trawlers:0 "The Armed Trawlers"
 CAN_the_armed_trawlers_desc:0 "Ottawa orders sixty steel trawlers and a hundred wooden drifters from Canadian yards in 1917 because the Admiralty says it has none to spare."
 CAN_the_armed_trawlers_tt:0 "Canada designs and builds its own escorts. §GNaval experience and destroyer research advanced: a national warship-building capacity.§!"

 CAN_the_admiralty_will_provide:0 "The Admiralty Will Provide"
 CAN_the_admiralty_will_provide_desc:0 "Ask London for drifters and take what is sent. It is quicker, it is cheaper, and the vessels are better than anything a Canadian yard could produce in the time."
 CAN_the_admiralty_will_provide_tt:0 "The escorts are requested from the Admiralty. §GNaval experience at no cost to the treasury.§!\n§RNo Canadian yard learns to build a warship.§!"

 CAN_the_u_boats_off_nova_scotia:0 "The U-Boats off Nova Scotia"
 CAN_the_u_boats_off_nova_scotia_desc:0 "In the summer of 1918 the cruiser submarines come across and sink some fifty vessels within sight of the Nova Scotia coast, most of them schooners, one of them shelled while her crew rowed away."
 CAN_the_u_boats_off_nova_scotia_tt:0 "The war reaches Canadian waters. §GNaval experience and anti-submarine research are advanced.§!\n§RThe country learns it cannot defend its own coast: stability falls.§!"
