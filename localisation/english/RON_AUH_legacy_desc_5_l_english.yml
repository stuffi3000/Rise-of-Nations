l_english:
 AUH1_minimum_wage_desc:0 "Taaffe's ministry gave the Austrian half accident insurance in 1887 and sickness funds in 1888, ahead of most of Europe. A floor under wages is the next demand the Social Democrats will press."
 AUH1_support_middle_class_desc:0 "Lueger's Christian Socials took Vienna in 1897 on the votes of shopkeepers, master craftsmen and clerks. Workshops that grow into real plants keep those voters loyal and the streets quiet."
 AUH1_fiscal_reforms_desc:0 "Bohm-Bawerk left the finance ministry rather than sign for spending the treasury could not carry. The common budget is fought over between Vienna and Budapest, and the quota never settles quietly."
 AUH1_free_market_desc:0 "Bruck cut Austria's tariffs in the 1850s hoping the Zollverein states would find Vienna the cheaper market. Hungary's grain barons and Bohemia's mill owners will never agree about this."
 AUH_DNC_free_market_desc:0 "The Monarchy is a single customs union with two governments renegotiating it every decade. Letting goods and capital move without asking Vienna first wagers that trade holds what politics cannot."
 AUH1_invite_foreign_investors_desc:0 "Rothschild money founded the Creditanstalt in 1855, and it has financed railways and ironworks ever since. French and German capital will come again, and will expect a say in what gets built."
 AUH1_build_railroads_desc:0 "The Semmering line opened in 1854 as the first mountain railway in the world, and the state has been buying up private companies since the 1880s. Track is what holds eleven nations in one market."
 AUH1_coal_mines_desc:0 "The pits of Ostrava and Karvina and the lignite of northern Bohemia feed every furnace the Monarchy owns. Deeper shafts mean more coal and more men in districts that already strike."
 AUH1_optimise_profit_desc:0 "Skoda at Pilsen and the Witkowitz ironworks sell to foreign armies as readily as to their own. Wringing more out of the same plant is what their directors do best, and ministries rarely ask how."
 AUH1_full_speed_ahead_desc:0 "The Ganz works in Budapest patented the transformer in 1885 and lit cities across Europe with it. The Monarchy is not behind in electricity, only slow to spend on what it has already invented."
 AUH1_mass_urbanisation_desc:0 "Buda, Pest and Obuda were joined into one city in 1873 and the population has more than doubled since. Villages empty, tenements fill, and the recruiting districts are redrawn around the chimneys."
 AUH1_university_desc:0 "Prague's university, founded in 1348, was split into Czech and German halves in 1882 because the two could no longer share a lecture hall. Endowed chairs and laboratories buy results all the same."
