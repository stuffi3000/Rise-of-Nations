l_english:

###############################################################################################################################
# Austria-Hungary - the constitutional trunk, second layer.
# New focus, new ideas, the reward tooltips and the press of the trunk. Press range 100-199.
###############################################################################################################################

# --- THE FORM ------------------------------------------------------------------------------------

 AUHDNC_pol_the_nine_languages_of_the_realm:0 "The Nine Languages of the Realm"
 AUHDNC_pol_the_nine_languages_of_the_realm_desc:0 "Article 19 of the Fundamental Law of 1867 admits nine languages of daily use in Cisleithania and no tenth. What is not on the form gets no school, no court and no clerk, however many people speak it."

 AUHDNC_pol_the_declaration_before_the_master:0 "The Declaration Before the Master"
 AUHDNC_pol_the_declaration_before_the_master_desc:0 "The enumerator asks for the tongue of the workplace, and the answer is given in front of the employer, the landlord or the official. In Prague, Brno, Trieste and Vienna the labour market does the counting."

 AUHDNC_pol_the_inner_language_left_unsettled:0 "The Inner Language Left Unsettled"
 AUHDNC_pol_the_inner_language_left_unsettled_desc:0 "The Badeni ordinances were withdrawn in October 1899 and nothing was put in their place. The inner language of the offices of Bohemia and Moravia is whatever the governor of the day decides it is."

 AUHDNC_pol_the_school_follows_the_return:0 "The School Follows the Return"
 AUHDNC_pol_the_school_follows_the_return_desc:0 "A commune returned German gets a German school, and the children of the minority walk to the next village. A line on a form is now worth a building, and the national associations have noticed."

 AUHDNC_pol_the_moravian_national_cadastre:0 "The Moravian National Cadastre"
 AUHDNC_pol_the_moravian_national_cadastre_desc:0 "Four provincial laws of 27 November 1905, after nine years of talks. Every voter is entered on a Czech or a German roll, the diet sits in national curias, and the school administration is doubled."

 AUHDNC_pol_the_bukovina_national_register:0 "The Bukovina National Register"
 AUHDNC_pol_the_bukovina_national_register_desc:0 "The Bukovina diet carried it in October 1909: sixty-three seats where there were thirty-one, filled through national colleges. Romanians, Ruthenes, Jews, Germans and Poles each count their own."

 AUHDNC_pol_a_case_for_yiddish:0 "A Case for Yiddish"
 AUHDNC_pol_a_case_for_yiddish_desc:0 "Admit the tenth answer and about 1.3 million people appear in the Austrian returns overnight, some 2.2 million in the Monarchy. A nation exists when the form leaves it a box."

 AUHDNC_pol_the_schools_follow_the_list:0 "The Schools Follow the List"
 AUHDNC_pol_the_schools_follow_the_list_desc:0 "Rights follow the roll and not the map: schools, tribunals and bilingual clerks wherever the list says so. Every language recognised arrives with an estimate attached to it."

# --- THE CHAMBER ---------------------------------------------------------------------------------

 AUHDNC_pol_govern_by_the_fourteenth_paragraph:0 "Government by the Fourteenth Paragraph"
 AUHDNC_pol_govern_by_the_fourteenth_paragraph_desc:0 "Section 14 of the Fundamental Law of 1867 lets the Crown legislate by ordinance while the Reichsrat is not sitting. Seventy-six were counted between 1897 and 1904. The estimates pass on the day they are signed."

 AUHDNC_pol_the_law_carried_in_the_chamber:0 "The Law Carried in the Chamber"
 AUHDNC_pol_the_law_carried_in_the_chamber_desc:0 "The method of Taaffe: portfolios, schools and branch lines for the national clubs, and a majority follows. The Polish Club took sixty-three of the four hundred and twenty-five seats in January 1901."

 AUHDNC_pol_the_ordinance_becomes_the_rule:0 "The Ordinance Becomes the Rule"
 AUHDNC_pol_the_ordinance_becomes_the_rule_desc:0 "The chamber is prorogued so that section 14 may be used, and then it is not recalled. The exception has become the procedure, and the men who sign have stopped counting."

# --- THE LONG CENTURY ----------------------------------------------------------------------------

 AUHDNC_pol_the_ninth_term:0 "The Ninth Term"
 AUHDNC_pol_the_ninth_term_desc:0 "The settlement falls due again and there is no record to follow: the Monarchy did not reach 1927. Whatever is signed now is signed by a state that was not supposed to be here."

 AUHDNC_pol_the_census_of_1930:0 "The Census of 1930"
 AUHDNC_pol_the_census_of_1930_desc:0 "Thirty years after the first count the same question is put again, and the answer is read back to the government that chose the question. Nothing else in the Monarchy is measured this plainly."

 AUHDNC_pol_the_quota_of_1937:0 "The Quota of 1937"
 AUHDNC_pol_the_quota_of_1937_desc:0 "The deputations meet once more over Hungary's share of the common charge. It was thirty in the hundred in 1867, and it has never once been settled downwards."

 AUHDNC_pol_the_bilingual_service:0 "The Bilingual Service"
 AUHDNC_pol_the_bilingual_service_desc:0 "A generation of officials who answer in the language they were addressed in. It takes twenty years and a great many examinations, and no ordinance can undo it afterwards."

 AUHDNC_pol_the_veterans_of_the_common_army:0 "The Veterans of the Common Army"
 AUHDNC_pol_the_veterans_of_the_common_army_desc:0 "One oath, one corps of officers, some eighty German words of command and the regimental tongue for everything else. The men who served under it are the only supranational body the state has."

 AUHDNC_pol_the_constitution_of_the_danubian_realm:0 "The Constitution of the Danubian Realm"
 AUHDNC_pol_the_constitution_of_the_danubian_realm_desc:0 "Not a bargain between two states but one instrument for all of them, written down and published. No such document exists in the record: the Monarchy never got the chance to draft it."

# --- IDEAS ---------------------------------------------------------------------------------------

 AUH_the_closed_list_of_nine:0 "The Closed List of Nine"
 AUH_the_closed_list_of_nine_desc:0 "Nine languages of daily use, and the administration decides what the realm is. It is quick, it is uniform, and it is arguing with a fifth of its own subjects about arithmetic."

 AUH_the_declaration_before_the_master:0 "The Declaration Before the Master"
 AUH_the_declaration_before_the_master_desc:0 "The return follows the wage. The mills of Bohemia and the yards of Trieste count as German, and the men who work in them know exactly how it was done."

 AUH_the_inner_language_unsettled:0 "The Inner Language Unsettled"
 AUH_the_inner_language_unsettled_desc:0 "No law governs the language of the offices, so the governor does. Every appointment is a national question and every national question reaches Vienna."

 AUH_the_school_of_the_return:0 "The School of the Return"
 AUH_the_school_of_the_return_desc:0 "Schools are built where the census says they are needed. The census is contested in every mixed district, and the building work goes on all the same."

 AUH_the_moravian_cadastre:0 "The Moravian Cadastre"
 AUH_the_moravian_cadastre_desc:0 "Two rolls, two curias, two school boards, one province at peace. Every institution in Moravia now exists twice, and both of them send a bill."

 AUH_the_bukovina_settlement:0 "The Bukovina Settlement"
 AUH_the_bukovina_settlement_desc:0 "Five nations, five colleges, one diet that works. The province is quiet and no longer produces a single soldier who thinks of himself as a subject first."

 AUH_a_case_for_yiddish:0 "A Case for Yiddish"
 AUH_a_case_for_yiddish_desc:0 "A literate population with its own presses and academies enters the state schools and the universities. The Galician notables who used to speak for it have lost the right to."

 AUH_the_schools_of_the_register:0 "The Schools of the Register"
 AUH_the_schools_of_the_register_desc:0 "Every recognised tongue gets its schools, its tribunals and its bilingual clerks. The peace is real and the estimates grow every single year."

 AUH_the_fourteenth_paragraph:0 "The Fourteenth Paragraph"
 AUH_the_fourteenth_paragraph_desc:0 "The government provides for the year by ordinance and nobody can stop it. It also teaches every club in the chamber that obstruction costs nothing and earns nothing."

 AUH_the_ordinance_is_the_law:0 "The Ordinance Is the Law"
 AUH_the_ordinance_is_the_law_desc:0 "The chamber has stopped being recalled. The administration has never worked faster, and there is no longer any body in the realm that can lend an act legitimacy."

 AUH_the_iron_ring_reforged:0 "The Iron Ring Reforged"
 AUH_the_iron_ring_reforged_desc:0 "The clubs are paid and the budget is voted. It is a majority made of portfolios, schools and branch lines, and it must be bought again next session."

 AUH_the_bilingual_service:0 "The Bilingual Service"
 AUH_the_bilingual_service_desc:0 "Clerks who answer in the language of the man at the counter. It costs two examinations and a supplement of salary for every post in the realm."

 AUH_the_danubian_constitution:0 "The Danubian Constitution"
 AUH_the_danubian_constitution_desc:0 "One written instrument for fifty million subjects, sanctioned and published. It binds the Crown as tightly as it binds anyone else, and the general staff has read it."

# --- REWARD NOTES --------------------------------------------------------------------------------

 AUHDNC_pol_six_questions_tt:0 "There are six questions the settlement never answered. Each of them will be answered once."
 AUHDNC_pol_the_form_decides_tt:0 "The next choice fixes the question the enumerator asks. It cannot be asked a second way."
 AUHDNC_pol_the_list_stays_shut_tt:0 "The list of recognised languages is closed. No new nationality can appear in the returns."
 AUHDNC_pol_the_register_opens_tt:0 "A roll of declared nationality is opened. Rights will follow the roll, not the province."
 AUHDNC_pol_nine_boxes_tt:0 "German, Czech-Moravian-Slovak, Polish, Ruthene, Slovene, Serbo-Croat, Italian-Ladin, Romanian, Magyar."
 AUHDNC_pol_badeni_is_not_reopened_tt:0 "The language ordinances of 1897 stay withdrawn. Nothing replaces them before 1918."
 AUHDNC_pol_the_governor_decides_tt:0 "Where the chamber does not sit, the ordinance already decides. One void covers the other."
 AUHDNC_pol_the_cadastre_tt:0 "The model of 1905: rolls, curias and schools by nation. It is the only national settlement in the Monarchy that held."
 AUHDNC_pol_sixty_three_seats_tt:0 "Twenty-three Romanians, seventeen Ruthenes, nine Jews, eight Germans, six Poles."
 AUHDNC_pol_a_tenth_line_tt:0 "About 1.3 million in Cisleithania, some 2.2 million in the Monarchy, counted for the first time."
 AUHDNC_pol_two_passports_tt:0 "A subject of the Emperor and a subject of the King remain two persons in law. The joint passport is a courtesy."
 AUHDNC_pol_the_regiment_reads_the_list_tt:0 "The regimental tongue is now decided by a roll instead of by a colonel's estimate."
 AUHDNC_pol_the_court_has_a_list_to_read_tt:0 "A court that must weigh national rights can now point at a document rather than at a map."
 AUHDNC_pol_the_charter_rests_on_the_list_tt:0 "The charter defines its peoples by the roll. Nobody has to be told which one he belongs to."

 AUHDNC_pol_the_clock_is_running_tt:0 "The settlement of 1867 was written to be renewed every ten years. It has never been renewed cheaply."
 AUHDNC_pol_thirty_three_in_the_hundred_tt:0 "Thirty in the hundred in 1867, thirty-three and six hundredths since 1897, agreed and not imposed."
 AUHDNC_pol_no_more_arithmetic_tt:0 "A lump sum instead of a computation. Nobody can prove it is wrong, which is the point of it."
 AUHDNC_pol_ten_years_bought_tt:0 "The term is set for 1917. Ten years of quiet, and the same argument waiting at the end of them."
 AUHDNC_pol_the_contingent_thaws_tt:0 "The recruit contingent has been frozen at 103,100 men by the military law of 1889. It moves at last."
 AUHDNC_pol_fifty_millions_one_market_tt:0 "One tariff, one currency, one bank for a market of nearly fifty million. Neither half can replace it."
 AUHDNC_pol_ischl_1899_tt:0 "By the arrangement of 1899 the commercial union survives a failed renewal on reciprocal royal ordinances."
 AUHDNC_pol_the_term_is_called_early_tt:0 "The deputations and the commercial negotiators are summoned. Nothing that follows can be postponed."
 AUHDNC_pol_the_same_pen_twice_tt:0 "The budget and the tariff now rest on the same signature. There is nothing else holding them up."

 AUHDNC_pol_three_letters_then_a_vote_tt:0 "Sixty from each side, three written exchanges, and a joint sitting only if all three fail."
 AUHDNC_pol_no_debate_only_a_count_tt:0 "The joint sitting votes without speech and without amendment. It has never once failed to pass the estimates."
 AUHDNC_pol_never_in_one_room_tt:0 "The two delegations sit in the same city and never in the same room. Agreement is possible because conversation is not."
 AUHDNC_pol_one_third_from_the_lords_tt:0 "One third of each delegation comes from the house of lords of its half, appointed and not elected."
 AUHDNC_pol_everything_passes_twice_tt:0 "Nothing of substance becomes law until two chambers that share no interest have both passed it."
 AUHDNC_pol_seventy_six_ordinances_tt:0 "Seventy-six ordinances under section 14 between 1897 and 1904, against thirty in the thirty years before."
 AUHDNC_pol_sixty_three_of_four_hundred_tt:0 "The Polish Club, sixty-three seats of four hundred and twenty-five, decides every Cisleithanian majority."
 AUHDNC_pol_five_weeks_of_curias_tt:0 "The general election of December 1900 ran five weeks, curia by curia. It was the last one held that way."
 AUHDNC_pol_tisza_reads_it_too_tt:0 "Closure was tried in Budapest before Vienna, and it cost three prime ministers in five months."
 AUHDNC_pol_hungary_has_no_section_fourteen_tt:0 "Hungary has no section 14. When the Diet blocks the estimates the kingdom simply falls out of law."
 AUHDNC_pol_the_rules_are_the_weapon_tt:0 "Standing orders are the dullest page of a constitution and the only one every party reads."
 AUHDNC_pol_lords_by_birth_and_by_merit_tt:0 "No reform of a lower house is final until the Herrenhaus and the House of Magnates are persuaded."
 AUHDNC_pol_one_hundred_and_three_thousand_tt:0 "103,100 recruits a year since 1889, 59,211 from Austria and 43,889 from Hungary, for a growing population."

 AUHDNC_pol_it_rests_on_one_life_tt:0 "Everything the negotiators of 1867 could not settle was left to the sovereign, and he is seventy."
 AUHDNC_pol_both_chambers_or_nothing_tt:0 "The constitution will be altered only by what both chambers pass. Nothing here can be imposed later."
 AUHDNC_pol_fall_u_is_on_the_table_tt:0 "The constitution will be altered by patent. The staff has kept a plan for the military administration of Hungary since 1905."
 AUHDNC_pol_seventeen_thirteen_tt:0 "The act of 1713, accepted by the Hungarian Diet in 1723. Both capitals concede that this one binds."
 AUHDNC_pol_the_desk_at_four_in_the_morning_tt:0 "The sovereign reads every paper of consequence in both halves, and has done so since 1848."
 AUHDNC_pol_chlopy_tt:0 "The army order given at Chlopy on 16 September 1903: the army remains common, united and undivided."
 AUHDNC_pol_bishops_and_professors_tt:0 "The Crown names the common ministers, the two prime ministers, the ban of Croatia and most of the bishops."
 AUHDNC_pol_the_house_law_is_not_the_law_tt:0 "The house law of the Habsburgs is unpublished and not justiciable, and it governs some seventy archdukes."
 AUHDNC_pol_since_1848_tt:0 "Fifty-two years on the throne. Half the officials of the realm have known no other signature."
 AUHDNC_pol_the_oath_of_28_june_tt:0 "The oath of renunciation sworn at the Hofburg on 28 June 1900, given force of law on 4 December."
 AUHDNC_pol_a_second_chancellery_tt:0 "The Belvedere keeps a military chancellery of its own, and officials answer it faster than they answer a ministry."
 AUHDNC_pol_brosch_keeps_a_list_tt:0 "The heir's chancellery holds files on every post in the realm and a cabinet ready for the day."

 AUHDNC_pol_a_room_with_no_statute_tt:0 "Three common ministers and two prime ministers meet at the Ballhausplatz. No law says the room exists."
 AUHDNC_pol_law_twelve_of_1867_tt:0 "Article 11 of the Hungarian Law XII of 1867 reserves the language of the army to the King."
 AUHDNC_pol_eighty_words_tt:0 "Some eighty German words of command, learned by every recruit, and the regiment does the rest in its own tongue."
 AUHDNC_pol_one_fifth_of_the_men_tt:0 "A tongue becomes regimental when a fifth of the men in the unit speak it. Eleven languages qualify."
 AUHDNC_pol_undertake_nothing_tt:0 "The foreign ministry has been held by one man since 1895 and has made a doctrine of undertaking nothing."
 AUHDNC_pol_the_krone_is_the_only_coin_tt:0 "Since 1900 the krone is the sole legal money of the realm, at 0.3049 grammes of fine gold."
 AUHDNC_pol_a_land_without_a_parliament_tt:0 "Bosnia belongs to neither half and is run by the common finance ministry. It has no chamber at all."
 AUHDNC_pol_justified_twice_tt:0 "The war ministry spends in both halves and must justify every florin of it twice over."
 AUHDNC_pol_a_debt_older_than_the_state_tt:0 "Hungary pays a fixed contribution towards the debts of before 1867 and never a florin more."

 AUHDNC_pol_fifteen_states_on_paper_tt:0 "Aurel Popovici published his fifteen states in 1906. Nobody in either government asked him for it."
 AUHDNC_pol_a_crown_for_zagreb_tt:0 "A third kingdom under the crown of Zvonimir. The Fiume resolution of 1905 went to Budapest because Vienna would not bid."
 AUHDNC_pol_no_record_settles_it_tt:0 "Beyond 1918 there is no record. Everything from here is a surviving empire and nothing more."
 AUHDNC_pol_the_register_holds_tt:0 "The rolls opened thirty years ago are still the rolls. Nobody is arguing about the count."
 AUHDNC_pol_the_form_holds_tt:0 "The same nine lines, the same result, the same street fights in the mixed districts."
 AUHDNC_pol_the_share_never_falls_tt:0 "Thirty in the hundred in 1867, thirty-three in 1897, thirty-six and four tenths in 1907. Never the other way."
 AUHDNC_pol_one_oath_eleven_tongues_tt:0 "One oath and eleven languages. It is the only institution of the realm that nobody had to negotiate."
 AUHDNC_pol_a_state_of_its_own_tt:0 "The settlement of 1867 is no longer the document that holds the realm together."

# --- THE PRESS, 100-199 --------------------------------------------------------------------------

 AUH_news_100_t:0 "The Form Keeps Its Nine Lines"
 AUH_news_100_d:0 "On the last day of the year the enumerators will ask not what tongue a man was taught but what tongue he uses at his work. Nine answers are admitted and no others. Prague and Brno are already arguing about what the clerks will write down."

 AUH_news_101_t:0 "Vienna Opens a Register of Nations"
 AUH_news_101_d:0 "Every subject is to enter himself on a national roll, and schools, courts and seats will follow the roll instead of the map. The provinces did it first, in Moravia and in the Bukovina. The capital has now taken the idea up for the whole realm."

 AUH_news_102_t:0 "A Tenth Line on the Form"
 AUH_news_102_d:0 "Yiddish is admitted as an answer. About 1.3 million people in the Austrian half appear in the returns where yesterday there were none, some 2.2 million in the Monarchy. The estimates for schools and tribunals are being redrawn this week."

 AUH_news_103_t:0 "The Chamber Is Sent Home"
 AUH_news_103_d:0 "The Reichsrat is prorogued and the government will provide for the year by ordinance under section fourteen. Seventy-six such ordinances were counted between 1897 and 1904. The estimates are in force tomorrow and nobody has voted for them."

 AUH_news_104_t:0 "The Estimates Pass on a Vote"
 AUH_news_104_d:0 "A majority has been assembled out of the national clubs, and it has cost portfolios, schools and a great many branch railway lines. The Polish Club, sixty-three seats at the January election, settled the matter as it settles all of them."

 AUH_news_105_t:0 "Budapest Takes Thirty-Six in the Hundred"
 AUH_news_105_d:0 "The settlement is renewed for ten years and Hungary's share of the common charge rises again. It was thirty in the hundred in 1867 and thirty-three since 1897. The two halves are now two customs territories bound by a treaty."

 AUH_news_106_t:0 "No Treaty at Midnight"
 AUH_news_106_d:0 "The term ran out and nothing was signed. The commercial union continues on reciprocal royal ordinances while the deputations are recalled. Merchants on both banks of the Leitha are asking under what law they traded this morning."

 AUH_news_107_t:0 "A Customs Line Down the Leitha"
 AUH_news_107_d:0 "Vienna has set a tariff against Budapest. The industry of Bohemia and Lower Austria gains a protected market; the corn of the Hungarian plain must pay to enter it. Berlin has asked which of the two halves signed its commercial treaty."

 AUH_news_108_t:0 "The Crown Legislates Alone"
 AUH_news_108_d:0 "The constitution is to be altered by patent, without either chamber. The general staff has kept a plan for the military administration of Hungary in a drawer since 1905. The counties have begun to refuse the tax and the recruit."

 AUH_news_109_t:0 "The Charter of the Peoples"
 AUH_news_109_d:0 "Both chambers have passed it and the sovereign has sanctioned it. The nations of the Monarchy hold their rights from a written instrument and no longer from a bargain between two governments. No neighbour has such a document."

 AUH_news_110_t:0 "Indivisibiliter ac Inseparabiliter"
 AUH_news_110_d:0 "One realm, one army, one chamber, proclaimed by patent from the Hofburg. The Hungarian counties answer that the coronation oath forbids it. Recruits are being levied under the new law and the garrisons have been reinforced."

 AUH_news_111_t:0 "One Instrument for Fifty Million"
 AUH_news_111_d:0 "The realm has a constitution of its own, and the settlement of 1867 is no longer the document that holds it together. It has taken thirty years of decennial terms and more than one census to write. Nothing made this likely."

# --- IDEAS OF THE TRUNK, SECOND LAYER ------------------------------------------------------------

 AUH_the_statistical_commission:0 "The Statistical Central Commission"
 AUH_the_statistical_commission_desc:0 "It counted 26.2 million in Cisleithania on the last day of 1900 and 19.3 million in Hungary. The commission does not describe the realm, it decides what the realm is allowed to be."

 AUH_the_quota_deputations:0 "The Quota Deputations"
 AUH_the_quota_deputations_desc:0 "Own revenue and customs first, then two per cent charged to Hungary for the Military Frontier, then the agreed ratio on what is left. The same arithmetic every ten years, argued by two treasuries who both want it lower."

 AUH_the_szell_formula:0 "The Szell Formula"
 AUH_the_szell_formula_desc:0 "No treaty, only reciprocal royal ordinances that keep the customs union alive and put a clock on it. Nothing is settled and nothing collapses either, until the clock runs out."

 AUH_the_delegations_of_sixty:0 "The Delegations of Sixty"
 AUH_the_delegations_of_sixty_desc:0 "Sixty members a side, one third named by the upper house and two thirds by the lower. They vote the common estimates in separate rooms, which is quick for a budget and slow for anything with a factory at the end of it."

 AUH_the_deputations_in_session:0 "The Deputations in Session"
 AUH_the_deputations_in_session_desc:0 "While the deputations sit, the common budget moves and nothing else does. Ministers wait, offices wait, and the two governments answer no question that is not on the schedule."

 AUH_the_exchange_of_nuntien:0 "The Exchange of Nuntien"
 AUH_the_exchange_of_nuntien_desc:0 "The two delegations never debate together. They exchange three written messages, then meet only to count votes without a word spoken. The procedure exists so that neither half can be outvoted in public."

 AUH_the_supreme_audit_office:0 "The Supreme Audit Office"
 AUH_the_supreme_audit_office_desc:0 "One set of books for two governments, and every common krone accounted for twice. Waste falls, and so does the speed at which anything is approved."

 AUH_everything_passes_twice:0 "Everything Passes Twice"
 AUH_everything_passes_twice_desc:0 "A common law must pass in Vienna and in Budapest in identical terms or it is not law. Nothing arbitrary survives the second reading, and nothing urgent survives the first."

 AUH_the_year_without_a_budget:0 "The Year Without a Budget"
 AUH_the_year_without_a_budget_desc:0 "Hungary has no section fourteen. When the Chamber blocks the estimates the kingdom simply falls out of law, taxes and recruits with it, and there is no legal door out of it."

 AUH_the_right_of_nomination:0 "The Right of Nomination"
 AUH_the_right_of_nomination_desc:0 "Bishops, university chairs and peers for life are the crown's to give. It buys a service and a bench that answer to the Hofburg, and it turns every appointment into a political debt."

 AUH_the_house_law_of_the_habsburgs:0 "The House Law of the Habsburgs"
 AUH_the_house_law_of_the_habsburgs_desc:0 "The family statute binds some seventy archdukes and is not printed in the law gazette. When it had to bind the state as well, in December 1900, a separate act of parliament was needed."

 AUH_since_eighteen_forty_eight:0 "Since 1848"
 AUH_since_eighteen_forty_eight_desc:0 "The emperor has reigned longer than the compromise, longer than the constitution, and longer than most of his ministers have been alive. Everything holds. Nothing moves without the one desk."

 AUH_the_krone:0 "The Krone"
 AUH_the_krone_desc:0 "From 1900 the krone is the only legal coin of the monarchy and the florin note is dead. Two crowns to the florin, 0.3049 grams of fine gold. The common currency was finished by a Hungarian finance minister."

 AUH_the_united_states_of_greater_austria:0 "The United States of Greater Austria"
 AUH_the_united_states_of_greater_austria_desc:0 "Popovici's book, printed in Leipzig in 1906 with a map: fifteen national states in place of two kingdoms. It was read at the Belvedere and never adopted, and every nationality now knows what it might have had."

 AUH_opp_the_uncrowned_king:0 "The Uncrowned King"
 AUH_opp_the_uncrowned_king_desc:0 "A king who has not sworn on the Hungarian constitution cannot sanction a Hungarian law. Vienna is free of the oath, and free of the kingdom's obedience along with it."

 AUH_opp_the_protestant_patent:0 "The Protestant Patent"
 AUH_opp_the_protestant_patent_desc:0 "The Augsburg and Helvetic confessions govern themselves, keep their consistories and run their own schools. It is cheap, it is quiet, and every other confession has now read the text."

 AUH_opp_the_ministry_of_appointments:0 "The Ministry of Appointments"
 AUH_opp_the_ministry_of_appointments_desc:0 "The German course is paid in posts rather than in laws. The register of appointments becomes the party whip, and every district that is passed over learns to count in its own language."

 AUH_opp_one_schedule_two_services:0 "One Schedule, Two Services"
 AUH_opp_one_schedule_two_services_desc:0 "The tariff is common and the customs houses are not. Goods cross one frontier and two administrations, each with its own staff, its own returns and its own reasons to disagree with the other."

 AUH_opp_the_guillotine_in_the_house:0 "The Guillotine in the House"
 AUH_opp_the_guillotine_in_the_house_desc:0 "The chair may name a deputy and exclude him from the sitting, and the standing orders no longer reward a man who can speak for eleven hours. Business gets done, at the price of the argument for doing it."

 AUH_opp_the_chamber_that_works:0 "The Chamber That Works"
 AUH_opp_the_chamber_that_works_desc:0 "Estimates go to a timetable and the house votes them on the day. A parliament that can be governed is also one that can refuse, and it now refuses in writing rather than by noise."

 AUH_opp_the_money_orders_come_back:0 "The Money Orders Come Back"
 AUH_opp_the_money_orders_come_back_desc:0 "Between 1899 and 1913 some 1.39 million subjects left Hungary, more than eight in ten of them for the United States. The remittances build the roads. The men do not come back for the levy."

# --- REWARD TOOLTIPS, SECOND LAYER ---------------------------------------------------------------

 AUHDNC_pol_one_chamber_for_fifty_millions_tt:0 "One chamber for fifty million subjects. Budapest would have to be asked, and Budapest has never once said yes."
 AUHDNC_pol_the_right_of_interpellation_tt:0 "A delegate may question a common minister and must be answered. He still cannot vote him out of office."
 AUHDNC_opp_law_xix_of_1907_tt:0 "Sickness and accident cover in one national institution. The employer pays half the sickness contribution and the whole of the accident one, and takes half the seats on the board."
 AUHDNC_opp_the_congress_of_the_laity_tt:0 "The Catholic congress meets in Vienna, and it is the laity rather than the bishops that does the organising."
