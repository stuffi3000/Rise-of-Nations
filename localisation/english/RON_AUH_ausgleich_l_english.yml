###############################################################################################################################
# Austria-Hungary : the Compromise and its expiry.
# Lot 16. Every key below is new; none of them exists anywhere else in the mod.
###############################################################################################################################

# --- The five tiers of the Compromise --------------------------------------------------------

 AUH_gesamtmonarchie:0 "Einheitsreich"
 AUH_gesamtmonarchie_desc:0 "One army, one customs line, one budget, one language of command. Nobody outside Vienna consented to it, and the loyalty of the governed pays for it every month - twice over in Hungary.\n\nThe Community: [?AUH_gemeinsamkeit|0] - [GetAUHCommunity]\nThe Quota: [?AUH_quote|0] per cent - The term: [GetAUHTerm]\n\nUnder 35 a crown land stops being crown land and the cores fall; under 20 the administration stops answering; under 5 the province is armed, and the retaking begins 120 days after.\n\nThe nationalities\nAustrian Germans [?AUS_support|0] - [GetAUHStatus_AUS], [GetAUHForecast_AUS]\nHungarians [?HUN_support|0] - [GetAUHStatus_HUN], [GetAUHForecast_HUN]\nCzechs [?CZE_support|0] - [GetAUHStatus_CZE], [GetAUHForecast_CZE]\nSlovaks [?SLO_support|0] - [GetAUHStatus_SLO], [GetAUHForecast_SLO]\nPoles [?POL_support|0] - [GetAUHStatus_POL], [GetAUHForecast_POL]\nRuthenians [?UKR_support|0] - [GetAUHStatus_UKR], [GetAUHForecast_UKR]\nRomanians [?ROM_support|0] - [GetAUHStatus_ROM], [GetAUHForecast_ROM]\nCroats [?CRO_support|0] - [GetAUHStatus_CRO], [GetAUHForecast_CRO]\nSlovenes [?SLV_support|0] - [GetAUHStatus_SLV], [GetAUHForecast_SLV]\nItalians [?ITA_support|0] - [GetAUHStatus_ITA], [GetAUHForecast_ITA]\nBosniaks [?BOS_support|0] - [GetAUHStatus_BOS], [GetAUHForecast_BOS]\nSerbs [?SER_support|0] - [GetAUHStatus_SER], [GetAUHForecast_SER]\n\nNothing is written for a Slovak or an Italian rising; they lose the cores and the compliance all the same. The German lands are on the list with the rest, and go the same way."

 AUH_the_indivisible_army:0 "Gesamtmonarchie"
 AUH_the_indivisible_army_desc:0 "The common army holds: regiments mixed rather than national, one language of command throughout. The contingent has not risen since 1889, and Hungary sells that vote by the decade.\n\nThe Community: [?AUH_gemeinsamkeit|0] - [GetAUHCommunity]\nThe Quota: [?AUH_quote|0] per cent - The term: [GetAUHTerm]\n\nUnder 35 a crown land stops being crown land and the cores fall; under 20 the administration stops answering; under 5 the province is armed, and the retaking begins 120 days after.\n\nThe nationalities\nAustrian Germans [?AUS_support|0] - [GetAUHStatus_AUS], [GetAUHForecast_AUS]\nHungarians [?HUN_support|0] - [GetAUHStatus_HUN], [GetAUHForecast_HUN]\nCzechs [?CZE_support|0] - [GetAUHStatus_CZE], [GetAUHForecast_CZE]\nSlovaks [?SLO_support|0] - [GetAUHStatus_SLO], [GetAUHForecast_SLO]\nPoles [?POL_support|0] - [GetAUHStatus_POL], [GetAUHForecast_POL]\nRuthenians [?UKR_support|0] - [GetAUHStatus_UKR], [GetAUHForecast_UKR]\nRomanians [?ROM_support|0] - [GetAUHStatus_ROM], [GetAUHForecast_ROM]\nCroats [?CRO_support|0] - [GetAUHStatus_CRO], [GetAUHForecast_CRO]\nSlovenes [?SLV_support|0] - [GetAUHStatus_SLV], [GetAUHForecast_SLV]\nItalians [?ITA_support|0] - [GetAUHStatus_ITA], [GetAUHForecast_ITA]\nBosniaks [?BOS_support|0] - [GetAUHStatus_BOS], [GetAUHForecast_BOS]\nSerbs [?SER_support|0] - [GetAUHStatus_SER], [GetAUHForecast_SER]\n\nNothing is written for a Slovak or an Italian rising; they lose the cores and the compliance all the same. The German lands are on the list with the rest, and go the same way."

 AUH_the_two_parliaments:0 "Dualismus"
 AUH_the_two_parliaments_desc:0 "The settlement as Deak and Andrassy wrote it: two governments, two parliaments, one common ministry of three portfolios. Everything of substance has to be carried twice.\n\nThe Community: [?AUH_gemeinsamkeit|0] - [GetAUHCommunity]\nThe Quota: [?AUH_quote|0] per cent - The term: [GetAUHTerm]\n\nUnder 35 a crown land stops being crown land and the cores fall; under 20 the administration stops answering; under 5 the province is armed, and the retaking begins 120 days after.\n\nThe nationalities\nAustrian Germans [?AUS_support|0] - [GetAUHStatus_AUS], [GetAUHForecast_AUS]\nHungarians [?HUN_support|0] - [GetAUHStatus_HUN], [GetAUHForecast_HUN]\nCzechs [?CZE_support|0] - [GetAUHStatus_CZE], [GetAUHForecast_CZE]\nSlovaks [?SLO_support|0] - [GetAUHStatus_SLO], [GetAUHForecast_SLO]\nPoles [?POL_support|0] - [GetAUHStatus_POL], [GetAUHForecast_POL]\nRuthenians [?UKR_support|0] - [GetAUHStatus_UKR], [GetAUHForecast_UKR]\nRomanians [?ROM_support|0] - [GetAUHStatus_ROM], [GetAUHForecast_ROM]\nCroats [?CRO_support|0] - [GetAUHStatus_CRO], [GetAUHForecast_CRO]\nSlovenes [?SLV_support|0] - [GetAUHStatus_SLV], [GetAUHForecast_SLV]\nItalians [?ITA_support|0] - [GetAUHStatus_ITA], [GetAUHForecast_ITA]\nBosniaks [?BOS_support|0] - [GetAUHStatus_BOS], [GetAUHForecast_BOS]\nSerbs [?SER_support|0] - [GetAUHStatus_SER], [GetAUHForecast_SER]\n\nNothing is written for a Slovak or an Italian rising; they lose the cores and the compliance all the same. The German lands are on the list with the rest, and go the same way."

 AUH_the_hungarian_bargain:0 "Zwei Staaten"
 AUH_the_hungarian_bargain_desc:0 "Budapest has what the Party of Independence has demanded since 1867. The common army has split down the middle, and the naval estimates no longer pass.\n\nThe Community: [?AUH_gemeinsamkeit|0] - [GetAUHCommunity]\nThe Quota: [?AUH_quote|0] per cent - The term: [GetAUHTerm]\n\nUnder 35 a crown land stops being crown land and the cores fall; under 20 the administration stops answering; under 5 the province is armed, and the retaking begins 120 days after.\n\nThe nationalities\nAustrian Germans [?AUS_support|0] - [GetAUHStatus_AUS], [GetAUHForecast_AUS]\nHungarians [?HUN_support|0] - [GetAUHStatus_HUN], [GetAUHForecast_HUN]\nCzechs [?CZE_support|0] - [GetAUHStatus_CZE], [GetAUHForecast_CZE]\nSlovaks [?SLO_support|0] - [GetAUHStatus_SLO], [GetAUHForecast_SLO]\nPoles [?POL_support|0] - [GetAUHStatus_POL], [GetAUHForecast_POL]\nRuthenians [?UKR_support|0] - [GetAUHStatus_UKR], [GetAUHForecast_UKR]\nRomanians [?ROM_support|0] - [GetAUHStatus_ROM], [GetAUHForecast_ROM]\nCroats [?CRO_support|0] - [GetAUHStatus_CRO], [GetAUHForecast_CRO]\nSlovenes [?SLV_support|0] - [GetAUHStatus_SLV], [GetAUHForecast_SLV]\nItalians [?ITA_support|0] - [GetAUHStatus_ITA], [GetAUHForecast_ITA]\nBosniaks [?BOS_support|0] - [GetAUHStatus_BOS], [GetAUHForecast_BOS]\nSerbs [?SER_support|0] - [GetAUHStatus_SER], [GetAUHForecast_SER]\n\nNothing is written for a Slovak or an Italian rising; they lose the cores and the compliance all the same. The German lands are on the list with the rest, and go the same way."

 AUH_the_personal_union:0 "Personalunion"
 AUH_the_personal_union_desc:0 "Nothing is held in common but the person of the King-Emperor. No joint budget, no quota, no common ministry - and no common foreign policy. The Empire must ask Budapest before it can go to war.\n\nThe Community: [?AUH_gemeinsamkeit|0] - [GetAUHCommunity]\nThe Quota: [?AUH_quote|0] per cent - The term: [GetAUHTerm]\n\nUnder 35 a crown land stops being crown land and the cores fall; under 20 the administration stops answering; under 5 the province is armed, and the retaking begins 120 days after.\n\nThe nationalities\nAustrian Germans [?AUS_support|0] - [GetAUHStatus_AUS], [GetAUHForecast_AUS]\nHungarians [?HUN_support|0] - [GetAUHStatus_HUN], [GetAUHForecast_HUN]\nCzechs [?CZE_support|0] - [GetAUHStatus_CZE], [GetAUHForecast_CZE]\nSlovaks [?SLO_support|0] - [GetAUHStatus_SLO], [GetAUHForecast_SLO]\nPoles [?POL_support|0] - [GetAUHStatus_POL], [GetAUHForecast_POL]\nRuthenians [?UKR_support|0] - [GetAUHStatus_UKR], [GetAUHForecast_UKR]\nRomanians [?ROM_support|0] - [GetAUHStatus_ROM], [GetAUHForecast_ROM]\nCroats [?CRO_support|0] - [GetAUHStatus_CRO], [GetAUHForecast_CRO]\nSlovenes [?SLV_support|0] - [GetAUHStatus_SLV], [GetAUHForecast_SLV]\nItalians [?ITA_support|0] - [GetAUHStatus_ITA], [GetAUHForecast_ITA]\nBosniaks [?BOS_support|0] - [GetAUHStatus_BOS], [GetAUHForecast_BOS]\nSerbs [?SER_support|0] - [GetAUHStatus_SER], [GetAUHForecast_SER]\n\nNothing is written for a Slovak or an Italian rising; they lose the cores and the compliance all the same. The German lands are on the list with the rest, and go the same way."

# --- The mechanism ---------------------------------------------------------------------------

 AUH_the_frozen_contingent:0 "The Frozen Contingent"
 AUH_the_frozen_contingent_desc:0 "The recruit contingent has not moved since 1889; raising it is a matter for a Hungarian parliament with other business. Pay Hungary a large enough share of the common expenditure and it thaws."

 AUH_hungarian_national_resistance:0 "Hungarian National Resistance"
 AUH_hungarian_national_resistance_desc:0 "The counties have stopped collecting the tax and delivering the recruits. It is not a rising but an administration declining to administer. Fejervary met the same thing in 1905 and governed a year on royal commissioners."

 AUH_the_provisorium:0 "The Provisorium"
 AUH_the_provisorium_desc:0 "The term passed and nothing was signed. Customs union, bank charter and quota now run by imperial ordinance, valid until either parliament decides they are not."

 AUH_bought_union:0 "The Bought Union"
 AUH_bought_union_desc:0 "The separation was averted the only way it could be: by paying for it. Hungary's share of the common expenditure is fixed at half, permanently, out of Cisleithania's pocket."

 AUH_the_decennial_bargain:0 "The Decennial Bargain"
 AUH_the_decennial_bargain_desc:0 "A common market of fifty million, one tariff wall, one central bank - on a contract with an expiry date printed on it. Manufacturers in Bohemia plan ten years ahead and price the risk in."

 AUH_two_customs_territories:0 "Two Customs Territories"
 AUH_two_customs_territories_desc:0 "The settlement of 1907 conceded the principle: two customs territories bound by treaty, not one bound by the constitution. The goods still cross freely, but a contract can be allowed to lapse."

 AUH_alpine_railway_bonds:0 "Alpine Railway Bonds"
 AUH_alpine_railway_bonds_desc:0 "Koerber's programme of 1901, carried on borrowed money: the Tauern, Karawanken and Wochein lines, driven through the Alps to bring Trieste within reach. The canal promised to Bohemia was never dug."

 AUH_the_preventive_war_memoranda:0 "The Preventive War Memoranda"
 AUH_the_preventive_war_memoranda_desc:0 "Conrad von Hoetzendorf asks for a preventive war against Serbia and, more often, against Italy. The Emperor refused him in 1908, in 1909 and again in 1911. Keeping him at the General Staff keeps the memoranda coming."

 AUH_the_danubian_settlement:0 "The Danubian Settlement"
 AUH_the_danubian_settlement_desc:0 "The preferential customs union of the Danube basin, put to the powers by Tardieu in 1932. Berlin and Rome killed the original at London that spring, and have not changed their minds about it."

# --- Tooltips --------------------------------------------------------------------------------

 auh_ausgleich_renewal_window_tt:0 "The Delegations will sit for eighteen months. The Community stands at [?AUH_gemeinsamkeit], the Quota at [?AUH_quote] per cent."
 auh_renewal_window_open_tt:0 "The term of the settlement is open for renegotiation."
 auh_renewal_concluded_tt:0 "A new settlement has been concluded with the Delegations of both parliaments."

# --- Decisions -------------------------------------------------------------------------------

 AUH_the_ausgleich_term:0 "The Term of the Settlement"
 AUH_the_ausgleich_term_desc:0 "The Compromise is written for ten years at a time. Eighteen months before it runs out the Delegations of both parliaments convene to write the next one. Failing that, government by ordinance."

 AUH_the_decennial_renewal:0 "Renew the Compromise"
 AUH_the_decennial_renewal_desc:0 "Settle the quota, renew the bank charter, carry the customs union through both houses, and buy the Monarchy another ten years as one state. Concluded before the term falls due, it is worth more than one concluded late."

# --- Events ----------------------------------------------------------------------------------

 auh_ausgleich.10.t:0 "The Term Falls Due"
 auh_ausgleich.10.d:0 "The Delegations are summoned, sixty from each parliament, to sit apart and correspond in writing as the settlement requires - they may not debate together, and they have not since 1867. Before them: the quota, the bank charter, the tariff, and the recruit contingent. Behind them, in Budapest, a Diet that has already worked out what all four are worth."
 auh_ausgleich.10.a:0 "Let the Delegations sit."
 auh_ausgleich.10.b:0 "Send the ministers to Budapest first."

 auh_ausgleich.11.t:0 "Budapest Must Be Asked"
 auh_ausgleich.11.d:0 "There is no longer a common ministry of foreign affairs in any sense that matters. The declaration lies on the desk, drafted, signed by no one, waiting on a Hungarian cabinet that has already made it clear the price of its signature is not measured in gratitude."
 auh_ausgleich.11.a:0 "Pay what Budapest asks."
 auh_ausgleich.11.b:0 "Go to war without them."

 auh_ausgleich.12.t:0 "Government by Ordinance"
 auh_ausgleich.12.d:0 "The term has passed. Nothing was signed. The customs union, the bank charter and the quota now stand on an imperial ordinance renewed at intervals, which is to say on nothing at all, and every ministry on both sides of the Leitha is drafting for a settlement that does not exist."
 auh_ausgleich.12.a:0 "Rule under the emergency article."
 auh_ausgleich.12.b:0 "Extend the old settlement by decree."

 auh_ausgleich.20.t:0 "The Amicable Separation"
 auh_ausgleich.20.d:0 "Ferenc Kossuth and Gyula Justh have been asking for the same three things since their fathers asked for them: a Hungarian army, a Hungarian bank, a Hungarian tariff. They won the election of 1905 with them and were kept from office for a year. There is now nothing left of the common administration substantial enough to refuse them with, and the question has come back in the only form it has ever taken - all three, or none, or a price."
 auh_ausgleich.20.a:0 "Grant it. Let the Crown be all that is left."
 auh_ausgleich.20.b:0 "Refuse. The Monarchy is not a treaty to be denounced."
 auh_ausgleich.20.c:0 "Pay for it. Half the common expenditure, permanently."

 auh_ausgleich.30.t:0 "The Strike of the Counties"
 auh_ausgleich.30.d:0 "The Transleithanian counties have stopped collecting the tax and stopped delivering the recruits. No proclamation, no barricade, no shot fired: the county assemblies have simply resolved that the orders reaching them are not lawful orders, and the clerks have gone home. Fejervary met this in 1905 and held out for a year on royal commissioners. The settlement provides for war, for succession and for bankruptcy. It does not provide for an administration that declines to administer."
 auh_ausgleich.30.a:0 "Send the royal commissioners."
 auh_ausgleich.30.b:0 "Dissolve the Diet and call the election."
