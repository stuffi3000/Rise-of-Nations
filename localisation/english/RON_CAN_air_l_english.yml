l_english:

 ##### SHARED TRIGGER
 CAN_air_direction_chosen_tt:0 "The Dominion has settled what its flying is §Yfor§!"

 ##### THE DIRECTION
 CAN_a_service_for_the_country:0 "A Service for the Country"
 CAN_a_service_for_the_country_desc:0 "Four thousand miles of forest, muskeg and rock, and no road through most of it. An aeroplane here is a vehicle before it is a weapon: mail, timber survey, the sick man out of the bush. Build for distance and for landing anywhere."
 CAN_a_service_for_the_country_tt:0 "Canadian flying is organised §Yaround the territory§!. §GAerodromes rise faster, machines reach further and fewer are lost.§! §RCrews trained for the bush will not be trained for combat.§! This decision cannot be revisited."
 CAN_a_service_for_the_empire:0 "A Service for the Empire"
 CAN_a_service_for_the_empire_desc:0 "The machine that matters is the one that fights. Whatever the Dominion builds will be counted in London, flown in someone else's sky and measured against squadrons, not against distances. Train men, not routes."
 CAN_a_service_for_the_empire_tt:0 "Canadian flying is organised §Yaround the squadron§!. §GPilots learn faster and aces appear more often.§! §RRange and aerodrome building suffer: nothing is built for the North.§! This decision cannot be revisited."

 ##### THE CIVIL DECADE
 CAN_the_forest_patrol:0 "The Forest Patrol"
 CAN_the_forest_patrol_desc:0 "Fire spotting over the timber limits, sketch maps of country no surveyor has walked, a flying boat on every northern lake by July. It is not war work and nobody pretends it is, which is exactly why the estimates pass."
 CAN_the_forest_patrol_tt:0 "The service earns its vote in §Ypeacetime work§!. §GNorthern Ontario gains a building slot and the country is easier to govern.§! Crews accumulate hours over ground no map shows."
 CAN_the_preventive_flights:0 "The Preventive Flights"
 CAN_the_preventive_flights_desc:0 "Prohibition made the lakes a business. Ottawa puts aeroplanes over the Customs Preventive Service and Washington notices, gratefully, that the Dominion is policing the traffic from its own side of the line."
 CAN_the_preventive_flights_tt:0 "Aircraft are lent to the §YCustoms Preventive Service§!. §GCommand staff gain from running a standing patrol, and Washington approves of a neighbour that watches its own shore.§!"

 ##### THE SLUMP
 CAN_the_great_cut:0 "The Great Cut"
 CAN_the_great_cut_desc:0 "The air estimates fall by two thirds in a single year. Officers and airmen are let go, stations close, and the same defence vote now feeds unemployed men in camps. The service will call it the great cut for thirty years."
 CAN_the_great_cut_tt:0 "The air vote is §Ycut by two thirds§!. §GThe Treasury is relieved and the government has room to move.§! §RThe air service loses seven years: crews, stations and the beginnings of an aircraft industry.§!"
 CAN_protect_the_air_vote:0 "Protect the Air Vote"
 CAN_protect_the_air_vote_desc:0 "The minister refuses to gut the youngest service to pay for relief. Every dollar defended here is a dollar the Opposition will name in the House, beside a photograph of a man in a camp earning twenty cents a day."
 CAN_protect_the_air_vote_tt:0 "The air estimates are §Ydefended in the House§!. §GThe service keeps its stations, its crews and its momentum.§! §RThe political cost is immediate and the relief camps are the argument used against you.§!"

 ##### THE NATIONAL LINE
 CAN_trans_canada_air_lines:0 "Trans-Canada Air Lines"
 CAN_trans_canada_air_lines_desc:0 "A Crown company under the National Railways, with the transcontinental route to itself by statute. Howe wants an east-west line that owes nothing to Seattle or Chicago, and he is prepared to build it rather than buy it."
 CAN_trans_canada_air_lines_tt:0 "A §Ystate airline§! holds the transcontinental route. §GInfrastructure work speeds up, transports enter the stockpile and the country is bound west to east.§! §RThe monopoly is paid for out of the same budget as everything else.§!"
 CAN_the_richardson_solution:0 "The Richardson Solution"
 CAN_the_richardson_solution_desc:0 "Canadian Airways already has the crews, the machines and ten years of the North. Give the main line to Richardson and the country saves the cost of learning it twice, at the price of depending on private capital for a strategic route."
 CAN_the_richardson_solution_tt:0 "The main line goes to the §Yprivate operator§!. §GThe Treasury is spared, foreign traders approve and bush experience carries the route.§! §RThe state builds nothing and the service learns nothing.§!"

 ##### THE WAR CABINET
 CAN_a_minister_for_the_air:0 "A Minister for the Air"
 CAN_a_minister_for_the_air_desc:0 "Chubby Power takes National Defence for Air, a portfolio that did not exist. The youngest service now has a man at the cabinet table who answers for it, and two older services who resent that he is there at all."
 CAN_a_minister_for_the_air_tt:0 "The air service gets §Yits own minister§!. §GAir command appointments cost less and the service learns faster.§! §RA third defence minister divides the cabinet's attention.§!"

 ##### MALTON
 CAN_the_jetliner:0 "The Jetliner"
 CAN_the_jetliner_desc:0 "The C-102 flies at Malton thirteen days after the Comet: the second jet airliner in the world. Finishing it means a civil aircraft industry and an export line. Howe would rather have interceptors."
 CAN_the_jetliner_tt:0 "Malton finishes the §Ycivil airliner§!. §GIndustry, infrastructure and foreign custom all gain, and the country has something to sell that is not a weapon.§! §RInterception of our own sky is neglected.§!"
 CAN_all_for_the_interceptor:0 "All for the Interceptor"
 CAN_all_for_the_interceptor_desc:0 "The Jetliner is put away and the whole shop goes to the fighter. It is the right answer for a country whose sky is the shortest road between Moscow and Chicago, and the wrong one for everything else Malton might have built."
 CAN_all_for_the_interceptor_tt:0 "Malton builds §Ynothing but fighters§!. §GInterception and home defence improve sharply.§! §RThe civil programme dies and the shop lives on defence contracts alone.§!"

 ##### THE CIVIL SEAT
 CAN_the_seat_of_world_aviation:0 "The Seat of World Aviation"
 CAN_the_seat_of_world_aviation_desc:0 "Montreal is chosen as the permanent home of the provisional international civil aviation organisation. The Dominion trades the geography it flew all war - Gander, Dorval, the northern route - for an institution nobody can move."
 CAN_the_seat_of_world_aviation_tt:0 "Montreal becomes the §Yseat of world civil aviation§!. §GPrestige, foreign goodwill, a building slot in Quebec and safer skies.§! §ROur aerodromes now serve everyone's traffic first.§!"
 CAN_gander_and_goose_bay:0 "Gander and Goose Bay"
 CAN_gander_and_goose_bay_desc:0 "The two fields that made the Atlantic crossing routine sit on ground the Dominion did not own in 1939. Whoever holds them holds the shortest air road between the continents, in peace as in war."
 CAN_gander_and_goose_bay_tt:0 "The §YNorth Atlantic gateway§! is taken in hand. §GAerodromes are built on the eastern approaches and transport development accelerates.§! Newfoundland in the Dominion makes the work far cheaper."
 CAN_the_rules_of_the_air:0 "The Rules of the Air"
 CAN_the_rules_of_the_air_desc:0 "An airliner comes down in Charlevoix and the inquiry finds that nothing in law protected the passengers from a parcel handed in at the counter. Regulation follows: manifests, inspection, and an industry that must now prove it is safe."
 CAN_the_rules_of_the_air_tt:0 "Civil flying is §Yregulated in earnest§!. §GAccidents fall sharply, training improves and the public trusts the aeroplane.§! §RThe operators carry the cost of the new standards.§!"

 ##### TECHNOLOGY BONUSES
 CAN_early_airframe_bonus:0 "The Baddeck Machines"
 CAN_north_atlantic_bonus:0 "The Northern Route"
 CAN_jetliner_bonus:0 "The C-102"
 CAN_interceptor_bonus:0 "The All-Weather Fighter"
 CAN_canuck_bonus:0 "The CF-100"
 CAN_pinetree_bonus:0 "The Early Warning Chain"

 ##### IDEAS
 CAN_idea_a_service_for_the_country:0 "A Service for the Country"
 CAN_idea_a_service_for_the_country_desc:0 "Flying here answers to the map. The machines are built to carry, to reach and to come down on water, gravel or snow, and the men who fly them can navigate a thousand miles of nothing. Put them against a fighter and it shows."
 CAN_idea_a_service_for_the_empire:0 "A Service for the Empire"
 CAN_idea_a_service_for_the_empire_desc:0 "Everything is measured against a squadron in someone else's sky. The training is hard, the pilots are good and the best become famous. No aerodrome is built north of the settled belt, because none is needed for the war we prepare for."
 CAN_idea_the_great_cut:0 "The Great Cut"
 CAN_idea_the_great_cut_desc:0 "Two thirds of the air estimates gone in a year. The stations are shut, the trained men are gone to the bush companies or to the American lines, and what remains flies old machines badly maintained. The money saved is real, and so is the decade lost."
 CAN_idea_protect_the_air_vote:0 "The Air Vote Defended"
 CAN_idea_protect_the_air_vote_desc:0 "The service came through the slump with its stations open and its instructors employed, which is why it can expand at all when the time comes. Every session the Opposition reads out what it costs, next to the relief figures."
 CAN_idea_trans_canada_air_lines:0 "Trans-Canada Air Lines"
 CAN_idea_trans_canada_air_lines_desc:0 "A public airline with the main line to itself. The country gets a schedule from ocean to ocean that owes nothing to any foreign carrier, and the taxpayer gets the deficit. The bush operators who opened the North are left the North."
 CAN_idea_the_richardson_solution:0 "The Richardson Solution"
 CAN_idea_the_richardson_solution_desc:0 "The main line is flown by a private company with British and American money behind it. It is cheaper, it is experienced, and it means the strategic route of the Dominion is a commercial contract that can be sold."
 CAN_idea_a_minister_for_the_air:0 "National Defence for Air"
 CAN_idea_a_minister_for_the_air_desc:0 "The air service has a minister of its own, a staff of its own and a place in the war cabinet. The army and the navy now argue with a third department instead of administering it."
 CAN_idea_the_jetliner:0 "The Jetliner"
 CAN_idea_the_jetliner_desc:0 "A jet airliner built in Ontario and flying two weeks after the Comet. It gives the country an aircraft industry that does not live on defence contracts, and every hour spent on it is an hour not spent on the interceptor."
 CAN_idea_all_for_the_interceptor:0 "All for the Interceptor"
 CAN_idea_all_for_the_interceptor_desc:0 "The whole shop is turned over to the all-weather fighter. Our own sky is covered as well as any in the world. The civil programme is scrap, and the firm now depends entirely on one customer who can cancel."
 CAN_idea_the_seat_of_world_aviation:0 "The Seat of World Aviation"
 CAN_idea_the_seat_of_world_aviation_desc:0 "Montreal keeps the international organisation, the conferences and the rule-making. The Dominion speaks in world aviation with an authority its air force could never have bought, and its airfields are open to everyone's schedules first."
 CAN_idea_the_rules_of_the_air:0 "The Rules of the Air"
 CAN_idea_the_rules_of_the_air_desc:0 "Manifests, inspection, night crews and a licence that can be taken away. Flying stops killing people by accident quite so often. The operators pay for every clause."

 ##### THE PRESS
 CAN_news_601_t:0 "FLIGHT AT BADDECK"
 CAN_news_601_d:0 "A machine built by Mr Bell's association at Baddeck has risen from the ice of the bay under its own power, with Mr McCurdy at the controls. It is the first such flight anywhere in the British Empire, and it was paid for privately."
 CAN_news_602_t:0 "THE DOMINION CONSTITUTES AN AIR BOARD"
 CAN_news_602_d:0 "Parliament creates a board to license aerodromes, register machines and control all flying in Canada. It inherits a gift of surplus aircraft from the Imperial Government and, for want of a war, will spend its first decade photographing the North."
 CAN_news_603_t:0 "A PERMANENT AIR FORCE"
 CAN_news_603_d:0 "The Royal Canadian Air Force becomes a permanent component of the forces. Its first years will be spent on forest patrol, aerial photography and the customs service, work its officers describe without enthusiasm as flying for the civil government."
 CAN_news_604_t:0 "AIR ESTIMATES CUT BY TWO THIRDS"
 CAN_news_604_d:0 "The air vote is cut by two thirds in a single year. Stations are closed and officers and airmen dismissed. The department that flies is now chiefly the department that feeds unemployed men, and the service will remember the year."
 CAN_news_605_t:0 "A NATIONAL AIRLINE"
 CAN_news_605_d:0 "The Trans-Canada Air Lines Act creates a Crown company under the National Railways with the transcontinental route in its gift. The first flight leaves Vancouver for Seattle. American carriers are told the through traffic is spoken for."
 CAN_news_606_t:0 "THE AERODROME OF DEMOCRACY"
 CAN_news_606_d:0 "An agreement signed at Ottawa makes Canada the flying school of the Commonwealth. Schools will open across the country to train aircrew for Britain, Australia and New Zealand. The Dominion provides the ground, the weather and most of the money."
 CAN_news_607_t:0 "A GROUP UNDER OUR OWN NUMBER"
 CAN_news_607_d:0 "No. 6 Group becomes operational in Yorkshire, a Canadian bomber formation at Canadian expense. Ottawa has bought the right to see its own badge on the squadron list, and will pay for it over the Ruhr."
 CAN_news_608_t:0 "MONTREAL TAKES THE WORLD'S AIR RULES"
 CAN_news_608_d:0 "The provisional international civil aviation organisation will sit permanently at Montreal. The country that flew the Atlantic ferry has traded its geography for an institution, and the rules of world flying will be written on the Saint Lawrence."
 CAN_news_609_t:0 "A JET AIRLINER AT MALTON"
 CAN_news_609_d:0 "The C-102 has flown at Malton, thirteen days after the British Comet and before anything the Americans have in the air. Whether the Dominion finishes it is another question: the government's priority is the interceptor."
