l_english:
 TUR_samsun_19_may:0 "Samsun, the Nineteenth of May"
 TUR_samsun_19_may_desc:0 "An inspector sent to disarm the Anatolian divisions steps ashore and begins organising them instead. Everything after this is disobedience."
 TUR_the_amasya_circular:0 "The Amasya Circular"
 TUR_the_amasya_circular_desc:0 "The independence of the nation shall be won by the determination of the nation. It is signed by four officers and it is a declaration of war on their own government."
 TUR_the_congress_of_erzurum:0 "The Congress of Erzurum"
 TUR_the_congress_of_erzurum_desc:0 "Karabekir's Fifteenth Corps comes over whole, and with it the eastern notables who have their own reasons for not wanting an Armenian border."
 TUR_the_congress_of_sivas:0 "The Congress of Sivas"
 TUR_the_congress_of_sivas_desc:0 "Every Defence of Rights society in Anatolia, folded into one organisation with one committee. It is the moment the movement stops being local."
 TUR_the_national_pact:0 "The National Pact"
 TUR_the_national_pact_desc:0 "Six articles that define what Turkey is and is not. Everything outside them is negotiable and nothing inside them ever will be."
 TUR_the_grand_national_assembly:0 "The Grand National Assembly"
 TUR_the_grand_national_assembly_desc:0 "Ankara becomes a government. There are now two of them in this country and only one has an army."
 TUR_the_counter_fetva:0 "The Counter-Fetva"
 TUR_the_counter_fetva_desc:0 "The muftis of Anatolia rule that the Constantinople fetva was issued under occupation and is void. The caliphate army loses a quarter of its strength overnight."
 TUR_the_kuva_yi_milliye:0 "The Kuva-yi Milliye"
 TUR_the_kuva_yi_milliye_desc:0 "Twelve irregular divisions that cost nothing to equip, hold no line, and obey their own commanders."
 TUR_regularise_the_militias:0 "Regularise the Militias"
 TUR_regularise_the_militias_desc:0 "Fold the bands into the regular army and break Cerkes Ethem. Six divisions are lost and the ones that remain will hold a position."
 TUR_tekalif_i_milliye:0 "Tekalif-i Milliye"
 TUR_tekalif_i_milliye_desc:0 "Forty percent of everything in the country, requisitioned by law: cloth, leather, grain, carts, oil. It equips the army and it is remembered in every village."
 TUR_the_treaty_of_moscow:0 "The Treaty of Moscow"
 TUR_the_treaty_of_moscow_desc:0 "Soviet gold and Soviet rifles. The price is Kars and Batum settled on Moscow's terms and a debt of gratitude nobody in Ankara wants."
 TUR_the_sakarya_line:0 "The Sakarya Line"
 TUR_the_sakarya_line_desc:0 "Prepared positions west of Ankara, dug before they are needed. It is the only battle of this war that can be lost outright."
 TUR_the_great_offensive:0 "The Great Offensive"
 TUR_the_great_offensive_desc:0 "Sixty days of full planning against the Greek army in Anatolia. After Dumlupinar there is nothing between here and Izmir."
 TUR_the_armistice_of_mudanya:0 "The Armistice of Mudanya"
 TUR_the_armistice_of_mudanya_desc:0 "End the war without firing on the British at Chanak. The straits stay demilitarised and Turkey has a peace conference instead of another campaign."
 TUR_abolish_the_sultanate:0 "Abolish the Sultanate"
 TUR_abolish_the_sultanate_desc:0 "Six centuries end with a vote and Mehmed VI leaves on a British warship. There is no longer a second government in this country."
 TUR_the_treaty_of_lausanne:0 "The Treaty of Lausanne"
 TUR_the_treaty_of_lausanne_desc:0 "Five lines genuinely in dispute: Mosul, the capitulations, the straits, the debt, and the population exchange. Each is winnable and none is winnable at once."
 TUR_ankara_the_capital:0 "Ankara, the Capital"
 TUR_ankara_the_capital_desc:0 "The government moves to a town of twenty thousand in the middle of the plateau. It is defensible, it is Anatolian, and it is not the city of the sultans."
 TUR_proclaim_the_republic:0 "Proclaim the Republic"
 TUR_proclaim_the_republic_desc:0 "The empire becomes a republic, and it carries the strain the empire built: the same provinces, the same seams, and a new name for the argument."
 TUR_abolish_the_caliphate:0 "Abolish the Caliphate"
 TUR_abolish_the_caliphate_desc:0 "Thirteen centuries end by statute. Reform becomes half again as fast for the rest of the era, and every religious authority in the country is now an opponent."
 TUR_the_constitution_of_1924:0 "The Constitution of 1924"
 TUR_the_constitution_of_1924_desc:0 "One chamber, and a president who appoints the government. It is coherent, it is stable, and it has no brake in it anywhere."
 TUR_the_law_on_the_maintenance_of_order:0 "The Law on the Maintenance of Order"
 TUR_the_law_on_the_maintenance_of_order_desc:0 "Every opposition party closed, every independence tribunal sitting. It works, and the record of it will outlast everyone who signed it."
 TUR_the_progressive_republic:0 "The Progressive Republic"
 TUR_the_progressive_republic_desc:0 "Multiple parties from 1925, argued with rather than closed. Reform costs more and takes longer, and it will still be there in 1950."
 OTT_the_sultans_peace:0 "The Sultan's Peace"
 OTT_the_sultans_peace_desc:0 "The Porte governs from Constantinople with a British garrison in the city and an Allied fleet in the Bosphorus. It is legal, it is recognised, and it is theirs."
 OTT_the_fetva_of_11_april:0 "The Fetva of 11 April"
 OTT_the_fetva_of_11_april_desc:0 "The Sheikh ul-Islam rules that the Ankara rebels may lawfully be killed. It settles the religious question in the capital and unsettles every province."
 OTT_accept_the_treaty_of_sevres:0 "Accept the Treaty of Sevres"
 OTT_accept_the_treaty_of_sevres_desc:0 "Sign it. The army is capped at fifty thousand seven hundred, the budget passes to a foreign commission, and the empire continues to exist on paper."
 OTT_the_army_of_the_caliphate:0 "The Army of the Caliphate"
 OTT_the_army_of_the_caliphate_desc:0 "The Kuva-yi Inzibatiye, eight divisions equipped by the British, raised to fight other Turks."
 OTT_the_financial_commission:0 "The Financial Commission"
 OTT_the_financial_commission_desc:0 "The budget is settled abroad. The debt is serviced cheaply and automatically, and nothing else in it can be moved."
 OTT_the_british_protectorate:0 "The British Protectorate"
 OTT_the_british_protectorate_desc:0 "A garrison in the capital and a guarantee that comes with it. Any attempt to exceed the military ceiling ends the arrangement."
 OTT_a_constitutional_sultanate:0 "A Constitutional Sultanate"
 OTT_a_constitutional_sultanate_desc:0 "Parliament restored under Mehmed VI. The empire becomes a constitutional monarchy, which is what its reformers have wanted since 1876."
 OTT_the_arab_vilayets_under_mandate:0 "The Arab Vilayets Under Mandate"
 OTT_the_arab_vilayets_under_mandate_desc:0 "Cede the Arab provinces formally, and be left with an Anatolia that can actually be governed from Constantinople."
 OTT_the_caliph_of_all_islam:0 "The Caliph of All Islam"
 OTT_the_caliph_of_all_islam_desc:0 "The caliphate is never abolished. Permanent standing with Afghanistan, Persia, the Hejaz and the Indian Muslims, and a title that constrains every domestic reform."
 OTT_pacify_eastern_anatolia:0 "Pacify Eastern Anatolia"
 OTT_pacify_eastern_anatolia_desc:0 "The east stays in permanent insurrection and the army stays in it too. There is a recurring decision and there is no end to it."
 OTT_renegotiate_sevres:0 "Renegotiate Sevres"
 OTT_renegotiate_sevres_desc:0 "Five years without a rearmament violation buys a hearing. It is the only way out of the military ceiling and it takes exactly as long as it takes."
 OTT_the_ottoman_dominion:0 "The Ottoman Dominion"
 OTT_the_ottoman_dominion_desc:0 "The empire is still there in 1949: a constitutional sultanate, smaller, solvent, and nobody's idea of what should have happened."
 TUR_the_second_group:0 "The Second Group"
 TUR_the_second_group_desc:0 "Organise the opposition inside the national movement rather than against it. Everything that follows is argued in the assembly instead of decreed from it."
 TUR_the_assembly_above_the_pasha:0 "The Assembly Above the Pasha"
 TUR_the_assembly_above_the_pasha_desc:0 "Sovereignty stays with the chamber and the commander-in-chief law is renewed by vote, in public, on a date."
 TUR_the_deputies_of_the_east:0 "The Deputies of the East"
 TUR_the_deputies_of_the_east_desc:0 "The Kurdish deputies and the ulema keep their seats. The strain falls eight points and every reform now needs their votes."
 TUR_a_republic_with_a_caliph:0 "A Republic with a Caliph"
 TUR_a_republic_with_a_caliph_desc:0 "A republic that also holds the seat of the caliphate. It is a contradiction and it is worth permanent standing across the Muslim world."
 TUR_abdulmecid_at_ankara:0 "Abdulmecid at Ankara"
 TUR_abdulmecid_at_ankara_desc:0 "The caliph resides under the authority of the assembly, with a civil list and no political power whatsoever."
 TUR_the_muslim_world_congress:0 "The Muslim World Congress"
 TUR_the_muslim_world_congress_desc:0 "Ankara convenes it, and Afghanistan, Persia, the Hejaz, India and Central Asia come. It is diplomatic reach no republic here otherwise has."
 TUR_the_slow_reforms:0 "The Slow Reforms"
 TUR_the_slow_reforms_desc:0 "Codify the compromise: reform costs twice as much, the notables stay in the room, and nothing has to be undone in 1950."
 TUR_the_naqshbandi_compact:0 "The Naqshbandi Compact"
 TUR_the_naqshbandi_compact_desc:0 "The brotherhoods keep their lodges. Sheikh Said and Menemen never happen, and the state is not the only authority in the eastern provinces."
 TUR_the_progressive_party_governs:0 "The Progressive Party Governs"
 TUR_the_progressive_party_governs_desc:0 "Karabekir, Rauf Orbay and Ali Fuat in office from 1925. Multiple parties, no independence tribunals, and a slower country."
 TUR_the_eastern_provinces_statute:0 "The Eastern Provinces Statute"
 TUR_the_eastern_provinces_statute_desc:0 "Autonomy for the Kurdish vilayets inside the republic. It is the largest fall in the strain available, and it puts a floor under it that cannot be crossed."
 TUR_the_izmir_economic_congress:0 "The Izmir Economic Congress"
 TUR_the_izmir_economic_congress_desc:0 "Eleven hundred delegates and a programme for a national bourgeoisie that does not exist yet, written by the men who intend to become it."
 TUR_is_bankasi:0 "Is Bankasi"
 TUR_is_bankasi_desc:0 "A national bank owned by the men of the party. It funds the industry and it decides which industry."
 TUR_abolish_the_tithe:0 "Abolish the Tithe"
 TUR_abolish_the_tithe_desc:0 "The peasant tax that has been collected since the fifteenth century, gone in a session. Stability rises across an eighty percent rural country and the treasury loses two fifths of its base."
 TUR_the_state_monopolies:0 "The State Monopolies"
 TUR_the_state_monopolies_desc:0 "Tobacco, salt, spirits, matches. The revenue comes back, and every one of them is a place where a party man can be found a job."
 TUR_buy_back_the_rails:0 "Buy Back the Rails"
 TUR_buy_back_the_rails_desc:0 "One decision per foreign concession, each with a price and a date. It is slow, it is expensive, and at the end of it the railways are Turkish."
 TUR_the_latin_alphabet:0 "The Latin Alphabet"
 TUR_the_latin_alphabet_desc:0 "Everyone in the country is illiterate again on the same morning. Literacy and research recover from 1932, and the whole of the written past is now behind a wall."
 TUR_the_end_of_the_tariff_freeze:0 "The End of the Tariff Freeze"
 TUR_the_end_of_the_tariff_freeze_desc:0 "Tariff autonomy at last, in the year of the crash. Freedom to set trade law, and nothing anyone wants to buy."
 TUR_the_central_bank:0 "The Central Bank"
 TUR_the_central_bank_desc:0 "Monetary sovereignty, ninety years after the first foreign loan. It closes the era and it is read by everything after it."
 TUR_the_alternation_of_1950:0 "The Alternation of 1950"
 TUR_the_alternation_of_1950_desc:0 "A governing party loses an election and hands over. It is the first time in the history of this state and it is worth more than any focus that precedes it."
 TUR_the_call_to_prayer_returns:0 "The Call to Prayer Returns"
 TUR_the_call_to_prayer_returns_desc:0 "The ezan in Arabic, religious instruction, the pilgrimage. It is popular in every village and it undoes a quarter of a century of statute."
 TUR_the_marshall_farms:0 "The Marshall Farms"
 TUR_the_marshall_farms_desc:0 "Tractors, roads and credit. Yields rise a quarter and the villages empty into Istanbul and Ankara."
 TUR_the_north_atlantic_treaty:0 "The North Atlantic Treaty"
 TUR_the_north_atlantic_treaty_desc:0 "Membership, and the straits become somebody else's flank as well as ours."
 TUR_the_korean_brigade:0 "The Korean Brigade"
 TUR_the_korean_brigade_desc:0 "The price of admission, paid in Korea, in casualties that are scripted and not negotiable."
 TUR_the_ledger_of_1915:0 "The Ledger of 1915"
 TUR_the_ledger_of_1915_desc:0 "No effect of its own. It opens the two ways of answering for what the empire did, and neither of them is free."
 TUR_the_official_denial:0 "The Official Denial"
 TUR_the_official_denial_desc:0 "It costs nothing at home and it will be the first item on the agenda of every negotiation this republic has abroad."
 TUR_the_reckoning:0 "The Reckoning"
 TUR_the_reckoning_desc:0 "A commission of inquiry and partial restitution of confiscated property. Twenty points of stability, and the ledger closes."
 TUR_the_army_returns:0 "The Army Returns"
 TUR_the_army_returns_desc:0 "The officer corps removes the government it does not like. It is efficient, it is quick, and it establishes that it can be done."
 TUR_the_second_republic:0 "The Second Republic"
 TUR_the_second_republic_desc:0 "A constitution with a constitutional court and a senate in it. It is slower than the first and it has brakes."
 OTT_idea_the_terms_of_sevres:0 "The Terms of Sevres"
 OTT_idea_the_terms_of_sevres_desc:0 "Fifty thousand seven hundred men, and a budget somebody else signs."
 OTT_idea_the_financial_commission:0 "The Financial Commission"
 OTT_idea_the_financial_commission_desc:0 "The debt is serviced cheaply, automatically, and by people who answer to nobody here."
 OTT_idea_the_maintenance_of_order:0 "The Maintenance of Order"
 OTT_idea_the_maintenance_of_order_desc:0 "Every opposition party closed and every tribunal sitting. It works."
 OTT_idea_the_ledger_of_1915:0 "The Ledger of 1915"
 OTT_idea_the_ledger_of_1915_desc:0 "Cheap at home, and the first item on the agenda of every negotiation abroad."
