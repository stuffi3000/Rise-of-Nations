###############################################################################################################################
# Austria-Hungary - Croats, Slovenes, Serbs of the Monarchy
###############################################################################################################################


# ============================================================================================
# CRO - the Kingdom of Croatia, Slavonia and Dalmatia
# ============================================================================================

 AUHNAT_CRO_the_party_of_rights:0 "The Party of Rights"
 AUHNAT_CRO_the_party_of_rights_desc:0 "Starcevic is seven years dead and his party has split three ways. Every fragment keeps the doctrine: Croatia is a kingdom never conquered, its rights older than the crown."

 AUHNAT_CRO_the_croatian_hungarian_settlement:0 "The Settlement of 1868"
 AUHNAT_CRO_the_croatian_hungarian_settlement_desc:0 "The Nagodba of 1868 gave Croatia a diet, a flag and its own courts, and gave Hungary the ban, the railways and the finances. Over half of what the kingdom raises leaves it."

 AUHNAT_CRO_the_ban_named_in_budapest:0 "A Ban Named in Budapest"
 AUHNAT_CRO_the_ban_named_in_budapest_desc:0 "The ban is named by the King on the proposal of the Hungarian minister-president. Khuen-Hedervary held the office twenty years, then went to Budapest to govern Hungary."

 AUHNAT_CRO_the_railway_signs_of_1903:0 "The Railway Signs of 1903"
 AUHNAT_CRO_the_railway_signs_of_1903_desc:0 "Spring 1903: crowds along the Sava line tear down station boards lettered only in Hungarian, and the gendarmerie fire on them. The signs are a small thing. The lesson is not."

 AUHNAT_CRO_dalmatia_rejoined_to_croatia:0 "Dalmatia Rejoined to Croatia"
 AUHNAT_CRO_dalmatia_rejoined_to_croatia_desc:0 "The three kingdoms of the royal title administered as one, undone since the Napoleonic wars. It costs Budapest the principle that nothing under the Hungarian crown is settled over its head, and closes the other two roads."

 AUHNAT_CRO_let_budapest_keep_the_nagodba:0 "Leave the Settlement to Budapest"
 AUHNAT_CRO_let_budapest_keep_the_nagodba_desc:0 "The Croatian question is an internal affair of the Hungarian crown, which is what Vienna said for fifty years. Neither the concession nor the commissioner can be reached from here."

 AUHNAT_CRO_the_royal_commissioner_in_zagreb:0 "A Royal Commissioner in Zagreb"
 AUHNAT_CRO_the_royal_commissioner_in_zagreb_desc:0 "Suspend the constitution of the Settlement and govern through a commissioner answerable to the King alone. It was done in 1912. The concession branch shuts for good."

 AUHNAT_CRO_outbid_the_fiume_resolution:0 "Outbid the Fiume Resolution"
 AUHNAT_CRO_outbid_the_fiume_resolution_desc:0 "On 3 October 1905 the Croatian deputies met at Fiume and sold their support to the Hungarian coalition for national guarantees. The card went to Budapest because Vienna made no offer."

 AUHNAT_CRO_the_croatian_treasury:0 "A Croatian Treasury"
 AUHNAT_CRO_the_croatian_treasury_desc:0 "Croatia pays the common Hungarian expenditure first and keeps the remainder, which has never sufficed. Rewrite the quota, and somebody in the common budget notices the hole."

 AUHNAT_CRO_the_royal_croatian_home_guard:0 "The Royal Croatian Home Guard"
 AUHNAT_CRO_the_royal_croatian_home_guard_desc:0 "The Domobranstvo is the one armed body in the Monarchy that commands in Croatian. Expand it, and the common army acquires a fourth language of command."

 AUHNAT_CRO_the_university_of_zagreb:0 "The University of Zagreb"
 AUHNAT_CRO_the_university_of_zagreb_desc:0 "Franz Joseph signed the charter in 1874 and the faculties have been starved since. A national intelligentsia is not a safe thing to manufacture; the alternative is one educated abroad."

 AUHNAT_CRO_fiume_for_the_triune_kingdom:0 "Fiume for the Triune Kingdom"
 AUHNAT_CRO_fiume_for_the_triune_kingdom_desc:0 "Fiume is a corpus separatum whose founding clause the two texts of 1868 render differently. It is also Hungary's only sea coast; give it to Zagreb and the Hungarian port is closed for good."

 AUHNAT_CRO_fiume_stays_a_hungarian_port:0 "Fiume Stays a Hungarian Port"
 AUHNAT_CRO_fiume_stays_a_hungarian_port_desc:0 "The Hungarian reading of the clause stands: the yard keeps its naval orders and the Sabor is told the question is closed. The Croatian Adriatic is shut for good."

 AUHNAT_CRO_croatian_in_the_courts:0 "Croatian in the Courts"
 AUHNAT_CRO_croatian_in_the_courts_desc:0 "The Settlement made Croatian the language of justice here; the Hungarian railway, post and revenue services have ignored it. Enforce the text against the departments."

 AUHNAT_CRO_the_first_croatian_savings_bank:0 "The First Croatian Savings Bank"
 AUHNAT_CRO_the_first_croatian_savings_bank_desc:0 "The Prva hrvatska stedionica has lent in Zagreb since 1846, where the Viennese and Pest houses will not. Give it the state deposits and it answers to a party rather than a ministry."

 AUHNAT_CRO_a_ban_named_by_the_crown:0 "A Ban Named by the Crown"
 AUHNAT_CRO_a_ban_named_by_the_crown_desc:0 "Take the nomination of the ban from the Hungarian minister-president and return it to the coronation oath. The day the ban answers to Vienna, the Settlement is a dead letter."

 AUHNAT_CRO_the_dalmatian_diet_folded_in:0 "The Dalmatian Diet Folded In"
 AUHNAT_CRO_the_dalmatian_diet_folded_in_desc:0 "Zadar has its own diet, its own governor and its own grievances, most of them about roads. Fold it into the Sabor and the union of the three kingdoms acquires an office with a budget."

 AUHNAT_CRO_the_third_crown:0 "The Third Crown"
 AUHNAT_CRO_the_third_crown_desc:0 "Popovici published his map in 1906 and the Belvedere worked it into memoranda for the change of reign: a third party of south Slav lands, making the Hungarian veto impossible."

 AUHNAT_CRO_the_coronation_at_zagreb:0 "The Coronation at Zagreb"
 AUHNAT_CRO_the_coronation_at_zagreb_desc:0 "A separate coronation at Zagreb, with a separate oath sworn to the rights of the Triune Kingdom. Hungary knows what a second coronation means, having spent 1867 insisting on the first."

 AUHNAT_CRO_the_triune_kingdom:0 "The Triune Kingdom"
 AUHNAT_CRO_the_triune_kingdom_desc:0 "Croatia, Slavonia and Dalmatia under one crown, one ban and one diet, contracting with the Monarchy as a party and not a province. The upper tiers of the Compromise are out of reach."

 AUHNAT_CRO_renew_the_settlement_of_1906:0 "Renew the Settlement"
 AUHNAT_CRO_renew_the_settlement_of_1906_desc:0 "The financial clauses of the Nagodba fall due like everything else here. Renew them on the Hungarian figures, note the Croatian protest, and the question is postponed ten years."

 AUHNAT_CRO_the_corpus_separatum_of_fiume:0 "The Corpus Separatum"
 AUHNAT_CRO_the_corpus_separatum_of_fiume_desc:0 "Fiume stays attached to the Hungarian crown and the disputed clause of 1868 stays disputed in two languages. The yard works and the Sabor is not consulted."

 AUHNAT_CRO_the_coalition_in_the_sabor:0 "The Coalition in the Sabor"
 AUHNAT_CRO_the_coalition_in_the_sabor_desc:0 "The Croato-Serb Coalition has held the Sabor since 1906. It is a stable national majority and it looks to Budapest, because Budapest bid for it and Vienna did not."

 AUHNAT_CRO_a_kingdom_without_a_policy:0 "A Kingdom Without a Policy"
 AUHNAT_CRO_a_kingdom_without_a_policy_desc:0 "Croatia has a diet, a ban, a flag, a language and no answer to what it is for. This is the road on which the Monarchy loses its claim to these lands without a decision being taken."

 AUHNAT_CRO_dissolve_the_croato_serb_coalition:0 "Dissolve the Coalition"
 AUHNAT_CRO_dissolve_the_croato_serb_coalition_desc:0 "Ban Rauch dissolved the Sabor in 1908 rather than govern with a Croato-Serb majority, then governed without one. Treating a majority as a conspiracy outlasts the ministry."

 AUHNAT_CRO_the_railway_pragmatic_of_1907:0 "The Railway Pragmatic of 1907"
 AUHNAT_CRO_the_railway_pragmatic_of_1907_desc:0 "The Hungarian railway law of 1907 requires every state railwayman in Croatia to serve in Hungarian. The Croatian deputies answered with obstruction enough to bring down a government."

 AUHNAT_CRO_the_ban_rauch_regime:0 "Government by Ordinance"
 AUHNAT_CRO_the_ban_rauch_regime_desc:0 "Pavao Rauch is ban of a kingdom where his party holds a handful of seats, and governs by ordinance because no combination in the Sabor will carry his budget."

 AUHNAT_CRO_the_frankist_party_of_rights:0 "The Pure Party of Rights"
 AUHNAT_CRO_the_frankist_party_of_rights_desc:0 "Josip Frank leads the fragment of the Party of Rights that is loyal to the dynasty and implacably against any arrangement with the Serbs. The state has decided which half it wants."

 AUHNAT_CRO_suspend_the_sabor:0 "Suspend the Sabor"
 AUHNAT_CRO_suspend_the_sabor_desc:0 "Prorogue the diet indefinitely and administer the kingdom by commission. The constitution of 1868 is not repealed - repealing it would require the diet - it is simply not convened."

 AUHNAT_CRO_croatia_governed_from_budapest:0 "Croatia Governed from Budapest"
 AUHNAT_CRO_croatia_governed_from_budapest_desc:0 "The Settlement survives as a form of words: the counties answer to prefects, the courts sit in Hungarian, and the recruit lists are complete. The Monarchy is administering a kingdom it has stopped trying to govern."


# ============================================================================================
# SLV - the Slovene lands
# ============================================================================================

 AUHNAT_SLV_the_slovene_peoples_party:0 "The Slovene People's Party"
 AUHNAT_SLV_the_slovene_peoples_party_desc:0 "Clerical, cooperative and monarchist, the Slovene People's Party asks least of the national parties and gives most. A dynasty that cannot deal with it cannot deal with anybody."

 AUHNAT_SLV_a_nation_across_five_crownlands:0 "A Nation Across Five Crownlands"
 AUHNAT_SLV_a_nation_across_five_crownlands_desc:0 "The map of 1849 spread a million and a quarter Slovenes over five crownlands: a majority in Carniola, a minority everywhere else. Four diets must give up districts to undo it."

 AUHNAT_SLV_the_school_question_in_styria:0 "The School Question in Styria"
 AUHNAT_SLV_the_school_question_in_styria_desc:0 "Parallel Slovene classes in a Styrian gymnasium brought down an Austrian government in 1895. Where German and Slovene meet, every school is a frontier post."

 AUHNAT_SLV_the_shots_in_ljubljana:0 "September in Ljubljana"
 AUHNAT_SLV_the_shots_in_ljubljana_desc:0 "September 1908: troops called out against demonstrations over German shop signs, two Slovenes shot dead in a provincial capital. Trialism now has a crowd behind it."

 AUHNAT_SLV_a_crownland_of_united_slovenia:0 "A Crownland of United Slovenia"
 AUHNAT_SLV_a_crownland_of_united_slovenia_desc:0 "One administrative unit around the Slovene districts of Carniola, Styria, Carinthia, Gorizia and Istria, with a diet of its own. It closes the other two roads for good."

 AUHNAT_SLV_the_crownlands_as_they_stand:0 "The Crownlands as They Stand"
 AUHNAT_SLV_the_crownlands_as_they_stand_desc:0 "The historic crownlands are the constitution of Cisleithania; redrawing them for one nationality invites eleven others to ask. There is no way back to the crownland or the Sudmark."

 AUHNAT_SLV_back_the_sudmark:0 "Back the Sudmark"
 AUHNAT_SLV_back_the_sudmark_desc:0 "The Sudmark and the German School Association hold the language frontier by buying farms and building schools. Fund them, and the loyalest Slav party becomes an opposition. The other two roads close."

 AUHNAT_SLV_the_diet_of_carniola:0 "The Diet of Carniola"
 AUHNAT_SLV_the_diet_of_carniola_desc:0 "Give the Diet of Carniola the school, road and revenue competences the other four exercise over Slovene districts. It is a clerical majority and will legislate like one."

 AUHNAT_SLV_the_credit_unions_of_janez_krek:0 "The Credit Unions of Janez Krek"
 AUHNAT_SLV_the_credit_unions_of_janez_krek_desc:0 "Several hundred village savings and loan societies run by parish priests on the Raiffeisen model. They have done more against rural indebtedness than any ministry ever did."

 AUHNAT_SLV_slovene_in_the_inner_service:0 "Slovene in the Inner Service"
 AUHNAT_SLV_slovene_in_the_inner_service_desc:0 "Slovene is admitted at the counter and refused at the desk. Extend it to the inner service and every German official in Carniola must learn it or move. Both happen."

 AUHNAT_SLV_the_university_of_ljubljana:0 "The University of Ljubljana"
 AUHNAT_SLV_the_university_of_ljubljana_desc:0 "A university at Ljubljana has been petitioned for since the eighteen-forties and refused every time on grounds of expense. The expense is small; the alternative is not."

 AUHNAT_SLV_the_narodni_dom_in_trieste:0 "The Narodni Dom in Trieste"
 AUHNAT_SLV_the_narodni_dom_in_trieste_desc:0 "A Slovene bank, hotel, theatre and reading room opened on the Piazza Caserma in 1904, hated by the Italian council ever since. Back it, and the council runs the port against you. The alternative closes for good."

 AUHNAT_SLV_leave_trieste_to_its_municipality:0 "Leave Trieste to its Municipality"
 AUHNAT_SLV_leave_trieste_to_its_municipality_desc:0 "The Italian council has run Trieste competently for a generation and the Monarchy has one great port. Do not disturb it for the suburbs; the Narodni dom is closed for good."

 AUHNAT_SLV_the_wocheiner_line:0 "The New Alpine Lines"
 AUHNAT_SLV_the_wocheiner_line_desc:0 "The Wocheiner and Karawanken lines opened in 1906: a second railway for Trieste, and the end of the insolvent Sudbahn's monopoly."

 AUHNAT_SLV_the_regiments_of_the_littoral:0 "The Regiments of the Littoral"
 AUHNAT_SLV_the_regiments_of_the_littoral_desc:0 "The mountain battalions of the Littoral recruit men who have walked the Julian Alps since childhood. Give them their own establishment and officers who speak their language."

 AUHNAT_SLV_the_south_slav_bloc:0 "The South Slav Bloc"
 AUHNAT_SLV_the_south_slav_bloc_desc:0 "With a third crown at Zagreb, the Slovene and Croatian deputies have somewhere to vote towards. The bloc votes against every common estimate that does not pass through it."

 AUHNAT_SLV_a_land_of_carniola_and_the_littoral:0 "Carniola and the Littoral"
 AUHNAT_SLV_a_land_of_carniola_and_the_littoral_desc:0 "If the third crown is not to be had, build the union from below: Carniola joined to the Slovene districts of Gorizia and Istria under one governor and one budget."

 AUHNAT_SLV_the_land_of_the_slovenes:0 "The Land of the Slovenes"
 AUHNAT_SLV_the_land_of_the_slovenes_desc:0 "From the Drava to the Adriatic: one land, one diet, one language of the inner service. Sixty years of petitions answered in a decree, and four diets made smaller to do it."

 AUHNAT_SLV_the_liberals_of_ljubljana:0 "The Liberals of Ljubljana"
 AUHNAT_SLV_the_liberals_of_ljubljana_desc:0 "The National Progressive Party holds the town hall, cultivates the Russian consulate, and is losing every rural district to Krek. It keeps the question an Austrian one."

 AUHNAT_SLV_a_provincial_compromise_for_carniola:0 "A Provincial Compromise"
 AUHNAT_SLV_a_provincial_compromise_for_carniola_desc:0 "The Moravian Compromise of 1905 divided a crownland's diet and registers between two nations without moving a boundary, and it worked. Apply it here: nobody is satisfied and nobody riots."

 AUHNAT_SLV_a_people_without_a_land:0 "A People Without a Land"
 AUHNAT_SLV_a_people_without_a_land_desc:0 "The Slovenes have a language, a press, a bank and a party, and no land of their own on any map the state prints. The most monarchist nation in the Empire is learning what that is worth."

 AUHNAT_SLV_the_german_school_association:0 "The German School Association"
 AUHNAT_SLV_the_german_school_association_desc:0 "State money for the Schulverein: German schools in Slovene valleys, German farms bought where the language frontier thins. It is legal, and understood on both sides as an act of the state."

 AUHNAT_SLV_dissolve_the_slovene_clubs:0 "Dissolve the Slovene Clubs"
 AUHNAT_SLV_dissolve_the_slovene_clubs_desc:0 "The reading rooms, the gymnastic societies, the choral unions: the apparatus by which a nation without a state keeps itself in existence. Close them and the districts go quiet."

 AUHNAT_SLV_the_littoral_under_administration:0 "The Littoral Under Administration"
 AUHNAT_SLV_the_littoral_under_administration_desc:0 "Trieste, Gorizia and Istria administered directly from Vienna, with one population in four policed rather than governed. The most loyal Slav nation becomes a security problem."


# ============================================================================================
# SER - the Serbs of the Monarchy
# ============================================================================================

 AUHNAT_SER_the_serbs_of_the_monarchy:0 "The Serbs of the Monarchy"
 AUHNAT_SER_the_serbs_of_the_monarchy_desc:0 "Two million Orthodox Serbs are Habsburg subjects, in the Backa, the Banat, Croatia-Slavonia and Bosnia. They are not the kingdom across the Save, whatever the ministries assume."

 AUHNAT_SER_the_congress_of_karlowitz:0 "The Congress of Karlowitz"
 AUHNAT_SER_the_congress_of_karlowitz_desc:0 "The Church-School Congress of Sremski Karlovci is the oldest self-governing institution of any nationality in the Monarchy, privileged since 1690. Budapest has asked why for thirty years."

 AUHNAT_SER_the_schools_of_the_metropolitanate:0 "The Schools of the Metropolitanate"
 AUHNAT_SER_the_schools_of_the_metropolitanate_desc:0 "Confessional schools teaching in Cyrillic are exactly what the Hungarian education laws are written to squeeze. Take the state subsidy and teach in Hungarian, or refuse it and close."

 AUHNAT_SER_the_frontier_that_is_a_market:0 "The Frontier That Is a Market"
 AUHNAT_SER_the_frontier_that_is_a_market_desc:0 "In 1906 Vienna shut the frontier to Serbian livestock to punish Belgrade for buying its guns in France. Nobody asked what the market towns on the near side of the Save lived on."

 AUHNAT_SER_confirm_the_church_school_autonomy:0 "Confirm the Church-School Autonomy"
 AUHNAT_SER_confirm_the_church_school_autonomy_desc:0 "Confirm the privileges of Karlowitz by rescript, over the objection of the Hungarian ministry, and the Serbs hold a charter from the Emperor rather than a Hungarian concession. The other roads close for good."

 AUHNAT_SER_the_congress_left_to_itself:0 "The Congress Left to Itself"
 AUHNAT_SER_the_congress_left_to_itself_desc:0 "The privileges of 1690 are a Hungarian internal matter. Say nothing and let Budapest and Karlowitz settle it; neither the charter nor the sequestration can be reached from here."

 AUHNAT_SER_suspend_the_church_congress:0 "Suspend the Congress"
 AUHNAT_SER_suspend_the_church_congress_desc:0 "Suspend the Church-School Congress, sequester its funds, and run the Orthodox schools from the ministry of cults. It was done in 1912, and the concession branch closes for good."

 AUHNAT_SER_the_serb_radicals_of_hungary:0 "The Serb Radicals of Hungary"
 AUHNAT_SER_the_serb_radicals_of_hungary_desc:0 "Jasa Tomic and the Serb Radicals sit in the Budapest chamber and bargain in the Budapest manner. Their support has a price, paid in schools and county appointments."

 AUHNAT_SER_cyrillic_in_the_county_offices:0 "Cyrillic in the County Offices"
 AUHNAT_SER_cyrillic_in_the_county_offices_desc:0 "In the Backa and the Banat a Serb subject may not file a document in his own alphabet, though the nationalities law of 1868 says he may. Enforce the statute already on the books."

 AUHNAT_SER_the_serb_settlement_banks:0 "The Serb Settlement Banks"
 AUHNAT_SER_the_serb_settlement_banks_desc:0 "The savings houses of Novi Sad and Zemun buy land for Serb tenants as the Hungarian banks do for Hungarians. Give them equal standing and the villages stop emigrating."

 AUHNAT_SER_a_serb_curia_in_the_sabor:0 "A Serb Curia in the Sabor"
 AUHNAT_SER_a_serb_curia_in_the_sabor_desc:0 "The condition set at Zadar in October 1905 was recognition of the Serbs of Croatia as a nation equal with the Croats. The Croats accepted it and Vienna never did. Accept it."

 AUHNAT_SER_reopen_the_frontier_to_belgrade:0 "Reopen the Frontier"
 AUHNAT_SER_reopen_the_frontier_to_belgrade_desc:0 "End the customs war. Belgrade will not capitulate; it will build abattoirs and ship through Salonika. The Hungarian agrarians were promised this tariff, and it cannot be closed again."

 AUHNAT_SER_hold_the_frontier_shut:0 "Hold the Frontier Shut"
 AUHNAT_SER_hold_the_frontier_shut_desc:0 "Hungarian and Croatian producers keep the home market and Belgrade is squeezed until it comes to terms. Afterwards no lever is left but the army, and the frontier stays shut."

 AUHNAT_SER_the_seminary_of_karlowitz:0 "The Seminary of Karlowitz"
 AUHNAT_SER_the_seminary_of_karlowitz_desc:0 "The gymnasium and seminary of Sremski Karlovci have trained the Serb clergy since the eighteenth century. Endow them and the Backa gets its schoolmasters here, not from Belgrade."

 AUHNAT_SER_the_frontier_regiments_remembered:0 "The Frontier Regiments"
 AUHNAT_SER_the_frontier_regiments_remembered_desc:0 "The Military Frontier was dissolved in 1881 and its Serb villages handed to the civil administration. They remember what they were raised for, and the asking is cheap."

 AUHNAT_SER_the_serbs_of_the_third_crown:0 "The Serbs of the Third Crown"
 AUHNAT_SER_the_serbs_of_the_third_crown_desc:0 "With a south Slav crown at Zagreb, the Serb districts of Syrmia and the metropolitan see belong somewhere that is neither Budapest nor Belgrade."

 AUHNAT_SER_a_serb_voivodship:0 "A Serb Voivodship"
 AUHNAT_SER_a_serb_voivodship_desc:0 "The Serbian Voivodship was a crownland from 1849 to 1860, abolished to buy Hungarian consent to something else. Restore it, and Budapest will call the decree a partition of Hungary."

 AUHNAT_SER_at_home_in_the_monarchy:0 "At Home in the Monarchy"
 AUHNAT_SER_at_home_in_the_monarchy_desc:0 "Two million Orthodox subjects who spent this decade looking across the Save now look at Vienna. No ministry can move against Belgrade without first explaining itself to its own subjects."

 AUHNAT_SER_the_resolution_of_zadar:0 "The Resolution of Zadar"
 AUHNAT_SER_the_resolution_of_zadar_desc:0 "On 17 October 1905 the Serb deputies of Croatia named their price to the Croats of Fiume: Serb equality in the Triune Kingdom. The resulting majority answers to Budapest."

 AUHNAT_SER_neither_vienna_nor_belgrade:0 "Neither Vienna Nor Belgrade"
 AUHNAT_SER_neither_vienna_nor_belgrade_desc:0 "The Serbs of the Monarchy are left to work out for themselves what they are. The state takes no position of any kind, which is itself a position and is understood as one."

 AUHNAT_SER_a_loyalty_nobody_asked_for:0 "A Loyalty Nobody Asked For"
 AUHNAT_SER_a_loyalty_nobody_asked_for_desc:0 "For two hundred years the Serbs of the Monarchy were its frontier guard, and were simply assumed. This is the road on which two million subjects are lost without an order being given."

 AUHNAT_SER_the_press_of_novi_sad:0 "The Press of Novi Sad"
 AUHNAT_SER_the_press_of_novi_sad_desc:0 "Zastava and its rivals are prosecuted under the press law, and the numbers appear with white columns where the censor has been. Readers in the Backa read white columns very well."

 AUHNAT_SER_the_watch_on_the_save_and_the_danube:0 "The Watch on the Save and the Danube"
 AUHNAT_SER_the_watch_on_the_save_and_the_danube_desc:0 "Frontier gendarmerie, informers in the Sokol halls, and a file on a society founded in Belgrade in October 1908. The watch cannot tell it from the two million it claims to speak for."

 AUHNAT_SER_the_serbs_under_administration:0 "The Serbs Under Administration"
 AUHNAT_SER_the_serbs_under_administration_desc:0 "The Congress is a memory, the schools are Hungarian, the press is censored and the recruit lists are complete. The Monarchy has manufactured the population its enemies could not."


# ============================================================================================
# The ideas
# ============================================================================================

 AUH_the_nagodba_of_1868:0 "The Settlement of 1868"
 AUH_the_nagodba_of_1868_desc:0 "Croatia has a diet, a ban, a flag and its own language of justice; Hungary has the railways, the customs and the ban's nomination. More than half of what the kingdom raises leaves it."

 AUH_the_croatian_spring_of_1903:0 "The Croatian Spring of 1903"
 AUH_the_croatian_spring_of_1903_desc:0 "Station boards torn down along the Sava line, gendarmerie volleys, and a countryside discovering it was loyal by habit only. It will pass. What it leaves behind will not."

 AUH_the_zagreb_settlement:0 "The Zagreb Settlement"
 AUH_the_zagreb_settlement_desc:0 "Vienna has made an offer of its own to Zagreb, and said aloud that the Croatian question is not a Hungarian internal affair. Every measure now passes a second capital."

 AUH_the_royal_commissioner:0 "The Royal Commissioner"
 AUH_the_royal_commissioner_desc:0 "The constitution of the Settlement is suspended and a commissioner answerable to the King alone administers the kingdom. The recruiting districts need an officer with an escort."

 AUH_the_croato_serb_understanding:0 "The Croato-Serb Understanding"
 AUH_the_croato_serb_understanding_desc:0 "Croats and Serbs have agreed a common programme, and Vienna bought it rather than Budapest. Holding it costs the ministry a great deal of its freedom of action."

 AUH_the_croatian_treasury:0 "The Croatian Treasury"
 AUH_the_croatian_treasury_desc:0 "The money raised in Croatia is spent in Croatia, and the Sabor votes budgets it believes in. There is a hole in the common expenditure that somebody in Budapest is preparing a speech about."

 AUH_the_domobranstvo:0 "The Royal Croatian Home Guard"
 AUH_the_domobranstvo_desc:0 "The one armed force in the Monarchy that commands in Croatian, and the establishment fills. The general staff observes that the common army now has four languages of command."

 AUH_fiume_to_the_triune_kingdom:0 "Fiume to the Triune Kingdom"
 AUH_fiume_to_the_triune_kingdom_desc:0 "The port, the Danubius yard and the Whitehead works are Croatian, and Hungary has lost its only sea coast. No session of the Delegations passes without mention of it."

 AUH_the_corpus_separatum:0 "The Corpus Separatum"
 AUH_the_corpus_separatum_desc:0 "Fiume remains attached directly to the Hungarian crown, the yard keeps the naval orders that come with the Hungarian vote, and the disputed clause of 1868 remains disputed in two languages."

 AUH_the_prva_hrvatska_stedionica:0 "The First Croatian Savings Bank"
 AUH_the_prva_hrvatska_stedionica_desc:0 "A national credit institution with the state deposits behind it, lending where no Viennese or Pest house would. It answers to a party rather than a ministry."

 AUH_a_ban_of_the_crown:0 "A Ban of the Crown"
 AUH_a_ban_of_the_crown_desc:0 "The ban is nominated by the King and not by the Hungarian minister-president. The Settlement has become a form of words on the one article that gave it force."

 AUH_the_third_crown:0 "The Third Crown"
 AUH_the_third_crown_desc:0 "A third contracting party stands beside Vienna and Budapest and the Hungarian veto is no longer decisive. Nothing of substance carries without three assemblies."

 AUH_the_triune_kingdom:0 "The Triune Kingdom"
 AUH_the_triune_kingdom_desc:0 "Croatia, Slavonia and Dalmatia under one crown, one ban and one diet, defending their own coast. The Monarchy is a three-cornered contract in which each corner can stop the other two."

 AUH_the_croato_serb_coalition:0 "The Croato-Serb Coalition"
 AUH_the_croato_serb_coalition_desc:0 "A stable national majority governs the Sabor and looks to Budapest, because Budapest bid for it in 1905 and Vienna did not. It is not disloyal; it is simply not the Crown's."

 AUH_a_kingdom_without_a_policy:0 "A Kingdom Without a Policy"
 AUH_a_kingdom_without_a_policy_desc:0 "Croatia has a diet, a ban, a flag, a language and no answer to what it is for. The arrangement costs the treasury nothing at all. It is being paid for in another account."

 AUH_the_railway_pragmatic:0 "The Railway Pragmatic"
 AUH_the_railway_pragmatic_desc:0 "Every railwayman in Croatia serves in Hungarian and the supply trains run to the minute. The Croatian deputies have discovered that obstruction can bring down a government."

 AUH_government_without_a_majority:0 "Government Without a Majority"
 AUH_government_without_a_majority_desc:0 "The ban governs by ordinance because no combination in the Sabor will carry his budget. The ordinances are punctual and lawful. There is a Croatian word for such a government."

 AUH_the_pure_party_of_rights:0 "The Pure Party of Rights"
 AUH_the_pure_party_of_rights_desc:0 "Frank's fragment is loyal to the dynasty, hostile to Budapest, and implacably against any arrangement with the Serbs. Street politics now have an official patron."

 AUH_croatia_governed_from_budapest:0 "Croatia Governed from Budapest"
 AUH_croatia_governed_from_budapest_desc:0 "The counties answer to prefects, the courts sit in Hungarian, and the recruit lists are complete for the first time in forty years. Whether the garrison can hold it is not asked."

 AUH_a_nation_across_five_crownlands:0 "A Nation Across Five Crownlands"
 AUH_a_nation_across_five_crownlands_desc:0 "A million and a quarter Slovenes: a majority in Carniola, a minority in five crownlands whose diets will not surrender a district. Five school boards, five budgets."

 AUH_the_ljubljana_september:0 "September in Ljubljana"
 AUH_the_ljubljana_september_desc:0 "The army fired on a crowd in a provincial capital of the Empire and two Slovenes are dead. Regiments recruited in these valleys read the newspapers too."

 AUH_the_slovene_crownland:0 "The Slovene Crownland"
 AUH_the_slovene_crownland_desc:0 "One administrative unit around the Slovene-speaking districts, and roads that finally cross the old provincial boundaries. So do the claims of the deputies who lost districts."

 AUH_the_sudmark:0 "The Sudmark"
 AUH_the_sudmark_desc:0 "State money for the German School Association: schools in Slovene valleys, farms bought where the language frontier thins. The loyalest Slav party has been told where it stands."

 AUH_the_diet_of_carniola:0 "The Diet of Carniola"
 AUH_the_diet_of_carniola_desc:0 "Ljubljana is the working assembly of the Slovene lands. It is a clerical majority and legislates like one: excellent village schools, and a certain reserve towards the natural sciences."

 AUH_the_krek_cooperatives:0 "The Credit Unions of Janez Krek"
 AUH_the_krek_cooperatives_desc:0 "Several hundred village savings and loan societies run by parish priests on the Raiffeisen model. They belong to a political party, which is why they work and what they cost."

 AUH_the_narodni_dom:0 "The Narodni Dom"
 AUH_the_narodni_dom_desc:0 "A Slovene bank, hotel, theatre and reading room in the first port of the Monarchy. The Italian council that runs the municipality runs the port accordingly."

 AUH_the_municipality_of_trieste:0 "The Municipality of Trieste"
 AUH_the_municipality_of_trieste_desc:0 "The Italian liberal-national council runs the port and runs it well: the tonnage grows and the estimates pass without argument. The Slav suburbs are told to be patient, and are, for now."

 AUH_the_new_alpine_lines:0 "The New Alpine Lines"
 AUH_the_new_alpine_lines_desc:0 "The Wocheiner and Karawanken tunnels, opened in 1906: Trieste has a second railway and the Sudbahn monopoly is broken. The bonds that paid for them fall due on a schedule of their own."

 AUH_the_south_slav_bloc:0 "The South Slav Bloc"
 AUH_the_south_slav_bloc_desc:0 "Slovene, Croatian and Dalmatian deputies voting as one behind the third crown. Reliable on every question except the common estimates, on which they vote as a bloc and expect to be paid."

 AUH_the_land_of_the_slovenes:0 "The Land of the Slovenes"
 AUH_the_land_of_the_slovenes_desc:0 "From the Drava to the Adriatic: one land, one diet, one school administration. Four diets were made smaller to do it, and the political capital of the state pays that bill for a generation."

 AUH_the_ljubljana_liberals:0 "The Liberals of Ljubljana"
 AUH_the_ljubljana_liberals_desc:0 "The National Progressive Party holds the town hall and fights the clergy far harder than Vienna. It is losing every rural district, which makes it cheap and of declining use."

 AUH_a_people_without_a_land:0 "A People Without a Land"
 AUH_a_people_without_a_land_desc:0 "A language, a press, a bank, a party - and no land on any map the state prints. The most monarchist people in the Empire is being taught that the Empire has nothing to offer it."

 AUH_the_littoral_gendarmerie:0 "The Gendarmerie of the Littoral"
 AUH_the_littoral_gendarmerie_desc:0 "The reading rooms are closed, the societies dissolved, and the districts are quiet. The establishment that keeps them quiet comes from the same manpower as the mountain battalions."

 AUH_the_littoral_under_administration:0 "The Littoral Under Administration"
 AUH_the_littoral_under_administration_desc:0 "Trieste, Gorizia and Istria administered directly from Vienna. One population in four is policed rather than governed: a permanent charge entered in the accounts as a temporary one."

 AUH_the_church_school_congress:0 "The Church-School Congress"
 AUH_the_church_school_congress_desc:0 "Privileges granted in 1690 and never withdrawn: two million Orthodox subjects elect their own metropolitan, tax themselves and run their own schools. The state controls none of it."

 AUH_the_pig_war_frontier:0 "The Customs War"
 AUH_the_pig_war_frontier_desc:0 "The frontier is shut to Serbian livestock. The market towns of the Backa are learning how much of their trade was Serbian, and Belgrade has not capitulated."

 AUH_the_congress_confirmed:0 "The Charter of Karlowitz"
 AUH_the_congress_confirmed_desc:0 "The privileges of 1690 confirmed by imperial rescript over the objection of the Hungarian ministry. The Serbs of Hungary hold a charter from the Emperor, not a Hungarian concession."

 AUH_the_congress_suspended:0 "The Congress Suspended"
 AUH_the_congress_suspended_desc:0 "The Congress does not meet, its funds are sequestered, and the metropolitan is a functionary. Two hundred and twenty years of self-government ended by decree in an afternoon."

 AUH_the_serb_radical_party:0 "The Serb Radicals of Hungary"
 AUH_the_serb_radical_party_desc:0 "Tomic and his deputies are Hungarians of the Orthodox confession before anything else. There is a price at which they will support a government, and it has to be paid again every session."

 AUH_the_serb_settlement_banks:0 "The Serb Settlement Banks"
 AUH_the_serb_settlement_banks_desc:0 "The savings houses of Novi Sad and Zemun buy land for Serb tenants as the Hungarian land banks do for Hungarians. The county land market is now a national question in writing."

 AUH_the_reopened_frontier:0 "The Reopened Frontier"
 AUH_the_reopened_frontier_desc:0 "The customs war is over and the Monarchy is Serbia's market again. The Hungarian agrarians were promised this tariff and intend to recover the difference elsewhere."

 AUH_the_closed_frontier_of_1906:0 "The Closed Frontier"
 AUH_the_closed_frontier_of_1906_desc:0 "Belgrade has built its own abattoirs, ships through Salonika and buys its artillery in France. The coercion has manufactured the independence it was meant to prevent."

 AUH_the_grenzer_tradition:0 "The Grenzer Tradition"
 AUH_the_grenzer_tradition_desc:0 "The Military Frontier was dissolved in 1881; its villages remember what they were raised for and enlist on being asked. The ministry does not always remember which river they were promised."

 AUH_the_serbs_of_the_third_crown:0 "The Serbs of the Third Crown"
 AUH_the_serbs_of_the_third_crown_desc:0 "The Serb districts of Syrmia and the see of Karlowitz belong to a south Slav crown that is neither Budapest nor Belgrade. Hungary now has an internal frontier drawn by imperial decree."

 AUH_at_home_in_the_monarchy:0 "At Home in the Monarchy"
 AUH_at_home_in_the_monarchy_desc:0 "Two million Orthodox subjects who spent a decade looking across the Save now look at Vienna. No ministry can move against Belgrade without first explaining itself to its own people."

 AUH_the_resolution_of_zadar:0 "The Resolution of Zadar"
 AUH_the_resolution_of_zadar_desc:0 "The Serbs of Croatia and Dalmatia set their price for a common south Slav programme, and the Croats paid it. The resulting majority is stable, national and answerable to Budapest."

 AUH_a_loyalty_nobody_asked_for:0 "A Loyalty Nobody Asked For"
 AUH_a_loyalty_nobody_asked_for_desc:0 "For two hundred years the Serbs of the Monarchy were its frontier guard, and were simply assumed. The assumption is all that is holding now, and across the Save there is a state that asks."

 AUH_the_press_of_novi_sad:0 "The Press of Novi Sad"
 AUH_the_press_of_novi_sad_desc:0 "The Serb papers appear with white columns where the censor has been, and their editors before the county courts on a schedule. Circulation has not fallen."

 AUH_the_watch_on_the_save:0 "The Watch on the Save"
 AUH_the_watch_on_the_save_desc:0 "Frontier gendarmerie, informers in the Sokol halls, and a growing file on a society founded in Belgrade in October 1908. The watch cannot tell it from two million subjects."

 AUH_the_serbs_under_administration:0 "The Serbs Under Administration"
 AUH_the_serbs_under_administration_desc:0 "The Congress is a memory, the schools are Hungarian, the frontier is shut and the recruit lists are complete. The Monarchy has manufactured the population its enemies could not."
