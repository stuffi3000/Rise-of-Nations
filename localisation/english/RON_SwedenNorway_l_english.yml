l_english:
 KNS_two_crowns_one_chancery:0 "Two Crowns, One Chancery"
 KNS_two_crowns_one_chancery_desc:0 "One king, one foreign ministry, two parliaments that never sit together, and no court above either of them. Every bill has to pass twice."
 KNS_the_committee_of_both_kingdoms:0 "The Committee of Both Kingdoms"
 KNS_the_committee_of_both_kingdoms_desc:0 "A joint commission to draft the reform that both chambers can live with. It is the only room in the union where Swedes and Norwegians argue in advance instead of afterwards."
 KNS_the_communique_of_march:0 "The Communique of March"
 KNS_the_communique_of_march_desc:0 "Stockholm concedes the principle: Norway may have consuls of its own. Twenty-five points in Kristiania, twenty gone in Stockholm, and the Riksdag will never again pass anything above seventy."
 KNS_conditions_of_dependency:0 "Conditions of Dependency"
 KNS_conditions_of_dependency_desc:0 "Consuls, yes, but subordinate to a foreign minister who is Swedish by law. It is a real offer and it is thirty points off the Storting."
 KNS_a_chancery_of_two_desks:0 "A Chancery of Two Desks"
 KNS_a_chancery_of_two_desks_desc:0 "One ministry, two staffs, two sets of instructions and one signature. It costs research money to run and it holds the union together for another two years."
 KNS_the_principles_of_kristiania:0 "The Principles of Kristiania"
 KNS_the_principles_of_kristiania_desc:0 "Stockholm publishes the terms it will accept and the Norwegian minister resigns the same week. Six points gained, twelve lost, and the last negotiated way out closes."
 KNS_the_consular_bill_of_may:0 "The Consular Bill of May"
 KNS_the_consular_bill_of_may_desc:0 "The bill goes to the king. No bonus, no reward, and the only three exits from the crisis open behind it."
 KNS_sanction_the_consular_bill:0 "Sanction the Consular Bill"
 KNS_sanction_the_consular_bill_desc:0 "Sign it. Forty points in Kristiania, thirty-five gone in Stockholm, and the royal refusal is spent for good: it will never be usable again."
 KNS_a_riksakt_for_the_century:0 "A Riksakt for the Century"
 KNS_a_riksakt_for_the_century_desc:0 "A new act of union, negotiated rather than granted. The two counters merge at their average, the gap disappears, and so does the crisis it was building towards."
 KNS_let_the_union_lapse:0 "Let the Union Lapse"
 KNS_let_the_union_lapse_desc:0 "Do not fight it. Open the negotiated dissolution and settle what can still be settled while both sides are still talking."
 KNS_the_crown_and_nothing_else:0 "The Crown and Nothing Else"
 KNS_the_crown_and_nothing_else_desc:0 "The union is reduced to the person of the king. It survives, it does almost nothing, and it survives."
 KNS_a_parliament_of_the_union:0 "A Parliament of the Union"
 KNS_a_parliament_of_the_union_desc:0 "The body that never existed: a union court and a union parliament, above both kingdoms and answerable to both. It works, and everything now takes twenty percent longer."
 KNS_the_karlstad_table:0 "The Karlstad Table"
 KNS_the_karlstad_table_desc:0 "A perpetual neutral zone, the new Norwegian works dismantled, and two states that part without a shot. Nobody gets what they wanted and everybody gets to keep their army."
 KNS_the_stortings_demand:0 "The Storting's Demand"
 KNS_the_stortings_demand_desc:0 "Fifteen years of the same resolution, passed again every session, and refused again every session. The claim ages and does not go away."
 KNS_the_pure_flag_precedent:0 "The Pure Flag Precedent"
 KNS_the_pure_flag_precedent_desc:0 "The union mark comes out of the Norwegian flag and the king signs it. The precedent is acquired, which is why every refusal from now on only buys half the usual delay."
 KNS_a_consular_service_of_our_own:0 "A Consular Service of Our Own"
 KNS_a_consular_service_of_our_own_desc:0 "Norway has the fourth merchant fleet in the world and no consul of its own in any port it calls at. The argument writes itself."
 KNS_the_michelsen_ministry:0 "The Michelsen Ministry"
 KNS_the_michelsen_ministry_desc:0 "A shipowner from Bergen who intends to force the question rather than argue it. Ten points in Kristiania, and the twenty-seventh of May is now loaded."
 KNS_two_flags_no_mark:0 "Two Flags, No Mark"
 KNS_two_flags_no_mark_desc:0 "Two clean flags, side by side, neither of them quartered with the other. It changes nothing legally and everything else."
 KNS_a_foreign_minister_of_our_own:0 "A Foreign Minister of Our Own"
 KNS_a_foreign_minister_of_our_own_desc:0 "The last common institution goes. Fifteen points each way, and after this there is nothing left to concede short of the union itself."
 KNS_the_language_of_the_law:0 "The Language of the Law"
 KNS_the_language_of_the_law_desc:0 "Statutes, judgments and schoolbooks in a written Norwegian nobody has to translate from Danish. It absorbs five smaller demands at once."
 KNS_double_proportionality:0 "Double Proportionality"
 KNS_double_proportionality_desc:0 "Proportional representation in both chambers. It is fair, it is overdue, and it hands the labour movement a bloc in each of them."
 KNS_the_seventh_of_june:0 "The Seventh of June"
 KNS_the_seventh_of_june_desc:0 "The Storting declares that the king has ceased to act as King of Norway and that the union is therefore dissolved. It is available only when the gap has already made it inevitable."
 KNS_the_plebiscite_of_august:0 "The Plebiscite of August"
 KNS_the_plebiscite_of_august_desc:0 "Three hundred and sixty-eight thousand votes for dissolution and one hundred and eighty-four against. The result is not negotiable and neither is what follows from it."
 KNS_march_on_kristiania:0 "March on Kristiania"
 KNS_march_on_kristiania_desc:0 "The twenty-one Norwegian states are Swedish cores and always were. Take them back, and find out what a union looks like when it is a garrison."
 KNS_the_union_restored_by_arms:0 "The Union Restored by Arms"
 KNS_the_union_restored_by_arms_desc:0 "It holds. It will hold for as long as there are troops in it, and the recruiting ground it holds down is half the manpower of the realm."
 KNS_a_bernadotte_for_norway:0 "A Bernadotte for Norway"
 KNS_a_bernadotte_for_norway_desc:0 "A prince of the house takes the Norwegian throne. Two kingdoms, one family, and fifty points of goodwill on the first morning."
 KNS_a_king_of_their_own_choosing:0 "A King of Their Own Choosing"
 KNS_a_king_of_their_own_choosing_desc:0 "Norway elects a Danish prince and calls him Haakon. It is clean, it is legitimate, and there is no bonus attached to it at all."
 KNS_settle_the_dynasty_question:0 "Settle the Dynasty Question"
 KNS_settle_the_dynasty_question_desc:0 "Extinguish the Norwegian republican challenge for good, at seventy-five political power and the whole of the shared-house goodwill."
 KNS_the_integrity_treaty:0 "The Integrity Treaty"
 KNS_the_integrity_treaty_desc:0 "Four powers guarantee Norwegian territory, and Norway may not cede a metre of it even if it wishes to."
 KNS_a_railway_to_ice_free_water:0 "A Railway to Ice-Free Water"
 KNS_a_railway_to_ice_free_water_desc:0 "Kiruna ore to a Norwegian harbour that never freezes. It is the most profitable line in Scandinavia and it runs through two kingdoms."
 KNS_the_company_at_kiruna:0 "The Company at Kiruna"
 KNS_the_company_at_kiruna_desc:0 "The richest iron ore in Europe, and the works and the town go up together in a place that had neither."
 KNS_the_norrland_line:0 "The Norrland Line"
 KNS_the_norrland_line_desc:0 "Rail into the north, and the north stops being a place the state hears about only when it fails."
 KNS_the_ore_agreement_of_1907:0 "The Ore Agreement of 1907"
 KNS_the_ore_agreement_of_1907_desc:0 "The state takes half the company and an option on the rest. It is the largest thing the Swedish treasury has ever bought."
 KNS_the_falls_of_the_north:0 "The Falls of the North"
 KNS_the_falls_of_the_north_desc:0 "Norwegian waterfalls, foreign capital, and more than half the developed power in the country already in other people's hands."
 KNS_reversion_in_sixty_years:0 "Reversion in Sixty Years"
 KNS_reversion_in_sixty_years_desc:0 "Concessions revert to the state after sixty years. Twelve points in Kristiania, and a quarter less foreign investment for a generation."
 KNS_the_falls_are_open_to_all:0 "The Falls Are Open to All"
 KNS_the_falls_are_open_to_all_desc:0 "Take the capital and the factories now, and accept that the power belongs to whoever paid for it."
 KNS_two_armies_one_king:0 "Two Armies, One King"
 KNS_two_armies_one_king_desc:0 "Two orders of battle, two general staffs, two sets of regulations, and no joint command anywhere above them."
 KNS_the_fortress_at_boden:0 "The Fortress at Boden"
 KNS_the_fortress_at_boden_desc:0 "The largest works in Scandinavia, facing east. The Storting reads the map and sees that it also faces west."
 KNS_the_works_at_kongsvinger:0 "The Works at Kongsvinger"
 KNS_the_works_at_kongsvinger_desc:0 "Norwegian forts on the Norwegian side of the union border. Everyone knows exactly which army they are for."
 KNS_the_fourth_merchant_fleet:0 "The Fourth Merchant Fleet"
 KNS_the_fourth_merchant_fleet_desc:0 "Norwegian hulls carry other people's cargo in every ocean, and earn more abroad than the country earns at home."
 KNS_the_coastal_squadron:0 "The Coastal Squadron"
 KNS_the_coastal_squadron_desc:0 "Armoured coast defence ships that cannot leave the skerries, paid for out of the freight that can."
 KNS_a_ministry_that_answers:0 "A Ministry That Answers"
 KNS_a_ministry_that_answers_desc:0 "Does the government sit because the king appointed it or because the chamber tolerates it? The war will decide, and the answer will be permanent."
 KNS_the_armoured_ship_fund:0 "The Armoured Ship Fund"
 KNS_the_armoured_ship_fund_desc:0 "The public subscribes for a battleship the chamber refused to fund. A free ship, and a precedent that the crown can go around the purse."
 KNS_the_chamber_holds_the_purse:0 "The Chamber Holds the Purse"
 KNS_the_chamber_holds_the_purse_desc:0 "No ship. Parliamentarism survives instead, and no royal prerogative is ever written down again."
 KNS_three_kings_at_malmo:0 "Three Kings at Malmo"
 KNS_three_kings_at_malmo_desc:0 "Three monarchs, one photograph, and an understanding that binds nobody to anything. It is worth more than it sounds and less than it looks."
 KNS_the_hunger_ministry:0 "The Hunger Ministry"
 KNS_the_hunger_ministry_desc:0 "Sell to both sides, buy from neither, and watch the bread queues grow while the trade figures do."
 KNS_the_aland_claim:0 "The Aland Claim"
 KNS_the_aland_claim_desc:0 "The islands are Swedish-speaking, they vote to join, and taking them means a war with a country that has just had one."
 KNS_submit_to_arbitration:0 "Submit to Arbitration"
 KNS_submit_to_arbitration_desc:0 "Let the League decide. It decides against us, the islands stay Finnish, and nobody in Europe ever wonders about our intentions again."
 KNS_two_markets_one_ledger:0 "Two Markets, One Ledger"
 KNS_two_markets_one_ledger_desc:0 "Ore to Berlin and freight to London, sold out of the same ministry by the same officials, and neither buyer is told about the other."
 KNS_the_neutrality_watch:0 "The Neutrality Watch"
 KNS_the_neutrality_watch_desc:0 "Joint defensive mobilisation without a joint staff to command it. It works because nobody attacks."
 KNS_the_fleet_that_pays:0 "The Fleet That Pays"
 KNS_the_fleet_that_pays_desc:0 "Charter the merchant fleet to the Allies at wartime rates, and lose a steady fraction of it every month for the duration."
 KNS_a_navy_for_two_coasts:0 "A Navy for Two Coasts"
 KNS_a_navy_for_two_coasts_desc:0 "One fleet, two seas, one flag. It is more efficient than two navies and the Storting has just lost its own."
 KNS_the_general_franchise:0 "The General Franchise"
 KNS_the_general_franchise_desc:0 "Universal suffrage in both kingdoms, ten points in Kristiania and five in Stockholm, and the union outlives the men who built it."
 KNS_the_labour_question:0 "The Labour Question"
 KNS_the_labour_question_desc:0 "The labour movement splits along the same seam as everything else in this country, and this time the seam runs inside each party as well as between them."
 KNS_erik_the_reds_land:0 "Erik the Red's Land"
 KNS_erik_the_reds_land_desc:0 "Occupy eastern Greenland and let Copenhagen come and take it back. It is a real claim, and it is a war with a Nordic neighbour over ice."
 KNS_let_the_court_decide:0 "Let the Court Decide"
 KNS_let_the_court_decide_desc:0 "The Hague rules for Denmark and we accept it within the week. It costs us the claim and buys us every friend north of the Skagerrak."
 KNS_the_dry_kingdom:0 "The Dry Kingdom"
 KNS_the_dry_kingdom_desc:0 "Prohibition carried by referendum in both realms. It is popular, it is orderly, and the wine-growing countries will remember it at every trade round for twenty years."
 KNS_the_wine_treaties:0 "The Wine Treaties"
 KNS_the_wine_treaties_desc:0 "The union's foreign ministry trades import quotas for export access. It is the one thing the joint chancery has ever been unambiguously good at."
 KNS_the_spitsbergen_treaty:0 "The Spitsbergen Treaty"
 KNS_the_spitsbergen_treaty_desc:0 "Sovereignty over the archipelago, and every signatory may mine there on the same terms as us. It is sovereignty with the interesting parts removed."
 KNS_the_crisis_settlement:0 "The Crisis Settlement"
 KNS_the_crisis_settlement_desc:0 "Buy the farmers' bloc in both chambers with guaranteed prices, and govern for a decade on the strength of it."
 KNS_the_saltsjobaden_accord:0 "The Saltsjobaden Accord"
 KNS_the_saltsjobaden_accord_desc:0 "The state steps out of industrial disputes and hands them to the two sides to settle. They do, for forty years."
 KNS_the_minister_of_defence_resigns:0 "The Minister of Defence Resigns"
 KNS_the_minister_of_defence_resigns_desc:0 "He said in public what the cabinet says in private. Dismissing him costs seventy-five political power and removes him from the game."
 KNS_the_ore_road:0 "The Ore Road"
 KNS_the_ore_road_desc:0 "Where the ore goes out is now a matter of public record, and every great power reads the figure every month."
 KNS_ship_it_through_lulea:0 "Ship It Through Lulea"
 KNS_ship_it_through_lulea_desc:0 "Keep the ore in the Baltic and keep the whole route under our own control, five months of the year."
 KNS_ship_it_through_narvik:0 "Ship It Through Narvik"
 KNS_ship_it_through_narvik_desc:0 "Ice-free all year, immensely profitable, and it makes one Norwegian harbour the first objective of every war plan in Europe."
 KNS_a_single_general_staff:0 "A Single General Staff"
 KNS_a_single_general_staff_desc:0 "The first joint command in the history of the union, forty years after it would have prevented anything."
 KNS_the_union_that_held:0 "The Union That Held"
 KNS_the_union_that_held_desc:0 "Settle the account. Two chambers that ended up agreeing, or two that never did, and the answer is written into the rest of the century."
 KNS_a_union_of_the_north:0 "A Union of the North"
 KNS_a_union_of_the_north_desc:0 "A Scandinavian bloc with Denmark and Iceland. Nobody inside it may join anybody else's, which is the point and also the limit."
 KNS_neither_east_nor_west:0 "Neither East Nor West"
 KNS_neither_east_nor_west_desc:0 "Armed neutrality, paid for out of our own budget, with no lend-lease and no guarantee from anyone."
 KNS_the_atlantic_signature:0 "The Atlantic Signature"
 KNS_the_atlantic_signature_desc:0 "American weapons, American credit and a guarantee of assistance, in exchange for the Nordic understanding and the last of the neutrality."
 KNS_idea_one_realm_in_two_chambers:0 "One Realm in Two Chambers"
 KNS_idea_one_realm_in_two_chambers_desc:0 "The union acts as a single state, and nothing whatsoever is decided in it without two votes."
 KNS_idea_a_claim_fifteen_years_old:0 "A Claim Fifteen Years Old"
 KNS_idea_a_claim_fifteen_years_old_desc:0 "The same resolution, passed every session and refused every session, in eleven Norwegian counties that have stopped expecting anything else."
 KNS_idea_the_union_restored_by_arms:0 "The Union Restored by Arms"
 KNS_idea_the_union_restored_by_arms_desc:0 "It holds for exactly as long as the troops are there, and the troops are standing on half our own recruiting ground."
 KNS_idea_the_integrity_treaty:0 "The Integrity Treaty"
 KNS_idea_the_integrity_treaty_desc:0 "Four powers guarantee the border, and it may not be altered even by agreement."
 KNS_idea_the_hunger_ministry:0 "The Hunger Ministry"
 KNS_idea_the_hunger_ministry_desc:0 "The trade figures have never been better and the bread queue goes round the block."
 KNS_idea_nothing_to_expect_from_the_east:0 "Nothing to Expect from the East"
 KNS_idea_nothing_to_expect_from_the_east_desc:0 "We asked a court and accepted the answer. Nobody will ever be nervous about us again, which cuts both ways."
 KNS_idea_the_fleet_that_pays:0 "The Fleet That Pays"
 KNS_idea_the_fleet_that_pays_desc:0 "Chartered at wartime rates and sunk at wartime rates."
 KNS_idea_the_dry_kingdom:0 "The Dry Kingdom"
 KNS_idea_the_dry_kingdom_desc:0 "Sober, orderly, and remembered by every wine-growing country at every trade round."
 KNS_idea_open_to_all_signatories:0 "Open to All Signatories"
 KNS_idea_open_to_all_signatories_desc:0 "Ours by treaty, and mineable by anyone who signed the same treaty."
 KNS_idea_the_saltsjobaden_accord:0 "The Saltsjobaden Accord"
 KNS_idea_the_saltsjobaden_accord_desc:0 "The two sides of industry settle it between them, and the state finds out afterwards."
 KNS_idea_the_ore_road_to_narvik:0 "The Ore Road to Narvik"
 KNS_idea_the_ore_road_to_narvik_desc:0 "Ice-free, immensely profitable, and the first objective in everybody's war plan."
 KNS_idea_collective_neutrality:0 "Collective Neutrality"
 KNS_idea_collective_neutrality_desc:0 "Four countries that will not join anyone, including each other's protectors."
 KNS_two_crowns_one_chancery_tt:0 "Opens the two chambers: Riksdag 62, Storting 38, a gap of 24 and no vetoes spent."
 KNS_the_committee_of_both_kingdoms_tt:0 "Five points in each chamber, and thirty percent off the two focuses below."
 KNS_the_communique_of_march_tt:0 "Storting +25, Riksdag -20, and the Riksdag is capped at 70 for the rest of the game."
 KNS_conditions_of_dependency_tt:0 "Riksdag +25 and Storting -30. The royal refusal starts to count."
 KNS_a_chancery_of_two_desks_tt:0 "Eight points in Kristiania and four in Stockholm, at fifteen percent of the research budget."
 KNS_the_principles_of_kristiania_tt:0 "Riksdag +6, Storting -12, and the Norwegian minister resigns."
 KNS_the_consular_bill_of_may_tt:0 "No bonus. It arms the twenty-seventh of May and opens the only three exits from the crisis."
 KNS_sanction_the_consular_bill_tt:0 "Storting +40, Riksdag -35, and the royal refusal is locked at three: it can never be used again."
 KNS_a_riksakt_for_the_century_tt:0 "The two counters merge at their average. The gap and its crisis both disappear."
 KNS_let_the_union_lapse_tt:0 "Opens the negotiated dissolution, with the settlement still to be argued."
 KNS_the_crown_and_nothing_else_tt:0 "The union is reduced to the king's person, at half its former bonus."
 KNS_a_parliament_of_the_union_tt:0 "A union court and a union parliament. Everything the union does now takes twenty percent longer."
 KNS_the_karlstad_table_tt:0 "A perpetual neutral zone, the new works dismantled, and two armies that never met."
 KNS_the_stortings_demand_tt:0 "Installs A Claim Fifteen Years Old in the eleven Norwegian states."
 KNS_the_pure_flag_precedent_tt:0 "Storting +6, Riksdag -4. The royal refusal now freezes a bill for ninety days instead of a hundred and eighty."
 KNS_a_consular_service_of_our_own_tt:0 "Storting +8, Riksdag -6, and five percent on trade efficiency."
 KNS_the_michelsen_ministry_tt:0 "Storting +10, Riksdag -8. The twenty-seventh of May is armed."
 KNS_two_flags_no_mark_tt:0 "Storting +8, Riksdag -5, and stability in the Norwegian states."
 KNS_a_foreign_minister_of_our_own_tt:0 "Fifteen points each way. The last common institution is gone."
 KNS_the_language_of_the_law_tt:0 "Storting +6 and ten points of stability. It absorbs five smaller demands at once."
 KNS_double_proportionality_tt:0 "Riksdag +8, Storting +4, and the Great Strike follows."
 KNS_the_seventh_of_june_tt:0 "Available only once the gap has already reached sixty-five. The union is declared dissolved."
 KNS_the_plebiscite_of_august_tt:0 "The result is scripted and not negotiable. It locks the negotiated road and opens Karlstad."
 KNS_march_on_kristiania_tt:0 "War with Norway. The twenty-one states are already Swedish cores."
 KNS_the_union_restored_by_arms_tt:0 "The union holds. Stability -30, and half the Norwegian recruiting ground with it."
 KNS_a_bernadotte_for_norway_tt:0 "Both realms start at fifty opinion, under one house and two thrones."
 KNS_a_king_of_their_own_choosing_tt:0 "Norway takes its own dynasty. Ten points of stability and no bonus of any kind."
 KNS_settle_the_dynasty_question_tt:0 "The republican challenge ends, at seventy-five political power and the shared-house goodwill."
 KNS_the_integrity_treaty_tt:0 "A four-power guarantee, and no cession of territory even by consent."
 KNS_a_railway_to_ice_free_water_tt:0 "Steel and ten percent on trade efficiency. The ore now has a year-round outlet."
 KNS_the_company_at_kiruna_tt:0 "Two military factories and steel in the north, and Riksdag +6."
 KNS_the_norrland_line_tt:0 "Infrastructure across the northern states, and the undeveloped-north malus lifts by condition."
 KNS_the_ore_agreement_of_1907_tt:0 "The state takes half the company and an option on the rest. Riksdag +8."
 KNS_the_falls_of_the_north_tt:0 "Opens the Norwegian counter-branch. More than half the developed power is already foreign-held."
 KNS_reversion_in_sixty_years_tt:0 "Storting +12, Riksdag -8, and a quarter less foreign investment for a generation."
 KNS_the_falls_are_open_to_all_tt:0 "Two civilian factories now and five years of faster building, at twelve points off the Storting."
 KNS_two_armies_one_king_tt:0 "Two orders of battle and no joint staff anywhere above them."
 KNS_the_fortress_at_boden_tt:0 "Three fort levels in the north. Riksdag +8, Storting -10."
 KNS_the_works_at_kongsvinger_tt:0 "Three fort levels on the union border. Storting +10, Riksdag -8."
 KNS_the_fourth_merchant_fleet_tt:0 "Thirty percent more convoys and Storting +5."
 KNS_the_coastal_squadron_tt:0 "Coast defence ships, Riksdag +6, Storting -4, and ten percent off the freight income that pays for them."
 KNS_a_ministry_that_answers_tt:0 "Opens the parliamentary question of 1914. Ten points of stability."
 KNS_the_armoured_ship_fund_tt:0 "A free battleship, faster naval building, Riksdag +8 and Storting -10."
 KNS_the_chamber_holds_the_purse_tt:0 "Parliamentarism survives. Stability and political power, and Storting +6."
 KNS_three_kings_at_malmo_tt:0 "A Nordic understanding that binds nobody. Opinion and trade with Denmark."
 KNS_the_hunger_ministry_tt:0 "Trade income and steel, at ten points of consumer goods and ten of stability."
 KNS_the_aland_claim_tt:0 "War with Finland over the islands, and fifty opinion with every Nordic state."
 KNS_submit_to_arbitration_tt:0 "The islands are lost and nobody in Europe will ever be nervous about us again."
 KNS_two_markets_one_ledger_tt:0 "Ore east and freight west, sold from one ministry, and neither buyer told about the other."
 KNS_the_neutrality_watch_tt:0 "Joint defensive mobilisation with no joint staff to command it."
 KNS_the_fleet_that_pays_tt:0 "Wartime charter rates, and a steady monthly loss of hulls for the duration."
 KNS_a_navy_for_two_coasts_tt:0 "One fleet for two seas. Storting -12."
 KNS_the_general_franchise_tt:0 "Universal suffrage in both realms. Storting +10, Riksdag +5, fifteen points of stability."
 KNS_the_labour_question_tt:0 "The movement splits in both realms. Stability -10 and communist support up."
 KNS_erik_the_reds_land_tt:0 "War with Denmark over eastern Greenland."
 KNS_let_the_court_decide_tt:0 "The claim is dropped, and Nordic opinion and diplomatic influence both rise."
 KNS_the_dry_kingdom_tt:0 "Ten points of stability, and a permanent trade malus with the wine-growing countries."
 KNS_the_wine_treaties_tt:0 "Twenty-five percent more exports, negotiated by the joint chancery."
 KNS_the_spitsbergen_treaty_tt:0 "The archipelago is ours, and every signatory may mine it on our terms."
 KNS_the_crisis_settlement_tt:0 "The farmers' bloc in both chambers, bought with guaranteed prices. Fifteen points of stability."
 KNS_the_saltsjobaden_accord_tt:0 "The state leaves industrial disputes to the two sides. Ten percent on factory efficiency."
 KNS_the_minister_of_defence_resigns_tt:0 "Dismissing him costs seventy-five political power and removes him from the game."
 KNS_the_ore_road_tt:0 "Opens the ore crossroads, and the exported tonnage becomes a figure every great power reads."
 KNS_ship_it_through_lulea_tt:0 "The ore stays in the Baltic and the whole route stays ours, five months a year."
 KNS_ship_it_through_narvik_tt:0 "Year-round flow and very high revenue. Narvik becomes everyone's first objective."
 KNS_a_single_general_staff_tt:0 "The first joint command in the union's history, and twenty-five army experience with it."
 KNS_the_union_that_held_tt:0 "Settles the mechanic on whichever side the gap finished."
 KNS_a_union_of_the_north_tt:0 "A Scandinavian faction with Denmark and Iceland, and nobody in it may join another."
 KNS_neither_east_nor_west_tt:0 "Armed neutrality: twenty-five percent more military construction, no faction, no lend-lease."
