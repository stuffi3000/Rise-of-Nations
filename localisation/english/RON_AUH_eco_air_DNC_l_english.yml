###############################################################################################################################
# Austria-Hungary - the common economy and the beginnings of flight, 1900-1909.
# Lot L7a, companion to common/national_focus/RON_AUH_eco_air_DNC.txt and
# common/ideas/RON_AUH_eco_air_DNC_ideas.txt. Every key below is new; none of them exists
# anywhere else in the loaded English localisation.
###############################################################################################################################

# --- F4 : the common market, the head and the tariff -------------------------------------------

 AUHDNC_eco_the_common_market:0 "The Common Market"
 AUHDNC_eco_the_common_market_desc:0 "One customs territory from the Bodensee to the Bukovina, fifty millions inside a single tariff wall. Renewed three times since 1867, it expires again on the last day of 1907."

 AUHDNC_eco_the_autonomous_tariff:0 "The Autonomous Tariff"
 AUHDNC_eco_the_autonomous_tariff_desc:0 "Set the duties in Vienna and Budapest alone, high on grain and on cattle, and sign nothing with anybody. The exporters of Bohemia lose the markets they live on, Berlin takes it as an unfriendly act, and the Quota comes dearer. The treaty road closes."

 AUHDNC_eco_the_commercial_treaties:0 "The Commercial Treaties"
 AUHDNC_eco_the_commercial_treaties_desc:0 "The treaties of 1905 and 1906 with Germany, Italy and Switzerland: the tariff stops being a wall and becomes a bargaining floor. Grain prices fall, and the magnates who vote the common budget notice inside the quarter. The autonomous road closes."

 AUHDNC_eco_the_quota_deputations:0 "The Quota Deputations"
 AUHDNC_eco_the_quota_deputations_desc:0 "Sixty men from each chamber, in separate rooms, communicating in writing, to fix what share of the common expenditure Hungary carries. Worked properly they buy a better figure and cost the Crown the goodwill of Budapest."

 AUHDNC_eco_the_koerber_billion:0 "The Koerber Billion"
 AUHDNC_eco_the_koerber_billion_desc:0 "Koerber governs by paragraph 14 and proposes to buy the peace no parliament will vote him: canals and alpine railways, near a billion crowns, put before the country in 1901."

 AUHDNC_eco_the_two_seaports:0 "The Two Seaports"
 AUHDNC_eco_the_two_seaports_desc:0 "One short coast and two harbours: Austrian Trieste, and Fiume, detached from Croatia in 1868 for the Crown of Saint Stephen. Both are enlarged from the same purse, so what is voted for the one is refused to the other."

# --- F4 : the agrarian road --------------------------------------------------------------------

 AUHDNC_eco_the_bund_der_landwirte:0 "The Bund der Landwirte"
 AUHDNC_eco_the_bund_der_landwirte_desc:0 "The agrarian league delivers a bloc of votes on both banks of the Leitha. Give it its branch lines in western Hungary and it votes the common budget unbegged."

 AUHDNC_eco_the_veterinary_frontier:0 "The Veterinary Frontier"
 AUHDNC_eco_the_veterinary_frontier_desc:0 "Close the frontier to Serbian and Romanian livestock on a certificate of animal health signed in Budapest. Belgrade will remember it when the customs war comes."

 AUHDNC_eco_the_home_market_is_enough:0 "The Home Market Is Enough"
 AUHDNC_eco_the_home_market_is_enough_desc:0 "Fifty million people who buy from each other and from nobody else. The mills run full and the consumer is cheaply fed, up to the day the Monarchy needs something it does not make."

# --- F4 : the treaty road ----------------------------------------------------------------------

 AUHDNC_eco_the_treaty_with_berlin:0 "The Treaty with Berlin"
 AUHDNC_eco_the_treaty_with_berlin_desc:0 "The commercial treaty of 1905 with the German Empire: the alliance is worth less than the schedule attached to it. Budapest gets to explain German rye to its own farmers."

 AUHDNC_eco_the_most_favoured_nation:0 "The Most Favoured Nation"
 AUHDNC_eco_the_most_favoured_nation_desc:0 "Extend the schedule to Italy and to Switzerland. Trieste lives on this traffic, and Austrian goods must then meet Italian goods on Italian terms."

 AUHDNC_eco_the_oriental_markets:0 "The Oriental Markets"
 AUHDNC_eco_the_oriental_markets_desc:0 "The Balkan and Levantine outlets, worked by consuls who are half salesmen, with Bosnia as the forward warehouse. They tie us to provinces the Sultan is about to lose."

# --- F4 : the Quota and the ten-year clock -----------------------------------------------------

 AUHDNC_eco_the_renewal_of_the_bundnis:0 "The Renewal of the Buendnis"
 AUHDNC_eco_the_renewal_of_the_bundnis_desc:0 "The decennial settlement, negotiated rather than conceded: both parliaments ratify, and the Monarchy looks to its creditors like a state instead of a lawsuit. The Quota moves toward Budapest, which signs nothing for nothing."

# --- F4 : the railways of the state ------------------------------------------------------------

 AUHDNC_eco_the_state_railway_administration:0 "The State Railway Administration"
 AUHDNC_eco_the_state_railway_administration_desc:0 "The k. k. Staatsbahnen, assembled line by line since the eighties as the private concessions fell in. The largest employer in Cisleithania, carrying freight at rates the diets fix."

 AUHDNC_eco_nationalise_the_sudbahn:0 "Nationalise the Suedbahn"
 AUHDNC_eco_nationalise_the_sudbahn_desc:0 "Buy out the Southern Railway: the Vienna-Trieste artery in one hand at last, and roadbed for the Slovene valleys instead of promises. The state takes a generation of insolvent paper onto its own books. The private road closes."

 AUHDNC_eco_let_the_sudbahn_run_itself:0 "Let the Suedbahn Run Itself"
 AUHDNC_eco_let_the_sudbahn_run_itself_desc:0 "Refuse the purchase price: no new debt, and no bankrupt balance sheet on the common estimate. The one line to the sea stays with a company that cannot pay for its own sleepers. The purchase road closes."

# --- F4 : the Koerber money --------------------------------------------------------------------

 AUHDNC_eco_the_alpine_breakthroughs:0 "The Alpine Breakthroughs"
 AUHDNC_eco_the_alpine_breakthroughs_desc:0 "The Tauern, the Karawanken and the Wochein: three tunnels driven through the Alps between 1901 and 1909 to give Trieste a second line. They cost what a fleet costs, on paper Bohemia was promised first. The river road closes."

 AUHDNC_eco_the_danube_as_a_highway:0 "The Danube as a Highway"
 AUHDNC_eco_the_danube_as_a_highway_desc:0 "Put the Koerber money into the water instead of the rock. The river serves Vienna and Budapest equally, which is why both parliaments vote it, and it runs where the mountains are not. The mountain road closes."

 AUHDNC_eco_the_second_line_to_trieste:0 "The Second Line to Trieste"
 AUHDNC_eco_the_second_line_to_trieste_desc:0 "Open the new alpine route through to the harbour and add the marshalling yards, and Trieste stops being a port served by one overloaded track."

 AUHDNC_eco_the_alpine_electrification:0 "The Alpine Electrification"
 AUHDNC_eco_the_alpine_electrification_desc:0 "Single-phase alternating current on the mountain sections, tried on the Wochein before anybody in Europe. A tunnel worked by steam is half blocked by its own smoke."

 AUHDNC_eco_the_hydro_power_of_the_alps:0 "The Hydro-Power of the Alps"
 AUHDNC_eco_the_hydro_power_of_the_alps_desc:0 "Water falling through Carinthia and Upper Austria, turned into traction for the railways and furnaces for the valleys. The credits are taken against electricity that has not yet been sold."

 AUHDNC_eco_the_danube_steam_navigation:0 "The Danube Steam Navigation"
 AUHDNC_eco_the_danube_steam_navigation_desc:0 "The DDSG, the largest inland shipping company in the world, with its yards at Obuda and its coal from the Banat. It carries more tonnage than the Adriatic does."

 AUHDNC_eco_the_iron_gates_tolls:0 "The Iron Gates Tolls"
 AUHDNC_eco_the_iron_gates_tolls_desc:0 "The channel blasted through the cataracts in 1896 is Hungarian work on a Serbian and Romanian frontier, and the toll is resented in three capitals. Reduce it."

# --- F4 : the two seaports ---------------------------------------------------------------------

 AUHDNC_eco_the_port_of_trieste:0 "The Port of Trieste"
 AUHDNC_eco_the_port_of_trieste_desc:0 "Put the money into the free port: the new Franz Joseph basin, the warehouses, and the Austrian Lloyd behind them. Budapest pays a third of it under the Quota for a quay in a town where nobody speaks Hungarian. Fiume closes."

 AUHDNC_eco_the_port_of_fiume:0 "The Port of Fiume"
 AUHDNC_eco_the_port_of_fiume_desc:0 "Put the money into the Hungarian sea. Budapest fixes its railway tariffs so that grain travels past Trieste to a harbour the Crown of Saint Stephen owns outright, and a Hungary with a seaport asks for more, not less. Trieste closes."

 AUHDNC_eco_the_subsidised_lines:0 "The Subsidised Lines"
 AUHDNC_eco_the_subsidised_lines_desc:0 "The Austrian Lloyd to Bombay, the Adria to England, the Ungaro-Croata along the coast: none of them pays, all are voted a subsidy, and all keep to a schedule the Admiralty writes."

 AUHDNC_eco_the_men_who_sail_from_fiume:0 "The Men Who Sail from Fiume"
 AUHDNC_eco_the_men_who_sail_from_fiume_desc:0 "A million and a half subjects leave for America between 1899 and 1913, and the Hungarian state takes a commission on every ticket. The remittances come back; the men do not."

 AUHDNC_eco_the_chambers_of_commerce:0 "The Chambers of Commerce"
 AUHDNC_eco_the_chambers_of_commerce_desc:0 "The commercial curia sends its own deputies to the Reichsrat, the one curia not organised on a national roll. A Czech manufacturer and a German banker vote in it as merchants."

# --- F4 lower band : the bank, the debt and the money ------------------------------------------

 AUHDNC_eco_the_austro_hungarian_bank:0 "The Austro-Hungarian Bank"
 AUHDNC_eco_the_austro_hungarian_bank_desc:0 "One bank of issue, two head offices, one note printed in both languages. Its charter runs on the same clock as the customs union, and Budapest would rather have a bank of its own. The demand is refused until 1911."

 AUHDNC_eco_the_crown_on_gold:0 "The Crown on Gold"
 AUHDNC_eco_the_crown_on_gold_desc:0 "The crown of 1892, convertible in fact from 1900 though the law is never quite completed. Paris lends cheaply; the bank cannot print its way out of a harvest or a mobilisation."

 AUHDNC_eco_the_debt_of_the_old_empire:0 "The Debt of the Old Empire"
 AUHDNC_eco_the_debt_of_the_old_empire_desc:0 "The general debt contracted before 1867, to which Hungary pays a fixed sum agreed when Hungary was much poorer. Settle it on Vienna's reading and Budapest calls it a debt collected."

 AUHDNC_eco_the_common_estimates:0 "The Common Estimates"
 AUHDNC_eco_the_common_estimates_desc:0 "The budget of the three common ministries, laid before the Delegations: sixty Austrians and sixty Hungarians in two rooms, writing to each other because a joint sitting would need a language. Nothing is voted quickly."

 AUHDNC_eco_the_great_viennese_banks:0 "The Great Viennese Banks"
 AUHDNC_eco_the_great_viennese_banks_desc:0 "Creditanstalt, Bankverein, Laenderbank, Bodencreditanstalt. They do not lend to industry so much as own it: a board seat for every advance, and policy made on the Herrengasse."

 AUHDNC_eco_the_vienna_bourse:0 "The Vienna Bourse"
 AUHDNC_eco_the_vienna_bourse_desc:0 "The exchange has never recovered its nerve since 1873, and it prices Monarchy paper accordingly. Reform the listing rules and publish the accounts, and capital comes back from mortgage bonds to industrial shares."

 AUHDNC_eco_the_savings_of_the_provinces:0 "The Savings of the Provinces"
 AUHDNC_eco_the_savings_of_the_provinces_desc:0 "Below the great banks a second system: the Zivnostenska in Prague, the Slovene banks of Celje, the Polish co-operatives of Galicia. They lend sums the Viennese would not bother with."

 AUHDNC_eco_the_capital_offensive_in_the_balkans:0 "The Capital Offensive in the Balkans"
 AUHDNC_eco_the_capital_offensive_in_the_balkans_desc:0 "Vienna money into Belgrade, Sofia and Salonica: railway concessions, municipal loans, arsenals built on credit. It buys a hold no customs war ever gave anybody, and a creditor is the first to be expropriated. Capital at home closes."

 AUHDNC_eco_capital_stays_at_home:0 "Capital Stays at Home"
 AUHDNC_eco_capital_stays_at_home_desc:0 "Keep the money inside the tariff wall: Galicia, the Karst, the Bukovina. The return is worse than Belgrade would have paid. The Balkan offensive closes."

# --- F4 : the ordnance of the common army ------------------------------------------------------

 AUHDNC_eco_the_common_army_orders:0 "The Orders of the Common Army"
 AUHDNC_eco_the_common_army_orders_desc:0 "The ordnance contracts of the k. u. k. army, apportioned on the Quota because Budapest votes the credits. The rifle is chosen in a committee where the deciding argument is which bank of the Leitha the factory stands on."

 AUHDNC_eco_the_steyr_works:0 "The Steyr Works"
 AUHDNC_eco_the_steyr_works_desc:0 "Oesterreichische Waffenfabriksgesellschaft at Steyr: the largest small-arms plant in Europe, and idle most of the decade because the contingent it arms may not grow."

 AUHDNC_eco_the_arsenal_of_vienna:0 "The Arsenal of Vienna"
 AUHDNC_eco_the_arsenal_of_vienna_desc:0 "The Arsenal on the Landstrasse, built after 1848 to hold a garrison as much as to make guns, and still the technical brain of the artillery. What is decided here is fired in 1914."

 AUHDNC_eco_the_steel_of_witkowitz:0 "The Steel of Witkowitz"
 AUHDNC_eco_the_steel_of_witkowitz_desc:0 "The Witkowitz ironworks in Moravia, Rothschild property, and the only mill in the Monarchy that can roll plate to naval thickness. The men who make it read the Czech papers."

 AUHDNC_eco_the_thirty_and_a_half_centimetre:0 "The Thirty and a Half Centimetre"
 AUHDNC_eco_the_thirty_and_a_half_centimetre_desc:0 "The Skoda 30.5 cm siege mortar, road-transportable in three loads and better than anything Krupp offers. Five years of the artillery estimate go into a few dozen guns."

 AUHDNC_eco_the_hungarian_share_of_the_orders:0 "The Hungarian Share of the Orders"
 AUHDNC_eco_the_hungarian_share_of_the_orders_desc:0 "Budapest votes the common credits and wants the contracts in the proportion it pays, not in the proportion its factories can deliver. A share once conceded is owed forever."

 AUHDNC_eco_the_ordnance_cartel:0 "The Ordnance Cartel"
 AUHDNC_eco_the_ordnance_cartel_desc:0 "Skoda, Steyr and Witkowitz agree their prices and guarantee their capacity, and the War Ministry agrees to stop asking anybody else. The guns then cost what the three of them say they cost. The foreign tender closes."

 AUHDNC_eco_buy_the_best_gun_abroad:0 "Buy the Best Gun Abroad"
 AUHDNC_eco_buy_the_best_gun_abroad_desc:0 "Open the tender to Krupp and to Schneider, and let the committee choose on the proving ground rather than on the map. The Bohemian and Styrian works read about it in the newspaper, and the money leaves the customs union. The cartel closes."

 AUHDNC_eco_the_technical_colleges:0 "The Technical Colleges"
 AUHDNC_eco_the_technical_colleges_desc:0 "The Technische Hochschulen of Vienna, Graz, Prague and Lviv, and the Czech college fought for through a decade of obstruction. They teach in four languages."

# --- F4 : the two terminals --------------------------------------------------------------------

 AUHDNC_eco_one_market_of_fifty_millions:0 "One Market of Fifty Millions"
 AUHDNC_eco_one_market_of_fifty_millions_desc:0 "Write the union into the constitution as a fact rather than a contract: no expiry and no decennial negotiation. The Magyar gentry is told in law that it signed away a country in 1867, and the Quota is settled upward to buy the signature."

 AUHDNC_eco_two_economies_under_one_crown:0 "Two Economies under One Crown"
 AUHDNC_eco_two_economies_under_one_crown_desc:0 "The settlement of 1907 read out loud: not one territory by nature, but two customs territories that agree, ten years at a time, to raise no barrier between them. The common market now has an expiry date on its face."

# --- F6 : the Militaer-Aeronautische Anstalt ---------------------------------------------------

 AUHDNC_air_the_militar_aeronautische_anstalt:0 "The Militaer-Aeronautische Anstalt"
 AUHDNC_air_the_militar_aeronautische_anstalt_desc:0 "The Military Aeronautical Establishment, founded at the Arsenal in 1893: captive balloons, a photographic section, and an estimate an infantry battalion would refuse."

 AUHDNC_air_the_balloon_detachments:0 "The Balloon Detachments"
 AUHDNC_air_the_balloon_detachments_desc:0 "Captive balloons attached to the fortress artillery, with a telephone cable down the tether. An observer six hundred metres up can correct the guns onto the far slope of a ridge; no aeroplane will do that for fifteen years."

 AUHDNC_air_the_aeronautical_credits:0 "The Aeronautical Credits"
 AUHDNC_air_the_aeronautical_credits_desc:0 "Go to the Delegations for money. They will not vote for a machine that has not flown, and it will not fly until the money is voted; the officers make up the difference privately."

 AUHDNC_air_the_dirigible_question:0 "The Dirigible Question"
 AUHDNC_air_the_dirigible_question_desc:0 "The airship: visible, expensive, admired at manoeuvres, and a target the size of a church. Germany is building them and senior men say the Monarchy must too. Every crown spent on the shed is a crown not spent on a wing, and the aeroplane road closes."

 AUHDNC_air_heavier_than_air:0 "Heavier than Air"
 AUHDNC_air_heavier_than_air_desc:0 "Put the establishment behind the aeroplane, and begin the experience curve now rather than in 1911. Nothing whatever to show the Delegations for four or five years, and a great many broken machines. The airship road closes."

 AUHDNC_air_the_airship_of_the_army:0 "The Airship of the Army"
 AUHDNC_air_the_airship_of_the_army_desc:0 "A military dirigible of the Monarchy's own, with a shed at Fischamend and a crew trained to handle it in an alpine wind. The first rifle company that gets under it will bring it down."

 AUHDNC_air_the_zanonia_wing:0 "The Zanonia Wing"
 AUHDNC_air_the_zanonia_wing_desc:0 "Igo Etrich, a manufacturer's son at Trautenau, copies the seed of the Zanonia macrocarpa: a swept wing that rights itself. He builds it as a glider, out of his own pocket."

 AUHDNC_air_the_etrich_taube:0 "The Etrich Taube"
 AUHDNC_air_the_etrich_taube_desc:0 "The Dove: stable enough for an observer to draw a map while it flies itself, and slow enough to be shot at by anyone who cares to. Germany builds it by the hundred."

 AUHDNC_air_the_field_at_fischamend:0 "The Field at Fischamend"
 AUHDNC_air_the_field_at_fischamend_desc:0 "Flat ground down the Danube from Vienna: a shed, a workshop and eventually a landing field, the first military aerodrome in the Monarchy. Close enough to the Arsenal to be watched."

 AUHDNC_air_the_wind_tunnel_at_fischamend:0 "The Wind Tunnel at Fischamend"
 AUHDNC_air_the_wind_tunnel_at_fischamend_desc:0 "A closed-circuit tunnel and a laboratory, built because the establishment has lost too many machines finding out by flying them what a model would have said in an afternoon."

 AUHDNC_air_the_wind_tunnel_at_fischamend_2:0 "The Wind Tunnel at Fischamend"

 AUHDNC_air_the_first_military_pilots:0 "The First Military Pilots"
 AUHDNC_air_the_first_military_pilots_desc:0 "Officers seconded from the cavalry and the engineers, taught to fly at Wiener Neustadt at their own risk and their own expense. In 1914 these few dozen are the whole flying service."

 AUHDNC_air_a_flying_troop_for_1914:0 "A Flying Troop for 1914"
 AUHDNC_air_a_flying_troop_for_1914_desc:0 "The Luftfahrtruppen: an arm with its own pilots, its own depots and its own line in the common estimate, in time for the war. It is bought out of the artillery estimate."

###############################################################################################################################
# The ideas of lot L7a. The focus gives, the idea charges: every block below carries its gain and
# its price in the same modifier.
###############################################################################################################################

# --- the common market and the tariff ----------------------------------------------------------

 AUH_eco_the_common_market_of_1867:0 "The Common Market of 1867"
 AUH_eco_the_common_market_of_1867_desc:0 "One customs territory, renewed in 1878, 1887 and 1897, and due to expire on the last day of 1907. A treaty argued through two parliaments before every renewal."

 AUH_eco_the_autonomous_tariff:0 "The Autonomous Tariff"
 AUH_eco_the_autonomous_tariff_desc:0 "Duties set by Vienna and Budapest alone, high on grain and on cattle. The countryside is content at last; the Bohemian exporters lose the markets they live on."

 AUH_eco_the_commercial_treaties:0 "The Commercial Treaties"
 AUH_eco_the_commercial_treaties_desc:0 "The treaties of 1905 and 1906 with Germany, Italy and Switzerland. The tariff becomes a bargaining floor instead of a wall, and grain prices fall."

 AUH_eco_the_quota_deputations:0 "The Quota Deputations"
 AUH_eco_the_quota_deputations_desc:0 "Sixty men from each parliament, sitting apart, deciding what share of the common expenditure Hungary carries. They have never yet reduced it."

 AUH_eco_the_veterinary_frontier:0 "The Veterinary Frontier"
 AUH_eco_the_veterinary_frontier_desc:0 "The frontier closed to Balkan livestock on a veterinary certificate. A tariff nobody has to vote, and every government from Belgrade to Bucharest knows what it is for."

 AUH_eco_the_home_market:0 "The Home Market"
 AUH_eco_the_home_market_desc:0 "Fifty millions who buy from each other and from nobody else. The mills run full, up to the day the Monarchy needs something it does not make."

 AUH_eco_the_oriental_markets:0 "The Oriental Markets"
 AUH_eco_the_oriental_markets_desc:0 "The Balkan and Levantine outlets, worked by consuls who are half salesmen. Profitable, and it ties us to provinces of the Sultan that are about to stop being his."

# --- the railways, the river and the ports -----------------------------------------------------

 AUH_eco_the_alpine_breakthroughs:0 "The Alpine Breakthroughs"
 AUH_eco_the_alpine_breakthroughs_desc:0 "The Tauern, the Karawanken and the Wochein. They give Trieste a second line and break a monopoly, and they are paid for out of paper Bohemia was promised first."

 AUH_eco_the_waterways_administration:0 "The Waterways Administration"
 AUH_eco_the_waterways_administration_desc:0 "The river runs from Bavaria to the Black Sea at a fraction of what a tunnel costs. It also runs where the mountains are not, and the Adriatic yards will not see the money."

 AUH_eco_the_state_railways:0 "The State Railways"
 AUH_eco_the_state_railways_desc:0 "The imperial and royal state railways, bought line by line since the eighties, and asked to carry freight at rates the diets fix rather than the traffic."

 AUH_eco_the_sudbahn_bought_out:0 "The Suedbahn Bought Out"
 AUH_eco_the_sudbahn_bought_out_desc:0 "The Vienna-Trieste artery is in one hand at last and the southern valleys get their roadbed. A bankrupt company's paper is now on the state's books, and the consumer carries the interest."

 AUH_eco_the_sudbahn_left_private:0 "The Suedbahn Left Private"
 AUH_eco_the_sudbahn_left_private_desc:0 "No purchase price and no new debt. The one line to the sea stays with a company that cannot pay for its own sleepers: the budget is healthier and the track is not."

 AUH_eco_the_two_seaports:0 "The Two Seaports"
 AUH_eco_the_two_seaports_desc:0 "Two harbours on one short coast, out of a single purse. Whatever is spent on the one is refused to the other, and both halves keep the account."

 AUH_eco_the_free_port_of_trieste:0 "The Free Port of Trieste"
 AUH_eco_the_free_port_of_trieste_desc:0 "The free port, the Franz Joseph basin, and the whole Austrian half of the Monarchy's seaborne trade. Budapest pays a third of it under the Quota, and says so at every renewal."

 AUH_eco_the_hungarian_sea:0 "The Hungarian Sea"
 AUH_eco_the_hungarian_sea_desc:0 "Fiume. Budapest fixes its railway tariffs so that grain travels past Trieste to a harbour it owns outright, and the Austrian half watches its trade routed around it."

 AUH_eco_the_emigrant_traffic:0 "The Emigrant Traffic"
 AUH_eco_the_emigrant_traffic_desc:0 "A million and a half leave for America between 1899 and 1913, and the state takes a commission on every ticket. The men of military age do not come back."

 AUH_eco_the_alpine_current:0 "The Alpine Current"
 AUH_eco_the_alpine_current_desc:0 "Water falling through Tyrol and Carinthia, turned into traction and furnaces on credit taken against electricity not yet sold. The interest falls due on schedule."

# --- the bank, the debt and the money ----------------------------------------------------------

 AUH_eco_the_bank_of_two_capitals:0 "The Bank of Two Capitals"
 AUH_eco_the_bank_of_two_capitals_desc:0 "One institution, two head offices, one note. Credit is rationed by a board that has to agree with itself in two languages, and one of them would rather have a bank of its own."

 AUH_eco_the_crown_on_gold:0 "The Crown on Gold"
 AUH_eco_the_crown_on_gold_desc:0 "The crown of 1892, held to gold. Prices are steady and foreign paper is cheap, and the bank cannot print its way out of a bad harvest or a mobilisation."

 AUH_eco_the_debt_of_the_old_empire:0 "The Debt of the Old Empire"
 AUH_eco_the_debt_of_the_old_empire_desc:0 "The general debt contracted before 1867, to which Hungary pays a sum fixed when Hungary was poorer. The artillery estimate is always short by the difference."

 AUH_eco_the_common_estimates:0 "The Common Estimates"
 AUH_eco_the_common_estimates_desc:0 "Laid before the Delegations, who sit in two rooms and write to each other. Nothing is voted twice and nothing is voted quickly."

 AUH_eco_the_universal_banks:0 "The Universal Banks"
 AUH_eco_the_universal_banks_desc:0 "Creditanstalt, Bankverein, Laenderbank, Bodencreditanstalt. They do not lend to industry, they own it: a board seat for every advance, and industrial policy made on the Herrengasse."

 AUH_eco_the_capital_offensive:0 "The Capital Offensive"
 AUH_eco_the_capital_offensive_desc:0 "Vienna money in Belgrade, Sofia and Salonica: concessions, municipal loans, arsenals on credit. A creditor has a hold no customs war ever gave, and is the first to be expropriated."

 AUH_eco_capital_stays_at_home:0 "Capital Stays at Home"
 AUH_eco_capital_stays_at_home_desc:0 "The money stays inside the tariff wall: Galicia, the Karst, the Bukovina. The return is worse than Belgrade would have paid, and the provinces are quieter than in twenty years."

# --- the workshops of the common army ----------------------------------------------------------

 AUH_eco_the_common_army_orders:0 "The Orders of the Common Army"
 AUH_eco_the_common_army_orders_desc:0 "The ordnance contracts apportioned on the Quota, and therefore decided in a committee rather than on a proving ground. The guns are adequate; the argument is permanent."

 AUH_eco_the_ordnance_cartel:0 "The Ordnance Cartel"
 AUH_eco_the_ordnance_cartel_desc:0 "Skoda, Steyr and Witkowitz agree their prices and guarantee their capacity. The guns arrive on time; the bill is whatever the three of them say it is."

 AUH_eco_the_foreign_tender:0 "The Foreign Tender"
 AUH_eco_the_foreign_tender_desc:0 "Tenders opened to Krupp and to Schneider. The gunners get the best gun on the table; the Bohemian and Styrian works read about it in the newspaper."

 AUH_eco_the_thirty_and_a_half:0 "The Thirty and a Half"
 AUH_eco_the_thirty_and_a_half_desc:0 "The 30.5 cm siege mortar of 1909, road-transportable, and better than anything the other powers have. Five years of the artillery estimate go into forty guns."

# --- the two terminals of the common market ----------------------------------------------------

 AUH_eco_one_market_of_fifty_millions:0 "One Market of Fifty Millions"
 AUH_eco_one_market_of_fifty_millions_desc:0 "The union treated as a fact of the constitution rather than a contract with a term. The Magyar gentry is told, in law, that it signed away a country in 1867."

 AUH_eco_two_economies_under_one_crown:0 "Two Economies under One Crown"
 AUH_eco_two_economies_under_one_crown_desc:0 "Two customs territories that agree to raise no barrier between them: the settlement of 1907. Budapest is content, and the common market now has an expiry date on it."

# --- the aeronautical establishment ------------------------------------------------------------

 AUH_air_the_aeronautical_establishment:0 "The Aeronautical Establishment"
 AUH_air_the_aeronautical_establishment_desc:0 "The Military Aeronautical Establishment of 1893: captive balloons, a photographic section, and an annual estimate a battalion would refuse. Twenty men strong."

 AUH_air_the_airship_service:0 "The Airship Service"
 AUH_air_the_airship_service_desc:0 "Visible, expensive, admired at manoeuvres, and a target the size of a church. Every crown spent on the shed is a crown not spent on a wing."

 AUH_air_heavier_than_air:0 "Heavier than Air"
 AUH_air_heavier_than_air_desc:0 "Nothing to show the Delegations for four or five years, a great many broken machines, and after that everything."

 AUH_air_the_credits_refused:0 "The Credits Refused"
 AUH_air_the_credits_refused_desc:0 "The Delegations will not vote until the machine has flown, and it will not fly until the credits are voted. The officers learn more per crown than any air service in Europe."

 AUH_air_the_etrich_monoplane:0 "The Etrich Monoplane"
 AUH_air_the_etrich_monoplane_desc:0 "Igo Etrich's aeroplane, its wing copied from the seed of the Zanonia vine. Stable enough for an observer to draw a map in flight, and slow enough to be shot at."

 AUH_air_a_flying_troop:0 "A Flying Troop"
 AUH_air_a_flying_troop_desc:0 "An arm of the service with its own pilots and its own budget line, in time to be worth something in 1914. It is bought out of the artillery estimate."
