l_english:

 auh_alarm.1.t:0 "The [GetAUHAlarmPeople] Question Reopens"
 auh_alarm.1.d:0 "The governor reports that [GetAUHAlarmNation] no longer send their deputies to the common delegations as a matter of course. Petitions circulate in the district towns, the language of the schools is disputed again, and the provincial press prints what it pleases. Nothing has been lost in law. But the loyalty of the province is no longer something Vienna may simply assume, and the men who used to answer for it in the ministry are quietly asking to be posted elsewhere."
 auh_alarm.1.a:0 "Note it and read the next report."

 auh_alarm.2.t:0 "[GetAUHAlarmPeople] Deputies Withdraw"
 auh_alarm.2.d:0 "The deputies of [GetAUHAlarmNation] have walked out of the delegations and have given notice that they will not sit again. The empire keeps its garrisons there, its tax offices and its railways, but it no longer holds the province by right. The claim rests on occupation and on nothing else, and land held that way is held for exactly as long as troops stand on it."
 auh_alarm.2.a:0 "Then the army holds it."

 auh_alarm.3.t:0 "The [GetAUHAlarmPeople] Offices Stop Working"
 auh_alarm.3.d:0 "Orders sent down from the ministries are acknowledged, filed, and not carried out. Clerks, gendarmes and station masters among [GetAUHAlarmNation] take their instructions from the district committees now. Conscription lists go undrawn, requisitions go uncollected, and what comes back to Vienna is written to close the file rather than to describe the province."
 auh_alarm.3.a:0 "Vienna is answered with paper."

 auh_alarm.4.t:0 "Arms Found in the [GetAUHAlarmPeople] Districts"
 auh_alarm.4.d:0 "The gendarmerie has turned up rifles in church cellars and customs sheds, in numbers no smuggling case accounts for. The committees among [GetAUHAlarmNation] have set a date. The general staff puts a hundred and twenty days between this report and open revolt, after which the province will have to be taken back the way it was taken the first time."
 auh_alarm.4.a:0 "A hundred and twenty days, then."

 auh_alarm.5.t:0 "The [GetAUHAlarmPeople] Benches Fill Again"
 auh_alarm.5.d:0 "The deputies of [GetAUHAlarmNation] are back in the delegations, and the district committees have wound themselves up. The province is imperial territory in law once more and the gendarmerie can go back to counting cattle. What was conceded to bring them in stands on the books, and will be quoted at the next term."
 auh_alarm.5.a:0 "Enter it in the record."
