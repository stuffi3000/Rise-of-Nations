l_english:
 AUH1_tungsten_mines_desc:0 "Böhler's furnaces at Kapfenberg need wolfram for tool steel and most of it is bought abroad. The tin seams of the Bohemian Erzgebirge carry it too, if the ministry pays for deeper shafts."
 AUH1_planned_economy_desc:0 "The War Services Act of 1912 already lets the ministry conscript a factory and the men inside it. Wartime is when that machinery is finally used instead of argued over."
 AUH1_rations_desc:0 "Vienna issued bread cards in 1915 while Hungary kept its grain behind its own border. What the queues give up in flour, fat and copper comes back out of the shell works."
 AUH1_war_economy_desc:0 "Coal, labour and plant go under military direction, and the Reichsrat has been sent home since March 1914. There is nobody left in Vienna to vote the arrangement down."
 AUH1_liquidate_unprofital_business_desc:0 "Small workshops that cannot fill an army order are bought up and cleared out. Their sheds, their yards and their fitters go to firms that can, from Wiener Neustadt to Pilsen."
 AUH1_loosen_restrictions_desc:0 "A militarised factory is run by officers, and the man at the lathe cannot leave it for better pay. Ease the grip on labour and prices before a cut in the flour ration empties the workshops."
 AUH1_buy_out_dissident_farms_desc:0 "The great estates of the Hungarian plain feed the empire and pay little for the privilege. Buying out the loudest landlords is cheaper than arguing with them at every quota renewal."
 AUH1_armoured_cars_desc:0 "Paul Daimler built an armoured car at Wiener Neustadt in 1904; it was shown at the imperial manoeuvres and dropped after it frightened the cavalry's horses. The works can build more, and in numbers."
 AUH1_tanks_desc:0 "Oberleutnant Günther Burstyn drew a tracked, turreted Motorgeschütz in 1911 and the War Ministry filed it away. The drawings are still in Vienna, and Škoda could build from them."
 AUH1_independent_officers_desc:0 "An officer is given three years to learn the language of his own regiment. A captain who can talk to his company can be trusted to act on the ground in front of him instead of waiting on Vienna."
 AUH1_assault_rifle_desc:0 "Steyr can go further than the straight-pull Mannlicher. A short weapon that fires pistol rounds fast belongs to the man who has to cross the last hundred metres of open ground."
 AUH1_offensive_army_desc:0 "Conrad von Hötzendorf has argued for years that the attack decides and that waiting loses. Drill the army to move first, into Serbia or down out of the Trentino, and to keep moving."
 AUH1_decentralised_army_desc:0 "An army that gives its orders in German and fights in twelve languages cannot be run from a map table in Vienna. Push the decisions down to the men who speak to the troops."
 AUH1_improve_doctrine_desc:0 "The regulations still read like the drill books of 1866. Rewrite them around what Galicia and the Karst have shown about fire, ground and the price of a frontal rush."
 AUH1_endless_advance_desc:0 "Past the railhead everything moves at the pace of a horse team, and Galicia has few metalled roads. Bakeries, replacements and bridging columns pushed forward keep a beaten enemy from digging in overnight."
 AUH1_esprit_de_corps_desc:0 "Each regiment carries its own name and its own dead, from the Vienna Deutschmeister to the Tiroler Kaiserjäger and the Bosnian battalions in their fezzes. Men fight for that badge before the Monarchy."
 AUH1_auxilliary_corps_desc:0 "Pioneers, telephone sections and the Train that hauls everything else. The rifle battalions take the credit, but without these the Carpathians swallow a corps inside a week."
 AUH1_offensive_artillery_desc:0 "Škoda at Pilsen builds siege guns that foreign buyers order before the k.u.k. army does. Place the new patterns at home first, instead of reading about them in an export catalogue."
 AUH1_light_artillery_desc:0 "The 8 cm field gun has to keep up with infantry across Galician mud and Alpine track. Lighter carriages matter more to a battalion in the line than another siege mortar behind it."
 AUH1_standardise_designs_desc:0 "The common army, the Landwehr and the Honvéd each buy through a ministry of their own, so the depots carry three sets of patterns. One design, one gauge, and a shell fits whichever gun is nearest."
 AUH1_army_efforts_desc:0 "Franz Joseph's army had not fought a European war since 1866 and drilled as though none was coming. Longer manoeuvres, harsher umpiring, officers judged on how their men perform."
 AUH1_chemicals_desc:0 "The chemical works at Aussig on the Elbe and the university laboratories can be turned to the front. Gas suits the karst plateau, where it settles into the trenches instead of blowing away."
 AUH1_improve_gas_masks_desc:0 "A cloud does not care who released it, and the wind on the Isonzo turns twice a day. Filters, drill and spare masks down to the last Landsturm company holding the line."
 AUH1_military_academy_desc:0 "Maria Theresa founded the academy at Wiener Neustadt in 1751 to make officers out of gentlemen. Widen it, tie it to the Kriegsschule, and the staff is trained rather than inherited."
 AUH1_never_ending_barrage_desc:0 "Guns take the ground that infantry only occupies. Shells by the trainload, fire tables worked out in advance, and a battery that can keep firing for days rather than hours."
 AUH1_heavy_artillery_desc:0 "Škoda's 30.5 cm mortar travels by road and broke the Belgian forts in days in 1914. Build more of them, and concrete stops being an answer to anything."
 AUH1_streamlined_production_desc:0 "Skilled men are conscripted, then begged back from the front by the works that lost them. Fix the exemptions, stop changing the model every season, and let a shop finish what it began."
 AUH1_order_and_discipline_desc:0 "Regulations, roll-call and the field court. An army of eleven nationalities holds together on habit and on the oath sworn to the Emperor, and the sergeant enforces both."
 AUH1_no_antiquities_desc:0 "Landsturm companies still shoulder single-shot Werndls and black-powder Mannlichers from 1888. Clear the museum pieces out of the depots and put a modern rifle in every pair of hands."
 AUH1_defensive_army_desc:0 "Two fronts, eleven nationalities, and a common army budget that both delegations must vote before a crown is spent. Ground held cheaply is worth more to the Monarchy than ground taken at Conrad's price."
 AUH1_centralised_army_desc:0 "The common army answers to Vienna, the Landwehr and the Honvéd to ministries of their own. Pull the threads back to one desk in the Kriegsministerium and the orders stop contradicting."
 AUH1_better_doctrine_desc:0 "Fire beats courage, as the Boers proved at Colenso and the Russian trenches proved at Port Arthur. Rewrite the regulations around entrenchment, machine guns and a properly swept field of fire."
 AUH1_endless_defense_desc:0 "Every pass, river bend and rail junction from the Carpathians to the Julian Alps is surveyed, sited and dug before anyone crosses the frontier. Defence prepared early costs the least."
 AUH1_chain_of_command_desc:0 "An order from the Kriegsministerium should reach a company commander without passing through two capitals. Fewer links, written procedure, and a telephone line that is actually laid."
 AUH1_shovel_for_every_soldier_desc:0 "The Linnemann spade weighs under a kilogram and has saved more men than any breastplate. One per rifle, with wire cutters and picks for the limestone of the Karst."
 AUH1_dig_in_and_pray_desc:0 "Shelter trenches, dugouts roofed with rail iron, communication saps running to the rear. The men who dig at dusk are the ones still standing when the barrage lifts."
 AUH1_impenetrable_fortress_desc:0 "Przemyśl in Galicia is the largest fortress the empire owns and the Trentino works watch the Italian passes. Modern concrete and cupola guns, or they are expensive barracks."
 AUH1_daring_pilots_desc:0 "The Luftfahrtruppen take their volunteers from the cavalry, men used to going first and asking afterwards. Pay them properly, train them long, and let the best pick their machines."
 AUH1_british_fighters_desc:0 "Vienna's works cannot deliver fighting machines fast enough. Buy from firms abroad that already have engines and experience, and let Lohner's men take the crates apart on arrival."
 AUH1_high_altitude_training_desc:0 "Over the Alps a pilot loses his engine, his instruments and his judgement in that order. Oxygen sets, warm clothing, and hours flown high before a man is sent out on patrol."
 AUH1_own_fighters_desc:0 "Igo Etrich's Taube flew from Wiener Neustadt in 1910 and half of Europe copied the shape. Put a stronger engine and a gun in front of the pilot and the empire has its own fighter."
 AUH1_air_force_desc:0 "The Luftfahrtruppen began in 1912 with a handful of machines and a balloon company. Treat flying as a branch of the service with its own budget, or it stays a manoeuvre curiosity."
 AUH1_scout_planes_desc:0 "One machine over the enemy's rear tells a corps commander more in an hour than his cavalry manage in a day. Counting trains and roads comes first; guns can be fitted later."
 AUH1_build_airfields_desc:0 "Aircraft need level ground, a hangar out of the wind and a workshop within walking distance. Fischamend has all three; the capital still loses machines taxiing across ploughed fields."
 AUH1_anti_air_desc:0 "Škoda mounted a 7 cm balloon gun on a motor truck in 1909, before anyone was certain what it would shoot at. There is no doubt now, and every airfield wants a battery."
 AUH1_proper_doctrine_desc:0 "Scouting, artillery spotting, escort and bombing each want a different machine and a different squadron. Write it down before every front commander invents his own air force."
 AUH1_larger_bombs_desc:0 "An airship lifts a load no aeroplane will manage for years. Heavier cases and better fuses turn a nuisance raid into a threat to rail junctions, supply depots and the naval yards at Venice."
 AUH1_german_zeppelin_desc:0 "Count Zeppelin's sheds at Friedrichshafen sell what Fischamend cannot build. The empire has almost no airship arm, so buy the hulls from Germany and train the crews at home."
 AUH1_night_raids_desc:0 "Darkness costs accuracy and buys survival, and the searchlight crews below are slower than they believe. Compass courses, lit landing grounds and men who can navigate by river bends."
 AUH1_own_bombers_desc:0 "Bought machines arrive with the seller's conditions attached. Lohner in Vienna and the arsenal at Fischamend can build a two-seater that carries a useful load, once engines are found."
 AUH1_cheap_fleet_desc:0 "The Hungarian delegation votes the naval quota and grudges every crown of it. Small, quick hulls launched in numbers suit the Adriatic and the budget that has to pay for them."
 AUH1_dockyards_desc:0 "Pola has been the war harbour since the arsenal was begun there in 1856, with Cattaro watching the southern Adriatic. Slips, dry docks and coal sheds decide how long a fleet stays at sea, not its guns."
 AUH1_more_dockyards_desc:0 "Orders are split between the Stabilimento Tecnico at Trieste and Danubius at Fiume so that both halves of the Monarchy are paid. Enlarge both and the arrangement stops costing time."
 AUH1_battlecruisers_desc:0 "Heavy guns and high speed on a thin hull, the fashion Fisher set with the Invincible. In a closed sea the use of such a ship is to reach the Strait of Otranto before anyone shuts it."
 AUH1_expensive_fleet_desc:0 "A ship is kept twenty years and refitted twice in that time. Better armour, better boilers and Škoda's own guns cost more at the slip and far less at Pola, where repairs eat the quota."
 AUH1_patrol_boats_desc:0 "The Adriatic is narrow, mined and thick with islands. Torpedo craft and destroyers from the Danubius yard at Fiume work that coast where a battleship dare not steam at night."
 AUH1_escorts_desc:0 "Austrian Lloyd's steamers out of Trieste carry the empire's trade and much of its grain. Give them destroyers and listening gear, because one submarine can close a port without firing."
 AUH1_pride_of_the_fleet_desc:0 "Viribus Unitis went down the slip at Trieste in 1911 with twelve 30.5 cm guns in four triple turrets. A flagship is worth whatever the delegations will pay to feel like a great power."
 AUH1_new_navy_desc:0 "The fleet is a coastal force of ageing ironclads with no doctrine worth the name. Admiral Montecuccoli wants a squadron the powers must count, and that begins with crews, not hulls."
 AUH1_trade_desc:0 "Austrian Lloyd sails from Trieste and the Adria line from Fiume, both subsidised, both under the same flag abroad. More hulls of our own, and the empire stops renting its shipping."
 AUH1_coastal_defense_desc:0 "Batteries at Pola and around the Bocche di Cattaro, where the heights of Lovćen look straight down into the anchorage. Fixed works free the fleet to be somewhere useful."
 AUH1_new_cruisers_desc:0 "The Novara type, laid down at Fiume, is fast, thinly armoured and meant to lead torpedo flotillas. A scout that can outrun anything stronger is what a narrow sea rewards."
 AUH1_intercept_enemies_desc:0 "Whitehead built the first self-propelled torpedo at Fiume in 1866, yet the empire still buys its submarines abroad in pieces. They are cheap, and the Adriatic hides them well."
 AUH1_naval_academy_desc:0 "The Marine-Akademie has trained officers at Fiume since 1857 in navigation, gunnery and several languages. A fleet grows no faster than the men fit to be trusted with a bridge."
 AUH1_grandest_ships_desc:0 "The yards at Trieste laid down the first dreadnought at their own risk, before the delegations had voted a crown for it. Bigger hulls, thicker belts, heavier guns, and the bill later."
 AUH1_raider_doctrine_desc:0 "A fleet too small to force the Strait of Otranto can still make it dangerous. Submarines and fast raiders out of Cattaro, working against troopships rather than against battle lines."
 AUH1_new_admirality_desc:0 "The navy has no ministry of its own, only a section inside the War Ministry in Vienna. Give the fleet command a proper staff and it stops being an appendix to the army."
 AUH1_marine_infantry_desc:0 "Naval landing parties are scratch companies of sailors handed rifles. Trained battalions could take a Dalmatian island, or an Italian beach, and hold it until the army comes ashore."
 AUH1_old_doctrine_desc:0 "Tegetthoff broke the Italian line at Lissa in 1866 with steady nerve and a ram bow. The gun line still decides a battle, and every class of hull is built to take its place in it."
