 ############################################################################
 ### RON_QIN - Empire Qing (QIN), focus des cinq eres.
 ### Source : docs/nations/qing/02_SQUELETTE.md. 110 focus, 13 infobulles de porte.
 ### Fichier NOUVEAU : il n'ecrase rien. DNC_QIN_l_english.yml (498 cles) reste seul
 ### proprietaire des cles de l'arbre existant ; aucune cle n'est definie deux fois.
 ############################################################################

 ############################################################################
 ### ERE DNC - branche A, The Viceroys' Ledger
 ############################################################################
 DNC_QIN_the_ledger_of_the_viceroys:0 "The Ledger of the Viceroys"
 DNC_QIN_the_ledger_of_the_viceroys_desc:0 "The Empire has no national revenue service. Peking sets a quota, the viceroys remit what they see fit, and no one in the capital knows what a province actually holds. Before anything can be reformed, the book must be opened."
 DNC_QIN_the_ledger_of_the_viceroys_tt:0 "Opens the second reading of the provincial map: the ledger of obedience, province by province. The centralisation balance of power stops being a counter of its own and becomes the weighted average of that book."
 DNC_QIN_confirm_the_southern_viceroys:0 "Confirm the Southern Viceroys"
 DNC_QIN_confirm_the_southern_viceroys_desc:0 "Liu Kunyi, Zhang Zhidong, Li Hongzhang and Yuan Shikai declared the war edict of June 1900 void and signed the Mutual Protection Pact of the South-East. Confirming them keeps the South in the Empire. It also concedes, in public, that an imperial edict is a suggestion."
 DNC_QIN_confirm_the_southern_viceroys_tt:0 "Ledger: plus 15 in the eight southern provinces. Manchu Ascendancy: minus 20. Places the permanent idea An Edict Without Force - no province may rise above the Arrears step while the pact stands."
 DNC_QIN_recall_the_southern_viceroys:0 "Recall the Southern Viceroys"
 DNC_QIN_recall_the_southern_viceroys_desc:0 "Li Hongzhang answered that this order was an order of chaos and that Kwangtung would not obey. Dismissing the four restores the edict's force and empties it of servants at the same instant."
 DNC_QIN_recall_the_southern_viceroys_tt:0 "Manchu Ascendancy: plus 25. Ledger: minus 30 in the eight southern provinces, which fall to the Mutual Protection step. Civil war is possible from the first winter."
 DNC_QIN_the_quota_of_twenty_one_million:0 "The Quota of Twenty-One Million"
 DNC_QIN_the_quota_of_twenty_one_million_desc:0 "The Boxer Protocol laid 450 million taels on China, some 982 million with four percent over thirty-nine years. Peking does not pay it. Peking apportions more than 21.21 million taels a year across the provinces and the customs houses."
 DNC_QIN_the_quota_of_twenty_one_million_tt:0 "Unlocks the repeatable decision Apportion the Indemnity. Installs the monthly ledger decay in every province. Bypassed if the Protocol was never signed."
 DNC_QIN_raise_the_land_tax:0 "Raise the Land Tax"
 DNC_QIN_raise_the_land_tax_desc:0 "From 1901 to 1911 the land tax was raised step by step, by some 18 million taels, on an assessment that had not moved in a century. It is the most reliable revenue in the Empire and the most resented."
 DNC_QIN_raise_the_land_tax_tt:0 "Consumer goods: minus 10 percent. Ledger: minus 15 in every agrarian province, cumulative at each further step."
 DNC_QIN_farm_the_salt_gabelle:0 "Farm the Salt Gabelle"
 DNC_QIN_farm_the_salt_gabelle_desc:0 "The gabelle was pledged to the Protocol. Farming it out brings cash today and mortgages the revenue for the whole game."
 DNC_QIN_farm_the_salt_gabelle_tt:0 "Immediate treasury, no ledger cost. The gabelle is pledged for the rest of the game: plus one level of foreign influence on the Yangtze zones, and Redeem the Gabelle will cost three years of central revenue."
 DNC_QIN_a_ministry_of_revenue:0 "A Ministry of Revenue"
 DNC_QIN_a_ministry_of_revenue_desc:0 "The Duzhibu of 1906 gave the Empire its first national budget, and gave the provincial treasuries their first reason to resist openly."
 DNC_QIN_a_ministry_of_revenue_tt:0 "Plus 25 percent to every ledger gain bought on the central treasury. Ledger: minus 10 everywhere for one year while the provincial treasuries resist."
 DNC_QIN_one_coin_for_the_empire:0 "One Coin for the Empire"
 DNC_QIN_one_coin_for_the_empire_desc:0 "Some twenty provincial mints struck coin that would not pass a hundred miles from where it was made. The currency regulation of 1910 tried to end that."
 DNC_QIN_one_coin_for_the_empire_tt:0 "Factory output: plus 10 percent. Economic decisions: minus 15 percent cost. Ledger: minus 10 in every province whose mint closes."
 DNC_QIN_let_the_provinces_coin:0 "Let the Provinces Coin"
 DNC_QIN_let_the_provinces_coin_desc:0 "Leave the mints where they are. The provinces remit more willingly to a court that does not touch their presses."
 DNC_QIN_let_the_provinces_coin_tt:0 "Ledger: plus 10 everywhere. Permanent idea Twenty Mints, Twenty Currencies for the whole game, including after 1928: minus 15 percent factory output and minus 0.10 political power per day."
 DNC_QIN_the_census_of_the_realm:0 "The Census of the Realm"
 DNC_QIN_the_census_of_the_realm_desc:0 "The census of 1909 to 1911 counted some 410 million subjects. For the first time the court knows the size of what it cannot govern."
 DNC_QIN_the_census_of_the_realm_tt:0 "The ledger becomes readable as an exact value instead of a band. Recruitable population: plus 5 percent."

 ############################################################################
 ### ERE DNC - branche B, The New Policies
 ############################################################################
 DNC_QIN_the_xian_edict:0 "The Edict from Xi'an"
 DNC_QIN_the_xian_edict_desc:0 "On 29 January 1901, from her refuge at Xi'an, the woman who had strangled the Hundred Days of 1898 promulgated the programme of her victims. The New Policies begin in flight."
 DNC_QIN_the_xian_edict_tt:0 "Opens the whole xinzheng branch."
 DNC_QIN_the_five_ministers_abroad:0 "Five Ministers Go Abroad"
 DNC_QIN_the_five_ministers_abroad_desc:0 "The constitutional mission of 1905 and 1906 sent five ministers to study the parliaments of Japan, Germany, Britain and the United States, and brought back a calendar."
 DNC_QIN_the_five_ministers_abroad_tt:0 "Opens the constitutional calendar. Makes Duanfang and Zaize recruitable. Political research speed: plus 10 percent."
 DNC_QIN_abolish_the_examinations:0 "Abolish the Examinations"
 DNC_QIN_abolish_the_examinations_desc:0 "On 2 September 1905, on the joint memorial of Zhang Zhidong and Yuan Shikai, the examinations were abolished at every degree. In one edict the dynasty closed the only channel by which the lettered elite became its officials."
 DNC_QIN_abolish_the_examinations_tt:0 "Research speed: plus 10 percent. Opens the whole school and administration chain. Ledger: minus 10 in the six high-gentry provinces, and the idea A Generation Without a Ladder - monthly revolutionary support proportional to that number, with no ceiling."
 DNC_QIN_keep_the_ladder:0 "Keep the Ladder"
 DNC_QIN_keep_the_ladder_desc:0 "The conservative party at court held that the ladder was the dynasty's only rope to the provinces. They were not wrong. They were merely arguing for a rope to nowhere."
 DNC_QIN_keep_the_ladder_tt:0 "The ledger holds in the lettered provinces and no student wave forms. The education branch is closed for the whole game, research is permanently minus 10 percent, and the New Army is capped at twelve divisions for want of officers."
 DNC_QIN_the_ministry_of_education:0 "A Ministry of Education"
 DNC_QIN_the_ministry_of_education_desc:0 "The Xuebu was created in 1905 to build, in a decade, the school system the examinations had made unnecessary for a thousand years."
 DNC_QIN_the_ministry_of_education_tt:0 "Plus one research slot. Modern schools become constructible. Ledger: plus 5 in every province with a normal school."
 DNC_QIN_students_to_tokyo:0 "Students to Tokyo"
 DNC_QIN_students_to_tokyo_desc:0 "Several thousand Chinese students were in Japan by 1906. The Tongmenghui had been founded in Tokyo in 1905, and it recruited in the same lecture halls."
 DNC_QIN_students_to_tokyo_tt:0 "Research speed: plus 15 percent, and quickly. Revolutionary support: plus 0.3 percent per month, with no ceiling."
 DNC_QIN_students_to_the_west:0 "Students to the West"
 DNC_QIN_students_to_the_west_desc:0 "The American remission of part of the indemnity in 1908 paid for scholarships and for Tsinghua College. Slower, dearer, and it does not train the men who will overthrow you."
 DNC_QIN_students_to_the_west_tt:0 "Research speed: plus 8 percent only, and no revolutionary support at all. American opinion: plus 15."
 DNC_QIN_a_police_for_the_cities:0 "A Police for the Cities"
 DNC_QIN_a_police_for_the_cities_desc:0 "The Baoding police school opened in 1902, the Ministry of Police in 1905. The Empire acquires, for the first time, a civil force that is not an army."
 DNC_QIN_a_police_for_the_cities_tt:0 "Effect of unrest modifiers: minus 25 percent. Ledger: minus 8 in every province that pays its constables."
 DNC_QIN_the_new_criminal_code:0 "The New Criminal Code"
 DNC_QIN_the_new_criminal_code_desc:0 "Shen Jiaben's legal reform, from 1902 to 1910, rewrote the code with one audience in mind: the powers who justified extraterritoriality by the state of Chinese law."
 DNC_QIN_the_new_criminal_code_tt:0 "Opinion: plus 10 with three powers. First milestone of the claim against extraterritoriality. Attaches the orphaned focus on the homosexuality law to this chain."
 DNC_QIN_the_ten_year_opium_plan:0 "Ten Years to End the Pipe"
 DNC_QIN_the_ten_year_opium_plan_desc:0 "The edict of 20 September 1906 and the instructions of 1 November set a ten-year plan: smokers registered and licensed, dens closed within six months, officials to quit first."
 DNC_QIN_the_ten_year_opium_plan_tt:0 "Removes the first level of the opium addictions idea. Minus one civilian factory: the opium revenue goes with the dens."
 DNC_QIN_close_the_dens:0 "Close the Dens"
 DNC_QIN_close_the_dens_desc:0 "The officials quit first, as ordered, and the south-western growers discover what the edict means for them."
 DNC_QIN_close_the_dens_tt:0 "Removes the second level of the opium addictions idea. Minus one civilian factory, and ledger minus 10 in the south-western growing provinces."
 DNC_QIN_the_anglo_chinese_accord:0 "The Anglo-Chinese Accord"
 DNC_QIN_the_anglo_chinese_accord_desc:0 "The accords of 1907 and 1911 tied the fall of Indian exports to the fall of Chinese production. It is the one negotiation of the decade China did not lose."
 DNC_QIN_the_anglo_chinese_accord_tt:0 "Removes the last level of the opium addictions idea. British opinion: plus 25. Minus one civilian factory in three provinces, permanently."
 DNC_QIN_the_principles_of_the_constitution:0 "The Principles of the Constitution"
 DNC_QIN_the_principles_of_the_constitution_desc:0 "The Qinding Xianfa Dagang of 27 August 1908 published a nine-year plan and promised a parliament for 1917. Nine years is a long time to a class that has just been taxed."
 DNC_QIN_the_principles_of_the_constitution_tt:0 "Ledger: plus 10 in every province preparing an assembly."
 DNC_QIN_the_provincial_assemblies:0 "The Provincial Assemblies"
 DNC_QIN_the_provincial_assemblies_desc:0 "From February to June 1909, twenty-one provinces elected assemblies on some 1.7 million registered voters out of some 410 million subjects. The dynasty has just given a legal, elected, provincial platform to the class it taxes."
 DNC_QIN_the_provincial_assemblies_tt:0 "Ledger: plus 15 in the twenty-one provinces concerned. Zhang Jian becomes recruitable. Every assembly is a ready-made organ of secession: that province's ledger losses are increased by 25 percent."

 ############################################################################
 ### ERE DNC - branche C, The Thirty-Six Divisions
 ############################################################################
 DNC_QIN_the_thirty_six_divisions:0 "The Thirty-Six Divisions"
 DNC_QIN_the_thirty_six_divisions_desc:0 "The national programme called for thirty-six divisions of New Army. They are raised, paid and officered by the provinces. The Empire is building a modern army in which every unit has a local patron."
 DNC_QIN_the_thirty_six_divisions_tt:0 "Unlocks the repeatable decision Raise a New Army Division: each division gives a modern template and takes 8 ledger points from the province that pays for it. Capped at twelve divisions if the ladder was kept."
 DNC_QIN_the_six_divisions_of_beiyang:0 "The Six Divisions of Beiyang"
 DNC_QIN_the_six_divisions_of_beiyang_desc:0 "Yuan Shikai took Beiyang from some 20,000 men in 1900 to six divisions in 1905 and some 60,000 men by 1907. It is the best army in China and it answers to a name, not to a ministry."
 DNC_QIN_the_six_divisions_of_beiyang_tt:0 "Six divisions at plus 15 percent organisation and training. The Army Has One Master: plus 10 per division raised under this regime."
 DNC_QIN_a_division_in_every_province:0 "A Division in Every Province"
 DNC_QIN_a_division_in_every_province_desc:0 "Some 200,000 New Army troops stood in 1911, spread across the Empire. No strong man can emerge from an army that has eighteen paymasters."
 DNC_QIN_a_division_in_every_province_tt:0 "The Army Has One Master is capped at 30. Any division raised in a province that has fallen to the Retained Revenue step leaves the central army and follows its governor."
 DNC_QIN_the_officer_corps:0 "An Officer Corps"
 DNC_QIN_the_officer_corps_desc:0 "The Baoding academy, from 1902 to 1912, produced the officers of the New Army - and, in due course, the officers of every clique that would divide it."
 DNC_QIN_the_officer_corps_tt:0 "Plus one military advisor slot. Reinforces the existing Baoding military academy idea. Without the examinations abolished there is no pool to draw on and the twelve-division cap applies. Bypassed if Baoding is already at its highest level."
 DNC_QIN_the_army_ministry:0 "A Ministry of the Army"
 DNC_QIN_the_army_ministry_desc:0 "The Lujunbu was created in 1906 with Tieliang at its head. The ministry is Manchu, and the army knows it."
 DNC_QIN_the_army_ministry_tt:0 "Two Beiyang divisions pass under ministry command. The Army Has One Master: minus 15. Manchu Ascendancy: plus 12."
 DNC_QIN_the_manchu_commander:0 "The Manchu Commander"
 DNC_QIN_the_manchu_commander_desc:0 "Yinchang, a Manchu minister, commands Beiyang in name. The officers salute him and write to Honan."
 DNC_QIN_the_manchu_commander_tt:0 "The Army Has One Master: minus 20. Yinchang becomes recruitable as a field marshal. Manchu Ascendancy: plus 15, and minus 20 percent organisation on the six divisions until Yuan is recalled."
 DNC_QIN_the_army_obeys_its_general:0 "The Army Obeys Its General"
 DNC_QIN_the_army_obeys_its_general_desc:0 "The Beiyang officers obey Yuan by personal loyalty, not by the ministry's hierarchy. It is the only operational army in China, and it is not the state's."
 DNC_QIN_the_army_obeys_its_general_tt:0 "Full organisation, officers in place. The Army Has One Master: plus 15, and the counter no longer falls except by a purge."
 DNC_QIN_one_rifle_for_the_empire:0 "One Rifle for the Empire"
 DNC_QIN_one_rifle_for_the_empire_desc:0 "Hanyang and Kiangnan produced little and produced it differently. One calibre for the Empire is a smaller ambition than thirty-six divisions and a harder one."
 DNC_QIN_one_rifle_for_the_empire_tt:0 "Infantry equipment production: plus 10 percent, unified supply. Minus 25 percent of the existing stock for one year as the old calibres are withdrawn."

 ############################################################################
 ### ERE DNC - branche D, The Indemnity and the Rails
 ############################################################################
 DNC_QIN_thirty_nine_years_at_four_percent:0 "Thirty-Nine Years at Four Percent"
 DNC_QIN_thirty_nine_years_at_four_percent_desc:0 "450 million taels, one for every subject - the humiliation was in the arithmetic - carried to some 982 million at four percent over thirty-nine years, and pledged on the customs, the transit taxes and the salt."
 DNC_QIN_thirty_nine_years_at_four_percent_tt:0 "Makes the Protocol schedule and its remaining balance visible. Idea The Indemnity Service: a fixed monthly levy in political power and civilian factories until the debt is extinguished. Bypassed if divergence 1 avoided the Protocol."
 DNC_QIN_the_maritime_customs:0 "The Maritime Customs"
 DNC_QIN_the_maritime_customs_desc:0 "The Maritime Customs Service is administered by foreigners, it is honest, it works, and it serves the debt before it serves the Empire. It is the only fiscal institution in China that functions."
 DNC_QIN_the_maritime_customs_tt:0 "Regular and reliable revenue. One permanent level of the foreign concessions idea, and the pledged share is levied before any budget."
 DNC_QIN_recover_the_railway_rights:0 "Recover the Railway Rights"
 DNC_QIN_recover_the_railway_rights_desc:0 "From 1905 the provincial gentry raised subscriptions to buy back the railway concessions from the foreigners. That capital is patriotic. In 1911 it will be the detonator."
 DNC_QIN_recover_the_railway_rights_tt:0 "Infrastructure: plus 2 in five provinces. Ledger: plus 15 in the subscribing provinces. Installs the state idea Gentry Shareholders in Szechwan, Hunan, Hupeh and Kwangtung - those four will lose 25 ledger points on the day of any nationalisation."
 DNC_QIN_borrow_from_the_consortium:0 "Borrow from the Consortium"
 DNC_QIN_borrow_from_the_consortium_desc:0 "The four-power consortium will build the lines faster and cheaper than any subscription. The lines will not belong to the country they cross."
 DNC_QIN_borrow_from_the_consortium_tt:0 "No Gentry Shareholders, therefore no detonator in 1911. Plus one level of foreign influence on three zones, and ledger minus 10 everywhere."
 DNC_QIN_the_hanyehping_combine:0 "The Hanyehping Combine"
 DNC_QIN_the_hanyehping_combine_desc:0 "Hanyang, Daye and Pingxiang were incorporated as one company in 1908 under Sheng Xuanhuai: iron, coal and steel under a single direction, the nearest thing China has to heavy industry."
 DNC_QIN_the_hanyehping_combine_tt:0 "Plus two military factories in Hupeh."
 DNC_QIN_the_imperial_bank:0 "The Imperial Bank"
 DNC_QIN_the_imperial_bank_desc:0 "The Bank of the Great Qing, 1905 and again 1908. Central credit exists at last, and every provincial bank that closes to make room takes a governor's goodwill with it."
 DNC_QIN_the_imperial_bank_tt:0 "Economic decision cost: minus 25 percent. Ledger: minus 10 in every province whose official bank closes."
 DNC_QIN_the_provincial_banks:0 "The Provincial Banks"
 DNC_QIN_the_provincial_banks_desc:0 "Leave the provincial banks their note issue. They will remit more, and the Empire will never have a lender."
 DNC_QIN_the_provincial_banks_tt:0 "Ledger: plus 10 everywhere. No central credit for the whole game: plus 50 percent cost on every economic decision, including after 1930."
 DNC_QIN_the_ever_normal_granaries:0 "The Ever-Normal Granaries"
 DNC_QIN_the_ever_normal_granaries_desc:0 "The state granary system is ruined and the Huai floods of 1906 and 1907 proved it. Heaven does not withdraw its mandate from a house that feeds people."
 DNC_QIN_the_ever_normal_granaries_tt:0 "Ledger: plus 10 in the stricken provinces. Minus two civilian factories - the granaries are refilled in cash."
 DNC_QIN_the_yellow_river_works:0 "The Yellow River Works"
 DNC_QIN_the_yellow_river_works_desc:0 "Control of the water has been the condition of the mandate for three thousand years. It is also the single most expensive thing the Empire can attempt."
 DNC_QIN_the_yellow_river_works_tt:0 "Ledger: plus 10 in Honan, Shantung and Chihli, and the flood event stops striking there. Minus three civilian factories for the duration of the works."

 ############################################################################
 ### ERE DNC - branche E, The Constitutionalists
 ############################################################################
 DNC_QIN_the_emperor_on_the_ocean_terrace:0 "The Emperor on the Ocean Terrace"
 DNC_QIN_the_emperor_on_the_ocean_terrace_desc:0 "Guangxu has been confined on the island of Yingtai since 1898. He is alive, he is twenty-nine, and every reformist in exile writes in his name."
 DNC_QIN_the_emperor_on_the_ocean_terrace_tt:0 "Opens the question of the restoration. Makes Kang Youwei and Liang Qichao visible as exiles."
 DNC_QIN_the_zilijun_on_the_yangtze:0 "The Army of Independence"
 DNC_QIN_the_zilijun_on_the_yangtze_desc:0 "Tang Caichang raised the Zilijun on the Yangtze in August 1900 with Hunanese and Hupeh volunteers and Baohuanghui money, to remove Cixi and restore Guangxu as a constitutional monarch."
 DNC_QIN_the_zilijun_on_the_yangtze_tt:0 "Cixi set aside, Guangxu restored, the Hundred Days resumed fifteen years early. The Manchu conservatives and the Banners rise in the North - immediate civil war - and Zhang Zhidong must be bought with a viceroyalty or fought."
 DNC_QIN_execute_the_conspirators:0 "Execute the Conspirators"
 DNC_QIN_execute_the_conspirators_desc:0 "Tang Caichang was taken at Hankow on 21 August 1900 and beheaded at Wuchang on the 23rd, on Zhang Zhidong's order. A reforming viceroy executed the reformers, and the court paid him in obedience."
 DNC_QIN_execute_the_conspirators_tt:0 "Ledger: plus 20 in Hupeh and Hunan. The reformist branch stays shut for ten years, and this focus sets a flag that branch E reads until 1911."
 DNC_QIN_recall_kang_and_liang:0 "Recall Kang and Liang"
 DNC_QIN_recall_kang_and_liang_desc:0 "Kang Youwei and Liang Qichao have spent two years in exile building a movement to protect an emperor who cannot leave his island. Recalling them ends one problem and opens another."
 DNC_QIN_recall_kang_and_liang_tt:0 "Research speed: plus 10 percent. The conservative party leaves the court: ledger minus 25 in Manchuria and Chihli."
 DNC_QIN_the_society_to_protect_the_emperor:0 "The Society to Protect the Emperor"
 DNC_QIN_the_society_to_protect_the_emperor_desc:0 "The Baohuanghui was financed from the Nanyang and from America. Overseas remittances are the one revenue in this dossier that no viceroy stands between."
 DNC_QIN_the_society_to_protect_the_emperor_tt:0 "Civilian factory output: plus 5 percent."
 DNC_QIN_a_constitution_in_five_years:0 "A Constitution in Five Years"
 DNC_QIN_a_constitution_in_five_years_desc:0 "Nine years becomes five. A parliament by 1906 is possible, and the throne loses the power to legislate by edict on the same day."
 DNC_QIN_a_constitution_in_five_years_tt:0 "Ledger: plus 20 everywhere. The throne can no longer legislate by edict: every political decision costs plus 50 percent political power."
 DNC_QIN_the_gentry_of_the_provinces:0 "The Gentry of the Provinces"
 DNC_QIN_the_gentry_of_the_provinces_desc:0 "The constitutional study societies from 1906, and Zhang Jian at their head, are the most loyal opposition any Chinese dynasty ever had. They ask only to be governed lawfully."
 DNC_QIN_the_gentry_of_the_provinces_tt:0 "Zhang Jian becomes recruitable. Ledger: plus 10 in the provinces preparing an assembly."
 DNC_QIN_the_chambers_of_commerce:0 "The Chambers of Commerce"
 DNC_QIN_the_chambers_of_commerce_desc:0 "The company law of 1904 and the chambers of commerce turned a merchant class into a political force. A political force can also stop buying."
 DNC_QIN_the_chambers_of_commerce_tt:0 "Civilian factory output: plus 10 percent. The merchants can now boycott, and this focus arms the event that follows."
 DNC_QIN_the_american_boycott:0 "The Boycott Runs Its Course"
 DNC_QIN_the_american_boycott_desc:0 "The Shanghai chamber of commerce launched the anti-American boycott on 10 May 1905 against the renewal of Chinese exclusion. It was the first mass nationalist mobilisation in Chinese history, and the court let it run."
 DNC_QIN_the_american_boycott_tt:0 "Ledger: plus 10 in the coastal provinces - the court let the country speak. American opinion: minus 40, and minus 10 percent trade for two years."
 DNC_QIN_suppress_the_boycott:0 "Suppress the Boycott"
 DNC_QIN_suppress_the_boycott_desc:0 "The court broke the boycott in late August 1905. The merchants learned that the dynasty was afraid of them, which is a thing no dynasty should teach."
 DNC_QIN_suppress_the_boycott_tt:0 "American opinion: plus 15, trade preserved. Ledger: minus 15 in the coastal provinces, and ledger losses there are increased by 10 percent for the rest of the game."
 DNC_QIN_a_local_self_government:0 "Local Self-Government"
 DNC_QIN_a_local_self_government_desc:0 "The self-government regulations of 1908 and 1909 created elected councils in townships and boroughs. Every one of them is a school of administration, and a school of secession."
 DNC_QIN_a_local_self_government_tt:0 "Ledger: plus 15 everywhere. Idea Self-Government Bureaux: ledger gains are increased by 25 percent, and so are ledger losses."
 DNC_QIN_the_new_press:0 "The New Press"
 DNC_QIN_the_new_press_desc:0 "The press regulation of 1906 licensed newspapers instead of banning them. A licensed paper is easier to read than a clandestine one, and harder to close."
 DNC_QIN_the_new_press_tt:0 "Research speed: plus 10 percent. Feeds the existing republican journalism idea. Revolutionary support: plus 0.2 percent per month in the provinces with a press."

 ############################################################################
 ### ERE WW1 - infobulles de porte inter-eres
 ############################################################################
 WW1_QIN_gate_the_census_of_the_realm_tt:0 "The realm has been counted: the ledger is readable in exact values."
 WW1_QIN_gate_the_provincial_assemblies_tt:0 "The provincial assemblies have been elected."
 WW1_QIN_gate_one_rifle_for_the_empire_tt:0 "The arsenals have been standardised on one rifle."
 WW1_QIN_gate_the_rails_tt:0 "The river works are done, or the railway rights have been bought back by the provinces."
 WW1_QIN_gate_a_local_self_government_tt:0 "Local self-government has been established."
 WW1_QIN_gate_the_hongxian_mandate_tt:0 "The throne is vacant and one man holds the army: Yuan Shikai has taken it, or the Beiyang divisions were left to obey their general."
 WW1_QIN_gate_the_pigtailed_army_tt:0 "The Army Has One Master stands below 25 - no strong man has emerged - and the throne has not been renounced."

 ############################################################################
 ### ERE WW1 - branche A, The Viceroys' Ledger
 ############################################################################
 WW1_QIN_the_tax_the_assembly_voted:0 "The Tax the Assembly Voted"
 WW1_QIN_the_tax_the_assembly_voted_desc:0 "A tax an assembly has voted is a tax a province will pay. It is also a tax an assembly can refuse."
 WW1_QIN_the_tax_the_assembly_voted_tt:0 "Ledger gains are doubled in every province that has an assembly. Every quota rise now goes through a scripted vote whose outcome reads the average ledger: below 50, the vote fails."
 WW1_QIN_the_tax_the_court_decreed:0 "The Tax the Court Decreed"
 WW1_QIN_the_tax_the_court_decreed_desc:0 "The court concedes the calendar and never the substance. Quotas are raised by edict, as they always have been."
 WW1_QIN_the_tax_the_court_decreed_tt:0 "Full fiscal freedom is kept. Arms the Petition Rejected counter, three steps; at the third, taking The Cabinet of Princes is immediately fatal."
 WW1_QIN_the_customs_are_not_ours:0 "The Customs Are Not Ours"
 WW1_QIN_the_customs_are_not_ours_desc:0 "The Maritime Customs are administered by foreigners and pledged to the debt. Every government in Peking until 1943 will begin its budget with a subtraction it did not make."
 WW1_QIN_the_customs_are_not_ours_tt:0 "Idea The Customs Are Not Ours: a fixed share of customs revenue is levied before any budget, and the levy is permanently visible. Opens the recovery chain that ends in 1943."
 WW1_QIN_abolish_the_likin:0 "Abolish the Likin"
 WW1_QIN_abolish_the_likin_desc:0 "Abolition of the likin was promised at every tariff negotiation from 1902 onward and never carried out, because the transit barriers are what the governors live on."
 WW1_QIN_abolish_the_likin_tt:0 "Ledger: plus 15 in the merchant provinces. Trade efficiency: plus 25 percent. Minus 0.20 political power per day and minus 20 percent resource revenue, permanently."
 WW1_QIN_the_likin_kept:0 "The Likin Is Kept"
 WW1_QIN_the_likin_kept_desc:0 "Keep the barriers. The provinces will have a revenue the centre never sees, which is exactly how the clique era will be financed."
 WW1_QIN_the_likin_kept_tt:0 "Plus one civilian factory in four provinces. Ledger: minus 10 everywhere, and the Arrears ceiling applies to every province with a likin barrier."
 WW1_QIN_redeem_the_gabelle:0 "Redeem the Gabelle"
 WW1_QIN_redeem_the_gabelle_desc:0 "The Protocol's pledge on the salt revenue was never lifted before 1943. Lifting it early costs three years of central receipts and buys back the one tax the whole country pays."
 WW1_QIN_redeem_the_gabelle_tt:0 "Ledger: plus 20 everywhere. Minus one level of foreign influence on three zones. Bypassed if the gabelle was never farmed out."
 WW1_QIN_seal_the_provincial_treasuries:0 "Seal the Provincial Treasuries"
 WW1_QIN_seal_the_provincial_treasuries_desc:0 "Between 1909 and 1911 the centre tried repeatedly to take the provincial treasuries in hand. It succeeded where it was already obeyed."
 WW1_QIN_seal_the_provincial_treasuries_tt:0 "Ledger: plus 30 in every province already above Arrears, minus 40 in every province below - which pushes the worst payers straight to Independence Declared."
 WW1_QIN_a_budget_the_provinces_wrote:0 "A Budget the Provinces Wrote"
 WW1_QIN_a_budget_the_provinces_wrote_desc:0 "The budget of 1911 was the first national budget in Chinese history, and it was negotiated with the assemblies rather than imposed on them."
 WW1_QIN_a_budget_the_provinces_wrote_tt:0 "Ledger floor raised to 40 in every province: none can secede without a political act. Central state factory output: minus 40 percent, for the whole game."

 ############################################################################
 ### ERE WW1 - branche B, The New Policies
 ############################################################################
 WW1_QIN_the_fourth_petition:0 "The Fourth Petition"
 WW1_QIN_the_fourth_petition_desc:0 "Four petitions in 1910, the last carried by a delegation received on 22 October. The delegates are not revolutionaries. They are the dynasty's last supporters asking for a date."
 WW1_QIN_the_fourth_petition_tt:0 "Opens the crossroads of the parliamentary calendar. The delegation is received; the answer is the next focus."
 WW1_QIN_nine_years_to_a_parliament:0 "Nine Years to a Parliament"
 WW1_QIN_nine_years_to_a_parliament_desc:0 "The court shortens the calendar and concedes nothing else. The constitutionalists are told to wait, politely, and for the fourth time."
 WW1_QIN_nine_years_to_a_parliament_tt:0 "Fiscal freedom kept, quotas raised without a vote. Petition Rejected goes immediately to its second step, and the constitutionalists cease to be a support."
 WW1_QIN_convene_the_assembly_now:0 "Convene the Assembly Now"
 WW1_QIN_convene_the_assembly_now_desc:0 "Zhang Jian and the delegates of the assemblies asked for a parliament now. Granting it keeps them inside the regime and puts the throne's revenue in their hands."
 WW1_QIN_convene_the_assembly_now_tt:0 "Ledger: plus 15 in every province with an assembly, and the collapse of 1911 stops being mechanical. Apportion the Indemnity leaves free use and passes through the scripted vote of The Tax the Assembly Voted."
 WW1_QIN_dissolve_the_banner_stipends:0 "Dissolve the Banner Stipends"
 WW1_QIN_dissolve_the_banner_stipends_desc:0 "The Han-Manchu equality edict of 1907 and the plans of 1909 to liquidate the banner lands and stipends were the one concession that cost the dynasty's own people something."
 WW1_QIN_dissolve_the_banner_stipends_tt:0 "The only lever that drops Manchu Ascendancy by more than 20 at once: minus 30, and ledger plus 10 in every province with a banner garrison. The Manchurian and Chihli garrison divisions are dissolved without replacement."

 ############################################################################
 ### ERE WW1 - branche C, The Thirty-Six Divisions
 ############################################################################
 WW1_QIN_the_new_army_sworn_to_the_throne:0 "The New Army Sworn to the Throne"
 WW1_QIN_the_new_army_sworn_to_the_throne_desc:0 "Command belongs to the ministry and loyalty belongs to the provincial patrons. Pay and oath are the only two things that can move loyalty, and both cost the treasury."
 WW1_QIN_the_new_army_sworn_to_the_throne_tt:0 "Every re-sworn division stops counting toward its governor's total. The central treasury pays those divisions, and any province below Arrears refuses the oath. If the ladder was kept, the twelve-division cap still applies."
 WW1_QIN_the_imperial_guard_corps:0 "The Imperial Guard Corps"
 WW1_QIN_the_imperial_guard_corps_desc:0 "The Jinweijun was formed from 1908 under Zaitao: two elite divisions that answer to the regent and to nobody else."
 WW1_QIN_the_imperial_guard_corps_tt:0 "Two elite divisions insensitive to the ledger. Manchu Ascendancy: plus 15, and ledger minus 10 in every province whose garrison is drawn on."
 WW1_QIN_a_general_staff_for_the_empire:0 "A General Staff for the Empire"
 WW1_QIN_a_general_staff_for_the_empire_desc:0 "The Junzifu was instituted in 1911, which is to say at the last possible moment, and it produced no troops at all."
 WW1_QIN_a_general_staff_for_the_empire_tt:0 "Plus one military advisor slot, and no Manchu Ascendancy cost. It takes time the Empire may no longer have, and yields no extra troops."

 ############################################################################
 ### ERE WW1 - branche D, The Indemnity and the Rails
 ############################################################################
 WW1_QIN_nationalize_the_railways:0 "Nationalize the Railways"
 WW1_QIN_nationalize_the_railways_desc:0 "The edict of 9 May 1911, executed by Sheng Xuanhuai, transferred to foreign banks the lines the provinces had subscribed. It is a treasury operation dressed as industrial policy, and it was read as one."
 WW1_QIN_nationalize_the_railways_tt:0 "Central control of the trunk lines and a cash entry that clears one tranche of the Protocol. Ledger: minus 25 in every province carrying Gentry Shareholders. Manchu Ascendancy to its maximum, and The Wuchang Garrison becomes unavoidable within six months."
 WW1_QIN_compensate_the_shareholders:0 "Compensate the Shareholders"
 WW1_QIN_compensate_the_shareholders_desc:0 "Nationalise, but redeem the Szechwan, Hunan, Hupeh and Kwangtung subscribers at par. The railway protection movement never starts, and the treasury never recovers."
 WW1_QIN_compensate_the_shareholders_tt:0 "Ledger: plus 10 in the four provinces, and the protection movement does not begin. It costs the equivalent of three years of central revenue, and no tranche of the Protocol is cleared."
 WW1_QIN_the_hukuang_loan:0 "The Hukuang Loan"
 WW1_QIN_the_hukuang_loan_desc:0 "The four-power Huguang loan of 20 May 1911 was the money that made nationalisation possible, secured on the revenue of three provinces."
 WW1_QIN_the_hukuang_loan_tt:0 "Plus three civilian factories and the central lines completed. Plus one level of foreign influence on the Yangtze zones, pledged on the revenue of three provinces."
 WW1_QIN_a_trunk_line_to_szechwan:0 "A Trunk Line to Szechwan"
 WW1_QIN_a_trunk_line_to_szechwan_desc:0 "The Chengtu-Hankow line was the object of the protection movement. Built, it makes the interior reachable by an army for the first time."
 WW1_QIN_a_trunk_line_to_szechwan_tt:0 "Infrastructure: plus 2, and supply plus 20 percent in the west. The interior states stop being out of reach for the central army."
 WW1_QIN_the_substitution_boom:0 "The Substitution Boom"
 WW1_QIN_the_substitution_boom_desc:0 "European capital withdrew for the Great War and China had its first real industrial expansion - cotton mills, flour, matches - at Shanghai, Tientsin and Wuhan. It was built on an absence."
 WW1_QIN_the_substitution_boom_tt:0 "Civilian construction speed plus 25 percent and plus four civilian factories at Shanghai, Tientsin and Wuhan. From 1920 the idea European Capital Returns: minus 20 percent factory output and minus 0.10 stability per month for two years."
 WW1_QIN_tariff_autonomy_demanded:0 "Tariff Autonomy Demanded"
 WW1_QIN_tariff_autonomy_demanded_desc:0 "The Mackay treaty of 1902 promised tariff revision. Twenty years later the conventional five percent still stands, and asking again costs more than it did."
 WW1_QIN_tariff_autonomy_demanded_tt:0 "Trade revenue plus 25 percent if obtained. Opens the chain that ends at The Unequal Treaties Are Void. Opinion minus 30 with three powers, and refusal is the default outcome while the average ledger stands below 50."

 ############################################################################
 ### ERE WW1 - branche E, The Constitutionalists
 ############################################################################
 WW1_QIN_a_han_majority_cabinet:0 "A Cabinet of Han Ministers"
 WW1_QIN_a_han_majority_cabinet_desc:0 "The cabinet of 8 May 1911 held nine Manchus out of thirteen. A Han majority cabinet was what the constitutionalists asked for, and what Zaifeng refused to conceive."
 WW1_QIN_a_han_majority_cabinet_tt:0 "Manchu Ascendancy: minus 40. Ledger: plus 20 in every province with an assembly. The imperial house loses control of the government: the throne no longer appoints, it ratifies."
 WW1_QIN_the_constitutional_compact:0 "The Nineteen Articles Kept"
 WW1_QIN_the_constitutional_compact_desc:0 "The Nineteen Articles of 3 November 1911 were conceded under fire and too late. Conceded here, in time, they are a constitution rather than a surrender."
 WW1_QIN_the_constitutional_compact_tt:0 "Ledger floor of 50 everywhere: the secession crisis can no longer trigger mechanically. The player permanently loses free use of Apportion the Indemnity and of the provincial appointment decisions."

 ############################################################################
 ### ERE WW1 - branche F, The Mandate Contested
 ############################################################################
 WW1_QIN_the_cabinet_of_princes:0 "The Cabinet of Princes"
 WW1_QIN_the_cabinet_of_princes_desc:0 "Prince Qing's cabinet of 8 May 1911: thirteen members, nine Manchus, seven of the imperial house, four Han. The court called it a government. The provinces called it a family."
 WW1_QIN_the_cabinet_of_princes_tt:0 "Free appointments and full control of the central government. Manchu Ascendancy to its maximum, ledger minus 20 in every province with an assembly, and the unavoidable event A Dynasty of Foreigners is armed."
 WW1_QIN_the_nineteen_articles:0 "The Nineteen Articles"
 WW1_QIN_the_nineteen_articles_desc:0 "On 3 November 1911 the court conceded the constitution it had refused for three years. The first rising was already three weeks old."
 WW1_QIN_the_nineteen_articles_tt:0 "Ledger: plus 10 everywhere, and the throne survives as a figure. The concession comes after the first rising: it is worth half what it would have been conceded in time."
 WW1_QIN_recall_the_man_from_honan:0 "Recall the Man from Honan"
 WW1_QIN_recall_the_man_from_honan_desc:0 "Yuan Shikai was dismissed on 2 January 1909 for an affliction of the foot. In October 1911 the dynasty can only put down the revolution by recalling the man it drove out."
 WW1_QIN_recall_the_man_from_honan_tt:0 "The six Beiyang divisions return to full organisation. The Army Has One Master locks at its ceiling, and divergence 8 becomes unreachable for the rest of the game."
 WW1_QIN_the_regent_leads_the_army:0 "The Regent Leads the Army"
 WW1_QIN_the_regent_leads_the_army_desc:0 "Zaifeng and Yinchang took the field rather than recall Yuan. The campaign was slow, and half the provinces declared while it crawled."
 WW1_QIN_the_regent_leads_the_army_tt:0 "The Army Has One Master falls by 20 and divergence 8 stays open. The Beiyang divisions fight at minus 25 percent organisation."
 WW1_QIN_terms_at_nanking:0 "Terms at Nanking"
 WW1_QIN_terms_at_nanking_desc:0 "Puyi abdicated on 12 February 1912 under articles of favourable treatment: the Forbidden City, a pension, a title. The government passed to Peking under Yuan Shikai on 10 March."
 WW1_QIN_terms_at_nanking_tt:0 "Negotiated abdication, articles of favourable treatment kept. The tag passes to the Republic through the existing chinese_empire.18 event, without duplicating any republican content. The imperial tree closes; only divergence 8 can reopen it."
 WW1_QIN_the_throne_will_not_treat:0 "The Throne Will Not Treat"
 WW1_QIN_the_throne_will_not_treat_desc:0 "The court had neither the army nor the money to refuse. Refusing anyway is the one thing the historical dynasty never tried."
 WW1_QIN_the_throne_will_not_treat_tt:0 "War with the revolutionary tags. Requires an average ledger of at least 50 and a loyal Beiyang: without them the war is lost before it is fought."
 WW1_QIN_the_court_moves_to_mukden:0 "The Court Moves to Mukden"
 WW1_QIN_the_court_moves_to_mukden_desc:0 "Manchuria is the dynasty's own land, and it has been a Russian then a Japanese sphere since 1900. It is a refuge with two landlords."
 WW1_QIN_the_court_moves_to_mukden_tt:0 "A smaller but tenable state, cores kept over all China. Four states only, a Russian and a Japanese neighbour, and foreign influence rises there unchecked."
 WW1_QIN_hold_the_yellow_river:0 "Hold the Yellow River"
 WW1_QIN_hold_the_yellow_river_desc:0 "After October 1911 the river was the effective line between north and south. Holding it is the choice to keep half a country rather than lose all of it."
 WW1_QIN_hold_the_yellow_river_tt:0 "Plus two levels of fortification on the river line and a major defensive bonus in the north. War with the Republic. The whole South is abandoned and its cores lost."
 WW1_QIN_the_hongxian_mandate:0 "The Hongxian Mandate"
 WW1_QIN_the_hongxian_mandate_desc:0 "Yuan Shikai accepted the throne on 11 and 12 December 1915; the Hongxian era opened on 1 January 1916. On 25 December Cai E and Tang Jiyao proclaimed the National Protection War in Yunnan."
 WW1_QIN_the_hongxian_mandate_tt:0 "The monarchical form is restored and the imperial tree reopens. Countdown idea Eighty-Three Days: a growing penalty while Yunnan, Kweichow and Kwangsi are unsubdued, and war with those three."
 WW1_QIN_subdue_the_south_west:0 "Subdue the South-West"
 WW1_QIN_subdue_the_south_west_desc:0 "Three mountain campaigns in under three months of game time. Yuan had eighty-three days and did not have them."
 WW1_QIN_subdue_the_south_west_tt:0 "Eighty-Three Days is removed and the Hongxian dynasty holds. Three mountain campaigns must be won before the penalty reaches its last step."
 WW1_QIN_renounce_the_throne:0 "Renounce the Throne"
 WW1_QIN_renounce_the_throne_desc:0 "Yuan renounced on 22 March 1916 after eighty-three days and died of uraemia on 6 June, aged fifty-seven."
 WW1_QIN_renounce_the_throne_tt:0 "Eighty-Three Days is removed at once. The monarchical branch is closed for the rest of the game, divergence 8 included."
 WW1_QIN_the_pigtailed_army:0 "The Pigtailed Army"
 WW1_QIN_the_pigtailed_army_desc:0 "On 1 July 1917 Zhang Xun and his queued soldiers put Puyi back on the throne. The restoration lasted twelve days, because by then one man owned the army."
 WW1_QIN_the_pigtailed_army_tt:0 "Return to the imperial tag: the imperial tree and the court characters are recovered. No clique recognises the restoration, the ledger returns to its floor everywhere, and war with the Anhui clique is immediate."

 ############################################################################
 ### ERE INT - infobulles de porte inter-eres
 ############################################################################
 INT_QIN_gate_the_constitutional_compact_tt:0 "The Nineteen Articles were kept: the throne reigns and the assembly governs."
 INT_QIN_gate_the_restoration_holds_tt:0 "The dynasty is still on the throne - restored by the pigtailed army, or never having treated - and the throne was not renounced."
 INT_QIN_gate_a_charter_for_the_frontiers_tt:0 "The restoration holds, or the constitutional compact was kept."

 ############################################################################
 ### ERE INT - branche E, The Constitutionalists
 ############################################################################
 INT_QIN_a_parliament_at_peking:0 "A Parliament at Peking"
 INT_QIN_a_parliament_at_peking_desc:0 "The parliament the dynasty promised for 1917 and never convened. Convened here, it makes the emperor a constitutional monarch of a functioning state."
 INT_QIN_a_parliament_at_peking_tt:0 "Ledger: plus 15 everywhere."
 INT_QIN_the_provincial_charters:0 "The Provincial Charters"
 INT_QIN_the_provincial_charters_desc:0 "Provincial federalism was the constitutionalist answer to the cliques after 1916: charter the provinces rather than garrison them."
 INT_QIN_the_provincial_charters_tt:0 "Ledger floor of 60 everywhere: no secession is possible. Central state factory output: minus 20 percent, permanently."
 INT_QIN_a_civil_service_by_examination_again:0 "A Civil Service Examined Again"
 INT_QIN_a_civil_service_by_examination_again_desc:0 "The examination returns as a modern competitive civil service. It takes two years to produce its first official and it ends the era of the purchased post."
 INT_QIN_a_civil_service_by_examination_again_tt:0 "Central appointments stop costing ledger and start earning it. Minus 0.10 political power per day, and two years before the first effect."
 INT_QIN_the_emperor_reigns_not_rules:0 "The Emperor Reigns, Not Rules"
 INT_QIN_the_emperor_reigns_not_rules_desc:0 "This is the outcome the constitutionalists of 1910 were asking for. It took twenty-four years and two revolutions to reach the thing that was on the table in October 1910."
 INT_QIN_the_emperor_reigns_not_rules_tt:0 "Terminal idea Constitutional Empire: the ledger stops decaying by itself and the mandate is no longer an exhaustible resource. Opens the epilogue A Crown Above Parties."

 ############################################################################
 ### ERE INT - branche F, The Mandate Contested
 ############################################################################
 INT_QIN_the_restoration_holds:0 "The Restoration Holds"
 INT_QIN_the_restoration_holds_desc:0 "Twelve days become a regime. There is no historical precedent for this and no Chinese tag in the mod has an interwar tree: this is the point where one begins."
 INT_QIN_the_restoration_holds_tt:0 "The imperial tree exists in the interwar period, which is true of no Chinese tag today."
 INT_QIN_the_tuchuns_must_go:0 "The Tuchuns Must Go"
 INT_QIN_the_tuchuns_must_go_desc:0 "The tuchun is a provincial military governor with his own revenue, his own army and his own foreign policy. There is no legal way to remove one."
 INT_QIN_the_tuchuns_must_go_tt:0 "Every province returned to civil government is worth plus 25 ledger. War with the clique tags - one war per clique, with the army the ledger allows, which is to say few."
 INT_QIN_buy_the_tuchuns:0 "Buy the Tuchuns"
 INT_QIN_buy_the_tuchuns_desc:0 "Pay them. The country stays whole on the map and hollow underneath, which is what the Peking government actually did until 1928."
 INT_QIN_buy_the_tuchuns_tt:0 "No war and the country stays whole on the map. Permanent idea The Tuchun System: minus 30 percent central revenue, and the ledger is capped at the Arrears step in every province with a military governor."
 INT_QIN_the_empire_watches_the_republic_fail:0 "The Empire Watches the Republic Fail"
 INT_QIN_the_empire_watches_the_republic_fail_desc:0 "The Northern Expedition was launched on 9 July 1926 against the northern cliques. Against a surviving empire it is a war of reconquest, and it is aimed at you."
 INT_QIN_the_empire_watches_the_republic_fail_tt:0 "Prepares the defence against the Northern Expedition. War with the Republic."
 INT_QIN_the_treaties_renegotiated:0 "The Treaties Renegotiated"
 INT_QIN_the_treaties_renegotiated_desc:0 "The Washington Conference of 1921 and 1922 returned Shantung and affirmed territorial integrity in principle. It abrogated nothing."
 INT_QIN_the_treaties_renegotiated_tt:0 "Minus one level of foreign influence on four zones. No unequal treaty is abrogated, and the foreign concessions idea stands entire until 1943."

 ############################################################################
 ### ERE INT - branche G, The Empire That Endured
 ############################################################################
 INT_QIN_a_charter_for_the_frontiers:0 "A Charter for the Frontiers"
 INT_QIN_a_charter_for_the_frontiers_desc:0 "Tibet and Outer Mongolia detached themselves between 1911 and 1913 because a garrison is not a relationship. A charter is cheaper than a garrison and it concedes more."
 INT_QIN_a_charter_for_the_frontiers_tt:0 "Ledger: plus 20 in Mongolia, Tibet and Sinkiang, and the garrisons are freed. The central power no longer raises tax or men there."
 INT_QIN_the_lhasa_convention_revised:0 "The Lhasa Convention Revised"
 INT_QIN_the_lhasa_convention_revised_desc:0 "The Simla convention of 1913 and 1914 was never ratified by China. Ratifying a revised version fixes the border and makes the suzerainty nominal."
 INT_QIN_the_lhasa_convention_revised_tt:0 "Ledger: plus 25 in Tibet, no war, border fixed. The suzerainty becomes nominal and no claim is justifiable afterwards."
 INT_QIN_the_szechwan_road_to_lhasa:0 "The Szechwan Road to Lhasa"
 INT_QIN_the_szechwan_road_to_lhasa_desc:0 "Zhao Erfeng campaigned in Kham from 1905 to 1911 and got as far as any Chinese army had. Szechwan paid for it, and remembered."
 INT_QIN_the_szechwan_road_to_lhasa_tt:0 "Reconquest, and war with Tibet. Mountain supply, and ledger minus 15 in Szechwan, which pays for the expedition."
 INT_QIN_the_outer_mongolian_question:0 "The Outer Mongolian Question"
 INT_QIN_the_outer_mongolian_question_desc:0 "Reoccupied in 1919, lost for good soon after. The question is settled by treaty or by flying column, and the difference matters more to the ledger than to the map."
 INT_QIN_the_outer_mongolian_question_tt:0 "Settles the status of Outer Mongolia by treaty or by flying column, through an event with two outcomes."

 ############################################################################
 ### ERE WW2 - infobulle de porte inter-eres
 ############################################################################
 WW2_QIN_gate_the_outer_mongolian_question_tt:0 "The Outer Mongolian question has been settled."

 ############################################################################
 ### ERE WW2 - branche G, The Empire That Endured
 ############################################################################
 WW2_QIN_the_emperor_in_changchun:0 "The Emperor in Changchun"
 WW2_QIN_the_emperor_in_changchun_desc:0 "Manchukuo was proclaimed in 1932 and Puyi became its emperor in 1934. A surviving Qing empire must answer a question no other tag can be asked: is that a branch of the house, or a Japanese theft using the family name?"
 WW2_QIN_the_emperor_in_changchun_tt:0 "Puts the question to a surviving imperial house. The Manchukuo tag already exists in the mod, and it carries the same family name."
 WW2_QIN_a_branch_of_the_house:0 "A Branch of the House"
 WW2_QIN_a_branch_of_the_house_desc:0 "Recognise Changchun. The northern border is safe, and the throne has just recognised a Japanese protectorate as legitimate."
 WW2_QIN_a_branch_of_the_house_tt:0 "No war with Japan and a secure northern border. Idea Two Emperors: ledger minus 25 in every Han province."
 WW2_QIN_an_usurpation_in_the_north:0 "An Usurpation in the North"
 WW2_QIN_an_usurpation_in_the_north_desc:0 "The Mukden incident of 18 September 1931 was a staged pretext and everyone knew it. Saying so out loud costs a war on Japan's timetable."
 WW2_QIN_an_usurpation_in_the_north_tt:0 "Ledger: plus 15 everywhere - the dynasty refused to be used. War with Japan, beginning on the date Japan chooses."
 WW2_QIN_the_marco_polo_bridge:0 "The Marco Polo Bridge"
 WW2_QIN_the_marco_polo_bridge_desc:0 "7 July 1937. Without this focus a surviving Qing empire faces the invasion with an empty focus screen: this is the bridge the tag does not have today."
 WW2_QIN_the_marco_polo_bridge_tt:0 "Opens the war section of the tree."
 WW2_QIN_trade_space_for_time:0 "Trade Space for Time"
 WW2_QIN_trade_space_for_time_desc:0 "Industry evacuated west, the ground burned behind it, the capital at Chungking. The country does not capitulate and it does not hold anything either."
 WW2_QIN_trade_space_for_time_tt:0 "Idea Retreat and Endure: the country does not capitulate. Half the factories are lost in transit and the abandoned provinces fall to the ledger floor."
 WW2_QIN_hold_the_yangtze_line:0 "Hold the Yangtze Line"
 WW2_QIN_hold_the_yangtze_line_desc:0 "Shanghai and Wuhan, 1937 and 1938. The lower Yangtze is the only industrial base China has; losing it slowly is not obviously better than losing it fast."
 WW2_QIN_hold_the_yangtze_line_tt:0 "The lower Yangtze industrial base is kept if the line holds. Heavy losses, and if the line gives way the industry is taken intact."
 WW2_QIN_the_unequal_treaties_are_void:0 "The Unequal Treaties Are Void"
 WW2_QIN_the_unequal_treaties_are_void_desc:0 "The Allies abrogated the unequal treaties in 1943, and the United States repealed the Chinese exclusion acts the same year. Forty-two years after the Protocol, the subtraction at the top of the budget stops."
 WW2_QIN_the_unequal_treaties_are_void_tt:0 "Removes the foreign concessions idea, The Customs Are Not Ours and every level of foreign influence, permanently. Terminal of the sovereignty thread."

 ############################################################################
 ### ERE CW - infobulles de porte inter-eres
 ############################################################################
 CW_QIN_gate_a_crown_above_parties_tt:0 "The unequal treaties are void, and Manchu Ascendancy stands below 30. No epilogue is reachable without having settled the ledger."
 CW_QIN_gate_the_last_abdication_tt:0 "The unequal treaties are void."

 ############################################################################
 ### ERE CW - branche G, The Empire That Endured
 ############################################################################
 CW_QIN_a_crown_above_parties:0 "A Crown Above Parties"
 CW_QIN_a_crown_above_parties_desc:0 "The constitutional empire that 1908 promised for 1917. It arrives forty-one years late, and only for a player who never let the ledger break in either direction."
 CW_QIN_a_crown_above_parties_tt:0 "Imperial constitutional epilogue. Requires an average ledger of at least 70 as well as Manchu Ascendancy below 30."
 CW_QIN_the_last_abdication:0 "The Last Abdication"
 CW_QIN_the_last_abdication_desc:0 "The throne yields to a republic that inherits working institutions instead of a wreck. In 1949 the dynastic question had been closed for thirty-seven years; here it closes properly."
 CW_QIN_the_last_abdication_tt:0 "Unitary republican epilogue: the tag passes to the Republic through the existing chinese_empire.18 event. The imperial house leaves the game and the court characters cease to be recruitable."
