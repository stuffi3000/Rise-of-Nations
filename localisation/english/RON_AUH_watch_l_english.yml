l_english:

 AUH_nationality_watch:0 "Nationality Watch"
 AUH_nationality_watch_desc:0 "Stability moves every loyalty each month: [GetAUHStabilityDrift]\nA settlement now costs [?AUH_conciliation_cost|0] and buys [?AUH_conciliation_gain|0]\nThe Community: [?AUH_gemeinsamkeit|0] - [GetAUHCommunity]\nThe term: [GetAUHTerm]\n\n[GetAUHWorstLine]\n\nBelow 35 the Austro-Hungarian core is struck off; below §O20§! compliance falls to nothing; below §R5§! the nationality rises."

 AUH_watch_AUS:0 "Austrian Germans"
 AUH_watch_AUS_desc:0 "Loyalty [?AUS_support|0], [GetAUHStatus_AUS]\nGround lost last month: §O[?AUH_AUS_fall|+0]§!\n[GetAUHForecast_AUS]\n\nBelow 35 the core over the German crownlands is struck off. Below §O20§! compliance there falls to nothing. Below §R5§! the uprising arms: one hundred and twenty days, then the Austrian Germans are let go and the army must take them back."
 AUH_watch_HUN:0 "Hungarians"
 AUH_watch_HUN_desc:0 "Loyalty [?HUN_support|0], [GetAUHStatus_HUN]\nGround lost last month: §O[?AUH_HUN_fall|+0]§!\n[GetAUHForecast_HUN]\n\nBelow 35 the core over the Hungarian lands is struck off. Below §O20§! compliance there falls to nothing. Below §R5§! the uprising arms: one hundred and twenty days, then the Hungarians are let go and the army must take them back.\n\nWhile Hungarian National Resistance stands, they rise at §R25§! and not at five."
 AUH_watch_CZE:0 "Czechs"
 AUH_watch_CZE_desc:0 "Loyalty [?CZE_support|0], [GetAUHStatus_CZE]\nGround lost last month: §O[?AUH_CZE_fall|+0]§!\n[GetAUHForecast_CZE]\n\nBelow 35 the core over Bohemia and Moravia is struck off. Below §O20§! compliance there falls to nothing. Below §R5§! the uprising arms: one hundred and twenty days, then the Czechs are let go and the army must take them back."
 AUH_watch_SLO:0 "Slovaks"
 AUH_watch_SLO_desc:0 "Loyalty [?SLO_support|0], [GetAUHStatus_SLO]\nGround lost last month: §O[?AUH_SLO_fall|+0]§!\n[GetAUHForecast_SLO]\n\nBelow 35 the core over Upper Hungary is struck off. Below §O20§! compliance there falls to nothing.\n\nNo uprising is written for the Slovaks. The core and the compliance go all the same."
 AUH_watch_POL:0 "Poles"
 AUH_watch_POL_desc:0 "Loyalty [?POL_support|0], [GetAUHStatus_POL]\nGround lost last month: §O[?AUH_POL_fall|+0]§!\n[GetAUHForecast_POL]\n\nBelow 35 the core over western Galicia is struck off. Below §O20§! compliance there falls to nothing. Below §R5§! the uprising arms: one hundred and twenty days, then the Poles are let go and the army must take them back."
