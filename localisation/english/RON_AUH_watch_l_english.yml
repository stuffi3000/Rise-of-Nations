 AUH_watch_ITA:0 "Italians"
 AUH_watch_ITA_desc:0 "Loyalty [?ITA_support|0], [GetAUHStatus_ITA]\nGround lost last month: §O[?AUH_ITA_fall|+0]§!\n[GetAUHForecast_ITA]\n\nBelow 35 the core over the Trentino and the Littoral is struck off. Below §O20§! compliance there falls to nothing.\n\nNo uprising is written for the Italians. The core and the compliance go all the same, and Rome is across the border."
