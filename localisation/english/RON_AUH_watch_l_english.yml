 AUH_the_gathering_storm:0 "A Nationality Below Twenty"
 AUH_the_gathering_storm_desc:0 "[GetAUHWorstLine]\n\nCompliance in those lands is already at nothing. Should the figure reach §R5§! the uprising arms for another hundred and twenty days, and at the end of them the nationality is released and the army must take it back. This warning does nothing on its own. It only runs out."
 AUH_the_gathering_storm_tt:0 "No nationality stands below twenty."
