l_english:

###############################################################################################################################
# Austria-Hungary - the reward text of the economic, army, naval and air trees.
# Companion to common/national_focus/RON_AUH_eco_air_DNC.txt, RON_AUH_arm_nav_DNC.txt
# and common/ideas/RON_AUH_eco_arm_refonte_ideas.txt.
###############################################################################################################################

# --- the national spirits these focuses install ------------------------------------------------

 AUH_ref_the_bondholders_of_paris:0 "The Bondholders of Paris"
 AUH_ref_the_bondholders_of_paris_desc:0 "The Southern Railway came with 469,5 million florins of bonds against 150 million of shares. The Treasury now services paper issued by a board that sat in Paris."

 AUH_ref_the_transalpina:0 "The Transalpina"
 AUH_ref_the_transalpina_desc:0 "One hundred and forty-four kilometres from Jesenice to Trieste, for about 103,6 million crowns. The state has a road to the sea of its own, and a decade of credit is spoken for."

 AUH_ref_the_ten_year_clock:0 "The Ten Year Clock"
 AUH_ref_the_ten_year_clock_desc:0 "The settlement is signed again, and the clock starts again with it. Every tariff, every quota and every bank charter now falls due on the same day, and Budapest knows the date."

 AUH_ref_the_chambers_of_commerce:0 "The Chambers of Commerce"
 AUH_ref_the_chambers_of_commerce_desc:0 "The chambers elect to the Reichsrat and speak for trade where the diets speak only for nations. They are also one more body that has to be squared before anything is voted."

 AUH_ref_the_provincial_savings_banks:0 "The Savings of the Provinces"
 AUH_ref_the_provincial_savings_banks_desc:0 "The postal savings bank and the provincial tills collect the small deposits of the whole Monarchy. The money is safe, cheap and lent against mortgages rather than against machines."

 AUH_ref_the_agrarian_bloc:0 "The Bund der Landwirte"
 AUH_ref_the_agrarian_bloc_desc:0 "The agrarian bloc wants the duties on grain and cattle kept high, and it sits on the benches that vote the common estimate. Bread costs what the bloc decides, and the towns know whom to blame."

 AUH_ref_the_common_army_estimate:0 "The Common Army Estimate"
 AUH_ref_the_common_army_estimate_desc:0 "The military line of the common budget, voted by two delegations that never sit in one room. What it buys is real; what it costs is argued over for the following ten years."

 AUH_ref_the_order_of_chlopy:0 "The Order of Chlopy"
 AUH_ref_the_order_of_chlopy_desc:0 "Published at the Galician manoeuvres on 16 September 1903: the army stays common and united, in its language of command and in its colours. Budapest reads it as a constitutional slap and the obstruction lives on it."

 AUH_ref_the_comitats_refuse:0 "The Comitats Refuse"
 AUH_ref_the_comitats_refuse_desc:0 "The counties will not vote the tax and will not hand over the recruit lists, and the administration of a kingdom stops obeying. The army fills its depots all the same. Not one shot is fired in the affair."

 AUH_ref_the_new_recruit_class:0 "The New Recruit Class"
 AUH_ref_the_new_recruit_class_desc:0 "The chambers voted the higher intake and the depots have it. For two years the regiments are full of men who have not finished their training, and every one of them has to be fed, shod and clothed."

 AUH_ref_the_belvedere_chancery:0 "The Belvedere Chancery"
 AUH_ref_the_belvedere_chancery_desc:0 "The heir's military chancery stands outside the chain of command and settles the appointments regardless. In three weeks of autumn 1906 it changed the chief of staff, the war minister and the foreign minister."

 AUH_ref_the_wehrgesetz_of_1912:0 "The Wehrgesetz of 1912"
 AUH_ref_the_wehrgesetz_of_1912_desc:0 "The intake frozen since 1889 is raised and active service falls to two years. Both chambers had to be paid for it, and both remember the price."

 AUH_ref_the_manoeuvre_season:0 "The Manoeuvre Season"
 AUH_ref_the_manoeuvre_season_desc:0 "Corps meet in the field every autumn under the eye of the Emperor. The army learns what it can march, and the estimate learns what a fortnight of it costs."

 AUH_ref_the_deployment_plans:0 "The Deployment Plans"
 AUH_ref_the_deployment_plans_desc:0 "Plan R against Russia, Plan B against Serbia, and a mass of troops that has to be sent one way or the other. The timetable is ready; the decision is not."

 AUH_ref_the_mobilisation_that_fired_no_shot:0 "The Mobilisation That Fired No Shot"
 AUH_ref_the_mobilisation_that_fired_no_shot_desc:0 "Corps stand mobilised in Galicia for months and nothing happens. It is the cost of a war without any of the results of one, and the reservists are not at the harvest."

 AUH_ref_the_marinesektion:0 "The Marinesektion"
 AUH_ref_the_marinesektion_desc:0 "The navy is a section of the common war ministry and not a ministry of its own. It gains a staff that knows its business and keeps no minister to defend its estimate."

 AUH_ref_the_montecuccoli_programme:0 "The Montecuccoli Programme"
 AUH_ref_the_montecuccoli_programme_desc:0 "Twelve battleships, four armoured cruisers, eight scouts, eighteen destroyers and six submarines, written down in the spring of 1905. The yards have a target; the Treasury has a bill."

 AUH_ref_the_keels_of_two_states:0 "The Keels of Two States"
 AUH_ref_the_keels_of_two_states_desc:0 "Every hull is shared out between Trieste and Fiume before it is ordered. Budapest pays without haggling, and no yard ever gets a run long enough to become good at one ship."

 AUH_ref_the_arsenal_at_pola:0 "The Arsenal at Pola"
 AUH_ref_the_arsenal_at_pola_desc:0 "The war port at the head of Istria: dry docks, magazines and the only place on the coast that can refit a capital ship. Everything the fleet needs is now in one basket."

 AUH_ref_the_submarine_station:0 "The Submarine Station"
 AUH_ref_the_submarine_station_desc:0 "Six boats were the cheapest line in the programme of 1905 and the only one nobody argued about. They are slow, short-ranged, and they change what a narrow sea is worth."

 AUH_ref_the_flying_school:0 "The Flying School at Wiener Neustadt"
 AUH_ref_the_flying_school_desc:0 "Pilots are trained on the field at Wiener Neustadt and get their practice in the autumn manoeuvres. The credits for it have to be fought for in the delegations every single year."

# --- named threats -----------------------------------------------------------------------------

 AUH_ref_threat_italy:0 "The memorandum on Italy"
 AUH_ref_threat_lovcen:0 "The Lovcen question"
 AUH_ref_threat_adriatic:0 "The Adriatic claimed"

# --- named bonuses -----------------------------------------------------------------------------

 AUHDNC_arm_the_school_of_caution_doctrine:0 "The School of Caution"
 AUHDNC_arm_the_army_of_fifty_millions_late:0 "The Rifle of the Second Generation"
 AUHDNC_nav_the_fleet_of_a_land_power_late:0 "The Credits Turned Inland"
 AUHDNC_air_a_flying_troop_for_1914_late:0 "The Flying Troop Expanded"

# --- what each focus teaches, f4 the common market ---------------------------------------------

 AUH_ref_tt_common_market:0 "The customs and commercial union of 1867, renewed in 1878, 1887 and 1897. It runs on a ten year clock and falls due again at the end of 1907."
 AUH_ref_tt_one_market:0 "The Hungarian quota went from 30 per cent in 1867 to 33,06 in 1897 and 36,4 in 1907. It has never once been settled downward."
 AUH_ref_tt_two_economies:0 "Not one territory by nature but two that agree, ten years at a time, to raise no barrier between them. That is the reading Budapest has always wanted."
 AUH_ref_tt_autonomous_tariff:0 "Duties fixed by the two governments alone, high on grain and on cattle. The exporters of Bohemia lose the markets they live on."
 AUH_ref_tt_commercial_treaties:0 "The tariff stops being a wall and becomes a bargaining floor. Grain prices fall, and the magnates who vote the common budget notice within the quarter."
 AUH_ref_tt_the_bank:0 "One bank of issue, two head offices, notes printed German on one face and Hungarian on the other. Bilinski governs it from 1900, Popovics from 1909."
 AUH_ref_tt_common_army_orders:0 "The ordnance contracts are apportioned on the quota, so the rifle is chosen in a committee rather than on a proving ground."
 AUH_ref_tt_state_railways:0 "The k. k. Staatsbahnen are the largest employer in Cisleithania. Hungary carries about half the track of the Monarchy, 22 869 kilometres of it by 1910."
 AUH_ref_tt_sudbahn_bought:0 "The Southern Railway carries 150 million florins of shares against 469,5 million of bonds, and the board that issued them sits in Paris."
 AUH_ref_tt_sudbahn_private:0 "The state never decided. The company stayed private and in deficit to 1914, on a concession granted in 1858."
 AUH_ref_tt_koerber_billion:0 "Wittek's railway law is sanctioned on 6 June 1901 and the waterways law five days later. The whole programme is reckoned at about a billion crowns."
 AUH_ref_tt_alpine_breakthroughs:0 "Tauern 8 370 metres, Karawanken 7 976, Wochein 6 327. Some four thousand men worked the Karawanken and thirty-four of them died in it."
 AUH_ref_tt_danube_highway:0 "The waterways law of 11 June 1901 plans some 1 700 kilometres of canal. By 1910 the Danube-Oder line is drawn, 410,2 kilometres and 29 locks, and nothing is dug."
 AUH_ref_tt_transalpina:0 "Jesenice to Trieste, 144,8 kilometres for about 103,6 million crowns, opened on 19 July 1906 by the Archduke Franz Ferdinand."
 AUH_ref_tt_electrification:0 "The Mariazellerbahn runs wholly electric from 7 October 1911 on 6 500 volts at 25 hertz, fed by two power stations built for it."
 AUH_ref_tt_hydro_power:0 "Kando and the Ganz works of Budapest electrified the Valtellina line in 1902 on three phase high tension, the first main line in the world so worked."
 AUH_ref_tt_ddsg:0 "The Danube Steam Navigation Company works the river from Regensburg to the Black Sea. It is the only great waterway the Monarchy actually has."
 AUH_ref_tt_iron_gates:0 "The Iron Gates have been open to navigation since 27 September 1896, and Hungary takes the toll on the international traffic of the river."
 AUH_ref_tt_two_seaports:0 "Trieste moved about 6,2 million tons in 1913. Fiume moved 2,1 and stood tenth among the ports of Europe. Both are enlarged out of one purse."
 AUH_ref_tt_trieste:0 "Hungary pays its quota share of a quay in a town where nobody speaks Hungarian, and has said so at every renewal since 1867."
 AUH_ref_tt_fiume:0 "Fiume was detached from Croatia in 1868 for the Crown of Saint Stephen. Hungarian railway rebates carry grain past Trieste to reach it."
 AUH_ref_tt_subsidised_lines:0 "The Austrian Lloyd and the Hungarian Adria are paid out of the estimates to keep the Levant and the ocean routes open under the flag."
 AUH_ref_tt_emigrants:0 "62 605 subjects sailed from Bremen and Hamburg in 1900 against 7 626 in 1876. Every one of them is a conscript and a taxpayer less."
 AUH_ref_tt_landwirte:0 "The agrarian bloc wants the duty on grain and cattle kept high. It sits on the benches that vote the common estimate."
 AUH_ref_tt_pig_war:0 "Between 80 and 90 per cent of Serbian exports go to the Monarchy. A veterinary order closes a frontier faster than any tariff can."
 AUH_ref_tt_home_market:0 "Fifty millions inside one wall. The Hungarian growers and the Bohemian works need one another far more than either says in public."
 AUH_ref_tt_treaty_berlin:0 "A treaty with Berlin steadies the Bohemian export trade and prices Hungarian grain against the German market instead of against the tariff."
 AUH_ref_tt_most_favoured:0 "The same duty for every signatory. It costs nothing to grant and it cannot be withdrawn without notice to everybody at once."
 AUH_ref_tt_oriental_markets:0 "Salonica, Smyrna and the Levant houses. A boycott declared in Constantinople shuts the route faster than any tariff could."
 AUH_ref_tt_chambers:0 "The chambers of commerce elect to the Reichsrat. They are the one constituency in the Monarchy that is organised by trade and not by nation."
 AUH_ref_tt_quota_deputations:0 "Sixty men from each chamber, sitting in separate rooms and communicating in writing. That is the entire machinery for fixing the quota."
 AUH_ref_tt_common_estimates:0 "The common budget covers the army, the navy and foreign affairs. Everything else is voted twice, in Vienna and in Budapest."
 AUH_ref_tt_renewal:0 "30 per cent in 1867, 33,06 in 1897, 36,4 in 1907. Nothing in the Monarchy is decided once; it is decided twice, and the second time costs more."
 AUH_ref_tt_viennese_banks:0 "Creditanstalt, Bankverein, Laenderbank, Bodencreditanstalt. They do not so much lend to industry as own it, a board seat for every advance."
 AUH_ref_tt_crown_on_gold:0 "The crown is sole legal money from 1 January 1900. One florin to two crowns, one kilogram of fine gold to 3 280 crowns, at the parity of 1892."
 AUH_ref_tt_capital_offensive:0 "Railway concessions, municipal loans and arsenals on credit. A creditor holds what no customs war ever held, and is the first to be expropriated."
 AUH_ref_tt_capital_home:0 "Galicia, the Karst and the Bukovina instead. The Galician oil field is the one raw material the Monarchy has in quantity."
 AUH_ref_tt_old_debt:0 "The debt contracted before 1867 was never partitioned between the two states. Who carries it is argued out again at every renewal."
 AUH_ref_tt_savings:0 "The imperial and royal postal savings bank has taken deposits since 1883, and Otto Wagner begins building it a house in 1904."
 AUH_ref_tt_bourse:0 "The exchange has never recovered its nerve since the crash of 1873, and it prices Monarchy paper accordingly."
 AUH_ref_tt_hungarian_share:0 "Budapest votes the common credits and wants the contracts in the proportion it pays, not in the proportion its works can deliver."
 AUH_ref_tt_cartel:0 "Skoda at Pilsen, the works at Steyr, the steel of Witkowitz. Three firms fix the price and the ministry agrees to stop asking anybody else."
 AUH_ref_tt_foreign_tender:0 "Krupp and Schneider-Creusot bid. Serbia ordered its guns at Creusot rather than at Skoda within six months of King Peter's accession."
 AUH_ref_tt_steyr:0 "The works on the Enns live on one contract. A rifle order renewed is a town employed for a decade."
 AUH_ref_tt_arsenal:0 "The arsenal on the Simmeringer Heide, where the military aeronautical establishment was founded in 1893 in a corner of the gun yard."
 AUH_ref_tt_witkowitz:0 "The Ostrava and Karvina basin gives the Monarchy its coal and Witkowitz its steel. Both lie in Czech speaking country."
 AUH_ref_tt_thirty_half:0 "A 30,5 centimetre siege mortar built at Pilsen. A gun of that calibre is designed against forts, not against armies."
 AUH_ref_tt_technical_colleges:0 "Cisleithania keeps eight universities and its technical high schools besides. Vienna alone counted 6 320 students in the winter of 1899."

# --- what each focus teaches, f6 the air arm ---------------------------------------------------

 AUH_ref_tt_aeronautical_anstalt:0 "The k. u. k. Militaer-Aeronautische Anstalt was founded in 1893 in the Vienna arsenal. In 1909 it moves to Fischamend as the Luftschifferabteilung."
 AUH_ref_tt_dirigible:0 "An airship carries weight and stays up. It also wants a shed, a gas plant and calm air, and it can be seen from ten kilometres off."
 AUH_ref_tt_heavier_than_air:0 "An aeroplane is cheap, fragile, and asks for a pilot who will not live long. In 1905 nobody knows yet which of the two will win."
 AUH_ref_tt_balloons:0 "The captive balloon is the only thing that lets a battery see over the ridge in front of it."
 AUH_ref_tt_airship:0 "The army buys its airship, and then finds out what a shed and a gas plant cost every year afterwards."
 AUH_ref_tt_zanonia:0 "Igo Etrich took the plan of his wing from the seed of Zanonia macrocarpa, which glides out of the tree on its own."
 AUH_ref_tt_air_credits:0 "An aeronautical line in the estimate has to pass two delegations, and one of them has no reason at all to want aeroplanes."
 AUH_ref_tt_taube:0 "The Etrich II, called the Taube, first flew at Wiener Neustadt in 1910. It was drawn in northern Bohemia."
 AUH_ref_tt_fischamend:0 "The airship detachment moves to Fischamend near Vienna in 1909, and the flying station goes to the field at Wiener Neustadt."
 AUH_ref_tt_wind_tunnel:0 "A tunnel measures the lift of a wing before a pilot has to. It is a great deal cheaper than the pilot."
 AUH_ref_tt_first_pilots:0 "From 1911 military pilots are trained at Wiener Neustadt and get their first practice in the autumn manoeuvres."
 AUH_ref_tt_flying_troop:0 "Three years before the war the Monarchy is only beginning to train pilots. Everything after that is time it does not have."

# --- what each focus teaches, f5 the army ------------------------------------------------------

 AUH_ref_tt_three_armies:0 "One common army, an Austrian Landwehr and a Hungarian Honved. Only the first swears to the person of the Emperor."
 AUH_ref_tt_hold_common_army:0 "The common army is the only genuinely supranational institution the Monarchy has, and it is exactly the one Budapest spends forty years paring down."
 AUH_ref_tt_price_of_budapest:0 "Budapest sells recruits for points on the quota. The men arrive once; the price is permanent."
 AUH_ref_tt_impose_contingent:0 "Cisleithania has paragraph 14 when the Reichsrat deadlocks. Hungary has nothing of the kind, so a blocked chamber there has no legal way out at all."
 AUH_ref_tt_recruit_contingent:0 "103 000 recruits a year under the law of 11 April 1889, of which Cisleithania finds 60 389. The figure does not move until 1912."
 AUH_ref_tt_army_estimates:0 "The army lives on the common estimate, and the common estimate is voted by two delegations that never sit in the same room."
 AUH_ref_tt_chlopy:0 "The army order of Chlopy, 16 September 1903: the Emperor tells the army it will remain common and undivided. Budapest reads it as a declaration."
 AUH_ref_tt_words_of_command:0 "Some seventy to eighty German words of command hold the army together. Instruction and daily service are in the regiment's own tongue."
 AUH_ref_tt_regimental_languages:0 "A regiment is instructed in every tongue a fifth of its men speak. Cisleithania alone records nine languages of use in the census of 1900."
 AUH_ref_tt_one_oath:0 "One oath, sworn to the person of the Emperor and King, and one flag. It is the whole of what holds eleven nations in one order of battle."
 AUH_ref_tt_quota_recruits:0 "Recruits priced in percentage points of the common budget. Budapest has never yet asked for less than it asked the last time."
 AUH_ref_tt_new_contingent:0 "The army law of 1912 raises the intake and cuts active service to two years. It is the first revision in twenty-three years."
 AUH_ref_tt_war_ministry:0 "The common war minister answers to the Emperor and to the delegations. Krieghammer fell in December 1902 because the Hungarian chamber threw out his bill."
 AUH_ref_tt_army_by_treaty:0 "An army that exists because a treaty renews it. When the treaty lapses, so does the establishment, and everybody in Budapest knows the date."
 AUH_ref_tt_ordinance:0 "Paragraph 14 of the fundamental law of 21 December 1867 lets the crown legislate while the Reichsrat is not sitting. It was used 76 times between 1897 and 1904."
 AUH_ref_tt_hussars:0 "On 19 February 1906 the Hungarian chamber was cleared by the public force. Seven weeks later the coalition took office, having dropped its military demands."
 AUH_ref_tt_army_recruits_itself:0 "The comitats refuse the tax and the recruits, and the administration of a kingdom simply stops obeying. Not one shot is fired in the whole affair."
 AUH_ref_tt_above_the_nations:0 "An army that answers to the crown alone is an army the taxpayer has stopped consenting to. It still has to be paid for."
 AUH_ref_tt_wehrgesetz:0 "The law of 1912 thaws the intake frozen since 1889, while the population has gone from 45,4 to 49,5 millions on the same base."
 AUH_ref_tt_beck:0 "Friedrich von Beck-Rzikowsky has held the general staff since 1881. Twenty-five years in one chair make a school and not a man."
 AUH_ref_tt_succession:0 "The Belvedere chancery decides the chair. In three weeks of autumn 1906 the Monarchy changed its foreign minister, its chief of staff and its war minister."
 AUH_ref_tt_conrad:0 "Conrad takes the staff on 18 November 1906. Schemua replaces him on 3 December 1911, after one preventive war too many, and he is recalled on 12 December 1912 when the Balkans prove him right."
 AUH_ref_tt_keep_beck:0 "Beck's school is to prepare a war and to argue against having one. It is not a popular position at the Belvedere."
 AUH_ref_tt_manoeuvres:0 "The autumn manoeuvres are where the army finds out what it can actually march, and where the first military pilots got their practice."
 AUH_ref_tt_kriegsschule:0 "The staff college is the one place where an officer corps drawn from eleven nations is taught to think by one method."
 AUH_ref_tt_deployment_plans:0 "Plan R against Russia, Plan B against Serbia, and a mass of troops that must go one way or the other. Deciding late is the same as deciding wrong."
 AUH_ref_tt_memorandum_italy:0 "The ally is also the claimant. Conrad asked again and again for a preventive war on Italy, and was refused until he was dismissed for asking."
 AUH_ref_tt_asks_for_war:0 "In November and December 1912 corps were mobilised in Galicia and no shot was fired. A blank mobilisation costs what a war costs and buys nothing."
 AUH_ref_tt_school_of_caution:0 "Fortify the passes, keep the army in being, and let the diplomats spend it. An army in being is worth more than an army spent."
 AUH_ref_tt_not_to_be_used:0 "An instrument keeps its value by not being used. The difficulty is that nobody can prove it, and the estimate has to be voted all the same."
 AUH_ref_tt_evidenzbureau:0 "The tenth section of the general staff, and the only office in Vienna that reads Belgrade and Rome every morning."
 AUH_ref_tt_kundschaftsdienst:0 "Agents on the Drina and on the Po, paid out of a fund the delegations are not shown."
 AUH_ref_tt_counter_espionage:0 "A service that watches its own officers will eventually find one. What is done with the answer is a political question, not a military one."
 AUH_ref_tt_artillery_question:0 "Heavy pieces to open a fortress, or a light quick firing gun a horse team can keep up with. The estimate will not carry both."
 AUH_ref_tt_siege_batteries:0 "A siege train is useless until the day it is the only thing that works, and it eats the field artillery budget until then."
 AUH_ref_tt_field_gun:0 "A quick firing field gun of the 1905 pattern. It is the weapon the army will actually fight with, and it is ordered late."
 AUH_ref_tt_mortar:0 "The 30,5 centimetre mortar moves in three loads and is assembled on the spot. It is a gun for a campaign, not for a battle."
 AUH_ref_tt_mountain_batteries:0 "Guns a mule train can take over a pass. In a monarchy whose southern frontier is a wall of rock this is not a specialty."
 AUH_ref_tt_landwehr_guns:0 "The Landwehr and the Honved get artillery of their own, which is what both parliaments wanted and what the common army feared."
 AUH_ref_tt_steyr_rifles:0 "The works at Steyr live on one contract. A rifle order renewed is a town employed for a decade."
 AUH_ref_tt_mannlicher:0 "The straight pull Mannlicher repeater. Once a million of them are made the calibre of the army is settled for a generation."
 AUH_ref_tt_schwarzlose:0 "A water cooled machine gun of very simple mechanism, built at Steyr. How many the battalion gets is a budget question, not a tactical one."
 AUH_ref_tt_field_kitchen:0 "Boots, bread and the rolling kitchen. An army that marches into the Carpathians is beaten by its own supply before it meets anybody."
 AUH_ref_tt_fifty_millions:0 "The Monarchy counts about 49,5 millions by 1912 and takes 103 000 recruits a year from them. The arithmetic was never the difficulty."
 AUH_ref_tt_officer_corps:0 "An officer must be able to command in the language of his regiment. The corps is the one body in the Monarchy where that is a condition of promotion."
 AUH_ref_tt_language_rule:0 "Three years to learn the regimental tongue or the promotion does not come. It is the only compulsory language rule anybody actually obeys."
 AUH_ref_tt_kaiserjager:0 "The Kaiserjaeger of the common army and the Landesschuetzen of the Tyrol hold the same mountains under two different establishments."
 AUH_ref_tt_military_railways:0 "The staff draws the strategic lines before any diet votes them, because a mobilisation is a timetable before it is an army."
 AUH_ref_tt_alpine_barrier:0 "Works on the passes down into the Venetian plain, built against the ally the treaty says will never come."
 AUH_ref_tt_army_afforded:0 "The Monarchy could have carried a larger army. What it could not carry was the political price of asking for one twice over."

# --- what each focus teaches, f7 the navy ------------------------------------------------------

 AUH_ref_tt_kriegsmarine:0 "In 1900 the modern battle fleet is three ships of the Habsburg class, 8 232 tons, built at Trieste. At the end of 1902 exactly one is in commission."
 AUH_ref_tt_coast_school:0 "Torpedo craft and coast batteries are enough against Italy in a defensive war, and they cost a fraction of a line of battle."
 AUH_ref_tt_high_seas_school:0 "A line of battle must be voted by two delegations, and one of them speaks for a kingdom with a single port."
 AUH_ref_tt_lloyd:0 "The Austrian Lloyd sails out of Trieste on a state subsidy. In 1913 the port handled about 6,2 million tons of seaborne trade."
 AUH_ref_tt_seamen:0 "The crews come off the Dalmatian and Istrian coast. The fleet is manned by the two nationalities with the least say in what it is for."
 AUH_ref_tt_harbour_trieste:0 "Quays, cranes and the warehouse road. Trieste is the outlet for the whole Austrian half, and there is no second one."
 AUH_ref_tt_marinesektion:0 "The navy is a section of the common war ministry and not a ministry. It has no minister of its own to defend the estimate."
 AUH_ref_tt_delegations:0 "Sixty delegates in Vienna and sixty in Budapest, sitting apart and communicating in writing. Every keel has to pass both of them."
 AUH_ref_tt_monitors:0 "Armoured river craft for the Danube, which is the one water Budapest cares about and the only one the fleet can reach from there."
 AUH_ref_tt_torpedo_flotillas:0 "Small hulls carrying a torpedo can close a narrow sea for the price of one battleship's guns."
 AUH_ref_tt_whitehead:0 "Robert Whitehead built the first practical torpedo at Fiume. The Monarchy sells the weapon to every navy that may one day use it against her."
 AUH_ref_tt_fleet_at_home:0 "A fleet that never leaves the Adriatic is a fleet nobody has to argue about, and one that settles nothing either."
 AUH_ref_tt_montecuccoli:0 "Montecuccoli replaced Spaun in the autumn of 1904. By the spring of 1905 the programme reads twelve battleships, four armoured cruisers, eight scouts and six submarines."
 AUH_ref_tt_flottenverein:0 "A navy league makes the credits popular in towns that have never seen the sea. It also makes them impossible to cut afterwards."
 AUH_ref_tt_erzherzog_karl:0 "The Sankt Georg took four and a half years from keel to commission, from March 1901 to July 1905. That is the real rate of the yards."
 AUH_ref_tt_radetzky:0 "The Radetzky was laid down at the Stabilimento Tecnico on 26 November 1907, eleven months after the British Dreadnought entered service."
 AUH_ref_tt_price_of_keels:0 "Budapest paid for the dreadnoughts without haggling because one of them was to be built at Fiume. The fleet is bought by sharing out the yards."
 AUH_ref_tt_pola:0 "The war port at the head of the Istrian peninsula, where the armoured cruiser Sankt Georg was laid down in March 1901."
 AUH_ref_tt_cattaro:0 "A deep anchorage at the far end of the coast, with a mountain above it that belongs to somebody else."
 AUH_ref_tt_coastal_batteries:0 "Guns that answer the heights. They are cheaper than taking the heights and they do not solve the problem."
 AUH_ref_tt_lovcen:0 "Mount Lovcen looks down on the anchorage at Cattaro from Montenegrin ground. Taking it settles the harbour and opens a quarrel with Belgrade."
 AUH_ref_tt_stt:0 "The Stabilimento Tecnico Triestino builds the capital ships. It is an Austrian yard, and Budapest counts every crown that goes into it."
 AUH_ref_tt_submarines:0 "Six boats were the cheapest line in the programme of 1905 and the only one nobody argued about."
 AUH_ref_tt_mine_service:0 "Mines, nets and a barrage across the strait. It is the least glorious way of holding a sea and the one that works."
 AUH_ref_tt_fleet_two_states:0 "Two states, one flag, one estimate. The fleet is the only common institution whose bill arrives itemised."
 AUH_ref_tt_land_power:0 "Pay off the hulls and put the men in the Carpathians. Every crown in a battleship is a crown that is not in a mountain battery."
 AUH_ref_tt_adriatic:0 "A closed sea with two coasts, and the other coast belongs to the ally. Saying so out loud is the end of the alliance."

# --- the press ---------------------------------------------------------------------------------

 AUH_news_300_t:0 "VIENNA WRITES THE UNION INTO LAW"
 AUH_news_300_d:0 "The union of 1867 ceases to be a contract with a term. Fifty millions are declared one market by statute and the decennial negotiation is abolished. Budapest is told, in law, what it signed forty years ago."

 AUH_news_301_t:0 "TWO CUSTOMS TERRITORIES, ONE CROWN"
 AUH_news_301_d:0 "The settlement is read out as Budapest wishes it read: not one territory by nature but two, agreeing ten years at a time to raise no barrier. The common market now carries an expiry date on its face."

 AUH_news_302_t:0 "THE STATE BUYS THE SOUTHERN RAILWAY"
 AUH_news_302_d:0 "The line from Vienna to Trieste passes to the state with its paper. Against 150 million florins of shares stand 469,5 million of bonds, and the board that issued them sits in Paris. The road to the sea is in one hand."

 AUH_news_303_t:0 "THE ALPS PIERCED AT THREE POINTS"
 AUH_news_303_d:0 "Tauern, Karawanken and Wochein are driven through together: 8 370 metres under the Hohe Tauern and 7 976 under the Karawanken. Four thousand men worked the second bore and thirty-four of them did not come out of it."

 AUH_news_304_t:0 "THE APPROPRIATION GOES TO TRIESTE"
 AUH_news_304_d:0 "The free port takes the whole of it: the new basin, the warehouses and the Lloyd behind them. Hungary pays its quota share of a quay in a town where nobody speaks Hungarian, and has said so at every renewal."

 AUH_news_305_t:0 "THE CROWN OF SAINT STEPHEN GETS ITS SEA"
 AUH_news_305_d:0 "Fiume takes the appropriation. Detached from Croatia in 1868 for the Hungarian crown and fed by railway rebates that carry grain past Trieste, it moved 2,1 million tons in 1913 and stood tenth among the ports of Europe."

 AUH_news_306_t:0 "THE ARMY LAW PASSES AT LAST"
 AUH_news_306_d:0 "The annual intake, frozen by the law of 11 April 1889 at some 103 000 men, is raised for the first time in twenty-three years, and active service falls to two years. The population has grown by four millions meanwhile."

 AUH_news_307_t:0 "THE CROWN TAKES ITS RECRUITS BY ORDINANCE"
 AUH_news_307_d:0 "The recruit lists are filled without a vote of the Hungarian chamber. The comitats answer by refusing the tax and the men, and the administration of a kingdom stops obeying. Not a shot has been fired anywhere."

 AUH_news_308_t:0 "A PROGRAMME FOR A FLEET OF THE HIGH SEAS"
 AUH_news_308_d:0 "The new Marinekommandant sets down twelve battleships, four armoured cruisers, eight scouts, eighteen destroyers, thirty-six sea-going torpedo boats and six submarines. Two delegations must vote it, and one has a single port."

 AUH_news_309_t:0 "A NEW CLASS TAKES THE WAYS AT TRIESTE"
 AUH_news_309_d:0 "Three ships are laid down at the Stabilimento Tecnico, carrying a mixed battery eleven months after the British Dreadnought made mixed batteries obsolete. They are the last hulls the ordinary estimate will pay for."

 AUH_news_310_t:0 "VIENNA LOOKS UP AT THE BLACK MOUNTAIN"
 AUH_news_310_d:0 "The guns on Mount Lovcen stand above the anchorage at Cattaro, on Montenegrin ground. The Monarchy declares the position intolerable. Belgrade and Saint Petersburg are listening carefully."

 AUH_news_311_t:0 "A MONOPLANE FLIES AT WIENER NEUSTADT"
 AUH_news_311_d:0 "The Etrich II, called the Taube, takes the air at Wiener Neustadt in 1910. Its wing is copied from the seed of a climbing gourd, it was drawn in northern Bohemia, and the army has only just begun to invite tenders for aeroplanes."

 AUH_news_312_t:0 "THE ARMY WILL REMAIN COMMON AND UNITED"
 AUH_news_312_d:0 "At the manoeuvres at Chlopy in Galicia the Emperor publishes an order to his army: one language of command, one set of colours, and a service owed to both state territories and to neither of them alone. Budapest reads it as an answer."
