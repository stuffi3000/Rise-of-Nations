l_english:
 KOR_the_old_foundation:0 "The Old Foundation"
 KOR_the_old_foundation_desc:0 "An empire proclaimed in 1897, with its own calendar, its own coinage and its own treaties. It is sovereign in law and it has no army worth the name, no revenue it collects itself, and no friend who is not also a creditor."
 KOR_the_chefoo_telegram:0 "The Chefoo Telegram"
 KOR_the_chefoo_telegram_desc:0 "Declare neutrality before the shooting starts and mean it. The Russian mission stays, the telegraph stays Korean, and the war comes through here anyway."
 KOR_the_protocol_of_february:0 "The Protocol of February"
 KOR_the_protocol_of_february_desc:0 "Sign what is put in front of us. The country is crossed rather than conquered, the railways get built, and every clause is a precedent."
 KOR_the_emissaries_to_the_hague:0 "The Emissaries to The Hague"
 KOR_the_emissaries_to_the_hague_desc:0 "Three men with credentials the conference will not accept. They are refused admission, the story reaches every newspaper in Europe, and the emperor is made to pay for it."
 KOR_he_will_not_sign_the_abdication:0 "He Will Not Sign the Abdication"
 KOR_he_will_not_sign_the_abdication_desc:0 "Gojong refuses, and the Seoul garrison is not disbanded on the first of August. The regiments stay under arms, and everything after this is a different country."
 KOR_the_accession_of_sunjong:0 "The Accession of Sunjong"
 KOR_the_accession_of_sunjong_desc:0 "The son signs what the father would not. There is a coronation, there is a fortnight of calm, and the army is dissolved by ordinance."
 KOR_a_union_of_equals:0 "A Union of Equals"
 KOR_a_union_of_equals_desc:0 "Annexation by petition, dressed as a merger of two crowns. It buys the colonial regime a legitimacy it never had, and it costs the country the last argument it could have made in 1945."
 KOR_recall_the_independence_club:0 "With the Independence Club"
 KOR_recall_the_independence_club_desc:0 "Seo Jae-pil recalled, the assemblies reopened, a newspaper in han'gul that anyone can read. It is available on the first turn and it is the only road that does not begin with a foreign signature."
 KOR_the_righteous_armies_take_the_field:0 "The Righteous Armies Take the Field"
 KOR_the_righteous_armies_take_the_field_desc:0 "Disbanded soldiers, hunters, village elders and schoolmasters, in the hills of four provinces. They will not win, and they will never entirely stop."
 KOR_the_thirteen_provinces_march_on_seoul:0 "The Thirteen Provinces March on Seoul"
 KOR_the_thirteen_provinces_march_on_seoul_desc:0 "Ten thousand men converge on the capital and stop about twelve kilometres short of it. It fails by construction, and it is remembered for forty years."
 KOR_a_certificate_for_every_field:0 "A Certificate for Every Field"
 KOR_a_certificate_for_every_field_desc:0 "Register the land and tax it properly. The revenue is immediate and real, and so is a class of legal owners who were not the people farming it."
 KOR_two_instructors_in_one_barracks:0 "Two Instructors in One Barracks"
 KOR_two_instructors_in_one_barracks_desc:0 "A Russian mission and a Japanese mission, teaching the same regiment. Whichever one is kept, the cadre is somebody else's."
 KOR_the_marshals_office:0 "The Marshal's Office"
 KOR_the_marshals_office_desc:0 "A general staff of our own, and the first officers commissioned in this country without a foreign instructor signing the paper."
 KOR_the_yangmu:0 "The Yangmu"
 KOR_the_yangmu_desc:0 "One warship, bought abroad, coaled abroad, and manned by men trained abroad. It is a navy in the sense that a flag is a country."
 KOR_the_government_general:0 "The Government-General"
 KOR_the_government_general_desc:0 "A governor who is a serving general, a gendarmerie with judicial powers, and a press law. The empire is gone and everything it owned belongs to somebody else now."
 KOR_the_company_ordinance:0 "The Company Ordinance"
 KOR_the_company_ordinance_desc:0 "No Korean may found a company without permission. Permission is available and it is not often given, and there is nothing to be done about it."
 KOR_the_first_educational_ordinance:0 "The First Educational Ordinance"
 KOR_the_first_educational_ordinance_desc:0 "Four years of schooling, in Japanese, for those who can pay. It produces literate clerks the state needs and it produces them in somebody else's language."
 KOR_the_cadastral_survey:0 "The Cadastral Survey"
 KOR_the_cadastral_survey_desc:0 "Eight years of surveying, and title goes to whoever filed the paperwork. Possession for four hundred years is not paperwork."
 KOR_the_oriental_development_company:0 "The Oriental Development Company"
 KOR_the_oriental_development_company_desc:0 "The largest landowner in the country, and its accounts are settled in Tokyo."
 KOR_the_sinminhoe_underground:0 "The Sinminhoe Underground"
 KOR_the_sinminhoe_underground_desc:0 "Schools, a publishing house, a network of cells, and the hundred and five men who will be tried for a conspiracy that was invented."
 KOR_the_gando_settlements:0 "The Gando Settlements"
 KOR_the_gando_settlements_desc:0 "Two hundred thousand Koreans across the Tumen, farming land nobody quite governs. It is the only place a Korean army can be raised on Korean-speaking soil."
 KOR_sinheung_an_academy_of_our_own:0 "Sinheung, an Academy of Our Own"
 KOR_sinheung_an_academy_of_our_own_desc:0 "A military academy funded by Korean money, staffed by Korean officers, on land bought by Korean exiles. It is the only thing in fifty years that lowers the debt instead of adding to it."
 KOR_the_new_korean_village:0 "The New Korean Village"
 KOR_the_new_korean_village_desc:0 "Vladivostok. A press, a school, a militia, and a host government that will change its mind about all three."
 KOR_the_korean_national_association:0 "The Korean National Association"
 KOR_the_korean_national_association_desc:0 "San Francisco. It has money, it has newspapers, it has the ear of nobody in particular, and it is the only seat that will still exist in 1945."
 KOR_a_school_at_hastings:0 "A School at Hastings"
 KOR_a_school_at_hastings_desc:0 "Korean cadets drilling in a Nebraska field. It is small, it is ours, and it cannot on its own make the country self-taught."
 KOR_thirty_three_signatures:0 "Thirty-Three Signatures"
 KOR_thirty_three_signatures_desc:0 "A declaration read aloud in a Seoul restaurant, and two million people in the streets within a month. Seven thousand of them are killed and the provisional government is founded in Shanghai."
 KOR_an_army_not_a_petition:0 "An Army, Not a Petition"
 KOR_an_army_not_a_petition_desc:0 "Khabarovsk instead of Shanghai, a Soviet subsidy instead of a French concession, and rifles instead of a memorandum to the peace conference."
 KOR_fengwudong:0 "Fengwudong"
 KOR_fengwudong_desc:0 "The first Korean victory over a Japanese force since 1592, under a Korean flag. It is small, it is real, and the reprisal falls on the villages."
 KOR_qingshanli:0 "Qingshanli"
 KOR_qingshanli_desc:0 "Six days in the valleys of Jiandao and the second victory. There will not be a third, and the reprisal this time is counted in tens of thousands."
 KOR_the_bomb_at_hongkou:0 "The Bomb at Hongkou"
 KOR_the_bomb_at_hongkou_desc:0 "One man, one lunchbox, and a general killed at a garden party. Nanjing starts paying us the next week and Shanghai has to be abandoned."
 KOR_the_diplomacy_of_the_weak:0 "The Diplomacy of the Weak"
 KOR_the_diplomacy_of_the_weak_desc:0 "Keep the seat, keep the network, keep the concession, and be listened to by nobody at all."
 KOR_the_yeontongje:0 "The Yeontongje"
 KOR_the_yeontongje_desc:0 "A clandestine administration inside the country: county officers, couriers, and a tax that people pay to a government that does not exist."
 KOR_buy_korean:0 "Buy Korean"
 KOR_buy_korean_desc:0 "A movement with poor economics and excellent politics: it produces the only Korean commercial cadre that owes nothing to anyone."
 KOR_the_singanhoe:0 "The Singanhoe"
 KOR_the_singanhoe_desc:0 "Nationalists and socialists in one legal organisation, forty thousand members, and it works for exactly four years. It is the best that Korean politics manages under occupation."
 KOR_cultural_rule:0 "Cultural Rule"
 KOR_cultural_rule_desc:0 "Newspapers in Korean, associations, a civilian governor. Every one of them is genuine, and every one of them produces a list of names."
 KOR_the_rice_plan:0 "The Rice Plan"
 KOR_the_rice_plan_desc:0 "Production rises every year of the programme, and so does the number of Koreans eating millet."
 KOR_hungnam:0 "Hungnam"
 KOR_hungnam_desc:0 "The largest chemical works in Asia, built here because the Yalu makes the power cheap. It is genuinely ours to inherit, and that is exactly the trap."
 KOR_the_field_at_willows:0 "The Field at Willows"
 KOR_the_field_at_willows_desc:0 "A flying school in the Sacramento valley, funded by rice farmers. Its graduates are the only Korean pilots anybody has."
 KOR_naisen_ittai:0 "Naisen Ittai"
 KOR_naisen_ittai_desc:0 "Japan and Korea as one body. Real bonuses, real promotions, real careers, and a name change at the end of the paperwork."
 KOR_conscription_comes_to_chosen:0 "Conscription Comes to Chosen"
 KOR_conscription_comes_to_chosen_desc:0 "Not refusable and not avoidable. Two hundred thousand men in uniform under an oath sworn to another country, and the counter takes its largest single step of the game."
 KOR_retain_the_colonial_police:0 "Retain the Colonial Police"
 KOR_retain_the_colonial_police_desc:0 "They know the districts, they know the files, and they know who was in the hills. Control is restored within a week and the country notices exactly who restored it."
 KOR_the_separate_election:0 "The Separate Election"
 KOR_the_separate_election_desc:0 "An election in the south alone, recognition, equipment and a seat at the United Nations, and a partition that is meant to be temporary."
 KOR_the_alphabet_standardised:0 "The Alphabet Standardised"
 KOR_the_alphabet_standardised_desc:0 "One orthography, agreed by scholars, printed in dictionaries. It is cheap, it is quiet, and it will still be doing work in 1990."
 KOR_the_names_are_not_yours_to_change:0 "The Names Are Not Yours to Change"
 KOR_the_names_are_not_yours_to_change_desc:0 "Refuse the name ordinance, in the registry offices, one family at a time. The erosion stops where it is, and everyone who refused is on a list."
 KOR_the_committee_of_15_august:0 "The Committee of 15 August"
 KOR_the_committee_of_15_august_desc:0 "Build the state on the people's committees that already exist in every province. The counter does not rise a single point, and control takes two years instead of two weeks."
 KOR_pochonbo:0 "Pochonbo"
 KOR_pochonbo_desc:0 "A detachment, a border post and a burned police station. Militarily it is nothing. Politically it is a name that will be worth a country."
 KOR_the_korean_liberation_army:0 "The Korean Liberation Army"
 KOR_the_korean_liberation_army_desc:0 "Chongqing. A real army, small, and under Chinese operational command, which is a foreign command however friendly."
 KOR_the_volunteer_army_at_yanan:0 "The Volunteer Army at Yanan"
 KOR_the_volunteer_army_at_yanan_desc:0 "The largest of the three, and the oath is sworn to the Eighth Route Army. A foreign oath is a foreign oath."
 KOR_the_eighty_eighth_brigade:0 "The Eighty-Eighth Brigade"
 KOR_the_eighty_eighth_brigade_desc:0 "The smallest of the three, in Soviet uniform, and the only one that gets home in 1945 with a great power behind it."
 KOR_the_journey_north:0 "The Journey North"
 KOR_the_journey_north_desc:0 "No partition. Kim Ku goes to Pyongyang, the conference is held, and the country stays one at the price of being governed by whoever wins the argument."
 KOR_cotton_in_the_south_sheep_in_the_north:0 "Cotton in the South, Sheep in the North"
 KOR_cotton_in_the_south_sheep_in_the_north_desc:0 "Two agricultural programmes with opposite effects in opposite provinces, and the seam between them will be a border."
 KOR_the_manchurian_base:0 "The Manchurian Base"
 KOR_the_manchurian_base_desc:0 "Rail, roads and Yalu hydroelectricity, built to face north. It will still be there in 1950 and it will be facing the wrong way."
 KOR_the_special_volunteer_ordinance:0 "The Special Volunteer Ordinance"
 KOR_the_special_volunteer_ordinance_desc:0 "The uniform opens. A pool of trained Korean officers exists for the first time since 1907, and every one of them swore the oath."
 KOR_a_state_that_judged_itself:0 "A State That Judged Itself"
 KOR_a_state_that_judged_itself_desc:0 "Try them all. Sixty percent of the cadre goes, the administration staggers, the army has to be rebuilt from nothing, and the republic starts clean."
 KOR_we_need_them_more_than_justice:0 "We Need Them More Than Justice"
 KOR_we_need_them_more_than_justice_desc:0 "Try nobody. Nothing costs anything today, the counter locks where it stands, and the answer is permanent."
 KOR_arrest_the_famous_keep_the_useful:0 "Arrest the Famous, Keep the Useful"
 KOR_arrest_the_famous_keep_the_useful_desc:0 "The historical answer. A special committee, a list of the notorious, and a police raid on the committee itself nine months later."
 KOR_the_americans_go_home:0 "The Americans Go Home"
 KOR_the_americans_go_home_desc:0 "The advisory group leaves, the heavy equipment leaves with it, and the republic is diplomatically its own for the first time in half a century."
 KOR_the_constabulary_becomes_an_army:0 "The Constabulary Becomes an Army"
 KOR_the_constabulary_becomes_an_army_desc:0 "The focus that reads the counter. How many generals can be commissioned, and at what doctrine, depends entirely on who was allowed to keep serving."
 KOR_a_coast_guard_of_our_own:0 "A Coast Guard of Our Own"
 KOR_a_coast_guard_of_our_own_desc:0 "A patrol flotilla and a naval base. It is modest and it is the first Korean force afloat since the Yangmu."
 KOR_wings_of_the_republic:0 "Wings of the Republic"
 KOR_wings_of_the_republic_desc:0 "An air base and a training squadron, flown in large part by the men who learned it in a Californian orchard."
 KOR_idea_landlords_of_record:0 "Landlords of Record"
 KOR_idea_landlords_of_record_desc:0 "Whoever filed the certificate owns the field. Four hundred years of working it is not a filing."
 KOR_idea_military_rule:0 "Military Rule"
 KOR_idea_military_rule_desc:0 "A serving general governs, and the gendarmerie may try, sentence and flog without a court."
 KOR_idea_the_company_ordinance:0 "The Company Ordinance"
 KOR_idea_the_company_ordinance_desc:0 "No Korean firm exists without permission, and permission is a Japanese signature."
 KOR_idea_land_held_by_paper:0 "Land Held by Paper"
 KOR_idea_land_held_by_paper_desc:0 "The survey is complete, the titles are issued, and a great many families have discovered they are tenants."
 KOR_idea_a_harvest_that_leaves:0 "A Harvest That Leaves"
 KOR_idea_a_harvest_that_leaves_desc:0 "Production rises every year, and every year more of it is eaten somewhere else."
 KOR_idea_cultural_rule:0 "Cultural Rule"
 KOR_idea_cultural_rule_desc:0 "Newspapers, associations and a civilian governor. All of it real, and all of it a register."
 KOR_idea_they_kept_their_names:0 "They Kept Their Names"
 KOR_idea_they_kept_their_names_desc:0 "The registry offices were refused, family by family, and there is a list of everyone who refused."
 KOR_idea_a_base_facing_north:0 "A Base Facing North"
 KOR_idea_a_base_facing_north_desc:0 "Rail, power and chemicals, built for a war against the Soviet Union and inherited by somebody else."
 KOR_idea_the_unpunished:0 "The Unpunished"
 KOR_idea_the_unpunished_desc:0 "The police work, the army works, and the country knows precisely whose police and whose army they were."
 KOR_the_old_foundation_tt:0 "Opens the file: borrowed cadre 20, recognition 4, erosion 5."
 KOR_the_chefoo_telegram_tt:0 "Neutrality defended in arms. Recognition +1, and the war comes through anyway."
 KOR_the_protocol_of_february_tt:0 "The historical road. Infrastructure on the Seoul axis, and recognition -1."
 KOR_the_emissaries_to_the_hague_tt:0 "Recognition -1 on refusal of admission. The emperor pays for it within the month."
 KOR_he_will_not_sign_the_abdication_tt:0 "The army is not dissolved on the first of August, and the Seoul garrison stays under arms."
 KOR_the_accession_of_sunjong_tt:0 "Short-lived stability, and the disbandment ordinance follows."
 KOR_a_union_of_equals_tt:0 "Borrowed cadre +10, recognition -2, erosion +10. Annexation by petition, and no argument left for 1945."
 KOR_with_independence_club_tt:0 "Recognition +1. Available on the first turn, and the only road that does not start with a foreign signature."
 KOR_the_righteous_armies_take_the_field_tt:0 "Opens the permanent partisan pool in the four northern and eastern states."
 KOR_the_thirteen_provinces_march_on_seoul_tt:0 "It fails by construction, twelve kilometres short, and is remembered for forty years."
 KOR_a_certificate_for_every_field_tt:0 "Revenue now, and Landlords of Record for the rest of the game."
 KOR_two_instructors_in_one_barracks_tt:0 "Borrowed cadre +5 whichever mission is kept. The cadre is always somebody else's."
 KOR_the_marshals_office_tt:0 "Borrowed cadre -3. The first officers commissioned without a foreign signature."
 KOR_the_yangmu_tt:0 "Recognition +1 and a naval base at Chemulpo. One ship, bought abroad."
 KOR_the_government_general_tt:0 "Erosion +10. Military Rule installed, and every imperial idea removed."
 KOR_the_first_educational_ordinance_tt:0 "Borrowed cadre +3, erosion +8. An advisor slot, and literate clerks in another language."
 KOR_the_company_ordinance_tt:0 "Endured, and purely negative. No Korean firm without permission."
 KOR_the_cadastral_survey_tt:0 "Endured. Colonial revenue, and possession stops being proof of ownership."
 KOR_the_oriental_development_company_tt:0 "Two civilian factories whose product is paid to the overlord."
 KOR_the_sinminhoe_underground_tt:0 "Opens the interior network: three clandestine decisions at once, each one arrestable."
 KOR_the_gando_settlements_tt:0 "Opens the Gando seat. Host China, two clandestine decisions, survival tied to the host."
 KOR_sinheung_an_academy_of_our_own_tt:0 "Borrowed cadre -10, the largest fall in the game and the only one bought rather than granted."
 KOR_the_new_korean_village_tt:0 "Opens the Primorye seat. Host Russia and then the Soviet Union."
 KOR_the_korean_national_association_tt:0 "Recognition +1. Opens the American seat, the only one still standing in 1945."
 KOR_a_school_at_hastings_tt:0 "Borrowed cadre -2, and floored: it can never take the counter below 25."
 KOR_thirty_three_signatures_tt:0 "Recognition +1. The Shanghai seat, in the French concession, at three decisions."
 KOR_an_army_not_a_petition_tt:0 "Recognition -2. Khabarovsk, a Soviet subsidy, and rifles instead of a memorandum."
 KOR_fengwudong_tt:0 "Fifteen army experience. The first Korean victory under a Korean flag since 1592."
 KOR_qingshanli_tt:0 "Fifteen army experience, and the reprisal falls a second time and harder."
 KOR_the_bomb_at_hongkou_tt:0 "Recognition +1 from Nanjing, and Shanghai has to be abandoned."
 KOR_the_diplomacy_of_the_weak_tt:0 "Keeps the seat, the network and the concession, and obtains nothing at all."
 KOR_the_yeontongje_tt:0 "A clandestine revenue, collected inside the country by a government that does not exist."
 KOR_buy_korean_tt:0 "Borrowed cadre -4, erosion -5. A commercial cadre that owes nothing to anyone."
 KOR_the_singanhoe_tt:0 "Erosion -8. Nationalists and socialists in one organisation, for four years."
 KOR_cultural_rule_tt:0 "Borrowed cadre +4. Real freedoms, and a list of everyone who uses them."
 KOR_the_rice_plan_tt:0 "State agricultural output, and less food in the provinces that grow it."
 KOR_hungnam_tt:0 "Borrowed cadre +6. The largest chemical works in Asia, and genuinely ours to inherit."
 KOR_the_field_at_willows_tt:0 "Recognition +1, and the only Korean pilots anybody has."
 KOR_naisen_ittai_tt:0 "Borrowed cadre +8, erosion +15. Real bonuses now, and the central trap of the game."
 KOR_conscription_comes_to_chosen_tt:0 "Borrowed cadre +15 in one step. Not refusable and not avoidable."
 KOR_retain_the_colonial_police_tt:0 "Borrowed cadre +8, twenty points of stability. Control restored in a week by men everyone recognises."
 KOR_the_separate_election_tt:0 "Recognition +3. American recognition and materiel, a seat at the United Nations, and partition."
 KOR_the_alphabet_standardised_tt:0 "Erosion -10. Cheap, quiet, and still working in 1990."
 KOR_the_names_are_not_yours_to_change_tt:0 "Erosion capped at 30 for the rest of the game, and a permanent list of who refused."
 KOR_the_committee_of_15_august_tt:0 "The counter does not rise a single point, and control takes two years instead of two weeks."
 KOR_pochonbo_tt:0 "Militarily nothing. Politically a name that will be worth a country."
 KOR_the_korean_liberation_army_tt:0 "Borrowed cadre +4, recognition +1. A real army under Chinese operational command."
 KOR_the_volunteer_army_at_yanan_tt:0 "Borrowed cadre +6. The oath is sworn to the Eighth Route Army."
 KOR_the_eighty_eighth_brigade_tt:0 "Borrowed cadre +6. The smallest of the three, and the only one home in 1945 with a great power behind it."
 KOR_the_journey_north_tt:0 "No partition. The country stays one, governed by whoever wins the argument."
 KOR_cotton_in_the_south_sheep_in_the_north_tt:0 "Opposite effects in opposite provinces, and the seam between them will be a border."
 KOR_the_manchurian_base_tt:0 "Rail, roads and Yalu power, built facing north and inherited facing the wrong way."
 KOR_the_special_volunteer_ordinance_tt:0 "Borrowed cadre +12. A pool of trained Korean officers, every one of them sworn."
 KOR_a_state_that_judged_itself_tt:0 "Borrowed cadre -40. Sixty percent of the cadre goes, and the republic starts clean."
 KOR_we_need_them_more_than_justice_tt:0 "Nothing costs anything today. The counter locks where it stands, permanently."
 KOR_arrest_the_famous_keep_the_useful_tt:0 "Borrowed cadre -20. The historical answer, and the raid on the committee follows."
 KOR_the_americans_go_home_tt:0 "Recognition +1. Heavy equipment and logistical support leave with the advisory group."
 KOR_the_constabulary_becomes_an_army_tt:0 "Reads the counter: how many generals, and at what doctrine, depends on who was allowed to keep serving."
 KOR_a_coast_guard_of_our_own_tt:0 "A naval base and a patrol flotilla, the first Korean force afloat since the Yangmu."
 KOR_wings_of_the_republic_tt:0 "An air base, a training squadron and an air chief slot."
