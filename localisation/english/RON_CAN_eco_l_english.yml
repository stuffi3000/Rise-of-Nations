l_english:

 ### TRUNK A - THE GRAIN
 CAN_wheat_for_the_empire:0 "Wheat for the Empire"
 CAN_wheat_for_the_empire_desc:0 "The crop is sold at the Liverpool price and hauled east over Canadian rails to Canadian ports. The Empire is the customer, the tariff pays for the haul, and the west is told to be patient."
 CAN_wheat_for_the_continent:0 "Wheat for the Continent"
 CAN_wheat_for_the_continent_desc:0 "Minneapolis is nearer than Liverpool and pays cash. The grain runs south, the American elevators take the crop, and the country begins to face the way its rivers do."
 CAN_the_london_wheat_agreement:0 "The London Wheat Agreement"
 CAN_the_london_wheat_agreement_desc:0 "The four great exporters accept export quotas and the Europeans promise not to plough more. The price holds for a season. Our own stocks are already unsold."
 CAN_the_farmers_creditors_arrangement:0 "Farmers Creditors Arrangement"
 CAN_the_farmers_creditors_arrangement_desc:0 "A board may cut a farm debt by order and the mortgage holder must take what is left. The homestead stays with the family, and the lender learns that a contract is not sacred."
 CAN_the_dry_years:0 "The Dry Years"
 CAN_the_dry_years_desc:0 "Southern Saskatchewan yields under three bushels to the acre. Trains of hay and food come west from Ontario and whole districts live on relief. Many of those families never come back."

 ### TRUNK B - THE RAILS AND THE WORKS
 CAN_the_railway_commission:0 "The Railway Commission"
 CAN_the_railway_commission_desc:0 "A standing tribunal takes the freight rates out of the Cabinet. The western shipper gets a court to appeal to, and the minister loses the finest instrument of patronage in the country."
 CAN_the_railway_crisis:0 "The Railway Crisis"
 CAN_the_railway_crisis_desc:0 "London will not lend another shilling to the Canadian Northern or the Grand Trunk Pacific. Two transcontinentals in mid-construction now live on federal and provincial guarantees."
 CAN_the_national_factories:0 "The National Factories"
 CAN_the_national_factories_desc:0 "The board builds its own plants where private industry will not: forgings, acetone, aircraft, explosives. Works in every industrial town, and a wage bill the country has never seen."
 CAN_the_maritime_freight_rates:0 "The Maritime Freight Rates"
 CAN_the_maritime_freight_rates_desc:0 "The Duncan commission finds the Maritimes right: freight out of Halifax costs more than it should. A statutory rebate follows and the National Railways absorb the difference."
 CAN_the_duff_commission:0 "The Duff Commission"
 CAN_the_duff_commission_desc:0 "Mr Justice Duff refuses the merger with the Canadian Pacific that Montreal wants and orders the two systems to co-operate instead. The deficit stops growing; it does not go away."
 CAN_the_turner_valley_field:0 "Turner Valley"
 CAN_the_turner_valley_field_desc:0 "Royalite No. 4 blows in southwest of Calgary and opens the largest naphtha field in the Empire. The company takes the profit, Ottawa the royalty, and Alberta neither."
 CAN_the_national_broadcaster:0 "A Broadcaster of Our Own"
 CAN_the_national_broadcaster_desc:0 "London has ruled the air federal. A public network goes on in both languages, paid for by the whole country, and the private stations find themselves regulated by a competitor."
 CAN_the_branch_plant:0 "The Branch Plant"
 CAN_the_branch_plant_desc:0 "American capital passes British capital. The subsidiary works becomes the normal form of Canadian manufacturing, jumping the tariff wall that was built to keep it out."
 CAN_the_newsprint_giant:0 "First in Newsprint"
 CAN_the_newsprint_giant_desc:0 "The mills of Quebec, Ontario and British Columbia pass the United States in newsprint. The paper enters New York free of duty, and the towns that make it live on one customer."
 CAN_the_department_of_transport:0 "A Department of Transport"
 CAN_the_department_of_transport_desc:0 "Railways, canals, shipping and civil aviation come under one minister. The country stops being a set of favours to be handed out and becomes a system to be run."

 ### TRUNK C - THE MONEY AND THE TARIFF
 CAN_the_national_policy:0 "The National Policy"
 CAN_the_national_policy_desc:0 "The tariff is the ligament of Confederation: it makes the west buy from the St Lawrence and the St Lawrence pay for the rails. Every government since has kept it and complained of it."
 CAN_the_tariff_wall:0 "No Truck Nor Trade"
 CAN_the_tariff_wall_desc:0 "The schedules stay up and the preference goes to the Empire. Toronto and Montreal keep their protected market, the prairie farmer buys his binder at the protected price, and Washington is told no."
 CAN_the_road_south:0 "The Road South"
 CAN_the_road_south_desc:0 "Natural products cross free and the duties on manufactures come down by stages. The farmer and the fisherman gain ninety million customers; the manufacturer loses his rent and London its preference."
 CAN_leave_it_to_the_chartered_banks:0 "Leave It to the Banks"
 CAN_leave_it_to_the_chartered_banks_desc:0 "Ten chartered banks with branches everywhere, their own notes in every till, and no authority above them. When the harvest needs money the banks print it; when a bank fails the others decide."
 CAN_a_public_currency:0 "A Public Currency"
 CAN_a_public_currency_desc:0 "The note issue is a public thing and belongs to Parliament. Dominion notes are extended, the banks lose their privilege, and Ottawa acquires an instrument it will not know how to use for years."
 CAN_the_home_bank_failure:0 "The Home Bank"
 CAN_the_home_bank_failure_desc:0 "The doors close in Toronto and tens of thousands of small depositors, parishes and immigrant societies lose everything. The department had known the bank was insolvent since 1916."
 CAN_the_gold_standard_restored:0 "Back to Gold"
 CAN_the_gold_standard_restored_desc:0 "The dollar returns to gold and the wartime suspension ends. Creditors and the credit of the country gain; the last room for monetary manoeuvre is given away just before it is needed."
 CAN_the_dollar_leaves_gold:0 "The Dollar Leaves Gold"
 CAN_the_dollar_leaves_gold_desc:0 "London goes off gold in September and Ottawa follows. The dollar falls against the American without following the pound the whole way. The exporter breathes; the debtor in foreign money does not."
 CAN_the_macmillan_commission:0 "The Macmillan Commission"
 CAN_the_macmillan_commission_desc:0 "A royal commission on banking and currency reports by three votes to two. The two dissenters are the bankers. A central bank is recommended, and the recommendation cannot now be unmade."
 CAN_the_price_ceiling:0 "The Price Ceiling"
 CAN_the_price_ceiling_desc:0 "A general ceiling on prices, rents and wages administered from Ottawa. The cost of living is held for the rest of the war, and the wage half of the bargain produces the strikes that follow."
 CAN_bretton_woods:0 "Bretton Woods"
 CAN_bretton_woods_desc:0 "The Canadian plan was the bridge between the White plan and the Keynes plan, and the delegation takes a technical place at the centre of the new fund and bank. A middle power buys weight by being useful."
 CAN_the_british_loan:0 "The Loan to Britain"
 CAN_the_british_loan_desc:0 "A billion and a quarter at a reduced rate over fifty years, so that Britain can go on buying Canadian. Twelve million people finance their second market and the dollar reserves pay for it."

 ### IDEAS - TRUNK A
 CAN_eco_idea_the_liverpool_price:0 "The Liverpool Price"
 CAN_eco_idea_the_liverpool_price_desc:0 "The crop moves east to salt water over our own rails. The Empire buys, the haul is long, and the factories wait their turn behind the grain trains."
 CAN_eco_idea_the_minneapolis_price:0 "The Minneapolis Price"
 CAN_eco_idea_the_minneapolis_price_desc:0 "The grain runs south to the nearest buyer. Construction is cheap and quick along the border, and every year the east-west argument gets harder to make in London."
 CAN_eco_idea_the_soldiers_of_the_soil:0 "Soldiers of the Soil"
 CAN_eco_idea_the_soldiers_of_the_soil_desc:0 "Schoolboys and townsmen are sent to the harvest. The crop comes in and the same boys are then too useful on the land to be taken for the army."
 CAN_eco_idea_the_five_year_contract:0 "The Five Year Contract"
 CAN_eco_idea_the_five_year_contract_desc:0 "The grower signs away his crop for five years and takes an initial payment and a share of the average. Winnipeg loses a margin; the pool takes on a risk no state has guaranteed."
 CAN_eco_idea_the_record_crop:0 "The Record Crop"
 CAN_eco_idea_the_record_crop_desc:0 "The largest crop the country has ever taken off. The elevators, the railways and the growers all have one very good year, and the initial payment promised for the next one is already too high."
 CAN_eco_idea_the_export_quota:0 "The Export Quota"
 CAN_eco_idea_the_export_quota_desc:0 "We accept a limit on what we may sell in exchange for a price that holds. The bins stay full and the agreement will not survive the next harvest."
 CAN_eco_idea_the_farmers_creditors:0 "The Farmers Creditors"
 CAN_eco_idea_the_farmers_creditors_desc:0 "Debts are written down by administrative order. The farm survives, the family stays, and no lender in London or Toronto will look at a prairie mortgage the same way again."
 CAN_eco_idea_the_dry_years:0 "The Dry Years"
 CAN_eco_idea_the_dry_years_desc:0 "Topsoil in the ditches, Russian thistle for feed, relief for two thirds of some districts. The dry triangle empties northward and the exodus is not reversed."
 CAN_eco_idea_the_four_year_contract:0 "The Four Year Contract"
 CAN_eco_idea_the_four_year_contract_desc:0 "A guaranteed British buyer for four crops at a fixed price. Certainty for the grower and the elevator, and a price the world market will soon leave behind."

 ### IDEAS - TRUNK B
 CAN_eco_idea_the_blair_plan:0 "One Road Is Enough"
 CAN_eco_idea_the_blair_plan_desc:0 "The state extends what it already owns and helps one operator, not three. Several hundred millions are saved, the west keeps its single carrier, and the north waits."
 CAN_eco_idea_the_railway_commission:0 "The Railway Commission"
 CAN_eco_idea_the_railway_commission_desc:0 "Rates, tolls, crossings and express are settled by a tribunal. The shipper has a remedy at last and the Cabinet has one favour fewer to grant."
 CAN_eco_idea_the_railway_guarantees:0 "The Railway Guarantees"
 CAN_eco_idea_the_railway_guarantees_desc:0 "Ottawa and the provinces stand behind bonds that London will no longer take. The track keeps going down and the promoters keep the profit on lines that will never pay."
 CAN_eco_idea_the_national_factories:0 "The National Factories"
 CAN_eco_idea_the_national_factories_desc:0 "The board builds what nobody else will build and runs it on imperial account. Shell steel, acetone and aircraft, priced and directed from London."
 CAN_eco_idea_the_maritime_rates:0 "The Maritime Rates"
 CAN_eco_idea_the_maritime_rates_desc:0 "A permanent rebate on eastern freight. The Maritimes stay in Confederation without a party of their own, and the National Railways carry the cost for everyone."
 CAN_eco_idea_forced_cooperation:0 "Forced Co-operation"
 CAN_eco_idea_forced_cooperation_desc:0 "Two systems ordered to share what they can and compete in nothing. Duplication falls, the deficit is contained, and neither road will invest a dollar it does not have to."
 CAN_eco_idea_the_turner_valley_field:0 "Turner Valley"
 CAN_eco_idea_the_turner_valley_field_desc:0 "Naphtha, gas flared off into the night, and a field the Empire has nothing to match. The subsoil belongs to Ottawa, and Alberta is told so."
 CAN_eco_idea_the_national_broadcaster:0 "The National Broadcaster"
 CAN_eco_idea_the_national_broadcaster_desc:0 "Two networks, two languages, one country talking to itself for the first time. The listener in the west pays for programmes he did not ask for."
 CAN_eco_idea_the_branch_plant:0 "The Branch Plant"
 CAN_eco_idea_the_branch_plant_desc:0 "The works are here, the head office is not. Jobs in southern Ontario, decisions in Detroit and New York, and a protectionist argument turned against the men who made it."
 CAN_eco_idea_the_newsprint_giant:0 "First in Newsprint"
 CAN_eco_idea_the_newsprint_giant_desc:0 "The pulp towns of the Shield feed the American press. Stumpage fills provincial treasuries, and one bad year in New York empties them again."
 CAN_eco_idea_the_department_of_transport:0 "The Department of Transport"
 CAN_eco_idea_the_department_of_transport_desc:0 "Rail, canal, harbour and airfield answer to one desk. Works go up faster and a great deal of local influence is quietly removed from members of Parliament."
 CAN_eco_idea_the_aluminium_of_the_saguenay:0 "The Power of the Saguenay"
 CAN_eco_idea_the_aluminium_of_the_saguenay_desc:0 "Cheap current out of the rock, and aluminium enough for the air forces of three allies. The valley belongs to one company and one river."
 CAN_eco_idea_the_leduc_field:0 "The Leduc Field"
 CAN_eco_idea_the_leduc_field_desc:0 "Alberta stops being an agricultural province. The royalties go west, the capital and the drillers come from the south, and Ottawa loses a lever it did not know it had."

 ### IDEAS - TRUNK C
 CAN_eco_idea_the_national_policy:0 "The National Policy"
 CAN_eco_idea_the_national_policy_desc:0 "A wall of duties, a transcontinental railway and a Crown. The manufacturer is made, the prairie pays, and the customer abroad looks elsewhere."
 CAN_eco_idea_the_tariff_wall:0 "The Tariff Wall"
 CAN_eco_idea_the_tariff_wall_desc:0 "Protection kept and preference given to the Empire. Industry grows behind the wall, prices stay high, and there is little reason to invent anything nobody can import."
 CAN_eco_idea_the_road_south:0 "The Road South"
 CAN_eco_idea_the_road_south_desc:0 "Capital, machinery and method cross the line freely. The economy modernises quickly and the imperial connection becomes a sentiment rather than an account."
 CAN_eco_idea_the_chartered_banks:0 "The Chartered Banks"
 CAN_eco_idea_the_chartered_banks_desc:0 "Branch banking, private note issue and no lender of last resort. Credit is cheap for those who have it, and a bad season in the west is settled in Montreal."
 CAN_eco_idea_a_public_currency:0 "A Public Currency"
 CAN_eco_idea_a_public_currency_desc:0 "The note issue answers to Parliament. Public works can be financed at will, the banks are affronted, and every creditor abroad reads the statute twice."
 CAN_eco_idea_the_home_bank_failure:0 "The Home Bank Failure"
 CAN_eco_idea_the_home_bank_failure_desc:0 "Small savings gone, parishes ruined, and a minister who was warned seven years ago. Confidence in every small bank in the country goes with it."
 CAN_eco_idea_the_gold_standard:0 "Back to Gold"
 CAN_eco_idea_the_gold_standard_desc:0 "The dollar is convertible again and the credit of the country is beyond question. There is now no monetary answer to anything at all."
 CAN_eco_idea_off_gold:0 "Off Gold"
 CAN_eco_idea_off_gold_desc:0 "The dollar floats down against the American and the exporter can sell again. Anyone who borrowed abroad discovers what a depreciation costs."
 CAN_eco_idea_the_macmillan_report:0 "The Macmillan Report"
 CAN_eco_idea_the_macmillan_report_desc:0 "Three commissioners against two: the country needs a central bank. The report settles the argument and unsettles everyone who has to act on it."
 CAN_eco_idea_the_price_ceiling:0 "The Price Ceiling"
 CAN_eco_idea_the_price_ceiling_desc:0 "Prices, rents and wages held where they stand. The cost of living hardly moves for four years, and the men in the shops watch profits do what their wages may not."
 CAN_eco_idea_bretton_woods:0 "Bretton Woods"
 CAN_eco_idea_bretton_woods_desc:0 "A quota among the largest, a technical hand in the drafting, and a seat that is not owed to size. The system itself is designed in Washington."
 CAN_eco_idea_the_british_loan:0 "The Loan to Britain"
 CAN_eco_idea_the_british_loan_desc:0 "We lend our best customer the money to buy from us. Orders for the mills and the farms, and a hole in the reserves that will have to be closed the hard way."
 CAN_eco_idea_the_gordon_report:0 "The Gordon Report"
 CAN_eco_idea_the_gordon_report_desc:0 "A commission looks twenty-five years ahead and finds the country richer and less its own. Everyone reads it; nobody enjoys it."

 ### PRESS
 CAN_news_300_t:0 "THE CROP GOES TO LIVERPOOL"
 CAN_news_300_d:0 "Ottawa has settled the direction of the grain trade. The crop moves east over Canadian rails to Canadian ports and is sold on the British market. The prairie will be told that patience is a form of loyalty."
 CAN_news_301_t:0 "THE CROP GOES SOUTH"
 CAN_news_301_d:0 "The grain trade is turned toward the American market, where the buyer is nearer and pays cash. The east-west railway that Confederation was built around is now carrying somebody else's freight."
 CAN_news_302_t:0 "NO TRUCK NOR TRADE"
 CAN_news_302_d:0 "The tariff schedules stand and the preference goes to the Empire. The manufacturers of the St Lawrence keep their market; Washington is informed that the Dominion is not for sale."
 CAN_news_303_t:0 "THE BORDER COMES DOWN"
 CAN_news_303_d:0 "Natural products will cross free and the duties on manufactures come down by stages. The farmer and the fisherman gain a continental market, and the protected mills of the east are put on notice."
 CAN_news_304_t:0 "PARLIAMENT TAKES THE NOTE ISSUE"
 CAN_news_304_d:0 "The privilege of issuing money passes from the chartered banks to the Dominion. Public works may now be financed on a public account, and the banking houses of Montreal have lost an argument they thought settled."
 CAN_news_305_t:0 "THE DOMINION OWNS THE DEFICIT"
 CAN_news_305_d:0 "Two bankrupt transcontinentals and the Grand Trunk are taken over and welded into a single national system. The shareholders are paid; the taxpayer inherits the mileage and the interest bill."
 CAN_news_306_t:0 "A BANK FOR THE DOMINION"
 CAN_news_306_d:0 "The country has a central bank at last, with the note issue, the rate and the reserves in one place. Whether it answers to Parliament or to its shareholders is the next quarrel."
 CAN_news_307_t:0 "OTTAWA CHOOSES THE EMPIRE"
 CAN_news_307_d:0 "A dozen bilateral agreements bind the Dominions and Britain into a preferential bloc. Canadian wheat and timber gain a guaranteed buyer, and Washington draws its own conclusions about where Ottawa stands."
 CAN_news_308_t:0 "THREE BUSHELS TO THE ACRE"
 CAN_news_308_d:0 "The drought in the southern prairie has reached its worst season. Relief trains of hay and food are moving west from Ontario, and whole townships are being kept alive at public expense."
 CAN_news_309_t:0 "THE ARSENAL OF ELEVEN MILLIONS"
 CAN_news_309_d:0 "Canadian war production now stands among the greatest of the United Nations, from a country of eleven and a half million. The men who remember 1919 are already asking what happens when the orders stop."
