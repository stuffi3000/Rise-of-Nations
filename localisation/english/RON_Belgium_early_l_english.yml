l_english:
 BEL_the_treaty_of_1839:0 "The Treaty of 1839"
 BEL_the_treaty_of_1839_desc:0 "Five powers undertook that no army would cross this country. It has worked for sixty years, it costs nothing to maintain, and it is the reason we have almost no army of our own."
 BEL_no_conversations_with_staffs:0 "No Conversations with Staffs"
 BEL_no_conversations_with_staffs_desc:0 "A neutral that plans with one side has stopped being neutral, and the paper is worth exactly as much as our reputation for meaning it."
 BEL_the_barnardiston_conversations:0 "The Barnardiston Conversations"
 BEL_the_barnardiston_conversations_desc:0 "Talks with a British colonel about what would happen if. They are informal, they are deniable, and when Berlin learns of them the guarantee is worth twelve points less."
 BEL_the_question_of_language:0 "The Question of Language"
 BEL_the_question_of_language_desc:0 "The state, the courts, the officer corps and the university all work in French, and rather more than half the country does not."
 BEL_the_plural_vote:0 "The Plural Vote"
 BEL_the_plural_vote_desc:0 "Extra votes for property, for a degree, for a family. It keeps the Catholic majority in place until 1918 and it tells four million people what their vote is worth."
 BEL_one_man_one_vote:0 "One Man, One Vote"
 BEL_one_man_one_vote_desc:0 "Equal suffrage now rather than after a war. It closes eight points of the fracture and it ends the majority that has governed since 1884."
 BEL_the_belts_of_brialmont:0 "The Belts of Brialmont"
 BEL_the_belts_of_brialmont_desc:0 "Rings of forts at Liege, Namur and Antwerp, the best in Europe when the concrete was poured. Nobody has yet built the gun that will be fired at them."
 BEL_the_lottery_and_the_substitute:0 "The Lottery and the Substitute"
 BEL_the_lottery_and_the_substitute_desc:0 "Draw a bad number and pay a poorer man to go instead. It is popular, it keeps the peace between the two halves of the country, and it leaves the forts undermanned."
 BEL_a_son_from_every_household:0 "A Son from Every Household"
 BEL_a_son_from_every_household_desc:0 "One conscript per family, no substitutes. The army becomes real, the guarantee is worth less because we look like we intend to use it, and the Flemish conscript is drilled in French."
 BEL_the_holdings:0 "The Holdings"
 BEL_the_holdings_desc:0 "Societe Generale and its rivals own the banks, the tramways, the mines and the mills. It builds fast, it decides quickly, and it will not retool for a war that has not been declared."
 BEL_the_coal_and_the_steel:0 "The Coal and the Steel"
 BEL_the_coal_and_the_steel_desc:0 "The Sambre-Meuse valley, and the densest industry on the continent per square kilometre. It is all in one place and it is all Walloon."
 BEL_the_capital_that_travels:0 "The Capital That Travels"
 BEL_the_capital_that_travels_desc:0 "Belgian money builds tramways in Cairo, railways in Manchuria and mines in the Urals. It earns very well abroad and it builds nothing at home."
 BEL_the_kings_private_empire:0 "The King's Private Empire"
 BEL_the_kings_private_empire_desc:0 "The Congo Free State belongs to Leopold personally, not to Belgium. The country has an empire it does not own and cannot answer for."
 BEL_the_commission_of_inquiry:0 "The Commission of Inquiry"
 BEL_the_commission_of_inquiry_desc:0 "Send our own magistrates and publish what they find. It answers Morel and Casement in the only currency they accept, and it confirms half of what they alleged."
 BEL_take_the_kings_congo:0 "Take the King's Congo"
 BEL_take_the_kings_congo_desc:0 "Parliament annexes the Free State. The rubber, the copper and the Force Publique become Belgian, and so does everything that was done to obtain them."
 BEL_leave_it_to_the_king:0 "Leave It to the King"
 BEL_leave_it_to_the_king_desc:0 "Let the crown keep it and the treasury keep its distance. No Katanga, no Shinkolobwe, no colonial army, and no questions in the chamber."
 BEL_the_colonial_charter:0 "The Colonial Charter"
 BEL_the_colonial_charter_desc:0 "A separate colonial budget with its own accounts. The Congo may not fund the metropolitan army, however badly the metropolitan army needs funding."
 BEL_the_kings_own_purse:0 "The King's Own Purse"
 BEL_the_kings_own_purse_desc:0 "The crown pays for the forts out of Congolese revenue and nobody votes on it. It is fast, it is unaccountable, and it is exactly the habit that will matter in 1940."
 BEL_free_of_the_guarantee:0 "Free of the Guarantee"
 BEL_free_of_the_guarantee_desc:0 "Versailles releases Belgium from compulsory neutrality. We may join whom we like, and nobody is any longer obliged to come when we call."
 BEL_the_accord_of_foch:0 "The Accord of Foch"
 BEL_the_accord_of_foch_desc:0 "A military convention with France: shared plans, coordinated fortification, reparations coal. Berlin reads it as an alliance, because it is one."
 BEL_no_entangling_staff_talks:0 "No Entangling Staff Talks"
 BEL_no_entangling_staff_talks_desc:0 "Independence policy. Twenty points of guarantee recovered, no German grievance available over the Ruhr, and not one plan agreed with anybody."
 BEL_locarno:0 "Locarno"
 BEL_locarno_desc:0 "Four powers guarantee the western frontier and mean it this time. It is worth twelve points, and it caps what our own army may be."
 BEL_the_cantons_of_the_east:0 "The Cantons of the East"
 BEL_the_cantons_of_the_east_desc:0 "Eupen and Malmedy, annexed after a consultation nobody calls a plebiscite. Germany will want them back and will say so in every decade."
 BEL_the_university_of_ghent:0 "The University of Ghent"
 BEL_the_university_of_ghent_desc:0 "A full university teaching in Dutch. It is the single demand that has been refused longest and it closes ten points of the fracture on its own."
 BEL_the_territorial_principle:0 "The Territorial Principle"
 BEL_the_territorial_principle_desc:0 "Language follows the ground, not the person: Dutch in Flanders, French in Wallonia, both in Brussels. It is the largest single repair available, and it means two of everything for ever."
 BEL_one_state_one_language:0 "One State, One Language"
 BEL_one_state_one_language_desc:0 "French for the state, the courts and the army, and no exceptions. It is efficient, it is coherent, and it hands the Flemish nationalists their entire programme."
 BEL_forward_on_the_meuse:0 "Forward on the Meuse"
 BEL_forward_on_the_meuse_desc:0 "Fortify the eastern frontier and hold everything. It is what the country expects, and a wall facing only one way is not a neutral's wall."
 BEL_the_short_line:0 "The Short Line"
 BEL_the_short_line_desc:0 "Antwerp-Namur, concentrated and holdable. It works, and it means writing off Liege and the eastern cantons on paper before a shot is fired."
 BEL_the_albert_canal:0 "The Albert Canal"
 BEL_the_albert_canal_desc:0 "A waterway and an anti-tank ditch in one, dug by the unemployed. It is the best value in the interwar budget."
 BEL_the_devastated_regions:0 "The Devastated Regions"
 BEL_the_devastated_regions_desc:0 "The Yser front is a moonscape and the whole of it has to be rebuilt at once. The budget will not recover for a decade."
 BEL_reparations_in_coal:0 "Reparations in Coal"
 BEL_reparations_in_coal_desc:0 "German coal and steel, delivered on schedule, for three years. Industry adapts to it, which is the problem."
 BEL_the_ruhr_expedition:0 "The Ruhr Expedition"
 BEL_the_ruhr_expedition_desc:0 "Go in with the French and take the coal ourselves. It works, and it is the grievance every German government will cite for twenty years."
 BEL_the_belga:0 "The Belga"
 BEL_the_belga_desc:0 "A new currency at a seventh of the old franc. Industry recovers within a year and every saver in the country has been quietly expropriated."
 BEL_the_mandate_of_ruanda_urundi:0 "The Mandate of Ruanda-Urundi"
 BEL_the_mandate_of_ruanda_urundi_desc:0 "A League mandate on the highlands, administered from Leopoldville. It comes with people, coffee and an obligation to report."
 BEL_idea_the_guarantee_of_1839:0 "The Guarantee of 1839"
 BEL_idea_the_guarantee_of_1839_desc:0 "Five powers undertook to keep armies off this soil, and for as long as the paper holds nobody here needs an army of their own."
 BEL_idea_the_habit_of_being_guaranteed:0 "The Habit of Being Guaranteed"
 BEL_idea_the_habit_of_being_guaranteed_desc:0 "The guarantee is gone. Forty years of relying on it are not."
 BEL_idea_no_conversations:0 "No Conversations"
 BEL_idea_no_conversations_desc:0 "No joint plan with anybody, ever, and no way to agree one later at short notice."
 BEL_idea_unreinforced_concrete:0 "Unreinforced Concrete"
 BEL_idea_unreinforced_concrete_desc:0 "The best forts in Europe when they were poured. The shells that will be fired at them have not been designed yet."
 BEL_idea_government_by_holding:0 "Government by Holding"
 BEL_idea_government_by_holding_desc:0 "The banks own the industry and the industry does what the banks decide, quickly, and never towards armaments."
 BEL_idea_the_colonial_charter:0 "The Colonial Charter"
 BEL_idea_the_colonial_charter_desc:0 "A separate colonial budget. The Congo may not fund the metropolitan army, whatever the army needs."
 BEL_idea_locarno:0 "Locarno"
 BEL_idea_locarno_desc:0 "Four guarantors, and an army that may not exceed what four guarantors think a guaranteed country needs."
 BEL_idea_two_administrations_one_state:0 "Two Administrations, One State"
 BEL_idea_two_administrations_one_state_desc:0 "Everything twice, in two languages, for ever. It is the price of a country that stays one."
 BEL_idea_reparations_in_coal:0 "Reparations in Coal"
 BEL_idea_reparations_in_coal_desc:0 "Three good years, and a dependency that will be discovered on the day the deliveries stop."
 BEL_idea_the_rentiers_grievance:0 "The Rentiers' Grievance"
 BEL_idea_the_rentiers_grievance_desc:0 "Industry is recovering and every saver in Belgium has paid for it without being asked."
 BEL_the_treaty_of_1839_tt:0 "Opens the ledger: guarantee 85, fracture 30, crown exposure 0. Factions are barred while the guarantee holds."
 BEL_no_conversations_with_staffs_tt:0 "Guarantee +6. Joint plans are barred permanently, and planning speed falls a tenth."
 BEL_the_barnardiston_conversations_tt:0 "Guarantee -12. Shared plans with Britain, and fifteen army experience."
 BEL_the_question_of_language_tt:0 "Opens the fracture at 30 and replaces the static language idea with the counter."
 BEL_the_plural_vote_tt:0 "Fracture +4 and ten points of stability. Suffrage is locked until 1918."
 BEL_one_man_one_vote_tt:0 "Fracture -8, stability -12, and the Catholic majority ends early."
 BEL_the_belts_of_brialmont_tt:0 "Two fort levels at Liege, Namur and Antwerp, and Unreinforced Concrete with them."
 BEL_the_lottery_and_the_substitute_tt:0 "Guarantee +4, fracture -6, stability +8. The conscription ceiling stays shut."
 BEL_a_son_from_every_household_tt:0 "Guarantee -5, fracture +8. Real manpower, drilled in a language half of it does not speak."
 BEL_the_holdings_tt:0 "Fifteen percent on civilian construction, and Government by Holding for the rest of the game."
 BEL_the_coal_and_the_steel_tt:0 "Fracture +4. Two military factories and the densest industry on the continent, all of it in one half of the country."
 BEL_the_capital_that_travels_tt:0 "Political power and foreign opinion, at twenty percent off domestic infrastructure."
 BEL_the_kings_private_empire_tt:0 "Crown exposure +15. The country has an empire it does not own and cannot answer for."
 BEL_the_commission_of_inquiry_tt:0 "Crown exposure -5 and ten points of stability spent. The report confirms half the allegations."
 BEL_take_the_kings_congo_tt:0 "Crown exposure -15. The rubber, the copper and the Force Publique become Belgian, and so does the record."
 BEL_leave_it_to_the_king_tt:0 "Crown exposure +10 and ten points of stability. No Katanga, no Shinkolobwe, no colonial army."
 BEL_the_colonial_charter_tt:0 "Colonial resources and manpower, and the Congo may not fund the metropolitan army."
 BEL_the_kings_own_purse_tt:0 "Crown exposure +10. Fortification paid for without a vote, which is a habit as much as a budget."
 BEL_free_of_the_guarantee_tt:0 "Factions become available. The Guarantee of 1839 becomes The Habit of Being Guaranteed."
 BEL_the_accord_of_foch_tt:0 "Guarantee -25. Shared plans with France, coordinated fortification and reparations coal."
 BEL_no_entangling_staff_talks_tt:0 "Guarantee +20, fracture -12. No German grievance over the Ruhr, and no plan with anyone."
 BEL_locarno_tt:0 "Guarantee +12 and the opinion of all four guarantors, at a hard cap on the army."
 BEL_the_cantons_of_the_east_tt:0 "Guarantee -8. Eupen and Malmedy annexed, and a permanent German claim on them."
 BEL_the_university_of_ghent_tt:0 "Fracture -10 and a research slot, at six points of stability among French speakers."
 BEL_the_territorial_principle_tt:0 "Fracture -25, the largest single repair in the game, and two administrations for ever."
 BEL_one_state_one_language_tt:0 "Fracture +30. Administrative efficiency and army cohesion, and the Flemish nationalists get their programme."
 BEL_forward_on_the_meuse_tt:0 "Guarantee -8. Three fort levels on the eastern frontier: a wall facing one way."
 BEL_the_short_line_tt:0 "Fracture +10. Concentration on Antwerp-Namur, and Liege and the cantons written off on paper."
 BEL_the_albert_canal_tt:0 "Infrastructure and an anti-tank ditch in one, dug by the unemployed."
 BEL_the_devastated_regions_tt:0 "The Yser infrastructure malus is lifted, at a decade of budget."
 BEL_reparations_in_coal_tt:0 "Coal and steel for three years, and an industry that adapts to having them."
 BEL_the_ruhr_expedition_tt:0 "Guarantee -15. Coal and steel taken, and the grievance every German government will cite."
 BEL_the_belga_tt:0 "The inflation malus is removed and fifteen percent added to industry, paid for by every saver in the country."
 BEL_the_mandate_of_ruanda_urundi_tt:0 "Colonial manpower and resources, and an obligation to report on both."
