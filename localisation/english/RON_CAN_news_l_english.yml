 can_news.1.t:0 "[GetCANNewsTitle]"
 can_news.1.d:0 "[GetCANNewsBody]"
 can_news.1.a:0 "Set it for the Ottawa edition."
 can_news.2.t:0 "[GetCANNewsTitle]"
 can_news.2.d:0 "[GetCANNewsBody]"
 can_news.2.a:0 "The cable carries it both ways."
 can_news.3.t:0 "[GetCANNewsTitle]"
 can_news.3.d:0 "[GetCANNewsBody]"
 can_news.3.a:0 "It goes out on the wires."
 can_news.h.t:0 "Press Gallery"
 can_news.h.d:0 "Copy goes up to the papers."

 CAN_news_901_t:0 "The Boundary Goes to Washington"
 CAN_news_901_d:0 "Lord Alverstone joins the three Americans, four votes to two. The heads of the Lynn Canal stay American; Canada keeps Pearse and Wales islands. Jette and Aylesworth refuse to sign, which changes nothing in law."

 CAN_news_901_eng_t:0 "The Alaska Award"
 CAN_news_901_eng_d:0 "The tribunal keeps the friendship of Washington, and the account is charged to Ottawa, which was never a party to the Hay-Herbert convention and could not have been."

 CAN_news_901_usa_t:0 "The Inlets Are Ours"
 CAN_news_901_usa_d:0 "Skagway and Dyea stay American. The British member voted with the three Americans, and the two Canadian commissioners refused to put their names to the award."

 CAN_news_902_t:0 "A Navy of Our Own, of a Sort"
 CAN_news_902_d:0 "Royal assent to the Naval Service Act: a naval service, a ministry, a naval college, eleven ships promised at some three million a year, and a clause letting the governor in council hand the fleet to the Admiralty in an emergency."

 CAN_news_902_eng_t:0 "Ottawa Votes Ships, Not Money"
 CAN_news_902_eng_d:0 "Sir Wilfrid offers cruisers under his own flag where the Admiralty asked for a cheque. The emergency clause is there, but the decision to use it stays in Ottawa."

 CAN_news_903_t:0 "No Truck Nor Trade With The Yankees"
 CAN_news_903_d:0 "Laurier falls after fifteen years. Ontario voted against the reciprocity agreement and Quebec against his naval law: the same man is thrown out as too American in one province and too imperial in the other. Borden takes office on the tenth."

 CAN_news_903_usa_t:0 "Reciprocity Beaten At The Polls"
 CAN_news_903_usa_d:0 "The agreement Mr. Fielding brought back from Washington dies in Ottawa without ever coming to a vote. Mr. Clark's talk of annexation cost it more than any tariff man in Toronto could."

 CAN_news_904_t:0 "Conscription Receives Royal Assent"
 CAN_news_904_d:0 "The Military Service Act: men of twenty to forty-five called by class, unmarried men and childless widowers of twenty to thirty-four first, with local exemption tribunals. Laurier will not follow the government and the party breaks in two."

 CAN_news_905_t:0 "The Mounted Police Clear Main Street"
 CAN_news_905_d:0 "Ten strike leaders were taken from their beds in the night of the seventeenth. On Saturday the mounted police charged a silent crowd on Main Street and fired: two dead, about thirty hurt. Six weeks of it end on the twenty-fifth."

 CAN_news_906_t:0 "Signed By Canada Alone"
 CAN_news_906_d:0 "Ernest Lapointe signs the North Pacific halibut convention at Washington with Charles Evans Hughes, and nobody else. Sir Auckland Geddes does not counter-sign: Ottawa insisted and London gave way. A fish treaty, and a constitutional fact."

 CAN_news_906_eng_t:0 "A Dominion Signs Without Us"
 CAN_news_906_eng_d:0 "The ambassador at Washington is told to stand aside while a colonial minister signs for the Crown. The indivisible Crown survives on paper and nowhere else. Dublin is watching, and so is Pretoria."

 CAN_news_906_usa_t:0 "Ottawa Comes To The Table By Itself"
 CAN_news_906_usa_d:0 "Secretary Hughes signs opposite a Canadian minister with no British ambassador in the room. The dominion has given away its own protection: from here on it faces us alone, from the salmon to the St. Lawrence."

 CAN_news_906_dom_t:0 "If Canada, Why Not Us"
 CAN_news_906_dom_d:0 "The precedent is the whole of the news. If Ottawa may negotiate and sign a treaty of its own without the Foreign Office, then so may Melbourne, Wellington, Pretoria and Dublin, and the Imperial Conference has a new agenda."

 CAN_news_907_t:0 "The Statute of Westminster Is Law"
 CAN_news_907_d:0 "Acts of the British Parliament cease to bind the Dominions without their consent, and their parliaments may legislate beyond their own shores. Section 7 leaves the British North America Acts at Westminster, as the provinces asked."

 CAN_news_907_eng_t:0 "Parliament Legislates Away Its Power"
 CAN_news_907_eng_d:0 "What remains between the Dominions and this House is a common allegiance to the Crown and the courtesy of consultation. The one exception in the text was asked for by the Canadian provinces, and it concerns their own constitution."

 CAN_news_907_dom_t:0 "The Statute Binds Us Too"
 CAN_news_907_dom_d:0 "The Dominions gain the freedom Canada spent thirty years asking for, and inherit its question with it: who amends our constitutions now, and does a declaration of war in London still mean a declaration of war here."

 CAN_news_908_t:0 "Ottawa Disowns Its Own Delegate"
 CAN_news_908_d:0 "At Geneva, Walter Riddell moved that oil, coal, iron and steel be added to the sanctions on Italy, and the papers called it the Canadian proposal. Lapointe now says it bound nobody but its author."

 CAN_news_909_t:0 "King And Roosevelt Agree At Ogdensburg"
 CAN_news_909_d:0 "A permanent joint board on defence, settled at Ogdensburg in northern New York and put out as a joint statement. A dominion at war and a neutral republic tie their defence together, and London was not consulted first."

 CAN_news_910_t:0 "Newfoundland Becomes The Tenth Province"
 CAN_news_910_d:0 "Under the Terms of Union signed in December, some three hundred and forty-five thousand people enter Confederation with family allowances, pensions and unemployment insurance, and give up their customs, their civil service and their fisheries."

 CAN_news_fallback_t:0 "From the East Block"
 CAN_news_fallback_d:0 "External Affairs confirms the report and adds nothing to it. The country papers will have the particulars by the end of the week."

