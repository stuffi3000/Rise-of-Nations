###############################################################################################################################
# Austria-Hungary - the family of nationalities, column A : the German Austrians and the Magyars.
# Lot L1. Every key below is new; none of them exists anywhere else in the loaded English localisation.
###############################################################################################################################

# --- THE GERMAN AUSTRIANS -----------------------------------------------------------------------

 AUHNAT_AUS_the_german_austrians:0 "The German Austrians"
 AUHNAT_AUS_the_german_austrians_desc:0 "A third of the Reichsrat lands, and very nearly all of its ministries, courts and officers. They do not think of themselves as a nationality; they think of themselves as the state."

 AUHNAT_AUS_the_german_besitzstand:0 "The German Besitzstand"
 AUHNAT_AUS_the_german_besitzstand_desc:0 "Badeni's language ordinances of 1897 brought riots and his own fall, and Clary-Aldringen repealed them in 1899. The German hold on the administration now rests on possession alone."

 AUHNAT_AUS_the_social_democratic_bargain:0 "The Social Democratic Bargain"
 AUHNAT_AUS_the_social_democratic_bargain_desc:0 "Adler's party recruits in every language of the Monarchy, and it is the only one that does. Leaning on it buys a governable Cisleithania, and pays in German primacy and the alliance with the court right."

 AUHNAT_AUS_rule_by_paragraph_fourteen:0 "Rule by Paragraph 14"
 AUHNAT_AUS_rule_by_paragraph_fourteen_desc:0 "Article 14 lets Koerber legislate by ordinance while the Reichsrat is not sitting, and he carries the budget itself that way. The state keeps working; the parliament becomes scenery."

 AUHNAT_AUS_los_von_rom:0 "Los von Rom"
 AUHNAT_AUS_los_von_rom_desc:0 "Schoenerer preaches conversion to Protestantism as an act of German loyalty against a Catholic dynasty. It is an identity secession, and the House loses its claim on that loyalty."

 AUHNAT_AUS_luegers_vienna:0 "Luegers Vienna"
 AUHNAT_AUS_luegers_vienna_desc:0 "Mayor since 1897, after Franz Joseph refused three times to confirm him. His machine runs the capital on municipal ownership and open antisemitism alike."

 AUHNAT_AUS_the_party_of_all_the_tongues:0 "The Party of All the Tongues"
 AUHNAT_AUS_the_party_of_all_the_tongues_desc:0 "The Social Democrats organise in every language the Monarchy contains, and the union commission in Vienna speaks for Trieste, Lemberg and Reichenberg at once."

 AUHNAT_AUS_the_municipal_undertakings:0 "The Municipal Undertakings"
 AUHNAT_AUS_the_municipal_undertakings_desc:0 "The gasworks bought out from the English, the electric works, the tramways, the water main from the Hochschwab. The city is governed better than the empire."

 AUHNAT_AUS_the_koerber_conferences:0 "The Conciliation Conferences"
 AUHNAT_AUS_the_koerber_conferences_desc:0 "In 1900 Koerber sits the German and Czech deputies of Bohemia down to agree a language settlement. They do not. But the Czechs remember the invitation."

 AUHNAT_AUS_the_schulverein:0 "The German School Association"
 AUHNAT_AUS_the_schulverein_desc:0 "Founded in 1880 to pay for German schools where the local authority will not: a private body doing a state task. Its Czech counterpart works the same villages."

 AUHNAT_AUS_the_ring_demonstration:0 "The Demonstration on the Ring"
 AUHNAT_AUS_the_ring_demonstration_desc:0 "On 28 November 1905 some two hundred thousand march the Ringstrasse for the franchise, with St Petersburg fresh in every mind. The troops stay in barracks, and a suffrage bill follows in ten weeks."

 AUHNAT_AUS_the_christian_social_party:0 "The Christian Social Party"
 AUHNAT_AUS_the_christian_social_party_desc:0 "Fused with the Catholic conservatives of the Alpine lands, they are the largest German formation in the empire. They understood first that a wide franchise rewards a parish network."

 AUHNAT_AUS_government_by_ordinance:0 "Government by Ordinance"
 AUHNAT_AUS_government_by_ordinance_desc:0 "Estimates, recruit credits and commercial treaties carried by decree while the chamber is prorogued. Every party learns that obstruction costs nothing."

 AUHNAT_AUS_the_german_state_language:0 "German as the Language of State"
 AUHNAT_AUS_the_german_state_language_desc:0 "Not parity, but a declaration that the inner service of the empire is conducted in German. It settles the language question by deciding it, and tells eight peoples what their place is."

 AUHNAT_AUS_universal_manhood_suffrage:0 "Universal Manhood Suffrage"
 AUHNAT_AUS_universal_manhood_suffrage_desc:0 "Sanctioned 26 January 1907: every adult man, five hundred and sixteen seats. Franz Joseph backed it to drown the national parties that had blocked the Reichsrat for a decade. The fracture is not removed, only reproduced inside every party."

 AUHNAT_AUS_the_kaisertreu_wing:0 "The Kaisertreu Wing"
 AUHNAT_AUS_the_kaisertreu_wing_desc:0 "The half of the Christian Socials that means what it says about the dynasty: Catholic, Austrian, wary of Berlin, and quarrelling with its own nationalists."

 AUHNAT_AUS_the_curial_franchise_forever:0 "The Curias Kept"
 AUHNAT_AUS_the_curial_franchise_forever_desc:0 "Great landowners, chambers of commerce, towns, rural communes: four electorates, and a chamber that can be counted before it votes. Every nationality outside the curias learns the empire is not for them."

 AUHNAT_AUS_the_alldeutsche_verband:0 "The Pan-German Association"
 AUHNAT_AUS_the_alldeutsche_verband_desc:0 "Fraternities, gymnastic clubs, border leagues and a press that reprints Berlin. Loud in the northern Bohemian towns, and uninterested in a Habsburg empire."

 AUHNAT_AUS_the_election_of_may_1907:0 "The Election of May 1907"
 AUHNAT_AUS_the_election_of_may_1907_desc:0 "Christian Socials first, Social Democrats second across all nationalities, the Young Czechs ruined, Masaryk in the house. Thirty groups replace the old parties."

 AUHNAT_AUS_the_greater_german_wing:0 "The Greater German Wing"
 AUHNAT_AUS_the_greater_german_wing_desc:0 "Those for whom Austria is the southern march of a German nation and the dynasty a historical accident. They vote for the government and hope for Berlin, and no one governs without them or with them."

 AUHNAT_AUS_the_notables_and_the_governors:0 "The Notables and the Governors"
 AUHNAT_AUS_the_notables_and_the_governors_desc:0 "The bargain that has held Galicia since 1867: the Polish Club delivers votes in Vienna, and Vienna asks nothing about how the province is run. The Ruthene peasants pay for it."

 AUHNAT_AUS_the_conversion_campaign:0 "The Conversion Campaign"
 AUHNAT_AUS_the_conversion_campaign_desc:0 "Away from Rome and into the Evangelical church, as a declaration that one belongs to the German nation before the Emperor. It buys an ardent following, and costs the Catholic half of the German camp and the dynasty's oldest loyalty."

 AUHNAT_AUS_the_catholic_german_nationals:0 "The Catholic German Nationals"
 AUHNAT_AUS_the_catholic_german_nationals_desc:0 "Most German nationals did not follow Schoenerer out of the church. The clerical associations of the Alpine lands are nationally minded and dynastically loyal at once: useless as a battering ram, invaluable as a government."

 AUHNAT_AUS_the_personal_principle:0 "The Personal Principle"
 AUHNAT_AUS_the_personal_principle_desc:0 "The Moravian device of 27 November 1905: every elector on a German or a Czech register, seats guaranteed by number, schools split. Nationality becomes a personal status, and every subject must declare a side once and for all."

 AUHNAT_AUS_the_territorial_principle:0 "The Territorial Principle"
 AUHNAT_AUS_the_territorial_principle_desc:0 "What the border Germans demanded instead: the mixed crownlands cut into national circles, each governed in its own language. It draws a line, and the language islands beyond it are outside for good."

 AUHNAT_AUS_suspend_the_bohemian_diet:0 "Suspend the Bohemian Diet"
 AUHNAT_AUS_suspend_the_bohemian_diet_desc:0 "The Bohemian Diet has been obstructed into uselessness by whichever nation is in the minority that year. A patent dissolves it and hands the province to a commission, by decree."

 AUHNAT_AUS_govern_with_the_bohemian_diet:0 "Govern With the Bohemian Diet"
 AUHNAT_AUS_govern_with_the_bohemian_diet_desc:0 "Keep the Diet sitting and let the settlement be made by the men who must live under it. What a diet carries, the province owns. It takes years, and Vienna loses what Prague gains."

 AUHNAT_AUS_the_deutscher_volksrat:0 "The German Peoples Council"
 AUHNAT_AUS_the_deutscher_volksrat_desc:0 "A standing council of the German associations of the border lands: schools, gymnastics, credit unions and land purchase, all directed from one desk."

 AUHNAT_AUS_the_school_registers:0 "The School Registers"
 AUHNAT_AUS_the_school_registers_desc:0 "Two school boards, two inspectorates, two budgets, and a child assigned by the register his father is on. Twice the cost, and an end to the annual war over the village school."

 AUHNAT_AUS_the_closed_language_frontier:0 "The Closed Language Frontier"
 AUHNAT_AUS_the_closed_language_frontier_desc:0 "Credit for German farmers on the frontier, purchase funds for land that comes up, and a quiet word to the railway to appoint locally. One holding at a time."

 AUHNAT_AUS_the_office_and_the_ordinance:0 "The Office and the Ordinance"
 AUHNAT_AUS_the_office_and_the_ordinance_desc:0 "Ministries rise and fall in a season; the district commissioner does not. The permanent service can carry the state past any parliament, and knows it."

 AUHNAT_AUS_the_german_workers_of_bohemia:0 "The German Workers of Bohemia"
 AUHNAT_AUS_the_german_workers_of_bohemia_desc:0 "In the mills and pits of the northern Bohemian basin the German workers broke with the Social Democrats in 1903 and organised as Germans instead."

 AUHNAT_AUS_extend_the_cadastre_to_bukovina:0 "Extend the Registers to the Bukovina"
 AUHNAT_AUS_extend_the_cadastre_to_bukovina_desc:0 "The Moravian device applied to the most mixed province of the Monarchy, where Ruthenes, Romanians, Germans, Poles and Jews share every town. It is done in 1910 and it works."

 AUHNAT_AUS_the_german_language_islands:0 "The German Language Islands"
 AUHNAT_AUS_the_german_language_islands_desc:0 "The Zips towns, the Transylvanian Saxons, Gottschee, the Iglau enclave: German communities six centuries old and now surrounded. Vienna must pay for their schools."

 AUHNAT_AUS_the_state_of_the_officials:0 "The State of the Officials"
 AUHNAT_AUS_the_state_of_the_officials_desc:0 "Technical high schools, a statistical office Berlin envies, promotion by examination. Whatever else the Monarchy cannot do, it can administer."

 AUHNAT_AUS_extend_the_cadastre_to_galicia:0 "Extend the Registers to Galicia"
 AUHNAT_AUS_extend_the_cadastre_to_galicia_desc:0 "Bobrzynski spent six years giving Galicia what Moravia has, against the landowners who profit by the present arrangement. Agreed in 1914, at the last possible moment."

 AUHNAT_AUS_the_bohemian_settlement:0 "The Bohemian Settlement"
 AUHNAT_AUS_the_bohemian_settlement_desc:0 "The Bohemian negotiations ran from 1908 to 1913 and failed every time. Concluding them needs a Czech political class that still believes something can be got out of Vienna."

 AUHNAT_AUS_the_german_state_of_the_empire:0 "The German State of the Empire"
 AUHNAT_AUS_the_german_state_of_the_empire_desc:0 "One language of inner service, one register of officials, one law of the state, eleven nations inside it. It is what the German liberals wanted in 1848. Every other people is now a minority by statute, and the empire holds because it is held."

 AUHNAT_AUS_deutschosterreich_a_land_of_the_empire:0 "German Austria, a Land of the Empire"
 AUHNAT_AUS_deutschosterreich_a_land_of_the_empire_desc:0 "The Germans of the Alpine and Danubian lands accept what Popovici drew and Renner argued: a national territory of their own inside a federal Monarchy, with no claim on anyone else's. They keep their language and lose their state."

 AUHNAT_AUS_the_german_austrians_look_north:0 "The German Austrians Look North"
 AUHNAT_AUS_the_german_austrians_look_north_desc:0 "Schoenerer's conclusion taken seriously: the German Austrians are a German people first, and their future lies with the Reich. Seven of the Monarchy's own peoples are told it is not theirs."

# --- THE LANDS OF SAINT STEPHEN -----------------------------------------------------------------

 AUHNAT_HUN_the_lands_of_saint_stephen:0 "The Lands of Saint Stephen"
 AUHNAT_HUN_the_lands_of_saint_stephen_desc:0 "A little under half Magyar and entirely Magyar-governed, because six per cent of the population votes and the county prefect decides how. What Vienna administers in common, Budapest invoices, and the contract expires every ten years."

 AUHNAT_HUN_the_obstruction_of_the_contingent:0 "The Obstruction of the Contingent"
 AUHNAT_HUN_the_obstruction_of_the_contingent_desc:0 "The recruit contingent has stood at 103,100 men since 1889 while the population passed fifty millions. The Party of Independence will vote no recruit without Hungarian words of command."

 AUHNAT_HUN_threaten_universal_suffrage:0 "Threaten Universal Suffrage"
 AUHNAT_HUN_threaten_universal_suffrage_desc:0 "Kristoffy proposes universal manhood suffrage for Hungary. A franchise of six per cent is the instrument of gentry rule, and widening it would destroy the coalition defying the King. The threat breaks the resistance, and it can be drawn only once."

 AUHNAT_HUN_concede_the_word_of_command:0 "Concede the Word of Command"
 AUHNAT_HUN_concede_the_word_of_command_desc:0 "Give the victors of 1905 what they asked for: Hungarian as the language of command in the Hungarian regiments. The contingent is unfrozen, and the common army ceases to be the one institution that belongs to everybody."

 AUHNAT_HUN_break_the_obstruction:0 "Break the Obstruction"
 AUHNAT_HUN_break_the_obstruction_desc:0 "Tisza will not concede the army, so in November 1904 he changes the standing orders of the House instead, by a method nobody accepts. The party that has governed since 1875 is destroyed at the next election."

 AUHNAT_HUN_the_darabont_government:0 "The Darabont Government"
 AUHNAT_HUN_the_darabont_government_desc:0 "The coalition won in 1905 and the King will not appoint it, so he appoints General Fejervary of the royal bodyguard: the government of halberdiers. The Crown governs Hungary without asking Hungary, and the counties will stop collecting."

 AUHNAT_HUN_pocket_the_capitulation:0 "Pocket the Capitulation"
 AUHNAT_HUN_pocket_the_capitulation_desc:0 "In April 1906 the coalition takes office on a secret pact: it renounces the language of command and votes the settlement. The nationalities were promised the vote by the Crown and have watched it traded away."

 AUHNAT_HUN_universal_suffrage_in_hungary:0 "Universal Suffrage in Hungary"
 AUHNAT_HUN_universal_suffrage_in_hungary_desc:0 "Do not withdraw the threat. Carry it. Every adult man in the Lands of the Crown votes, and the electorate ceases to be Magyar. The gentry revolt in the counties they still administer, and the alliance of Crown and Hungarian political nation ends."

 AUHNAT_HUN_the_hungarian_colours_and_badges:0 "Hungarian Colours and Badges"
 AUHNAT_HUN_the_hungarian_colours_and_badges_desc:0 "Hungarian colours and Hungarian badges of rank on the regiments raised in Hungary. Vienna has refused it for thirty years as a trifle, which proves it is not."

 AUHNAT_HUN_the_honved_hussars:0 "The Honved Hussars"
 AUHNAT_HUN_the_honved_hussars_desc:0 "The royal Hungarian Honved has cavalry, a command language of its own, and an establishment Budapest votes without argument because it is Budapest's."

 AUHNAT_HUN_the_honved_as_an_army:0 "The Honved as an Army"
 AUHNAT_HUN_the_honved_as_an_army_desc:0 "A second line militia becomes a field force: staff, depots and schools, voted by a parliament that has never voted the common army an increase. The men are enlisted under Saint Stephen, not the Emperor."

 AUHNAT_HUN_honved_artillery:0 "Honved Artillery"
 AUHNAT_HUN_honved_artillery_desc:0 "The last thing the Honved lacks to be an army in its own right is guns, and Budapest votes them in 1912. Artillery decides whether a force can stand alone."

 AUHNAT_HUN_the_contingent_of_1912:0 "The Contingent of 1912"
 AUHNAT_HUN_the_contingent_of_1912_desc:0 "Twenty-three years after 1889 the contingent is finally raised. It took a Balkan crisis and the abandonment of half the army bills that went with it."

 AUHNAT_HUN_a_bank_of_our_own:0 "A Bank of Our Own"
 AUHNAT_HUN_a_bank_of_our_own_desc:0 "Justh has campaigned since 1909 for a separate Hungarian bank of issue, the quieter front of the same war as the army. No common currency authority is left."

 AUHNAT_HUN_the_separate_customs_tariff:0 "The Separate Tariff"
 AUHNAT_HUN_the_separate_customs_tariff_desc:0 "The settlement of 1907 conceded two customs territories that agree to raise no barrier. This raises the barrier. Fifty million consumers become twenty, and the quota becomes a foreign negotiation."

 AUHNAT_HUN_the_land_credit_institute:0 "The Land Credit Institute"
 AUHNAT_HUN_the_land_credit_institute_desc:0 "Mortgage credit for the great estates on terms the estates themselves set. It capitalises the plain and builds the refineries, and makes certain the land stays where it is."

 AUHNAT_HUN_the_hungarian_state_railways:0 "The Hungarian State Railways"
 AUHNAT_HUN_the_hungarian_state_railways_desc:0 "The MAV zone tariff of 1889 made Budapest the cheapest destination in the Kingdom and every other city expensive, on purpose. Extending it draws Croatian and Transylvanian traffic through Budapest."

 AUHNAT_HUN_the_danubius_yard_at_fiume:0 "The Danubius Yard at Fiume"
 AUHNAT_HUN_the_danubius_yard_at_fiume_desc:0 "The fleet is common, so Hungary demands that its share of the naval orders match its share of the bill, and Fiume is where they go. Budapest now has a reason to keep raising the quota."

 AUHNAT_HUN_the_ludovica_academy:0 "The Ludovica Academy"
 AUHNAT_HUN_the_ludovica_academy_desc:0 "A Hungarian officer school, examining in Hungarian, commissioning into Hungarian regiments. The common army trained its officers together for a reason."

 AUHNAT_HUN_the_hungarian_words_of_command:0 "The Hungarian Words of Command"
 AUHNAT_HUN_the_hungarian_words_of_command_desc:0 "Not eighty German words learned by every soldier, but a whole army giving its orders in Hungarian. The recruits come without a quarrel. Two armies that cannot be brigaded together is the price."

 AUHNAT_HUN_the_hungarian_ministry_of_defence:0 "The Hungarian Ministry of Defence"
 AUHNAT_HUN_the_hungarian_ministry_of_defence_desc:0 "The last of the three demands of 1867: a Hungarian war ministry answerable to the Hungarian parliament. The quota is now whatever Budapest says it is."

 AUHNAT_HUN_the_handkerchief_vote:0 "The Handkerchief Vote"
 AUHNAT_HUN_the_handkerchief_vote_desc:0 "On 18 November 1904 the president of the House carries the revision of the standing orders by waving a handkerchief. On 13 December the opposition returns and wrecks the chamber, furniture and all."

 AUHNAT_HUN_the_wrecked_chamber:0 "The Wrecked Chamber"
 AUHNAT_HUN_the_wrecked_chamber_desc:0 "Benches torn out and the presidential dais destroyed. From here the argument is settled by elections, by royal appointment or in the counties, and no longer in the chamber."

 AUHNAT_HUN_the_coalition_of_wekerle:0 "The Coalition of Wekerle"
 AUHNAT_HUN_the_coalition_of_wekerle_desc:0 "Wekerle forms a government of the victors of 1905 on the understanding that they abandon what they won on. Kossuth administers the union he exists to dissolve."

 AUHNAT_HUN_lex_apponyi:0 "Lex Apponyi"
 AUHNAT_HUN_lex_apponyi_desc:0 "Apponyi carries the school laws of 1907: any school wanting the state subsidy, and all need it, must teach Hungarian to fluency, and its teachers become sworn officials. Fifteen villagers are shot at Csernova and the London papers print their names."

 AUHNAT_HUN_the_forty_eighters_in_office:0 "The Forty-Eighters in Office"
 AUHNAT_HUN_the_forty_eighters_in_office_desc:0 "The party that exists to dissolve the union with Austria now administers it. Ferenc Kossuth signs conventions his father would have refused."

 AUHNAT_HUN_the_joint_bank_charter:0 "The Joint Bank Charter"
 AUHNAT_HUN_the_joint_bank_charter_desc:0 "The Austro-Hungarian Bank renewed without a separate Hungarian institute of issue: one currency and one credit standing for fifty million people. Justh will present the bill at the next renewal."

 AUHNAT_HUN_the_upper_house_of_magnates:0 "The House of Magnates"
 AUHNAT_HUN_the_upper_house_of_magnates_desc:0 "Bishops, hereditary peers, royal appointees, and the landowners who hold near a third of the arable land. Nothing touching the land will ever leave it."

 AUHNAT_HUN_the_sworn_teachers:0 "The Sworn Teachers"
 AUHNAT_HUN_the_sworn_teachers_desc:0 "A village schoolmaster paid from Budapest, examined from Budapest, and liable to lose his post for the wrong sort of enthusiasm. A small salary and a very large lever."

 AUHNAT_HUN_the_school_inspectorate:0 "The School Inspectorate"
 AUHNAT_HUN_the_school_inspectorate_desc:0 "Inspectors, standard readers, prescribed examinations, and a return filed on how much of the class can converse in Hungarian. An unmodern purpose, modernly served."

 AUHNAT_HUN_the_magyarisation_of_the_towns:0 "The Magyarisation of the Towns"
 AUHNAT_HUN_the_magyarisation_of_the_towns_desc:0 "The towns hold the offices, the railway posts and the professions, and a man who wants any of them changes the language he answers in. The countryside does not change at all."

 AUHNAT_HUN_the_magyar_state_idea:0 "The Magyar State Idea"
 AUHNAT_HUN_the_magyar_state_idea_desc:0 "The doctrine that Hungary holds one political nation whose members differ only in the tongue they speak at home, in a state where barely half speak its language."

 AUHNAT_HUN_the_party_of_work:0 "The Party of Work"
 AUHNAT_HUN_the_party_of_work_desc:0 "Tisza returns, satisfied that the coalition proved his case for him, and rebuilds the governing party under a new name. He is the least sentimental man in Hungary."

 AUHNAT_HUN_the_millennial_state:0 "The Millennial State"
 AUHNAT_HUN_the_millennial_state_desc:0 "The thousandth year of the Conquest, celebrated in 1896 with an exhibition, a subterranean railway and seven monuments at the corners of the Kingdom."

 AUHNAT_HUN_the_hungarian_state_of_saint_stephen:0 "The Hungarian State of Saint Stephen"
 AUHNAT_HUN_the_hungarian_state_of_saint_stephen_desc:0 "One political nation from Pozsony to Brasso, administered in one language by one class: governable, disciplined, able to raise men. The Romanians, Serbs, Croats and Ruthenes are subjects of a nation that denies they exist."

 AUHNAT_HUN_the_county_tax_strike:0 "The Strike of the Counties"
 AUHNAT_HUN_the_county_tax_strike_desc:0 "The gentry who administer the counties answer the extraparliamentary cabinet by refusing to collect the taxes or deliver the recruits. No law reaches it: the men who would enforce it are on strike."

 AUHNAT_HUN_the_kings_reserved_rights:0 "The Reserved Rights of the King"
 AUHNAT_HUN_the_kings_reserved_rights_desc:0 "The army, the foreign service, the sanction of laws, the appointment of ministers: none of it surrendered in 1867 and all of it fallen out of use."

 AUHNAT_HUN_the_ex_lex:0 "Ex Lex"
 AUHNAT_HUN_the_ex_lex_desc:0 "The Kingdom administered with no budget voted: taxes on last year's authority, recruits on the King's. Hungary has been here before, and it costs a little more every time."

 AUHNAT_HUN_the_royal_prerogative:0 "The Royal Prerogative"
 AUHNAT_HUN_the_royal_prerogative_desc:0 "Government in Hungary by the King's authority rather than a Hungarian majority. It makes an enemy of the only class that ever supported the settlement."

 AUHNAT_HUN_the_royal_commissioners_in_the_counties:0 "The Royal Commissioners"
 AUHNAT_HUN_the_royal_commissioners_in_the_counties_desc:0 "Where the county will not administer itself, a commissioner from Buda administers it. The taxes come in; the gentleman replaced is in opposition for life."

 AUHNAT_HUN_the_nationalities_law_of_1868:0 "The Nationalities Law of 1868"
 AUHNAT_HUN_the_nationalities_law_of_1868_desc:0 "Act XLIV guarantees the nationalities their languages in the courts, the counties and the schools. It has never been repealed and never been applied. Applying it makes every Hungarian ministry from now on a ministry against Vienna."

 AUHNAT_HUN_the_congress_of_the_nationalities:0 "The Congress of the Nationalities"
 AUHNAT_HUN_the_congress_of_the_nationalities_desc:0 "Romanians, Slovaks and Serbs meeting in Budapest on a common programme, which is exactly what the electoral law was built to prevent."

 AUHNAT_HUN_the_slovak_and_romanian_schools:0 "The Schools of the Northern Counties"
 AUHNAT_HUN_the_slovak_and_romanian_schools_desc:0 "Confessional schools funded rather than starved, teaching in the language the parents speak, with the Hungarian examination at the end rather than the beginning. An illiterate periphery is expensive."

 AUHNAT_HUN_the_deputies_of_the_nationalities:0 "The Deputies of the Nationalities"
 AUHNAT_HUN_the_deputies_of_the_nationalities_desc:0 "The Romanian National Party abandoned passivity and Aurel Vlad took a seat in 1903. A visible minority is worth more than an eloquent absence."

 AUHNAT_HUN_the_counties_reformed:0 "The Counties Reformed"
 AUHNAT_HUN_the_counties_reformed_desc:0 "Salaried officials in place of elected gentlemen, audited accounts, and appeal from the county to the ministry. Dull, expensive, and it breaks a caste."

 AUHNAT_HUN_the_franchise_of_the_crown:0 "The Franchise of the Crown"
 AUHNAT_HUN_the_franchise_of_the_crown_desc:0 "Kristoffy's bill carried by the King over the head of the Hungarian parliament. Hungary is now governed against the whole of its political nation."

 AUHNAT_HUN_the_diet_of_all_the_peoples:0 "A Diet of All the Peoples"
 AUHNAT_HUN_the_diet_of_all_the_peoples_desc:0 "A chamber in Budapest elected by everyone in the Lands of the Crown, where the Magyars are the largest party and not the only one. There is no Hungarian contracting party to the Compromise left."

 AUHNAT_HUN_the_kingdom_within_the_empire:0 "The Kingdom Within the Empire"
 AUHNAT_HUN_the_kingdom_within_the_empire_desc:0 "Hungary as a kingdom of several nations under one crown, inside a Monarchy of several kingdoms: the only arrangement under which the Lands of Saint Stephen keep their frontiers. The Magyars become a minority in their own kingdom."

 AUHNAT_HUN_the_nationalities_at_the_ballot:0 "The Nationalities at the Ballot"
 AUHNAT_HUN_the_nationalities_at_the_ballot_desc:0 "With a wide franchise the Romanian, Serb and Slovak candidates win the seats their numbers imply, and the chamber looks at last like the country outside it."

 AUHNAT_HUN_the_agrarian_labour_act:0 "The Farm Servants Act"
 AUHNAT_HUN_the_agrarian_labour_act_desc:0 "The harvest strikes of the Alfold answered with a code binding the farm servant to his contract and the gendarme to the estate. The harvest comes in. The men leave for Fiume and Bremen."

 AUHNAT_HUN_the_agrarian_socialists:0 "The Agrarian Socialists"
 AUHNAT_HUN_the_agrarian_socialists_desc:0 "Varkonyi, Achim and the harvesters' unions of the plain, organised among men who own nothing and are counted by nobody. Recognition costs the landowners and gains the one body that crosses the language line."

 AUHNAT_HUN_the_budapest_mills:0 "The Mills of Budapest"
 AUHNAT_HUN_the_budapest_mills_desc:0 "For a while the largest milling capacity in Europe outside Minneapolis, fed by the plain and by the zone tariff that brings it in. The roller mill was perfected here."

 AUHNAT_HUN_the_plural_vote:0 "The Plural Vote"
 AUHNAT_HUN_the_plural_vote_desc:0 "Andrassy's answer to the franchise he was appointed to introduce: extend it, and give the educated and the propertied two votes or three."

 AUHNAT_HUN_the_secret_ballot:0 "The Secret Ballot"
 AUHNAT_HUN_the_secret_ballot_desc:0 "Open voting in the rural seats is not a detail of the Hungarian system, it is the system: the prefect knows how every tenant voted, and so does his landlord. The old majority cannot be made again."

 AUHNAT_HUN_the_emigration_act:0 "The Emigration Act"
 AUHNAT_HUN_the_emigration_act_desc:0 "A million and a half leave for the United States between 1899 and 1913, because a third of the arable land lies in estates over a thousand holds. The state regulates the agents and does not touch the land."

 AUHNAT_HUN_the_land_of_the_thousand_holdings:0 "The Land of the Thousand Holdings"
 AUHNAT_HUN_the_land_of_the_thousand_holdings_desc:0 "Drainage of the Tisza flood plain, artificial fertiliser, the co-operatives and the sugar refineries. Everything is done for the land except dividing it."

 AUHNAT_HUN_the_csepel_works:0 "The Csepel Works"
 AUHNAT_HUN_the_csepel_works_desc:0 "Manfred Weiss began with tinned rations and ended with the largest munitions plant in the Kingdom, on an island below the capital. Vienna was never asked for it."

 AUHNAT_HUN_the_ganz_works:0 "The Ganz Works"
 AUHNAT_HUN_the_ganz_works_desc:0 "Kando's three-phase locomotives, the Ganz dynamos and the electrified line to the Italian frontier. Not catching up with Bohemia: work of the first rank, done in Budapest."

 AUHNAT_HUN_the_industrial_subsidy_acts:0 "The Industrial Development Acts"
 AUHNAT_HUN_the_industrial_subsidy_acts_desc:0 "Subsidy, tax exemption and a guaranteed order book for any factory that will site itself in the Kingdom. It draws capital that would have gone to Bohemia, and it works."

 AUHNAT_HUN_the_separate_hungarian_state:0 "The Separate Hungarian State"
 AUHNAT_HUN_the_separate_hungarian_state_desc:0 "Army, bank and tariff separate: the whole programme of Kossuth and Justh, carried at last. What remains in common is a monarch and an embassy list, and the other peoples have watched a nation walk out and be rewarded for it."

# --- IDEAS, GERMAN AUSTRIAN ---------------------------------------------------------------------

 AUH_the_german_besitzstand:0 "The German Besitzstand"
 AUH_the_german_besitzstand_desc:0 "The ministries, the courts, the general staff and the universities conducted in German by men educated in German, defended by possession rather than argument. Every promotion in Prague is a grievance."

 AUH_the_social_democratic_bargain:0 "The Reform Monarchy"
 AUH_the_social_democratic_bargain_desc:0 "The Crown has taken the one party that organises in every language of the empire as its partner. The streets are quiet, and the monarchy can no longer act without asking - and what it asks for is not a war."

 AUH_rule_by_paragraph_fourteen:0 "Rule by Paragraph 14"
 AUH_rule_by_paragraph_fourteen_desc:0 "Emergency ordinance while the Reichsrat is not sitting, and it is now how the empire is governed. Decisions are quick and cheap. Nothing is settled, and every year makes a settlement less possible."

 AUH_los_von_rom:0 "Los von Rom"
 AUH_los_von_rom_desc:0 "Away from Rome, and from a dynasty whose claim rests on being Catholic and supranational. Schoenerer has given the German Austrians a creed with a flag and an enemy, and a sovereign they have renounced."

 AUH_luegers_vienna:0 "Luegers Vienna"
 AUH_luegers_vienna_desc:0 "Gasworks, electricity, tramways and the water main, all municipal, all paid from rates the city sets itself. Vienna is administered better than the empire, and writes antisemitism into its ordinances."

 AUH_german_as_the_state_language:0 "German, the Language of State"
 AUH_german_as_the_state_language_desc:0 "One language of inner service from the Bukovina to the Tyrol. The files move and the courts sit. A regiment raised in Bohemia now takes its orders in a tongue its recruits resent."

 AUH_a_parliament_of_thirty_parties:0 "A Parliament of Thirty Parties"
 AUH_a_parliament_of_thirty_parties_desc:0 "Five hundred and sixteen deputies elected by every adult man, sitting in some thirty groups and eleven languages. Anything needing a majority now needs four months and three ministries."

 AUH_the_curial_franchise:0 "The Curial Franchise"
 AUH_the_curial_franchise_desc:0 "Landowners, chambers of commerce, towns and rural communes, weighted so a chamber can be counted before it is elected. No mass movement will defend it."

 AUH_the_budget_by_ordinance:0 "The Budget by Ordinance"
 AUH_the_budget_by_ordinance_desc:0 "The estimates carried by decree, because the house will not carry them. Every contractor now knows the Austrian budget is an administrative act rather than a political one, and prices accordingly."

 AUH_the_reichsrat_of_1907:0 "The Reichsrat of 1907"
 AUH_the_reichsrat_of_1907_desc:0 "The first chamber of the new franchise, learning what it is. Old alliances are worthless, and a ministry that wants a vote must assemble it from parties founded last spring."

 AUH_the_conversion_campaign:0 "The Conversion Campaign"
 AUH_the_conversion_campaign_desc:0 "Parish by parish in northern Bohemia and Styria, leaving the Roman church as a declaration of nationality. It gives the movement its martyrs, and destroys the one loyalty the dynasty could rely on."

 AUH_the_german_national_register:0 "The National Registers"
 AUH_the_german_national_register_desc:0 "Every elector on a German or a Czech roll, voting in his own curia, seats fixed in advance and school boards divided. The German position no longer depends on ground, and every subject is administered twice."

 AUH_the_language_frontier:0 "The Closed Language Frontier"
 AUH_the_language_frontier_desc:0 "The mixed crownlands cut into national districts, each administered in one language, with credit and land purchase holding the line where it was drawn."

 AUH_the_imperial_civil_service:0 "The Imperial Civil Service"
 AUH_the_imperial_civil_service_desc:0 "Examined, pensioned, transferable and immovable. It has carried the empire past three constitutional crises, and has learned it does not need a parliament."

 AUH_the_pan_german_secession:0 "The Pan-German Secession"
 AUH_the_pan_german_secession_desc:0 "The German Austrians have declared their nation lies north of the Erzgebirge and the Monarchy is a stage in its history. Seven peoples inside the frontiers are now guests, and only Berlin welcomes it."

 AUH_the_german_state_of_the_empire:0 "The German State of the Empire"
 AUH_the_german_state_of_the_empire_desc:0 "A single administration in a single language, staffed by a single service, over eleven nations. It decides quickly, and has no answer to why a Czech or a Pole should want it to continue."

 AUH_deutschosterreich:0 "German Austria"
 AUH_deutschosterreich_desc:0 "A national territory with its own diet, its own schools and its language guaranteed, inside a federal Monarchy of equals. An empire they administered, exchanged for a country they own."

# --- IDEAS, MAGYAR ------------------------------------------------------------------------------

 AUH_the_magyar_word_of_command:0 "The Magyar Word of Command"
 AUH_the_magyar_word_of_command_desc:0 "The Hungarian regiments give their orders in Hungarian and the recruits arrive without a fight. What paid for it was a common army in which a Croat and a Tyrolean knew the same eighty words."

 AUH_the_army_of_saint_stephen:0 "The Army of Saint Stephen"
 AUH_the_army_of_saint_stephen_desc:0 "Two armies, two academies, two languages, two general staffs and one king. Hungary raises men on a scale it never would for the common establishment. Nothing above the division crosses the seam."

 AUH_the_hungarian_national_bank:0 "The Hungarian Bank of Issue"
 AUH_the_hungarian_national_bank_desc:0 "Hungarian credit at Hungarian rates, directed at Hungarian industry by men who answer to Budapest. The Monarchy has no currency authority now, only two that consult."

 AUH_the_tariff_of_budapest:0 "The Tariff of Budapest"
 AUH_the_tariff_of_budapest_desc:0 "A customs line down the Leitha. Hungarian mills and Hungarian sugar have the home market they have demanded since 1867, and the halves now negotiate trade treaties with each other."

 AUH_the_handkerchief_vote:0 "The Handkerchief Vote"
 AUH_the_handkerchief_vote_desc:0 "The standing orders revised by a president waving a handkerchief and declaring the ayes to have it. The chamber can now be made to vote. It can also be made to riot."

 AUH_lex_apponyi:0 "The School Laws of 1907"
 AUH_lex_apponyi_desc:0 "State subsidy in exchange for teaching Hungarian to fluency, and teachers made sworn officials dismissible for unpatriotic conduct. In the northern counties it makes a conscript who does what he is told and no more."

 AUH_the_magyar_state_idea:0 "The Magyar State Idea"
 AUH_the_magyar_state_idea_desc:0 "One political nation, whatever tongue is spoken at home. It gives the governing class a doctrine, and requires belief in something half the Kingdom denies."

 AUH_the_hungarian_state_of_saint_stephen:0 "The Hungarian State of Saint Stephen"
 AUH_the_hungarian_state_of_saint_stephen_desc:0 "The Kingdom administered as one nation from the Danube to the Carpathians, disciplined, solvent and able to raise men. It rests on the assertion that a third of the population does not exist."

 AUH_the_darabont_cabinet:0 "The Government of Halberdiers"
 AUH_the_darabont_cabinet_desc:0 "A cabinet formed from the royal bodyguard, with no majority and no intention of seeking one. The King can do in a fortnight what a parliament would take three years to refuse."

 AUH_the_ex_lex:0 "Ex Lex"
 AUH_the_ex_lex_desc:0 "The Kingdom administered without a voted budget: taxes on last year's authority, recruits on the King's. The ministry is spared a vote it would lose, and the contractors want their money in advance."

 AUH_the_royal_prerogative:0 "The Royal Prerogative"
 AUH_the_royal_prerogative_desc:0 "The army, the foreign service and the sanction of laws exercised as written in 1867 rather than as allowed to lapse. The only class that supported the settlement is told it was a concession."

 AUH_the_nationalities_law_applied:0 "The Nationalities Law Applied"
 AUH_the_nationalities_law_applied_desc:0 "Act XLIV of 1868 in force at last: the languages of the Kingdom in its courts, counties and schools. The regiments raised in Transylvania improve visibly, and the governing class calls it a foreign imposition."

 AUH_the_kingdom_within_the_empire:0 "The Kingdom Within the Empire"
 AUH_the_kingdom_within_the_empire_desc:0 "Hungary as a kingdom of several nations, inside a Monarchy of several kingdoms. The frontiers of Saint Stephen are kept, and kept by consent."

 AUH_magyar_gentry_in_revolt:0 "The Magyar Gentry in Revolt"
 AUH_magyar_gentry_in_revolt_desc:0 "The franchise carried over the head of the Hungarian parliament, and the class that administers the counties refusing to. Ministries fall in weeks."

 AUH_the_broken_coalition:0 "The Broken Coalition"
 AUH_the_broken_coalition_desc:0 "The victors of 1905 in office, having signed away in April what they won in February. Their followers know what happened, and the nationalities know what was traded."

 AUH_the_agrarian_labour_act:0 "The Farm Servants Act"
 AUH_the_agrarian_labour_act_desc:0 "The harvest strikes answered with a code that binds the servant to his contract and puts the gendarme on the estate. The men who cut it are on the Fiume lists."

 AUH_the_emigration_of_the_kingdom:0 "The Emigration of the Kingdom"
 AUH_the_emigration_of_the_kingdom_desc:0 "A million and a half leave for America between 1899 and 1913, from the counties where a third of the arable land lies in estates over a thousand holds."

 AUH_the_hungarian_industrial_acts:0 "The Industrial Development Acts"
 AUH_the_hungarian_industrial_acts_desc:0 "Subsidy, exemption and a state order book for any works that will build in the Kingdom. Csepel, Ganz and the Fiume yards grow on capital that came from Bohemia."

 AUH_the_separate_hungarian_state:0 "The Separate Hungarian State"
 AUH_the_separate_hungarian_state_desc:0 "Army, bank and tariff separate: Kossuth's and Justh's programme carried, and a Hungary that is a state in all but its king. The forces are two establishments."
