l_english:

###############################################################################################################################
# Austria-Hungary - nationalities of the south and the east, reworked column C and D.
# Reward tooltips, named threats, national spirits and the press wire, numbers 500-511.
###############################################################################################################################


# =============================================================================================
# SLOVAKS
# =============================================================================================

 AUHNAT_tt_slo_seven_deputies:0 "Two million Slovaks return seven deputies to a chamber of 413. The party is edited from Martin, not organised."
 AUHNAT_tt_slo_road_martin:0 "The road of concession. Martin is answered, and the Uplands can never again be treated as a purely Hungarian file."
 AUHNAT_tt_slo_road_budapest:0 "The road of the Compromise. The north is an internal affair of the Kingdom of Hungary, and Vienna signs nothing further."
 AUHNAT_tt_slo_road_magyar:0 "The road of assimilation. Hungarian in the school, on the station board and in the county office, from Pozsony to Kassa."
 AUHNAT_tt_slo_matica:0 "The Matica slovenska was dissolved in 1875 on the ground that no Slovak nation existed. Reopening it costs a building and a doctrine."
 AUHNAT_tt_slo_hlas:0 "Vavro Srobar and the men of the review Hlas were taught by Masaryk in Prague. They answer the national question with schools and cooperatives."
 AUHNAT_tt_slo_belvedere:0 "Milan Hodza edits an agrarian weekly and briefs the Heir Presumptive on Hungarian affairs. The Belvedere now has a Slovak file."
 AUHNAT_tt_slo_curia:0 "The Moravian cadastres of 1905 carried across the Danube: the elector registers by nationality and votes in his own curia."
 AUHNAT_tt_slo_upper_land:0 "A land needs a name, a diet and a line in the common budget. The Hungarian quota was raised to 36.4 per cent in 1907, and this is charged on top."
 AUHNAT_tt_slo_ninth_land:0 "Slovensko enters the Crown as a land in its own right. Saint Stephen keeps his crown and loses his single political nation."
 AUHNAT_tt_slo_law_1868:0 "Law XLIV of 1868 promised the nationalities their language in court and school. It was never repealed and never applied."
 AUHNAT_tt_slo_deferred:0 "The file is minuted, docketed and put back. Every session it is thicker, and every session it costs more to open."
 AUHNAT_tt_slo_csernova:0 "Laws XXVI and XXVII of 1907 require Hungarian in every primary school. At Csernova on 27 October the gendarmes fire on a village crowd: fifteen dead."
 AUHNAT_tt_slo_party_dissolved:0 "A party struck off the register keeps its voters and loses its accounts. The next generation organises in the sacristy instead."
 AUHNAT_tt_slo_place_names:0 "Pozsony, Kassa, Ruzomberok. The map is rewritten one station board at a time, and every board is read by the men who painted it over."
 AUHNAT_tt_slo_one_nation:0 "There is one political nation in Hungary and it speaks Hungarian. The doctrine holds for as long as the gendarmerie does."
 AUHNAT_tt_slo_emigration:0 "Between 170,000 and 210,000 leave Hungary in 1907 alone; 528,045 subjects over the three years 1905-1907. The army counts them too."
 AUHNAT_tt_slo_hlinka:0 "Andrej Hlinka was suspended and sentenced to two years for his agitation in 1906. He was in prison on the day Csernova was fired on."
 AUHNAT_tt_slo_stem:0 "Land and wages are the only arguments that answer a steamship ticket. Emigration falls when work appears in the valley."

# =============================================================================================
# ROMANIANS OF TRANSYLVANIA
# =============================================================================================

 AUHNAT_tt_rom_three_million:0 "Three million Romanians, the largest nationality of the kingdom after the Magyars, and a party that has boycotted the ballot since 1881."
 AUHNAT_tt_rom_road_petition:0 "The road of the petition. The throne reads what is laid before it, and Budapest learns that a subject has an address above his ministry."
 AUHNAT_tt_rom_road_silence:0 "The road of silence. The seal stays unbroken, the alliance with Bucharest stays secret, and nothing is conceded to anybody."
 AUHNAT_tt_rom_road_courtroom:0 "The road of the courtroom. The party is struck off, its signatories are tried, and the Transylvanian question becomes a police matter."
 AUHNAT_tt_rom_confessional:0 "Orthodox and Uniate schools keep their language and lose the state subsidy. The bishops pay for the difference out of the parishes."
 AUHNAT_tt_rom_activist:0 "Abstention ends. The party takes its seats and discovers that a gerrymandered electorate returns it fourteen deputies out of 413."
 AUHNAT_tt_rom_tisza:0 "Istvan Tisza negotiates with the Romanian National Party in 1913: language of administration, confessional schools, redrawn districts. The talks break on the franchise."
 AUHNAT_tt_rom_districts:0 "The Transylvanian counties are redrawn to fit the voters instead of the voters to the counties. Every Hungarian party loses seats on the same day."
 AUHNAT_tt_rom_land:0 "A Romanian land inside the Crown of Saint Stephen, with its own registry and its own share of the common budget."
 AUHNAT_tt_rom_principality:0 "The Grand Principality of Transylvania, abolished by the union of 1867, comes back with a diet that Budapest cannot dissolve."
 AUHNAT_tt_rom_cluj_trial:0 "Three hundred delegates carried the Memorandum to Vienna in 1892. It came back unopened, and Kolozsvar tried its authors for incitement."
 AUHNAT_tt_rom_secret_treaty:0 "The alliance signed with Romania in 1883 is renewed in secret and read by nobody in Bucharest but the King and two ministers."
 AUHNAT_tt_rom_carol:0 "Carol I is a Hohenzollern, an ally and a Romanian king. He says nothing about Transylvania, and his silence is the whole treaty."
 AUHNAT_tt_rom_apponyi:0 "The school acts of 1907 are carried into the Transylvanian counties. A village keeps its school by teaching in Hungarian or it keeps neither."
 AUHNAT_tt_rom_settlement:0 "State credit buys the estate and chooses who farms it. The village that arrives votes; the village that was there does not."
 AUHNAT_tt_rom_liga:0 "The Liga Culturala is registered in Bucharest, which makes it a foreign association under Hungarian law, and its correspondents suspects."
 AUHNAT_tt_rom_one_nation:0 "One political nation, and the Romanians are a confession rather than a people. It is cheap, it works, and it is read in Bucharest."
 AUHNAT_tt_rom_passes:0 "Predeal, Bran, the Vulcan pass. Fortifying the Carpathians is the only Romanian policy left when there is no Romanian policy."
 AUHNAT_tt_rom_sibiu:0 "The Orthodox metropolitanate of Sibiu, restored in 1864, elects its own bishops and keeps its own registers. Budapest confirms and does not appoint."
 AUHNAT_tt_rom_blaj:0 "Blaj taught Romanians to read their own language a century before anyone asked them to vote in it. The Uniate see answers to Rome."
 AUHNAT_tt_rom_astra:0 "ASTRA, founded at Sibiu in 1861: reading rooms in the villages, a library, and the first encyclopaedia written in Romanian."
 AUHNAT_tt_rom_vaida:0 "Alexandru Vaida-Voevod carries the Romanian case to the Belvedere. The Heir Presumptive listens because it is aimed at Budapest."
 AUHNAT_tt_rom_popovici:0 "Aurel Popovici published the United States of Greater Austria in 1906: fifteen national states under one crown, and a map that names every one."

# =============================================================================================
# BOSNIA AND HERZEGOVINA
# =============================================================================================

 AUHNAT_tt_bos_two_million:0 "Nearly two million subjects who elect nobody: not the Reichsrat, not the Budapest chamber, not a diet of their own."
 AUHNAT_tt_bos_road_statute:0 "The road of the statute. The province is given a law before it is given a sovereign, and the sovereign will have to live with it."
 AUHNAT_tt_bos_road_kallay:0 "The road of the administration. Benjamin Kallay governed for twenty-one years without a diet, and the file stays exactly as he left it."
 AUHNAT_tt_bos_road_annexation:0 "The road of annexation. Thirty years of legal ambiguity close in a morning, and the signatories of the Treaty of Berlin read it in the newspapers."
 AUHNAT_tt_bos_waqf:0 "The pious foundations administer their own revenue and elect their own boards. It is the first elected body the province has ever had."
 AUHNAT_tt_bos_landesstatut:0 "The territorial statute sanctioned on 17 February 1910 and promulgated on the 20th: a diet, a franchise by confession, and rights on paper."
 AUHNAT_tt_bos_sabor:0 "Ninety-two seats: seventy-two elected by confessional curiae, twenty sitting by right. Thirty-one Orthodox, twenty-four Muslims, sixteen Catholics, one Jew."
 AUHNAT_tt_bos_kmet:0 "Tens of thousands of Christian families still farm the land of Muslim beys for a share of the crop. The state buys the share out, and the beys lose their rent."
 AUHNAT_tt_bos_third_land:0 "Neither Vienna nor Budapest: a land that answers to the Crown and pays into the common budget on its own account."
 AUHNAT_tt_bos_crownland:0 "Bosnia enters the Monarchy as a crownland with a diet, a budget and a name of its own. Two capitals lose a province and gain a partner."
 AUHNAT_tt_bos_occupation:0 "Thirty years of Austro-Hungarian administration over a province that remains Ottoman in law. Since the Young Turks the ambiguity has a deadline."
 AUHNAT_tt_bos_bosnjastvo:0 "Kallay taught a Bosnian nation so that no Serb or Croat nation could be taught. It convinced the schoolbooks and nobody else."
 AUHNAT_tt_bos_burian:0 "Istvan Burian administers the province as common finance minister. A ministry of accounts governs a country because no parliament may."
 AUHNAT_tt_bos_no_payer:0 "Vienna will not pay for a Hungarian province and Budapest will not pay for an Austrian one. The invoice waits."
 AUHNAT_tt_bos_uvac:0 "Aehrenthal announced the Uvac to Mitrovica survey concession on 27 January 1908. It reached Salonika on paper and broke the Balkan entente in fact."
 AUHNAT_tt_bos_reichsland:0 "A Reichsland is governed by the common ministries and by neither parliament. It is efficient, and it is why nobody in it votes."
 AUHNAT_tt_bos_three_orgs:0 "The Serb, Muslim and Croat national organisations lose their registers on the same day. All three had won seats in the Sabor of 1910."
 AUHNAT_tt_bos_exceptional:0 "The statute stands, minus the articles on assembly, press and the immunity of deputies. What remains is a signature."
 AUHNAT_tt_bos_province:0 "A province like any other, administered like none of them, and garrisoned like a frontier."
 AUHNAT_tt_bos_sandjak_out:0 "The garrisons held since 1879 leave the sandjak of Novi Pazar. Europe is told it is moderation; Belgrade and Cetinje are told nothing and understand everything."
 AUHNAT_tt_bos_bosniaken:0 "Four Bosnian infantry regiments, recruited where neither conscription law applies, with their own fez and their own oath."
 AUHNAT_tt_bos_gauge:0 "Seven hundred and sixty millimetres of gauge into every valley: cheap to lay, and everything must be unloaded twice."
 AUHNAT_tt_bos_tobacco:0 "The monopoly buys the leaf it obliges the peasant to grow, at the price it sets. The revenue is real and so is the resentment."
 AUHNAT_tt_bos_three_communities:0 "The Serb National Organisation took thirty-one seats in 1910, the Muslims twenty-four, the Croats sixteen. Three communities, one province, one arithmetic."

# =============================================================================================
# ITALIANS OF THE LITTORAL AND THE TRENTINO
# =============================================================================================

 AUHNAT_tt_ita_seven_hundred_thousand:0 "Some seven hundred thousand Italian subjects, in the richest port of the Monarchy and in the valleys behind Trento."
 AUHNAT_tt_ita_road_trieste:0 "The road of Trieste. The faculty goes where it was asked for, and the capital of irredentism receives a national institution."
 AUHNAT_tt_ita_road_innsbruck:0 "The road of the neutral site. A faculty is opened where nobody demanded it, and it satisfies nobody who did."
 AUHNAT_tt_ita_road_refusal:0 "The road of refusal. Nothing is built, nothing is conceded, and the grievance is kept intact for whoever wants to use it."
 AUHNAT_tt_ita_trentino:0 "The valley diets of the Trentino govern their own schools and roads, and stop voting as a minority inside a German Tyrol."
 AUHNAT_tt_ita_de_gasperi:0 "Alcide De Gasperi was arrested at Innsbruck in November 1904 and elected to the Reichsrat in 1911. He asks for autonomy, not for Rome."
 AUHNAT_tt_ita_free_port:0 "Trieste answers to the Crown directly, as it has since 1719, and keeps the customs privileges that made it the port of an empire."
 AUHNAT_tt_ita_littoral_diet:0 "Trieste, Gorizia and Istria sit in one diet instead of three. The Slovene deputies of the same coastline notice at once."
 AUHNAT_tt_ita_italian_land:0 "An Italian land of the Empire, with a diet, a university and a budget. Rome loses the argument it has used since 1866."
 AUHNAT_tt_ita_innsbruck:0 "The Italian law faculty opened at Wilten on 3 November 1904. The painter August Pezzey was killed, 138 students arrested, the faculty dissolved on the 17th."
 AUHNAT_tt_ita_article_seven:0 "Article VII of the Triple Alliance: neither power may alter the Balkan status quo without the prior agreement of the other and a reciprocal compensation."
 AUHNAT_tt_ita_prinetti:0 "The ally signs in June 1902 and insures himself in Paris five months later. Alliances are read backwards from the year they are used."
 AUHNAT_tt_ita_hohenlohe:0 "The Hohenlohe decrees strike Italian out of the offices of the Littoral. The city keeps speaking it and the file stops recording it."
 AUHNAT_tt_ita_umgangssprache:0 "The census asks for the language of daily use, declared before an employer or a landlord. The answer follows the labour market, and the register follows the answer."
 AUHNAT_tt_ita_lega:0 "The Lega Nazionale ran Italian schools where the state would not. Struck off the register, the schools close and the subscriptions do not."
 AUHNAT_tt_ita_evidenzbureau:0 "A file on every reading room from Trento to Pola. The bureau learns a great deal, and the coast learns it is being read."
 AUHNAT_tt_ita_austrian_littoral:0 "The Littoral is Austrian, the fleet is based in it, and the population is a security question rather than a constituency."
 AUHNAT_tt_ita_stabilimento:0 "The Stabilimento Tecnico Triestino built the Habsburg class and would build three of the four Tegetthoffs. The fourth went to Fiume, in Hungary."
 AUHNAT_tt_ita_piazza_borsa:0 "14 February 1902: the troops guarding the governor fire on the crowd in piazza della Borsa. Eleven dead on the square, fourteen over two days. The arbitration board found for the stokers that same evening."
 AUHNAT_tt_ita_battisti:0 "Cesare Battisti edits Il Popolo, sits for the socialists, and was arrested at Innsbruck alongside De Gasperi. In 1915 he will cross the line."
 AUHNAT_tt_ita_renewal:0 "The Triple Alliance is renewed on 5 December 1912 with Article VII kept word for word. The clause that binds Vienna is the clause Rome will invoke."
 AUHNAT_tt_ita_conrad:0 "Conrad von Hoetzendorf asked for a preventive war on Italy in 1911 and was dismissed for asking. He came back in December 1912."

# =============================================================================================
# CROATS
# =============================================================================================

 AUHNAT_tt_cro_state_right:0 "Croatian state right is older than the Settlement and older than the dualism. Every Croatian party begins by citing it."
 AUHNAT_tt_cro_road_triune:0 "The road of the Triune Kingdom. Dalmatia is joined to Croatia-Slavonia, and the kingdom stops being a province of a province."
 AUHNAT_tt_cro_road_nagodba:0 "The road of the Settlement. The Nagodba of 1868 is applied as written, which is to say in Budapest, and nothing more is asked."
 AUHNAT_tt_cro_road_commissioner:0 "The road of the commissioner. The constitution is suspended, the diet is not convened, and Zagreb is administered by decree."
 AUHNAT_tt_cro_sava_line:0 "Spring 1903 along the Sava: crowds tear down station boards lettered only in Hungarian and the gendarmerie fire. Twenty years of Ban Khuen end in a rising."
 AUHNAT_tt_cro_fiume_resolution:0 "The Fiume Resolution of 3 October 1905 traded Croatian votes for the reunion of Dalmatia. At Zadar in October the Serb deputies joined it."
 AUHNAT_tt_cro_treasury:0 "Over half of what the kingdom raises leaves it under the Settlement. A treasury in Zagreb keeps what Zagreb collects."
 AUHNAT_tt_cro_domobranstvo:0 "The Royal Croatian Home Guard commands and swears in Croatian. It is the only armed body in the Monarchy that does."
 AUHNAT_tt_cro_zagreb_university:0 "The University of Zagreb, refounded in 1874, is the only one in the lands of Saint Stephen outside Budapest and Kolozsvar."
 AUHNAT_tt_cro_fiume_croatian:0 "Fiume returns to the Triune Kingdom. Hungary loses its only deep-water port and will present the bill at the next renewal of the quota."
 AUHNAT_tt_cro_fiume_hungarian:0 "Fiume stays a Hungarian corpus separatum. Budapest pays for the harbour, the railway and the shipyard, and takes the freight."
 AUHNAT_tt_cro_courts:0 "Pleading in Croatian before a bench obliged to answer in it. Cheap in money, and the whole quarrel is about who writes the record."
 AUHNAT_tt_cro_savings_bank:0 "The First Croatian Savings Bank was founded in 1846 and outlived every government that tried to use it."
 AUHNAT_tt_cro_ban_of_the_crown:0 "The ban is named by the King on the proposal of the Hungarian minister-president. Change the proposer and you change the kingdom."
 AUHNAT_tt_cro_dalmatian_diet:0 "The Dalmatian diet votes itself into the Sabor. Vienna loses a crownland and gains a kingdom that is no longer asking."
 AUHNAT_tt_cro_third_crown:0 "A third crown beside Vienna and Budapest, carrying Croatia, Slavonia, Dalmatia and whatever the Crown chooses to add."
 AUHNAT_tt_cro_coronation:0 "A crowning at Zagreb binds both ways: the king swears to the kingdom, and the kingdom is bound to the king who swore."
 AUHNAT_tt_cro_triune_kingdom:0 "The Triune Kingdom is a state of the Monarchy and not a county of Hungary. The dualism becomes an arithmetic of three."
 AUHNAT_tt_cro_nagodba:0 "The Nagodba of 1868 gave Croatia a diet, a flag and its own courts, and gave Hungary the ban, the railways and the finances."
 AUHNAT_tt_cro_renewal_1906:0 "The financial clauses are renewed on the terms of whoever holds the treasury, which is not Zagreb."
 AUHNAT_tt_cro_corpus_separatum:0 "Fiume is a separate body attached to the Hungarian crown, governed by a governor from Budapest and claimed by the Sabor every year."
 AUHNAT_tt_cro_coalition:0 "The Croato-Serb Coalition took 56 of 88 seats in February 1908 with 49.64 per cent of the vote. No government candidate was elected."
 AUHNAT_tt_cro_no_policy:0 "A kingdom with a diet, a flag, a ban and no policy of its own. It is stable, and it is why nobody defends it in 1918."
 AUHNAT_tt_cro_khuen:0 "Karoly Khuen-Hedervary was ban for twenty years, then went to Budapest to govern Hungary. Zagreb was his apprenticeship."
 AUHNAT_tt_cro_zagreb_trial:0 "The Zagreb treason trial ran from 3 March to 5 October 1909: 53 accused, 31 convicted on five to twelve years, 150 days of hearings, 38 defence counsel."
 AUHNAT_tt_cro_railway_pragmatic:0 "The railway pragmatic of 1907 required Hungarian of railway servants in Croatia. One clause broke the alliance made at Fiume two years earlier."
 AUHNAT_tt_cro_friedjung:0 "In December 1909 the defence proved in open court that the documents against the Coalition were forged at the legation in Belgrade. Friedjung withdrew, without apology."
 AUHNAT_tt_cro_frankists:0 "The Pure Party of Rights answers Serb nationalism with its own. It is loyal to the Monarchy for exactly as long as that is useful."
 AUHNAT_tt_cro_cuvaj:0 "Slavko Cuvaj dissolved the Sabor before it sat, suspended the constitution on 4 April 1912 and was proclaimed royal commissioner the next day."
 AUHNAT_tt_cro_governed:0 "Croatia is administered from Budapest by decree. It is quiet, it is cheap, and it produces two attempts on the commissioner in one year."

# =============================================================================================
# SLOVENES
# =============================================================================================

 AUHNAT_tt_slv_five_diets:0 "A million and a quarter Slovenes spread over five crownlands: a majority in Carniola, a minority everywhere else."
 AUHNAT_tt_slv_road_united:0 "The road of United Slovenia. Four diets are asked to give up districts, and the map of 1849 is finally answered."
 AUHNAT_tt_slv_road_provinces:0 "The road of the provinces. The crownlands stand as they are, and the nation is administered in five pieces by five diets."
 AUHNAT_tt_slv_road_sudmark:0 "The road of the Sudmark. German schools, German associations and German land purchase carry the south for the German parties."
 AUHNAT_tt_slv_map_of_1849:0 "The crownland boundaries were drawn in 1849 and never again. Undoing them requires four diets to vote against themselves."
 AUHNAT_tt_slv_carniola:0 "Carniola is the one diet a Slovene party can win outright, and therefore the one place where the language question is settled by a vote."
 AUHNAT_tt_slv_krek:0 "Janez Evangelist Krek built a network of village credit unions and cooperatives. A party that lends money does not need to promise any."
 AUHNAT_tt_slv_inner_service:0 "Slovene at the counter is a courtesy. Slovene in the inner service means the file, the minute and the judgement are written in it."
 AUHNAT_tt_slv_university:0 "Cisleithania has eight universities and none of them teaches in Slovene. Ljubljana would be the ninth."
 AUHNAT_tt_slv_narodni_dom:0 "The Narodni dom, opened in Trieste in 1904, houses a bank, a theatre, a hotel and the Slovene national societies of the port."
 AUHNAT_tt_slv_municipality:0 "The municipality of Trieste is Italian-liberal and intends to remain so. Leaving it alone buys quiet in the port and costs it in the hinterland."
 AUHNAT_tt_slv_wocheiner:0 "The Karawanken and Wocheiner line was classed a first-class main line on 6 June 1901. The alpine programme was costed at 487,038,000 crowns."
 AUHNAT_tt_slv_regiments:0 "The regiments of the Littoral are raised where the fleet has its base and its yard, and garrison the coast they come from."
 AUHNAT_tt_slv_bloc:0 "A south Slav bloc in the Reichsrat votes with the Croats and the Serbs. It is not yet a programme, and it already has a majority of the coast."
 AUHNAT_tt_slv_one_land:0 "Carniola and the Littoral under one administration. The two halves of the nation stop being governed by different capitals."
 AUHNAT_tt_slv_land:0 "The Land of the Slovenes joins the crownlands as an equal. The Sudmark loses its argument and the coast keeps its port."
 AUHNAT_tt_slv_cilli:0 "Parallel Slovene classes in a Styrian gymnasium brought down an Austrian government in 1895. Where German and Slovene meet, a school is a frontier post."
 AUHNAT_tt_slv_liberals:0 "The liberals of Ljubljana want a modern town, a national theatre and no clergy in the schools. They agree with the People's Party on the language and on nothing else."
 AUHNAT_tt_slv_compromise:0 "The Moravian compromise of 1905 and the Bukovina compromise of 1910 both worked, in one province each. Carniola would be the third."
 AUHNAT_tt_slv_no_land:0 "A people counted in five columns of the census and represented in none of them. Nothing is refused, and nothing arrives."
 AUHNAT_tt_slv_schulverein:0 "The Deutscher Schulverein and the Sudmark buy land and build schools where the German parties are losing the census."
 AUHNAT_tt_slv_september:0 "September 1908: troops called out against demonstrations over German shop signs kill two Slovenes in a provincial capital."
 AUHNAT_tt_slv_clubs:0 "The Slovene clubs lose their registers in every crownland at once. The membership does not move, and the meetings do."
 AUHNAT_tt_slv_administration:0 "The Littoral is administered from Trieste under the governor and the garrison. The port works; the coast is a security district."

# =============================================================================================
# SERBS OF THE MONARCHY
# =============================================================================================

 AUHNAT_tt_ser_privileges:0 "The Serbs of Hungary have been privileged since 1690 and govern their own church and their own schools. It is the oldest autonomy in the Monarchy."
 AUHNAT_tt_ser_road_autonomy:0 "The road of autonomy. The Church-School Congress keeps its assembly, its budget and its schools, and answers only to the Crown."
 AUHNAT_tt_ser_road_indifference:0 "The road of indifference. The Congress is neither confirmed nor suspended, and the schools are squeezed by the education laws instead."
 AUHNAT_tt_ser_road_suspension:0 "The road of suspension. The Congress is prorogued, its funds are placed under a commissioner, and the schools take the state curriculum."
 AUHNAT_tt_ser_karlowitz:0 "Sremski Karlovci elects its metropolitan, votes its own budget and keeps its own registers. Budapest has asked why for thirty years."
 AUHNAT_tt_ser_radicals:0 "The Serb Radical Party of Hungary sits in Budapest and in the Sabor at Zagreb, and answers to neither government."
 AUHNAT_tt_ser_cyrillic:0 "Cyrillic accepted in the county office means a second set of forms, a second clerk, and a register nobody can dispute afterwards."
 AUHNAT_tt_ser_banks:0 "Serb settlement banks lend against land the church may not hold. Credit does what a statute could not."
 AUHNAT_tt_ser_curia:0 "A Serb curia in the Sabor turns forty thousand voters into a bloc that must be counted rather than a minority that can be split."
 AUHNAT_tt_ser_frontier_open:0 "The frontier reopens to Serbian livestock. The market towns on the near side of the Save live again, and Belgrade keeps its French guns."
 AUHNAT_tt_ser_frontier_shut:0 "The frontier stays shut. Hungarian agriculture is protected, Belgrade finds other buyers, and the tariff war is lost while it is being won."
 AUHNAT_tt_ser_seminary:0 "The seminary of Karlovci trains the priests who keep the parish registers, and the registers are what the census argues over."
 AUHNAT_tt_ser_grenzer:0 "The Military Frontier was abolished in 1881, and its men remember what they were. Recruiting on that memory is cheaper than conscription."
 AUHNAT_tt_ser_third_crown:0 "The Serbs of Hungary and Croatia enter the third crown as a recognised community rather than a confession with a grievance."
 AUHNAT_tt_ser_voivodship:0 "The Serb Voivodship was abolished in 1860. Restoring it gives the southern counties a diet and a name that Belgrade does not own."
 AUHNAT_tt_ser_at_home:0 "A Serb of the Monarchy who has a diet, a church, a school and a curia has less reason to look across the Save than the man who has none."
 AUHNAT_tt_ser_schools:0 "Confessional schools teaching in Cyrillic are exactly what the Hungarian education laws are written to squeeze."
 AUHNAT_tt_ser_zadar:0 "The Zadar Resolution of October 1905: the Serb deputies of Dalmatia join the Fiume Resolution and recognise Croats and Serbs as one people."
 AUHNAT_tt_ser_neither:0 "A loyalty offered to whichever capital will take the file seriously. Neither does, and the offer stays open for somebody else."
 AUHNAT_tt_ser_unasked:0 "Loyalty that is never tested is never counted. It survives until the first trial, and then it is evidence."
 AUHNAT_tt_ser_pig_war:0 "In 1906 the frontier was shut to Serbian livestock to punish Belgrade for buying its guns in France. Serbia found other markets within two years."
 AUHNAT_tt_ser_novi_sad:0 "Novi Sad prints in Cyrillic for readers on both banks. Suppressing the press moves the readers, not the presses."
 AUHNAT_tt_ser_watch:0 "Two rivers, one frontier, and a gendarmerie post on every ford. Everything crossing is recorded, including the people who live there."
 AUHNAT_tt_ser_banja_luka:0 "The Banja Luka treason trial: 156 accused, verdict of 22 April 1916, sixteen sentences of death by hanging. The pardons of 1917 came through Alfonso XIII and Benedict XV."

# =============================================================================================
# NAMED THREATS
# =============================================================================================

 AUHNAT_threat_bos_annexation:0 "Annexation of Bosnia and Herzegovina"
 AUHNAT_threat_bos_uvac:0 "The Sandjak railway survey"
 AUHNAT_threat_ita_conrad:0 "Staff memorandum on Italy"
 AUHNAT_threat_rom_passes:0 "Fortification of the Carpathian passes"
 AUHNAT_threat_ser_watch:0 "The watch on the Save and the Danube"

# =============================================================================================
# NATIONAL SPIRITS
# =============================================================================================

 AUH_SLO_the_martin_press:0 "The Press of Martin"
 AUH_SLO_the_martin_press_desc:0 "The Matica prints, the reading rooms subscribe, and a literature exists where the statistics say a dialect does. The counties answer by refusing every permit that can be refused."
 AUH_SLO_the_slovak_curia:0 "A Slovak Curia"
 AUH_SLO_the_slovak_curia_desc:0 "The northern electorate is registered by nationality and votes in its own curia. Every man must declare what he is, and the recruiting officer reads the same list."
 AUH_SLO_the_upland_gendarmerie:0 "The Upland Gendarmerie"
 AUH_SLO_the_upland_gendarmerie_desc:0 "A post in every market town from Pozsony to Kassa. Order is immediate and it is billed to the villages that are being kept in order."
 AUH_SLO_the_ironworks_of_the_uplands:0 "The Ironworks of the Uplands"
 AUH_SLO_the_ironworks_of_the_uplands_desc:0 "Furnaces in the northern valleys give the emigrant a reason to stay and the treasury a reason to keep paying for coke that comes from elsewhere."
 AUH_SLO_the_seven_deputies:0 "The Deputies of Martin"
 AUH_SLO_the_seven_deputies_desc:0 "Four Slovaks took their seats in 1901 after seventeen years of abstention, and seven at the election after that. The government must answer them before it can carry a recruit bill."
 AUH_SLO_the_law_of_1868:0 "Law XLIV of 1868"
 AUH_SLO_the_law_of_1868_desc:0 "The nationalities law promises every subject his language in the court and the school. It has never been repealed, never been applied, and it is read aloud at every session."
 AUH_SLO_the_inspector_and_the_subsidy:0 "The School Inspectorate"
 AUH_SLO_the_inspector_and_the_subsidy_desc:0 "The inspector approves the teacher, the textbook and the subsidy. What complies is cheap to keep, and a generation learns to read in a language nobody speaks at home."
 AUH_SLO_the_place_name_register:0 "The Register of Place Names"
 AUH_SLO_the_place_name_register_desc:0 "One official Hungarian name per settlement, gazetted in Budapest and painted on the station board. The offices use it and nobody who lives there does."
 AUH_SLO_the_emigration_stemmed:0 "The Emigration Stemmed"
 AUH_SLO_the_emigration_stemmed_desc:0 "Over half a million subjects left the kingdom in the three years to 1907. Land, credit and wages keep them in the valley, at a price the steamship company used to charge them."
 AUH_ROM_the_confessional_schools:0 "The Confessional Schools"
 AUH_ROM_the_confessional_schools_desc:0 "Orthodox and Uniate schools keep their language and lose the state subsidy. The bishops find the money, and find it in the parishes."
 AUH_ROM_the_state_school_network:0 "The State School Network"
 AUH_ROM_the_state_school_network_desc:0 "Where the confessional school closes, the state school opens, better funded and better built. The ministry pays the teacher and the teacher works in Hungarian, and every village keeps count of which one it got."
 AUH_ROM_the_settlement_villages:0 "The Settlement Villages"
 AUH_ROM_the_settlement_villages_desc:0 "State credit buys the estate and chooses who farms it. The new village votes as expected; the old one learns what the land register is for."
 AUH_ROM_the_astra_reading_rooms:0 "The ASTRA Reading Rooms"
 AUH_ROM_the_astra_reading_rooms_desc:0 "A library in the market town and a reading room in the village. It is a cultural society in its statutes and a party organisation in its correspondence."
 AUH_ROM_the_banat_works:0 "The Banat Works"
 AUH_ROM_the_banat_works_desc:0 "Resita casts guns, rails and boilers on the old military frontier. It also eats coal that the common budget must buy at the going price."
 AUH_ROM_the_redrawn_districts:0 "The Redrawn Districts"
 AUH_ROM_the_redrawn_districts_desc:0 "The Transylvanian counties are cut to fit the voters instead of the voters to the counties. Three million Romanians become representable, and every Hungarian party loses seats the same day."
 AUH_ROM_the_kings_silence:0 "King Carol and the Silence"
 AUH_ROM_the_kings_silence_desc:0 "The treaty of 1883 is renewed and read by four men in Bucharest. Nothing is said aloud about Transylvania, so nothing about it can be used to rally anybody at home."
 AUH_ROM_the_metropolitanate_of_sibiu:0 "The Metropolitanate of Sibiu"
 AUH_ROM_the_metropolitanate_of_sibiu_desc:0 "Sibiu elects its own bishops, keeps its own registers and pays for its own schools. Budapest confirms the election, appoints nobody and inspects nothing."
 AUH_BOS_the_sabor_of_sarajevo:0 "The Sabor of Sarajevo"
 AUH_BOS_the_sabor_of_sarajevo_desc:0 "Ninety-two seats elected by confessional curiae. The province acquires an address, and the administration acquires a chamber that can refuse it."
 AUH_BOS_the_bosniaken_regiments:0 "The Bosniaken Regiments"
 AUH_BOS_the_bosniaken_regiments_desc:0 "Four regiments raised outside the conscription law of either half, with their own fez and a reputation earned in the field. Training them takes longer than anyone budgeted."
 AUH_BOS_the_narrow_gauge_network:0 "The Narrow Gauge Network"
 AUH_BOS_the_narrow_gauge_network_desc:0 "Seven hundred and sixty millimetres into every valley. Cheap to build, quick to extend, and everything that moves must be unloaded twice."
 AUH_BOS_the_tobacco_monopoly:0 "The Sarajevo Tobacco Monopoly"
 AUH_BOS_the_tobacco_monopoly_desc:0 "The state buys the leaf it obliges the peasant to grow, at the price it sets, and sells it back to him rolled. The revenue is dependable and so is the grievance."
 AUH_BOS_bosnjastvo:0 "Bosnjastvo"
 AUH_BOS_bosnjastvo_desc:0 "Kallay teaches one Bosnian nation so that no Serb or Croat nation can be taught. The schoolbooks are convinced, the three communities are not, and the doctrine outlives its author by very little."
 AUH_ITA_the_trentine_autonomy:0 "Autonomy for the Trentino"
 AUH_ITA_the_trentine_autonomy_desc:0 "The valley diets run their own schools and roads. Innsbruck loses a majority it counted on, and Vienna arbitrates a quarrel it used to ignore."
 AUH_ITA_the_free_port_of_trieste:0 "The Free Port of Trieste"
 AUH_ITA_the_free_port_of_trieste_desc:0 "The customs privileges that made a fishing town the port of an empire. They also make it the cheapest place in the Monarchy to land something quietly."
 AUH_ITA_the_stabilimento_tecnico:0 "The Stabilimento Tecnico Triestino"
 AUH_ITA_the_stabilimento_tecnico_desc:0 "The yard that built the Habsburg class and the Tegetthoffs. It is the finest industrial asset on the coast and it strikes with the rest of the city."
 AUH_ITA_the_hohenlohe_administration:0 "The Hohenlohe Administration"
 AUH_ITA_the_hohenlohe_administration_desc:0 "Italian is struck out of the offices and the register is kept in German. The administration is obeyed, believed by nobody, and read closely in Rome."
 AUH_the_university_of_zagreb:0 "The University of Zagreb"
 AUH_the_university_of_zagreb_desc:0 "The only university of the kingdom, and it turns out lawyers who read the Settlement of 1868 for a living."
 AUH_the_croatian_courts:0 "Croatian in the Courts"
 AUH_the_croatian_courts_desc:0 "The pleading, the record and the judgement in the language of the county. It costs a generation of clerks and buys a generation of quiet."
 AUH_the_zagreb_treason_trial:0 "The Zagreb Treason Trial"
 AUH_the_zagreb_treason_trial_desc:0 "Thirty-one convictions on evidence that will not survive a libel suit in Vienna. The Coalition is broken in Zagreb and vindicated in every capital that matters."
 AUH_the_croatian_question:0 "The Croatian Question"
 AUH_the_croatian_question_desc:0 "Croatian state right is older than the Settlement, and every party in Zagreb opens by citing it. A kingdom that argues from a right will fight for it and will not be administered quietly."
 AUH_the_oath_at_zagreb:0 "The Oath at Zagreb"
 AUH_the_oath_at_zagreb_desc:0 "The king is crowned in the kingdom he governs through a ban. The oath binds both ways, and what is sworn at Zagreb can be quoted against Budapest for as long as anyone remembers it."
 AUH_khuen_hedervary_in_zagreb:0 "Khuen-Hedervary in Zagreb"
 AUH_khuen_hedervary_in_zagreb_desc:0 "Twenty years of a Sabor that votes as it is asked, held together by setting Serb against Croat. It works until the two of them stop believing the ban rather than each other."
 AUH_the_sabor_suspended:0 "The Sabor Suspended"
 AUH_the_sabor_suspended_desc:0 "Cuvaj dissolved the diet before it sat and suspended the constitution on 4 April 1912. Government is by decree, and nothing settled in those years is afterwards accepted as lawful."
 AUH_the_slovene_inner_service:0 "Slovene in the Inner Service"
 AUH_the_slovene_inner_service_desc:0 "The file, the minute and the judgement written in Slovene. Every office south of the Drava must retrain, and every German clerk in them knows it."
 AUH_the_university_of_ljubljana:0 "The University of Ljubljana"
 AUH_the_university_of_ljubljana_desc:0 "The ninth university of Cisleithania and the first in Slovene. Carniola pays for it out of a provincial budget that was never meant to carry one."
 AUH_the_littoral_regiments:0 "The Regiments of the Littoral"
 AUH_the_littoral_regiments_desc:0 "Raised where the fleet has its base, garrisoned on the coast they come from, and therefore missing from every other order of battle."
 AUH_the_slovene_question:0 "The Slovene Question"
 AUH_the_slovene_question_desc:0 "A million and a quarter Slovenes, a majority in Carniola and a minority in four crownlands besides, organised in cooperatives that feed themselves and vote together."
 AUH_the_carniolan_littoral:0 "Carniola and the Littoral"
 AUH_the_carniolan_littoral_desc:0 "The two halves of the nation are put under one governor and one budget. The administration is single at last, and the merchants of Trieste find their province has a Slovene majority."
 AUH_the_cilli_parallel_classes:0 "The Parallel Classes at Cilli"
 AUH_the_cilli_parallel_classes_desc:0 "Two Slovene classes in a Styrian gymnasium brought down an Austrian government in 1895. The classes teach; the coalition that voted the money for them does not survive the session."
 AUH_the_cyrillic_offices:0 "Cyrillic in the County Offices"
 AUH_the_cyrillic_offices_desc:0 "A second set of forms, a second clerk and a register that cannot be disputed afterwards. The counties send the bill to Budapest."
 AUH_the_karlowitz_seminary:0 "The Seminary of Karlowitz"
 AUH_the_karlowitz_seminary_desc:0 "The priests trained here keep the parish registers, and the parish registers are what every census argument is decided on."
 AUH_the_banja_luka_verdict:0 "The Banja Luka Verdict"
 AUH_the_banja_luka_verdict_desc:0 "A hundred and fifty-six in the dock and sixteen sentences of death. The province is quiet, and the clemency that follows has to be asked for from abroad."
 AUH_the_serb_question:0 "The Serb Question"
 AUH_the_serb_question_desc:0 "Privileged since 1690, descended from the frontier regiments, and living within sight of a kingdom that claims them. They serve willingly and they are watched all the same."
 AUH_the_privileges_of_1690:0 "The Privileges of 1690"
 AUH_the_privileges_of_1690_desc:0 "The congress at Sremski Karlovci elects its metropolitan, votes its own budget and audits itself. Budapest has been asking why for thirty years and paying for it in the meantime."
 AUH_the_schools_of_the_metropolitanate:0 "The Schools of the Metropolitanate"
 AUH_the_schools_of_the_metropolitanate_desc:0 "Confessional schools teaching in Cyrillic are what the education laws are written to squeeze. The subsidy is withheld one school at a time, and so is everything else."

# =============================================================================================
# THE PRESS WIRE, 500-511
# =============================================================================================

 AUH_news_500_t:0 "GENDARMES FIRE AT CSERNOVA: FIFTEEN DEAD"
 AUH_news_500_d:0 "The villagers of Csernova barred the road to the priests sent to consecrate the church they had paid for, asking for Father Hlinka, then under sentence. The gendarmerie opened fire: fifteen killed, more than fifty wounded."
 AUH_news_501_t:0 "SLOVENSKO ENTERS THE CROWN AS A LAND"
 AUH_news_501_d:0 "The northern counties are constituted a land of the Crown of Saint Stephen, with a diet at Martin and a curia registered by nationality. Budapest concedes that the kingdom has more than one political nation."
 AUH_news_502_t:0 "BUDAPEST TREATS WITH THE ROMANIAN PARTY"
 AUH_news_502_d:0 "The minister-president has opened negotiations with the Romanian National Party on the language of administration, the confessional schools and the drawing of the Transylvanian districts. Bucharest is reading every communique."
 AUH_news_503_t:0 "BOSNIA AND HERZEGOVINA ANNEXED"
 AUH_news_503_d:0 "The provinces occupied since 1878 under the Treaty of Berlin are declared annexed to the Monarchy. The signatory powers were not consulted. Constantinople protests, Belgrade demands compensation, and the garrisons of the sandjak are to withdraw."
 AUH_news_504_t:0 "A STATUTE AND A DIET FOR SARAJEVO"
 AUH_news_504_d:0 "The territorial statute is sanctioned and a diet of ninety-two seats is called, seventy-two of them elected by confessional curiae. It is the first assembly the province has ever elected."
 AUH_news_505_t:0 "THE GARRISONS LEAVE NOVI PAZAR"
 AUH_news_505_d:0 "The troops held in the sandjak since 1879 are withdrawn. Vienna presents the evacuation as a measure of moderation. Belgrade and Cetinje observe that nothing now separates them."
 AUH_news_506_t:0 "FOURTEEN DEAD IN PIAZZA DELLA BORSA"
 AUH_news_506_d:0 "The stokers of the Lloyd had been out since Christmas over shore leave and the ten-hour watch. Troops guarding the governor fired on the procession from the Corso: eleven dead on the square. The arbitration board found for the strikers that evening."
 AUH_news_507_t:0 "AN ITALIAN UNIVERSITY FOR TRIESTE"
 AUH_news_507_d:0 "The faculty refused for fourteen years is granted, and granted where it was asked for. The Italian deputies of the Littoral have their institution; the German parties of the Tyrol have their grievance."
 AUH_news_508_t:0 "THE BELGRADE PAPERS WERE FORGED"
 AUH_news_508_d:0 "Before a Vienna court the defence has shown that the documents accusing the Croato-Serb Coalition of treason were manufactured at the imperial legation in Belgrade. The accusations are withdrawn. No apology is offered."
 AUH_news_509_t:0 "THE TRIUNE KINGDOM PROCLAIMED"
 AUH_news_509_d:0 "Croatia, Slavonia and Dalmatia are united under one diet and one crown, sworn at Zagreb. The kingdom ceases to be an appendix of the Hungarian settlement and becomes a party to it."
 AUH_news_510_t:0 "A LAND OF THE SLOVENES IS CONSTITUTED"
 AUH_news_510_d:0 "Districts surrendered by four diets are joined into a single crownland with its seat at Ljubljana. The map drawn in 1849 has been answered after sixty years."
 AUH_news_511_t:0 "SIXTEEN SENTENCED TO HANG AT BANJA LUKA"
 AUH_news_511_d:0 "The court has given judgement on a hundred and fifty-six accused of treason. Sixteen are condemned to death by hanging. Petitions for clemency are already being carried to Madrid and to Rome."
