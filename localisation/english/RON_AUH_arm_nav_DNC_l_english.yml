###############################################################################################################################
# Austria-Hungary - the army and the fleet of the Dawn of a New Century, 1900-1909.
# Lot L7b. Every key below is new; none of them exists anywhere else in the loaded English localisation.
###############################################################################################################################

# --- THE ARMY : the head and the contingent ----------------------------------------------------

 AUHDNC_arm_the_three_armies:0 "The Three Armies"
 AUHDNC_arm_the_three_armies_desc:0 "Three armies and three oaths: the common k. u. k. Armee, the Austrian Landwehr, the Hungarian Honved. Only the common army recruits in every crownland, and only it is forbidden to grow."

 AUHDNC_arm_the_recruit_contingent:0 "The Recruit Contingent"
 AUHDNC_arm_the_recruit_contingent_desc:0 "The Wehrgesetz of 1889 fixed how many men the common army may call up, and the figure has not moved since. Raising it needs both parliaments, and Budapest will not vote without payment."

 AUHDNC_arm_hold_the_common_army:0 "Hold the Common Army"
 AUHDNC_arm_hold_the_common_army_desc:0 "Refuse the bargain in either currency. The army stays common, unitary and German-worded, and exactly the size it was in 1889. This is what the Crown did: the ceiling is never lifted, and the other two roads close for good."

 AUHDNC_arm_pay_the_price_of_budapest:0 "Pay the Price of Budapest"
 AUHDNC_arm_pay_the_price_of_budapest_desc:0 "Buy the recruits with money rather than with the word of command. Budapest votes the contingent if her share of the common expenditure is renegotiated in her favour. The Quota then rises and never comes down again."

 AUHDNC_arm_impose_the_contingent:0 "Impose the Contingent"
 AUHDNC_arm_impose_the_contingent_desc:0 "Take the men: Paragraph 14 in Cisleithania, royal ordinance in Hungary, and a government that needs no majority. The counties answer as they answered Fejervary, with two years of tax strike and refused conscription."

# --- THE ARMY : road A, hold the common army ---------------------------------------------------

 AUHDNC_arm_the_chlopy_army_order:0 "The Army Order of Chlopy"
 AUHDNC_arm_the_chlopy_army_order_desc:0 "Sixteenth of September 1903, at the camp of Chlopy: the Monarch has it read to the assembled corps that the army remains common and unitary. It also makes a coalition of the Hungarian opposition."

 AUHDNC_arm_the_eighty_words_of_command:0 "The Eighty Words of Command"
 AUHDNC_arm_the_eighty_words_of_command_desc:0 "Every soldier of the common army must know about eighty German words of command and nothing more, which a Ruthene conscript can learn in a fortnight. Europe mocks the arrangement. It works."

 AUHDNC_arm_the_regimental_languages:0 "The Regimental Languages"
 AUHDNC_arm_the_regimental_languages_desc:0 "Beyond the eighty words, a regiment is administered in any language spoken by a fifth of its men, and some have three. Absurd on paper, and the least nationalist body in the Monarchy."

 AUHDNC_arm_one_oath_and_one_flag:0 "One Oath and One Flag"
 AUHDNC_arm_one_oath_and_one_flag_desc:0 "The army holds: unitary, loyal to the dynasty rather than to any nation, and too small for the country it defends. The recruit ceiling is now a settled fact, and Budapest has been refused in public once too often."

# --- THE ARMY : road B, buy the recruits -------------------------------------------------------

 AUHDNC_arm_the_quota_for_the_recruits:0 "The Quota for the Recruits"
 AUHDNC_arm_the_quota_for_the_recruits_desc:0 "The bargain in its plainest form: Vienna concedes points of the Quota, Budapest votes the contingent. The recruits arrive, and the invoice arrives with them and again at every renewal."

 AUHDNC_arm_the_contingent_of_the_new_law:0 "The Contingent of the New Law"
 AUHDNC_arm_the_contingent_of_the_new_law_desc:0 "The annual intake rises for the first time since 1889. Barracks go up, the reserve classes are called in at last, and the army begins to grow on the day it stops being free."

 AUHDNC_arm_the_common_war_ministry:0 "The Common War Ministry"
 AUHDNC_arm_the_common_war_ministry_desc:0 "The Kriegsministerium administers an army it does not pay for and settles its estimates with two delegations forbidden to sit together. Schonaich will be broken by it in five years."

 AUHDNC_arm_an_army_paid_for_by_treaty:0 "An Army Paid For By Treaty"
 AUHDNC_arm_an_army_paid_for_by_treaty_desc:0 "The largest army the Monarchy has ever fielded, and the first that exists on the terms of a contract between two states. An army that is a budget line can be cut by a chamber the Crown does not control."

# --- THE ARMY : road C, take the men -----------------------------------------------------------

 AUHDNC_arm_the_ordinance_of_the_crown:0 "The Ordinance of the Crown"
 AUHDNC_arm_the_ordinance_of_the_crown_desc:0 "Koerber governs Cisleithania by Paragraph 14 whenever the Reichsrat cannot pass a budget. Apply the method beyond the Leitha and the contingent becomes administration, not consent. Fejervary lasted a year."

 AUHDNC_arm_the_hussars_in_the_chamber:0 "The Hussars in the Chamber"
 AUHDNC_arm_the_hussars_in_the_chamber_desc:0 "Nineteenth of February 1906: a colonel and a company of Honved hussars clear the Hungarian parliament. A constitutional chamber closed by force by its own king. Nobody in Hungary forgets it."

 AUHDNC_arm_the_army_recruits_itself:0 "The Army Recruits Itself"
 AUHDNC_arm_the_army_recruits_itself_desc:0 "With the counties in resistance, the levy is carried out by officers under military authority. The men are found, and half the Monarchy's civil administration is openly bypassed to find them."

 AUHDNC_arm_an_army_above_the_nations:0 "An Army Above the Nations"
 AUHDNC_arm_an_army_above_the_nations_desc:0 "The army is now the state, and it garrisons a kingdom that regards it as an occupation. A constitutional question answered with a regiment has to keep being answered that way, month after month."

 AUHDNC_arm_the_wehrgesetz:0 "The Army Law"
 AUHDNC_arm_the_wehrgesetz_desc:0 "The new Wehrgesetz is voted at last: the intake raised, the term of service settled, the Landwehr and the Honved established in law. The Delegations grant it for two points of Quota."

# --- THE ARMY : the general staff --------------------------------------------------------------

 AUHDNC_arm_the_general_staff_of_beck:0 "The General Staff of Beck"
 AUHDNC_arm_the_general_staff_of_beck_desc:0 "Beck-Rzikowsky has been chief of the general staff since 1881: the Monarch's man, a superb administrator, cautious to the point of paralysis. He has never finished a deployment plan."

 AUHDNC_arm_the_autumn_manoeuvres:0 "The Autumn Manoeuvres"
 AUHDNC_arm_the_autumn_manoeuvres_desc:0 "Every September two corps face each other before the Monarch and half the diplomatic corps. Decided in advance, and the only occasion on which Bohemian and Galician regiments work together."

 AUHDNC_arm_the_kriegsschule:0 "The Kriegsschule"
 AUHDNC_arm_the_kriegsschule_desc:0 "The war school in the Laudongasse returns a small intake of officers to the army each year as a general staff corps. It also produces a caste that talks only to itself."

 AUHDNC_arm_the_succession_at_the_staff:0 "The Succession at the Staff"
 AUHDNC_arm_the_succession_at_the_staff_desc:0 "Beck is over seventy and the heir wants him gone. Franz Ferdinand keeps a chancellery of his own at the Belvedere and has a candidate ready. The court will not disturb an old servant."

 AUHDNC_arm_conrads_general_staff:0 "Conrad's General Staff"
 AUHDNC_arm_conrads_general_staff_desc:0 "Eighteenth of November 1906: Conrad von Hotzendorf replaces Beck, on the heir's insistence and against the court. He is the best professional soldier the Monarchy has, and a man of one idea. The memoranda begin, and never stop."

 AUHDNC_arm_keep_beck_at_the_staff:0 "Keep Beck at the Staff"
 AUHDNC_arm_keep_beck_at_the_staff_desc:0 "The court's preference, and a real one: leave the old chief in place, tell the heir's chancellery no, and keep the staff a school rather than a party. The doctrine is never rewritten and the plans stay unfinished."

 AUHDNC_arm_the_deployment_plans:0 "The Deployment Plans"
 AUHDNC_arm_the_deployment_plans_desc:0 "Conrad's staff draws up what Beck's never finished: Plan B for the Balkans, Plan R for Russia, and an Echelon meant to go either way. Whether the railways can do it, the plans do not say."

 AUHDNC_arm_the_memorandum_on_italy:0 "The Memorandum on Italy"
 AUHDNC_arm_the_memorandum_on_italy_desc:0 "Conrad's fixed conviction: the true enemy is the ally. Between 1907 and 1911 he demands a preventive war against Italy again and again in writing. Rome reads the newspapers, and knows."

 AUHDNC_arm_the_army_that_asks_for_its_war:0 "The Army That Asks For Its War"
 AUHDNC_arm_the_army_that_asks_for_its_war_desc:0 "The staff presents its case every spring, in writing, to a Monarch of seventy-eight and a foreign ministry that keeps refusing. Conrad was dismissed for exactly this in December 1911, and recalled a year later."

 AUHDNC_arm_the_school_of_caution:0 "The School of Caution"
 AUHDNC_arm_the_school_of_caution_desc:0 "The heir's own position, once one looks past the uniform: the Monarchy needs a strong army precisely so that it never has to fight a European war, because it will not survive one."

 AUHDNC_arm_an_army_not_to_be_used:0 "An Army Not To Be Used"
 AUHDNC_arm_an_army_not_to_be_used_desc:0 "A large, well-drilled, thoroughly defensive army whose purpose is to make war unattractive to everybody else. It cannot attack, and every Balkan opportunity of the coming decade is forgone."

# --- THE ARMY : the Evidenzbureau --------------------------------------------------------------

 AUHDNC_arm_the_evidenzbureau:0 "The Evidenzbureau"
 AUHDNC_arm_the_evidenzbureau_desc:0 "The intelligence bureau of the general staff, founded in 1850 and the oldest of its kind in Europe. It runs on a handful of officers and a budget that would embarrass a police district."

 AUHDNC_arm_the_kundschaftsdienst:0 "The Kundschaftsdienst"
 AUHDNC_arm_the_kundschaftsdienst_desc:0 "Military attaches, paid informants across the Balkan frontier, and a cipher section that opens the Russian and Italian diplomatic traffic. The whole of it rests on perhaps a dozen men."

 AUHDNC_arm_the_counter_espionage_group:0 "The Counter-Espionage Group"
 AUHDNC_arm_the_counter_espionage_group_desc:0 "The bureau turns inward: surveillance of the Serb, Croat and Italian associations and of the emigre press. It is efficient, and it forged the documents produced at the Zagreb trial."

# --- THE ARMY : the estimates and what they buy ------------------------------------------------

 AUHDNC_arm_the_army_estimates:0 "The Army Estimates"
 AUHDNC_arm_the_army_estimates_desc:0 "The common estimates go to two Delegations that sit in different cities and communicate by written note. Anything the army wants must pass both, and very little of it does."

 AUHDNC_arm_the_artillery_question:0 "The Artillery Question"
 AUHDNC_arm_the_artillery_question_desc:0 "The field batteries still carry the bronze gun of 1899, obsolete when it was adopted, and there is not money for a new field gun and a siege park at once. Skoda can do either. It cannot do both."

 AUHDNC_arm_the_siege_batteries:0 "The Siege Batteries"
 AUHDNC_arm_the_siege_batteries_desc:0 "Spend it on the heavy guns. From 1907 Skoda develops the 30.5 cm motor mortar, and the Monarchy can reduce a modern fortress. The field batteries keep the gun of 1899, and a modern divisional artillery is closed off."

 AUHDNC_arm_the_field_gun_of_1905:0 "The Field Gun of 1905"
 AUHDNC_arm_the_field_gun_of_1905_desc:0 "Spend it on the divisions: a modern quick-firing gun and recoil system for the field batteries, and no siege train at all. There will be no answer to a fortified line, and the siege park is closed off for good."

 AUHDNC_arm_the_thirty_and_a_half_mortar:0 "The Thirty-and-a-Half Mortar"
 AUHDNC_arm_the_thirty_and_a_half_mortar_desc:0 "The 30.5 cm mortar of Pilsen: motor-drawn, in action within hours where a comparable Krupp piece needs a rail spur. It exists because the field batteries were made to wait."

 AUHDNC_arm_the_mountain_batteries:0 "The Mountain Batteries"
 AUHDNC_arm_the_mountain_batteries_desc:0 "Half the Monarchy's frontier stands on end. A gun that breaks down onto mule-back is worth more in the Tyrol and the Carpathians than any weight of metal that cannot get there."

 AUHDNC_arm_the_artillery_of_the_landwehr:0 "The Artillery of the Landwehr"
 AUHDNC_arm_the_artillery_of_the_landwehr_desc:0 "The two territorial armies have infantry, cavalry and no guns of their own, which is how the common army prefers it. Give them batteries and the common army loses its monopoly."

 AUHDNC_arm_the_steyr_rifle_works:0 "The Steyr Rifle Works"
 AUHDNC_arm_the_steyr_rifle_works_desc:0 "Steyr is the largest small-arms works in Europe and can turn out rifles faster than the Delegations will vote for them. The cheapest military decision available, and the slowest to take."

 AUHDNC_arm_the_mannlicher_repeater:0 "The Mannlicher Repeater"
 AUHDNC_arm_the_mannlicher_repeater_desc:0 "The M1895 with its straight-pull bolt: fast, robust, disliked by ordnance boards elsewhere and loved by the men who carry it. One rifle and one cartridge for all three armies."

 AUHDNC_arm_the_schwarzlose_machine_gun:0 "The Schwarzlose Machine Gun"
 AUHDNC_arm_the_schwarzlose_machine_gun_desc:0 "A delayed-blowback gun with far fewer parts than the Maxim, cheap to make and forgiving of bad water. Adopted in 1907 and issued thinly: the right weapon in the wrong quantity."

 AUHDNC_arm_the_boot_and_the_field_kitchen:0 "The Boot and the Field Kitchen"
 AUHDNC_arm_the_boot_and_the_field_kitchen_desc:0 "Rolling field kitchens, standardised marching boots, a divisional train that arrives. None of it is voted with enthusiasm, and it is the first line the Delegations strike out."

 AUHDNC_arm_the_army_of_fifty_millions:0 "The Army of Fifty Millions"
 AUHDNC_arm_the_army_of_fifty_millions_desc:0 "At last an establishment proportionate to the population. The civil economy carries it in consumer goods, and the political capital of the Monarchy is mortgaged to a settlement renewed every ten years."

# --- THE ARMY : the officer corps and the Alpine frontier --------------------------------------

 AUHDNC_arm_the_officer_corps_of_many_tongues:0 "The Officer Corps of Many Tongues"
 AUHDNC_arm_the_officer_corps_of_many_tongues_desc:0 "The last genuinely supranational body in Europe: underpaid to the point of scandal, obliged to lodge a deposit before marrying, and losing its best men to the railways every year."

 AUHDNC_arm_the_three_year_language_rule:0 "The Three-Year Language Rule"
 AUHDNC_arm_the_three_year_language_rule_desc:0 "An officer has three years to learn the regimental language of his men, and most of them manage it. In this Monarchy that effort is worth more to the men than a pay rise."

 AUHDNC_arm_the_kaiserjager_and_the_landesschutzen:0 "The Kaiserjager and the Landesschutzen"
 AUHDNC_arm_the_kaiserjager_and_the_landesschutzen_desc:0 "Four regiments of Tyrolean Kaiserjager, three of Landesschutzen, and a rifle-club tradition that arms half the valleys by custom. The Tyrol will not spare them for another front."

 AUHDNC_arm_the_military_railways:0 "The Military Railways"
 AUHDNC_arm_the_military_railways_desc:0 "Mobilisation is a railway timetable. The Alpine and Carpathian lines were built for freight and tourists, and the deployment tables assume a capacity the engineers say does not exist."

 AUHDNC_arm_the_alpine_barrier:0 "The Alpine Barrier"
 AUHDNC_arm_the_alpine_barrier_desc:0 "Concrete works along the Tyrolean and Carinthian frontier, facing a country with which the Monarchy is formally allied. The estimates call it fortress maintenance. Rome can read a map."

 AUHDNC_arm_the_army_the_monarchy_could_afford:0 "The Army the Monarchy Could Afford"
 AUHDNC_arm_the_army_the_monarchy_could_afford_desc:0 "Well trained, well officered, correctly armed, and sized by a quota rather than by a general staff. A first-class army bought on second-class terms, and the terms are renegotiated every ten years."

# --- THE NAVY : the fleet and its purpose ------------------------------------------------------

 AUHDNC_nav_the_kuk_kriegsmarine:0 "The k. u. k. Kriegsmarine"
 AUHDNC_nav_the_kuk_kriegsmarine_desc:0 "Every ship is voted twice, in Vienna and in Budapest, and Hungary requires her share of the orders to follow her share of the cost. The smallest fleet of any great power, and nobody asked for it."

 AUHDNC_nav_the_marinesektion:0 "The Marinesektion"
 AUHDNC_nav_the_marinesektion_desc:0 "The naval section of the common War Ministry: the fleet has no ministry of its own and no minister in either chamber. Spaun runs it until October 1904 with no talent whatever for lobbying."

 AUHDNC_nav_the_vote_of_the_two_delegations:0 "The Vote of the Two Delegations"
 AUHDNC_nav_the_vote_of_the_two_delegations_desc:0 "Sixty Austrian delegates and sixty Hungarian, in separate buildings, forbidden to debate together, voting the naval estimates line by line. Every credit raises the next price."

 AUHDNC_nav_the_coast_defence_school:0 "The Coast Defence School"
 AUHDNC_nav_the_coast_defence_school_desc:0 "Spaun's case, and a serious one: the Adriatic is a corridor with two doors, and torpedo craft, monitors and coast batteries will hold it for a fraction of the price of a battle fleet. No squadron will pass Otranto again."

 AUHDNC_nav_the_high_seas_school:0 "The High Seas School"
 AUHDNC_nav_the_high_seas_school_desc:0 "Montecuccoli's case, and also a serious one: a fleet that cannot leave its own sea is a hostage, not an instrument. The estimates quadruple over the decade, the Quota rises to pay them, and Hungary sees no sea."

 AUHDNC_nav_the_monitors_of_the_danube:0 "The Monitors of the Danube"
 AUHDNC_nav_the_monitors_of_the_danube_desc:0 "Shallow-draught river monitors built at Budapest, the one part of the navy unambiguously useful to Hungary. The cheapest goodwill the Marinesektion will ever buy."

 AUHDNC_nav_the_torpedo_flotillas:0 "The Torpedo Flotillas"
 AUHDNC_nav_the_torpedo_flotillas_desc:0 "Torpedo craft in the Dalmatian channels, where the islands make a screen no battle line can force at speed. Small hulls, small estimates, and a real threat in confined water."

 AUHDNC_nav_the_whitehead_works:0 "The Whitehead Works"
 AUHDNC_nav_the_whitehead_works_desc:0 "Robert Whitehead built the first self-propelled torpedo at Fiume in 1866, and the works there are still the first in the world. They sell to every navy in the Mediterranean, Italy included."

 AUHDNC_nav_a_fleet_that_stays_at_home:0 "A Fleet That Stays At Home"
 AUHDNC_nav_a_fleet_that_stays_at_home_desc:0 "The corridor is closed and nothing leaves it. No range, no landing capacity, no squadron east of Otranto ever again, and one more common institution has quietly become a provincial affair."

 AUHDNC_nav_montecuccoli_takes_the_helm:0 "Montecuccoli Takes the Helm"
 AUHDNC_nav_montecuccoli_takes_the_helm_desc:0 "October 1904: Montecuccoli succeeds Spaun - an unremarkable seaman, the finest lobbyist in the Monarchy, and the heir's man. In ten years he will have dreadnoughts and never a naval law."

 AUHDNC_nav_the_flottenverein:0 "The Flottenverein"
 AUHDNC_nav_the_flottenverein_desc:0 "The Austrian Navy League, founded in 1904 on the German model and paid for by the firms that would build the ships. It manufactures a naval public in a country that has never seen the sea."

 AUHDNC_nav_the_erzherzog_karl_class:0 "The Erzherzog Karl Class"
 AUHDNC_nav_the_erzherzog_karl_class_desc:0 "Three pre-dreadnought battleships of ten thousand tons, in service in 1906 and 1907. Already the wrong ships, since Dreadnought commissions the same season, and proof a fleet can be built at all."

 AUHDNC_nav_the_radetzky_class:0 "The Radetzky Class"
 AUHDNC_nav_the_radetzky_class_desc:0 "Three semi-dreadnoughts of fourteen and a half thousand tons with a 30.5 cm battery, laid down between 1907 and 1909. The Delegations vote in pieces, and Budapest prices every piece."

 AUHDNC_nav_the_price_of_the_keels:0 "The Price of the Keels"
 AUHDNC_nav_the_price_of_the_keels_desc:0 "The credits of 1908 and 1909 are the first in which Hungary bargains her share of the orders against her vote, in writing. Every keel now has a nationality before it has a name."

 AUHDNC_nav_the_arsenal_at_pola:0 "The Arsenal at Pola"
 AUHDNC_nav_the_arsenal_at_pola_desc:0 "Pola is the fleet's home port, its arsenal, its gunnery school and, for most of its officers, its whole world: an Istrian town of Italian speech running a German-worded service."

 AUHDNC_nav_the_bay_of_cattaro:0 "The Bay of Cattaro"
 AUHDNC_nav_the_bay_of_cattaro_desc:0 "The finest natural harbour in the Adriatic and the fleet's southern anchor, far nearer the Otranto narrows than Pola is. Everything about it is ideal except the mountain standing over it."

 AUHDNC_nav_the_coastal_batteries:0 "The Coastal Batteries"
 AUHDNC_nav_the_coastal_batteries_desc:0 "Heavy guns in concrete above the entrances to the bays. Cheap, visibly defensive, and the only part of the naval estimate a Hungarian delegate has never in living memory opposed."

 AUHDNC_nav_the_lovcen_question:0 "The Lovcen Question"
 AUHDNC_nav_the_lovcen_question_desc:0 "Mount Lovcen rises seventeen hundred metres above the Bocche di Cattaro, and it is Montenegrin. One battery on that summit closes the southern base; taking it brings in Belgrade and Petersburg."

 AUHDNC_nav_the_stabilimento_tecnico:0 "The Stabilimento Tecnico Triestino"
 AUHDNC_nav_the_stabilimento_tecnico_desc:0 "The yard at Trieste is the only establishment in the Monarchy that can build a capital ship, and it sits in a city whose council is Italian-national and whose workforce is Slovene."

 AUHDNC_nav_the_first_submarines:0 "The First Submarines"
 AUHDNC_nav_the_first_submarines_desc:0 "U-1 and U-2 to a Lake design, U-3 and U-4 from Germaniawerft, delivered between 1908 and 1910. Four boats of three patterns, and the service will pay for it in spare parts."

 AUHDNC_nav_the_mine_and_torpedo_service:0 "The Mine and Torpedo Service"
 AUHDNC_nav_the_mine_and_torpedo_service_desc:0 "Mine barrages in the channels and torpedo practice off Sebenico, with ordnance from a private firm at Fiume that sells the same article to every navy in the Mediterranean."

 AUHDNC_nav_the_austrian_lloyd:0 "The Austrian Lloyd"
 AUHDNC_nav_the_austrian_lloyd_desc:0 "The Lloyd of Trieste carries the mail of the Levant under subsidy, and its officers and engine-room ratings are the reserve on which a peacetime fleet depends."

 AUHDNC_nav_the_seamen_of_the_littoral:0 "The Seamen of the Littoral"
 AUHDNC_nav_the_seamen_of_the_littoral_desc:0 "The fleet is manned from the Quarnero islands, the Dalmatian coast and the Istrian towns. Recruit and pay them properly and the southern peoples become indispensable rather than suspect."

 AUHDNC_nav_the_harbour_of_trieste:0 "The Harbour of Trieste"
 AUHDNC_nav_the_harbour_of_trieste_desc:0 "The seventh port of Europe, the outlet of Bohemian industry, and the reason there is a navy at all. Every crown spent at Trieste will have to be matched at Fiume."

 AUHDNC_nav_the_fleet_and_the_two_states:0 "The Fleet and the Two States"
 AUHDNC_nav_the_fleet_and_the_two_states_desc:0 "The question the Delegations have never once answered aloud: what is a battle fleet for, in an empire with no colonies and an army it cannot afford to equip?"

 AUHDNC_nav_the_fleet_of_a_land_power:0 "The Fleet of a Land Power"
 AUHDNC_nav_the_fleet_of_a_land_power_desc:0 "Answer it honestly: a land power does not need a battle fleet. The capital programme stops, the yards turn to other work, and the crews and credits go to the army. Naval construction is crippled for a generation."

 AUHDNC_nav_the_adriatic_is_ours:0 "The Adriatic Is Ours"
 AUHDNC_nav_the_adriatic_is_ours_desc:0 "Answer it the other way: a power that cannot close its own sea is not a power, and this sea has an Italian shore. The Quota rises five points at a stroke, and Rome draws the obvious conclusion in public."

###############################################################################################################################
# The ideas of the army and the fleet.
###############################################################################################################################

 AUH_arm_the_three_armies:0 "The Three Armies"
 AUH_arm_the_three_armies_desc:0 "Common army, Landwehr and Honved recruit in parallel and reach deeper into the population than one establishment would. No exercise ever brings all three together."

 AUH_arm_the_army_of_all_the_peoples:0 "The Army of All the Peoples"
 AUH_arm_the_army_of_all_the_peoples_desc:0 "The one institution in which the peoples of the Monarchy are not in competition. The ceiling that keeps it unitary is the same ceiling that keeps it starved."

 AUH_arm_one_oath_and_one_flag:0 "One Oath and One Flag"
 AUH_arm_one_oath_and_one_flag_desc:0 "An army loyal to a dynasty rather than to a nation, and sized for the population of 1889. Excellent, cohesive, and unable to grow."

 AUH_arm_the_purchased_contingent:0 "The Purchased Contingent"
 AUH_arm_the_purchased_contingent_desc:0 "The recruits were bought with points of the Quota. They arrive, they train quickly, and the invoice is presented again at every renewal, larger each time."

 AUH_arm_an_army_paid_for_by_treaty:0 "An Army Paid For By Treaty"
 AUH_arm_an_army_paid_for_by_treaty_desc:0 "The largest establishment the Monarchy has ever had, and a line in a contract between two states. A chamber the Crown does not control can cut it by a vote."

 AUH_arm_the_army_by_ordinance:0 "The Army by Ordinance"
 AUH_arm_the_army_by_ordinance_desc:0 "Men taken under emergency powers on both sides of the Leitha. The levy works, and the constitution has been shown to be a convenience."

 AUH_arm_an_army_above_the_nations:0 "An Army Above the Nations"
 AUH_arm_an_army_above_the_nations_desc:0 "An army that answers to the Crown alone and garrisons its own kingdom. It costs stability and political capital every month it exists."

 AUH_arm_the_kriegsschule:0 "The Kriegsschule"
 AUH_arm_the_kriegsschule_desc:0 "A general staff corps with a common method and a common vocabulary, and a caste that speaks to nobody outside itself."

 AUH_arm_the_school_of_beck:0 "The School of Beck"
 AUH_arm_the_school_of_beck_desc:0 "Twenty-five years of careful administration. The army trains beautifully, entrenches beautifully, and has no finished plan for attacking anybody."

 AUH_arm_an_army_not_to_be_used:0 "An Army Not To Be Used"
 AUH_arm_an_army_not_to_be_used_desc:0 "A strong army whose purpose is to make war unnecessary. It digs in superbly and cannot mount an offensive campaign at any reasonable price."

 AUH_arm_the_case_against_italy:0 "The Case Against Italy"
 AUH_arm_the_case_against_italy_desc:0 "The staff plans against the ally every year and says so in writing. No third party wishes to be seen in an alliance with the author."

 AUH_arm_the_army_that_asks_for_its_war:0 "The Army That Asks For Its War"
 AUH_arm_the_army_that_asks_for_its_war_desc:0 "A general staff that demands a preventive war every spring. The plans are ready, and the civil power spends its authority refusing them."

 AUH_arm_the_kundschaftsdienst:0 "The Kundschaftsdienst"
 AUH_arm_the_kundschaftsdienst_desc:0 "Attaches, informants and a cipher section that reads more foreign traffic than the budget can justify. It rests on a dozen men and pays them badly."

 AUH_arm_the_counter_espionage_group:0 "The Counter-Espionage Group"
 AUH_arm_the_counter_espionage_group_desc:0 "Excellent detection work, turned inward on the Monarchy's own subjects. The Zagreb forgeries came out of this office, and so did the reputation."

 AUH_arm_the_siege_train:0 "The Siege Train"
 AUH_arm_the_siege_train_desc:0 "The heaviest mobile artillery in Europe, built at Pilsen. Fortresses fall to it, and the field batteries keep the gun of 1899."

 AUH_arm_the_field_artillery_of_1905:0 "The Field Artillery of 1905"
 AUH_arm_the_field_artillery_of_1905_desc:0 "Modern quick-firing guns with the divisions and nothing at all in the siege park. The infantry advances behind its own artillery and cannot break a fortified line."

 AUH_arm_the_mannlicher_standard:0 "The Mannlicher Standard"
 AUH_arm_the_mannlicher_standard_desc:0 "One rifle and one cartridge for all three armies, the only uniform thing in the establishment, and Steyr cannot make enough of it."

 AUH_arm_the_train_and_the_kitchen:0 "The Train and the Kitchen"
 AUH_arm_the_train_and_the_kitchen_desc:0 "Rolling field kitchens, boots that last a campaign, a divisional train that arrives. Unfashionable, decisive, and the first thing struck from the estimates."

 AUH_arm_the_army_of_fifty_millions:0 "The Army of Fifty Millions"
 AUH_arm_the_army_of_fifty_millions_desc:0 "An establishment proportionate at last to the population, carried by a civil economy that feels every crown and by a settlement bought again every ten years."

 AUH_arm_the_officer_corps_of_many_tongues:0 "The Officer Corps of Many Tongues"
 AUH_arm_the_officer_corps_of_many_tongues_desc:0 "The last supranational officer corps in Europe: underpaid, required to learn its men's languages, and slower to train than anyone else's."

 AUH_arm_the_tyrolean_rifles:0 "The Tyrolean Rifles"
 AUH_arm_the_tyrolean_rifles_desc:0 "Kaiserjager and Landesschutzen, the best mountain infantry in Europe, raised in four valleys that expect them to be used in those four valleys."

 AUH_arm_the_alpine_barrier:0 "The Alpine Barrier"
 AUH_arm_the_alpine_barrier_desc:0 "Concrete along a frontier the Monarchy shares with a formal ally. It holds ground superbly and says aloud in the estimates what the foreign ministry will not."

 AUH_arm_the_army_the_monarchy_could_afford:0 "The Army the Monarchy Could Afford"
 AUH_arm_the_army_the_monarchy_could_afford_desc:0 "Well trained, well officered, and sized by a quota rather than by a general staff. A first-class army held on second-class terms, and the terms expire."

 AUH_nav_the_common_fleet:0 "The Common Fleet"
 AUH_nav_the_common_fleet_desc:0 "A fleet voted twice, in two cities, by two delegations not allowed to debate together. No keel is laid until both have said yes to the same line."

 AUH_nav_the_delegation_credits:0 "The Delegation Naval Credits"
 AUH_nav_the_delegation_credits_desc:0 "Credits obtained by playing the two chambers against each other. The yards run fast, and Budapest remembers every one at the next settlement."

 AUH_nav_the_coast_defence_school:0 "The Coast Defence School"
 AUH_nav_the_coast_defence_school_desc:0 "The Adriatic is a corridor, and a corridor can be held with batteries, mines and torpedo craft. Cheap, sufficient, and unable to show a flag elsewhere."

 AUH_nav_the_high_seas_school:0 "The High Seas School"
 AUH_nav_the_high_seas_school_desc:0 "A fleet built to leave its own sea. It gives the Monarchy a voice in the eastern Mediterranean, paid for out of the consumer's pocket."

 AUH_nav_the_whitehead_torpedo:0 "The Whitehead Torpedo"
 AUH_nav_the_whitehead_torpedo_desc:0 "The first torpedo works in the world, at Fiume, selling to every navy in the Mediterranean including the ones it would have to be used against."

 AUH_nav_a_fleet_that_stays_at_home:0 "A Fleet That Stays At Home"
 AUH_nav_a_fleet_that_stays_at_home_desc:0 "Batteries that cannot be forced and flotillas that know every channel, and a navy that will never appear beyond Otranto in any circumstance."

 AUH_nav_the_flottenverein:0 "The Flottenverein"
 AUH_nav_the_flottenverein_desc:0 "A naval public manufactured out of nothing by a league paid for by the builders. It carries the estimates and makes naval policy a matter of opinion."

 AUH_nav_the_guns_above_cattaro:0 "The Guns Above Cattaro"
 AUH_nav_the_guns_above_cattaro_desc:0 "The heights over the Bocche taken by force of arms. The southern base is secure, and the Balkans have seen what the Monarchy does with an inconvenient frontier."

 AUH_nav_the_triestine_yards:0 "The Triestine Yards"
 AUH_nav_the_triestine_yards_desc:0 "The one establishment in the Monarchy that can build a capital ship, in a city whose council is Italian-national and whose workforce is Slovene."

 AUH_nav_the_austrian_lloyd:0 "The Austrian Lloyd"
 AUH_nav_the_austrian_lloyd_desc:0 "Subsidised steamers on the Levant run, and with them the reserve of officers and engine-room ratings a peacetime fleet cannot otherwise keep."

 AUH_nav_the_fleet_of_a_land_power:0 "The Fleet of a Land Power"
 AUH_nav_the_fleet_of_a_land_power_desc:0 "The capital programme stopped and the money sent to the army. The regiments are the better for it and the naval yards are wrecked for a generation."

 AUH_nav_the_adriatic_is_ours:0 "The Adriatic Is Ours"
 AUH_nav_the_adriatic_is_ours_desc:0 "A fleet that closes its own sea, built at a cost the civil economy carries and read in Rome as exactly what it is."
