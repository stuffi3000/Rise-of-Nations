l_english:
 AUH_DNC_armoured_cars_desc:0 "Austro-Daimler's works at Wiener Neustadt build motor cars for gentlemen. Bolt boiler plate to one and mount a machine gun, and a patrol covers ground no squadron of hussars can manage on fodder."
 AUH_DNC_cheap_fleet_desc:0 "The delegations vote the naval budget in kronen, not in tonnage. Hulls that leave Trieste quickly and cheaply fill the Adriatic sooner than perfect ones, and the yards can repair what breaks."
 AUH_DNC_tanks_desc:0 "Armour on wheels stops at the first ditch. Engineer officers want the same plate on caterpillar tracks, a gun that crosses a trench instead of driving round it. Skoda at Pilsen can roll the steel."
 AUH_DNC_dockyards_desc:0 "Ships ordered abroad come home late and dear. Trieste and Pola can lay down their own slips, and the yard that builds a hull is the yard that knows how to repair it after the first storm."
 AUH_DNC_independent_officers_desc:0 "A company commander in Galicia is three days from any order that matters. Let him act on his own judgement, and the eighty words of German command need carry only the essentials."
 AUH_DNC_more_dockyards_desc:0 "Budapest votes for the fleet only when Hungarian yards get the orders. New slipways at Fiume alongside Trieste buy those votes and double the hulls that can stand on the stocks at once."
 AUH_DNC_assault_rifle_desc:0 "Steyr has built Mannlicher's self-loading designs for years and the army has adopted none; the objection is always the ammunition a soldier would burn. Answer the quartermasters and a squad carries a gun team's fire."
 AUH_DNC_offensive_army_desc:0 "The General Staff has drawn its war plans against Russia and Italy since Beck took it over in 1881, and none of them survives a long campaign. Divisions drilled to attack aim to settle one in a single season."
 AUH_DNC_battlecruisers_desc:0 "Sankt Georg is building in the Pola arsenal, the heaviest cruiser the navy has ordered. Line guns on a hull fast enough to outrun whatever it cannot fight would need longer slips than the Adriatic has."
 AUH_DNC_decentralised_army_desc:0 "Twelve recruiting languages and one drill book. Rather than fight that, let regiments train in their own tongue under officers who speak it. Morale rises as the staff's timetables lose their grip."
 AUH_DNC_expensive_fleet_desc:0 "Trieste can build to the standard of any yard in Europe if the delegations pay. Fewer hulls, thicker armour and gunnery that hits at range, so the fleet does not embarrass the Emperor at a review."
 AUH_DNC_improve_doctrine_desc:0 "Conrad wrote the tactics primers a generation of staff officers studied at the Vienna Kriegsschule. Rewrite them for magazine rifles and quick-firing guns before the next manoeuvres prove them wrong."
 AUH_DNC_endless_advance_desc:0 "The General Staff assumes the army attacks Serbia and Russia in the same fortnight. Train divisions to keep moving after the first success, or the second week stalls where the first ended."
 AUH_DNC_minimum_wage_desc:0 "Taaffe's laws gave the workers accident insurance in 1887 and sick funds in 1888, and nothing on pay. A floor under wages costs the industrialists their tempers and buys steadier hands at the bench."
 AUH_DNC_esprit_de_corps_desc:0 "Each regiment recruits from its own district and keeps its own march and its own tongue. Men serve beside cousins and neighbours, and a regiment that remembers Custoza is slower to break than one filled from a depot."
 AUH_DNC_auxilliary_corps_desc:0 "Every attack ends waiting on the men who carry the wire, the bridging timber and the wounded. Engineer, telegraph and medical detachments cost little and keep a division fighting after the first day."
 AUH_DNC_support_middle_class_desc:0 "The Bohemian and Viennese workshops that employ twenty men are where the next factory comes from. Credit from the Creditanstalt and a lighter hand at the tax office lets a few grow into one."
 AUH_DNC_patrol_boats_desc:0 "The Adriatic is a corridor of islands where a torpedo boat is worth more than a battleship. Yarrow and Thornycroft on the Thames build the best of them; buy a pattern, copy it at Trieste, and the coast can be watched nightly."
 AUH_DNC_offensive_artillery_desc:0 "The field batteries still fire bronze guns, while the French have had a steel seventy-five with a recoil brake in the line since 1897. Skoda at Pilsen can deliver a quick-firing piece; the treasury must be told why."
 AUH_DNC_fiscal_reforms_desc:0 "Bohm-Bawerk left the finance ministry rather than sign the army's bills. A tax system that collects from the whole monarchy, not only from those too poor to argue, spares his successor that choice."
 AUH_DNC_escorts_desc:0 "Austrian Lloyd sails from Trieste to Bombay and the Adria line out of Fiume; both routes pass water an enemy cruiser could close in a week. Torpedo craft in company make that raid expensive."
 AUH_DNC_light_artillery_desc:0 "Half the monarchy's frontier is mountain. A gun that breaks down into mule loads and comes up the Bosnian tracks behind the infantry is worth more there than a battery tied to the valley road."
 AUH_DNC_pride_of_the_fleet_desc:0 "Montecuccoli has told the delegations for years that a fleet without ships of the line is a coastal police force. Order the big hulls and the Adriatic yards will finally learn how to build them."
 AUH_DNC_standardise_designs_desc:0 "Steyr, Pilsen and the Weiss works at Csepel each cut their own patterns, so a broken bolt in Galicia waits on the right factory. One drawing for all three, and any depot can repair anything."
 AUH_DNC_invite_foreign_investors_desc:0 "French and Belgian money already runs tramways and mines from Bohemia to Transylvania. Guarantee the concessions and it will build the works the domestic banks are too cautious to finance."
 AUH_DNC_trade_desc:0 "Trieste and Fiume are the monarchy's only doors to the sea. More steamers under the merchant ensign mean cotton for the Bohemian mills without paying an Italian house to carry it."
 AUH_DNC_chemicals_desc:0 "The Hague declaration of 1899 forbids shells that spread asphyxiating gas. It says nothing about a laboratory learning what such a shell would do, and Nobel's works near Pressburg know the chemistry."
 AUH_DNC_build_railroads_desc:0 "Koerber's investment law of 1901 promised new alpine lines down to Trieste and canals to the north. Finished track carries grain out of Hungary and reservists into Galicia on the same rails."
 AUH_DNC_coastal_defense_desc:0 "Pola guards the fleet, and Cattaro guards nothing until the heights above it are held. Concrete batteries on the Dalmatian headlands cost less than the squadron that would otherwise stay home."
 AUH_DNC_improve_gas_masks_desc:0 "The rescue crews in the Ostrava pits go down after firedamp with breathing sets on their backs. The same apparatus, made light enough to march in, stands between a battalion and its own chemists."
 AUH_DNC_military_academy_desc:0 "The Theresian academy at Wiener Neustadt has made lieutenants since Maria Theresa founded it in 1751. A staff school in the capital teaches the rest: railways, mobilisation tables, foreign armies."
 AUH_DNC_coal_mines_desc:0 "The pits at Ostrava and Karvina raise the only good coking coal the monarchy has, and the furnaces at Witkowitz eat it as fast as it comes up. Sink new shafts or keep buying from Prussian Silesia."
 AUH_DNC_new_cruisers_desc:0 "A cruiser here must scout for the fleet at dawn and show the flag off Salonika by the end of the month. Turbines in place of triple expansion buy that speed, if the yards can be made to fit them."
 AUH_DNC_never_ending_barrage_desc:0 "Infantry holds a ridge only as long as the guns behind it keep firing. Deep magazines, telephone wire back to the battery and gunners trained to shoot off the map turn a position into a wall."
 AUH_DNC_intercept_enemies_desc:0 "Whitehead's works at Fiume sold the world its first torpedo, and now the navy wants boats to carry it under water. Two hulls of each foreign type, tried at Pola, will show the officers which to build."
 AUH_DNC_heavy_artillery_desc:0 "A modern fort is concrete under a steel cupola and a field gun only scratches it. Pilsen casts siege mortars for the coast; a piece heavy enough to break Belgrade or Verona can be hauled by road."
 AUH_DNC_naval_academy_desc:0 "Cadets have gone to the naval academy at Fiume since 1857 for seamanship and navigation. Serving officers need a second school, with charts, fleet problems and the handling of a squadron at sea."
 AUH_DNC_streamlined_production_desc:0 "An arsenal that fits every rifle by hand makes good rifles slowly. Gauges, interchangeable parts and piecework at Steyr will fill the depots faster than the inspectors can fault the finish."
 AUH_DNC_optimise_profit_desc:0 "The iron and coal masters already meet to fix their prices; let the ministry sit in. Cartels that agree on grades and freight rates get more out of the same seam than pits clawing at each other."
 AUH_DNC_full_speed_ahead_desc:0 "Ganz of Budapest sold transformers across Europe and put three-phase locomotives on an Italian main line. Fund the technical schools behind that work and the next such patent stays in the monarchy."
 AUH_DNC_order_and_discipline_desc:0 "An army of eleven nationalities holds together on drill, the field manual and the same punishment for everyone. Inspections without warning are cheaper than courts martial after a rout."
 AUH_DNC_mass_urbanisation_desc:0 "Vienna is closing on two million and Budapest doubles in a generation. Trams, water mains and cheap flats keep the villagers who arrive at work here instead of on a boat out of Hamburg."
 AUH_DNC_university_desc:0 "Prague's university was cut in two in 1882, one German and one Czech, because neither side would sit through the other's lectures. Chairs and laboratories matter more than the quarrel over language."
 AUH_DNC_no_antiquities_desc:0 "Line regiments carry Mannlicher straight-pulls while second-line battalions still draw single-shot Werndls from store. One rifle and one cartridge for the common army, the Landwehr and the Honved alike."
 AUH_DNC_tungsten_mines_desc:0 "Bohler at Kapfenberg makes tool steel that cuts faster the more tungsten goes into it, and every kilogram is bought abroad. A workable seam in the Styrian Alps takes the mills off foreign suppliers."
 AUH_DNC_defensive_army_desc:0 "The monarchy can be attacked from Petersburg, Rome and Belgrade in the same week, and cannot outnumber any of them. An army that digs in and holds buys the diplomats the months they need."
 AUH_DNC_grandest_ships_desc:0 "The Habsburg ships on the stocks at Trieste carry three heavy guns on eight thousand tons, a coast-defence hull with a grand name. If the delegations are asked for a battleship, ask for one fit to stand in an Italian line."
 AUH_DNC_centralised_army_desc:0 "One war ministry, one General Staff, one timetable. While the Landwehr answers to Vienna and the Honved to Budapest, no plan of mobilisation survives its first week intact."
 AUH_DNC_raider_doctrine_desc:0 "A fleet that cannot meet the Italians in line can still make the Adriatic unusable. Submarines and torpedo craft out of Pola and Cattaro force an enemy to escort every transport he sends south."
 AUH_DNC_better_doctrine_desc:0 "Manoeuvres keep ending with the umpires praising a closed attack and the machine guns ruled silent. Rewrite the regulations around fire and the spade, whatever the cavalry generals say."
 AUH_DNC_endless_defense_desc:0 "A position is held with a spade before it is held with a rifle. Wire, communication trenches and a second line make a breakthrough cost the attacker a fortnight instead of an afternoon."
 AUH_DNC_planned_economy_desc:0 "The state already owns the railways and the salt and tobacco monopolies. Extend the same hand to coal, steel and arms contracts, and the ministries decide what the empire builds, not the Vienna bourse."
 AUH_DNC_rations_desc:0 "Copper, nickel and hides go to whoever bids highest, which in peacetime is never the artillery. Allocate them by ministry order and a new shell works can count on the metal it was promised."
 AUH_DNC_new_admirality_desc:0 "The navy is a section of the war ministry, and its commander argues with generals over every krone. An admiralty with a staff of its own would plan campaigns instead of defending estimates."
