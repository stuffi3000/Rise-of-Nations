l_english:

###############################################################################################################################
# Austria-Hungary : the way out of a nationality crisis.
# Every key below is new to this file.
###############################################################################################################################

# --- The four tabs -----------------------------------------------------------------------------

 AUH_settlement_prevention:0 "The Ministry of the Interior"
 AUH_settlement_prevention_desc:0 "Concessions are cheap while a nationality is still speaking to you. Above 45 the registers are open and the deputies still come to the Ballhausplatz. Nothing here is available once they stop."
 AUH_settlement_compromise:0 "The Compromises of the Provinces"
 AUH_settlement_compromise_desc:0 "Moravia in 1905, Bukovina in 1910, Galicia in 1914. A grievance is not answered, it is turned into a contract: so many seats, so many schools, so many offices. The province that gains them is not the province that pays."
 AUH_settlement_rescue:0 "The Charters of the Crown"
 AUH_settlement_rescue_desc:0 "Under 35 a crown land is no longer crown land in law. Only a new legal title serves, and the Crown signs one such title to a reign. The four charters left unsigned stay unsigned."
 AUH_settlement_emergency:0 "The Province in Arms"
 AUH_settlement_emergency_desc:0 "Under 5 the province is armed and the retaking begins on the 120th day. A rising is not put down here, it is converted: adjourned, dispersed, chartered, or released as a subject."

# --- Prevention --------------------------------------------------------------------------------

 AUH_settlement_moravian_cadastre:0 "The Moravian Compromise"
 AUH_settlement_moravian_cadastre_desc:0 "Four provincial laws of 27 November 1905. Every voter enters a Czech or a German register, the Diet sits in national curiae, and the school administration is doubled. Nationality follows the list, not the map."
 AUH_settlement_bukovina_seats:0 "The Bukovina Compromise"
 AUH_settlement_bukovina_seats_desc:0 "Wassilko, Onciul and Straucher divide a Diet of 63 seats among Romanians, Ruthenes, Jews, Germans and Poles. Three minority leaders bargain the province out themselves. The German and Jewish deputies vote against."
 AUH_settlement_polish_club_in_office:0 "The Polish Club in Office"
 AUH_settlement_polish_club_in_office_desc:0 "Sixty-three seats of four hundred and twenty-five, and no majority in the Reichsrat without them. Vienna buys Galicia's votes with Galicia itself, and stops asking who governs there."
 AUH_settlement_cisleithanian_franchise:0 "Universal Manhood Suffrage"
 AUH_settlement_cisleithanian_franchise_desc:0 "The curial franchise ends. Sanctioned 26 January 1907, first polling on 14 and 23 May, 516 seats instead of 425. The German notables lose the curia that made them a majority they never were."
 AUH_settlement_school_laws_suspended:0 "Suspend the School Laws of 1907"
 AUH_settlement_school_laws_suspended_desc:0 "Laws XXVI and XXVII of 31 May 1907 made Hungarian compulsory in every primary school, church schools included. Let the clauses lapse and the Uplands hear their own language in class again."
 AUH_settlement_italian_faculty:0 "The Italian Faculty"
 AUH_settlement_italian_faculty_desc:0 "Innsbruck opened an Italian law faculty on 3 November 1904 and lost it the next day to a riot. Found it where it is wanted, in the Littoral, and let the Germans of Tyrol read about it in the papers."
 AUH_settlement_slovak_school_fund:0 "Fund the Slovak School Associations"
 AUH_settlement_slovak_school_fund_desc:0 "Vienna pays for what Budapest forbids: reading rooms, primers, a teacher's salary in Turciansky Svaty Martin. The money is Cisleithanian, the schools are Transleithanian, and Budapest counts every crown."
 AUH_settlement_littoral_language_decree:0 "The Language of Daily Use in the Littoral"
 AUH_settlement_littoral_language_decree_desc:0 "Italian conceded office by office in Trieste, Gorizia and Istria. Each decree is signed by a governor and read as a defeat in Graz and in Ljubljana."

# --- The compromises ---------------------------------------------------------------------------

 AUH_settlement_galician_compromise:0 "The Galician Compromise"
 AUH_settlement_galician_compromise_desc:0 "Lemberg, 14 February 1914. The Ruthenes take 27.2 per cent of the Diet and two seats of eight on the provincial board, for 42 per cent of eight million people. Kost Levytsky calls it the first real settlement on Galician soil."
 AUH_settlement_bohemian_cadastre:0 "Carry the Cadastre into Bohemia"
 AUH_settlement_bohemian_cadastre_desc:0 "The Moravian model was offered to Bohemia in 1913 and refused. The stake is ten times larger: the schools, the offices and the most industrial province of the Monarchy. The Diet may sit, or it may be dissolved."
 AUH_settlement_transylvanian_talks:0 "The Transylvanian Negotiation"
 AUH_settlement_transylvanian_talks_desc:0 "Tisza offers the Romanian National Party thirty constituencies, Romanian before the courts of first instance and in the local administration, and one state gymnasium. He wants something in writing for it."
 AUH_settlement_zagreb_reversed:0 "Undo the Zagreb Verdict"
 AUH_settlement_zagreb_reversed_desc:0 "Thirty-one Serbs were convicted on documents the Friedjung trial showed to be forgeries made in the Belgrade legation. A constitutional ban, a quashed verdict and a pardon cost less than the trial did."

# --- The charters ------------------------------------------------------------------------------

 AUH_settlement_third_crown:0 "The Third Crown"
 AUH_settlement_third_crown_desc:0 "What the Belvedere chancellery drafted and never got: a South Slav kingdom beside Vienna and Budapest. The Croats, the Slovenes and the Serbs of the Monarchy get a crown. The crown of Saint Stephen loses Croatia."
 AUH_settlement_hungarian_franchise_octroi:0 "The Vote Given to Hungary"
 AUH_settlement_hungarian_franchise_octroi_desc:0 "Kristoffy's programme of 1905, carried out instead of threatened: the vote to the Slovak, Romanian and Serb peasant, and the gentry reduced to a minority in its own kingdom. Fall U is in the drawer if the counties refuse."
 AUH_settlement_austro_polish_crown:0 "The Austro-Polish Crown"
 AUH_settlement_austro_polish_crown_desc:0 "Galicia raised out of the class of provinces into a kingdom under the Habsburgs. The Polish Club gets everything it has asked for since 1867, and the Ruthenes are handed to Lemberg for good."
 AUH_settlement_fifteen_states:0 "The United States of Greater Austria"
 AUH_settlement_fifteen_states_desc:0 "Aurel C. Popovici published the plan and the map in Leipzig in 1906: fifteen national states in place of two kingdoms. No parliament will vote it. It goes out as an octroi, over the heads of Vienna and Budapest alike."
 AUH_settlement_personal_register:0 "The Register of Declared Nationality"
 AUH_settlement_personal_register_desc:0 "Moravia's principle made imperial. Rights follow the list a man signs, not the ground he stands on. Every language declared becomes a bill for schools, courts and bilingual clerks, and no register once opened is closed again."

# --- The province in arms ----------------------------------------------------------------------

 AUH_settlement_commission_of_inquiry:0 "Send a Commission of Inquiry"
 AUH_settlement_commission_of_inquiry_desc:0 "A privy councillor, two ministerial secretaries and a stenographer, sent where the gendarmerie cannot go. They will hear the grievances at length. Nothing else about the province changes."
 AUH_settlement_state_of_siege:0 "Proclaim the State of Exception"
 AUH_settlement_state_of_siege_desc:0 "Prague on 2 December 1908, Croatia on 4 and 5 April 1912: the constitution suspended, a royal commissioner in the ban's chair, decrees on the press, on assembly and on communal autonomy. It works, and it is read everywhere."
 AUH_settlement_charter_under_duress:0 "Concede the Charter"
 AUH_settlement_charter_under_duress_desc:0 "Sign what is demanded while it is being demanded. The province lays down its arms and keeps what it took. Vienna and Budapest both learn what a rising is worth, and both send in a bill of their own."
 AUH_settlement_subjects_not_rebels:0 "Subjects, Not Rebels"
 AUH_settlement_subjects_not_rebels_desc:0 "The province is not retaken. It is released, given a prince, a flag and a garrison of its own, and left inside the Monarchy as a subject. The Community pays for every title signed away."

# --- What the tooltips promise -----------------------------------------------------------------

 AUH_settlement_charter_sealed_tt:0 "§RThe Crown signs one charter to a reign. The other four are closed for good.§!"
 AUH_settlement_moravian_cadastre_tt:0 "§GThe Czechs enter the register and the curiae§!, §Rthe Germans of Moravia lose the majority the curia gave them§!, and §Rthe school estimates are paid twice§!."
 AUH_settlement_bukovina_seats_tt:0 "§GThe Ruthenes and the Romanians take seats by name§!. §RThe Poles read a precedent against their own monopoly§!, and §Rthe German and Jewish deputies vote against§!."
 AUH_settlement_polish_club_tt:0 "§GSixty-three votes carry every estimate in the Reichsrat§!. §RGalicia is governed by the Club, and nothing is built there§!, and §Rthe Ruthenes are told to wait again§!."
 AUH_settlement_cisleithanian_franchise_tt:0 "§GFive and a half million men on the rolls, and every nationality of Cisleithania in the Chamber§!. §RThe German notables lose the curia§!, and §Rthe Community is bargained through thirty national clubs§!."
 AUH_settlement_school_laws_tt:0 "§GSlovak, Romanian and Serb schools teach in their own tongue again§!. §RBudapest reads a suspended school law as a suspended Compromise§!."
 AUH_settlement_italian_faculty_tt:0 "§GThe Italians of the Monarchy get the faculty Innsbruck would not keep§!. §RThe Germans of Tyrol and the Slovenes of Trieste both take it as a loss§!."
 AUH_settlement_slovak_school_fund_tt:0 "§GVienna pays for the Slovak schools Budapest forbids§!. §RBudapest counts the crowns and answers in the Diet§!."
 AUH_settlement_littoral_decree_tt:0 "§GItalian is conceded office by office in the Littoral§!. §RThe German associations of Graz call it a surrender§!."
 AUH_settlement_galician_compromise_tt:0 "§G27.2 per cent of the Diet and two seats of eight on the board§!. §RThe Polish monopoly on Galicia is broken, and the Club invoices every seat§!."
 AUH_settlement_bohemian_talks_tt:0 "The Bohemian Diet is convened. It will either sign the four laws, partition itself, or be dissolved."
 AUH_settlement_transylvanian_talks_tt:0 "Tisza receives Mihali, Maniu and Braniste. What he asks for in exchange decides whether they sign."
 AUH_settlement_zagreb_reversed_tt:0 "§GThe verdict falls, the ban is constitutional again and the Sabor speaks§!. §RBudapest loses the commissioner it had installed§!."
 AUH_settlement_third_crown_tt:0 "§GA South Slav crown, and the Croats, Slovenes and Serbs inside it§!. §RThe crown of Saint Stephen loses Croatia, the counties strike, and the Quota is renegotiated downward§!."
 AUH_settlement_magyar_franchise_tt:0 "§GThe Slovak, Romanian and Serb peasant votes in Hungary§!. §RThe comitats refuse the tax and the recruits, and the army holds the counties instead of the frontier§!."
 AUH_settlement_austro_polish_crown_tt:0 "§GA kingdom of Poland under the Habsburgs, and the Club satisfied at last§!. §REast Galicia passes to Lemberg for good, and Berlin has a Polish question of its own§!."
 AUH_settlement_fifteen_states_tt:0 "§GEvery nationality of the Monarchy gets a state of its own§!. §RNeither capital voted for it, the contingent collapses, and every law must be carried fifteen times§!."
 AUH_settlement_personal_register_tt:0 "§GThe small nations exist in law for the first time§!. §RThe German and Magyar paper majorities are gone, and every recognised language is a permanent bill§!."
 AUH_settlement_commission_tt:0 "§GSixty days added to every rising§!. §RThe province reads the commission as a delay and says so§!."
 AUH_settlement_state_of_siege_tt:0 "§GEvery rising is dispersed and the administration answers again§!. §RMartial law in one crown land is read in all of them§!."
 AUH_settlement_charter_under_duress_tt:0 "§GEvery rising lays down its arms and keeps its charter§!. §RVienna and Budapest both send in a bill§!."
 AUH_settlement_subjects_not_rebels_tt:0 "§GThe risen provinces become subjects instead of enemies§!. §RThe Community pays for every title signed away, and the army loses their recruits§!."
 AUH_settlement_bohemia_partitioned_tt:0 "§GThe Germans of Bohemia get districts they hold outright§!. §RThe Czechs lose the unity of the crown of Saint Wenceslas, which was the whole claim§!."
 AUH_settlement_bohemia_by_commission_tt:0 "§GThe province is administered, and the estimates pass§!. §RThe Diet of Bohemia does not sit again while the commission does§!."
 AUH_settlement_transylvania_refused_tt:0 "§RThe Romanian National Party will not sign a renunciation. The talks break off and both sides publish their version.§!"
 AUH_settlement_school_laws_reopened_tt:0 "§GThe school laws of 1907 go back on the table, and the Uplands notice before Transylvania does§!. §RBudapest treats it as a breach of the Compromise§!."

# --- What the conditions read ------------------------------------------------------------------

 AUH_settlement_czech_still_talking_tt:0 "The Czech deputies are still negotiating (§Oabove 45§!)"
 AUH_settlement_ruthene_still_talking_tt:0 "The Ruthene deputies are still negotiating (§Oabove 45§!)"
 AUH_settlement_pole_still_talking_tt:0 "The Polish Club is still negotiating (§Oabove 45§!)"
 AUH_settlement_german_still_talking_tt:0 "The German parties will still hear of a franchise bill (§Oabove 45§!)"
 AUH_settlement_slovak_reachable_tt:0 "The Slovak associations still answer the post (§Oabove 35§!)"
 AUH_settlement_italian_reachable_tt:0 "The Trentine notables still answer the post (§Oabove 30§!)"
 AUH_settlement_slovak_register_open_tt:0 "The Slovak register is not full (§Obelow 100§!)"
 AUH_settlement_italian_register_open_tt:0 "The Italian register is not full (§Obelow 100§!)"
 AUH_settlement_ruthene_grievance_tt:0 "The Ruthenes have a grievance and have not yet risen on it (15 to 45)"
 AUH_settlement_czech_grievance_tt:0 "The Czechs have a grievance and have not yet risen on it (15 to 45)"
 AUH_settlement_romanian_grievance_tt:0 "The Romanians have a grievance and have not yet risen on it (15 to 45)"
 AUH_settlement_croat_grievance_tt:0 "The Croats have a grievance and have not yet risen on it (15 to 45)"
 AUH_settlement_south_slav_lost_tt:0 "A South Slav nationality has fallen out of the law (§Rbelow 35§!)"
 AUH_settlement_hungarys_nations_lost_tt:0 "A nationality of the Hungarian half has fallen out of the law (§Rbelow 35§!)"
 AUH_settlement_pole_lost_tt:0 "Galicia has fallen out of the law (§Rbelow 35§!)"
 AUH_settlement_the_book_is_read_tt:0 "A great nationality has fallen out of the law, and Popovici is being read in the ministries (§Rbelow 35§!)"
 AUH_settlement_small_nations_lost_tt:0 "A nationality with no crown land of its own has fallen out of the law (§Rbelow 35§!)"
 AUH_settlement_a_province_in_arms_tt:0 "At least one province is in arms"
 AUH_settlement_a_province_to_release_tt:0 "At least one province in arms has a title to be released into"
 AUH_settlement_rising_ends_tt:0 "The province lays down its arms when the register passes 10"
 AUH_settlement_hungarian_rising_ends_tt:0 "The counties resume work when the register passes 10, or 30 while the national resistance holds"
 AUH_settlement_polish_crown_threat:0 "A Habsburg crown of Poland"
 AUH_settlement_faculty_bonus:0 "The Italian faculty"

# --- The price of each settlement ---------------------------------------------------------------

 AUH_settlement_the_moravian_cadastre:0 "The Moravian Cadastres"
 AUH_settlement_the_moravian_cadastre_desc:0 "Two registers of voters, two curiae in the Diet, two school administrations, and every child at the school of his own nationality. The only national settlement in the Monarchy that worked, and the province pays for it twice over."
 AUH_settlement_the_bucovina_seats:0 "The Seats of Czernowitz"
 AUH_settlement_the_bucovina_seats_desc:0 "Sixty-three seats where there were thirty-one, and every nationality of the province named in the electoral order. Nothing passes in Czernowitz now without four bargains first."
 AUH_settlement_the_club_in_office:0 "The Club Governs Galicia"
 AUH_settlement_the_club_in_office_desc:0 "Sixty-three deputies carry the estimates in Vienna, and in exchange Galicia is theirs. Roads, schools and inspectors follow the Club's convenience, and the poorest province in the Monarchy stays that way."
 AUH_settlement_the_franchise_of_1907:0 "The Franchise of 1907"
 AUH_settlement_the_franchise_of_1907_desc:0 "Every man over twenty-four on the rolls, 516 seats, and the Chamber divided into national clubs down to the social democrats. The Reichsrat is representative at last, and no longer able to decide anything quickly."
 AUH_settlement_the_school_laws_suspended:0 "The School Laws Unenforced"
 AUH_settlement_the_school_laws_suspended_desc:0 "The Apponyi clauses stand in the statute book and are not applied. The Uplands and the Banat teach in their own tongue, the state pays for teachers it did not train, and Budapest calls the arrangement illegal every session."
 AUH_settlement_the_italian_faculty:0 "The Italian Faculty"
 AUH_settlement_the_italian_faculty_desc:0 "Lecture halls, a law library and a student body the police watch closely. The Monarchy trains its own Italian jurists instead of losing them to Padua, and the Tyrolean associations riot about it on the anniversary."
 AUH_settlement_the_galician_seats:0 "The Galician Seats"
 AUH_settlement_the_galician_seats_desc:0 "27.2 per cent of the Diet and two places of eight on the Landesausschuss, written into the provincial statute. The Ruthenes are in the administration, and the Club no longer carries the government's majority for nothing."
 AUH_settlement_the_bohemian_cadastre_signed:0 "The Bohemian Cadastres"
 AUH_settlement_the_bohemian_cadastre_signed_desc:0 "The Moravian laws carried into the province that makes the Monarchy's steel, sugar and rifles. The Diet sits, the works run, and two school systems and two sets of offices are paid for out of one budget."
 AUH_settlement_the_transylvanian_terms:0 "The Transylvanian Terms"
 AUH_settlement_the_transylvanian_terms_desc:0 "Thirty constituencies, Romanian in the local administration and before the courts of first instance, one state gymnasium. Bucharest loses its lever on Transylvania, and Budapest re-reads the text at every session."
 AUH_settlement_the_ban_restored:0 "A Constitutional Ban"
 AUH_settlement_the_ban_restored_desc:0 "The Sabor speaks, the franchise is wider, the verdict of Zagreb is quashed and the convicted are pardoned. Croatia is governed by law again, and the men who signed the forged documents are still in the service."
 AUH_settlement_the_third_crown_charter:0 "The Third Crown"
 AUH_settlement_the_third_crown_charter_desc:0 "A South Slav kingdom beside Vienna and Budapest, with its own diet, its own regiments and a Habsburg on the throne. Everything of substance must now be carried three times, and Budapest carries nothing willingly."
 AUH_settlement_the_counties_refuse:0 "The Counties Refuse"
 AUH_settlement_the_counties_refuse_desc:0 "The comitats will not execute the orders, will not collect the unvoted tax and will not furnish the recruits. Royal commissioners take the chairs of the elected assemblies, and the gendarmerie collects what it can."
 AUH_settlement_the_magyar_franchise:0 "The Vote in Hungary"
 AUH_settlement_the_magyar_franchise_desc:0 "The peasant of the Uplands, the Banat and the Backa votes, and the gentry that ran Hungary since 1867 is a minority in its own Chamber. Every bill is now a bargain with men who have nothing to thank Budapest for."
 AUH_settlement_the_austro_polish_crown:0 "The Austro-Polish Crown"
 AUH_settlement_the_austro_polish_crown_desc:0 "A kingdom of Poland under the Habsburgs, with Galician regiments and a Polish administration. Berlin sees a rival claim on the same nation, and the Ruthenes see the men of Lemberg confirmed above them for good."
 AUH_settlement_the_fifteen_states_charter:0 "The United States of Greater Austria"
 AUH_settlement_the_fifteen_states_charter_desc:0 "Fifteen national states, each with its own diet and its own language of administration, proclaimed over the heads of both parliaments. Nothing is quick any more, and the common army is the only thing still called common."
 AUH_settlement_the_personal_register:0 "The Register of Nationality"
 AUH_settlement_the_personal_register_desc:0 "A man declares his nationality and his rights follow the declaration. Yiddish, Slovak and Ruthene become answers the state must accept, and every one of them is a bill for schools, courts and bilingual clerks."
 AUH_settlement_government_by_commissioner:0 "Government by Commissioner"
 AUH_settlement_government_by_commissioner_desc:0 "The constitution suspended, the elected assembly replaced by a nominee, the press licensed and assembly forbidden. The province is administered rather than governed, and the officers sent to hold it are not on the frontier."
 AUH_settlement_the_charter_under_duress:0 "Signed Under Duress"
 AUH_settlement_the_charter_under_duress_desc:0 "The concession was extracted, not granted, and everybody knows the difference. The next province to raise a barricade knows the tariff, and the ministries know they can be made to pay it again."
 AUH_settlement_the_subjects_of_the_crown:0 "Subjects of the Crown"
 AUH_settlement_the_subjects_of_the_crown_desc:0 "Provinces that answer to Vienna without belonging to it: their own princes, their own budgets, their own levies. The common army lost their recruits, and the common treasury lost their taxes, on the day the charters were sealed."

# --- The Bohemian negotiation --------------------------------------------------------------------

 auh_settlement.1.t:0 "The Diet of Bohemia"
 auh_settlement.1.d:0 "Prague has the Moravian laws on the table and will not sign them as they stand. The Germans want ground they can hold; the Czechs want the crown of Saint Wenceslas whole. Both delegations are waiting in the Landhaus."
 auh_settlement.1.a:0 "Four laws, as in Moravia."
 auh_settlement.1.b:0 "Districts on the map, not names in a register."
 auh_settlement.1.c:0 "Dissolve the Diet and appoint a commission."

# --- The Transylvanian negotiation -----------------------------------------------------------------

 auh_settlement.2.t:0 "Tisza Receives the Romanians"
 auh_settlement.2.d:0 "Mihali, Maniu and Braniste have the offer: thirty constituencies, the language in the local courts, a gymnasium. Tisza wants the Party to declare the settlement final and approve the dualist system without reserve."
 auh_settlement.2.a:0 "They will sign the renunciation, or there is nothing."
 auh_settlement.2.b:0 "Take the accord, and leave it open to revision."
 auh_settlement.2.c:0 "Drop the seats and reopen the school laws instead."

# --- The press --------------------------------------------------------------------------------

 AUH_news_600_t:0 "MORAVIA SIGNS - TWO REGISTERS, TWO CURIAE, TWO SCHOOL BOARDS"
 AUH_news_600_d:0 "Four provincial laws passed at Bruenn. Every voter of the margraviate is entered on a Czech or a German list, the Diet sits in national curiae, and each child attends the school of his own nationality. Bohemia is watching."
 AUH_news_601_t:0 "CZERNOWITZ AGREES - SIXTY-THREE SEATS, FIVE NATIONALITIES"
 AUH_news_601_d:0 "The Diet of Bukovina has voted the national settlement by two thirds. Romanians, Ruthenes, Jews, Germans and Poles take seats by name. The German and Jewish deputies voted against. Three minority leaders bargained it themselves."
 AUH_news_602_t:0 "LEMBERG: THE RUTHENES ENTER THE DIET"
 AUH_news_602_d:0 "A new provincial statute gives the Ruthenes 27.2 per cent of the seats and two places of eight on the provincial board. The Polish monopoly of half a century is broken. Levytsky calls it the first real settlement on this soil."
 AUH_news_603_t:0 "THE CURIAE ARE ABOLISHED - EVERY MAN A VOTE"
 AUH_news_603_d:0 "The Crown has sanctioned universal manhood suffrage in the lands represented in the Reichsrat. Five and a half million men on the rolls, 516 seats instead of 425. The class franchise of 1873 is finished, and so are the notables."
 AUH_news_604_t:0 "THE CROWN GIVES HUNGARY THE VOTE"
 AUH_news_604_d:0 "What Kristoffy proposed in 1905 has been decreed. The Slovak, Romanian and Serb peasant votes, and the gentry is a minority in the Chamber of Saint Stephen. The comitats have begun to refuse the tax and the recruits."
 AUH_news_605_t:0 "BOHEMIA TAKES THE MORAVIAN LAWS"
 AUH_news_605_d:0 "The Diet in Prague has voted the national registers, the separate curiae and the divided school boards. The richest province of the Monarchy has settled its national question by contract. The estimates for it are enormous."
 AUH_news_606_t:0 "TRANSYLVANIA: THIRTY SEATS AND THE COURTS"
 AUH_news_606_d:0 "Budapest and the Romanian National Party have come to terms. Thirty constituencies, Romanian in the local administration and before the courts of first instance, one state gymnasium. Bucharest has lost an argument it liked."
 AUH_news_607_t:0 "A THIRD CROWN FOR THE SOUTH SLAVS"
 AUH_news_607_d:0 "The Monarchy has three crowns. A South Slav kingdom takes its place beside Vienna and Budapest, with its own diet and its own regiments. The crown of Saint Stephen has lost Croatia, and Budapest has not consented."
 AUH_news_608_t:0 "A HABSBURG KING OF POLAND"
 AUH_news_608_d:0 "Galicia has been raised out of the class of provinces. A kingdom of Poland under the Habsburgs, with its own administration and its own regiments. Berlin is not pleased. Lemberg governs the Ruthene districts now, without appeal."
 AUH_news_609_t:0 "FIFTEEN STATES - THE OCTROI IS PROCLAIMED"
 AUH_news_609_d:0 "The plan Popovici published in Leipzig in 1906 has been proclaimed as law. Fifteen national states replace two kingdoms, each with its diet and its language of administration. Neither parliament was asked, and both have said so."
 AUH_news_610_t:0 "THE STATE OF EXCEPTION IS PROCLAIMED"
 AUH_news_610_d:0 "The constitution is suspended in the disturbed lands. A royal commissioner sits where the elected assembly sat, the press is licensed and public meetings are forbidden. The province is quiet, and the quiet is being counted."
 AUH_news_611_t:0 "THE RISEN PROVINCES ARE GIVEN PRINCES"
 AUH_news_611_d:0 "Rather than retake them, the Crown has released them. The provinces in arms have their own governments, their own flags and their own levies, and remain inside the Monarchy as subjects. The common treasury has lost their taxes."
