# --- IDEAS -----------------------------------------------------------------------------------

 AUH_the_municipal_debt:0 "The Municipal Undertakings"
 AUH_the_municipal_debt_desc:0 "Vienna owns the tramway, the gasworks and the power station, and pays for them out of a credit that is pledged for twenty years. The city builds faster than anyone else and cannot stop."

 AUH_the_street_before_the_chamber:0 "The Street before the Chamber"
 AUH_the_street_before_the_chamber_desc:0 "The lesson of 28 November 1905 is that a hundred thousand men on the Ringstrasse move a government faster than a division in the Chamber does. Everyone has learned it, including the government."

 AUH_the_altar_and_the_language:0 "The Altar and the Language"
 AUH_the_altar_and_the_language_desc:0 "German national in politics and Catholic in the parish. The combination holds the countryside and offends the men who left Rome, and neither wing trusts the other with a school board."

 AUH_the_diet_obstructed:0 "The Diet Obstructed"
 AUH_the_diet_obstructed_desc:0 "The diet at Prague sits, and stops the provincial budget every spring. Keeping it open is a policy; being able to pay for anything through it is not."

 AUH_the_volksrat_umbrella:0 "The Deutscher Volksrat"
 AUH_the_volksrat_umbrella_desc:0 "Every German association of the Reichsrat lands answers to one committee. It speaks with one voice and it expects the government to answer in the same voice."

 AUH_the_beamtenministerium:0 "The Ministry of Officials"
 AUH_the_beamtenministerium_desc:0 "A cabinet of senior civil servants with no party behind it. It survives every crisis except the one that needs a vote, and nothing it decides is ever thought legitimate."

 AUH_the_frontier_patrolled:0 "The Closed Language Frontier"
 AUH_the_frontier_patrolled_desc:0 "The line is drawn, and gendarmes keep it. No school, no signpost and no clerk crosses it in the wrong language, and the province pays for the men who make sure."

 AUH_the_bohemian_settlement_signed:0 "The Bohemian Settlement"
 AUH_the_bohemian_settlement_signed_desc:0 "What the negotiations of 1913 could not carry: a signed division of schools, offices and taxes in Bohemia. The kingdom is governable again and the German north has lost its veto."

 AUH_the_two_rolls_of_galicia:0 "The Two Rolls of Galicia"
 AUH_the_two_rolls_of_galicia_desc:0 "Every elector in the province is entered as Pole or as Ruthene, and school and seat follow the roll. It works, and it turns the Polish Club from a pillar of the state into a grievance."

 AUH_the_coalition_in_office:0 "The Coalition in Office"
 AUH_the_coalition_in_office_desc:0 "Wekerle at the head, Kossuth at Commerce, Andrassy at the Interior, Apponyi at Education. They agree on the nationalities and on nothing else, and they still want the army."

 AUH_the_franchise_as_a_weapon:0 "The Franchise as a Weapon"
 AUH_the_franchise_as_a_weapon_desc:0 "Kristoffy's device: hold universal suffrage over the gentry until it gives way. It works once. Afterwards nobody in Budapest believes another word the crown says."

 AUH_the_counties_refuse:0 "The Counties Refuse"
 AUH_the_counties_refuse_desc:0 "The comitats are self-governing, with elected officials, and they will not collect a tax that was never voted or send a recruit who was never granted."

 AUH_the_county_commissioners:0 "The Royal Commissioners"
 AUH_the_county_commissioners_desc:0 "A commissioner sits where the county assembly used to. The tax is collected and the recruits arrive, and every gentleman in the kingdom now has a personal reason to be in opposition."

 AUH_the_magnates_second_chamber:0 "The Upper House of Magnates"
 AUH_the_magnates_second_chamber_desc:0 "The second chamber belongs to the great estates and blocks anything that touches them. It is the steadiest institution in Hungary and the reason the land question never moves."

 AUH_the_contingent_held_hostage:0 "The Contingent Held Hostage"
 AUH_the_contingent_held_hostage_desc:0 "The recruit bill has to pass two parliaments, and Budapest sells its half every time. The establishment of 103 100 men has not moved since 1889 while the population has grown by ten million."

 AUH_the_house_under_the_gavel:0 "The House under the Gavel"
 AUH_the_house_under_the_gavel_desc:0 "The standing orders are rewritten so that obstruction is impossible. Bills pass, the contingent is voted, and the opposition takes its case out of the Chamber and into the country."

 AUH_the_plural_ballot:0 "The Plural Ballot"
 AUH_the_plural_ballot_desc:0 "Everyone votes, and a man with a degree votes three times. It answers the demand for the franchise without answering the arithmetic behind it, and both sides know that."

 AUH_the_secret_ballot_of_the_kingdom:0 "The Secret Ballot"
 AUH_the_secret_ballot_of_the_kingdom_desc:0 "Open voting under the landlord's eye was not a detail of the Hungarian system, it was the system. Once the ballot is secret the government majority has to be bought instead of watched."

 AUH_the_thousand_holdings:0 "The Land of the Thousand Holdings"
 AUH_the_thousand_holdings_desc:0 "The great estate feeds the empire and votes for the government. The men who work it own nothing, and the ones who mind that buy a ticket at Fiume."

 AUH_the_charter_renewed:0 "The Joint Bank Charter"
 AUH_the_charter_renewed_desc:0 "The Austro-Hungarian Bank keeps the note of issue for both halves. Credit is cheap and common, and Budapest is reminded once a decade that the currency is not its own."

 AUH_the_honved_establishment:0 "The Honved Establishment"
 AUH_the_honved_establishment_desc:0 "The Honved stops being a militia and becomes an army with its own depots, schools and supply. The kingdom has soldiers of its own, and two supply services now compete for the same rail."

 AUH_the_land_commission_of_prague:0 "The Land Commission of Prague"
 AUH_the_land_commission_of_prague_desc:0 "The diet is set aside and a commission of officials governs the kingdom. The provincial budget passes on time, and every Czech party is now in opposition to the state itself."

 AUH_the_benches_emptied:0 "The Benches Emptied"
 AUH_the_benches_emptied_desc:0 "The Czech deputies are removed and the Chamber is quiet. Business moves. Nothing decided in that Chamber will be thought binding in Prague."

 AUH_the_language_of_the_office:0 "The Language of the Office"
 AUH_the_language_of_the_office_desc:0 "Ruthene at the counter when the clerk chooses, Polish in the file always. It satisfies the letter of article 19 and nobody who has to use it."

 AUH_the_question_left_too_long:0 "The Question Left Too Long"
 AUH_the_question_left_too_long_desc:0 "The direction was taken, but taken late, after the arguments had hardened and the money had gone. Everyone remembers the years of drift better than the decision."

 AUH_settled_while_it_was_cheap:0 "Settled While It Was Cheap"
 AUH_settled_while_it_was_cheap_desc:0 "The question was decided before the arguments hardened, and the cabinet has room to move that no later cabinet will have. A country that has just been given something is not a country that wants a war."

 AUH_the_german_question:0 "The German Question"
 AUH_the_german_question_desc:0 "About a third of Cisleithania speaks German and almost all of the administration writes in it. The advantage is real, and so is the temptation to look north instead of holding what is here."

 AUH_the_hungarian_question:0 "The Hungarian Question"
 AUH_the_hungarian_question_desc:0 "The lands of Saint Stephen are a kingdom with its own diet, its own ministry and its own harvest, and every common matter has to be agreed twice before it exists at all."

 AUH_the_bruenn_sections:0 "The Bruenn Sections"
 AUH_the_bruenn_sections_desc:0 "The congress of 1899 organised one party section per nation under one executive. It is the only body in the monarchy that argues in every language at once, and it will not vote credits for anyone's war."

 AUH_the_club_walks_out:0 "The Club Walks Out"
 AUH_the_club_walks_out_desc:0 "Sixty-five Polish deputies leave the Chamber and no majority is possible without them. The canals and the branch lines that bought them stop being paid for, which is the only comfort available."

 AUH_the_first_mass_party:0 "The First Mass Party"
 AUH_the_first_mass_party_desc:0 "Lueger's machine reaches the small master and the parish and turns out the vote, and it does both in one language. When it wants a professor moved, as in 1908, the professor is moved."

 AUH_the_conference_adjourned:0 "The Conference Adjourned"
 AUH_the_conference_adjourned_desc:0 "The party leaders meet away from the Chamber, exchange memoranda and agree to meet again. Nothing is settled, but nothing is burning either, and the cabinet spends its weeks in the room."

 AUH_the_house_cleared_by_force:0 "The House Cleared by Force"
 AUH_the_house_cleared_by_force_desc:0 "Soldiers cleared the Chamber of Budapest in February 1906. The government can now decide what it likes, and the comitats answer by refusing the tax and the recruits."

 AUH_the_party_of_work:0 "The Party of Work"
 AUH_the_party_of_work_desc:0 "Tisza's majority is disciplined, permanent and returned by about six per cent of the population. The other ninety-four per cent keep their answer for the emigration office."

 AUH_the_millennial_state:0 "The Millennial State"
 AUH_the_millennial_state_desc:0 "A thousand years of the crown of Saint Stephen, taught in one language to children who speak another. It holds the kingdom together and it teaches the kingdom nothing new."

 AUH_the_harvest_strikes:0 "The Harvest Strikes"
 AUH_the_harvest_strikes_desc:0 "The hands stop work on the great estates of the plain at the one moment of the year when it cannot be borne. The crop suffers and the government gets the pretext it wanted for a labour act."

 AUH_the_bohemian_third_crown:0 "The Third Crown"
 AUH_the_bohemian_third_crown_desc:0 "Bohemia is crowned and the monarchy has three governments where it had two. The Czech question is answered and the bill for a third court, a third ministry and a third budget arrives every year."

 AUH_the_sokol_movement:0 "The Sokol Movement"
 AUH_the_sokol_movement_desc:0 "Tens of thousands drill in step at the slet of Prague, fit and organised and answerable to a committee that is not the army's. The recruits are better; the loyalty is borrowed."

 AUH_the_internment_at_thalerhof:0 "The Internment at Thalerhof"
 AUH_the_internment_at_thalerhof_desc:0 "The villages judged Russophile are emptied into a camp near Graz. There is nothing left in the east to garrison, because there is nobody left in it who can be trusted or who is there."

# --- THE PRESS, 400-411 ----------------------------------------------------------------------

 AUH_news_400_t:0 "FIVE MILLION MEN GET THE VOTE"
 AUH_news_400_d:0 "The Emperor has sanctioned universal manhood suffrage for the Reichsrat lands. The curias of 1873 are abolished; 5 526 203 men enter the rolls and the Chamber grows from 425 seats to 516. Hungary keeps its six per cent."

 AUH_news_401_t:0 "AWAY FROM ROME"
 AUH_news_401_d:0 "The German national associations have made conversion a political programme. Parishes in the Alpine lands and northern Bohemia report departures for the Evangelical church. The Catholic press asks whether an apostolic monarchy may fund its own opposition."

 AUH_news_402_t:0 "GERMAN AUSTRIA BECOMES A LAND"
 AUH_news_402_d:0 "The German lands of the monarchy are constituted as one crown land with a diet of their own. Vienna ceases to be the state and becomes one capital among several. The other nations have taken careful note of the precedent."

 AUH_news_403_t:0 "A CABINET OF GENERALS AT BUDAPEST"
 AUH_news_403_d:0 "Baron Geza Fejervary, captain of the royal bodyguard, has been made prime minister of Hungary against the majority returned at the polls. The comitats are refusing the tax and the recruits. The word darabont is already in every newspaper."

 AUH_news_404_t:0 "MAGYAR IN EVERY SCHOOL"
 AUH_news_404_d:0 "Acts XXVI and XXVII require every child in the kingdom to speak and write Magyar by the end of the fourth primary year, confessional schools included. Teachers face a state examination within two years. Croatia-Slavonia is exempt."

 AUH_news_405_t:0 "ONLY THE CROWN REMAINS IN COMMON"
 AUH_news_405_d:0 "Hungary has taken its own bank, its own tariff and its own war ministry. What is left of the settlement of 1867 is the person of the king. The two halves will now negotiate as states, and every renewal will be a treaty."

 AUH_news_406_t:0 "MORAVIA SIGNS"
 AUH_news_406_d:0 "Four provincial laws end nine years of negotiation. Every elector in Moravia is entered on a Czech roll or a German one; the diet votes in separate curias and each child attends the school of his nation. Bohemia is watching."

 AUH_news_407_t:0 "GERMAN DECLARED THE LANGUAGE OF THE STATE"
 AUH_news_407_d:0 "What the offices have practised since Badeni fell is now written down. Nine languages remain recognised for use, and one is the language of record. The Czech benches have left the Chamber and the Slav clubs are meeting tonight."

 AUH_news_408_t:0 "CROWNED AT PRAGUE"
 AUH_news_408_d:0 "The crown of Saint Wenceslas has left its chamber for the first time since 1836. The kingdom of Bohemia has a crowned king again, and a third capital now claims what Budapest obtained in 1867. Vienna has agreed to the ceremony and to the bill."

 AUH_news_409_t:0 "POLES AND RUTHENES COME TO TERMS"
 AUH_news_409_d:0 "The diet of Galicia has adopted a new statute and a new electoral ordinance. The Ruthenes take 27.2 per cent of the seats and two places of eight on the provincial committee. Kost Levytsky calls it the first real agreement made on Galician ground."

 AUH_news_410_t:0 "THE POLISH LANDS LOOK TO VIENNA"
 AUH_news_410_d:0 "The monarchy has declared for an Austro-Polish settlement: the Polish lands attached to Vienna with a diet at Cracow. Berlin had a plan of its own and has been told of this one after the fact. Petersburg has not been told at all."

 AUH_news_411_t:0 "A UKRAINIAN UNIVERSITY AT LEMBERG"
 AUH_news_411_d:0 "Chairs are to be founded in Ruthene at Lemberg, thirteen years after some six hundred students walked out of the Polish faculties. The Polish Club has voted against and stayed in the majority. The Greek Catholic seminaries will supply the first professors."
