l_english:

###############################################################################################################################
# Austria-Hungary - the nationalities of the north and the west, columns A and B.
# Tooltips, tech bonus names, threat names, the ideas of the four roads, and the press, 400-411.
###############################################################################################################################

# --- THE GERMAN AUSTRIANS, TOOLTIPS ----------------------------------------------------------

 AUH_tt_four_doors_of_vienna:0 "Four ways to hold Cisleithania: the street, the town hall, the ordinance, the nation. Only one door opens."
 AUH_tt_adler_party_of_all_tongues:0 "Victor Adler's party is the only one organised in every language of the Reichsrat lands."
 AUH_tt_tramway_taken_over:0 "The Wiener Tramway-Gesellschaft was wound up on 1 December 1898; the city took over operation on 1 July 1903."
 AUH_tt_paragraph_fourteen_count:0 "Paragraph 14 of the fundamental law lets the crown legislate when the Chamber is adjourned."
 AUH_tt_bruenn_programme:0 "The Bruenn congress of 1899 set the party on federal lines, one section per nation."
 AUH_tt_the_march_frightens_vienna:0 "A hundred thousand men on the Ringstrasse on 28 November 1905 read as a threat, not a petition."
 AUH_tt_five_and_a_half_million:0 "5 526 203 men on the rolls, 4 676 350 voting, 84.62 per cent turnout, and 516 seats instead of 425."
 AUH_tt_the_curias_return_the_same_men:0 "Voted by curia, the same landowners and chambers of commerce send back the same men, and the Chamber is what it was."
 AUH_tt_ninety_five_christian_socials:0 "After 14 and 23 May 1907 the Christian Socials are the first group with 95 seats, the German Social Democrats 50, the Czech Agrarians 27. No German bloc holds half the House."
 AUH_tt_personal_autonomy:0 "Renner and Bauer argued that a nation is a register of people, not a piece of ground."
 AUH_tt_lex_perek:0 "A roll has to be closed to be useful, and the disputed entries end up in court."
 AUH_tt_bukovina_sixty_three_seats:0 "The Bukovina diet of 16 October 1909 goes from 31 seats to 63: 23 Romanians, 17 Ruthenes, 9 Jews, 8 Germans, 6 Poles."
 AUH_tt_twenty_seven_point_two:0 "Galicia on the Bukovina model gives the Ruthenes 27.2 per cent of the diet for 42 per cent of the province."
 AUH_tt_the_club_walks_out:0 "No Cisleithanian majority has ever been built without the Polish Club."
 AUH_tt_a_federation_of_lands:0 "Counterfactual: the German lands become one crown land among several instead of the state itself."
 AUH_tt_one_hundred_sixty_kilometres:0 "160 km of track, 945 motor cars and 888 trailers pass to the municipal undertaking in 1903."
 AUH_tt_a_mass_party_without_the_slavs:0 "Lueger built the first mass party of the monarchy, and built it in one language."
 AUH_tt_the_dynasty_is_the_programme:0 "The Kaisertreu wing answers every national question with the same answer: the dynasty."
 AUH_tt_no_conversion_here:0 "German nationalism without Los von Rom keeps the parish priest on the government's side."
 AUH_tt_the_diet_votes_a_budget:0 "A diet that sits is a diet that can be paid; a diet that is closed only costs."
 AUH_tt_the_german_north_of_bohemia:0 "Reichenberg, Aussig and Teplitz are German towns in a Czech kingdom, and they know it."
 AUH_tt_what_1913_failed_to_do:0 "The Bohemian negotiations of 1913 broke down. This is what a signature would have bought."
 AUH_tt_thirty_three_ordinances:0 "Koerber issued 33 emergency ordinances, the record for paragraph 14 between 1868 and 1914."
 AUH_tt_conference_adjourned:0 "The parties meet outside the Chamber, exchange papers, and settle nothing."
 AUH_tt_conference_agrees_on_a_word:0 "One clause agreed is one clause fewer for the next cabinet to fight over."
 AUH_tt_seventy_two_of_four_twenty_five:0 "The curias of 1873, with the fifth general curia added in 1896: 72 seats out of 425."
 AUH_tt_the_governor_makes_the_list:0 "The Statthalter names the officials who draw up the electoral rolls."
 AUH_tt_annenpatente:0 "The Bohemian diet is set aside and an administrative commission governs the kingdom."
 AUH_tt_a_cabinet_without_a_party:0 "A Beamtenministerium survives every crisis except the one that needs a vote."
 AUH_tt_a_state_with_one_tongue:0 "Counterfactual: one administration, one language of record, and nine recognised tongues left outside it."
 AUH_tt_withdrawn_in_october_1899:0 "Badeni's language ordinances of 1897 were withdrawn in October 1899, and nothing replaced them until 1918."
 AUH_tt_a_school_on_every_frontier:0 "The Deutscher Schulverein, founded in 1880, pays for German schools where the province will not."
 AUH_tt_nine_recognised_tongues:0 "Article 19 recognises nine languages of use. None of them is named the language of the state."
 AUH_tt_the_emperor_is_catholic:0 "Conversions to the Evangelical church put the movement against the crown it claims to serve."
 AUH_tt_a_line_on_the_map:0 "The territorial principle puts the nation on the ground; the personal principle puts it on a roll."
 AUH_tt_a_counterfactual_secession:0 "Counterfactual: the German lands leave for Berlin. Nothing of the kind happened before November 1918."

# --- THE MAGYARS, TOOLTIPS -------------------------------------------------------------------

 AUH_tt_two_questions_at_budapest:0 "Two questions are open at once: who governs the kingdom, and what the crown offers or threatens."
 AUH_tt_the_bodyguard_cabinet:0 "Geza Fejervary, captain of the royal bodyguard, is made prime minister on 18 June 1905 against the elected majority."
 AUH_tt_wekerle_kossuth_andrassy_apponyi:0 "The coalition takes office on 8 April 1906: Wekerle at the head, Kossuth at Commerce, Andrassy at the Interior, Apponyi at Education."
 AUH_tt_six_point_two_per_cent:0 "About 6.2 per cent of the population votes in Hungary. Universal suffrage would drown the gentry."
 AUH_tt_chlopy_reversed:0 "The army order of Chlopy, 16 September 1903, said the army stays common and undivided. This unsays it."
 AUH_tt_the_house_cleared:0 "In February 1906 the Chamber of Budapest is cleared by soldiers."
 AUH_tt_no_tax_no_recruits:0 "The comitats are self-governing bodies with elected officials; they simply refuse to collect and to conscript."
 AUH_tt_collecting_without_a_law:0 "Ex lex: no voted budget, and the treasury collects anyway."
 AUH_tt_the_army_order_of_chlopy:0 "Chlopy, 16 September 1903: the crown states in an army order that the army remains common."
 AUH_tt_fifty_nine_and_forty_three:0 "The annual contingent of 103 100 men is split 59 211 to Austria and 43 889 to Hungary."
 AUH_tt_tisza_forces_the_rules:0 "18 November 1904: Tisza has the standing orders carried by a wave of the handkerchief."
 AUH_tt_the_contingent_finally_voted:0 "The contingent had been frozen since 1889. It is raised only in 1912."
 AUH_tt_three_votes_for_a_degree:0 "Andrassy's bill of 1908 offered the vote to everyone and several votes to the educated."
 AUH_tt_act_xliv_kept_at_last:0 "Act XLIV of 1868 promised the nationalities their language before the courts and in the schools."
 AUH_tt_a_crown_that_shares:0 "Counterfactual: the kingdom keeps its diet and gives up the claim that it is the only nation in it."
 AUH_tt_magyar_by_the_fourth_year:0 "Acts XXVI and XXVII of 1907: every child must speak and write Magyar by the end of the fourth primary year."
 AUH_tt_croatia_exempt_under_the_nagodba:0 "Croatia-Slavonia is exempt: schools are hers under the Nagodba of 1868."
 AUH_tt_the_programme_of_1848_in_office:0 "The party of independence takes portfolios and discovers what a joint budget is."
 AUH_tt_the_state_pays_the_supplement:0 "The state tops up the salaries of confessional teachers and examines them in Magyar within two years."
 AUH_tt_four_hours_a_week:0 "At least four hours of Magyar a week for children who do not speak it, and closure for schools that fail."
 AUH_tt_wekerle_falls_on_the_bank:0 "Wekerle resigned on 27 April 1909 over the demand for a separate Hungarian bank of issue."
 AUH_tt_the_mills_of_the_danube:0 "Budapest milled for half of Europe before it built anything else."
 AUH_tt_one_political_nation:0 "The Magyar state idea: one political nation under the crown, whatever language it speaks at home."
 AUH_tt_the_law_that_was_never_kept:0 "Act XLIV of 1868 was never repealed and never applied. Applying it is a decision in itself."
 AUH_tt_they_did_not_forgive_it:0 "The coalition capitulated in April 1906. It spent the next four years remembering it."
 AUH_tt_the_kristoffy_garami_pact:0 "Kristoffy sought an alliance with Garami's social democrats. The pact failed."
 AUH_tt_four_seats_of_four_hundred_thirteen:0 "In October 1901 the Slovak national party ends seventeen years of abstention and wins 4 seats out of 413."
 AUH_tt_no_csernova:0 "On 27 October 1907 gendarmes fired on a Slovak crowd at Csernova: 15 dead, more than fifty wounded."
 AUH_tt_the_landlord_no_longer_watches:0 "Open voting was the system. The secret ballot is the whole reform."
 AUH_tt_daranyi_relief_fund:0 "Act XVI of 1900 set up a relief fund for farm labourers, with a work book as the price of membership."
 AUH_tt_they_stay_for_the_ballot:0 "528 045 subjects left Hungary in the three years 1905 to 1907. A vote is a reason to stay."
 AUH_tt_the_boats_leave_fiume:0 "528 045 subjects left Hungary in the three years 1905 to 1907, and the estates were never touched."
 AUH_tt_kando_electric_traction:0 "Kalman Kando's electric traction work at Ganz put Hungarian locomotives on foreign lines."
 AUH_tt_colours_of_the_kingdom:0 "Badges and colours cost nothing and are conceded first, because everything else costs the army."
 AUH_tt_twelve_thousand_five_hundred:0 "The Honved takes 12 500 recruits a year; the Austrian Landwehr takes 10 000."
 AUH_tt_artillery_conceded_in_1912:0 "The Honved had no artillery of its own until the settlement of 1912."
 AUH_tt_one_hundred_three_thousand_one_hundred:0 "103 100 men a year, fixed by the military law of 1889 and unchanged until 1912."
 AUH_tt_eighty_words_of_service:0 "The common army ran on some eighty German words of service. Replacing them ends the common army."
 AUH_tt_wekerle_resigns_27_april_1909:0 "27 April 1909: Wekerle resigns on the bank question and stays in office for want of a successor."
 AUH_tt_thirty_six_point_four:0 "The renewal of 1907 raised the Hungarian quota to 36.4 per cent, against 33.06 since 1897."
 AUH_tt_the_railway_pragmatic:0 "Kossuth's railway pragmatic of 1907 broke the Croatian alliance made at Fiume two years earlier."
 AUH_tt_fiume_is_a_corpus_separatum:0 "Fiume is administered as a Hungarian corpus separatum, and Zagreb is not consulted."
 AUH_tt_only_the_crown_in_common:0 "Counterfactual: army, bank, tariff and foreign office divided, and only the person of the king left in common."

# --- THE CZECHS, TOOLTIPS --------------------------------------------------------------------

 AUH_tt_three_answers_to_bohemia:0 "Bohemia can be talked out, decreed at, or settled by naming a state language. Choose once."
 AUH_tt_nine_years_of_talking:0 "The Moravian negotiations opened in 1896 and closed in 1905. Bohemia never got that far."
 AUH_tt_the_vacuum_left_by_badeni:0 "Nothing has governed the internal language of the offices in Bohemia since October 1899."
 AUH_tt_separate_curias_separate_schools:0 "27 November 1905: four provincial laws, national rolls, separate curias, and a school administration in two halves."
 AUH_tt_the_roll_decides_the_school:0 "Under the cadastre a child goes to the school of the roll his father is entered on."
 AUH_tt_what_1913_could_not_carry:0 "The Bohemian talks of 1913 tried exactly this and failed. Ten times the money is at stake here."
 AUH_tt_the_bukovina_proof:0 "The Bukovina diet did it with five nations on 16 October 1909, against the German and Jewish votes."
 AUH_tt_a_club_that_votes_the_budget:0 "A national club that is paid is a club that can be counted on a division."
 AUH_tt_fifty_three_of_four_twenty_five:0 "The Young Czechs took 53 seats of 425 in January 1901, behind the Polish Club."
 AUH_tt_the_friedjung_forgeries:0 "At the Friedjung trial in December 1909 Masaryk showed that the documents came from the legation at Belgrade."
 AUH_tt_never_crowned_at_prague:0 "Francis Joseph was never crowned king of Bohemia. The crown of Saint Wenceslas stayed in its chamber."
 AUH_tt_the_ordinances_withdrawn_1899:0 "Withdrawing the ordinances in 1899 turned the obstruction around: the Germans fell silent, the Czechs blocked."
 AUH_tt_a_thousand_million_crowns:0 "The Koerber programme is usually reckoned at the order of a thousand million crowns."
 AUH_tt_four_hundred_ten_kilometres:0 "The waterways act of 11 June 1901 planned 410.2 km and 29 locks from Vienna to Cracow."
 AUH_tt_belgrade_bought_from_creusot:0 "Belgrade ordered its guns from Schneider-Creusot instead of Skoda. Tariffs make customers for other people."
 AUH_tt_the_junction_of_the_north:0 "Every northern line runs through Prague, and Prague charges for it."
 AUH_tt_four_point_two_kilometres:0 "Of the 410.2 km voted in 1901, 4.2 km were built."
 AUH_tt_annenpatente_26_july_1913:0 "26 July 1913: the diet of Bohemia is dissolved and a commission takes its place."
 AUH_tt_standrecht_2_december_1908:0 "Prague went under martial law on 2 December 1908, the day of the sixtieth anniversary of the accession."
 AUH_tt_the_file_is_closed_not_solved:0 "A question adjourned is a question that stops costing this year and costs more later."
 AUH_tt_state_right_extinguished:0 "Counterfactual: the historic right of the kingdom is written out of the statute book."
 AUH_tt_seton_watson_reads_the_file:0 "R. W. Seton-Watson toured Hungary and published Racial Problems in Hungary in 1908."
 AUH_tt_each_to_his_own:0 "Svuj k svemu: buy Czech, bank Czech, hire Czech. A boycott with a slogan and a directory."
 AUH_tt_refused_again_at_brno:0 "Brno asked for a Czech university every year and was refused every year before 1918."
 AUH_tt_the_slet_of_prague:0 "The Sokol slet fills a stadium with men who march in step and answer to their own committee."
 AUH_tt_the_party_splits_in_1911:0 "The Czech unions leave the imperial federation, and the party splits on the national line in 1911."
 AUH_tt_circles_by_majority:0 "Cutting the kingdom into national circles was in the Bohemian negotiations of 1913 and in nobody's statute."
 AUH_tt_a_kingdom_renamed:0 "Counterfactual: the kingdom is administered as German ground, and its own name is the last thing to go."
 AUH_tt_trialism_by_the_bohemian_road:0 "Counterfactual: a third crown at Prague, on the model Budapest obtained in 1867."

# --- THE POLES, TOOLTIPS ---------------------------------------------------------------------

 AUH_tt_sixty_five_in_the_club:0 "63 seats at the poll of January 1901, and 65 members once the parliamentary clubs are formed."
 AUH_tt_forty_two_per_cent_ruthene:0 "The Ruthenes are about 42 per cent of a province of some eight million, and hold nothing."
 AUH_tt_nothing_passes_without_them:0 "Nothing passes at Vienna without the Polish Club, and Vienna therefore never touches Galicia."
 AUH_tt_the_majority_dissolves:0 "Take the province back and the Cisleithanian majority goes with it."
 AUH_tt_bobrzynski_falls_to_his_own_side:0 "Bobrzynski was viceroy from 1908 and fell because his own side would not follow him."
 AUH_tt_six_hundred_walked_out:0 "About 600 Ukrainian students seceded from the university of Lemberg in 1901 over its Polish character."
 AUH_tt_two_of_eight_on_the_committee:0 "The compromise gives the Ruthenes two places of eight on the provincial committee."
 AUH_tt_levytsky_signs:0 "14 February 1914: Kost Levytsky calls it the first real Polish-Ukrainian agreement made on Galician ground."
 AUH_tt_a_third_crown_at_cracow:0 "Counterfactual: a Polish crown land with its own diet, inside the monarchy."
 AUH_tt_a_minister_without_a_ministry:0 "A Pole has sat in the Vienna cabinet as minister for Galicia since 1871."
 AUH_tt_no_second_nation_here:0 "The Stanczyk answer to the Ruthenian question is that there is no Ruthenian question."
 AUH_tt_drilling_against_russia:0 "Rifle associations are legal in Galicia and in no other part of partitioned Poland."
 AUH_tt_berlin_wanted_it_too:0 "Counterfactual: the Polish lands attached to Vienna. Berlin had a plan of its own for them."
 AUH_tt_the_gendarme_at_the_polling_place:0 "At the Galician diet elections of 1908 the Ukrainian peasant Marko Kahanets was killed by gendarmes at Horucko."
 AUH_tt_kahanets_at_horucko:0 "12 April 1908: the student Myroslav Sichynsky shot the viceroy Andrzej Potocki in his own palace at Lemberg."
 AUH_tt_eight_million_in_the_province:0 "Some eight million people live in Galicia, and the two nations do not agree on how to count them."
 AUH_tt_some_of_them_come_back:0 "The money orders come back before the men do, and some of the men come back too."
 AUH_tt_the_village_empties:0 "The agent calls at the village, the young men sign, and the recruiting sergeant finds nobody."
 AUH_tt_autonomy_ends_in_1919:0 "Counterfactual: Galicia administered from Vienna like Lower Austria, with no diet of its own."

# --- THE RUTHENES, TOOLTIPS ------------------------------------------------------------------

 AUH_tt_forty_two_per_cent_of_the_province:0 "About 42 per cent of Galicia, with no university, no curia and no viceroy of their own."
 AUH_tt_vienna_over_lemberg:0 "Vienna can legislate for the province over the head of the club that keeps its majority."
 AUH_tt_the_club_is_worth_the_province:0 "Sixty-five votes at Vienna are worth more to a cabinet than four million subjects in Galicia."
 AUH_tt_the_reading_room_of_kachkovsky:0 "The old Ruthenian societies read Russian, print in etymological spelling, and wait for Petersburg."
 AUH_tt_a_nation_against_two_empires:0 "The Ukrainophile answer is a separate nation, spelled its own way, against Warsaw and Petersburg at once."
 AUH_tt_twenty_seven_point_two_of_the_seats:0 "27.2 per cent of the seats of the diet, the share the Ruthenes had held in the Reichsrat delegation since 1907."
 AUH_tt_six_hundred_students_1901:0 "The chairs that about 600 students walked out of Lemberg for in 1901."
 AUH_tt_the_province_cut_in_two:0 "Splitting Galicia at the San was the Ruthenian demand and the one thing the Polish Club would never sell."
 AUH_tt_the_price_of_a_majority:0 "Vienna does not arbitrate in Galicia, because arbitration costs a majority."
 AUH_tt_the_counter_stays_polish:0 "The counter is answered in Ruthene when the clerk chooses to; the file is kept in Polish."
 AUH_tt_who_pays_for_the_parish_paper:0 "The Russian consulate at Lemberg pays for newspapers and counts parishes that might change rite."
 AUH_tt_the_united_church_is_the_nation:0 "The Greek Catholic church is the national institution of the Galician Ruthenes, and its seminaries decide who speaks."
 AUH_tt_metropolitan_from_1901:0 "Andrey Sheptytsky, a count of Polish stock in the Ruthene rite, is metropolitan of Halych from 1901 to 1944."
 AUH_tt_one_province_two_nations:0 "Keeping the province whole keeps the Polish Club, and keeps the Ruthenes a minority inside it."
 AUH_tt_they_march_east_willingly:0 "A nationality that has been given something in peacetime is a nationality that reports to the depot in war."
 AUH_tt_the_depot_watches_them:0 "The recruits come, and the counter-intelligence file comes with them."
 AUH_tt_thalerhof_is_the_alternative:0 "From 4 September 1914 the camp at Thalerhof held Ruthenes suspected of Russophilia: some 20 000 by May 1917."
 AUH_tt_levytsky_leads_the_negotiation:0 "Kost Levytsky leads the Ukrainian national democrats and negotiates for the province."
 AUH_tt_a_fourth_crown_at_lemberg:0 "Counterfactual: eastern Galicia raised to a crown land of its own, with a diet at Lemberg and a Ruthene majority in it."

# --- TIMING ----------------------------------------------------------------------------------

 AUH_tt_settled_while_it_was_cheap:0 "A direction taken before 1910 is taken while the empire still has money and time."

