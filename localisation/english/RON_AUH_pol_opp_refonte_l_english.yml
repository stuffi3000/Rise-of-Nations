###############################################################################################################################
# Austria-Hungary - politics, opposition, 1900-1909.  Overhauled branch: tooltips, press, new spirits.
# Focus names and the descriptions not restated here live in RON_AUH_pol_opp_DNC_l_english.yml.
###############################################################################################################################

# --- DESCRIPTIONS REWRITTEN --------------------------------------------------------------------



# --- S1  THE SUCCESSION AND THE PARALLEL CABINET -----------------------------------------------

 AUH_opp_tt_two_courts:0 "Two courts decide the Monarchy: the Hofburg, and the Lower Belvedere across the park."
 AUH_opp_tt_belvedere_cabinet:0 "Brosch von Aarenau runs the chancellery as a cabinet: memoranda, lists of ministers, a programme for a reign not yet begun."
 AUH_opp_tt_no_office_no_papers:0 "The heir holds no constitutional office, therefore he receives no state papers. Budapest is satisfied. Zagreb is not."
 AUH_opp_tt_the_oath_of_28_june:0 "28 June 1900 at the Hofburg: the oath of renunciation, given force of law on 4 December. The marriage follows on 1 July at Reichstadt."
 AUH_opp_tt_the_card_index:0 "A card index of every man who might be useful: governors, generals, editors, bishops."
 AUH_opp_tt_conrad_over_the_court:0 "18 November 1906: Beck-Rzikowsky, chief of staff since 1881, is replaced by Conrad von Hoetzendorf at the heir's insistence."
 AUH_opp_tt_popovici_map:0 "Aurel Popovici, Die Vereinigten Staaten von Gross-Oesterreich, Leipzig 1906: fifteen national states, with a map. Read at the Belvedere, never adopted."
 AUH_opp_tt_crowned_at_zagreb:0 "One more crown instead of fifteen states: Dalmatia joined to Croatia, Bosnia taken in, and a coronation at Zagreb."
 AUH_opp_tt_italy_is_the_enemy:0 "The heir writes to Berlin himself and tells anyone who will listen that Italy, not Serbia, is the real enemy."
 AUH_opp_tt_the_oath_not_sworn:0 "The coronation oath binds the king to the integrity of the lands of Saint Stephen. A king who has not sworn it is not bound."
 AUH_opp_tt_the_safe_at_the_belvedere:0 "The programme of the change of reign stays in a safe: a proclamation to the peoples, dualism suspended, a ministry of officials."
 AUH_opp_tt_a_service_not_a_notable:0 "The lands are administered by a civil service answerable to the crown, not by the notables who would otherwise inherit them."
 AUH_opp_tt_the_ban_named_in_vienna:0 "What the Fiume Resolution of October 1905 asked for: Dalmatia joined to Croatia, and a ban named in Vienna."
 AUH_opp_tt_the_manifesto_is_printed:0 "The manifesto is printed, the ministry of officials sworn, the diets summoned. The settlement of 1867 is reopened by one of its two parties alone."
 AUH_opp_tt_regiments_and_a_hunting_estate:0 "The chancellery becomes an adjutancy, its officers are given regiments, and the reign to come will arrive with nothing prepared."
 AUH_opp_tt_a_seat_and_no_signature:0 "Give the heir a seat and a title, and let him hear everything and sign nothing."
 AUH_opp_tt_the_family_statute:0 "The house law decides: the Chief Steward, the family statute and the Kaiser. It is nobody's business but the dynasty's."
 AUH_opp_tt_nothing_crosses_the_park:0 "The rule at the Ballhausplatz: the heir may have opinions, and the ministry will have the documents."
 AUH_opp_tt_he_countersigns_the_minutes:0 "The heir attends, is briefed, and countersigns the minutes of the common ministerial council."
 AUH_opp_tt_three_ministers_two_delegations:0 "Three common ministers, two prime ministers, and delegations of sixty a side that never sit together."
 AUH_opp_tt_renewed_every_ten_years:0 "The settlement of 1867 is the constitution of the Monarchy, renewed every ten years. The Hungarian quota stands at 36.4 per cent from 1907."

# --- S2  THE PARTY OF THE STREET ---------------------------------------------------------------

 AUH_opp_tt_a_man_registers_his_nation:0 "Bruenn, 1899: nationality is a personal status, not a piece of ground. A man registers his nation and his schools follow him."
 AUH_opp_tt_one_language_of_business:0 "One executive, one language of business, and national sections that are administrative conveniences."
 AUH_opp_tt_the_ring_fills:0 "28 November 1905: the crowd fills the Ring before the Reichsrat. Without the Russian year there is no franchise bill."
 AUH_opp_tt_standrecht_over_prague:0 "2 December 1908, the sixtieth anniversary of the accession: summary martial law is proclaimed over Prague."
 AUH_opp_tt_adler_welds_the_party:0 "Viktor Adler welded a scattering of quarrelling groups into one party at Hainfeld in 1888."
 AUH_opp_tt_better_statistics_than_the_ministry:0 "The Vienna commission bargains for men in Trieste, Reichenberg and Lemberg, and keeps better figures than the ministry of commerce."
 AUH_opp_tt_crowds_not_notables:0 "Between 1897 and 1907 the politics of Cisleithania stops being an affair of notables and becomes an affair of crowds."
 AUH_opp_tt_sanctioned_26_january_1907:0 "Sanctioned 26 January 1907: universal, equal, direct and secret manhood suffrage, the curias abolished, and 516 seats instead of 425."
 AUH_opp_tt_correspondents_in_every_crownland:0 "The Vienna state police keeps correspondents in every crownland, reads what it likes and files what it reads."
 AUH_opp_tt_six_sections_one_treasury:0 "German, Czech, Polish, Ruthene, Slovene and Italian sections, and one treasury they all argue over."
 AUH_opp_tt_sick_funds_and_hiring_lists:0 "Workers associations under clerical patronage, with sick funds, reading rooms and their own hiring lists."
 AUH_opp_tt_on_the_estimates_committee:0 "Men prosecuted ten years ago for printing a newspaper now sit on the estimates committee."
 AUH_opp_tt_white_columns:0 "Seizure before distribution and a heavier deposit. The papers appear with white columns where the articles were."
 AUH_opp_tt_the_congress_cannot_arbitrate:0 "The Czech unions leave the Vienna commission, and the International is asked to arbitrate between two socialist movements in one state."
 AUH_opp_tt_ostrava_to_the_metal_trades:0 "The Russian year crosses the frontier: the strikes run from the Ostrava coalfield to the Vienna metal trades."
 AUH_opp_tt_hours_guards_staircases:0 "The factory inspectorate counts hours, guards and staircases, and publishes what it finds."
 AUH_opp_tt_the_count_of_may_1907:0 "14 and 23 May 1907: 4,676,350 votes cast, 84.6 per cent turnout. Christian Socials 95 seats, German Social Democrats 50, Czech agrarians 27, Czech Social Democrats 23."
 AUH_opp_tt_the_associations_law_of_1867:0 "The associations law of 1867 lets a governor dissolve any association that endangers public order. Funds impounded, reading rooms shut."
 AUH_opp_tt_piazza_della_borsa:0 "Trieste, 14 February 1902: the troops fire on the Piazza della Borsa. Fourteen dead over two days, and the arbitrators find for the stokers the same evening."
 AUH_opp_tt_five_hundred_and_sixteen_seats:0 "Five hundred and sixteen seats, eleven recognised nationalities, and something near thirty parliamentary groups."
 AUH_opp_tt_a_device_that_worked:0 "The reading the ministry acts on: the franchise was a device for breaking the national bourgeois parties, and it worked."
 AUH_opp_tt_government_by_permit:0 "The mills of Bohemia run without interruption. They have been bought with government by permit."
 AUH_opp_tt_over_the_heads_of_the_notables:0 "A dynasty that governs with the mass parties, over the heads of the notables and against the Magyar gentry."

# --- S3  THE MASS PARTY AND THE ALTAR ----------------------------------------------------------

 AUH_opp_tt_the_bishop_inspects:0 "The parish keeps its school, the bishop keeps his inspectorate, and the state pays the difference."
 AUH_opp_tt_one_school_for_all_confessions:0 "One elementary school for every confession, staffed and inspected by the state."
 AUH_opp_tt_the_imperial_house_at_mass:0 "Missions in the affected districts, a subsidised Catholic press, and the imperial house at mass."
 AUH_opp_tt_a_movement_fed_on_persecution:0 "A movement fed on persecution starves without it. The state has no confession and says so in public."
 AUH_opp_tt_who_appoints_the_teacher:0 "Who appoints the teacher, who inspects the classroom, and by whose catechism a child of six is taught."
 AUH_opp_tt_the_laboratories_of_vienna:0 "Freethinkers, monists and anticlerical liberals: a small constituency that holds the laboratories of Vienna and Prague."
 AUH_opp_tt_two_movements_one_vote:0 "Two mass movements fight for the German vote, one Catholic and dynastic, the other calling the dynasty Roman and foreign."
 AUH_opp_tt_schoenerer_1898:0 "Schoenerer launched Los von Rom in 1898: conversion to Protestantism as an act of German loyalty. The bishops write to Vienna about northern Bohemia."
 AUH_opp_tt_the_patent_of_1861:0 "The Protestant Patent of 1861 gave the evangelical churches their standing. It is read in Hungary, where much of the gentry is Calvinist."
 AUH_opp_tt_the_cheapest_administration:0 "Parish registers, elementary schools and marriage courts in clerical hands: the cheapest administration the Monarchy has."
 AUH_opp_tt_civil_marriage_civil_registers:0 "Civil marriage, civil registers, and the universities left to appoint whom they please."
 AUH_opp_tt_lueger_confirmed_at_last:0 "Franz Joseph refused three times to confirm Lueger before giving way in 1897. In 1907 the Christian Socials take 95 seats and lead the chamber."
 AUH_opp_tt_parish_by_parish:0 "Parish by parish through Tyrol and Upper Austria: the smallholder, the carter, the village schoolmaster."
 AUH_opp_tt_lend_against_a_harvest:0 "The parish credit societies lend against a harvest and a reputation, and keep the mortgage banks out of the valleys."
 AUH_opp_tt_read_aloud_in_the_market:0 "A weekly in every deanery, with market prices, saints days and a column written in Vienna. It is read aloud to those who cannot read."
 AUH_opp_tt_a_partner_not_a_client:0 "A mass party takes ministries, counts its votes and carries the estimates. The crown has a partner, and partners have terms."
 AUH_opp_tt_the_pan_germans_lose_the_valleys:0 "Roads, a rail connection and a credit society in Carinthia and Tyrol. The pan-Germans never recover the countryside."
 AUH_opp_tt_a_mass_base_at_last:0 "The Christian Socials hold Vienna and the Alpine lands, loyal because it suits them. A mass base is owed a programme."
 AUH_opp_tt_six_confessions_no_veto:0 "Catholics, Protestants, Orthodox, Uniates, Jews and Muslims, each with a legal standing and none with a veto over another."

# --- S4  THE GERMAN NATIONAL SECESSION ---------------------------------------------------------

 AUH_opp_tt_appointments_and_ordinances:0 "Appointments, ordinances and a language of office. The bill for it is paid in Prague."
 AUH_opp_tt_govern_with_the_slavs:0 "Prosecute the editors, dissolve the associations, and govern with the Slav clubs against the men who call the dynasty foreign."
 AUH_opp_tt_manufacturing_czech_nationalists:0 "A German governor in Prague and ordinances that favour German usage in the inner service: the surest way of manufacturing Czech nationalists."
 AUH_opp_tt_a_group_that_wants_out:0 "A parliamentary group whose declared object is to leave the state whose parliament it sits in."
 AUH_opp_tt_a_verdict_makes_a_martyr:0 "Every verdict produces a man who has been to prison for the German nation, which the movement cannot manufacture itself."
 AUH_opp_tt_funds_impounded:0 "School associations, gymnastic societies and frontier leagues dissolved and their funds impounded. The men remain."
 AUH_opp_tt_linz_1882:0 "The Linz programme of 1882: a German Austria in customs union with Berlin, with Galicia and Dalmatia dropped."
 AUH_opp_tt_the_payer_is_chosen_first:0 "The investment goes to the German districts of the Bohemian north, and the canal promised to Prague waits another year."
 AUH_opp_tt_reichenberg_aussig_eger:0 "Building slots, a technical school and a railway junction for Reichenberg, Aussig and Eger."
 AUH_opp_tt_outvoted_not_suppressed:0 "Under universal suffrage the German national vote is diluted by Christian Socials in the villages and Social Democrats in the towns."
 AUH_opp_tt_wolf_breaks_with_schoenerer:0 "Karl Hermann Wolf breaks with Schoenerer in 1902 and takes most of the Bohemian German deputies with him."
 AUH_opp_tt_cadres_and_exclusions:0 "The duelling fraternities of Vienna, Graz and Prague supply the cadres, the rituals and the exclusions."
 AUH_opp_tt_austrians_who_speak_german:0 "Tyrol, Salzburg, Styria and Carinthia decide they are Austrians who speak German rather than Germans living in Austria."
 AUH_opp_tt_a_mood_with_treasurers:0 "Schoenerer is finished, Wolf has split, Trautenau has gone its own way. What is left is a mood with several treasurers."
 AUH_opp_tt_squeezed_in_the_mixed_districts:0 "German workers squeezed between Czech labour and the Vienna commission found their own party at Trautenau in 1904."
 AUH_opp_tt_four_hundred_years_in_germany:0 "The dynasty ruled in Germany for four hundred years before it ruled in Hungary. In Vienna that is history; in Budapest it is a threat."
 AUH_opp_tt_one_whip_one_fund:0 "The scattered German liberal, agrarian and national groups pulled into one parliamentary union with a whip and a common fund."
 AUH_opp_tt_by_the_parish_and_the_ballot:0 "The Germans remain first among the peoples of the Monarchy, and it is done by the parish and the ballot box."

# --- S5  THE ESTATES AGAINST THE STATE ---------------------------------------------------------

 AUH_opp_tt_votes_and_recruits:0 "The peasant leagues deliver votes and recruits, and one unshakeable policy: the price of grain."
 AUH_opp_tt_they_finance_every_party:0 "The industrialists of Bohemia, Moravia and Lower Austria finance every party in the Reichsrat and trust none of them."
 AUH_opp_tt_one_schedule_two_services:0 "Growers against millers, millers against manufacturers, and all of them against one schedule for two customs services."
 AUH_opp_tt_a_majority_may_close_debate:0 "The rules of the house are rewritten so that a majority may close a debate and the chair may rule a motion dilatory."
 AUH_opp_tt_koerber_leaves_the_rules_alone:0 "Koerber leaves the standing orders alone, lets the minorities talk, and governs past the chamber."
 AUH_opp_tt_the_mortgage_banks_lose_ground:0 "Village credit societies on the Raiffeisen pattern, from the Alpine lands to Bohemia, Slovenia and Galicia."
 AUH_opp_tt_quota_at_home_dump_abroad:0 "The Bohemian and Moravian refiners divide the home market by quota and sell the surplus abroad."
 AUH_opp_tt_belgrade_builds_abattoirs:0 "A new schedule, and the frontier closed to Serbian livestock. Belgrade builds its own abattoirs and exports through Salonika."
 AUH_opp_tt_name_and_exclude:0 "Closure by simple majority, sittings fixed in advance, and a chair that may name and exclude."
 AUH_opp_tt_perfected_against_badeni:0 "The roll-call on every clause, the point of order, the document read aloud. Perfected against Badeni in 1897."
 AUH_opp_tt_thirty_three_ordinances:0 "Article 14 legislates while the Reichsrat is not sitting. Koerber took 33 ordinances, the heaviest use of the article between 1868 and 1914."
 AUH_opp_tt_cheap_bread_in_three_capitals:0 "The schedule is written for the consumer: cheap bread in Vienna, Prague and Trieste."
 AUH_opp_tt_town_bread_costs_the_tariff:0 "The schedule is written for the producer. The estates are protected and town bread costs what the tariff says."
 AUH_opp_tt_estimates_to_a_timetable:0 "Estimates prepared in committee, debated to a timetable, and voted."
 AUH_opp_tt_a_schoolmaster_can_afford_vienna:0 "A daily allowance for attendance: a Czech schoolmaster or a Ruthene priest can now afford to sit in Vienna."
 AUH_opp_tt_the_peak_of_1907:0 "1907 is the peak: between 170,000 and 210,000 departures from Hungary in one year, and 528,045 over 1905 to 1907."
 AUH_opp_tt_settlers_of_the_correct_nation:0 "A fund to buy and parcel out estates for settlement, administered by men who owe the county lords."
 AUH_opp_tt_a_chamber_that_can_refuse:0 "Closure, fixed sittings, paid deputies and a standing estimates committee. A chamber that works can also refuse."
 AUH_opp_tt_the_ministers_are_the_kaisers:0 "The estimates pass under Article 14, the ministers are the Kaiser's, and the chamber is a place where opinions are expressed."
 AUH_opp_tt_the_recruiting_districts_fill:0 "Credit, settlement, roads and a tariff the villages understand. The emigration slows and the recruiting districts fill."

# --- NAMED THREATS -----------------------------------------------------------------------------

 AUH_opp_threat_secession:0 "German national secession"
 AUH_opp_threat_german_question:0 "The German question reopened"
 AUH_opp_threat_german_state:0 "A German state and nothing else"

# --- NEW NATIONAL SPIRITS ----------------------------------------------------------------------

 AUH_opp_the_compromise_is_the_constitution:0 "The Compromise Is the Constitution"
 AUH_opp_the_compromise_is_the_constitution_desc:0 "The settlement of 1867, renewed every ten years, with a Hungarian quota of 36.4 per cent. Nothing may be attempted that the other half will not sign."

 AUH_opp_the_two_internationals_in_one_state:0 "Two Internationals in One State"
 AUH_opp_the_two_internationals_in_one_state_desc:0 "The Czech unions keep their own commission and their own funds. Two socialist movements in one empire, and no congress able to arbitrate between them."

 AUH_opp_the_piusverein:0 "The Piusverein"
 AUH_opp_the_piusverein_desc:0 "A press association with a printing works in every provincial capital, put there to keep a Catholic paper in hands that would otherwise hold a national one."

 AUH_opp_the_confessional_peace:0 "The Confessional Peace"
 AUH_opp_the_confessional_peace_desc:0 "Six confessions with a legal standing and a place in the ceremonial, and none of them with a veto over another."

 AUH_opp_the_deutscher_nationalverband:0 "The Deutscher Nationalverband"
 AUH_opp_the_deutscher_nationalverband_desc:0 "One whip, one fund and one parliamentary union for the German groups. It is the last time the Germans of Cisleithania vote as one thing."

 AUH_opp_the_house_that_never_sits:0 "The House That Never Sits"
 AUH_opp_the_house_that_never_sits_desc:0 "Article 14 legislates while the chamber is adjourned, budget included. It is quick, it is lawful, and it teaches everyone that obstruction costs nothing."

 AUH_opp_the_sugar_cartel:0 "The Sugar Cartel"
 AUH_opp_the_sugar_cartel_desc:0 "The Bohemian and Moravian refiners divide the home market by quota and sell the surplus abroad, and the ministry does not disturb the arrangement."

 AUH_opp_the_countryside_answers_the_towns:0 "The Countryside Answers the Towns"
 AUH_opp_the_countryside_answers_the_towns_desc:0 "Credit, settlement, roads and a tariff the villages understand. The recruiting districts fill again, and the towns have paid for it."

# --- PRESS, 200-299 ----------------------------------------------------------------------------

 AUH_news_201_t:0 "A Second Court Across the Park"
 AUH_news_201_d:0 "The Lower Belvedere keeps its own chancellery, its own correspondence and its own opinion of the government. Ministers are told that the heir presumptive holds none of these by right, and that he holds them all the same."

 AUH_news_202_t:0 "The Heir Takes a Staff"
 AUH_news_202_d:0 "Colonel Brosch von Aarenau is confirmed at the head of the military chancellery at the Lower Belvedere. It drafts memoranda, keeps lists of ministers and corresponds with foreign courts. Budapest reads it as an attack on the settlement of 1867."

 AUH_news_203_t:0 "A Third Crown for Zagreb"
 AUH_news_203_d:0 "Vienna lets it be known that a South Slav kingdom joining Dalmatia to Croatia, and taking in Bosnia, is under study. The lands of Saint Stephen would lose Croatia and Fiume. Belgrade, Rome and Budapest read the same sentence three different ways."

 AUH_news_204_t:0 "The Curias Are Abolished"
 AUH_news_204_d:0 "Sanctioned 26 January 1907: universal, equal, direct and secret suffrage for men of twenty-four, and a chamber of five hundred and sixteen seats instead of four hundred and twenty-five. Budapest keeps its six per cent of voters."

 AUH_news_205_t:0 "Standrecht Over Prague"
 AUH_news_205_d:0 "Summary martial law is proclaimed over the Bohemian capital and its districts after the street fighting. The dragoons cleared Wenceslas Square seven times. Vienna is at the same moment keeping the sixtieth anniversary of the accession."

 AUH_news_206_t:0 "The Chamber of Five Hundred"
 AUH_news_206_d:0 "The first count under the new franchise: 4,676,350 votes cast and 84.6 per cent of the register. The Christian Socials come first with ninety-five seats, the German Social Democrats take fifty, the Czech agrarians twenty-seven."

 AUH_news_207_t:0 "Editors Charged with Treason"
 AUH_news_207_d:0 "The public prosecutors move against the German national press and its associations, and the ministry announces that it will govern with the Slav clubs. German officials in the administration are told their loyalty is a question, not a fact."

 AUH_news_208_t:0 "Vienna Declares Itself German"
 AUH_news_208_d:0 "The Monarchy states in public what it has always denied: that it is a German state with subject peoples. The Czech, Polish, Croat and Slovene clubs leave the chamber together. The one argument the empire had for existing has been withdrawn."

 AUH_news_209_t:0 "A Mass Party in Office"
 AUH_news_209_d:0 "The Christian Socials hold Vienna, the Alpine lands and the ministries, and carry the estimates without an ordinance. The crown has a partner instead of a client for the first time since 1848, and partners present terms."

 AUH_news_210_t:0 "Government by Article Fourteen"
 AUH_news_210_d:0 "The chamber is adjourned and the budget passes by emergency ordinance. Thirty-three such ordinances have now been issued, more than under any ministry since 1868. The parliament may sit when it has nothing left to obstruct."

 AUH_news_211_t:0 "The Manifesto to the Peoples"
 AUH_news_211_d:0 "The proclamation is printed, a ministry of officials sworn, and the diets summoned. The Monarchy takes the constitution it might have had in 1867, by decree, and over the objection of one of the two parties that signed it."

 AUH_news_212_t:0 "The Settlement Stands"
 AUH_news_212_d:0 "Vienna and Budapest confirm that the compromise of 1867 is not a treaty to be improved upon but the constitution of the Monarchy, renewed every ten years. Every people that hoped for a land of its own is told, politely, to wait."
