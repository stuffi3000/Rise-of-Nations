 ##### Cles manquantes du Bhoutan (issue #15) #####


 ### Esprits nationaux ###
 BHU_new_reforms:0 "New Reforms"
 BHU_new_reforms_desc:0 "The reform of our administration has given the crown a firmer grip on the kingdom and reassured our people that Bhutan is being governed well."
 BHU_buddhism:0 "Buddhist Faith"
 BHU_buddhism_desc:0 "The monasteries stand at the heart of Bhutanese life. Their support steadies the kingdom and gives our soldiers a cause worth defending."
 BHU_feud_farm:0 "Feudal Farmland"
 BHU_feud_farm_desc:0 "Our valleys are worked under the old feudal arrangements. The harvests are secure and the landholders can call upon their tenants when the kingdom needs men."
 BHU_royal_guard:0 "The Royal Guard"
 BHU_royal_guard_desc:0 "The guard of the Druk Gyalpo has been re-equipped and retrained. They are the finest soldiers in Bhutan and are used to campaigning in our mountains."
 BHU_military_part:0 "Military Participation"
 BHU_military_part_desc:0 "Service in the militia has become an expected duty for the men of every valley, widening the pool of recruits available to us."
 BHU_past_victories:0 "Memory of Past Victories"
 BHU_past_victories_desc:0 "Our forefathers held these mountains against far greater armies. Our officers plan with confidence and our men know how to fight far from any depot."
 BHU_neut_end:0 "A Neutral Bhutan"
 BHU_neut_end_desc:0 "Bhutan has chosen to stand apart from the quarrels of the great powers. The kingdom can raise and train its army at its own pace, without foreign entanglements."
 BHU_s_farming_desc:0 "State subsidies keep our farmers on their land and their surplus feeds the workshops of the kingdom."

