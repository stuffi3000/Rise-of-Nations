l_english:

 ##############################################################################
 # RON_CAN_army - the army trunk, 1899-1951.
 # focus names, descriptions and tooltips added by the army lot, the ideas it
 # defines, and the headlines it puts on the wire (400-409).
 ##############################################################################

 ##### FOCUSES

 CAN_the_south_african_contingents:0 "The South African Contingents"
 CAN_the_south_african_contingents_desc:0 "Two contingents have gone by Order-in-Council, and Lord Strathcona pays for a third out of his own pocket. The Commons were never asked. Whatever the country learns at Paardeberg, it learns first that a Cabinet may send it to war alone."

 CAN_service_within_the_dominion:0 "Service Within the Dominion"
 CAN_service_within_the_dominion_desc:0 "The Act binds a man to the defence of Canada. Beyond the last mile of Canadian soil he goes as a volunteer or he does not go at all. Write it plainly now, and every ministry after this one is bound by it."
 CAN_service_within_the_dominion_tt:0 "§GQuebec's account against the Dominion is eased and the home service is settled in law.§! §RThe recruiting pool narrows. The Military Service Act and the levy of 1944 will be shut to you for good.§!"
 CAN_liable_to_serve_abroad:0 "Liable to Serve Abroad"
 CAN_liable_to_serve_abroad_desc:0 "Service liability follows the Crown, and the Crown is at war wherever the Empire is at war. The lawyers say it may be done by proclamation. Quebec says it has heard this argument before and will hear it again."
 CAN_liable_to_serve_abroad_tt:0 "§GManpower and war support rise, and the road to compulsion is opened for 1917 and for 1944.§! §RStability falls and the blood tax is charged at once.§!"

 CAN_the_royal_military_college:0 "The Royal Military College"
 CAN_the_royal_military_college_desc:0 "Kingston turns out gunners, sappers and surveyors, and the country has almost nowhere else to get them. Fund the College properly and the Dominion acquires a scientific establishment quite as much as a military one."

 CAN_the_first_canadian_chief_of_staff:0 "The First Canadian Chief of Staff"
 CAN_the_first_canadian_chief_of_staff_desc:0 "Sir William Otter takes the post in 1908, the first man born in this country to hold it. The appointment is a small thing beside the argument it settles: the army of Canada may be commanded by a Canadian."

 CAN_the_half_million_proclamation:0 "The Half-Million Proclamation"
 CAN_the_half_million_proclamation_desc:0 "The New Year proclamation raises the authorized establishment to five hundred thousand men, out of a population near eight millions. Nobody has done the arithmetic. When it is done, it will be done by ballot."
 CAN_the_half_million_proclamation_tt:0 "§GA great levy of manpower, and the country hardens to the war.§! §RIndustry loses its hands, stability falls, and Quebec is charged. The Military Service Act now follows of necessity.§!"

 CAN_what_the_volunteer_can_bear:0 "What the Volunteer Can Bear"
 CAN_what_the_volunteer_can_bear_desc:0 "Announce no figure the recruiting sergeant cannot fill. The corps is held to what men will offer of their own accord, the battalions are given officers who speak their language, and no promise is made that must later be broken."
 CAN_what_the_volunteer_can_bear_tt:0 "§GPolitical power and the morale of the volunteer rise, and Quebec's account is eased.§! §RWar support and the recruiting pool fall. The Voluntary Compact is now the only road.§!"
 CAN_the_ranks_that_answer:0 "The Ranks That Answer"
 CAN_the_ranks_that_answer_desc:0 "If there is to be no ballot there must be a campaign: recruiting leagues in every county, employers releasing their men, the pulpit and the press. The last volunteers of the war are found this way, and found slowly."
 CAN_the_ranks_that_answer_tt:0 "§GWar support rises and the volunteer keeps his morale.§! §RRaw drafts take longer to make into soldiers.§!"
 CAN_cancel_the_farmers_exemptions:0 "Cancel the Farmers' Exemptions"
 CAN_cancel_the_farmers_exemptions_desc:0 "The Order-in-Council of April withdraws the exemption promised to the farmers' sons at the election. The men are found. So is a grievance that will send a farmers' party of its own to Ottawa in 1921."
 CAN_cancel_the_farmers_exemptions_tt:0 "§GA further draft of manpower for the corps.§! §RStability falls, food grows dearer, and Quebec's account is charged again.§!"

 CAN_the_troops_in_the_coalfields:0 "The Troops in the Coalfields"
 CAN_the_troops_in_the_coalfields_desc:0 "The British Empire Steel Corporation cuts the Cape Breton wage by better than a third, the men strike, and the militia goes down to stand between the pit and the picket. The reduction is afterwards eased to about a fifth."
 CAN_the_troops_in_the_coalfields_tt:0 "§GPolitical power rises and the mines keep working.§! §RStability falls, communist support grows, and another page is written in the ledger.§!"

 CAN_the_estimates_of_the_lean_years:0 "The Estimates of the Lean Years"
 CAN_the_estimates_of_the_lean_years_desc:0 "The defence vote is cut to what the Treasury will bear. The Permanent Force becomes a cadre, the camps stand empty and the staff rides on paper. It is cheap, it is popular, and it will take six years to undo."
 CAN_the_estimates_of_the_lean_years_tt:0 "§GThe Treasury is relieved and the estimates stop being a political target.§! §RThe army loses organization, training and experience until rearmament pays the arrears.§!"
 CAN_the_bren_gun_contract:0 "The Bren Gun Contract"
 CAN_the_bren_gun_contract_desc:0 "A single firm is given the machine-gun contract without tender. Mr Drew opens the file in Maclean's and the Dominion learns how it buys its weapons. The guns are made all the same, and made well."
 CAN_the_bren_gun_contract_tt:0 "§GA stock of infantry weapons, faster arms production, and a bonus to small-arms research.§! §RThe government's credit suffers and the Opposition has its file.§!"

 CAN_the_mobilization_of_resources_act:0 "The Mobilization of Resources Act"
 CAN_the_mobilization_of_resources_act_desc:0 "Every man of age is registered and liable to be called out, for the defence of Canada and no further. The pledge of 1939 is kept to the letter and broken in spirit, and the country invents a word for the men so raised."
 CAN_the_mobilization_of_resources_act_tt:0 "§GA great reserve of manpower for home defence, and the conscription law advances a step.§! §RThese men may not be ordered overseas, their morale suffers for it, and Quebec is charged.§!"

 CAN_the_force_at_hong_kong:0 "The Force at Hong Kong"
 CAN_the_force_at_hong_kong_desc:0 "Two battalions are sent to a garrison London has already written off, and the transport carrying their vehicles never arrives. The colony falls on Christmas Day. A royal commission will ask who decided, and why."
 CAN_the_force_at_hong_kong_tt:0 "§GThe army learns what it is being told, at the cost of two battalions.§! §RThe government's credit suffers for two years and another page is written in the ledger.§!"
 CAN_the_plebiscite_of_1942:0 "The Plebiscite of 27 April"
 CAN_the_plebiscite_of_1942_desc:0 "The country is asked to release the government from its pledge. The country releases it; Quebec, by nearly three to one, does not. The government is now free to do the thing it promised it would never do."
 CAN_the_plebiscite_of_1942_tt:0 "§GWar support and political power rise, and the reinforcement question may now be put to the House.§! §RStability falls and Quebec's account is charged heavily.§!"

 CAN_the_raid_on_dieppe:0 "The Raid on Dieppe"
 CAN_the_raid_on_dieppe_desc:0 "Five thousand men go in against a defended port in daylight. More than nine hundred do not come back and near two thousand are taken. Every lesson of the Norman beaches two years later is bought here, and dearly."
 CAN_the_raid_on_dieppe_tt:0 "§GHard experience, and a lasting advance in amphibious method.§! §RWar support falls and the divisions carry the memory for a year and a half.§!"

 ##### GATES

 CAN_the_voluntary_compact_gate_tt:0 "The Dominion has held service to its own borders, or has refused to name a figure it cannot fill"
 CAN_the_military_service_act_gate_tt:0 "The Dominion has made its men liable to serve abroad, or has proclaimed the half million"
 CAN_one_department_of_defence_gate_tt:0 "The Air Board has been established"
 CAN_ralston_stays_gate_tt:0 "The Dominion has not bound itself to service within its own borders"
 CAN_national_service_gate_tt:0 "The Dominion has not bound itself to service within its own borders"

 ##### IDEAS

 CAN_idea_the_militia_council:0 "The Militia Council"
 CAN_idea_the_militia_council_desc:0 "The Minister presides, and the Minister also decides which gentlemen shall hold commissions in the Eastern Townships."

 CAN_idea_the_imperial_general_staff:0 "The Imperial General Staff"
 CAN_idea_the_imperial_general_staff_desc:0 "A British officer commands, the schools are good and the doctrine is sound. But the militia is an auxiliary, and auxiliaries are not consulted."

 CAN_idea_the_south_african_contingents:0 "The South African Contingents"
 CAN_idea_the_south_african_contingents_desc:0 "Seven thousand Canadians have served in a war the Commons never voted. Half the country is proud of it and the other half has taken note."

 CAN_idea_service_within_the_dominion:0 "Service Within the Dominion"
 CAN_idea_service_within_the_dominion_desc:0 "The liability stops at the border. It makes for a quiet country and a small army."

 CAN_idea_liable_to_serve_abroad:0 "Liable to Serve Abroad"
 CAN_idea_liable_to_serve_abroad_desc:0 "The statute says the Crown may send them anywhere at all. Quebec has read the statute."

 CAN_idea_the_royal_military_college:0 "The Royal Military College"
 CAN_idea_the_royal_military_college_desc:0 "Kingston supplies the Dominion with its engineers as much as its officers, and the civil service takes as many as the army does."

 CAN_idea_the_first_canadian_chief_of_staff:0 "A Canadian at the Head"
 CAN_idea_the_first_canadian_chief_of_staff_desc:0 "The senior appointment is held by a man who came up through the militia of this country, and the regiments know it."

 CAN_idea_the_half_million:0 "The Half Million"
 CAN_idea_the_half_million_desc:0 "The figure is proclaimed and the recruiting returns will not meet it. Everything that happens in 1917 follows from this one sentence."

 CAN_idea_what_the_volunteer_can_bear:0 "What the Volunteer Can Bear"
 CAN_idea_what_the_volunteer_can_bear_desc:0 "No figure is promised that the sergeant cannot fill. The war is smaller and the country is whole."

 CAN_idea_the_ranks_that_answer:0 "The Ranks That Answer"
 CAN_idea_the_ranks_that_answer_desc:0 "Recruiting leagues, employers and the pulpit find the last drafts. They come willing and they come untrained."

 CAN_idea_the_farmers_sons:0 "The Farmers' Sons"
 CAN_idea_the_farmers_sons_desc:0 "The exemption was promised at the election and withdrawn by order. The men are in France and the crop is short."

 CAN_idea_the_coalfield_deployment:0 "The Troops in the Coalfields"
 CAN_idea_the_coalfield_deployment_desc:0 "The militia stands between the company and the men at Glace Bay. The pit works, and Cape Breton remembers who came."

 CAN_idea_the_lean_years:0 "The Lean Years"
 CAN_idea_the_lean_years_desc:0 "The Permanent Force is a cadre, the camps are shut and the staff rides on paper. The saving is real and so is the cost."

 CAN_idea_the_bren_gun_affair:0 "The Bren Gun Affair"
 CAN_idea_the_bren_gun_affair_desc:0 "The contract went without tender and the file is now public. The plant is efficient; the government is not believed."

 CAN_idea_the_home_defence_men:0 "The Home Defence Men"
 CAN_idea_the_home_defence_men_desc:0 "Conscripted for this continent and no further. They garrison well, and the volunteers have a name for them."

 CAN_idea_the_lesson_of_hong_kong:0 "The Lesson of Hong Kong"
 CAN_idea_the_lesson_of_hong_kong_desc:0 "Two battalions lost to a decision nobody will own. The commission sits, and the staff learns to ask what it is being told."

 CAN_idea_the_lesson_of_dieppe:0 "The Lesson of Dieppe"
 CAN_idea_the_lesson_of_dieppe_desc:0 "A defended port cannot be rushed in daylight. The bill was paid at Puys and Pourville and the receipt is kept."

 CAN_idea_the_plebiscite_of_1942:0 "The Plebiscite of 1942"
 CAN_idea_the_plebiscite_of_1942_desc:0 "Released from its pledge by the country and held to it by one province. The government may now act, and it will pay when it does."

 ##### HEADLINES 400-409

 CAN_news_400_t:0 "CANADIANS IN THE FIELD AT PAARDEBERG"
 CAN_news_400_d:0 "Canadian contingents are in action beside the imperial troops in South Africa, sent out by Order-in-Council without a vote of the Commons. Lord Strathcona has raised and paid for a mounted regiment. Ontario counts the honour; Quebec the precedent."

 CAN_news_401_t:0 "MILITIA COUNCIL REPLACES THE GENERAL OFFICER COMMANDING"
 CAN_news_401_d:0 "The Militia Act abolishes the office held by a British general and puts a Council under the Minister in its place. The Halifax command clause is repealed, the supporting services are authorized, and the Permanent Force is doubled to four thousand."

 CAN_news_402_t:0 "THE DOMINION FIXES THE LIMIT OF SERVICE"
 CAN_news_402_d:0 "The liability of a Canadian soldier ends at the frontier. Beyond it he serves as a volunteer or not at all. The Opposition calls it a licence to shirk; the Minister answers that two peoples will keep one army on no other ground."

 CAN_news_403_t:0 "SERVICE LIABILITY EXTENDED BEYOND THE DOMINION"
 CAN_news_403_d:0 "The liability of a Canadian soldier follows the Crown wherever the Crown is at war, and may be invoked by proclamation. The Empire is assured of the Dominion's men. Quebec has been told before that a precedent binds nobody."

 CAN_news_404_t:0 "THE FOUR DIVISIONS TAKE VIMY RIDGE"
 CAN_news_404_d:0 "For the first time the whole Corps has attacked together, on a front rehearsed to the yard and behind a barrage timed to the minute. The ridge that cost two allied armies dearly is carried in three days. The despatches no longer say colonial troops."

 CAN_news_405_t:0 "MILITARY SERVICE ACT RECEIVES THE ROYAL ASSENT"
 CAN_news_405_d:0 "Compulsion is now law. The classes are called by order, the tribunals sit on exemptions, and the reinforcements the Corps asked for will be found. The members of one province voted against almost to a man, and the country is divided by language."

 CAN_news_406_t:0 "THE FARMERS' EXEMPTIONS WITHDRAWN"
 CAN_news_406_d:0 "By Order-in-Council the exemption promised to the farmers' sons at the election is cancelled, and the men are called to the depots with the harvest still to come. The delegations to Ottawa are turned away. The West has learned what a pledge is worth."

 CAN_news_407_t:0 "THE HUNDRED DAYS"
 CAN_news_407_d:0 "From Amiens to Mons the Corps has been used as a battering ram and has broken every position put in front of it. The cost is near forty-six thousand casualties, a fifth of the whole war's battle loss. The Dominion will sign the peace in its own name."

 CAN_news_408_t:0 "THE COUNTRY RELEASES THE GOVERNMENT, QUEBEC DOES NOT"
 CAN_news_408_d:0 "The plebiscite frees the ministry from its undertaking not to send conscripts overseas. Eight provinces say yes; the ninth says no by nearly three to one. The government has its answer and it has also its warning, and it means to use only the first."

 CAN_news_409_t:0 "SIXTEEN THOUSAND ORDERED OVERSEAS"
 CAN_news_409_d:0 "The home defence men are to be sent to the reinforcement pools in Europe. The Minister of National Defence has carried his point and the Cabinet has nearly come apart in the carrying. The word given in 1939 and renewed in 1942 is now spent."
