l_english:

###############################################################################################################################
# Austria-Hungary - politics, opposition, 1900-1909.  Lot L6.
# Every key below is new: none of them exists anywhere else in the loaded English localisation.
###############################################################################################################################

# --- HEAD -----------------------------------------------------------------------------------------

 AUHDNC_opp_the_belvedere_chancellery:0 "The Belvedere Chancellery"
 AUHDNC_opp_the_belvedere_chancellery_desc:0 "Between 1900 and 1909 what stops Franz Joseph is never a foreign enemy. It is an obstruction in the chamber, a veto from Budapest, a credit the delegations will not vote. The oldest of these sits in the Lower Belvedere."

# --- S1  THE SUCCESSION AND THE PARALLEL CABINET ---------------------------------------------------

 AUHDNC_opp_the_renunciation_of_1900:0 "The Renunciation of 1900"
 AUHDNC_opp_the_renunciation_of_1900_desc:0 "On 28 June 1900, in the Hofburg, the heir swears an oath excluding the children of his marriage from the succession, and weds Sophie Chotek the next day. A man made to sign that will build his own government elsewhere."

 AUHDNC_opp_the_military_chancellery:0 "The Military Chancellery"
 AUHDNC_opp_the_military_chancellery_desc:0 "From 1906 Brosch von Aarenau runs the heir's military chancellery as a cabinet: memoranda, lists of ministers, a programme for a reign not yet begun. It answers to no office, and Budapest reads it as an attack on the settlement of 1867."

 AUHDNC_opp_the_heir_kept_from_the_papers:0 "The Heir Kept from the Papers"
 AUHDNC_opp_the_heir_kept_from_the_papers_desc:0 "The Ballhausplatz answer: the heir holds no constitutional office, therefore he receives no state papers. The Croats, Romanians and Slovaks lose their only patron at court, and nobody prepares for the change of reign."

 AUHDNC_opp_broschs_shadow_cabinet:0 "Broschs Shadow Cabinet"
 AUHDNC_opp_broschs_shadow_cabinet_desc:0 "Brosch keeps a card index of every man who might be useful and every man who might not: governors, generals, editors, bishops. It is a personnel department for a government that does not exist yet."

 AUHDNC_opp_the_patron_of_the_general_staff:0 "The Patron of the General Staff"
 AUHDNC_opp_the_patron_of_the_general_staff_desc:0 "On 18 November 1906 the heir puts Conrad von Hoetzendorf at the head of the general staff, over the inertia of the court. The same man will spend the next six years refusing him his war."

 AUHDNC_opp_the_thronwechselprogramm:0 "The Thronwechselprogramm"
 AUHDNC_opp_the_thronwechselprogramm_desc:0 "The programme of the change of reign, drafted at the Belvedere and kept in a safe: a proclamation to the peoples, dualism suspended, a ministry of officials. It is twelve years early, and Budapest knows it exists."

 AUHDNC_opp_the_parallel_diplomacy_of_the_heir:0 "The Parallel Diplomacy of the Heir"
 AUHDNC_opp_the_parallel_diplomacy_of_the_heir_desc:0 "The heir writes to Berlin directly, receives ambassadors privately, and tells anyone who will listen that Italy is the real enemy. The foreign ministry is not consulted and is not pleased."

 AUHDNC_opp_the_greater_austria_memorandum:0 "The Greater Austria Memorandum"
 AUHDNC_opp_the_greater_austria_memorandum_desc:0 "Aurel Popovici published his United States of Greater Austria in 1906: fifteen federal units drawn by language, each with a diet, all under one crown. Hungary is cut into five pieces without being consulted."

 AUHDNC_opp_the_third_crown_first:0 "The Third Crown First"
 AUHDNC_opp_the_third_crown_first_desc:0 "Not fifteen states but one more crown: a South Slav kingdom joining Dalmatia to Croatia and taking in Bosnia, crowned at Zagreb. Dualism ceases to exist in law the day it is proclaimed, and Hungary loses Croatia and Fiume."

 AUHDNC_opp_the_fifteen_national_states:0 "The Fifteen National States"
 AUHDNC_opp_the_fifteen_national_states_desc:0 "The map is drawn: fifteen lands from German Austria to Transylvania, each with a diet and a language of office, all with one army and one Kaiser. On paper it is the most rational constitution in Europe."

 AUHDNC_opp_the_coronation_that_is_not_taken:0 "The Coronation That Is Not Taken"
 AUHDNC_opp_the_coronation_that_is_not_taken_desc:0 "The Belvedere plan is to refuse the crown of Saint Stephen until Hungary accepts the new order. The oath binds the king to the integrity of the lands of the crown, and a king who has not sworn it is not bound."

 AUHDNC_opp_the_officials_and_not_the_diets:0 "The Officials and Not the Diets"
 AUHDNC_opp_the_officials_and_not_the_diets_desc:0 "The new lands are administered by a civil service answerable to the crown, not by the notables who would otherwise inherit them. Fifteen diets that legislate, and one bureaucracy that governs."

 AUHDNC_opp_a_crown_for_zagreb:0 "A Crown for Zagreb"
 AUHDNC_opp_a_crown_for_zagreb_desc:0 "Dalmatia is joined to Croatia, the Sabor is given a treasury and a home guard, and the ban is named in Vienna and not in Budapest. It is what the Fiume Resolution of October 1905 asked for and Vienna declined to offer."

 AUHDNC_opp_the_programme_of_the_first_weeks:0 "The Programme of the First Weeks"
 AUHDNC_opp_the_programme_of_the_first_weeks_desc:0 "The manifesto is printed, the ministry of officials sworn, the diets summoned. The Monarchy has the constitution it should have had in 1867, by decree, over the objection of one of its two contracting parties."

 AUHDNC_opp_the_common_ministerial_council:0 "The Common Ministerial Council"
 AUHDNC_opp_the_common_ministerial_council_desc:0 "Three common ministers and the two prime ministers, answerable to Delegations that never meet together and correspond in writing. It is the only body in which the Monarchy exists as one thing."

 AUHDNC_opp_the_files_stay_at_the_ballhausplatz:0 "The Files Stay at the Ballhausplatz"
 AUHDNC_opp_the_files_stay_at_the_ballhausplatz_desc:0 "Aehrenthal has a simple rule about the Belvedere: the heir may have opinions, and the ministry will have the documents. Nothing crosses the park unless somebody decides it should."

 AUHDNC_opp_pension_the_chancellery_off:0 "Pension the Chancellery Off"
 AUHDNC_opp_pension_the_chancellery_off_desc:0 "The chancellery is reduced to an adjutancy, its officers given regiments, the heir given a hunting estate. The South Slav and Romanian parties lose their patron, and the reign that comes will arrive with nothing prepared."

 AUHDNC_opp_bring_the_heir_into_the_council:0 "Bring the Heir into the Council"
 AUHDNC_opp_bring_the_heir_into_the_council_desc:0 "The subtler containment: give the heir a seat and a title, and let him hear everything and sign nothing. The crown has admitted he has standing, and every demand he makes is argued at the table rather than refused at the door."

 AUHDNC_opp_the_court_decides_the_succession:0 "The Court Decides the Succession"
 AUHDNC_opp_the_court_decides_the_succession_desc:0 "The house law is the house law: the Chief Steward, the family statute and the Kaiser decide what the succession is. It is written, it is settled, and it is nobody's business but the dynasty's."

 AUHDNC_opp_the_heir_signs_what_the_council_signs:0 "The Heir Signs What the Council Signs"
 AUHDNC_opp_the_heir_signs_what_the_council_signs_desc:0 "The heir attends, is briefed, and countersigns the minutes of the common ministerial council. Within two years he has stopped talking about suspending dualism and started asking how one gets a credit voted."

 AUHDNC_opp_no_second_government:0 "No Second Government"
 AUHDNC_opp_no_second_government_desc:0 "One ministry, one channel to the crown and one policy, and an empire that no longer argues about who may speak for it. Nothing surprising will ever be decided again, and that is the point."

 AUHDNC_opp_the_compromise_is_the_constitution:0 "The Compromise Is the Constitution"
 AUHDNC_opp_the_compromise_is_the_constitution_desc:0 "The settlement of 1867 is not a treaty to be improved upon but the constitution of the Monarchy, renewed every ten years. Every people that hoped for a land of its own has been told, politely and finally, to wait."

# --- S2  THE PARTY OF THE STREET --------------------------------------------------------------------

 AUHDNC_opp_the_parties_of_the_street:0 "The Parties of the Street"
 AUHDNC_opp_the_parties_of_the_street_desc:0 "Between 1897 and 1907 the politics of Cisleithania stops being an affair of notables and becomes an affair of crowds. Two mass movements grow at once, and neither can be answered by a language ordinance."

 AUHDNC_opp_the_hainfeld_programme:0 "The Hainfeld Programme"
 AUHDNC_opp_the_hainfeld_programme_desc:0 "Viktor Adler welded a scattering of quarrelling groups into one Social Democratic party at Hainfeld in 1888. It recruits Germans, Czechs, Poles, Ruthenes and Slovenes, and it is the only structure in the Monarchy that does."

 AUHDNC_opp_the_trade_union_commission:0 "The Trade Union Commission"
 AUHDNC_opp_the_trade_union_commission_desc:0 "The union commission in Vienna bargains for men in Trieste, Reichenberg and Lemberg, and keeps better statistics than the ministry of commerce. It is a state within the state with no territory."

 AUHDNC_opp_the_catholic_workers_associations:0 "The Catholic Workers Associations"
 AUHDNC_opp_the_catholic_workers_associations_desc:0 "The Christian Social answer to the union commission: workers associations under clerical patronage, with sick funds, reading rooms and their own hiring lists. They are why the socialists never took the Alpine countryside."

 AUHDNC_opp_the_bruenn_nationalities_programme:0 "The Bruenn Nationalities Programme"
 AUHDNC_opp_the_bruenn_nationalities_programme_desc:0 "At Bruenn in 1899 the party rules that nationality is a personal status and not a piece of ground: a man registers his nation and his schools follow him. The party becomes six parties with one treasury."

 AUHDNC_opp_one_party_for_the_whole_state:0 "One Party for the Whole State"
 AUHDNC_opp_one_party_for_the_whole_state_desc:0 "The centralist answer: one party, one executive, one language of business, and national sections that are administrative conveniences. The Czech and Polish sections are outvoted in a tongue they do not speak."

 AUHDNC_opp_the_sickness_and_accident_funds:0 "The Sickness and Accident Funds"
 AUHDNC_opp_the_sickness_and_accident_funds_desc:0 "The compulsory sickness and accident insurance of the Taaffe years, widened to trades left out of it. Insured men come back to work sooner, and they also know exactly what the law owes them."

 AUHDNC_opp_the_trade_inspectorate:0 "The Trade Inspectorate"
 AUHDNC_opp_the_trade_inspectorate_desc:0 "The factory inspectorate counts hours, guards and staircases and publishes what it finds. It is small, it is honest, and it has changed more in the mills of Bohemia than any speech in the Reichsrat."

 AUHDNC_opp_the_stokers_of_trieste:0 "The Stokers of Trieste"
 AUHDNC_opp_the_stokers_of_trieste_desc:0 "In February 1902 the stokers of the Trieste gasworks strike, the port comes out with them, and the troops fire. The dead are counted in double figures, and the Slovene and Italian workers find they are on the same side."

 AUHDNC_opp_the_strike_wave_of_1905:0 "The Strike Wave of 1905"
 AUHDNC_opp_the_strike_wave_of_1905_desc:0 "The Russian revolution crosses the frontier. Through the autumn the strikes spread from the Ostrava coalfield to the Vienna metal trades, and on 28 November a demonstration fills the Ring."

 AUHDNC_opp_the_general_strike_for_the_franchise:0 "The General Strike for the Franchise"
 AUHDNC_opp_the_general_strike_for_the_franchise_desc:0 "The answer to the street is a bill. Franz Joseph backs it for a reason of his own: a mass electorate drowns the national parties that have blocked the Reichsrat for ten years."

 AUHDNC_opp_the_state_of_exception:0 "The State of Exception"
 AUHDNC_opp_the_state_of_exception_desc:0 "The other answer, and one the Monarchy has used before: emergency ordinance over the industrial districts, jury trial suspended, meetings by a permit that is refused. The franchise question is postponed, not answered."

 AUHDNC_opp_the_franchise_bill_of_1906:0 "The Franchise Bill of 1906"
 AUHDNC_opp_the_franchise_bill_of_1906_desc:0 "Gautsch lays the bill in February 1906, Beck carries it, and the sanction comes on 26 January 1907: universal, equal and direct manhood suffrage, and the curias are gone. It is the widest franchise in Europe east of France."

 AUHDNC_opp_the_socialists_enter_the_reichsrat:0 "The Socialists Enter the Reichsrat"
 AUHDNC_opp_the_socialists_enter_the_reichsrat_desc:0 "Men arrested ten years ago for printing a newspaper now sit on the estimates committee. The party enters the institutions, and the institutions begin, very slowly, to enter the party."

 AUHDNC_opp_the_eighty_seven_deputies:0 "The Eighty-Seven Deputies"
 AUHDNC_opp_the_eighty_seven_deputies_desc:0 "The elections of May 1907, on five hundred and sixteen seats: near ninety-six Christian Socials and near eighty-seven Social Democrats. The Young Czechs fall from fifty-odd to under twenty, and the notable parties are finished."

 AUHDNC_opp_the_party_splits_by_nation:0 "The Party Splits by Nation"
 AUHDNC_opp_the_party_splits_by_nation_desc:0 "Within four years of its triumph the party that recruited in every language has split into German, Czech, Polish, Ruthene, Slovene and Italian sections. Universal suffrage reproduced the national fracture inside every party."

 AUHDNC_opp_a_parliament_of_thirty_parties:0 "A Parliament of Thirty Parties"
 AUHDNC_opp_a_parliament_of_thirty_parties_desc:0 "Eleven recognised nationalities, universal suffrage and a national register produce a chamber of some thirty groups. It cannot form a majority, and the state governs by ordinance under a democratic constitution."

 AUHDNC_opp_the_franchise_that_changed_nothing:0 "The Franchise That Changed Nothing"
 AUHDNC_opp_the_franchise_that_changed_nothing_desc:0 "The reading the ministry acts on: the franchise was a device for breaking the national bourgeois parties, it worked, and government may resume. The Czechs conclude, correctly, that the reform was aimed at them."

 AUHDNC_opp_the_two_internationals_in_one_state:0 "Two Internationals in One State"
 AUHDNC_opp_the_two_internationals_in_one_state_desc:0 "The Czech unions leave the Vienna commission and set up their own, and the international congress is asked to arbitrate between two socialist movements in one empire. It cannot, and the schism holds."

 AUHDNC_opp_a_monarchy_of_reform:0 "A Monarchy of Reform"
 AUHDNC_opp_a_monarchy_of_reform_desc:0 "A dynasty that governs with the mass parties, over the heads of the notables and against the Magyar gentry. It is popular for the first time since 1848, and now obliged to explain itself to five hundred deputies."

 AUHDNC_opp_the_political_police:0 "The Political Police"
 AUHDNC_opp_the_political_police_desc:0 "The state police of the Vienna directorate, with correspondents in every crownland, reads what it likes and files what it reads. By 1909 it knows the quarrels of the opposition better than the opposition does."

 AUHDNC_opp_the_press_law_amended:0 "The Press Law Amended"
 AUHDNC_opp_the_press_law_amended_desc:0 "Seizure before distribution, the deposit raised, and the responsible editor made responsible in earnest. The newspapers appear with white columns where the confiscated articles were, which every reader can interpret."

 AUHDNC_opp_dissolve_the_workers_associations:0 "Dissolve the Workers Associations"
 AUHDNC_opp_dissolve_the_workers_associations_desc:0 "The associations law of 1867 lets the governor dissolve any association that endangers public order, and it is used: funds impounded, reading rooms shut, officers prosecuted. It works in that sense and in no other."

 AUHDNC_opp_the_quiet_of_the_workshops:0 "The Quiet of the Workshops"
 AUHDNC_opp_the_quiet_of_the_workshops_desc:0 "The mills of Bohemia run without interruption and the ministry can point to the figures. It has bought them with government by permit and a Czech working class that now expects nothing from Vienna."

# --- S3  THE MASS PARTY AND THE ALTAR --------------------------------------------------------------

 AUHDNC_opp_the_mass_party_and_the_altar:0 "The Mass Party and the Altar"
 AUHDNC_opp_the_mass_party_and_the_altar_desc:0 "Two movements fight for the German vote of Cisleithania, both appealing past the notables to the parish and the street. One is Catholic and dynastic; the other preaches that the dynasty is Roman, foreign and finished."

 AUHDNC_opp_the_christian_social_fusion:0 "The Christian Social Fusion"
 AUHDNC_opp_the_christian_social_fusion_desc:0 "Lueger has been mayor of Vienna since 1897, after Franz Joseph refused three times to confirm him and then gave way. In 1907 his Christian Socials fuse with the Alpine conservatives and become the largest German party in the empire."

 AUHDNC_opp_the_los_von_rom_conversions:0 "The Los von Rom Conversions"
 AUHDNC_opp_the_los_von_rom_conversions_desc:0 "Schoenerer launched the Away from Rome movement in 1898: conversion to Protestantism as an act of German loyalty against a Catholic dynasty. The numbers were exaggerated, but the bishops write to Vienna about northern Bohemia."

 AUHDNC_opp_the_peoples_leagues_of_the_countryside:0 "The Peoples Leagues of the Countryside"
 AUHDNC_opp_the_peoples_leagues_of_the_countryside_desc:0 "Parish by parish, the Catholic peoples leagues of Tyrol and Upper Austria organise what the liberals never bothered with: the smallholder, the carter, the village schoolmaster. They hold the Alpine lands for two generations."

 AUHDNC_opp_the_catholic_congress_of_vienna:0 "The Catholic Congress of Vienna"
 AUHDNC_opp_the_catholic_congress_of_vienna_desc:0 "A general Catholic congress in the capital, with the archduchesses in the front row and delegations from every crownland. The Monarchy is the one great power whose confession is also its constitution."

 AUHDNC_opp_the_counter_mission:0 "The Counter-Mission"
 AUHDNC_opp_the_counter_mission_desc:0 "The dynasty answers a confessional secession in its own currency: missions in the affected districts, a subsidised Catholic press, the imperial house at mass. The German towns read it as proof that Schoenerer was right."

 AUHDNC_opp_let_the_converts_go:0 "Let the Converts Go"
 AUHDNC_opp_let_the_converts_go_desc:0 "The Josephinist answer: a man may believe what he likes, the state has no confession, and a movement fed on persecution starves without it. The Slovene, Croat and Polish parties lose what made a German dynasty theirs."

 AUHDNC_opp_the_concordat_defended:0 "The Concordat Defended"
 AUHDNC_opp_the_concordat_defended_desc:0 "The clergy hold the parish registers, the elementary schools and the marriage courts, and are defended whenever a liberal majority tries to take one away. It is the cheapest administration the Monarchy has."

 AUHDNC_opp_the_piusverein:0 "The Piusverein"
 AUHDNC_opp_the_piusverein_desc:0 "A press association with a printing works in every provincial capital, founded to put a Catholic paper into hands that would otherwise hold a national one. By 1909 it is the largest publisher in the Monarchy."

 AUHDNC_opp_the_protestant_patent_confirmed:0 "The Protestant Patent Confirmed"
 AUHDNC_opp_the_protestant_patent_confirmed_desc:0 "The Protestant Patent of 1861 gave the evangelical churches their legal standing, and its guarantees are widened rather than quietly narrowed. It is noticed in Hungary, where a third of the gentry is Calvinist."

 AUHDNC_opp_the_savings_banks_of_the_parishes:0 "The Savings Banks of the Parishes"
 AUHDNC_opp_the_savings_banks_of_the_parishes_desc:0 "The Catholic credit societies of the Alpine valleys lend against a harvest and a reputation, and keep the smallholders of Tyrol out of the hands of the mortgage banks. Where they operate the emigration figures fall."

 AUHDNC_opp_the_free_thought_associations:0 "The Free Thought Associations"
 AUHDNC_opp_the_free_thought_associations_desc:0 "Freethinkers, monists and the anticlerical wing of the German liberals, tolerated and quietly encouraged. A small constituency and a loud one, holding many of the men who run the laboratories of Vienna and Prague."

 AUHDNC_opp_the_state_leaves_the_pulpit:0 "The State Leaves the Pulpit"
 AUHDNC_opp_the_state_leaves_the_pulpit_desc:0 "Civil marriage, civil registers, and the universities left to appoint whom they please. The Monarchy stops being a confessional state in its administration, and the cost is paid in Ljubljana, Zagreb and Cracow."

 AUHDNC_opp_the_school_and_the_bishop:0 "The School and the Bishop"
 AUHDNC_opp_the_school_and_the_bishop_desc:0 "The elementary school is where the confessional question actually lives: who appoints the teacher, who inspects the classroom, and by whose catechism a child of six is taught."

 AUHDNC_opp_the_confessional_school_kept:0 "The Confessional School Kept"
 AUHDNC_opp_the_confessional_school_kept_desc:0 "The parish keeps its school, the bishop keeps his inspectorate, and the state pays the difference. The Czech towns, where anticlericalism and national feeling are one sentiment, are handed a grievance for twenty years."

 AUHDNC_opp_the_interconfessional_school:0 "The Interconfessional School"
 AUHDNC_opp_the_interconfessional_school_desc:0 "One elementary school for all confessions, staffed and inspected by the state. Every parish council in the Alpine lands writes to Vienna, and the clergy who held the countryside find they are being replaced."

 AUHDNC_opp_the_press_of_the_parish:0 "The Press of the Parish"
 AUHDNC_opp_the_press_of_the_parish_desc:0 "A weekly in every deanery, with the market prices, the saints days and a column on politics written in Vienna. It is read aloud where half the audience cannot read, and it is worth more than any speech in the Reichsrat."

 AUHDNC_opp_the_christian_social_ministry:0 "The Christian Social Ministry"
 AUHDNC_opp_the_christian_social_ministry_desc:0 "A mass party takes ministries, counts its votes and carries the estimates. The crown has acquired a partner rather than a client, and partners have terms."

 AUHDNC_opp_the_alpine_lands_and_the_altar:0 "The Alpine Lands and the Altar"
 AUHDNC_opp_the_alpine_lands_and_the_altar_desc:0 "Roads, a rail connection and a credit society in the valleys of Carinthia and Tyrol, delivered by a ministry that wants the Alpine vote and knows how to buy it. The pan-Germans never recover the countryside."

 AUHDNC_opp_the_party_that_learned_to_govern:0 "The Party That Learned to Govern"
 AUHDNC_opp_the_party_that_learned_to_govern_desc:0 "The Christian Socials hold Vienna and the Alpine lands and are the largest German party in the empire, loyal because it suits them. The Monarchy has a mass base at last, and it owes that base a programme."

 AUHDNC_opp_the_confessional_peace:0 "The Confessional Peace"
 AUHDNC_opp_the_confessional_peace_desc:0 "Catholics, Protestants, Orthodox, Uniates, Jews and Muslims, each with a legal standing and a place in the ceremonial, and none with a veto over another. It is the one settlement of the Monarchy that held."

# --- S4  THE GERMAN NATIONAL SECESSION --------------------------------------------------------------

 AUHDNC_opp_the_german_national_secession:0 "The German National Secession"
 AUHDNC_opp_the_german_national_secession_desc:0 "Georg von Schoenerer took some twenty-one seats in 1901 on a programme that treats the dynasty as an obstacle to the German nation. It is not a party of government, and its supporters are the crown's own subjects."

 AUHDNC_opp_the_linz_programme_remembered:0 "The Linz Programme Remembered"
 AUHDNC_opp_the_linz_programme_remembered_desc:0 "The programme drafted at Linz in 1882 wanted a German Austria in customs union with Berlin, with Galicia and Dalmatia dropped. Its authors scattered, but the map it drew is the one every German national still carries."

 AUHDNC_opp_the_wolf_faction_splits:0 "The Wolf Faction Splits"
 AUHDNC_opp_the_wolf_faction_splits_desc:0 "Karl Hermann Wolf breaks with Schoenerer in 1902 and takes most of the Bohemian German deputies with him. The movement that promised to unite the Germans cannot unite itself, and will split twice more before 1911."

 AUHDNC_opp_the_alldeutsche_in_the_reichsrat:0 "The Alldeutsche in the Reichsrat"
 AUHDNC_opp_the_alldeutsche_in_the_reichsrat_desc:0 "A parliamentary group whose declared object is to leave the state whose parliament it sits in. It obstructs, it heckles, and it forces every ministry to count its German votes before anything else."

 AUHDNC_opp_the_trautenau_congress_of_1904:0 "The Trautenau Congress of 1904"
 AUHDNC_opp_the_trautenau_congress_of_1904_desc:0 "German workers in the mixed districts of northern Bohemia, squeezed between Czech labour and the Vienna commission, found a party of their own at Trautenau in 1904. Its national grievance and workers programme will outlast them all."

 AUHDNC_opp_the_burschenschaften:0 "The Burschenschaften"
 AUHDNC_opp_the_burschenschaften_desc:0 "The duelling fraternities of Vienna, Graz and Prague supply the movement with its cadres, its rituals and its exclusions. They also supply the lawyers and engineers the Monarchy will employ in twenty years."

 AUHDNC_opp_buy_the_german_nationals:0 "Buy the German Nationals"
 AUHDNC_opp_buy_the_german_nationals_desc:0 "Appointments, ordinances and a language of office: the ministry gives the German nationals what they want and takes their votes in exchange. The price is paid in Prague, and the Czech deputies stop being willing to negotiate."

 AUHDNC_opp_break_the_german_nationals:0 "Break the German Nationals"
 AUHDNC_opp_break_the_german_nationals_desc:0 "The other answer: prosecute the editors, dissolve the associations, and govern with the Slavs against the men who call the dynasty foreign. The German officials who staff the administration are told their loyalty is in question."

 AUHDNC_opp_the_german_course_in_the_ministry:0 "The German Course in the Ministry"
 AUHDNC_opp_the_german_course_in_the_ministry_desc:0 "The governor of Bohemia is a German, the ordinances favour German usage in the inner service, and the appointments follow. It is the most efficient way the Monarchy has found of manufacturing Czech nationalists."

 AUHDNC_opp_the_dynasty_pays_in_czech_coin:0 "The Dynasty Pays in Czech Coin"
 AUHDNC_opp_the_dynasty_pays_in_czech_coin_desc:0 "The state investment goes to the German districts of northern Bohemia, and the canal promised to Prague is discussed for another year. The Germans of Bohemia get their price, and the payer is chosen in advance."

 AUHDNC_opp_the_bohemian_germans_get_their_price:0 "The Bohemian Germans Get Their Price"
 AUHDNC_opp_the_bohemian_germans_get_their_price_desc:0 "Building slots, a technical school and a railway junction for Reichenberg, Aussig and Eger. The industrial belt of the Bohemian north is the richest thing the Monarchy owns, and its owners have been reminded who pays for the roads."

 AUHDNC_opp_the_prosecutions_for_high_treason:0 "The Prosecutions for High Treason"
 AUHDNC_opp_the_prosecutions_for_high_treason_desc:0 "Editors and deputies who advocated the dissolution of the state are tried for advocating the dissolution of the state. Each verdict produces a man who has been to prison for the German nation, which the movement cannot manufacture itself."

 AUHDNC_opp_the_associations_law_used:0 "The Associations Law Used"
 AUHDNC_opp_the_associations_law_used_desc:0 "The governor dissolves the school associations, the gymnastic societies and the frontier leagues that did the movement's organising. The funds are impounded and the branches close. The men remain, and so does the reason they joined."

 AUHDNC_opp_the_german_national_vote_returns:0 "The German National Vote Returns"
 AUHDNC_opp_the_german_national_vote_returns_desc:0 "Under universal suffrage the German national vote is diluted by the Christian Socials in the countryside and the Social Democrats in the towns. The secession is outvoted rather than suppressed, which is the only way it could end."

 AUHDNC_opp_the_movement_without_a_leader:0 "The Movement Without a Leader"
 AUHDNC_opp_the_movement_without_a_leader_desc:0 "Schoenerer is finished, Wolf has split, Trautenau has gone its own way, and what is left is a mood with several treasurers. A mood cannot be negotiated with, only outlived, and the Monarchy is good at that."

 AUHDNC_opp_the_alpine_lands_stay_habsburg:0 "The Alpine Lands Stay Habsburg"
 AUHDNC_opp_the_alpine_lands_stay_habsburg_desc:0 "Tyrol, Salzburg, Styria and Carinthia decide they are Austrians who happen to speak German rather than Germans who happen to live in Austria. The German question is answered by refusing to ask it, and Bohemia is never reconciled."

 AUHDNC_opp_the_german_question_reopened:0 "The German Question Reopened"
 AUHDNC_opp_the_german_question_reopened_desc:0 "The Monarchy accepts that its German subjects are Germans first, aligns on Berlin, and reopens the question of 1866 as a question about itself. The Czechs, Slovenes, Croats and Poles are told in public that they are guests."

 AUHDNC_opp_the_deutscher_nationalverband:0 "The Deutscher Nationalverband"
 AUHDNC_opp_the_deutscher_nationalverband_desc:0 "The scattered German liberal, agrarian and national groups are pulled into one parliamentary union with a whip and a common fund. It is the last time the Germans of Cisleithania vote as one thing."

 AUHDNC_opp_the_kaiser_is_a_german_prince:0 "The Kaiser Is a German Prince"
 AUHDNC_opp_the_kaiser_is_a_german_prince_desc:0 "The dynasty is reminded, publicly and at length, that it ruled in Germany for four hundred years before it ruled in Hungary. In Vienna the sentence is read as history. In Budapest it is read as a threat, and it is meant to be."

 AUHDNC_opp_a_german_state_and_nothing_else:0 "A German State and Nothing Else"
 AUHDNC_opp_a_german_state_and_nothing_else_desc:0 "The Monarchy declares itself a German state with subject peoples and stops pretending otherwise. It loses the only argument it ever had for existing: that being outnumbered here did not mean being ruled."

 AUHDNC_opp_the_monarchy_keeps_its_germans:0 "The Monarchy Keeps Its Germans"
 AUHDNC_opp_the_monarchy_keeps_its_germans_desc:0 "The Germans of the Monarchy remain first among its peoples and indispensable in its administration, and not a border province of somebody else's empire. It is achieved by the parish and by the ballot box."

# --- S5  THE ESTATES AGAINST THE STATE ---------------------------------------------------------------

 AUHDNC_opp_the_estates_against_the_state:0 "The Estates Against the State"
 AUHDNC_opp_the_estates_against_the_state_desc:0 "Not every opposition in the Monarchy has a nationality or a creed. Some have a balance sheet: the growers against the millers, the millers against the manufacturers, and all of them against one schedule for two customs services."

 AUHDNC_opp_the_bauernbund:0 "The Bauernbund"
 AUHDNC_opp_the_bauernbund_desc:0 "The peasant leagues of the Alpine lands, organised parish by parish, with a newspaper, a cooperative and one unshakeable policy: the price of grain. They deliver votes and they deliver recruits, and both are counted."

 AUHDNC_opp_the_manufacturers_league:0 "The Manufacturers League"
 AUHDNC_opp_the_manufacturers_league_desc:0 "The industrialists of Bohemia, Moravia and Lower Austria, organised against the agrarians and, when the agrarians are quiet, against each other. They finance every party in the Reichsrat and trust none of them."

 AUHDNC_opp_the_technique_of_obstruction:0 "The Technique of Obstruction"
 AUHDNC_opp_the_technique_of_obstruction_desc:0 "The roll-call demanded on every clause, the point of order, the reading aloud of a document nobody wants to hear. Perfected against Badeni in 1897. It costs nothing, it is entirely lawful, and it stops an empire."

 AUHDNC_opp_the_raiffeisen_credit_unions:0 "The Raiffeisen Credit Unions"
 AUHDNC_opp_the_raiffeisen_credit_unions_desc:0 "Village credit societies on the Raiffeisen pattern, spreading through the Alpine lands, Bohemia, Slovenia and Galicia. They lend small sums against a harvest, and where they take hold the mortgage banks lose ground."

 AUHDNC_opp_the_autonomous_tariff_of_1906:0 "The Autonomous Tariff of 1906"
 AUHDNC_opp_the_autonomous_tariff_of_1906_desc:0 "A new customs schedule agreed between the two halves, and with it the frontier closed to Serbian livestock. Belgrade builds its own abattoirs and exports through Salonika, and the Monarchy loses two thirds of that trade in three years."

 AUHDNC_opp_the_standing_orders_reformed:0 "The Standing Orders Reformed"
 AUHDNC_opp_the_standing_orders_reformed_desc:0 "The rules of the house are rewritten so that a majority may close a debate and the chair may rule a motion dilatory. It works because a third of the house has been deprived of the only weapon it had."

 AUHDNC_opp_let_the_house_obstruct:0 "Let the House Obstruct"
 AUHDNC_opp_let_the_house_obstruct_desc:0 "The answer Koerber actually took: leave the standing orders alone, let the minorities talk, and govern past the chamber by ordinance. The parliament of an empire becomes scenery, and nobody has any reason to negotiate."

 AUHDNC_opp_grain_for_the_towns:0 "Grain for the Towns"
 AUHDNC_opp_grain_for_the_towns_desc:0 "The schedule is written for the consumer: cheap bread in Vienna, Prague and Trieste, and the industrial half of the Monarchy fed at a price it can bear. Every estate between the Danube and the Carpathians has a grievance."

 AUHDNC_opp_protection_for_the_land:0 "Protection for the Land"
 AUHDNC_opp_protection_for_the_land_desc:0 "The schedule is written for the producer: the Hungarian estates and the Alpine smallholders are protected, and town bread costs what the tariff says. The towns pay for it daily, and Hungary will expect the same at the next renewal."

 AUHDNC_opp_the_sugar_cartel:0 "The Sugar Cartel"
 AUHDNC_opp_the_sugar_cartel_desc:0 "The Bohemian and Moravian refiners divide the home market by quota and dump the surplus abroad, under an arrangement the ministry does not disturb. It is the most profitable industry in the Monarchy and the most resented."

 AUHDNC_opp_the_guillotine_in_the_house:0 "The Guillotine in the House"
 AUHDNC_opp_the_guillotine_in_the_house_desc:0 "Closure by simple majority, sittings fixed in advance, and the chair given the power to name and exclude. The minorities discover that the difference between a parliament and a registry office is one procedural motion."

 AUHDNC_opp_the_house_that_never_sits:0 "The House That Never Sits"
 AUHDNC_opp_the_house_that_never_sits_desc:0 "Article 14 lets the government legislate by ordinance while the Reichsrat is not sitting, and Koerber has made that the ordinary method of government, budget included. The chamber may sit when it has nothing to obstruct."

 AUHDNC_opp_the_emigration_from_the_countryside:0 "The Emigration from the Countryside"
 AUHDNC_opp_the_emigration_from_the_countryside_desc:0 "Something like a million and a half people leave Hungary for the United States between 1899 and 1913, the Slovaks and Ruthenes heavily over-represented. The remittances come back and the men mostly do not."

 AUHDNC_opp_the_land_settlement_fund:0 "The Land Settlement Fund"
 AUHDNC_opp_the_land_settlement_fund_desc:0 "A fund to buy and parcel out estates for settlement, applied where it does the most political good and administered by men who owe the county lords. Rather more of the land reaches smallholders of the correct nationality."

 AUHDNC_opp_the_chamber_that_works:0 "The Chamber That Works"
 AUHDNC_opp_the_chamber_that_works_desc:0 "Estimates prepared in committee, debated to a timetable and voted. It is what every other parliament in Europe manages, and in the Reichsrat it counts as a constitutional revolution."

 AUHDNC_opp_the_deputies_paid_by_the_day:0 "The Deputies Paid by the Day"
 AUHDNC_opp_the_deputies_paid_by_the_day_desc:0 "A daily allowance for attendance, which sounds like housekeeping and is not: a Czech schoolmaster or a Ruthene priest can now afford to sit in Vienna. The chamber stops belonging to men with private incomes."

 AUHDNC_opp_the_countryside_answers_the_towns:0 "The Countryside Answers the Towns"
 AUHDNC_opp_the_countryside_answers_the_towns_desc:0 "Credit societies, settlement, roads and a tariff the villages understand. The emigration slows and the recruiting districts fill again. It has cost the towns a good deal, and the towns have noticed."

 AUHDNC_opp_a_house_that_can_be_governed:0 "A House That Can Be Governed"
 AUHDNC_opp_a_house_that_can_be_governed_desc:0 "Closure, fixed sittings, paid deputies and a standing estimates committee. The crown is bound to a majority it must assemble every year, and a chamber that works can also refuse."

 AUHDNC_opp_the_house_is_not_the_state:0 "The House Is Not the State"
 AUHDNC_opp_the_house_is_not_the_state_desc:0 "The conclusion the Monarchy actually drew: the estimates pass under Article 14, the ministers are the Kaiser's, and the chamber is a place where opinions are expressed. The Czechs and Poles find their votes are decorative."

# --- IDEAS -------------------------------------------------------------------------------------------

 AUH_opp_the_belvedere_chancellery:0 "The Belvedere Chancellery"
 AUH_opp_the_belvedere_chancellery_desc:0 "The heir keeps a military chancellery at the Lower Belvedere and runs it as a second ministry. Two governments decide faster than one, and agree on nothing."

 AUH_opp_the_renunciation_oath:0 "The Renunciation Oath"
 AUH_opp_the_renunciation_oath_desc:0 "28 June 1900, the Hofburg. The heir swears his children out of the succession in order to marry. He never forgets who made him do it, and neither does the court."

 AUH_opp_the_military_chancellery:0 "The Military Chancellery"
 AUH_opp_the_military_chancellery_desc:0 "Brosch von Aarenau turns the chancellery into a staff. It drafts, it files, it corresponds with foreign courts, and it answers to nobody who holds an office."

 AUH_opp_the_thronwechselprogramm:0 "The Thronwechselprogramm"
 AUH_opp_the_thronwechselprogramm_desc:0 "The programme for the first weeks of a reign that has not begun. Everything is drafted and nothing can be enacted, and Budapest knows the safe it is in."

 AUH_opp_the_third_crown_draft:0 "The Third Crown Draft"
 AUH_opp_the_third_crown_draft_desc:0 "A third crown at Zagreb, a diet at Sarajevo, and one half of the Monarchy told that the settlement it signed in 1867 is being reopened without it."

 AUH_opp_the_programme_of_the_first_weeks:0 "The Programme of the First Weeks"
 AUH_opp_the_programme_of_the_first_weeks_desc:0 "Officials govern the lands, the diets ratify, and the crown of Saint Stephen waits for a coronation that is not going to be offered."

 AUH_opp_the_heir_without_an_office:0 "The Heir Without an Office"
 AUH_opp_the_heir_without_an_office_desc:0 "The heir presumptive is a private person with an opinion. The papers go to the ministries, and the ministries answer to the Kaiser."

 AUH_opp_the_council_of_common_ministers:0 "The Council of Common Ministers"
 AUH_opp_the_council_of_common_ministers_desc:0 "Three ministers, two delegations, one agenda, and every decision taken twice because it has to be taken in two capitals."

 AUH_opp_no_second_government:0 "No Second Government"
 AUH_opp_no_second_government_desc:0 "One ministry, one channel, one policy. Nothing surprising will be decided again, and that is precisely what was wanted."

 AUH_opp_the_trade_union_commission:0 "The Trade Union Commission"
 AUH_opp_the_trade_union_commission_desc:0 "The union commission in Vienna bargains for men in Trieste, Reichenberg and Lemberg at once. It is a state within the state with no territory."

 AUH_opp_the_personal_autonomy_of_the_workers:0 "Personal Autonomy"
 AUH_opp_the_personal_autonomy_of_the_workers_desc:0 "The Bruenn answer of 1899: nationality is a register entry and not a piece of ground. Every man declares, and no man may be undecided."

 AUH_opp_one_party_for_the_whole_state:0 "One Party for the Whole State"
 AUH_opp_one_party_for_the_whole_state_desc:0 "One executive, one language of business, one central committee, and national sections that are administrative conveniences and nothing more."

 AUH_opp_the_workers_insurance_funds:0 "The Workers Insurance Funds"
 AUH_opp_the_workers_insurance_funds_desc:0 "Sickness and accident funds on the Taaffe pattern, widened. Insured men come back to work sooner, and insured men know what they are owed."

 AUH_opp_the_trade_inspectorate:0 "The Trade Inspectorate"
 AUH_opp_the_trade_inspectorate_desc:0 "The factory inspectorate counts hours, guards and staircases and publishes what it finds. The mills now argue about the law instead of ignoring it."

 AUH_opp_the_strike_wave:0 "The Strike Wave"
 AUH_opp_the_strike_wave_desc:0 "The wave of 1905. Work stops from the Ostrava coalfield to the Vienna metal trades, and the state has no answer that is not either a law or a regiment."

 AUH_opp_the_franchise_conceded:0 "The Franchise Conceded"
 AUH_opp_the_franchise_conceded_desc:0 "Sanctioned 26 January 1907: universal, equal and direct manhood suffrage, and a ministry that now needs a majority it has no idea how to assemble."

 AUH_opp_a_parliament_of_thirty_parties:0 "A Parliament of Thirty Parties"
 AUH_opp_a_parliament_of_thirty_parties_desc:0 "Five hundred and sixteen seats and something near thirty groups. The most representative chamber in Europe, and it cannot pass a budget."

 AUH_opp_the_franchise_that_changed_nothing:0 "The Franchise That Changed Nothing"
 AUH_opp_the_franchise_that_changed_nothing_desc:0 "The old notable parties died, the national line of fracture reproduced itself inside every new one, and the ordinance power was never put away."

 AUH_opp_a_monarchy_of_reform:0 "A Monarchy of Reform"
 AUH_opp_a_monarchy_of_reform_desc:0 "A dynasty that governs with the masses against the notables. It is popular, it is legitimate, and every decision it takes must now be explained to somebody."

 AUH_opp_the_political_police:0 "The Political Police"
 AUH_opp_the_political_police_desc:0 "The state police reads what it likes and files what it reads. The Monarchy knows more about its own subjects than any of them would believe."

 AUH_opp_the_quiet_of_the_workshops:0 "The Quiet of the Workshops"
 AUH_opp_the_quiet_of_the_workshops_desc:0 "Output is up because the associations are dissolved and the presses are seized. Nobody in Bohemia believes a word the ministry says."

 AUH_opp_the_state_of_exception:0 "The State of Exception"
 AUH_opp_the_state_of_exception_desc:0 "Government by emergency ordinance over the industrial districts. Public meetings require a permit, and the permit is refused."

 AUH_opp_the_christian_social_machine:0 "The Christian Social Machine"
 AUH_opp_the_christian_social_machine_desc:0 "Gasworks, trams, an aqueduct, a press and a programme: a mass party in the capital that the dynasty did not choose and cannot refuse."

 AUH_opp_the_counter_mission:0 "The Counter-Mission"
 AUH_opp_the_counter_mission_desc:0 "Missions, congresses and a subsidised Catholic press. It holds the Alpine countryside and hands the German towns to its enemies."

 AUH_opp_the_confessional_truce:0 "The Confessional Truce"
 AUH_opp_the_confessional_truce_desc:0 "The state declines to have a confession. It gains every liberal in the Monarchy and loses the argument the Slovenes, Croats and Poles found convincing."

 AUH_opp_the_concordat_defended:0 "The Concordat Defended"
 AUH_opp_the_concordat_defended_desc:0 "The bishops are the surest allies the dynasty has, and they charge for it in school hours."

 AUH_opp_the_interconfessional_school:0 "The Interconfessional School"
 AUH_opp_the_interconfessional_school_desc:0 "One school for all confessions, staffed by the state. The literacy figures move and every parish council in Tyrol writes to Vienna about it."

 AUH_opp_the_party_that_learned_to_govern:0 "The Party That Learned to Govern"
 AUH_opp_the_party_that_learned_to_govern_desc:0 "A confessional mass party that holds ministries, counts votes and passes estimates. It governs well, and it owes the crown nothing."

 AUH_opp_the_german_national_secession:0 "The German National Secession"
 AUH_opp_the_german_national_secession_desc:0 "Twenty-one seats in 1901 on a programme that treats the dynasty as a foreign occupation. Not a party of government, and it does not wish to be."

 AUH_opp_the_german_course_in_the_ministry:0 "The German Course in the Ministry"
 AUH_opp_the_german_course_in_the_ministry_desc:0 "Appointments, ordinances and a language of office. The price is paid in Prague, and the receipt is kept there."

 AUH_opp_the_prosecutions_for_high_treason:0 "The Prosecutions for High Treason"
 AUH_opp_the_prosecutions_for_high_treason_desc:0 "The verdicts hold and the movement loses its leaders, and every one of them is a martyr by the second year."

 AUH_opp_the_movement_without_a_leader:0 "The Movement Without a Leader"
 AUH_opp_the_movement_without_a_leader_desc:0 "Wolf split from Schoenerer and Trautenau split from Wolf. What is left is a mood with several treasurers, and a mood can only be outlived."

 AUH_opp_a_german_state_and_nothing_else:0 "A German State and Nothing Else"
 AUH_opp_a_german_state_and_nothing_else_desc:0 "The Monarchy declares itself a German state and informs ten peoples, in writing, that they are guests in it."

 AUH_opp_the_monarchy_keeps_its_germans:0 "The Monarchy Keeps Its Germans"
 AUH_opp_the_monarchy_keeps_its_germans_desc:0 "First among the peoples of the Monarchy, and not a border province of somebody elses empire."

 AUH_opp_the_bauernbund:0 "The Bauernbund"
 AUH_opp_the_bauernbund_desc:0 "The peasant leagues of the Alpine lands, organised parish by parish. They deliver votes and recruits, and they have one policy: the price of grain."

 AUH_opp_the_manufacturers_league:0 "The Manufacturers League"
 AUH_opp_the_manufacturers_league_desc:0 "The industrialists of Bohemia, Moravia and Lower Austria, organised against the agrarians and against each other. They finance everybody and trust nobody."

 AUH_opp_the_technique_of_obstruction:0 "The Technique of Obstruction"
 AUH_opp_the_technique_of_obstruction_desc:0 "The roll-call, the point of order, the reading aloud of a document nobody wants to hear. It costs nothing, it stops everything, and it is lawful."

 AUH_opp_the_standing_orders_reformed:0 "The Standing Orders Reformed"
 AUH_opp_the_standing_orders_reformed_desc:0 "A majority may now close a debate. The chamber works, because a third of it has stopped being able to speak."

 AUH_opp_the_autonomous_tariff:0 "The Autonomous Tariff"
 AUH_opp_the_autonomous_tariff_desc:0 "One schedule for two customs administrations, and a frontier closed to Serbian livestock. Belgrade goes and finds Salonika."

 AUH_opp_grain_for_the_towns:0 "Grain for the Towns"
 AUH_opp_grain_for_the_towns_desc:0 "Cheap bread for Vienna, Prague and Trieste. The towns are quiet, and every estate in Hungary has a grievance with a number attached to it."

 AUH_opp_protection_for_the_land:0 "Protection for the Land"
 AUH_opp_protection_for_the_land_desc:0 "The estates are paid in tariff, the mills of Budapest prosper, and bread in the Cisleithanian towns costs what it costs."

 AUH_opp_a_house_that_can_be_governed:0 "A House That Can Be Governed"
 AUH_opp_a_house_that_can_be_governed_desc:0 "Closure, fixed sittings, paid deputies and a standing estimates committee. It is a parliament, and it is on a leash."

 AUH_opp_the_house_is_not_the_state:0 "The House Is Not the State"
 AUH_opp_the_house_is_not_the_state_desc:0 "The estimates pass by ordinance, the ministers are the Kaisers, and the chamber may sit whenever it has nothing to obstruct."
