l_english:
 CAN_idea_the_lodges_answer:0 "The Lodges Answer"
 CAN_idea_the_lodges_answer_desc:0 "The Orange lodges, the militia regiments and the county associations recruit faster than any government office. They deliver the men, and they expect to be consulted about everything afterwards."
 CAN_idea_the_war_measures_act:0 "The War Measures Act"
 CAN_idea_the_war_measures_act_desc:0 "Rule by order-in-council: internment, censorship and requisition, none of it voted on. It is efficient, it is legal, and the precedent will outlive the war by fifty years."
 CAN_idea_the_war_time_elections_act:0 "The War-Time Elections Act"
 CAN_idea_the_war_time_elections_act_desc:0 "The vote is given to soldiers' wives and taken from citizens naturalised since 1902. It wins the election it was written to win, and it tells a tenth of the country what its citizenship is worth."
 CAN_idea_the_union_government:0 "The Union Government"
 CAN_idea_the_union_government_desc:0 "Conscriptionist Liberals cross the floor and sit with Borden. The country gets a government that can raise men, and Quebec gets a government with almost nobody in it."
 CAN_idea_a_party_government_in_wartime:0 "A Party Government in Wartime"
 CAN_idea_a_party_government_in_wartime_desc:0 "Govern with one party and answer to an opposition. It holds the country together and it will not compel a single man into uniform."
 CAN_idea_the_womens_franchise_act:0 "The Women's Franchise Act"
 CAN_idea_the_womens_franchise_act_desc:0 "The federal vote for women, carried in wartime by a government that needed it. It arrives early, it arrives for the wrong reason, and it does not go away."
 CAN_idea_the_nationalist_bloc:0 "The Nationalist Bloc"
 CAN_idea_the_nationalist_bloc_desc:0 "Bourassa's Quebec: loyal to Canada, unpersuaded that Canada owes Europe an army. Every recruiting drive in the province now runs through it."
 CAN_idea_a_minister_from_quebec:0 "A Minister from Quebec"
 CAN_idea_a_minister_from_quebec_desc:0 "A French Canadian in the war cabinet with a portfolio that matters. It costs nothing on paper and it is the only thing keeping the province in the conversation."
 CAN_idea_the_assembly_has_spoken:0 "The Assembly Has Spoken"
 CAN_idea_the_assembly_has_spoken_desc:0 "The Francoeur motion is debated rather than withdrawn: Quebec asks aloud whether it should remain in Confederation. Nothing is decided, and nothing is the same afterwards."
 CAN_idea_the_farmers_bargain:0 "The Farmers' Bargain"
 CAN_idea_the_farmers_bargain_desc:0 "Exempt the farm sons and the Prairies will feed the alliance. The grain arrives, the exemption is written down, and half the country reads it as a favour."
 CAN_idea_the_farm_vote_lost:0 "The Farm Vote Lost"
 CAN_idea_the_farm_vote_lost_desc:0 "The exemption is cancelled by order-in-council in April 1918. The men are found, the harvest is not, and the Prairies remember it at every election for a generation."
 CAN_idea_the_bargain_kept:0 "The Bargain Kept"
 CAN_idea_the_bargain_kept_desc:0 "The farm exemption stands to the armistice. There are fewer men in France and there is bread in Britain, and both facts are true at once."
 CAN_idea_patriotism_and_production:0 "Patriotism and Production"
 CAN_idea_patriotism_and_production_desc:0 "A campaign that asks every acre and every lathe for more, and gets it. The country works harder than it ever has and is paid in posters."
 CAN_idea_the_board_of_grain_supervisors:0 "The Board of Grain Supervisors"
 CAN_idea_the_board_of_grain_supervisors_desc:0 "One buyer, one price, one destination. The open market in wheat is suspended for the duration, and the farmer finds out what a fixed price feels like."
 CAN_idea_the_winnipeg_exchange:0 "The Winnipeg Exchange"
 CAN_idea_the_winnipeg_exchange_desc:0 "The grain trade stays in private hands and the price finds its own level. The exchange makes a fortune and the men who grew the wheat do not."
 CAN_idea_the_last_prairie_broken:0 "The Last Prairie Broken"
 CAN_idea_the_last_prairie_broken_desc:0 "Wheat pushed onto land that should never have been ploughed. It feeds the alliance for four years, and the topsoil presents its bill in the thirties."
 CAN_idea_shells_for_the_empire:0 "Shells for the Empire"
 CAN_idea_shells_for_the_empire_desc:0 "The Imperial Munitions Board turns a farming dominion into an arsenal: a third of the shells fired by British guns are made here. Every contract is signed in London."
 CAN_idea_women_in_the_shops:0 "Women in the Shops"
 CAN_idea_women_in_the_shops_desc:0 "Thirty thousand women on munitions lathes. The shells are made, the wage is lower, and what happens in 1919 is left for 1919 to settle."
 CAN_idea_refined_at_home:0 "Refined at Home"
 CAN_idea_refined_at_home_desc:0 "Nickel, aluminium and steel finished in Canada instead of shipped out raw. It costs export earnings now and it is the beginning of an industry."
 CAN_idea_the_income_war_tax:0 "The Income War Tax"
 CAN_idea_the_income_war_tax_desc:0 "A temporary measure, introduced in 1917 to pay for a war that will be over shortly. It is still being collected in 1949."
 CAN_idea_the_victory_loans:0 "The Victory Loans"
 CAN_idea_the_victory_loans_desc:0 "The war is financed at home rather than in London, by hundreds of thousands of small subscribers. The country now owes the money to itself, and to a new class of bondholders."
 CAN_idea_the_halifax_relief_commission:0 "The Halifax Relief Commission"
 CAN_idea_the_halifax_relief_commission_desc:0 "Two thousand dead in six seconds, and a city rebuilt by a commission with real powers over property it did not own. Canada learns disaster administration the hard way."
 CAN_idea_jamming_in_the_mud:0 "Jamming in the Mud"
 CAN_idea_jamming_in_the_mud_desc:0 "The Ross is a superb target rifle and it seizes in trench dirt. It is made in Quebec, it employs Canadians, and the men in the line throw it away for Lee-Enfields taken off the dead."
 CAN_idea_the_british_pattern:0 "The British Pattern"
 CAN_idea_the_british_pattern_desc:0 "The Lee-Enfield, bought rather than built. The rifle works, the ammunition is common with the ally, and a Canadian factory closes."
 CAN_idea_blooded_at_ypres:0 "Blooded at Ypres"
 CAN_idea_blooded_at_ypres_desc:0 "The First Division stands in the first chlorine attack in history and does not break. Six thousand casualties buy a reputation the corps will spend for four years."
 CAN_idea_the_somme_casualties:0 "The Somme Casualties"
 CAN_idea_the_somme_casualties_desc:0 "Twenty-four thousand in four months on the Ancre. The corps learns what artillery preparation is worth, and there is nobody left who learned it at Ypres."
 CAN_idea_the_mud_of_passchendaele:0 "The Mud of Passchendaele"
 CAN_idea_the_mud_of_passchendaele_desc:0 "Currie told Haig it would cost sixteen thousand men. It cost sixteen thousand men. The ridge is taken, and given up again the following spring."
 CAN_idea_the_overseas_ministry:0 "The Overseas Ministry"
 CAN_idea_the_overseas_ministry_desc:0 "A Canadian department in London with authority over Canadian troops. Hughes is gone, the patronage is gone, and the corps is administered by people accountable to Ottawa."
 CAN_idea_the_currie_command:0 "The Currie Command"
 CAN_idea_the_currie_command_desc:0 "A militia officer and failed real-estate broker becomes the first Canadian to command the corps. He plans in detail, he rehearses, and he refuses attacks he judges wasteful."
 CAN_idea_the_corps_under_byng:0 "The Corps Under Byng"
 CAN_idea_the_corps_under_byng_desc:0 "A British general who teaches the corps its trade and hands it over intact. The doctrine is cheap to learn because somebody else paid to learn it."
 CAN_idea_the_corps_undivided:0 "The Corps Undivided"
 CAN_idea_the_corps_undivided_desc:0 "Four divisions that fight together or not at all. Ottawa refuses to let them be parcelled out, which is a political act with a battlefield consequence."
 CAN_idea_divisions_at_disposal:0 "Divisions at Disposal"
 CAN_idea_divisions_at_disposal_desc:0 "The divisions go singly, wherever the alliance needs them. It is generous, it is useful, and there is no longer a Canadian corps to speak of."
 CAN_idea_the_corps_at_full_strength:0 "The Corps at Full Strength"
 CAN_idea_the_corps_at_full_strength_desc:0 "Reinforcements found and battalions kept up to establishment. The corps hits harder than its size for the rest of the war, and the manpower comes from somewhere."
 CAN_idea_a_fifth_division:0 "A Fifth Division"
 CAN_idea_a_fifth_division_desc:0 "Raise a fifth division rather than reinforce the four that exist. It looks larger on paper and every battalion in France is thinner for it."
 CAN_idea_the_hundred_days:0 "The Hundred Days"
 CAN_idea_the_hundred_days_desc:0 "Amiens to Mons: the corps is used as the spearhead of the British armies and takes forty-five thousand casualties doing it. It is the most effective formation on the Western Front and it is bled white."
 CAN_idea_wings_for_another_flag:0 "Wings for Another Flag"
 CAN_idea_wings_for_another_flag_desc:0 "Twenty-two thousand Canadians fly in British uniform. They produce Bishop, Collishaw and Barker, and not one squadron Canada can call its own."
 CAN_idea_a_flying_corps_of_our_own:0 "A Flying Corps of Our Own"
 CAN_idea_a_flying_corps_of_our_own_desc:0 "Canadian squadrons under Canadian command, paid for out of a Canadian budget that does not exist. The doctrine is ours and every dollar of it is found by cutting something else."
 CAN_idea_the_royal_flying_corps_canada:0 "The Royal Flying Corps Canada"
 CAN_idea_the_royal_flying_corps_canada_desc:0 "Training fields across southern Ontario turning out pilots at speed. The output is enormous and the accident rate is what speed costs."
 CAN_idea_the_schools_in_ontario:0 "The Schools in Ontario"
 CAN_idea_the_schools_in_ontario_desc:0 "Camp Borden, Deseronto, Long Branch: proper aerodromes, proper instruction, fewer funerals. It is slower, and the pilots live."
 CAN_idea_the_aces_of_the_dominion:0 "The Aces of the Dominion"
 CAN_idea_the_aces_of_the_dominion_desc:0 "Bishop with seventy-two, Collishaw with sixty, Barker with fifty. The dominion produces fighter pilots out of all proportion to its size and has nowhere of its own to put them."
 CAN_idea_the_royal_canadian_naval_air_service:0 "The Royal Canadian Naval Air Service"
 CAN_idea_the_royal_canadian_naval_air_service_desc:0 "Founded in September 1918 to hunt submarines off Nova Scotia, and disbanded in December. For three months Canada has a naval air arm."
 CAN_idea_the_american_stations:0 "The American Stations"
 CAN_idea_the_american_stations_desc:0 "United States Navy flying boats operating from Halifax and Sydney because Canada has none. The coast is covered, and the arrangement is remembered on both sides of the border."
 CAN_idea_the_royal_naval_college:0 "The Royal Naval College"
 CAN_idea_the_royal_naval_college_desc:0 "Halifax, and Esquimalt after the explosion destroyed the building. A handful of Canadian officers a year, trained to a standard, for a fleet that has not been built."
 CAN_idea_the_vickers_yard:0 "The Vickers Yard"
 CAN_idea_the_vickers_yard_desc:0 "Canadian Vickers at Montreal: submarines, drifters and trawlers built on the Saint Lawrence. The yard exists because the Admiralty ordered from it."
 CAN_idea_the_saint_lawrence_patrol:0 "The Saint Lawrence Patrol"
 CAN_idea_the_saint_lawrence_patrol_desc:0 "Armed yachts and converted trawlers between Quebec and the Gulf. They are slow, they are amateur, and in 1918 they are what stands between the submarines and the convoy assembly."
 CAN_idea_the_trawler_class:0 "The Trawler Class"
 CAN_idea_the_trawler_class_desc:0 "Sixty hulls to one Admiralty design, built in Canadian yards for Canadian waters. They are not warships, and there are enough of them."
 CAN_idea_drifters_from_the_admiralty:0 "Drifters from the Admiralty"
 CAN_idea_drifters_from_the_admiralty_desc:0 "Escort craft transferred rather than built. The convoys are covered next month instead of next year, and no Canadian yard learns anything at all."
 CAN_idea_the_atlantic_lesson:0 "The Atlantic Lesson"
 CAN_idea_the_atlantic_lesson_desc:0 "The 1918 submarine campaign off Nova Scotia teaches a small navy what convoy escort actually requires. The lesson is written down, and it will be needed again in 1939."
