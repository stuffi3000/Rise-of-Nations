l_english:

 ##### FOCUSES - THE MASTER FORK #####

 CAN_the_order_in_council:0 "The Order-in-Council"
 CAN_the_order_in_council_desc:0 "The contingent sails on the Sardinian without a vote of the Commons. Mr Bourassa resigns his seat over it. The Cabinet answers that no precedent is created, and every Cabinet after this one will cite the precedent."
 CAN_the_order_in_council_tt:0 "The executive may commit the country alone. §GWar support and the recruitable share rise, and mobilisation laws cost less.§! §RThe Dominion can never decline a call to war, and Quebec's account opens at once.§! §YThis choice is final.§!"

 CAN_not_a_man_without_a_vote:0 "Not a Man Without a Vote"
 CAN_not_a_man_without_a_vote_desc:0 "The House is recalled before a single man is shipped. Ontario calls it treason to the Empire and London calls it inconvenient, but the rule is written down: what is not voted is not sent."
 CAN_not_a_man_without_a_vote_tt:0 "No expedition without the Commons. §GPolitical power rises and the democratic mood hardens.§! §RWar support falls, mobilisation laws cost more, and every alliance is slower to join.§! §YThis choice is final.§!"
 ##### FOCUSES - THE IMPERIAL LINK #####

 CAN_an_imperial_foreign_policy:0 "An Imperial Foreign Policy"
 CAN_an_imperial_foreign_policy_desc:0 "One policy, one voice, one despatch box. The Dominion accepts that the Empire speaks abroad with a single mouth and that the mouth is in Whitehall, in exchange for the drawings, the patterns and the credit that follow."
 CAN_an_imperial_foreign_policy_tt:0 "The Empire speaks with one voice. §GLicences from British firms are far cheaper and research runs faster.§! §RPolitical power and stability fall: nothing signed abroad was signed here.§!"

 CAN_the_last_word_at_london:0 "The Last Word at London"
 CAN_the_last_word_at_london_desc:0 "Criminal appeals could be ended by a single clause. Instead the Judicial Committee is confirmed as the final court for the Dominion, and the provinces are told plainly that Ottawa is not their master."
 CAN_the_last_word_at_london_tt:0 "The Judicial Committee remains the last court. §GThe provinces are quiet and stability holds.§! §RPolitical power falls and the democratic mood weakens: the final word is not spoken here.§!"

 CAN_the_king_byng_affair:0 "The King-Byng Affair"
 CAN_the_king_byng_affair_desc:0 "The customs inquiry is about to report, the Prime Minister asks for a dissolution, and the Governor General refuses him. Mr Meighen governs for three days. Nobody in the House can say who holds the reserve power."
 CAN_the_king_byng_affair_tt:0 "The customs report and the refused dissolution paralyse the House. §RPolitical power and stability fall until the question of the reserve power is answered.§!"

 CAN_the_crown_keeps_its_discretion:0 "The Crown Keeps Its Discretion"
 CAN_the_crown_keeps_its_discretion_desc:0 "The Governor General may refuse a dissolution and may send for another man. The rule is left where the Colonial Office wrote it, and the loyalists are told the Crown is still a check on the Commons."
 CAN_the_crown_keeps_its_discretion_tt:0 "The reserve power stands. §GWar support and stability rise and English Canada rallies.§! §RPolitical power falls hard and the democratic mood weakens: a ministry can be dismissed.§!"

 CAN_a_dominion_of_the_crown:0 "A Dominion of the Crown"
 CAN_a_dominion_of_the_crown_desc:0 "No statute, no patriation, no separate signature. The Dominion is what it was made in 1867 and asks for nothing more, and the Empire pays for the loyalty in patterns, in credit and in ships."
 CAN_a_dominion_of_the_crown_tt:0 "The imperial road is closed behind you. §GWar support, conscription and organisation rise, and licences cost half.§! §RPolitical power and stability fall, and a call to war can never be declined.§!"

 CAN_the_judicial_committee:0 "The Judicial Committee"
 CAN_the_judicial_committee_desc:0 "Ottawa puts the question to the Supreme Court itself: may the Parliament of Canada end appeals to London? The reference is argued for two years while the provinces file against their own federal government."
 CAN_the_judicial_committee_tt:0 "The reference is argued. §GPolitical power rises while the country debates its own court.§! §RStability falls: the provinces have gone to law against Ottawa.§!"

 ##### FOCUSES - LABOUR, THE FRANCHISE AND SCIENCE #####

 CAN_the_national_research_council:0 "A Council for Research"
 CAN_the_national_research_council_desc:0 "The war is fought with shells the country cannot design. An honorary advisory council is set up to tell the government what its own laboratories can do, and it discovers there are almost none."
 CAN_the_insulin_patent:0 "The Patent for a Dollar"
 CAN_the_insulin_patent_desc:0 "Banting and Best draw an extract from a dog's pancreas in a Toronto attic, and the patent is signed over to the university for one dollar so that no company may hold the price of a life."
 CAN_the_winnipeg_strike:0 "The General Strike"
 CAN_the_winnipeg_strike_desc:0 "Thirty thousand men and women walk out and the strike committee decides which bread waggons may run. The Mounted Police clear Main Street on a Saturday and the country must decide what it has just seen."
 CAN_the_winnipeg_strike_tt:0 "The city stops for six weeks. §RIndustry, efficiency and stability all fall while the strike lasts.§! §YThe answer given afterwards sets the labour road for thirty years.§!"
 CAN_the_liquor_boards:0 "The Liquor Boards"
 CAN_the_liquor_boards_desc:0 "The war prohibition lapses and the provinces put it to their voters one by one. What comes back is not the saloon but the government store, and a revenue no provincial treasurer will ever surrender."
 CAN_the_liquor_boards_tt:0 "The provinces sell the drink themselves. §GConsumer goods cost less and political power is gathered faster.§! §RStability falls: the temperance societies are not finished.§!"
 CAN_edwards_v_canada:0 "Edwards v Canada"
 CAN_edwards_v_canada_desc:0 "The Supreme Court has read section 24 narrowly and the five appellants carry it to London. On 18 October 1929 Sankey rules for them, and the first summons to the Senate follows in February 1930."
 CAN_edwards_v_canada_tt:0 "Women are persons within the meaning of the Act. §GStability, political power and the democratic mood all rise, and the Senate is opened.§!"
 CAN_maritime_rights:0 "Maritime Rights"
 CAN_maritime_rights_desc:0 "Freight rates, the Intercolonial and the steel of Cape Breton: the eastern provinces send Ottawa a bill for Confederation itself. A royal commission is appointed to hear it out."
 CAN_maritime_rights_tt:0 "The Duncan commission reports for the east. §GDockyards build faster and the Atlantic ports are improved.§! §RPolitical power falls: the west has read the report too.§!"
 CAN_the_dominion_provincial_conference:0 "The Dominion-Provincial Conference"
 CAN_the_dominion_provincial_conference_desc:0 "Nine premiers, one table and no agenda anyone can agree on. It is the only room in the country where the constitution can actually be changed, and everyone in it knows the price of a signature."
 CAN_the_dominion_provincial_conference_tt:0 "The premiers are round the table. §GStability rises and administration costs less.§! §RPolitical power falls: nothing carries now without nine signatures.§!"

 ##### FOCUSES - NATIONALITY, LANGUAGE AND THE SCHOOLS #####

 CAN_two_new_provinces:0 "Two New Provinces"
 CAN_two_new_provinces_desc:0 "Alberta and Saskatchewan are cut out of the Territories on the first of September. The land and the subsoil stay with Ottawa, and the one clause the Cabinet cannot agree on is the clause about schools."
 CAN_two_new_provinces_tt:0 "The Territories become two provinces. §GLocal resources and settlement rise.§! §RPolitical power falls: there are two more premiers now.§! §YThe school clause must still be written.§!"
 CAN_the_separate_school_guarantee:0 "The Separate School Guarantee"
 CAN_the_separate_school_guarantee_desc:0 "Ottawa writes the separate schools into the Autonomy Bills itself. Mr Sifton resigns and takes the immigration machine with him, and the Orange lodges of the West answer within the week."
 CAN_the_separate_school_guarantee_tt:0 "The federal guarantee is written into the Act. §GStability and war support rise, and the account against Quebec is not opened.§! §RPolitical power and immigration fall: the West has lost this one.§!"
 CAN_lofts_league:0 "Loft's League"
 CAN_lofts_league_desc:0 "The department can answer the association at Ohsweken with the 1927 clause forbidding money to be raised for land claims, or it can leave the clause out and let the League organise."
 CAN_lofts_league_tt:0 "The association is left to organise. §GPopulation and stability rise.§! §RPolitical power falls: the department did not want this.§!"

 ##### IDEAS #####

 CAN_idea_the_prerogative_of_the_crown:0 "The Prerogative of the Crown"
 CAN_idea_the_prerogative_of_the_crown_desc:0 "An order signed at a Cabinet table in October put a thousand men on a ship for Africa, and the country read about it in the newspapers. Nothing moves faster than an executive that need not explain itself, and nobody will be asked the next time."
 CAN_idea_the_commons_must_be_asked:0 "The Commons Must Be Asked"
 CAN_idea_the_commons_must_be_asked_desc:0 "Parliament will decide is not a slogan here, it is a standing order. Every expedition is argued through a chamber where sixty-five members sit for a province that has never wanted one. Nothing is sent that cannot be defended, and little is sent fast."
 CAN_idea_the_bank_street_office:0 "The Office on Bank Street"
 CAN_idea_the_bank_street_office_desc:0 "The Department of External Affairs opens above a barber's shop, with an under-secretary, a clerk and a typewriter. It is not a foreign office. It is the first address in the country to which another government may write."
 CAN_idea_the_three_refusals:0 "The Three Refusals"
 CAN_idea_the_three_refusals_desc:0 "No permanent council, no contribution to defence, no customs union. Mr Chamberlain asked three times and was answered three times. The Dominion keeps its treasury, its militia and its tariff, and its distance from every table that decides for it."
 CAN_idea_the_separate_signature:0 "A Signature of Our Own"
 CAN_idea_the_separate_signature_desc:0 "The name of Canada stands under the treaty beside the names of powers with fleets. It is a signature won in the cemeteries of France and it cannot be taken back, but the contracts that used to come through London must now be gone after."
 CAN_idea_an_imperial_foreign_policy:0 "One Policy for the Empire"
 CAN_idea_an_imperial_foreign_policy_desc:0 "The Dominion has agreed that the Empire speaks abroad with one voice, and has not asked whose. The patterns, the doctrines and the credit arrive without an argument; so do the commitments, and the country learns of them by cable."
 CAN_idea_the_last_word_at_london:0 "The Last Word at London"
 CAN_idea_the_last_word_at_london_desc:0 "Every constitutional quarrel in the country ends in a panelled room off Downing Street, before judges who have never crossed the Atlantic. The provinces are content, because the Committee has never yet decided against them. Ottawa is not."
 CAN_idea_the_customs_scandal:0 "The Customs Report"
 CAN_idea_the_customs_scandal_desc:0 "A department caught passing liquor over the border, a ministry that cannot be censured because it has resigned, and a Governor General who has refused a dissolution. Until somebody settles who may do what, nothing else gets through the House."
 CAN_idea_the_crown_reserve_power:0 "The Reserve Power"
 CAN_idea_the_crown_reserve_power_desc:0 "The Governor General may refuse a dissolution and send for another man, and everyone in the Cabinet now knows it. The Crown is a real check and not an ornament. Every ministry governs with one eye on Rideau Hall."
 CAN_idea_a_dominion_of_the_crown:0 "A Dominion of the Crown"
 CAN_idea_a_dominion_of_the_crown_desc:0 "No statute, no separate signature, no amending formula and no argument. The country is what the Act of 1867 made it, and the Empire pays well for the certainty: patterns, credit, ships and a place in the line. The place is not optional."
 CAN_idea_the_riddell_disavowal:0 "No Commitments in Advance"
 CAN_idea_the_riddell_disavowal_desc:0 "Our delegate at Geneva proposed oil sanctions and was disowned within the month. The doctrine is now official: this Parliament promises nothing to anyone before the day arrives. It buys unity at home and it buys nothing at all abroad."
 CAN_idea_the_reference_to_the_court:0 "The Reference to the Court"
 CAN_idea_the_reference_to_the_court_desc:0 "The government has asked its own Supreme Court whether Parliament may end appeals to London, and the provinces have briefed counsel against it. The country argues about its own courts in public, which is healthy, and before London, which is not."
 CAN_idea_the_gray_lecture:0 "The Gray Lecture"
 CAN_idea_the_gray_lecture_desc:0 "A Canadian foreign policy stated as a doctrine at last instead of improvised as refusals: national unity, political liberty, the rule of law, the acceptance of international responsibility. Other chancelleries know what to expect from Ottawa."
 CAN_idea_article_five:0 "Article Five"
 CAN_idea_article_five_desc:0 "An attack upon one is an attack upon all: the automatic obligation the Dominion spent thirty years refusing London, signed of its own accord in Washington. The Atlantic is covered, and the brigade in Europe will never come home."
 CAN_idea_a_governor_general_of_our_own:0 "A Governor General of Our Own"
 CAN_idea_a_governor_general_of_our_own_desc:0 "The King's representative is recommended by his Canadian ministers and is a Canadian. Nothing in the constitution changes and everything in the ceremony does. The Court and the City take note, and not warmly."
 CAN_idea_the_research_council:0 "The Research Council"
 CAN_idea_the_research_council_desc:0 "An honorary advisory council with no laboratory, a small grant and a mandate to find out what the country can actually make. It becomes the only body in Ottawa that can answer a technical question, and its estimates are fought over every year."
 CAN_idea_the_insulin_patent:0 "The Patent for a Dollar"
 CAN_idea_the_insulin_patent_desc:0 "The extract works, the Nobel committee agrees within two years, and the patent belongs to a university that took a dollar for it so that no firm could set the price. Children who would have died in the autumn are alive in the spring."
 CAN_idea_the_winnipeg_strike:0 "The General Strike"
 CAN_idea_the_winnipeg_strike_desc:0 "Thirty thousand out, a strike committee deciding which waggons may deliver milk, and a citizens' committee swearing in special constables against them. Nothing is produced, nothing is shipped, and each side is certain the other means revolution."
 CAN_idea_the_liquor_boards:0 "The Government Stores"
 CAN_idea_the_liquor_boards_desc:0 "The war prohibition lapsed and the plebiscites came back for control rather than the saloon. Each province keeps a monopoly it can tax at will, the most reliable provincial revenue anyone has found, and the churches have not stopped writing."
 CAN_idea_the_persons_case:0 "Persons Within the Meaning of the Act"
 CAN_idea_the_persons_case_desc:0 "The Judicial Committee has held that the exclusion of women from public office is a relic of days more barbarous than ours, and that the Act is a living tree. The Senate is open, and so is the question of what else may be read that way."
 CAN_idea_maritime_rights:0 "Maritime Rights"
 CAN_idea_maritime_rights_desc:0 "Freight rates cut, the Intercolonial subsidised and the coal and steel of Cape Breton given a hearing at last. The eastern ports work again. The prairie members have added up what it costs and intend to be paid in kind."
 CAN_idea_the_dominion_provincial_conference:0 "The Premiers at the Table"
 CAN_idea_the_dominion_provincial_conference_desc:0 "The only room where the constitution can be amended: nine premiers, a federal chair and a secretariat that minutes every grievance since 1867. Business gets done cheaply because it gets done once, and only when nine men agree."
 CAN_idea_the_five_broadcasts:0 "The Five Broadcasts"
 CAN_idea_the_five_broadcasts_desc:0 "The Prime Minister goes on the radio five times in January to announce a minimum wage, an eight-hour day, unemployment insurance and a marketing board, none of which his cabinet has seen. The lawyers begin drafting the challenge that week."
 CAN_idea_the_fields_left_to_the_provinces:0 "The Fields Left to the Provinces"
 CAN_idea_the_fields_left_to_the_provinces_desc:0 "Income and corporation tax stay where the Act put them. Quebec and Ontario are satisfied, the compact holds, and every scheme of social insurance that needs a national treasury behind it will now have to be argued nine times over."
 CAN_idea_hold_the_line:0 "Hold the Line"
 CAN_idea_hold_the_line_desc:0 "No allowance, no cheque, no new permanent charge on the revenue. The war debt is paid down and the dollar holds. The men coming back have been told what they were fighting for, and this is not it."
 CAN_idea_uncle_louis:0 "Uncle Louis"
 CAN_idea_uncle_louis_desc:0 "A corporation lawyer from Quebec City who never wanted the job, and the first man since Laurier both halves of the country will hear on the same evening. The reconciliation is genuine, and it was bought with a cabinet and a good deal of public money."
 CAN_idea_two_new_provinces:0 "Alberta and Saskatchewan"
 CAN_idea_two_new_provinces_desc:0 "Two provinces cut out of the Territories, with land offices, legislatures and an immigration stream to fill them. Ottawa keeps the land and the subsoil, which is resented from the first day, and there are two more premiers to be squared."
 CAN_idea_the_separate_school_guarantee:0 "The Separate School Guarantee"
 CAN_idea_the_separate_school_guarantee_desc:0 "Ottawa has written the minority schools into the constitution of two new provinces over the objection of both. Quebec is answered before it has finished asking, the West has learned its school law can be drafted in Ottawa, and Mr Sifton has gone."
 CAN_idea_the_bilingual_schools_question:0 "The Bilingual Schools Question"
 CAN_idea_the_bilingual_schools_question_desc:0 "A departmental circular in Ontario, not a statute anyone voted for, limits French to the first two years of school. The bishops, the trustees and the teachers are all in it, and Ottawa must disallow a provincial instruction or say why it will not."
 CAN_idea_the_merchant_report:0 "The Merchant Report"
 CAN_idea_the_merchant_report_desc:0 "Three commissioners, nineteen months of hearings and a report nobody is asked to vote on: bilingual schools are inspected, funded and left alone. The circular is not repealed, it is simply never enforced again. A quarrel quietly buried."
 CAN_idea_the_league_of_indians:0 "The League of Indians"
 CAN_idea_the_league_of_indians_desc:0 "Returned soldiers good enough to enlist and not good enough to vote have organised across the treaty numbers, from Ohsweken to the Prairies. The department wanted a clause making it an offence to raise money for a land claim, and did not get it."

 ##### HEADLINES #####

 CAN_news_100_t:0 "OTTAWA COMMITS BY DECREE"
 CAN_news_100_d:0 "The contingent is equipped and shipped under an order-in-council, the Commons never having been recalled. The Prime Minister assures the House that no precedent has been created. Mr Bourassa has resigned his seat and says otherwise."
 CAN_news_101_t:0 "THE COMMONS MUST BE ASKED"
 CAN_news_101_d:0 "Parliament is recalled before a man is shipped, and the rule is stated from the Treasury bench: nothing is sent that has not been voted. The imperial press calls it desertion. The member for Labelle has withdrawn his resignation."
 CAN_news_102_t:0 "SCHOOLS WRITTEN INTO THE ACT"
 CAN_news_102_d:0 "The Autonomy Bills reach the House with the separate schools guaranteed by federal statute. The Minister of the Interior has resigned rather than sign, and the lodges of the West have called meetings in every town along the main line."
 CAN_news_103_t:0 "THE PROVINCES WILL SCHOOL THEIR OWN"
 CAN_news_103_d:0 "The school clause is rewritten and the new provinces are left to legislate for themselves. The Minister of the Interior returns to the cabinet. The bishops describe the settlement as a guarantee withdrawn at the moment it was first needed."
 CAN_news_104_t:0 "A CITY AT A STANDSTILL"
 CAN_news_104_d:0 "Thirty thousand have walked out and a strike committee decides which waggons may deliver bread and milk. A Citizens' Committee is swearing in special constables. The Minister of Labour has been sent west by train."
 CAN_news_105_t:0 "THE GOVERNOR GENERAL REFUSES"
 CAN_news_105_d:0 "A dissolution has been refused to a sitting Prime Minister, and another man has been sent for. The customs inquiry is still to report. Whether the King's representative may do this, nobody in the chamber can say with certainty."
 CAN_news_106_t:0 "SIGNED WITHOUT LONDON"
 CAN_news_106_d:0 "A treaty with the United States on the halibut of the north Pacific has been signed by a Canadian minister alone, the British ambassador having been thanked and sent home. The Foreign Office has raised no objection it is willing to publish."
 CAN_news_107_t:0 "THE PATENT GIVEN AWAY"
 CAN_news_107_d:0 "An extract prepared in a Toronto laboratory has brought children out of diabetic coma within hours. The discoverers have assigned the patent to their university for one dollar so that no firm may set the price."
 CAN_news_108_t:0 "THE TENTH PROVINCE"
 CAN_news_108_d:0 "The islanders have voted for union by a margin narrow enough to be argued about for a generation, and the terms are signed. The Dominion gains a coastline, an airfield chain and a fisheries dispute of the first order."
