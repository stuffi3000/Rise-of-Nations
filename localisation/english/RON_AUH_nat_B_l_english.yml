###############################################################################################################################
# Austria-Hungary - family F3, nationalities B : the Czechs, the Poles, the Ruthenes.
# Lot L2. Every key below is new; none of them exists anywhere else in the mod.
###############################################################################################################################

# --- CZE : the Bohemian state right ----------------------------------------------------------

 AUHNAT_CZE_the_bohemian_state_right:0 "The Bohemian State Right"
 AUHNAT_CZE_the_bohemian_state_right_desc:0 "Since 1861 the Diet has held that Bohemia is a state and not a province, and that the Compromise of 1867 cannot bind a country nobody asked. The file, once open, never closes."

 AUHNAT_CZE_the_obstruction_of_the_reichsrat:0 "The Obstruction of the Reichsrat"
 AUHNAT_CZE_the_obstruction_of_the_reichsrat_desc:0 "Badeni's language ordinances of 1897 were shouted down and repealed in 1899. Now the Czechs keep the Chamber from sitting, and a house that cannot legislate cannot refuse either."

 AUHNAT_CZE_the_partner_in_prague:0 "The Partner in Prague"
 AUHNAT_CZE_the_partner_in_prague_desc:0 "Czech politics is not one thing: Young Czechs, agrarians, Masaryk's realists, and a social democracy that still recruits in both languages. Choose which of them you are settling with."

 AUHNAT_CZE_the_conciliation_conferences:0 "The Conciliation Conferences"
 AUHNAT_CZE_the_conciliation_conferences_desc:0 "Koerber's answer of 1900: Germans and Czechs at one table under a minister-president who owes neither anything. Nothing is agreed there, but neither delegation has gone home to legislate."

 AUHNAT_CZE_rule_bohemia_by_ordinance:0 "Rule Bohemia by Ordinance"
 AUHNAT_CZE_rule_bohemia_by_ordinance_desc:0 "Paragraph 14 permits emergency ordinances while the Reichsrat is not sitting, and Koerber puts the budget through by it. Nothing in Cisleithania now requires an agreement."

 AUHNAT_CZE_german_the_language_of_the_state:0 "German, the Language of the State"
 AUHNAT_CZE_german_the_language_of_the_state_desc:0 "One language of state throughout Cisleithania, as the German liberals have demanded since Badeni fell. It would be a tongue a third of its subjects do not speak."

 AUHNAT_CZE_the_young_czech_party:0 "The Young Czech Party"
 AUHNAT_CZE_the_young_czech_party_desc:0 "The Mlado-Czechs swept the Old Czechs away in 1891 by refusing every compromise their elders had made. Kramar leads them, and they remain cheaper to buy than the alternative."

 AUHNAT_CZE_the_moravian_compromise:0 "The Moravian Compromise"
 AUHNAT_CZE_the_moravian_compromise_desc:0 "Four laws of 27 November 1905: every elector on a German or a Czech roll, fixed seats to each, the schools split to match. Every subject must now declare, once and for ever, which he is."

 AUHNAT_CZE_the_koerber_investment_in_bohemia:0 "The Koerber Investment"
 AUHNAT_CZE_the_koerber_investment_in_bohemia_desc:0 "Koerber's programme of 1901: a thousand million crowns of public works over twenty years, in place of the settlement nobody can write. The Kingdom is too busy building to obstruct."

 AUHNAT_CZE_the_bloc_of_german_bohemia:0 "The Bloc of German Bohemia"
 AUHNAT_CZE_the_bloc_of_german_bohemia_desc:0 "The Germans of Reichenberg, Aussig and Eger stop being scattered notables and become one bloc with one demand: cut the Kingdom in half. They are two and a half million and they own the mines."

 AUHNAT_CZE_kramar_and_the_neoslavs:0 "Kramar and the Neo-Slavs"
 AUHNAT_CZE_kramar_and_the_neoslavs_desc:0 "Kramar looks for the weight the Czechs lack at home in Petersburg: a Slav concert patronised from Prague. It gives Vienna a channel to the Tsar's court and gives Czech politics a foreign address."

 AUHNAT_CZE_masaryk_and_the_realists:0 "Masaryk and the Realists"
 AUHNAT_CZE_masaryk_and_the_realists_desc:0 "Masaryk has a chair in philosophy, six deputies, and a habit of proving in public that government documents are forgeries. He prints what he finds."

 AUHNAT_CZE_the_national_cadastre:0 "The National Cadastre"
 AUHNAT_CZE_the_national_cadastre_desc:0 "The registers are drawn parish by parish, every voter entered on one side or the other. When it is done the Empire holds a written record of what each subject believes himself to be."

 AUHNAT_CZE_dig_the_danube_oder_canal:0 "Dig the Danube-Oder Canal"
 AUHNAT_CZE_dig_the_danube_oder_canal_desc:0 "The canal act of 11 June 1901 promised Bohemia a waterway to the Oder and the Elbe, and the trench was never cut. Cutting it means borrowing against twenty years of revenue."

 AUHNAT_CZE_the_canal_that_was_never_dug:0 "The Canal That Was Never Dug"
 AUHNAT_CZE_the_canal_that_was_never_dug_desc:0 "The act stands, the surveys are filed, and the money went to the Alpine lines to Trieste. The treasury is intact, and Bohemia was promised a way to the sea by law and given a filing cabinet."

 AUHNAT_CZE_the_separate_school_boards:0 "The Separate School Boards"
 AUHNAT_CZE_the_separate_school_boards_desc:0 "The last of the four Moravian laws: two boards, two inspectorates, and no child taught in the other side's school again. Neither nation will meet the other before conscription."

 AUHNAT_CZE_the_bohemian_industrial_belt:0 "The Bohemian Industrial Belt"
 AUHNAT_CZE_the_bohemian_industrial_belt_desc:0 "Three fifths of the industry of Cisleithania lies between Pilsen, Kladno, Prague and Ostrau. Investing there is the dullest decision a finance ministry can take and much the most profitable."

 AUHNAT_CZE_germanise_the_civil_service:0 "Germanise the Civil Service"
 AUHNAT_CZE_germanise_the_civil_service_desc:0 "Appointments and inner service in German throughout, with a language examination Czech candidates will mostly fail. The richest province is administered by men it did not choose."

 AUHNAT_CZE_the_agrarians_of_svehla:0 "The Agrarians of Svehla"
 AUHNAT_CZE_the_agrarians_of_svehla_desc:0 "Svehla is building the best organised party in Bohemia out of village cooperatives and beet contracts. Agrarians want tariffs, credit and roads - things that can be given."

 AUHNAT_CZE_the_moravian_model_for_the_empire:0 "The Moravian Model for the Empire"
 AUHNAT_CZE_the_moravian_model_for_the_empire_desc:0 "What worked at Bruenn is offered to the other mixed crownlands: national rolls, curiae, guaranteed seats, divided schools. The Bukovina took it in 1910 and Galicia signed in 1914."

 AUHNAT_CZE_the_skoda_works_of_pilsen:0 "The Skoda Works of Pilsen"
 AUHNAT_CZE_the_skoda_works_of_pilsen_desc:0 "The house became a joint-stock company in 1899 and turned to heavy artillery. Within a decade Pilsen casts the thirty-and-a-half centimetre mortar, and the order books run through Prague."

 AUHNAT_CZE_the_german_school_association:0 "The German School Association"
 AUHNAT_CZE_the_german_school_association_desc:0 "The Schulverein against the Matice skolska, one village schoolhouse at a time. Backing either is cheap, and it makes the state a party to a quarrel it used to arbitrate."

 AUHNAT_CZE_the_czech_question_goes_abroad:0 "The Czech Question Goes Abroad"
 AUHNAT_CZE_the_czech_question_goes_abroad_desc:0 "East with Kramar to the Slav congresses or west with the realists to the British weeklies, the effect is the same. Vienna gains a hearing abroad and loses the privilege of an empty room."

 AUHNAT_CZE_extend_the_cadastre_to_bohemia:0 "Extend the Cadastre to Bohemia"
 AUHNAT_CZE_extend_the_cadastre_to_bohemia_desc:0 "The conferences of 1908 to 1913 tried this and failed until the Diet was suspended by patent. National rolls buy peace, and two electorates the Crown must satisfy separately for ever."

 AUHNAT_CZE_the_zivnostenska_bank:0 "The Zivnostenska Bank"
 AUHNAT_CZE_the_zivnostenska_bank_desc:0 "Czech industry borrowed in Vienna on Viennese terms for thirty years. The Zivnostenska banka has ended that, and with it the last commercial argument anyone in Prague had for the union."

 AUHNAT_CZE_partition_bohemia_into_districts:0 "Partition Bohemia into Districts"
 AUHNAT_CZE_partition_bohemia_into_districts_desc:0 "The Germans want the Kreiseinteilung: the Kingdom carved into national circles, each with its own schools, roads and police. A Kingdom cut into circles is not a Kingdom."

 AUHNAT_CZE_each_to_his_own:0 "Each to His Own"
 AUHNAT_CZE_each_to_his_own_desc:0 "Svuj k svemu. Czechs buy from Czech shops and bank at Czech banks, the Germans answer in kind, and the customs union of fifty million acquires a hole in its best market."

 AUHNAT_CZE_the_diet_of_bohemia_reformed:0 "The Diet of Bohemia Reformed"
 AUHNAT_CZE_the_diet_of_bohemia_reformed_desc:0 "The Diet sits again on the new rolls, committees working and budget passing, after thirteen years. What returns is the habit of settling Bohemian business at Prague."

 AUHNAT_CZE_the_railway_junction_of_prague:0 "The Railway Junction of Prague"
 AUHNAT_CZE_the_railway_junction_of_prague_desc:0 "The lines of Bohemia were laid by six companies to six purposes and meet nowhere in particular. Rebuilding the Prague junction is worth more to the mobilisation plan than three new regiments."

 AUHNAT_CZE_dissolve_the_diet_of_bohemia:0 "Dissolve the Diet of Bohemia"
 AUHNAT_CZE_dissolve_the_diet_of_bohemia_desc:0 "No budget in years, the land finances administered by nobody, sessions ending in the removal of furniture. By imperial patent the Diet is sent home and seven officials take its place."

 AUHNAT_CZE_the_czech_national_council:0 "The Czech National Council"
 AUHNAT_CZE_the_czech_national_council_desc:0 "The Narodni rada ceska of 1900 holds no seats: a standing committee of every Czech party, with a secretariat and an archive. It exists whether the government recognises it or not."

 AUHNAT_CZE_the_czech_civil_service:0 "The Czech Civil Service"
 AUHNAT_CZE_the_czech_civil_service_desc:0 "Czech districts administered by officials who speak Czech, appointed and promoted on the Kingdom's list. Badeni tried it in 1897 by decree; done properly, its loyalty runs to Prague first."

 AUHNAT_CZE_govern_bohemia_by_commission:0 "Govern Bohemia by Commission"
 AUHNAT_CZE_govern_bohemia_by_commission_desc:0 "An administrative commission replaces what is left of self-government. Roads are built and accounts balanced, and no body remains that is entitled to raise the state right."

 AUHNAT_CZE_the_czech_deputies_expelled:0 "The Czech Deputies Expelled"
 AUHNAT_CZE_the_czech_deputies_expelled_desc:0 "The obstruction ends by removing the obstructors: the sitting cleared, the mandates declared forfeit. The Chamber legislates for six million people whose deputies are outside the door."

 AUHNAT_CZE_the_second_czech_university:0 "The Second Czech University"
 AUHNAT_CZE_the_second_czech_university_desc:0 "A second Czech faculty at Bruenn, refused at every session since 1882. It costs a building and a chair list, and yields a professional class large enough to staff a state."

 AUHNAT_CZE_the_coronation_in_prague:0 "The Coronation in Prague"
 AUHNAT_CZE_the_coronation_in_prague_desc:0 "Franz Joseph promised in 1871 to be crowned in Saint Vitus and withdrew it when Budapest objected. The oath binds the Crown to the Kingdom's law in the Kingdom's own words."

 AUHNAT_CZE_the_bohemian_question_adjourned:0 "The Bohemian Question Adjourned"
 AUHNAT_CZE_the_bohemian_question_adjourned_desc:0 "No settlement, no partition, no coronation: the file goes back in the cupboard where it has sat since 1871. Governments that adjourn do not fall."

 AUHNAT_CZE_the_province_of_german_bohemia:0 "The Province of German Bohemia"
 AUHNAT_CZE_the_province_of_german_bohemia_desc:0 "Deutschboehmen given a governor, a budget and a seat at Reichenberg, with the coal of Aussig inside it. The Kingdom of Bohemia now has a hole in it shaped like its own industry."

 AUHNAT_CZE_the_sokol_gymnasts:0 "The Sokol Gymnasts"
 AUHNAT_CZE_the_sokol_gymnasts_desc:0 "Tyrs founded the Sokol in 1862 and it is now the largest voluntary body in the Kingdom, with a hall in every town. The men who march in it are used to obeying a Czech word of command."

 AUHNAT_CZE_the_lands_of_the_bohemian_crown:0 "The Lands of the Bohemian Crown"
 AUHNAT_CZE_the_lands_of_the_bohemian_crown_desc:0 "Bohemia, Moravia and Silesia treated as one body again, with a common diet and budget, as before 1849. Every finance minister after this one finds a third of the revenue voted at Prague."

 AUHNAT_CZE_the_finances_of_the_kingdom:0 "The Finances of the Kingdom"
 AUHNAT_CZE_the_finances_of_the_kingdom_desc:0 "The land budget has been in deficit for years, the Diet cannot vote a remedy, and the creditors are Viennese. The state assumes the debt and takes the land taxes with it."

 AUHNAT_CZE_bohemia_is_a_german_land:0 "Bohemia is a German Land"
 AUHNAT_CZE_bohemia_is_a_german_land_desc:0 "The end of the German road: one language of state, national districts, and the crown of Saint Wenceslas in a museum case. Six million Czechs are left no institution of their own."

 AUHNAT_CZE_the_czech_unions_secede:0 "The Czech Unions Secede"
 AUHNAT_CZE_the_czech_unions_secede_desc:0 "The Czech unions leave the Austrian federation for a centre of their own, against a social democracy that spent twenty years insisting workers have no nationality."

 AUHNAT_CZE_the_crown_of_saint_wenceslas:0 "The Crown of Saint Wenceslas"
 AUHNAT_CZE_the_crown_of_saint_wenceslas_desc:0 "The Lands of the Crown restored as a state within the Empire: a crowned King, a diet that legislates, an oath that binds both ways. A third party to a contract written for two."

 AUHNAT_CZE_the_province_of_bohemia:0 "The Province of Bohemia"
 AUHNAT_CZE_the_province_of_bohemia_desc:0 "No settlement was reached because none was needed. The Diet is gone, the commission governs, the trains run, and the state right has expired of neglect rather than defeat."

 AUHNAT_CZE_a_czech_land_within_the_empire:0 "A Czech Land Within the Empire"
 AUHNAT_CZE_a_czech_land_within_the_empire_desc:0 "Built from below rather than granted from the throne - parties, banks, unions, schools - until the state had nothing left to concede. Bohemia is governed by negotiation now."

# --- POL : the Polish Club -------------------------------------------------------------------

 AUHNAT_POL_the_polish_club:0 "The Polish Club"
 AUHNAT_POL_the_polish_club_desc:0 "Some seventy deputies who vote together and have not brought a government down since 1867. No majority is assembled without them, and the Crown pays in subsidies and studied inattention."

 AUHNAT_POL_the_price_of_the_polish_vote:0 "The Price of the Polish Vote"
 AUHNAT_POL_the_price_of_the_polish_vote_desc:0 "The bargain has never been written down, which is why it works. Vienna gets the budget and the recruit contingent; Cracow gets a viceroy of its own choosing and silence on the Ruthenes."

 AUHNAT_POL_the_two_nations_of_galicia:0 "The Two Nations of Galicia"
 AUHNAT_POL_the_two_nations_of_galicia_desc:0 "West of the San the crownland is Polish; east of it the villages are Ruthene and the landlord belongs to another nation than the men in his fields. The fact has not been named in forty years."

 AUHNAT_POL_confirm_the_galician_autonomy:0 "Confirm the Galician Autonomy"
 AUHNAT_POL_confirm_the_galician_autonomy_desc:0 "The arrangement of 1867 restated: a Polish viceroy, a diet at Lemberg, a school council with its own budget. Vienna gives up the recruiting lists and any knowledge of what happens east of Cracow."

 AUHNAT_POL_the_standing_bargain:0 "The Standing Bargain"
 AUHNAT_POL_the_standing_bargain_desc:0 "Neither confirm the autonomy nor touch it: let it run, on the understanding that the votes arrive and the questions do not. Each year the Club's price rises a little."

 AUHNAT_POL_govern_galicia_from_vienna:0 "Govern Galicia from Vienna"
 AUHNAT_POL_govern_galicia_from_vienna_desc:0 "Over the Diet and past the viceroy: imperial commissioners in the districts, the school council under the ministry, the gendarmerie reporting to Vienna. The Club has nothing left to sell."

 AUHNAT_POL_the_stanczyks_of_cracow:0 "The Stanczyks of Cracow"
 AUHNAT_POL_the_stanczyks_of_cracow_desc:0 "The Cracow conservatives drew the flattest conclusion in Polish politics from 1863: insurrection ruins Poland, and only under the Habsburgs do Poles govern Poles."

 AUHNAT_POL_the_diet_of_galicia:0 "The Diet of Galicia"
 AUHNAT_POL_the_diet_of_galicia_desc:0 "The Sejm at Lemberg legislates on land, schools and roads, on a franchise so weighted to the estates that the result is known before the poll is held."

 AUHNAT_POL_the_minister_for_galicia:0 "The Minister for Galicia"
 AUHNAT_POL_the_minister_for_galicia_desc:0 "A portfolio in the Cisleithanian cabinet held by a Pole: the Club's man at the table whenever the estimates are discussed. No other crownland has one."

 AUHNAT_POL_the_viceroy_and_the_electoral_lists:0 "The Viceroy and the Electoral Lists"
 AUHNAT_POL_the_viceroy_and_the_electoral_lists_desc:0 "The Galician election is made in the district office: rolls revised, candidacies refused on technicalities, gendarmes at the door. In 1908 a student shot the viceroy for it."

 AUHNAT_POL_witos_and_the_peasant_party:0 "Witos and the Peasant Party"
 AUHNAT_POL_witos_and_the_peasant_party_desc:0 "Witos farms twelve acres near Tarnow and speaks for a million men who never had a spokesman. What they want is the great estates broken up, which means dealing with the countryside directly."

 AUHNAT_POL_the_polish_universities:0 "The Polish Universities"
 AUHNAT_POL_the_polish_universities_desc:0 "Cracow and Lemberg were polonised in 1871 and are the only Polish-language universities on earth. Endowing them costs little, and fixes Polish lecture halls in a city ringed by Ruthene villages."

 AUHNAT_POL_the_oil_of_boryslaw:0 "The Oil of Boryslaw"
 AUHNAT_POL_the_oil_of_boryslaw_desc:0 "Boryslaw and Tustanowice reach near two million tons by 1909, third or fourth in the world. It is the only strategic raw material the Empire owns, and it lies where the Russians would come."

 AUHNAT_POL_the_shot_at_lemberg:0 "The Shot at Lemberg"
 AUHNAT_POL_the_shot_at_lemberg_desc:0 "On 12 April 1908 the Ruthenian student Sichynsky shot Viceroy Potocki dead in reprisal for the electoral violence. Order is restored by decree, and nothing else is."

 AUHNAT_POL_the_national_democrats:0 "The National Democrats"
 AUHNAT_POL_the_national_democrats_desc:0 "Dmowski's endecja crosses the cordon from Russian Poland holding that the eastern marches are Polish soil and the Ruthenes a dialect with pretensions. It wins the towns."

 AUHNAT_POL_the_school_council_of_galicia:0 "The School Council of Galicia"
 AUHNAT_POL_the_school_council_of_galicia_desc:0 "The Rada Szkolna Krajowa runs every school in the crownland and answers to the Diet, not to Vienna. Funding it is the best cure for the worst illiteracy in Cisleithania."

 AUHNAT_POL_the_refineries_of_drohobycz:0 "The Refineries of Drohobycz"
 AUHNAT_POL_the_refineries_of_drohobycz_desc:0 "Crude is worth a third of what it fetches refined, and the refining is done in Hungary and Germany. Stills at Drohobycz put our only fuel eighty kilometres from the frontier."

 AUHNAT_POL_bobrzynski_the_conciliator:0 "Bobrzynski the Conciliator"
 AUHNAT_POL_bobrzynski_the_conciliator_desc:0 "Bobrzynski, historian and viceroy from 1908, spends six years buying the Ruthenes a fair share of a province his own nation governs. The electoral violence stops within a year."

 AUHNAT_POL_the_misery_of_galicia:0 "The Misery of Galicia"
 AUHNAT_POL_the_misery_of_galicia_desc:0 "Szczepanowski printed the arithmetic in 1888 and nobody has disproved it: holdings too small to feed a man beside estates too large to farm. A million and a half leave for America."

 AUHNAT_POL_the_ruthenian_curia:0 "The Ruthenian Curia"
 AUHNAT_POL_the_ruthenian_curia_desc:0 "The Moravian device applied to Galicia: separate rolls, a guaranteed Ruthene bloc, a share of the school budget fixed by statute. The Club learns the throne will legislate over its head."

 AUHNAT_POL_the_galician_railways:0 "The Galician Railways"
 AUHNAT_POL_the_galician_railways_desc:0 "The Galician lines were laid to move grain and run east and west; a war with Russia needs them north and south. Doubling the track to Lemberg decides how many corps reach the San."

 AUHNAT_POL_a_polish_galicia_undivided:0 "A Polish Galicia, Undivided"
 AUHNAT_POL_a_polish_galicia_undivided_desc:0 "One crownland from Cracow to the Zbruch, Polish throughout, the Ruthenes accommodated as individuals and not as a nation. Three and a half million cease to exist by act of state."

 AUHNAT_POL_the_emigration_to_america:0 "The Emigration to America"
 AUHNAT_POL_the_emigration_to_america_desc:0 "The state stops obstructing the agents and the passports. A million and a half go between 1899 and 1913, and what they send back is the only cash the villages see."

 AUHNAT_POL_the_galician_compromise_of_1914:0 "The Galician Compromise of 1914"
 AUHNAT_POL_the_galician_compromise_of_1914_desc:0 "Signed in February 1914 after six years of Bobrzynski's patience: national curiae, a fixed Ruthene bloc, a statutory share of the school estimates. It satisfied nobody."

 AUHNAT_POL_the_polish_rifle_associations:0 "The Polish Rifle Associations"
 AUHNAT_POL_the_polish_rifle_associations_desc:0 "The Zwiazek Strzelecki drills openly from about 1910, tolerated and then quietly assisted, because the staff wants a Polish irregular force in being. Its officers have sworn an oath to Poland."

 AUHNAT_POL_the_lists_are_ours:0 "The Lists Are Ours"
 AUHNAT_POL_the_lists_are_ours_desc:0 "Rolls, district offices and gendarmerie confirmed in Polish hands from the Vistula to the Zbruch, the eastern districts drawn so that a Ruthene majority is impossible."

 AUHNAT_POL_land_for_the_peasants:0 "Land for the Peasants"
 AUHNAT_POL_land_for_the_peasants_desc:0 "The land bank buys out the great estates and resells them in holdings a family can live on. The szlachta that delivers the Club's votes is dispossessed by its own government."

 AUHNAT_POL_a_kingdom_within_the_empire:0 "A Kingdom Within the Empire"
 AUHNAT_POL_a_kingdom_within_the_empire_desc:0 "Galicia raised to a Kingdom of Poland under the Habsburg crown, with its own ministry and a coronation at Cracow. A Polish state exists again for the first time since 1795."

 AUHNAT_POL_the_poles_of_the_russian_partition:0 "The Poles of the Russian Partition"
 AUHNAT_POL_the_poles_of_the_russian_partition_desc:0 "Vienna has held the best hand in the Polish question and never played it: a Polish university and diet three days' march from a Congress Kingdom run in Russian. Playing it says so openly."

 AUHNAT_POL_galicia_a_province_like_any_other:0 "Galicia, a Province Like Any Other"
 AUHNAT_POL_galicia_a_province_like_any_other_desc:0 "Diet dissolved, viceroyalty abolished, school council under the ministry, the Club broken up. The crownland yields more than ever, and the one dependable bloc of votes is gone."

 AUHNAT_POL_the_polish_club_delivers:0 "The Polish Club Delivers"
 AUHNAT_POL_the_polish_club_delivers_desc:0 "Land settled, schools funded, the peasant party inside the tent and the endecja outside it. The Club can promise a Galician vote and be sure of it, which it has not managed since 1907."

 AUHNAT_POL_the_austro_polish_solution:0 "The Austro-Polish Solution"
 AUHNAT_POL_the_austro_polish_solution_desc:0 "The standing plan of the Ballhausplatz, never once agreed with Berlin: the Congress Kingdom joined to Galicia under the Habsburg crown. A third partner at every renewal."

# --- UKR : the Ruthenian question --------------------------------------------------------------

 AUHNAT_UKR_the_ruthenian_question:0 "The Ruthenian Question"
 AUHNAT_UKR_the_ruthenian_question_desc:0 "Three and a half million Greek Catholic Ruthenes: a peasantry, a married clergy, no middle class. They have asked every year of this reign for a franchise, schools and a university."

 AUHNAT_UKR_the_lists_of_lemberg:0 "The Lists of Lemberg"
 AUHNAT_UKR_the_lists_of_lemberg_desc:0 "In the eastern districts the electoral roll is an instrument of administration: Ruthene voters entered where their numbers cannot matter, candidates struck off for defective papers."

 AUHNAT_UKR_the_ruthenian_franchise:0 "The Ruthenian Franchise"
 AUHNAT_UKR_the_ruthenian_franchise_desc:0 "Rolls revised under imperial supervision, the district commissions taken from the viceroy, the eastern curiae drawn to the people who live in them. It is carried over the Diet and the Club."

 AUHNAT_UKR_leave_it_to_the_polish_club:0 "Leave It to the Polish Club"
 AUHNAT_UKR_leave_it_to_the_polish_club_desc:0 "The oldest policy in Cisleithania and the cheapest: Galicia is administered by the Poles, and what they do about the Ruthenes is a Galician matter. The petition goes to the men complained of."

 AUHNAT_UKR_the_polish_administration_holds:0 "The Polish Administration Holds"
 AUHNAT_UKR_the_polish_administration_holds_desc:0 "Not merely tolerated but reinforced: gendarmerie, district offices and courts backed against every Ruthene deputation. East of the San, Vienna becomes the enemy."

 AUHNAT_UKR_the_metropolitan_of_halych:0 "The Metropolitan of Halych"
 AUHNAT_UKR_the_metropolitan_of_halych_desc:0 "Sheptytsky, enthroned at Lemberg in 1901: a Polish count who took the eastern rite and became the one man both nations will hear. His parishes and seminaries answer to him and not to the viceroy."

 AUHNAT_UKR_a_ukrainian_university_at_lemberg:0 "A Ukrainian University at Lemberg"
 AUHNAT_UKR_a_ukrainian_university_at_lemberg_desc:0 "Demanded at every session since 1899 and refused at every one: chairs and a faculty in the city where their bishops sit. It yields in one generation the professional class they lack."

 AUHNAT_UKR_the_ruthenian_gymnasia:0 "The Ruthenian Gymnasia"
 AUHNAT_UKR_the_ruthenian_gymnasia_desc:0 "Secondary schools in the eastern districts teaching in the vernacular, with a state examination worth the same as anybody else's. It is less than a university and it is what the Diet will allow."

 AUHNAT_UKR_the_language_of_the_office:0 "The Language of the Office"
 AUHNAT_UKR_the_language_of_the_office_desc:0 "Business with the state is transacted in Polish, and a petition in Ruthene is returned unread for want of a proper form. Three and a half million subjects need an interpreter."

 AUHNAT_UKR_the_greek_catholic_seminaries:0 "The Greek Catholic Seminaries"
 AUHNAT_UKR_the_greek_catholic_seminaries_desc:0 "The eastern-rite clergy is married, lives in the village and is the only educated man in it. Endowing Lemberg and Przemysl yields several hundred such men a year for a building and a stipend."

 AUHNAT_UKR_the_ruthenian_curia_in_the_diet:0 "The Ruthenian Curia in the Diet"
 AUHNAT_UKR_the_ruthenian_curia_in_the_diet_desc:0 "A guaranteed block of Ruthene seats at Lemberg on a separate roll, with a share of the estimates fixed by law rather than favour. It takes something real from the men who run Galicia."

 AUHNAT_UKR_the_prosvita_reading_rooms:0 "The Prosvita Reading Rooms"
 AUHNAT_UKR_the_prosvita_reading_rooms_desc:0 "Three thousand village libraries, half with a cooperative store and a schoolmaster attached, teaching the peasantry to read and to keep accounts at once. It is how a population becomes a nation."

 AUHNAT_UKR_the_russophile_orientation:0 "The Russophile Orientation"
 AUHNAT_UKR_the_russophile_orientation_desc:0 "The old clergy hold there is one Russian people from the Carpathians eastwards, and such a peasantry demands no nation of its own. Their newspapers are paid for from the consulate at Lemberg."

 AUHNAT_UKR_the_ukrainophile_orientation:0 "The Ukrainophile Orientation"
 AUHNAT_UKR_the_ukrainophile_orientation_desc:0 "The young schoolmasters win: the language fixed, the histories written, eastern Galicia the one place on earth where a Ukrainian nation is built in daylight. The Tsar will hear of it."

 AUHNAT_UKR_the_peasant_banks:0 "The Peasant Banks"
 AUHNAT_UKR_the_peasant_banks_desc:0 "Credit unions on the Raiffeisen pattern, run through the reading rooms and the parishes, lending against the harvest at rates a man survives. They break the village usurer."

 AUHNAT_UKR_the_sich_societies:0 "The Sich Societies"
 AUHNAT_UKR_the_sich_societies_desc:0 "Sich and Sokil: gymnastics, fire brigades, drill and a great deal of marching, in villages where the only other institution is the church. Ten thousand men who can take an order."

 AUHNAT_UKR_the_russian_consulate_at_lemberg:0 "The Russian Consulate at Lemberg"
 AUHNAT_UKR_the_russian_consulate_at_lemberg_desc:0 "The subsidies to the Russophile press, the pilgrimages to Pochaiv and the money in the reading rooms all run through one building. Watching it means reading our own subjects' letters."

 AUHNAT_UKR_the_national_democratic_party:0 "The National Democratic Party"
 AUHNAT_UKR_the_national_democratic_party_desc:0 "The Ruthene national democrats are schoolmasters, lawyers and cooperative managers, and they ask for a crownland of their own rather than a better share of somebody else's."

 AUHNAT_UKR_a_crownland_of_our_own:0 "A Crownland of Our Own"
 AUHNAT_UKR_a_crownland_of_our_own_desc:0 "Galicia divided at the San: a Polish crownland in the west, a Ruthene one in the east, each with its diet and school council. It takes Lemberg, the oil and half the revenue out of Polish hands."

 AUHNAT_UKR_the_ruthenian_regiments:0 "The Ruthenian Regiments"
 AUHNAT_UKR_the_ruthenian_regiments_desc:0 "The Carpathian and Podolian districts raise patient, sober infantry, recruited half-heartedly because nobody trusted the villages. Given their own regimental language they cost least of all."

 AUHNAT_UKR_no_partition_of_galicia:0 "No Partition of Galicia"
 AUHNAT_UKR_no_partition_of_galicia_desc:0 "The crownland stays whole under one diet, and the Ruthenes are told their remedy lies in the institutions that exist. Three and a half million people have had a final answer, and it is no."

 AUHNAT_UKR_the_duchy_of_halych:0 "The Duchy of Halych"
 AUHNAT_UKR_the_duchy_of_halych_desc:0 "A crownland east of the San with its own diet, governor and university, held of the Emperor under a title unused since 1772. A Ukrainian state now sits on the Russian frontier."

# --- The ideas of the Czech column -------------------------------------------------------------

 AUH_the_bohemian_question:0 "The Bohemian Question"
 AUH_the_bohemian_question_desc:0 "The state right is on the desk and will not go back in the cupboard. Every appointment in the Kingdom is read as a signal, and the money goes north because that is where the plant is."

 AUH_the_czech_obstruction:0 "The Czech Obstruction"
 AUH_the_czech_obstruction_desc:0 "Bells, whistles, hour-long readings of the standing orders, and no division carried in months. The government is spared the concessions it failed to make, and everything else besides."

 AUH_the_conciliation_table:0 "The Conciliation Table"
 AUH_the_conciliation_table_desc:0 "Both delegations sit, the minutes are kept, the sub-committees report, and nothing is agreed. Neither side has gone home to legislate, and every measure now passes two tables."

 AUH_rule_by_the_land_commission:0 "Rule by Paragraph 14"
 AUH_rule_by_the_land_commission_desc:0 "The Reichsrat is not sitting, the ordinance is signed, the budget is law by Thursday. Koerber governs this way because he must, and nothing in Cisleithania now requires an agreement with anybody."

 AUH_the_state_language_decree:0 "The State Language Decree"
 AUH_the_state_language_decree_desc:0 "One language of state from the Bukovina to the Bohemian Forest, with no bilingual inner service. Bohemia has discovered how much can be done slowly and correctly."

 AUH_the_national_cadastres:0 "The National Cadastres"
 AUH_the_national_cadastres_desc:0 "Every elector on a German or a Czech roll, voting in his own curia, the schools divided to match. The province is at peace, and every subject has declared for life what he is."

 AUH_neoslavism:0 "Neo-Slavism"
 AUH_neoslavism_desc:0 "A Slav concert convened from Prague, with the Russians in it but not over it. Vienna gains a channel to Petersburg, and Czech politics gains an address outside the Monarchy."

 AUH_the_realist_school:0 "The Realist School"
 AUH_the_realist_school_desc:0 "Six deputies, a professor of philosophy and a review nobody in the ministry admits to reading. They argue for the Monarchy in its own constitutional vocabulary, and they print what they find out."

 AUH_the_canal_bonds:0 "The Canal Bonds"
 AUH_the_canal_bonds_desc:0 "Danube to Oder, Danube to Elbe, and a spur toward the Vistula, on a twenty-year loan against revenue not yet earned. The coupon falls due twice a year regardless."

 AUH_the_shelved_canal_bill:0 "The Shelved Canal Bill"
 AUH_the_shelved_canal_bill_desc:0 "The act stands, the surveys are filed, and the money was spent in the Alps on railways that actually run. Bohemia was promised a waterway by act of parliament and given an archive."

 AUH_the_bohemian_industrial_heart:0 "The Bohemian Industrial Heart"
 AUH_the_bohemian_industrial_heart_desc:0 "Sugar, textiles, coal, steel and the best technical schools in Cisleithania, in a belt from Pilsen through Prague to Ostrau. The young men who would fill the depots are at the bench."

 AUH_the_school_boards_divided:0 "The School Boards Divided"
 AUH_the_school_boards_divided_desc:0 "Two boards, two inspectorates, two budgets. The parish fights over the schoolhouse have stopped, and the province pays twice over for a single population."

 AUH_the_school_associations:0 "The School Associations"
 AUH_the_school_associations_desc:0 "Schulverein against Matice skolska, buying schoolhouses in villages of two hundred souls. Taking a side is cheap, and it turns the arbiter into a combatant."

 AUH_the_czech_question_abroad:0 "The Czech Question Abroad"
 AUH_the_czech_question_abroad_desc:0 "It is discussed in Petersburg, in Paris and in the British weeklies, by men with opinions and no vote. Every district commissioner in Bohemia now works with one eye on a foreign newspaper."

 AUH_the_bohemian_cadastre:0 "The Bohemian Cadastre"
 AUH_the_bohemian_cadastre_desc:0 "Two rolls, two curiae and two school administrations, carried where the conferences of 1908 to 1913 failed. Neither electorate will vote a recruit or a crown for the other."

 AUH_the_czech_national_capital:0 "Czech National Capital"
 AUH_the_czech_national_capital_desc:0 "The Zivnostenska banka and the savings houses now finance Czech industry out of Czech deposits, and better than Vienna used to. The last commercial argument for the union has been paid off."

 AUH_bohemia_partitioned:0 "Bohemia Partitioned"
 AUH_bohemia_partitioned_desc:0 "The Kingdom cut into national circles, each with its own schools, roads and police, the mixed districts assigned once and for all. There is no longer a Kingdom of Bohemia to have a state right."

 AUH_the_national_boycott:0 "Each to His Own"
 AUH_the_national_boycott_desc:0 "Czechs buy from Czechs and Germans from Germans, and both sets of shopkeepers find a captive customer pays without haggling. The internal market has a hole in its best province."

 AUH_bohemia_administered_as_a_province:0 "Bohemia Administered as a Province"
 AUH_bohemia_administered_as_a_province_desc:0 "An administrative commission balances the accounts, lets the road contracts and appoints on merit. The Kingdom has not been governed this competently in forty years, nor by anybody it chose."

 AUH_the_crown_of_bohemia_worn:0 "The Crown of Bohemia Worn"
 AUH_the_crown_of_bohemia_worn_desc:0 "The oath sworn in Saint Vitus, half a century after it was promised and withdrawn. Imperial business of a certain kind now requires the King's Bohemian signature as well as his Austrian one."

 AUH_german_bohemia:0 "German Bohemia"
 AUH_german_bohemia_desc:0 "One language of state, national districts, and the crown of Saint Wenceslas in a case in the Hofburg. Six million Czechs have been told in writing what the state thinks they are."

 AUH_the_bohemian_crown_restored:0 "The Crown of Saint Wenceslas"
 AUH_the_bohemian_crown_restored_desc:0 "The Lands of the Bohemian Crown restored as a state within the Empire: a crowned King, a diet, an oath binding both ways. The recruit contingent is no longer wholly the Emperor's."

 AUH_the_bohemian_question_closed:0 "The Bohemian Question Closed"
 AUH_the_bohemian_question_closed_desc:0 "No diet, no coronation, no cadastre, no partition: a province administered from Vienna. The state right has expired of neglect, and the men who would have argued it are in business or abroad."

 AUH_the_czech_land:0 "The Czech Land"
 AUH_the_czech_land_desc:0 "Assembled from below rather than granted from the throne, until nothing was left for the state to concede. The Czechs stay willingly, on terms they wrote, and Bohemia is governed by negotiation."

# --- The ideas of the Polish column --------------------------------------------------------------

 AUH_the_polish_club:0 "The Polish Club"
 AUH_the_polish_club_desc:0 "Seventy deputies who vote as one, have never brought a government down, and have never been asked an awkward question. The subsidy that keeps Galicia quiet does not come back."

 AUH_the_two_nations_of_galicia:0 "The Two Nations of Galicia"
 AUH_the_two_nations_of_galicia_desc:0 "One crownland on the map and two countries on the ground, divided at the San by language, rite and landholding. Nothing done in Galicia is merely administrative any more."

 AUH_the_galician_autonomy:0 "The Galician Autonomy"
 AUH_the_galician_autonomy_desc:0 "A viceroy, a diet, a school council and a minister in the cabinet at Vienna: home rule in all but name since 1867. Vienna is spared the governing, and has given up the recruiting lists with it."

 AUH_the_standing_bargain:0 "The Standing Bargain"
 AUH_the_standing_bargain_desc:0 "Never written and never mentioned in the Chamber: the votes arrive, the questions are not asked, the subsidy is paid quarterly. Its price is paid in coin the government will need later."

 AUH_galicia_governed_from_vienna:0 "Galicia Governed from Vienna"
 AUH_galicia_governed_from_vienna_desc:0 "Imperial commissioners in the districts, the school council under the ministry, the gendarmerie reporting to the interior. The Club has nothing left to sell."

 AUH_the_lists_of_the_viceroy:0 "The Lists of the Viceroy"
 AUH_the_lists_of_the_viceroy_desc:0 "Rolls revised in the district office, candidacies refused on defective stamps, polling stations moved a day's walk into the hills. The same office asks the same villages for their sons."

 AUH_the_peasant_party:0 "The Peasant Party"
 AUH_the_peasant_party_desc:0 "A million smallholders with a spokesman at last, wanting the estates broken up and sold in parcels a family can live on. The Club's arrangements in Vienna do not interest them."

 AUH_the_galician_oil_boom:0 "The Galician Oil Boom"
 AUH_the_galician_oil_boom_desc:0 "Boryslaw and Tustanowice, near two million tons a year at the peak and third or fourth in the world. The only strategic raw material we own lies where the Russians would come."

 AUH_the_state_of_emergency_in_galicia:0 "The State of Emergency in Galicia"
 AUH_the_state_of_emergency_in_galicia_desc:0 "After the murder of the viceroy: gendarmes in the villages, meetings prohibited, the eastern districts administered by decree. Every Ruthene deputation for a decade will begin by recalling it."

 AUH_the_conciliator_of_lemberg:0 "The Conciliator of Lemberg"
 AUH_the_conciliator_of_lemberg_desc:0 "Bobrzynski at the viceregal residence, a historian undoing what his own class has done in this province. Every concession must be wrung from men who call him a traitor."

 AUH_the_misery_of_galicia:0 "The Misery of Galicia"
 AUH_the_misery_of_galicia_desc:0 "A peasantry eating less than it needs on holdings too small to feed it, beside estates too large to be farmed. A million and a half leave for America between 1899 and 1913."

 AUH_the_polish_club_estranged:0 "The Polish Club Estranged"
 AUH_the_polish_club_estranged_desc:0 "The Ruthenes have their curia, and the Club has learned that the throne will legislate over its head. Seventy votes that arrived unbidden must now be bargained for one estimate at a time."

 AUH_a_polish_galicia:0 "A Polish Galicia"
 AUH_a_polish_galicia_desc:0 "One crownland from Cracow to the Zbruch, Polish in its courts, schools and university, the Ruthenes recognised as nothing. Three and a half million are told they are not a nation."

 AUH_the_emigrant_remittances:0 "The Emigrant Remittances"
 AUH_the_emigrant_remittances_desc:0 "Dollars from Pennsylvania and Chicago arriving in villages that never held cash, paying off the usurer and buying the neighbour's strip. A man can own land somewhere that is not here."

 AUH_the_galician_compromise:0 "The Galician Compromise"
 AUH_the_galician_compromise_desc:0 "National curiae, a fixed Ruthene bloc and a statutory share of the school estimates, signed in February 1914. Nothing in Galicia is now decided without two majorities, and both must be paid."

 AUH_the_rifle_associations:0 "The Rifle Associations"
 AUH_the_rifle_associations_desc:0 "The Strzelec drills in the open with the staff's connivance, because a Polish irregular force is worth two divisions on the day. Its officers have sworn to a country that does not exist."

 AUH_land_for_the_peasants:0 "Land for the Peasants"
 AUH_land_for_the_peasants_desc:0 "The land bank buys the great estates and resells them in holdings a family can live on. The szlachta that has delivered the Club's votes since 1867 has been dispossessed by its own government."

 AUH_the_polish_kingdom:0 "The Kingdom of Poland"
 AUH_the_polish_kingdom_desc:0 "Galicia raised to a Kingdom under the Habsburg crown, with its own ministry and a coronation at Cracow, on terms both nations have signed. Eleven million Poles outside it are reading about it."

 AUH_galicia_a_province:0 "Galicia, a Province"
 AUH_galicia_a_province_desc:0 "No diet, no viceroy, no school council, no Club: the crownland administered from Vienna, competently and at a profit. Nothing in it is now defended by anybody who lives there."

 AUH_the_austro_polish_solution:0 "The Austro-Polish Solution"
 AUH_the_austro_polish_solution_desc:0 "The Congress Kingdom joined to Galicia under the Habsburg crown, proposed at every Russian war scare and never once agreed with Berlin. A third partner when the Compromise falls due."

# --- The ideas of the Ruthenian column ------------------------------------------------------------

 AUH_the_ruthenian_question:0 "The Ruthenian Question"
 AUH_the_ruthenian_question_desc:0 "Three and a half million Greek Catholic peasants with a married village clergy and no middle class, governed in a language they do not use. The file has been opened at last."

 AUH_the_ruthenian_franchise:0 "The Ruthenian Franchise"
 AUH_the_ruthenian_franchise_desc:0 "Rolls revised under imperial supervision and the eastern curiae drawn to the people who live in them. The administration being overruled is the one that must carry it out."

 AUH_the_ruthenes_have_no_advocate:0 "The Ruthenes Have No Advocate"
 AUH_the_ruthenes_have_no_advocate_desc:0 "No seat that is not in another nation's gift, no office that will receive a petition, no minister whose business it is. It works for as long as nobody outside the Empire offers them anything."

 AUH_the_greek_catholic_church:0 "The Greek Catholic Church"
 AUH_the_greek_catholic_church_desc:0 "Sheptytsky at Lemberg, the one authority east of the San that both nations will hear. Nothing is done in the eastern districts against him, which means a good deal is done without asking Vienna."

 AUH_the_prosvita_societies:0 "The Prosvita Societies"
 AUH_the_prosvita_societies_desc:0 "Three thousand village reading rooms, half with a cooperative store attached, teaching a peasantry to read and to keep books in the same evening class. The state is not paying for any of it."

 AUH_the_russophile_villages:0 "The Russophile Villages"
 AUH_the_russophile_villages_desc:0 "The old clergy teach that there is one Russian people from the Carpathians eastwards, and their leaders are cheap to flatter. Their newspapers come out of the consulate at Lemberg."

 AUH_the_ukrainophile_orientation:0 "The Ukrainophile Orientation"
 AUH_the_ukrainophile_orientation_desc:0 "The schoolmasters have won: the language fixed, the histories written, a Ukrainian nation built in daylight in eastern Galicia. The Tsar has been told what we intend for his subjects."

 AUH_the_sich_associations:0 "The Sich Associations"
 AUH_the_sich_associations_desc:0 "Gymnastics, fire brigades and a great deal of marching, in villages where the only other institution is the parish church. We are not the only party able to ask these men."

 AUH_the_partition_of_galicia:0 "The Partition of Galicia"
 AUH_the_partition_of_galicia_desc:0 "The crownland divided at the San, each half with its diet and school council. The arrangement that bought seventy dependable votes since 1867 has ended in the same hour."

 AUH_the_duchy_of_halych:0 "The Duchy of Halych"
 AUH_the_duchy_of_halych_desc:0 "A crownland east of the San with a diet at Lemberg, a governor and a university, held of the Emperor under a title unused since 1772. It takes the oil out of Polish hands."

