 ##### CANADA - INTERWAR (1919-1932), ERA EXPANSION #####
 ##### Focus and idea strings for the 29 focuses added to common/national_focus/RON_Canada_INT.txt
 ##### and the 24 ideas defined in common/ideas/CAN_INT_expansion_ideas.txt.
 ##### No key here exists anywhere else in the loaded English localisation.

 ##### BRANCH 05 - THE WEST (economy) #####

 CAN_the_central_selling_agency:0 "The Central Selling Agency"
 CAN_the_central_selling_agency_desc:0 "Three provincial pools, one office in Winnipeg, and for the first time a grain grower who is not selling into the Exchange alone. The Agency advances a dollar a bushel on delivery and settles the rest when the crop is sold abroad."
 CAN_the_central_selling_agency_tt:0 "The three Prairie pools sell through a single office. §GTrade opinion and stability in the West improve.§! §RThe initial payment of a dollar a bushel is now a standing charge on the Treasury's credit.§!"

 CAN_back_the_pools:0 "Back the Pools"
 CAN_back_the_pools_desc:0 "The advance cannot be met. The three prairie governments guarantee the bank loans and Ottawa puts Mr McFarland in charge of the stocks, which is to say that the Dominion is now a speculator in wheat holding a crop nobody will buy."
 CAN_back_the_pools_tt:0 "The provinces guarantee the advances and the Dominion takes the wheat onto its own books. §GStability in the Prairies is preserved and the co-operative movement survives.§! §RThe Treasury carries the crop: a permanent drain on political power and on consumer goods, and the government cannot now let the price find its level.§!"

 CAN_let_the_market_clear:0 "Let the Market Clear"
 CAN_let_the_market_clear_desc:0 "No guarantee. The Agency fails, the pools are wound up, and the grower goes back to the Exchange with the price at whatever the buyer will offer. The saving to the Treasury is immediate and can be counted."
 CAN_let_the_market_clear_tt:0 "The guarantee is refused and the Central Selling Agency is wound up. §GThe Treasury is relieved at once.§! §RStability falls, the co-operative movement of the West is destroyed for the rest of the period, and the parties of protest gain ground month after month.§!"

 CAN_the_hudson_bay_line:0 "The Line to the Bay"
 CAN_the_hudson_bay_line_desc:0 "Six hundred miles of track across muskeg to a harbour on salt water at Churchill, and a grain route to Liverpool that owes nothing to the lake brokers or to the American roads. The West has demanded it for thirty years."
 CAN_the_hudson_bay_line_tt:0 "The Hudson Bay Railway is carried through to salt water. §GOne level of infrastructure is built, construction speeds up and the grain trade gains an outlet Ottawa controls.§! §RThe port is frozen for the greater part of the year and the marine insurance premium never comes down: a permanent charge on consumer goods.§!"

 ##### BRANCH 06 - INDUSTRY AND FINANCE (economy) #####

 CAN_an_inspector_general_of_banks:0 "An Inspector General of Banks"
 CAN_an_inspector_general_of_banks_desc:0 "The Home Bank closed its doors in August and ruined some tens of thousands of small depositors who had no notice and no remedy. The answer is an officer with the right to look at the books of every chartered bank in the Dominion."
 CAN_an_inspector_general_of_banks_tt:0 "Bank inspection is placed under a federal officer. §GEconomic decisions cost less and confidence in the chartered banks recovers.§! §RThe note issue and the rediscount stay with the banks: the want of a central bank is not cured here, only documented.§!\n§YBypassed§! if the Dominion has already provided itself with a central bank by another road."

 CAN_the_estimates_must_fall:0 "The Estimates Must Fall"
 CAN_the_estimates_must_fall_desc:0 "Revenue has halved and the vote for Air Services falls from seven millions to one and three quarters. A fifth of the Air Force is dismissed by letter, the naval college is a memory, and the Permanent Force is asked to find further economies."
 CAN_the_estimates_must_fall_tt:0 "The defence estimates are cut to the bone. §GA large sum in political power is freed and the country is spared the tax.§! §RExperience gain in all three services collapses, arms production slows by nearly a third, and nothing in this era lifts the cut.§!"

 CAN_guns_before_relief:0 "Guns Before Relief"
 CAN_guns_before_relief_desc:0 "The Chief of the General Staff has said in writing that a country which disarms in a depression will rearm in a panic. The government agrees with him: the estimates hold, the squadrons stay, and the men on the road are told there is no camp for them."
 CAN_guns_before_relief_tt:0 "The services are protected from the cut. §GArms production and air training are maintained through the worst of the depression.§! §RStability falls hard, consumer goods rise, and the unemployed drift to the parties of the left month after month: the government has chosen the estimates over the relief camps in front of the whole country.§!"

 ##### BRANCH 07 - ARMY #####

 CAN_bring_the_boys_home:0 "Bring the Boys Home"
 CAN_bring_the_boys_home_desc:0 "Two hundred and sixty thousand men to be carried across the Atlantic, sorted, paid and discharged, and a riot at Kinmel Park among those who were told to wait."
 CAN_bring_the_boys_home_tt:0 "The Canadian Expeditionary Force is demobilised. §GThe Treasury is relieved and the returning men carry the democratic vote.§! §RWar support falls: the Dominion has had its war, and will not be asked for another soon.§!"
 CAN_the_otter_committee:0 "The Otter Committee"
 CAN_the_otter_committee_desc:0 "Sir William Otter's committee perpetuates the battalions of the Expeditionary Force in the Non-Permanent Active Militia. Every county keeps its regiment, its colours and its battle honours."
 CAN_the_otter_committee_tt:0 "The wartime order of battle is perpetuated in the militia. §GRecruitable population rises and the regiments hold the country's affection.§! §RTraining takes a quarter longer and army experience is hard to come by: the establishment is a list of names, and no professional Permanent Force can now be built out of it.§!"

 CAN_an_establishment_we_can_pay_for:0 "An Establishment We Can Pay For"
 CAN_an_establishment_we_can_pay_for_desc:0 "The regiments that cannot be filled are struck off, and what is left is paid, housed, equipped and trained as a profession. It is the only honest reading of the estimates."
 CAN_an_establishment_we_can_pay_for_tt:0 "The paper establishment is cut and the Permanent Force is made real. §GArmy experience rises, divisions train faster and military advisers cost less.§! §RStability falls and recruitable population with it: the militia interest is lost for good, and with it the county regiments and their lobby.§!"

 CAN_in_aid_of_the_civil_power:0 "In Aid of the Civil Power"
 CAN_in_aid_of_the_civil_power_desc:0 "Winnipeg has been shut for six weeks and the mayor has requisitioned troops under the Militia Act. On the twenty-first of June the mounted men clear Main Street, two men are dead and the strike committee is in custody."
 CAN_in_aid_of_the_civil_power_tt:0 "The militia is used against a general strike. §GA large gain in political power: the authority of the government is not in doubt again this decade.§! §RStability falls, the Permanent Force spends its year on riot duty instead of in the field, communist support drifts upward, and one more line is written in the ledger of civil liberties.§!"

 CAN_barracks_not_streets:0 "Barracks, Not Streets"
 CAN_barracks_not_streets_desc:0 "The General Staff declines the work. If the Dominion wants a force to police its own cities it may raise one, and it does: the Dominion Police and the Mounted Police are merged into a single federal constabulary answerable to the Solicitor General."
 CAN_barracks_not_streets_tt:0 "Internal security passes to a federal constabulary. §GForeign subversion is checked hard.§! §RThe new force is paid for out of the same vote: consumer goods rise, army experience falls, and the militia will never again be the instrument of the government at home.§!"
 CAN_a_rifle_of_our_own:0 "A Rifle of Our Own"
 CAN_a_rifle_of_our_own_desc:0 "The Ross plant at Quebec was expropriated in 1917 and it is still there. Keep it, keep Lindsay, and let the Dominion make its own rifle and its own cartridge to its own pattern."
 CAN_a_rifle_of_our_own_tt:0 "Small arms and ammunition are made in Canada to a Canadian pattern. §GArms factories build faster and the Dominion is not at the mercy of British order books.§! §RThe pattern is not the imperial one: foreign licences cost a quarter more, consumer goods rise, and no British surplus will fit our chambers.§!"

 CAN_the_lee_enfield_pattern:0 "The Lee-Enfield Pattern"
 CAN_the_lee_enfield_pattern_desc:0 "Adopt the imperial rifle, buy from Enfield and Birmingham, and close the question. It is cheap, it is sound, and it is what was done: between the armistice and the next war this country did not manufacture a single service rifle."
 CAN_the_lee_enfield_pattern_tt:0 "The imperial pattern is adopted and small arms are bought abroad. §GLicences cost a quarter less and the Treasury is spared an arsenal.§! §RThe small-arms industry of the Dominion is closed: arms factories build a quarter slower, and it cannot be reopened before a war compels it.§!"

 CAN_a_staff_course_of_our_own:0 "A Staff Course of Our Own"
 CAN_a_staff_course_of_our_own_desc:0 "The Militia Staff Course is enlarged at Kingston and Canadian officers are taught to plan for a Canadian army: our distances, our winter, our railways, our politics."
 CAN_a_staff_course_of_our_own_tt:0 "Staff officers are trained in Canada for Canadian conditions. §GPlanning improves and military advisers cost less.§! §RBritish licences cost a fifth more and the course is paid for out of the estimates: the free doctrine of the War Office is no longer ours to take.§!"
 CAN_officers_at_camberley:0 "Officers at Camberley"
 CAN_officers_at_camberley_desc:0 "The promising men go to Camberley and Quetta, learn the trade from the best staff college in the world, and come home thinking in the terms of the War Office."
 CAN_officers_at_camberley_tt:0 "Canadian officers are trained at the imperial staff colleges. §GBritish licences cost less and the imperial doctrine is ours to read.§! §RThe Dominion has no staff thinking of its own: formations hold together less well, and a Canadian doctrine cannot now be founded in this era.§!"
 CAN_defence_scheme_no_one:0 "Defence Scheme No. 1"
 CAN_defence_scheme_no_one_desc:0 "Colonel Brown of the Directorate of Military Operations has driven the border roads himself and written the plan: flying columns into New York State, Minnesota and Washington on the first day, to buy the weeks the Royal Navy will need."
 CAN_defence_scheme_no_one_tt:0 "A contingency plan against the United States is drawn up and locked away. §GThe country's own defence is planned in earnest for the first time and the staff gains real experience.§! §RThe plan is a standing embarrassment: opinion abroad is harder to gain, stability suffers, and the staff has no other war on its desk.§!\n§YBypassed§! if the Dominion is already in a faction with the United States."

 CAN_burn_the_scheme:0 "Burn the Scheme"
 CAN_burn_the_scheme_desc:0 "The new Chief of the General Staff reads the file, observes that a plan which cannot be shown to a minister is not a plan, and orders every copy destroyed. The Dominion stops preparing, on paper, to invade the only country that can reach it."
 CAN_burn_the_scheme_tt:0 "Defence Scheme No. 1 is destroyed. §GStanding abroad recovers and the embarrassment is ended.§! §RThe planning work of ten years is burned with it, and the General Staff has nothing in hand.§!\n§YBypassed§! if the scheme is not in the safe."
 ##### BRANCH 08 - AIR FORCE #####

 CAN_flown_by_the_service:0 "Flown by the Service"
 CAN_flown_by_the_service_desc:0 "Forest patrol, photographic survey, fishery watch and the preventive flights over the lakes will be flown by officers and airmen of the Air Force, in uniform, on the Dominion's machines."
 CAN_flown_by_the_service_tt:0 "The government's civil flying stays in the hands of the Air Force. §GAir experience accumulates in spite of everything and aerodromes go up quickly.§! §RAir doctrine costs a fifth more and the machines cost consumer goods: nobody in the Service is paid to think about war flying.§!"

 CAN_the_operating_companies:0 "The Operating Companies"
 CAN_the_operating_companies_desc:0 "Put the work out to tender. The bush operators fly it cheaper, they fly it in weather the Service will not, and the Churchill lift proved they can move a railway survey by air in the middle of winter."
 CAN_the_operating_companies_tt:0 "The Dominion's civil flying is contracted to the bush companies. §GA commercial aviation industry grows up: greater range, and a pool of trained civil pilots the country will need one day.§! §RThe Air Force loses its flying hours and its argument before the Treasury: air experience falls, and the estimates will find it.§!"

 CAN_the_hudson_strait_expedition:0 "The Hudson Strait Expedition"
 CAN_the_hudson_strait_expedition_desc:0 "Three bases on the Strait, a year of ice reconnaissance in open cockpits at forty below, and one question to answer: how many weeks a year can a grain ship get through."
 CAN_the_hudson_strait_expedition_tt:0 "A year of ice reconnaissance is flown from three bases on Hudson Strait. §GAir experience and standing at Ottawa both rise, and the northern route is charted.§! §RThe expedition is paid for out of a small vote, and the answer it brings back shortens the shipping season nobody wanted shortened.§!\n§GIf the line to the Bay has been carried through, the survey makes the route insurable: further stability and political power.§!"

 CAN_the_light_aeroplane_clubs:0 "The Light Aeroplane Clubs"
 CAN_the_light_aeroplane_clubs_desc:0 "Two machines and a modest grant to every approved flying club in the Dominion, on the theory that a country which cannot afford an air force can at least afford to let its young men learn to fly on Saturdays."
 CAN_the_light_aeroplane_clubs_tt:0 "Federal grants are made to the approved flying clubs. §GPilots train faster and fly more safely, and a reserve of airmen accumulates in civil life.§! §RIt buys no squadrons, no machines and no doctrine: the country is training aircrew for a war it has not begun to plan.§!"

 ##### BRANCH 09 - NAVY #####

 CAN_the_jellicoe_report:0 "The Jellicoe Report"
 CAN_the_jellicoe_report_desc:0 "Lord Jellicoe has toured the Dominion in a British cruiser and left a costed paper on the Prime Minister's desk: what a Canadian navy would consist of, what it would cost, and what the alternative is. Nobody disputes the arithmetic."
 CAN_the_jellicoe_report_tt:0 "The Admiral's estimate for a Canadian navy is laid before the cabinet. §GThe Naval Service gains experience and a case it can argue.§! §RThe figure is now public, and every naval estimate for the next twenty years will be measured against it.§!"

 CAN_a_squadron_for_the_dominion:0 "A Squadron for the Dominion"
 CAN_a_squadron_for_the_dominion_desc:0 "Take the smallest of the Admiral's three options: a cruiser, a flotilla of destroyers, and yards at Halifax and on the St Lawrence that learn to build them. It is a fleet unit of our own, seven years after the country refused one."
 CAN_a_squadron_for_the_dominion_tt:0 "A squadron is laid down and Canadian yards are set to build it. §GDockyard capacity and naval experience rise, and the Dominion at last has ships designed for its own waters.§! §RThe cost falls on consumer goods and on the government's standing: this is the fleet unit the country twice refused, and it is not cheap now either.§!"

 CAN_the_cheapest_navy_in_the_empire:0 "The Cheapest Navy in the Empire"
 CAN_the_cheapest_navy_in_the_empire_desc:0 "Refuse the estimate and take what the Admiralty is giving away: a light cruiser, two destroyers and a pair of submarines, all of them second-hand, all of them wearing out. It is a navy in the sense that the ships float and the flag is ours."
 CAN_the_cheapest_navy_in_the_empire_tt:0 "The Dominion takes the Admiralty's cast-off hulls instead of building. §GA large saving at once and a fleet on the cheap.§! §RDockyard capacity falls by a quarter, naval experience with it, naval doctrine costs a quarter more, and no ship of Canadian design is laid down in this era.§!"

 CAN_pay_off_the_aurora:0 "Pay Off the Aurora"
 CAN_pay_off_the_aurora_desc:0 "The estimate is cut to a figure that will keep two destroyers and a depot."
 CAN_pay_off_the_aurora_tt:0 "The Naval Service is cut to two destroyers and a depot. §GA large saving, and the estimate ceases to be a political target.§! §RSets §YA Paper Navy§!: dockyard capacity and naval experience both fall, and the officers this country will need in 1939 are not being trained now.§!\n§YBypassed§! if the Service has already been reduced to a paper navy."

 CAN_keep_the_naval_college:0 "Keep the Naval College"
 CAN_keep_the_naval_college_desc:0 "The ships can go. The college cannot: it is the only place in the Dominion where a Canadian is taught navigation, gunnery and the handling of a ship of war, and it takes fifteen years to replace a class of cadets."
 CAN_keep_the_naval_college_tt:0 "The Royal Naval College of Canada is kept open. §GSets §YA Corps of Our Own Officers§!: naval experience accumulates steadily and the Service has a body of trained officers when it is next needed.§! §RIt is paid for in political power and consumer goods every session, and it buys not one ship.§!"

 CAN_the_preventive_service:0 "The Preventive Service"
 CAN_the_preventive_service_desc:0 "Prohibition across the line has turned the Gulf and the lakes into a trade route, and chasing it is the only operational work the Dominion's seagoing services have."
 CAN_the_preventive_service_tt:0 "Armed cutters are put to work against the liquor traffic. §GSeamanship and detection improve, escort work becomes competent, and the duties collected are real money.§! §RThe department that runs the trade is corrupted by it: stability falls, and the Customs inquiry is coming.§!"

 CAN_a_fleet_is_a_foreign_policy:0 "A Fleet Is a Foreign Policy"
 CAN_a_fleet_is_a_foreign_policy_desc:0 "Two destroyers are sent to the coast of Salvador to stand off a rising and take British subjects out if it comes to that."
 CAN_a_fleet_is_a_foreign_policy_tt:0 "Canadian warships are employed on a mission of the Dominion's own choosing. §GNaval experience and standing abroad both rise: a legation with a ship behind it is heard differently.§! §RShips kept in commission for policy are ships kept in commission: a permanent charge on consumer goods, and there are only two of them.§!"

 ##### IDEAS #####

 CAN_idea_the_central_selling_agency:0 "The Central Selling Agency"
 CAN_idea_the_central_selling_agency_desc:0 "One office in Winnipeg selling the crop of three provinces, and an initial payment advanced on delivery. It works while the world price is above the advance."

 CAN_idea_the_treasury_owns_the_wheat:0 "The Treasury Owns the Wheat"
 CAN_idea_the_treasury_owns_the_wheat_desc:0 "The guarantee was given, the advance was honoured, and the Dominion now holds a crop it cannot sell at a price it fixed itself. It is the cheapest peace the West was ever bought."

 CAN_idea_the_market_cleared:0 "The Market Cleared"
 CAN_idea_the_market_cleared_desc:0 "The pools are wound up and the grower faces the Exchange alone. The books balance. Everything west of the Lakehead has stopped voting the way it used to."

 CAN_idea_the_bay_route:0 "The Bay Route"
 CAN_idea_the_bay_route_desc:0 "Grain to Liverpool by Churchill, owing nothing to the lake brokers. Ten weeks of open water, and an insurance premium that pays for the difference twice over."

 CAN_idea_an_inspector_general_of_banks:0 "An Inspector General of Banks"
 CAN_idea_an_inspector_general_of_banks_desc:0 "One federal officer with the right to read the books of every chartered bank. It would have saved the Home Bank's depositors. It is not a central bank, and it does not pretend to be."

 CAN_idea_austerity_defence:0 "Austerity Defence"
 CAN_idea_austerity_defence_desc:0 "The vote for Air Services falls from seven millions to one and three quarters, a fifth of the airmen are dismissed by letter, and the two remaining destroyers are told to economise on fuel. Nothing in the estimates of this decade will put it back."

 CAN_idea_guns_before_relief:0 "Guns Before Relief"
 CAN_idea_guns_before_relief_desc:0 "The squadrons are kept and the camps are not opened. The Chief of the General Staff has his air force. The country outside the gate can see exactly what was chosen and what was not."

 CAN_idea_an_order_of_battle_on_paper:0 "An Order of Battle on Paper"
 CAN_idea_an_order_of_battle_on_paper_desc:0 "Every battalion of the Expeditionary Force is perpetuated in a county regiment with colours, honours and a drill hall. The mobilisation table shows an army. The armoury shows two hundred men and the equipment of 1918."

 CAN_idea_an_establishment_we_can_pay_for:0 "An Establishment We Can Pay For"
 CAN_idea_an_establishment_we_can_pay_for_desc:0 "A small Permanent Force that is actually paid, housed, equipped and trained, bought by striking off the regiments that were never going to be filled. A hundred county towns have not forgiven it."

 CAN_idea_the_army_in_the_streets:0 "The Army in the Streets"
 CAN_idea_the_army_in_the_streets_desc:0 "Main Street was cleared by mounted men and the strike committee went to the cells. The government's authority is not in question. Neither is the trade unions' opinion of the government."

 CAN_idea_a_federal_constabulary:0 "A Federal Constabulary"
 CAN_idea_a_federal_constabulary_desc:0 "The Dominion Police and the Mounted Police are one force, answerable to Ottawa, with a security branch and a file on everybody. The soldiers stay in barracks, and so does their share of the vote."

 CAN_idea_a_rifle_of_our_own:0 "A Rifle of Our Own"
 CAN_idea_a_rifle_of_our_own_desc:0 "Quebec and Lindsay making a Canadian rifle and a Canadian cartridge. The country will never again wait on a British order book, and no British surplus will ever fit its chambers."

 CAN_idea_the_lee_enfield_pattern:0 "The Lee-Enfield Pattern"
 CAN_idea_the_lee_enfield_pattern_desc:0 "The imperial rifle, bought abroad, sound and cheap. Between the armistice and the next war this country manufactured no service rifle at all, and had no plant that could begin."

 CAN_idea_a_staff_course_of_our_own:0 "A Staff Course of Our Own"
 CAN_idea_a_staff_course_of_our_own_desc:0 "A dozen officers a year taught to plan for Canadian distances, Canadian winter and Canadian politics. No board in London recognises the certificate, and no manual arrives free in the post any more."

 CAN_idea_officers_at_camberley:0 "Officers at Camberley"
 CAN_idea_officers_at_camberley_desc:0 "The best men trained at the best staff college in the world, and returned home thinking in the terms of the War Office. Doctrine, schools and mobilisation tables arrive by the same post and cost nothing at all."

 CAN_idea_the_plan_in_the_safe:0 "The Plan in the Safe"
 CAN_idea_the_plan_in_the_safe_desc:0 "Flying columns into New York State, Minnesota and Washington on the first day, to buy the weeks the Royal Navy will need. No minister has approved it. No minister has been asked."

 CAN_idea_flown_by_the_service:0 "Flown by the Service"
 CAN_idea_flown_by_the_service_desc:0 "Fire patrol, photographic survey and preventive flights, all flown in uniform. The Air Force has hours, aerodromes and a defensible estimate, and it is the flying branch of the Department of Public Works."

 CAN_idea_the_operating_companies:0 "The Operating Companies"
 CAN_idea_the_operating_companies_desc:0 "The bush firms fly the Dominion's work cheaper and in worse weather. The country will soon carry more air freight than the rest of the world together, and its air force will have nothing to do."

 CAN_idea_the_light_aeroplane_clubs:0 "The Light Aeroplane Clubs"
 CAN_idea_the_light_aeroplane_clubs_desc:0 "Two machines and a grant to every approved club. The cheapest line in the estimates, and in 1940 it will be running the elementary flying schools of an empire."

 CAN_idea_a_squadron_for_the_dominion:0 "A Squadron for the Dominion"
 CAN_idea_a_squadron_for_the_dominion_desc:0 "A cruiser, a flotilla, and yards at Halifax and on the St Lawrence learning to build them. The fleet unit this country twice refused, taken up at last and paid for out of the consumer's pocket."

 CAN_idea_the_cheapest_navy_in_the_empire:0 "The Cheapest Navy in the Empire"
 CAN_idea_the_cheapest_navy_in_the_empire_desc:0 "Second-hand hulls given away by an Admiralty that had no further use for them. The ships float and the flag is ours. Nothing in the fleet was designed here, and nothing will be."

 CAN_idea_a_corps_of_our_own_officers:0 "A Corps of Our Own Officers"
 CAN_idea_a_corps_of_our_own_officers_desc:0 "The Royal Naval College of Canada, kept open against the estimates. It costs a line in the vote every session and it buys no ship. It takes fifteen years to replace a class of cadets."

 CAN_idea_the_preventive_service:0 "The Preventive Service"
 CAN_idea_the_preventive_service_desc:0 "Armed cutters against the liquor traffic: seamanship, boarding and night navigation learned on the taxpayer's business. The department that runs the trade is being corrupted by it."

 CAN_idea_a_fleet_is_a_foreign_policy:0 "A Fleet Is a Foreign Policy"
 CAN_idea_a_fleet_is_a_foreign_policy_desc:0 "Warships sent where the Dominion, and not the Admiralty, decides they should go. A legation with a ship behind it is heard differently. There are two of them."
