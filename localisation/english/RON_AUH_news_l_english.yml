 auh_news.1.t:0 "[GetAUHNewsTitle]"
 auh_news.1.d:0 "[GetAUHNewsBody]"
 auh_news.1.a:0 "Into the morning edition."
 auh_news.2.t:0 "[GetAUHNewsTitle]"
 auh_news.2.d:0 "[GetAUHNewsBody]"
 auh_news.2.a:0 "The wires carry it."
 auh_news.3.t:0 "[GetAUHNewsTitle]"
 auh_news.3.d:0 "[GetAUHNewsBody]"
 auh_news.3.a:0 "The world reads it."
 auh_news.h.t:0 "Press Desk"
 auh_news.h.d:0 "Copy sent up to the papers."

 AUH_news_901_t:0 "Bosnia and Herzegovina Annexed"
 AUH_news_901_d:0 "By imperial rescript the occupation of 1878 becomes possession, and the garrisons of the Sandjak of Novi Pazar come out the same week. Two million subjects are added who sit in neither the Reichsrat nor the Chamber at Budapest. Belgrade demands compensation."

 AUH_news_902_t:0 "State of Siege at Sarajevo"
 AUH_news_902_d:0 "Two days of rioting follow the murder of the Archduke. Shops, schools and the offices of Srpska rijec are wrecked and two Serbs are killed. Governor Potiorek proclaims the state of siege on the evening of the 29th and extends it to the whole province."

 AUH_news_903_t:0 "The Old Emperor Goes to the Capuchin Crypt"
 AUH_news_903_d:0 "Sixty-eight years of reign closed at Schoenbrunn on the twenty-first. The cortege crosses Vienna to the Kapuzinergruft, the heir walking behind with the Empress Zita and the child Otto. Kings attend. The front is not quiet for an hour."

 AUH_news_904_t:0 "Crowned in the Matthias Church"
 AUH_news_904_d:0 "Prince-Primate Csernoch and Minister-President Tisza set the crown of Saint Stephen together. The King is girded with the sword and swears publicly on the Hungarian constitution; Zita is crowned Queen. Six weeks after the death, the dualism is sealed."

 AUH_news_905_t:0 "Four and a Half Million Men Vote"
 AUH_news_905_d:0 "The Reichsrat is returned on the fourteenth and the twenty-third of May: 5,526,203 on the rolls, 4,676,350 voting, 84.62 per cent. Five hundred and sixteen seats replace four hundred and twenty-five, and the Christian Socials come first with ninety-five."

 AUH_news_906_t:0 "Hungarian in Every Primary School"
 AUH_news_906_d:0 "Laws XXVI and XXVII are sanctioned on the second of June. Every child must command Hungarian by the end of the fourth year, confessional schools included; the State pays the teachers and closes what does not comply. Croatia-Slavonia is exempt."

 AUH_news_907_t:0 "The Belgrade Papers Were Forged"
 AUH_news_907_d:0 "Fifty-three Serbs of Croatia were tried at Zagreb and thirty-one convicted after a hundred and fifty days of hearings. In Vienna, Masaryk shows the documents were forged in our own legation at Belgrade. Friedjung withdraws his charges and offers no apology."

 AUH_news_908_t:0 "Colonel Redl Found Dead at the Klomser"
 AUH_news_908_d:0 "Money left unclaimed at a Vienna post office undid him. Four officers called in the night and left him a pistol. The former chief of the intelligence bureau had sold to Petersburg for years, deployment papers among them. The army wanted it quiet; Prague printed it."

 AUH_news_909_t:0 "The Minister-President Shot at Lunch"
 AUH_news_909_d:0 "Friedrich Adler fires three times at Karl Graf Sturgkh in the dining room of the Meissl und Schadn. He holds him answerable for the war and for two years of rule by the fourteenth paragraph, the Reichsrat being shut since March 1914."

 AUH_news_910_t:0 "Red Flag Over the Bay of Cattaro"
 AUH_news_910_d:0 "At noon the crew of the Sankt Georg arrest their officers and fire a gun for the signal; some forty ships and six thousand men follow. Battleships from Pola end it in three days. Four are shot on the eleventh of February, Frantisek Rasch among them."

 AUH_news_911_t:0 "Paris Prints the Emperor's Letter"
 AUH_news_911_d:0 "Clemenceau publishes what Charles wrote to Poincare in March 1917 through Prince Sixtus of Bourbon-Parma: that he would support the just French claims to Alsace-Lorraine. Vienna denies it, then admits it. Czernin resigns on the fourteenth."

 AUH_news_912_t:0 "To My Faithful Austrian Peoples"
 AUH_news_912_d:0 "Signed on the sixteenth, out on the seventeenth in a special number of the Wiener Zeitung: Austria is to become a federal state, each nationality its own body politic. Hungary is left out; Wekerle threatened the grain. Washington answers next day."

 AUH_news_fallback_t:0 "From the Ballhausplatz"
 AUH_news_fallback_d:0 "The common ministries confirm the report and add nothing to it. The provincial press will have the particulars by the end of the week."
