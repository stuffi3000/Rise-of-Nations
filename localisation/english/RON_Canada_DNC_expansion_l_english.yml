# ######################################################################################
# RON_Canada_DNC_expansion - localisation of the DNC-era expansion (1900-1909)
# 39 focus names, 39 descriptions, 14 tooltips, 25 national ideas.
# Every key here was checked absent from the loaded English localisation before writing.
# ######################################################################################

 ##### BRANCH 01 - IMPERIAL AUTONOMY #####

 CAN_a_dominion_not_a_colony:0 "A Dominion, Not a Colony"
 CAN_a_dominion_not_a_colony_desc:0 "The Colonial Conference opened at London on the fifteenth of April and will rise having renamed itself."
 CAN_a_dominion_not_a_colony_tt:0 "Canada is styled a §YDominion§! and the conferences become quadrennial. §GPolitical power and standing are gained.§! §RNo permanent imperial secretariat is created, and the Dominion still has no foreign office of its own.§!"

 CAN_the_boundary_waters_treaty:0 "The Boundary Waters Treaty"
 CAN_the_boundary_waters_treaty_desc:0 "Mr Gibbons has negotiated it, and Mr Bryce, His Majesty's Ambassador at Washington, will sign it, because a Dominion cannot sign."
 CAN_the_all_red_route:0 "The All-Red Route"
 CAN_the_all_red_route_desc:0 "The Pacific cable has been in service since 1902 and touches no foreign soil between Vancouver and Australia."

 ##### BRANCH 02 - THE INTERIOR #####

 CAN_the_civil_service_commission:0 "The Civil Service Commission"
 CAN_the_civil_service_commission_desc:0 "The Civil Service Amendment Act sets up a Commission and puts the inside service at Ottawa to open examination. Mr Borden demanded it from the Halifax Platform and the Government has conceded rather more than half of it. Competence will improve."
 CAN_the_patronage_lists:0 "The Patronage Lists"
 CAN_the_patronage_lists_desc:0 "Every appointment in the inside service, every timber berth, every mile of contract goes out on the recommendation of the member for the county, and the lists are kept in the Minister's own hand."

 ##### BRANCH 04 - THE INSURGENCIES #####

 CAN_the_militia_at_glace_bay:0 "The Militia at Glace Bay"
 CAN_the_militia_at_glace_bay_desc:0 "Three thousand men walked from Glace Bay to Dominion on the thirty-first of July and the county sheriff has called for troops in aid of the civil power."
 CAN_no_soldiers_against_miners:0 "No Soldiers Against Miners"
 CAN_no_soldiers_against_miners_desc:0 "The aid to the civil power written into the Militia Act was meant for riot and invasion, and members have said so in the House every time it has been used against men on strike. Ottawa refuses the sheriff."

 ##### BRANCH 06 - INDUSTRY AND FINANCE #####

 CAN_advance_the_dominion_notes:0 "Advance the Dominion Notes"
 CAN_advance_the_dominion_notes_desc:0 "New York has locked up the call loans and the crop is in the field."
 CAN_let_the_weak_banks_fail:0 "Let the Weak Banks Fail"
 CAN_let_the_weak_banks_fail_desc:0 "The Government advances nothing. The Sovereign goes down, and four smaller houses with it, and the branch system carries the rest without a general suspension. The crop of 1907 is moved late and cheap and the West will not forget the price it took."

 ##### BRANCH 07 - ARMY #####

 CAN_the_services_that_make_an_army:0 "The Services That Make an Army"
 CAN_the_services_that_make_an_army_desc:0 "The Act of 1904 did not merely abolish a British general. It authorised engineers, signallers, an army medical corps, a pay branch, an ordnance and a service corps, and an officers' training corps to feed them."
 CAN_the_militia_staff_course:0 "The Militia Staff Course"
 CAN_the_militia_staff_course_desc:0 "A staff course of our own, and Canadian places at the British schools. Sir William Otter is the first Chief of the General Staff born in this country."
 CAN_take_over_the_imperial_fortresses:0 "The Imperial Fortresses"
 CAN_take_over_the_imperial_fortresses_desc:0 "The Admiralty is withdrawing its squadrons from the North Atlantic and the Pacific, and the last imperial garrisons leave this country on the first of July."
 CAN_concentrate_the_force_at_petawawa:0 "Petawawa"
 CAN_concentrate_the_force_at_petawawa_desc:0 "Two squadrons of Dragoons, two batteries of horse artillery, a heavy battery, a company of engineers, eight companies of the Royal Canadian Regiment, with medical, service and ordnance detachments."
 CAN_concentrate_the_force_at_petawawa_tt:0 "The whole §YPermanent Force§! is concentrated in one camp for the first time. §GThe camp adds a building slot in Ontario and land doctrine research is advanced.§! §RThe season's pay and transport come out of the same estimate.§!"
 CAN_adopt_the_ross_rifle:0 "Adopt the Ross Rifle"
 CAN_adopt_the_ross_rifle_desc:0 "Sir Charles Ross will build his rifle at Quebec, and the Dominion will own the plant, the pattern and the cartridge that goes with it. It shoots beautifully on the range at Bisley."
 CAN_adopt_the_ross_rifle_tt:0 "The §YRoss rifle§! is adopted and the Quebec plant is ours. §GA small-arms industry of our own, and a building slot at Quebec.§! §RThe rifle fouls in mud: the fault is recorded against the country and will be presented again in trench warfare.§!"
 CAN_order_the_lee_enfield:0 "Order the Lee-Enfield"
 CAN_order_the_lee_enfield_desc:0 "Australia and South Africa order from Enfield and are content. So shall we. The rifle works, the ammunition is interchangeable with every British force in the world, and no Canadian workman will make either."
 CAN_the_cartridge_factory_at_quebec:0 "The Cartridge Factory at Quebec"
 CAN_the_cartridge_factory_at_quebec_desc:0 "Whatever rifle is chosen, the cartridge for it must be made here. The Dominion Arsenal at Quebec is enlarged to the new calibre and to a rate of issue that will support the whole militia in the field, which it has never yet been asked to do."
 CAN_the_cartridge_factory_at_quebec_tt:0 "The §YDominion Arsenal§! at Quebec is enlarged to the service calibre. §GA military factory is built at Quebec and army experience is gained.§! Bypassed if the Dominion already keeps more than six military factories."
 CAN_a_nation_of_marksmen:0 "A Nation of Marksmen"
 CAN_a_nation_of_marksmen_desc:0 "The member for Victoria North says this country needs no professional soldiers, only men who can shoot, and the Rifle Associations agree with him. Free ammunition to every recognised club, camps multiplied, the Permanent Force starved and derided."
 CAN_a_permanent_force_worth_the_name:0 "A Permanent Force Worth the Name"
 CAN_a_permanent_force_worth_the_name_desc:0 "General Otter's argument carried to its conclusion: some thousands of regular soldiers, quartered, instructed and paid the whole year round, to teach the militia and to be ready before it is."
 CAN_the_strathcona_trust:0 "The Strathcona Trust"
 CAN_the_strathcona_trust_desc:0 "Lord Strathcona settles half a million dollars upon the physical and military training of schoolchildren, and the cadet corps enter the schools with it. In fifteen years it will furnish the country with recruits who already know their drill."

 ##### BRANCH 08 - AIR FORCE #####

 CAN_the_aerial_experiment_association:0 "The Aerial Experiment Association"
 CAN_the_aerial_experiment_association_desc:0 "Founded at Baddeck on the thirtieth of September by Doctor Bell, with Mr Baldwin, Mr McCurdy, Mr Curtiss of Hammondsport and Lieutenant Selfridge of the United States Army, upon twenty thousand dollars advanced by Mrs Bell."
 CAN_the_aerial_experiment_association_tt:0 "An officer of the Militia Council is sent to §YBaddeck§! to observe. §GA little air experience.§! §RThe Dominion pays nothing and therefore owns nothing: no aircraft, no patent and no establishment.§!"
 CAN_the_tetrahedral_kites:0 "The Tetrahedral Kites"
 CAN_the_tetrahedral_kites_desc:0 "Doctor Bell's cells of silk and spruce, towed behind a steamer on the Bras d'Or. The Cygnet lifted Lieutenant Selfridge some one hundred and sixty feet above the lake in December and set him down again in the water. No aeroplane will come of it."
 CAN_the_tetrahedral_kites_tt:0 "The §Ykite experiments§! are pursued for artillery observation. §GAir experience is gained.§! §RNo flying machine results, and the Militia Council votes no money.§!"
 CAN_the_silver_dart:0 "The Silver Dart"
 CAN_the_silver_dart_desc:0 "On the twenty-third of February, from the ice of Baddeck Bay, Mr McCurdy flew the Silver Dart half a mile before a crowd of villagers. It is the first powered flight in Canada and the first anywhere in the British Empire."
 CAN_the_silver_dart_tt:0 "The first powered flight in the §YBritish Empire§! is made at Baddeck. §GAir experience is gained and the Dominion is in every newspaper in the world.§! §RNot one military aeroplane follows from it.§!"
 CAN_the_canadian_aerodrome_company:0 "The Canadian Aerodrome Company"
 CAN_the_canadian_aerodrome_company_desc:0 "The Association dissolves on the thirty-first of March and Baldwin and McCurdy at once form a company at Baddeck to build machines - the first aircraft works in the country."
 CAN_the_canadian_aerodrome_company_tt:0 "The first §Yaircraft works in Canada§! is established at Baddeck. §GA building slot in Nova Scotia and air experience.§! §RThe company has one possible customer, and the Dominion has not agreed to be it.§!"
 CAN_the_petawawa_trials:0 "The Trials at Petawawa"
 CAN_the_petawawa_trials_desc:0 "The machines are taken to the camp in August and shown to the Militia Council. The Silver Dart makes four flights and turns over in the sand on the second; Baddeck No. 1 breaks up in its turn."
 CAN_the_petawawa_trials_tt:0 "The machines are demonstrated to the §YMilitia Council§! at Petawawa. §GAir experience is gained from the trials.§! §RBoth machines are wrecked and the Council signs nothing; the cost falls on the Dominion.§!"
 CAN_a_militia_aviation_branch:0 "An Aviation Branch for the Militia"
 CAN_a_militia_aviation_branch_desc:0 "Baldwin and McCurdy asked the Council for a contract after the trials, and a minority of officers spoke for them. Suppose Ottawa signs: a shed at Petawawa, a handful of machines, a few men taught to fly and to mend them."
 CAN_no_use_for_the_aeroplane:0 "No Military Use for the Aeroplane"
 CAN_no_use_for_the_aeroplane_desc:0 "The Council reports that the aeroplane has no military application, the contract is refused, and the Canadian Aerodrome Company closes its doors within the year. The saving is real and the vote is spent on rifles instead."
 CAN_the_flying_canadians:0 "The Men Who Will Fly in 1914"
 CAN_the_flying_canadians_desc:0 "What the decade actually leaves behind is men. With no school and no contract at home, those who wish to fly pay for their own tuition at Hammondsport and afterwards in England."
 CAN_the_flying_canadians_tt:0 "A generation of Canadians learns to fly §Yat its own expense§!. §GAir experience and standing are gained, and the country is recorded as possessing trained airmen for the eras that follow.§! §RThey are trained abroad and will serve under another flag; the Dominion has no squadron to put them in.§!"

 ##### BRANCH 09 - NAVY #####

 CAN_the_fisheries_protection_service:0 "The Fisheries Protection Service"
 CAN_the_fisheries_protection_service_desc:0 "A few armed steamers under the Department of Marine and Fisheries, chasing American schooners off the Banks and sealers out of the Pacific: the whole of the Dominion's armed floating force."
 CAN_the_cruiser_canada:0 "The CGS Canada"
 CAN_the_cruiser_canada_desc:0 "Two hundred tons, a quick-firing gun forward, commissioned in 1904 for the fisheries patrol and carrying cadets from the following season. The Dominion is training sea officers six years before it has a naval college to train them in."
 CAN_the_cruiser_canada_tt:0 "The §YCGS Canada§! carries cadets and becomes the country's first training ship. §GNaval experience, and a building slot in Nova Scotia.§! §ROne small gunboat is not a fleet, and she is charged to the fisheries vote.§!"
 CAN_built_on_the_lakes:0 "Built on the Lakes"
 CAN_built_on_the_lakes_desc:0 "The CGS Vigilant, launched in 1904 for the lake fisheries patrol, is the first warship built in a Canadian yard."
 CAN_built_on_the_lakes_tt:0 "The first warship §Ybuilt in a Canadian yard§! enters service on the Lakes. §GA building slot and improved works in Ontario, and naval experience.§! §RThe Rush-Bagot limitation is strained, and Washington is entitled to notice it.§!"
 CAN_the_hydrographic_survey:0 "The Hydrographic Survey"
 CAN_the_hydrographic_survey_desc:0 "The Hydrographic Survey is established in 1904 under Mr Stewart, and the country begins at last to sound its own approaches instead of sailing on Admiralty sheets forty years old. It mounts not a single gun."
 CAN_the_coastal_wireless_stations:0 "The Coastal Wireless Stations"
 CAN_the_coastal_wireless_stations_desc:0 "Mr Marconi has been transmitting from Glace Bay since 1902, and the Department of Marine and Fisheries is now building government stations along both coasts and requiring a listening watch."
 CAN_the_yards_at_halifax_and_esquimalt:0 "The Yards at Halifax and Esquimalt"
 CAN_the_yards_at_halifax_and_esquimalt_desc:0 "The Admiralty closes its dockyards and hands them over in the years following the withdrawal: slips, shops, cranes and stores at both ends of the country."
 CAN_a_naval_militia:0 "A Naval Militia"
 CAN_a_naval_militia_desc:0 "Enrol the fisheries crews as a reserve, put the St Lawrence pilots on the roll, register the men of the inshore fleet. It is the only way a country without a navy may possess seamen, and the men cost little while they stay at their trade."
 CAN_bring_kingsmill_home:0 "Bring Kingsmill Home"
 CAN_bring_kingsmill_home_desc:0 "Captain Charles Kingsmill, born at Guelph, leaves the Royal Navy after thirty years to direct the Marine Service of Canada."
 CAN_bring_kingsmill_home_tt:0 "§YCaptain Charles Kingsmill§! leaves the Royal Navy to direct the Marine Service. §GSubstantial naval experience and standing are gained.§! §RHe is a director without a fleet, and the Admiralty has lost an officer it will remember lending.§!"
 CAN_the_imperial_defence_conference:0 "The Imperial Defence Conference"
 CAN_the_imperial_defence_conference_desc:0 "The naval sessions sit at London on the third, fifth and sixth of August, and every Dominion is asked to say what it will do."
 CAN_the_imperial_defence_conference_tt:0 "Canada sits at the §Ynaval sessions§! of the Imperial Defence Conference. §GNaval experience is gained, and the three answers of 29 March become available.§! §ROne of the three must be chosen, and the other two close for good.§!"
 CAN_a_navy_under_our_own_flag:0 "A Navy Under Our Own Flag"
 CAN_a_navy_under_our_own_flag_desc:0 "Sir Wilfrid's answer, and Australia's: a naval service of this country, ships built and manned and commanded here, a department of its own."
 CAN_the_new_zealand_example:0 "The New Zealand Example"
 CAN_the_new_zealand_example_desc:0 "New Zealand offered the Admiralty a battle cruiser outright in March, and half of English Canada asks why Ottawa does not do the same."
 CAN_no_naval_policy_without_the_people:0 "Not a Dollar Without a Plebiscite"
 CAN_no_naval_policy_without_the_people_desc:0 "Mr Monk's reading of the same resolution: no naval expenditure of any kind until the people have been asked in a general vote. It refuses the Canadian fleet and the imperial cheque together, and it is the only answer that carries Quebec."

 ##### NATIONAL IDEAS #####

 CAN_idea_the_international_joint_commission:0 "The International Joint Commission"
 CAN_idea_the_international_joint_commission_desc:0 "Six commissioners, three from each country, with equal votes over every water that crosses the line. Works on the boundary go forward faster than they ever did through the Colonial Office. Nothing goes forward at all until the Commission has been consulted, and Ottawa may no longer act alone upon its own rivers."
 CAN_idea_the_all_red_route:0 "The All-Red Route"
 CAN_idea_the_all_red_route_desc:0 "Cable, fast mail and a Pacific terminus, all of it British from end to end. Patterns and licences come out from home cheaply and quickly. The subsidy is voted every year and is never reduced, and the Dominion has arranged its communications so that everything of consequence passes through London."
 CAN_idea_the_merit_principle:0 "The Merit Principle"
 CAN_idea_the_merit_principle_desc:0 "Entry to the inside service by examination and promotion by record. The departments work better and the public works are better managed. The Government has given away the only currency in which a Canadian party has ever paid its followers, and it will feel the want of it at every election."
 CAN_idea_the_patronage_lists:0 "The Patronage Lists"
 CAN_idea_the_patronage_lists_desc:0 "The member for the county recommends and the Minister appoints. The party is solid, the vote is delivered and political power is never short. The work is done by men chosen for other qualities than competence, and every few years a department is found out."
 CAN_idea_aid_to_the_civil_power:0 "Aid to the Civil Power"
 CAN_idea_aid_to_the_civil_power_desc:0 "The troops stand at the pit heads and the coal moves. Industry is served and order is kept at a very moderate cost in men. In the collieries the lesson taken is simpler than the one intended, and it will be recited back to Ottawa by harder men than these for a generation."
 CAN_idea_no_soldiers_against_miners:0 "No Soldiers Against Miners"
 CAN_idea_no_soldiers_against_miners_desc:0 "The Dominion will not put soldiers between an operator and his men. The country is quieter for it and the settlement, when it comes, holds. The pits are idle meanwhile, the coal is not raised, and every sheriff in Canada has learned what Ottawa will refuse him."
 CAN_idea_the_emergency_note_issue:0 "The Emergency Note Issue"
 CAN_idea_the_emergency_note_issue_desc:0 "Dominion notes advanced against securities, and a seasonal currency written into the Bank Act afterwards. The crop moves, the banks hold, and the shock of 1907 passes without a general failure. The notes remain in circulation, the guarantee remains on the books, and the country is carrying paper it did not intend to carry."
 CAN_idea_the_bankers_verdict:0 "The Bankers' Verdict"
 CAN_idea_the_bankers_verdict_desc:0 "The Government stood aside, the Sovereign went down, and what survived is a system of very few banks with very deep reserves. Capital is cheaper and firmer than it has ever been in this country. The depositors of five institutions paid for that, and they are voters."
 CAN_idea_the_services_that_make_an_army:0 "The Services That Make an Army"
 CAN_idea_the_services_that_make_an_army_desc:0 "Engineers, signallers, medical, pay, ordnance and service corps, raised under the Act of 1904. The force can now be moved, fed and repaired instead of merely assembled. All of it must be kept in being in peace, when nobody can see what it is for."
 CAN_idea_the_staff_course:0 "The Staff Course"
 CAN_idea_the_staff_course_desc:0 "A Canadian staff course and Canadian places at the British schools. Officers learn to handle formations larger than anything this country has ever put in the field, and the doctrine comes cheaper for it. While they learn, they are not with their regiments, and the regiments show it."
 CAN_idea_the_imperial_fortresses:0 "The Imperial Fortresses"
 CAN_idea_the_imperial_fortresses_desc:0 "Halifax and Esquimalt are Canadian now, guns, works and all. Both coasts are defensible for the first time by our own gunners. Both must be garrisoned, heated, victualled and repaired every year out of a militia vote that was never enlarged to receive them."
 CAN_idea_the_ross_rifle:0 "The Ross Rifle"
 CAN_idea_the_ross_rifle_desc:0 "A rifle designed and made in Canada, with the plant, the pattern and the cartridge in Canadian hands, and the small-arms trade established at Quebec for good. The action fouls when the ammunition is dirty or the chamber is wet. Every man in the militia has been told it is the finest rifle in the world."
 CAN_idea_the_lee_enfield_contract:0 "The Lee-Enfield Contract"
 CAN_idea_the_lee_enfield_contract_desc:0 "The service rifle of the Empire, interchangeable with every British force and every British cartridge, and thoroughly proved in South Africa. It is bought in sterling and delivered in the order the War Office finds convenient, and no Canadian workman will ever make one."
 CAN_idea_a_nation_of_marksmen:0 "A Nation of Marksmen"
 CAN_idea_a_nation_of_marksmen_desc:0 "Free ammunition to every recognised club, camps in every county, and a great many men who can hit a target at six hundred yards. They can be called out quickly and cheaply. Not one of them has been taught to march, to entrench, or to obey a man he did not elect."
 CAN_idea_a_permanent_force_worth_the_name:0 "A Permanent Force Worth the Name"
 CAN_idea_a_permanent_force_worth_the_name_desc:0 "Regular soldiers, quartered and instructed and paid the year round, who teach the militia in summer and are ready in winter. The standard of the whole force rises with them. They are the most unpopular line in the estimates and they will be attacked every session until there is a war."
 CAN_idea_the_strathcona_trust:0 "The Strathcona Trust"
 CAN_idea_the_strathcona_trust_desc:0 "Half a million dollars settled upon the physical and military training of schoolchildren, and cadet corps in the schools to spend it. In fifteen years the recruits will arrive knowing their drill. In the Province of Quebec the same corps are read as conscription begun in the classroom, and the campaign against them starts at once."
 CAN_idea_a_militia_air_branch:0 "A Militia Air Branch"
 CAN_idea_a_militia_air_branch_desc:0 "A shed, a few machines and a handful of men who can fly them and mend them, kept on the militia vote. When aircraft matter, this country will have men who have already handled them. Until then it is paying, every year, for something it cannot explain to the Committee of Supply."
 CAN_idea_no_use_for_the_aeroplane:0 "No Use for the Aeroplane"
 CAN_idea_no_use_for_the_aeroplane_desc:0 "The Militia Council has reported that the aeroplane has no military application, and the vote goes to rifles and boots, where it is undeniably needed. The country will enter the next war with one aircraft, no school, no mechanic and no notion of what an air service is for."
 CAN_idea_the_fisheries_protection_service:0 "The Fisheries Protection Service"
 CAN_idea_the_fisheries_protection_service_desc:0 "Armed steamers on both coasts, a roll of crews and an account kept apart from the fisheries. It is not a navy and does not pretend to be one, but the Dominion now owns hulls, men and a little of the habit of the sea. It is charged to the civil estimates and looks it."
 CAN_idea_charts_of_our_own_coasts:0 "Charts of Our Own Coasts"
 CAN_idea_charts_of_our_own_coasts_desc:0 "Canadian soundings, Canadian sheets, and approaches that have been surveyed within living memory. Ships move faster and further because their masters know where the water is. The survey vessels are paid for out of the same vote as everything else that floats."
 CAN_idea_the_coastal_wireless_chain:0 "The Coastal Wireless Chain"
 CAN_idea_the_coastal_wireless_chain_desc:0 "Government stations along both coasts with a listening watch kept day and night. A ship in trouble is heard, and shipping can be warned and directed from the shore. The operators, the masts and the batteries are a permanent charge, and the chain hears a great deal that nobody can act upon."
 CAN_idea_a_naval_militia:0 "A Naval Militia"
 CAN_idea_a_naval_militia_desc:0 "Fisheries crews, river pilots and inshore fishermen carried on a naval roll and exercised when they can be spared. The Dominion possesses trained seamen at a fraction of what a fleet would cost. It possesses them for ships it has not built, and their pay and training must be voted every year regardless."
 CAN_idea_a_navy_under_our_own_flag:0 "A Navy Under Our Own Flag"
 CAN_idea_a_navy_under_our_own_flag_desc:0 "Yards of our own, working to our own account, learning a trade this country has never practised. Canadian dockyard capacity grows and Canadian hulls will follow. The learning is slow and dear, the Admiralty does not lend its drawings to a rival, and every licence bought abroad now costs more."
 CAN_idea_the_cash_contribution:0 "A Contribution in Money"
 CAN_idea_the_cash_contribution_desc:0 "Ottawa pays and the Admiralty builds. Naval doctrine, licences, patterns and school places come to us on the best terms in the world, and we shall never want for a plan. No keel is laid in a Canadian yard, the dockyard capacity we possess withers for want of work, and the French-speaking counties are told twice a year what the money was for. Nothing removes this."
 CAN_idea_no_naval_policy_without_the_people:0 "Not a Dollar Without a Plebiscite"
 CAN_idea_no_naval_policy_without_the_people_desc:0 "The naval question is frozen until the country is asked, and the country is not asked. Quebec is quiet, the Government is strong, and the money is spent on things that can be seen. There will be no naval service, no college, no cadets and no dockyard, and in 1914 there will be no ships either."
