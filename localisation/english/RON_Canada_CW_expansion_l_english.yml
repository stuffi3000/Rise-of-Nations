l_english:

 ########################################################################################
 # RON_Canada_CW_expansion - cold war era, 1949 on
 ########################################################################################

 ### POLITICS HISTORICAL

 CAN_a_governor_general_of_our_own:0 "A Governor General of Our Own"
 CAN_a_governor_general_of_our_own_desc:0 "Every representative of the Crown in this country has been an English peer, sent out from London with instructions from a British minister."
 CAN_a_governor_general_of_our_own_tt:0 "The Crown's representative is chosen here and advised here. §GStability rises and the Ministry gains standing.§!\n§RThe last imperial office is gone, and the party's imperial wing will not forget it.§!"

 CAN_the_massey_report:0 "The Massey Report"
 CAN_the_massey_report_desc:0 "The commission reports what it was appointed to find: that a country importing its whole imagination will not remain a country. It asks for a council for the arts, a national library, and federal grants to the universities."
 CAN_the_massey_report_tt_rest:0 "In addition: §Gthe universities are funded and research is faster§!, and §Rthe Ministry spends political capital every month defending a federal hand in a provincial field§!."

 CAN_the_equalization_formula:0 "The Equalization Formula"
 CAN_the_equalization_formula_desc:0 "Rowell-Sirois recommended it in 1940 and the provinces killed it at the conference table. It is enacted now, quietly, in the tax agreements: the poorer provinces are brought up to the yield of the richer, and the Treasury pays the difference."
 CAN_the_equalization_formula_tt_rest:0 "In addition: §Gthe Dominion holds together at the seams where it used to tear§!. §RThe payment is annual, unbounded and permanent, and consumer goods must cover it.§!"

 CAN_hospital_insurance:0 "Hospital Insurance"
 CAN_hospital_insurance_desc:0 "Saskatchewan built it first and five provinces followed; the Dominion will now pay half the cost of any provincial plan that meets the standard."
 CAN_hospital_insurance_tt_rest:0 "In addition: §Gpopulation grows faster and the Dominion is far steadier§!. §ROttawa pays half of a bill that the provinces alone write.§!"

 ### POLITICS OPPOSITION

 CAN_the_tremblay_commission:0 "The Tremblay Commission"
 CAN_the_tremblay_commission_desc:0 "Quebec appoints its own royal commission upon constitutional problems, and Ottawa may either forbid it or let it sit."
 CAN_the_tremblay_commission_tt:0 "The province is left to hold its enquiry. §GThe Ministry buys three years of quiet and gains political capital.§! §GFrench Canada is satisfied§!; §Rthe English provinces read it as weakness§!.\n§RThe argument for provincial right is now written down, and it will be quoted at every conference hereafter.§!"

 CAN_a_tax_of_our_own:0 "A Tax of Our Own"
 CAN_a_tax_of_our_own_desc:0 "The province enacts its own tax upon incomes and dares Ottawa to collect twice from the same citizen. The Ministry concedes an abatement rather than fight, and the wartime settlement by which the Dominion alone taxed incomes is finished."
 CAN_a_tax_of_our_own_tt_rest:0 "In addition: §Gthe province is content and the Dominion is steadier for it§!. §ROttawa's revenues and its political capital both fall, and economic measures cost more to carry.§!"

 CAN_the_federal_bargain:0 "The Federal Bargain"
 CAN_the_federal_bargain_desc:0 "The rental agreements are renewed on Ottawa's terms: the provinces surrender the income and corporation fields for a fixed payment, as they did in the war."
 CAN_the_federal_bargain_tt_rest:0 "In addition: §Gthe Treasury holds the great tax fields and economic measures are cheaper§!. §RThe grievance is filed away in Quebec City and will be produced at every conference for a generation.§!"

 CAN_a_bill_of_rights:0 "A Bill of Rights"
 CAN_a_bill_of_rights_desc:0 "Fundamental freedoms are declared by statute: speech, assembly, religion, the press, and due process before the law. It is an ordinary Act, not entrenched in the constitution, and it binds only the Parliament that passed it."
 CAN_a_bill_of_rights_tt_rest:0 "In addition: §Gthe Dominion is steadier and the record of civil liberties improves§!. §REmergency powers are harder to invoke, war support is lower, and measures against the citizen cost more.§!\n§RThe Act is not entrenched: any Parliament may repeal it and no province is bound by it.§!"

 CAN_the_pipeline_debate:0 "The Pipeline Debate"
 CAN_the_pipeline_debate_desc:0 "The bill must pass before the summer or the steel contracts lapse, so the Minister of Trade and Commerce moves closure before debate begins and again at every stage."
 CAN_the_pipeline_debate_tt:0 "Closure is moved at every stage and the line is completed on schedule. §GThe route through the Shield is finished and infrastructure improves.§!\n§RThe Ministry spends its authority to do it: political capital and stability both fall sharply, and the House will remember.§!"

 CAN_the_asbestos_strike:0 "The Asbestos Strike"
 CAN_the_asbestos_strike_desc:0 "Five thousand miners at Asbestos and Thetford Mines walk out without submitting to arbitration, which makes the strike illegal before it is a day old."
 CAN_the_asbestos_strike_tt:0 "The mines stop. §RProduction is disrupted and the Dominion is less steady while the dispute lasts.§!\n§YThe manner of its ending must now be chosen.§!"

 CAN_read_the_riot_act:0 "Read the Riot Act"
 CAN_read_the_riot_act_desc:0 "The strike is declared illegal, the provincial police are sent in, and the men are read the law upon the road at Asbestos. The mines will turn again within the month and the companies will remember who kept them turning."
 CAN_read_the_riot_act_tt_rest:0 "In addition: §Gthe mines turn again and industrial construction is faster§!. §RThe Dominion is markedly less steady, and the left gains ground it will not give back.§!"

 CAN_the_bishops_intervene:0 "The Bishops Intervene"
 CAN_the_bishops_intervene_desc:0 "The Archbishop of Quebec mediates and a settlement is signed in July; the Archbishop of Montreal, who took the workers' side from the pulpit, is removed to the coast within the year."
 CAN_the_bishops_intervene_tt_rest:0 "In addition: §Gthe settlement holds and the Dominion is far steadier§!. §RThe companies got less than they demanded and factory output suffers for it.§!"

 ### ECONOMY

 CAN_elliot_lake:0 "Elliot Lake"
 CAN_elliot_lake_desc:0 "Eleven mines are sunk in the bush north of the Huron shore, and a town of twenty-five thousand is built to serve them."
 CAN_elliot_lake_tt_rest:0 "The camp at Blind River is opened. §GFor seven years the ore pays handsomely: political capital, factory output and resource yield all rise.§!\n§RThe boom then ends. What remains is permanent: eleven towns with one industry and one customer, an obligation to export, and a country less steady for it.§!"

 CAN_oil_out_of_alberta:0 "Oil Out of Alberta"
 CAN_oil_out_of_alberta_desc:0 "Leduc has been flowing for two years and the province is drowning in crude it cannot sell; the refineries are at Sarnia and the tidewater is behind three ranges of mountains."
 CAN_oil_out_of_alberta_tt:0 "The prairie crude is given an outlet east and west. §GInfrastructure improves in Alberta and British Columbia.§!\n§RThe route of the eastern line is now the question, and it cannot be answered cheaply.§!"

 CAN_the_all_canadian_route:0 "The All-Canadian Route"
 CAN_the_all_canadian_route_desc:0 "The line is forced north of Lake Superior: a thousand miles of Precambrian rock with not one customer along it, at nearly twice the cost of the southern road."
 CAN_the_all_canadian_route_tt_rest:0 "In addition: §Gthe country builds faster for the practice and trades better for the independence§!. §RThe Shield section earns nothing and consumer goods must carry the debt.§!"

 CAN_the_shortest_route:0 "The Shortest Route"
 CAN_the_shortest_route_desc:0 "The line runs south of the lakes through Michigan and Wisconsin, as the oil line already does, and costs half as much. The gas reaches Montreal two years sooner and the company is solvent from the first day."
 CAN_the_shortest_route_tt_rest:0 "In addition: §Gthe line is cheap, quick and profitable, and factory output rises at once§!. §RThe valve is in another country's hands, and a growing share of our trade must go to the party that holds it.§!"

 CAN_the_wheat_sale:0 "The Wheat Sale"
 CAN_the_wheat_sale_desc:0 "The elevators have been full for six years and there is one buyer left in the world with the appetite and the need."
 CAN_the_wheat_sale_tt:0 "The surplus is sold to the buyer nobody else will serve. §GThe Prairies are solvent, the Dominion is steadier, and the Ministry gains standing for the defiance.§!\n§RWashington will remember it, and the credit is ours to carry until it is paid.§!"

 CAN_the_floating_dollar:0 "The Floating Dollar"
 CAN_the_floating_dollar_desc:0 "American capital is arriving faster than the exchange controls can absorb it, so the peg is abandoned and the dollar is let float, alone among the members of the Bretton Woods agreement. The Fund objects and is ignored."
 CAN_the_floating_dollar_tt_rest:0 "In addition: §Geconomic measures are cheaper to carry and our trade is better regarded§!. §RThe rate is nobody's decision now, and the uncertainty tells against stability.§!"

 CAN_the_seaway:0 "The Seaway"
 CAN_the_seaway_desc:0 "The Dominion announces that it will dig the deep waterway alone if it must, and Washington, which has refused for twenty-two years, joins within the twelvemonth rather than be left off the river."
 CAN_the_seaway_tt_rest:0 "In addition: §Gthe river is open to ocean shipping, factory output rises and construction is faster§!. §RThe works are administered jointly with Washington, and the Dominion no longer controls its own river alone.§!"

 CAN_the_gordon_commission:0 "The Gordon Commission"
 CAN_the_gordon_commission_desc:0 "A royal commission upon the economic prospects of the country reports that the prospects are excellent and the ownership is foreign."
 CAN_the_gordon_commission_tt:0 "The commission reports upon foreign ownership. §GThe Ministry gains the standing to act upon it.§!\n§YThe recommendation may now be taken up or set aside.§!"

 CAN_screen_the_takeovers:0 "Screen the Takeovers"
 CAN_screen_the_takeovers_desc:0 "Foreign purchases of Canadian companies are made reviewable, foreign subsidiaries are required to list shares here and to name Canadian directors, and the resource sectors are closed above a threshold."
 CAN_screen_the_takeovers_tt_rest:0 "In addition: §Gthe Ministry commands its own economy and gains standing for it§!. §RFactory output falls, the investment goes elsewhere, and foreign licences cost a quarter more.§!"

 CAN_the_open_door:0 "The Open Door"
 CAN_the_open_door_desc:0 "The report is thanked, printed and shelved. The branch plants come north by the hundred, the automobile industry is rebuilt on the border, and employment has never been higher."
 CAN_the_open_door_tt_rest:0 "In addition: §Gfactory output rises sharply, plants reach efficiency faster, and licences are cheap§!. §RThe decisions are made abroad, and the Ministry's authority over its own industry declines month by month.§!"

 CAN_defence_production_sharing:0 "Defence Production Sharing"
 CAN_defence_production_sharing_desc:0 "Since we no longer design our own aircraft, the arrangement is that our factories build components for the aircraft that others design, and are admitted to the American defence market on equal terms to do it. The order books are full within a year."
 CAN_defence_production_sharing_tt_rest:0 "In addition: §Garms factories are far more productive and foreign licences cost half§!. §RResearch slows permanently, and a fixed share of our production is owed to the partner who placed the orders.§!"

 ### ARMY

 CAN_the_special_force:0 "The Special Force"
 CAN_the_special_force_desc:0 "A brigade is raised for service with the United Nations in Korea, recruited afresh rather than taken from the regular army, because the regular army is thirty thousand men and cannot spare one of them."
 CAN_the_special_force_tt:0 "A brigade is raised for United Nations service. §GA standing expeditionary brigade and the command power to move it.§!\n§RThe regular battalions lose their instructors to train it, and the home establishment is hollow for a year.§!"
 CAN_kapyong:0 "Kapyong"
 CAN_kapyong_desc:0 "The second battalion of the Princess Patricia's holds Hill 677 above the valley for a day and a night, surrounded, calling artillery upon its own position. The road to Seoul stays shut."
 CAN_kapyong_trigger_tt:0 "§YRequires§!: the country is at war."
 CAN_kapyong_tt:0 "The battalion holds the hill. §GThe army gains hard experience and a battle honour no ally can take from it.§!"
 CAN_a_brigade_for_europe:0 "A Brigade for Europe"
 CAN_a_brigade_for_europe_desc:0 "The twenty-seventh brigade lands in the Netherlands and takes station in Germany, and for the first time in the history of this country a Canadian formation is quartered abroad in time of peace."
 CAN_a_brigade_for_europe_tt_rest:0 "In addition: §Gthe brigade trains against the best in Europe and the army is better for it§!. §RIts upkeep is permanent, paid in consumer goods and in the Ministry's political capital, and it cannot be brought home without breaking the undertaking.§!"

 CAN_the_defence_of_the_north:0 "The Defence of the North"
 CAN_the_defence_of_the_north_desc:0 "The Mobile Striking Force is brought to its full establishment: a brigade group trained to parachute, to winter and to move, held to answer a lodgement anywhere between Alert and Churchill. It is the only army in the world designed for that ground."
 CAN_the_defence_of_the_north_tt_rest:0 "In addition: §Gan airfield in the North and a great gain in the defence of our own ground§!. §RThe force is fitted for one theatre only, gains experience slowly, and the allies read its existence as a refusal.§!"

 CAN_the_nato_cartridge:0 "The NATO Cartridge"
 CAN_the_nato_cartridge_desc:0 "The alliance settles upon the American cartridge of 7.62 millimetres, and Canada is the first of its members to put the Belgian rifle chambered for it into the hands of troops, made under licence at Long Branch."
 CAN_the_nato_cartridge_tt_rest:0 "In addition: §Gforeign licences are a quarter cheaper and the army is better organized for the standardization§!. §RThe design is another country's, the pattern is another country's, and the Ministry answers for neither.§!"

 CAN_the_british_rifle:0 "The British Rifle"
 CAN_the_british_rifle_desc:0 "London adopted the bullpup in the intermediate calibre and then abandoned it under American pressure within the twelvemonth. Canada keeps it."
 CAN_the_british_rifle_tt_rest:0 "In addition: §Gthe weapon is superior and the infantry is better organized for it§!. §RNo ally can resupply it: reinforcement is slower and foreign licences cost a quarter more.§!"

 CAN_national_service_in_peacetime:0 "National Service in Peacetime"
 CAN_national_service_in_peacetime_desc:0 "The alliance wants divisions and this country has never in its history compelled a man to serve except in war, and paid for it twice with riots in Quebec. The Ministry will legislate a term of service for every fit man of twenty."
 CAN_national_service_in_peacetime_tt_rest:0 "In addition: §Gmanpower is abundant and troops are trained faster than ever before§!. §RThe Dominion is gravely less steady.§! §GEnglish Canada is satisfied§!; §Rand French Canada is not, and will say so at the polls.§!"

 CAN_an_army_of_volunteers:0 "An Army of Volunteers"
 CAN_an_army_of_volunteers_desc:0 "The regular force stays small, long-service and professional, and the militia keeps its armouries and its Thursday nights. Every man in it chose to be there and it shows in the field."
 CAN_an_army_of_volunteers_tt_rest:0 "In addition: §Gthe regular force is highly experienced and well organized§!. §RThe recruitable pool is a fifth smaller and losses are replaced slowly: this army cannot be expanded in a hurry.§!"

 CAN_a_force_between_them:0 "A Force Between Them"
 CAN_a_force_between_them_desc:0 "Britain and France are at Suez, the Assembly is in uproar, and the Secretary of State for External Affairs proposes a force of neutrals to stand between the armies while the belligerents withdraw with their dignity."
 CAN_a_force_between_them_tt:0 "A United Nations force is interposed and the crisis is ended. §GGreat standing is won abroad.§!\n§RThe battalion is found by stripping the brigade in Europe, and London and Paris both regard the intervention as a betrayal.§!"
 CAN_rockets_for_the_brigade:0 "Rockets for the Brigade"
 CAN_rockets_for_the_brigade_desc:0 "The brigade in Germany receives a battery of unguided rockets whose only useful warhead is atomic, and for two years it is issued sand and concrete instead."
 CAN_rockets_for_the_brigade_tt:0 "The battery is armed under joint custody. §GThe army gains considerable experience with the new weapons.§!\n§RThe warheads are on our establishment and in another country's keeping, and the Ministry must defend the arrangement in the House.§!"

 ### AIR FORCE

 CAN_the_pinetree_line:0 "The Pinetree Line"
 CAN_the_pinetree_line_desc:0 "Thirty-three radar stations are laid across the settled belt of the country, two thirds of the cost borne by Washington and the sites manned by both air forces together. It is the first continuous watch this country has ever kept over its own sky."
 CAN_the_pinetree_line_tt:0 "The radar chain is built across the settled belt. §GRadar stations are raised in the central provinces and the sky is watched at last.§!\n§RTwo thirds of it is another country's money, and the line was drawn to cover that country's cities rather than ours.§!"

 CAN_the_air_division:0 "The Air Division"
 CAN_the_air_division_desc:0 "Four wings of day fighters go to England, France and Germany, the largest peacetime force this country has ever stationed abroad, flying Sabres built under licence at Cartierville. For a few years they are reckoned the best fighter pilots in Europe."
 CAN_the_air_division_tt_rest:0 "In addition: §Gthe crews are the finest in Europe and accidents are far fewer§!. §RThe home air defence is stripped to man them, and their upkeep is a permanent charge upon consumer goods.§!"

 CAN_the_canuck:0 "The Canuck"
 CAN_the_canuck_desc:0 "A two-seat all-weather interceptor designed and built here, ugly, enormous, and able to find a bomber over the Labrador Sea in cloud at night, which nothing bought abroad could then do."
 CAN_the_canuck_tt:0 "The interceptor enters squadron service. §GThe air force gains great experience upon an aircraft of our own design.§!\n§RIt is subsonic and already dated; its successor will have to be paid for.§!"

 CAN_a_line_of_our_own:0 "A Line of Our Own"
 CAN_a_line_of_our_own_desc:0 "A tripwire radar fence is laid along the fifty-fifth parallel, from the Labrador coast to British Columbia: ninety-eight stations, built with Canadian money, operated by Canadians, on Canadian ground."
 CAN_a_line_of_our_own_tt_rest:0 "In addition: §Gthe home sky is markedly better defended and radar stations are built a quarter faster§!. §RThe whole cost is ours: consumer goods and political capital both suffer for it.§!"

 CAN_let_washington_pay:0 "Let Washington Pay"
 CAN_let_washington_pay_desc:0 "The Distant Early Warning Line is built along the seventieth parallel: sixty-three stations across three thousand miles of our Arctic, paid for, constructed and manned by the United States, with a Canadian liaison officer at each."
 CAN_let_washington_pay_tt_rest:0 "In addition: §Gthe Arctic stations cost us nothing and radar is built at half the effort§!. §RThe watchers are foreign, their reports go south before they come to Ottawa, and the Ministry's standing suffers every time the fact is raised.§!"

 CAN_the_arrow:0 "The Arrow"
 CAN_the_arrow_desc:0 "A delta interceptor of wholly Canadian design, with an engine of Canadian design, faster and higher than anything then flying anywhere."
 CAN_the_arrow_trigger_tt:0 "§YRequires§!: an industrial base able to bear the programme."
 CAN_the_arrow_tt_rest:0 "In addition: §Gresearch across the country is faster and the air force is formidable§!. §RThe cost is ruinous: consumer goods, factory output and the Ministry's political capital are all consumed by it, year upon year, with no export order in sight.§!"

 CAN_black_friday:0 "Black Friday"
 CAN_black_friday_desc:0 "The programme is cancelled on a Friday morning by telephone and fourteen thousand men at Malton are dismissed before noon. The five completed aircraft and the jigs are cut up for scrap on the Ministry's order, so that the question cannot be reopened."
 CAN_black_friday_tt_rest:0 "In addition: §Gthe estimates are relieved at once, factory output rises and foreign licences are cheap§!. §RResearch and air power both suffer permanently: the men who could have done the work are gone and will not come back.§!"

 CAN_norad:0 "NORAD"
 CAN_norad_desc:0 "The air defence of the continent is placed under a single operational command at Colorado Springs, an American officer at its head and a Canadian as his deputy. It is signed by the Ministry before the House sits and announced afterwards."
 CAN_norad_tt_rest:0 "In addition: §Gthe continent's sky is defended as one and our own is far safer§!. §RThe decision to fight passes to a headquarters we do not command, our dispositions are open to the partner, and the Ministry's authority is diminished by it.§!"

 CAN_warheads_for_the_bomarc:0 "Warheads for the Bomarc"
 CAN_warheads_for_the_bomarc_desc:0 "Two squadrons of missiles stand at North Bay and La Macaza, and the only warhead ever designed for them is atomic. The Ministry accepts them under joint custody: two keys, two nations, one magazine."
 CAN_warheads_for_the_bomarc_tt_rest:0 "In addition: §Gthe missiles are armed and the home sky is genuinely defended§!. §RThe Dominion is markedly less steady, the cabinet is divided, and the Ministry answers weekly for weapons it cannot fire alone.§!"

 CAN_a_conventional_deterrent:0 "A Conventional Deterrent"
 CAN_a_conventional_deterrent_desc:0 "The missiles keep their ballast of sand and concrete, and the interceptors keep their cannon. The country tells the alliance that it will hold its ground with weapons it is willing to answer for, and no more."
 CAN_a_conventional_deterrent_tt_rest:0 "In addition: §Gthe Ministry gains standing for keeping its word and the interceptor line is held§!. §RThe missiles are useless, the home sky is thinner, and the alliance considers the undertaking broken.§!"

 ### NAVY

 CAN_the_mainguy_report:0 "The Mainguy Report"
 CAN_the_mainguy_report_desc:0 "Three ships in one spring: men lock themselves in the mess decks aboard the Athabaskan, the Crescent and the carrier, and refuse duty."
 CAN_the_mainguy_report_tt:0 "The commission reports upon the incidents of the spring. §GThe fleet learns from the enquiry.§!\n§YThe finding must now be acted upon, or filed.§!"

 CAN_a_navy_of_our_own:0 "A Navy of Our Own"
 CAN_a_navy_of_our_own_desc:0 "The shoulder flash CANADA is put on every uniform, the divisional system is introduced so that a rating has an officer to go to, and the officers are trained here instead of at Dartmouth."
 CAN_a_navy_of_our_own_tt_rest:0 "In addition: §Gthe fleet is far better manned and better handled§!. §RThe Admiralty's drawings are no longer ours for the asking: foreign licences cost a quarter more.§!"

 CAN_the_customs_of_the_service:0 "The Customs of the Service"
 CAN_the_customs_of_the_service_desc:0 "The report is thanked and shelved. The forms, the language, the ranks and the drawings stay as the Admiralty made them, because they work and because they arrive without a bill."
 CAN_the_customs_of_the_service_tt_rest:0 "In addition: §Gthe Admiralty's designs and patterns remain free to us and foreign licences cost half§!. §RThe fleet learns nothing from the enquiry, and recruitment suffers permanently in the French provinces.§!"

 CAN_the_north_atlantic_specialists:0 "The North Atlantic Specialists"
 CAN_the_north_atlantic_specialists_desc:0 "The alliance divides the ocean and gives the Canadian Atlantic sub-area to a Canadian admiral at Halifax: the only theatre command this country holds anywhere in the world."
 CAN_the_north_atlantic_specialists_tt_rest:0 "In addition: §Gthe fleet is unmatched at finding submarines and escorting convoys§!. §RIt is fitted for nothing else: this navy cannot mount a landing and will not be asked to.§!"

 CAN_the_saint_laurent_class:0 "The St. Laurent Class"
 CAN_the_saint_laurent_class_desc:0 "Seven escorts are laid down to a design drawn in Ottawa rather than in Bath or in Whitehall: rounded decks against the ice, a hull that keeps the sea, and the sonar chosen for our own water."
 CAN_the_saint_laurent_class_tt:0 "The first warships of Canadian design are laid down. §GA naval dockyard on the Atlantic coast and hard-won experience for the fleet.§!\n§RThe design work is slow and dear, and the ships come late.§!"

 CAN_no_more_flat_tops:0 "No More Flat-Tops"
 CAN_no_more_flat_tops_desc:0 "The carrier goes back to the Admiralty and nothing is bought to replace her. The money buys escorts instead, which is what the alliance asked this navy for and what its ocean actually requires."
 CAN_no_more_flat_tops_tt_rest:0 "In addition: §Gthe dockyards work far faster and the escort groups are stronger§!. §RThe fleet air arm is gone for good and the navy can put nothing ashore.§!"

 CAN_bonaventure:0 "Bonaventure"
 CAN_bonaventure_desc:0 "A light fleet carrier is bought unfinished and completed to the new pattern, with the steam catapult, the angled deck and the mirror sight, and she carries jets. She is the most modern warship the country has ever owned."
 CAN_bonaventure_tt_rest:0 "In addition: §Gthe fleet has a deck of its own and is handled with real confidence§!. §RShe consumes the dockyards and the estimates: escorts build more slowly and consumer goods carry her upkeep.§!"

 ### IDEES DE L'EXPANSION CW

 CAN_idea_cw_the_massey_report:0 "The Council and the Grants"
 CAN_idea_cw_the_massey_report_desc:0 "A council for the arts, a national library, and a cheque to every university in the country. Quebec has forbidden its universities to cash theirs, and the Ministry defends the principle in the House every session without once naming the province that defies it."

 CAN_idea_cw_equalization:0 "Equalization"
 CAN_idea_cw_equalization_desc:0 "The poorer provinces are brought up to the yield of the richer, every year, from the general revenue. Rowell-Sirois asked for it in 1940 and was refused by the very provinces it would have saved. There is no term and no ceiling, and no ministry will ever be able to end it."

 CAN_idea_cw_hospital_insurance:0 "Hospital Insurance"
 CAN_idea_cw_hospital_insurance_desc:0 "The Dominion pays half the cost of any provincial hospital plan meeting the standard. The country grows healthier and larger. The size of the bill is decided by nine legislatures that do not answer to this House, and it has never once come in below the estimate."

 CAN_idea_cw_a_tax_of_our_own:0 "A Tax of Our Own"
 CAN_idea_cw_a_tax_of_our_own_desc:0 "The province levies its own tax upon incomes and Ottawa concedes an abatement rather than collect twice from the same citizen. The wartime settlement is finished. Every other premier has read the result and drawn the obvious conclusion about what refusal is worth."

 CAN_idea_cw_the_federal_bargain:0 "The Federal Bargain"
 CAN_idea_cw_the_federal_bargain_desc:0 "The great tax fields stay with Ottawa and the provinces take a fixed rental, as they did in the war. It is efficient and it is resented. The grievance is filed in Quebec City and produced, word for word, at every conference held hereafter."

 CAN_idea_cw_a_bill_of_rights:0 "A Bill of Rights"
 CAN_idea_cw_a_bill_of_rights_desc:0 "Speech, assembly, religion and due process are declared by statute. It binds only this Parliament, no province is subject to it, and the courts will read it as narrowly as they may. It is still the first answer this country has ever written to its own emergency powers."

 CAN_idea_cw_the_riot_act:0 "The Riot Act Read"
 CAN_idea_cw_the_riot_act_desc:0 "The strike was broken on the road at Asbestos and the mines turned again within the month. The men who were beaten there did not leave the province, and neither did the young lawyers and journalists who came up from Montreal to watch it being done."

 CAN_idea_cw_the_bishops_intervene:0 "The Archbishop's Settlement"
 CAN_idea_cw_the_bishops_intervene_desc:0 "The Church chose the workers over the companies, in public, for the first time. The Archbishop of Montreal was removed to the coast within the year for having said so, and the alliance of altar and boardroom that governed the province has been broken from the inside."

 CAN_idea_cw_the_uranium_boom:0 "The Uranium Boom"
 CAN_idea_cw_the_uranium_boom_desc:0 "Every ounce out of the Blind River camp is contracted to a single foreign agency at a price it sets. While the contracts run, the money is extraordinary and the Treasury has never had an easier decade. They run seven years, and the agency has already said what it means to do at the end of them."

 CAN_idea_cw_the_uranium_contracts:0 "One Customer"
 CAN_idea_cw_the_uranium_contracts_desc:0 "Eleven mines, one ore, one buyer. The towns were built for the contracts and not for the country, the ore must go abroad whatever the price, and when the orders stop there will be nothing in that bush but paid-off shafts and mortgages."

 CAN_idea_cw_the_all_canadian_route:0 "The All-Canadian Route"
 CAN_idea_cw_the_all_canadian_route_desc:0 "A thousand miles of pipe across the Shield with not one customer along it. The engineers said it could not pay and they were right. It is laid on Canadian ground from end to end, and no foreign regulator will ever decide what passes through it."

 CAN_idea_cw_the_line_through_the_states:0 "A Valve in Other Hands"
 CAN_idea_cw_the_line_through_the_states_desc:0 "The line runs six hundred miles through another country and cost half what the northern road would have cost. The gas is cheap and it is early. In any quarrel worth having, the valve is on the wrong side of the border and the men who turn it answer to another government."

 CAN_idea_cw_the_seaway:0 "The Seaway"
 CAN_idea_cw_the_seaway_desc:0 "Twenty-seven feet of water from Montreal to the head of the lakes, and ocean freighters at the elevators of Thunder Bay. Nine villages lie under the impoundment above Cornwall. The works are governed by a joint authority, and the river that made this country is no longer administered by it alone."

 CAN_idea_cw_the_floating_dollar:0 "The Floating Dollar"
 CAN_idea_cw_the_floating_dollar_desc:0 "Alone among the members of the Fund, this country has let its currency find its own level. Monetary policy belongs to Ottawa again. The price of every bushel and every board foot the country sells is now set by a market that nobody in Ottawa can instruct."

 CAN_idea_cw_screened_investment:0 "Screened Investment"
 CAN_idea_cw_screened_investment_desc:0 "Takeovers are reviewable, subsidiaries must list here and name directors here, and the resource fields are closed above a threshold. The capital that was coming has gone to Mexico and to Australia. The country owns its industry, and there is measurably less of it to own."

 CAN_idea_cw_the_open_door:0 "The Open Door"
 CAN_idea_cw_the_open_door_desc:0 "Branch plants by the hundred, full employment, and the highest wages this country has ever paid. The head offices are in Detroit and Pittsburgh, the research is done there, and no plant here may sell into a market its parent has reserved for itself."

 CAN_idea_cw_defence_production_sharing:0 "Defence Production Sharing"
 CAN_idea_cw_defence_production_sharing_desc:0 "Our factories are admitted to the American defence market on equal terms, and the order books are full. Not one contract is for a complete weapon. We build the wing, the undercarriage and the harness, and somebody else builds the aeroplane and decides what it is for."

 CAN_idea_cw_the_brigade_in_europe:0 "The Brigade in Europe"
 CAN_idea_cw_the_brigade_in_europe_desc:0 "A Canadian formation quartered abroad in time of peace, for the first time in the history of the country. It trains against the best armies in the world and it shows. It must be fed, relieved and paid every year, in a currency this country does not print, and it cannot be brought home without breaking the undertaking."

 CAN_idea_cw_the_defence_of_the_north:0 "The Defence of the North"
 CAN_idea_cw_the_defence_of_the_north_desc:0 "A brigade group trained to parachute, to winter and to move, able to answer a lodgement anywhere between Alert and Churchill. There is no other army in the world fitted for that ground. There is also no other ground on which it is of the slightest use, and the alliance says so at every meeting."

 CAN_idea_cw_the_nato_cartridge:0 "The NATO Cartridge"
 CAN_idea_cw_the_nato_cartridge_desc:0 "The Belgian rifle in the American cartridge, made under licence at Long Branch. Every round and every barrel interchanges with those of eleven allies, which is worth more in a war than any rifle. Not one part of it was drawn in this country."

 CAN_idea_cw_the_british_rifle:0 "The Rifle Nobody Else Took"
 CAN_idea_cw_the_british_rifle_desc:0 "The bullpup in the intermediate calibre, which London adopted and then abandoned within the twelvemonth. Every trial the two armies ran said it was the better weapon. When the ammunition runs low there is not one ally on earth who can send a round that fits."

 CAN_idea_cw_national_service:0 "National Service"
 CAN_idea_cw_national_service_desc:0 "A term of service for every fit man of twenty, in time of peace, which no ministry has dared to ask for since 1917 and which two of them nearly fell for asking in war. The divisions exist. The country that has to be governed afterwards is not the same country."

 CAN_idea_cw_an_army_of_volunteers:0 "An Army of Volunteers"
 CAN_idea_cw_an_army_of_volunteers_desc:0 "Small, long-service, professional, and every man in it chose to be there. It is the best army this country has ever fielded for its size. It cannot be doubled in a year by any means the Ministry is prepared to use, and everybody in the alliance knows it."

 CAN_idea_cw_the_air_division:0 "No. 1 Air Division"
 CAN_idea_cw_the_air_division_desc:0 "Four wings in England, France and Germany, reckoned by their allies the best day fighter pilots in Europe. They are also six thousand kilometres from the country that pays for them, and the squadrons left at home to watch our own sky have the aircraft and the crews that these four wings did not want."

 CAN_idea_cw_a_line_of_our_own:0 "The Mid-Canada Line"
 CAN_idea_cw_a_line_of_our_own_desc:0 "Ninety-eight doppler stations along the fifty-fifth parallel, from the Labrador coast to the mountains. Canadian money, Canadian operators, Canadian ground. It costs more than the Treasury can comfortably find, and nobody will ever be able to say this part of the watch belongs to somebody else."

 CAN_idea_cw_let_washington_pay:0 "The Distant Early Warning Line"
 CAN_idea_cw_let_washington_pay_desc:0 "Sixty-three stations across three thousand miles of our Arctic, built in thirty months with another country's money and manned by that country's technicians. We could not have done it in ten years. What those stations see is reported to Colorado before it is reported to Ottawa."

 CAN_idea_cw_the_arrow:0 "The Arrow"
 CAN_idea_cw_the_arrow_desc:0 "A delta interceptor of Canadian design with an engine of Canadian design, faster and higher than anything flying anywhere. The programme costs more each year than the whole naval estimate, no foreign air force has ordered one, and a country of fifteen millions is paying for it alone."

 CAN_idea_cw_black_friday:0 "Black Friday"
 CAN_idea_cw_black_friday_desc:0 "Fourteen thousand men dismissed before noon, and the five finished aircraft cut up for scrap on the Ministry's own order so the question could not be reopened. The estimates are relieved. The design teams are at Seattle and Farnborough within the year, and they are not coming back."

 CAN_idea_cw_norad:0 "North American Air Defence"
 CAN_idea_cw_norad_desc:0 "One operational command for the sky of a continent, an American general at its head, a Canadian as his deputy. Our aircraft are safer than they have ever been. In the next crisis they will be brought to alert by a headquarters this Ministry does not command, and the Ministry will read about it in the papers."

 CAN_idea_cw_the_warheads:0 "Two Keys"
 CAN_idea_cw_the_warheads_desc:0 "The missiles at North Bay and La Macaza carry the only warhead ever designed for them, in a compound with two sentries of two nations, and neither may open the gate alone. The sky is genuinely defended. The cabinet has split upon it and the Ministry answers for weapons it cannot fire by itself."

 CAN_idea_cw_a_conventional_deterrent:0 "Sand and Concrete"
 CAN_idea_cw_a_conventional_deterrent_desc:0 "The missiles keep their ballast and the interceptors keep their cannon. The word given at the United Nations is kept, which is worth something at home and nothing at all in Paris or in Washington. Two squadrons stand at readiness with nothing to fire."

 CAN_idea_cw_a_navy_of_our_own:0 "A Navy of Our Own"
 CAN_idea_cw_a_navy_of_our_own_desc:0 "CANADA on the shoulder, the divisional system in every ship, and the officers trained here instead of at Dartmouth. The lower deck knows at last what navy it is in. The Admiralty's drawings, patterns and plans no longer come free with the relationship, and every ship this country has ever built was based upon them."

 CAN_idea_cw_the_customs_of_the_service:0 "The Customs of the Service"
 CAN_idea_cw_the_customs_of_the_service_desc:0 "The forms, the ranks, the language and the drawings remain as the Admiralty made them, because they work and because they arrive without a bill. The commission's finding was that the lower deck could not tell whose navy it served. That finding stands, and the recruiting officer in Rimouski explains it to a farmer's son every week."

 CAN_idea_cw_the_anti_submarine_specialists:0 "The Canadian Atlantic"
 CAN_idea_cw_the_anti_submarine_specialists_desc:0 "A Canadian admiral at Halifax holds a sub-area of the alliance's ocean: the only theatre command this country possesses anywhere on earth. It was bought by building a fleet for one task in one sea. There will never again be money for a navy that can do anything else."

 CAN_idea_cw_the_carrier:0 "A Deck of Our Own"
 CAN_idea_cw_the_carrier_desc:0 "Steam catapult, angled deck, mirror sight and jets: the most modern warship the country has ever owned. She is also two thousand men, a refit every third year, and an annual argument in the House about whether a middle power has any business owning a flight deck at all."

 CAN_idea_cw_no_more_flat_tops:0 "No More Flat-Tops"
 CAN_idea_cw_no_more_flat_tops_desc:0 "The carrier went back to the Admiralty and the money went into escorts, which is what the alliance asked for and what the North Atlantic actually requires. The fleet air arm is paid off, the pilots are dispersed, and nothing Canadian will fly from a Canadian deck again."
