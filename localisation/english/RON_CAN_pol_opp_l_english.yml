l_english:

 ### FOCUSES - THE QUARREL OF JURISDICTIONS

 CAN_ottawa_is_paramount:0 "Ottawa Is Paramount"
 CAN_ottawa_is_paramount_desc:0 "Confederation made one nation, not nine. The Dominion legislates for the whole and keeps the veto the Act of 1867 gave it. Toronto and Quebec will be told what the law is."
 CAN_the_compact_of_provinces:0 "The Compact of the Provinces"
 CAN_the_compact_of_provinces_desc:0 "The provinces made Confederation and Ottawa governs only what the founders lent it. Every advance is bought at a conference table, one premier at a time."
 CAN_the_power_of_disallowance:0 "The Power of Disallowance"
 CAN_the_power_of_disallowance_desc:0 "The Governor in Council may strike down a provincial statute within a year of it passing. It has been used well over a hundred times since 1867, and every use makes a premier an enemy."
 CAN_the_provinces_are_founders:0 "The Provinces Are Founders"
 CAN_the_provinces_are_founders_desc:0 "Say plainly that the Dominion is the creature of the provinces. The doctrine costs Ottawa its reach and buys the consent of the two governments that can break any policy."
 CAN_the_lieutenant_governor_reserves:0 "The Lieutenant-Governor Reserves"
 CAN_the_lieutenant_governor_reserves_desc:0 "He is a federal officer, not a provincial ornament. At Edmonton in 1937 three Social Credit bills on credit, bank taxation and the press are reserved. A dead letter brought back to life."
 CAN_the_conference_table:0 "The Conference Table"
 CAN_the_conference_table_desc:0 "The first Dominion-provincial conference since 1918 meets in November 1927 on resources, taxation and an amending formula. It agrees on nothing and settles that nothing moves without it."
 CAN_disallow_the_padlock_law:0 "Disallow the Padlock Law"
 CAN_disallow_the_padlock_law_desc:0 "Quebec may close for a year any premises used to propagate communism, with no definition, no trial and no appeal. Ottawa can annul it - and make Duplessis the martyr of provincial autonomy."
 CAN_property_and_civil_rights:0 "Property and Civil Rights"
 CAN_property_and_civil_rights_desc:0 "The padlock is a matter of property and civil rights, therefore provincial, therefore none of Ottawa's business. The law stands for twenty years and disallowance is never credible again."
 CAN_the_rowell_sirois_commission:0 "The Rowell-Sirois Commission"
 CAN_the_rowell_sirois_commission_desc:0 "A royal commission on Dominion-provincial relations, named in August 1937. All nine provinces are heard. It is asked to read the bargain of 1867 with the accounts of 1937 in front of it."
 CAN_the_national_adjustment_grants:0 "The National Adjustment Grants"
 CAN_the_national_adjustment_grants_desc:0 "The report of May 1940: Ottawa takes income, corporate and succession taxes, assumes the provincial debts, and pays every province enough to keep one national standard of service."
 CAN_the_conference_of_january:0 "The Conference of January"
 CAN_the_conference_of_january_desc:0 "Ontario, Alberta and British Columbia will not pay for the poor provinces. The conference on the report breaks up in two days, and the war does by order what negotiation could not."
 CAN_ottawa_assumes_the_debts:0 "Ottawa Assumes the Debts"
 CAN_ottawa_assumes_the_debts_desc:0 "The Dominion takes the provincial debt onto its own books. The credit of nine treasuries is repaired at a stroke, and the interest is paid out of a purse with no room left in it."
 CAN_a_bargain_with_each_province:0 "A Bargain with Each Province"
 CAN_a_bargain_with_each_province_desc:0 "No general settlement, then. Nine separate agreements, renewed and renegotiated, each one bought with a subsidy. Ottawa keeps its freedom of manoeuvre and loses the power to plan."

 ### FOCUSES - THE LEAGUE OF INDIANS AND THE PERSONS CASE

 CAN_the_league_of_indians:0 "The League of Indians of Canada"
 CAN_the_league_of_indians_desc:0 "December 1918, the Council House at Ohsweken. Frederick Ogilvie Loft, Mohawk and lieutenant of the expeditionary force, founds the first country-wide political body of the First Nations."
 CAN_hear_the_league:0 "Hear the League"
 CAN_hear_the_league_desc:0 "Loft asks for the vote without loss of status, for control of reserve lands and for schools worth the name. Granting it costs the department its authority and gains the country citizens."
 CAN_the_amendment_of_1927:0 "The Amendment of 1927"
 CAN_the_amendment_of_1927_desc:0 "Forbid the raising of money to pursue a land claim without the department's leave. The League cannot pay a lawyer, and a grievance that cannot be argued in court is argued nowhere."
 CAN_the_persons_case:0 "The Persons Case"
 CAN_the_persons_case_desc:0 "Five women of Alberta ask whether a woman is a person under section 24. The Supreme Court says no. On 18 October 1929 London says yes, and calls the constitution a living tree."
 CAN_a_woman_in_the_senate:0 "A Woman in the Senate"
 CAN_a_woman_in_the_senate_desc:0 "Cairine Wilson takes her seat in February 1930, four months after the judgement. The upper house is opened by a decision no Canadian court was willing to give."
 CAN_the_last_province_to_yield:0 "The Last Province to Yield"
 CAN_the_last_province_to_yield_desc:0 "Manitoba in January 1916, Quebec on 25 April 1940. Twenty-four years to finish what the first province began, and an electorate that is at last the whole country."

 ### FOCUSES - THE LABOUR REVOLT AND THE COAL FIELDS

 CAN_the_general_strike:0 "The General Strike"
 CAN_the_general_strike_desc:0 "15 May 1919: the building and metal trades walk out over recognition and wages, and some thirty thousand follow them in a city of a hundred and seventy-five thousand people."
 CAN_the_specials_on_main_street:0 "The Specials on Main Street"
 CAN_the_specials_on_main_street_desc:0 "21 June: the mounted police ride into a silent parade and open fire, and special constables clear the street. Two dead, the strike ends on the twenty-fifth, and labour has its legend."
 CAN_the_strike_committee_wins:0 "The Strike Committee Wins"
 CAN_the_strike_committee_wins_desc:0 "Concede collective bargaining and the strike ends without a charge. The employers of Winnipeg lose the principle they went to war over and get their city back in working order."
 CAN_deport_the_agitators:0 "Deport the Agitators"
 CAN_deport_the_agitators_desc:0 "The Immigration Act is amended in three days so that a British subject not born here can be put on a ship. Section 98 does the rest, and stays on the books for seventeen years."
 CAN_labour_men_in_the_house:0 "Labour Men in the House"
 CAN_labour_men_in_the_house_desc:0 "Russell serves two years; Queen and Ivens are elected while in prison; Woodsworth takes Winnipeg North Centre in 1921. The strike is answered in the Commons instead of the street."
 CAN_the_troops_in_the_collieries:0 "The Troops in the Collieries"
 CAN_the_troops_in_the_collieries_desc:0 "BESCO announces a cut of about thirty-seven per cent in January 1922 and restricts output. Militia and provincial police go into the Cape Breton pits and the company gets its coal."
 CAN_bring_besco_to_terms:0 "Bring BESCO to Terms"
 CAN_bring_besco_to_terms_desc:0 "No soldiers, and a settlement instead: by the autumn the cut is back to about twenty per cent. Standing the gaff was the miners' phrase, and this time they did not have to."
 CAN_the_duncan_commission:0 "The Duncan Commission"
 CAN_the_duncan_commission_desc:0 "Sir Andrew Rae Duncan reports in 1926 on the claims of the Maritimes: lower freight rates on the eastern lines, larger federal subsidies, and support for the winter ports."

 ### FOCUSES - ON TO OTTAWA

 CAN_the_on_to_ottawa_trek:0 "On to Ottawa"
 CAN_the_on_to_ottawa_trek_desc:0 "A thousand men leave the British Columbia relief camps on the freight cars in June 1935. They are two thousand by Regina, where the railways are forbidden to carry them any further."
 CAN_stop_them_at_regina:0 "Stop Them at Regina"
 CAN_stop_them_at_regina_desc:0 "Take the leaders at their meeting in the market square on 1 July. The riot lasts hours: a city detective is killed, dozens hurt, some hundred and twenty arrested. The election is in October."
 CAN_receive_the_delegation:0 "Receive the Delegation"
 CAN_receive_the_delegation_desc:0 "Hear the eight delegates out, close the camps, hand relief back to the provinces. The march dissolves for want of an enemy, and the twenty cents a day goes with it."

 ### TOOLTIPS

 CAN_the_power_of_disallowance_tt:0 "Any provincial statute may be annulled by order in council within a year of passing"
 CAN_the_lieutenant_governor_reserves_tt:0 "Provincial bills may be reserved for the pleasure of the Governor General"
 CAN_the_conference_table_tt:0 "No federal measure touching a provincial field without a conference first"
 CAN_ottawa_assumes_the_debts_tt:0 "The debts of the nine provinces pass to the books of the Dominion"
 CAN_a_bargain_with_each_province_tt:0 "Nine separate agreements in place of one settlement"
 CAN_the_league_of_indians_tt:0 "The First Nations acquire a voice the department has to answer"
 CAN_a_woman_in_the_senate_tt:0 "The Senate of Canada is opened to women."
 CAN_labour_men_in_the_house_tt:0 "Winnipeg returns its strike leaders to Parliament"
 CAN_the_duncan_commission_tt:0 "Freight rates fall on the Maritime lines and the federal subsidies rise"
 CAN_the_on_to_ottawa_trek_tt:0 "The relief camps stop being an administrative detail"

 ### IDEAS

 CAN_idea_ottawa_is_paramount:0 "Ottawa Is Paramount"
 CAN_idea_ottawa_is_paramount_desc:0 "One government does the deciding and the other nine do the arithmetic. It works until the day a premier decides to find out whether it is true."
 CAN_idea_a_compact_of_founders:0 "A Compact of Founders"
 CAN_idea_a_compact_of_founders_desc:0 "Nine signatures on everything that matters. The country is quieter than it has any right to be, and slower than it can afford."
 CAN_idea_the_disallowance_power:0 "The Power of Disallowance"
 CAN_idea_the_disallowance_power_desc:0 "A weapon that works only while it is not used. Every province keeps a lawyer employed on the question of when it will be."
 CAN_idea_the_founders_doctrine:0 "The Doctrine of the Founders"
 CAN_idea_the_founders_doctrine_desc:0 "Ottawa holds what was lent to it and asks before taking more. The premiers are gracious; the Dominion is small."
 CAN_idea_the_reserved_bill:0 "The Reserved Bill"
 CAN_idea_the_reserved_bill_desc:0 "A statute passed by an elected assembly stopped by a man nobody elected. The West will remember it for thirty years."
 CAN_idea_the_conference_table:0 "The Conference Table"
 CAN_idea_the_conference_table_desc:0 "Everything is negotiable and nothing is settled. The premiers arrive with grievances and leave with communiques."
 CAN_idea_the_disallowance_used:0 "Disallowance Used"
 CAN_idea_the_disallowance_used_desc:0 "The padlocks came off, and a province learned that its legislature can be overruled from Ottawa. One of those facts is popular."
 CAN_idea_property_and_civil_rights:0 "Property and Civil Rights"
 CAN_idea_property_and_civil_rights_desc:0 "A constitutional formula that buys peace with a province and costs a printer his press. It will be quoted for twenty years."
 CAN_idea_the_rowell_sirois_inquiry:0 "The Rowell-Sirois Inquiry"
 CAN_idea_the_rowell_sirois_inquiry_desc:0 "Nine provinces, hundreds of briefs, a small army of economists. Nothing can be decided until it reports, which is exactly the point."
 CAN_idea_national_adjustment_grants:0 "National Adjustment Grants"
 CAN_idea_national_adjustment_grants_desc:0 "A poor province can now pay a teacher. Ottawa collects the taxes, carries the debts and hears about it at every election."
 CAN_idea_nine_governments:0 "Nine Governments"
 CAN_idea_nine_governments_desc:0 "The report is dead and the country still has one national economy and nine treasuries pulling against it."
 CAN_idea_the_debts_of_the_provinces:0 "The Debts of the Provinces"
 CAN_idea_the_debts_of_the_provinces_desc:0 "Every provincial bond is now a federal bond. Construction is cheap again and the Minister of Finance has stopped sleeping."
 CAN_idea_bargain_by_bargain:0 "Bargain by Bargain"
 CAN_idea_bargain_by_bargain_desc:0 "Nine agreements, nine expiry dates, nine chances to be held to ransom. It is flexible, which is another word for unplanned."
 CAN_idea_a_hearing_at_last:0 "A Hearing at Last"
 CAN_idea_a_hearing_at_last_desc:0 "The bands are heard as petitioners with standing rather than wards with grievances. The department has lost a habit it valued."
 CAN_idea_the_ban_on_claims:0 "The Ban on Claims"
 CAN_idea_the_ban_on_claims_desc:0 "No money may be raised to argue a land claim. The claims do not go away; they simply stop being arguable."
 CAN_idea_the_living_tree:0 "A Living Tree"
 CAN_idea_the_living_tree_desc:0 "The constitution is capable of growth within its natural limits. Every advocate in the country has just been handed a key."
 CAN_idea_the_whole_electorate:0 "The Whole Electorate"
 CAN_idea_the_whole_electorate_desc:0 "Every adult in every province may vote. A government that wants something from the country must now ask all of it."
 CAN_idea_bloody_saturday:0 "Bloody Saturday"
 CAN_idea_bloody_saturday_desc:0 "Order was restored in about an hour and will be paid for over twenty years. The shops are open and the shops are watched."
 CAN_idea_collective_bargaining_conceded:0 "Collective Bargaining Conceded"
 CAN_idea_collective_bargaining_conceded_desc:0 "The union is at the table twenty-five years early. Wages are settled by negotiation, which is slower and dearer than by notice."
 CAN_idea_deportation_powers:0 "Powers of Deportation"
 CAN_idea_deportation_powers_desc:0 "A man born in Glasgow can be removed from Winnipeg without a trial. Sedition is manageable; so is any other opinion."
 CAN_idea_labour_in_parliament:0 "Labour in Parliament"
 CAN_idea_labour_in_parliament_desc:0 "The men who ran the strike now ask questions on the floor. It is a cheaper way of being answered, and a slower one."
 CAN_idea_the_company_town:0 "The Company Town"
 CAN_idea_the_company_town_desc:0 "The coal comes up, the store keeps the books, and the garrison keeps the peace. Cape Breton is producing and it is not forgiving."
 CAN_idea_standing_the_gaff:0 "Standing the Gaff"
 CAN_idea_standing_the_gaff_desc:0 "The cut was rolled back and the pits went on working. The company has learned that Ottawa will not always send soldiers."
 CAN_idea_the_duncan_award:0 "Maritime Rights"
 CAN_idea_the_duncan_award_desc:0 "Lower rates on the eastern lines and a larger cheque from Ottawa. The exodus to Boston slows; it does not stop."
 CAN_idea_the_market_square:0 "The Market Square"
 CAN_idea_the_market_square_desc:0 "A detective dead, a hundred and twenty men in cells, and a photograph that will do more campaigning than any speech."
 CAN_idea_the_camps_are_closed:0 "The Camps Are Closed"
 CAN_idea_the_camps_are_closed_desc:0 "Twenty cents a day is over and the relief is the provinces' affair again. They have the duty; Ottawa keeps the revenue."

 ### PRESS

 CAN_news_200_t:0 "OTTAWA CLAIMS THE LAST WORD"
 CAN_news_200_d:0 "The Dominion government states that where its law meets a provincial statute, the statute yields. Queen's Park and Quebec answer that Confederation was a bargain and not a surrender."
 CAN_news_201_t:0 "PADLOCK LAW STRUCK DOWN FROM OTTAWA"
 CAN_news_201_d:0 "An order in council annuls the Quebec statute against communist propaganda. The Premier calls it an assault on the province; the Attorney General's padlocks come off doors in Montreal."
 CAN_news_202_t:0 "OTTAWA WILL NOT TOUCH THE PADLOCK"
 CAN_news_202_d:0 "The Minister of Justice holds that closing premises is a matter of property and civil rights, and therefore Quebec's affair. The law stands, and so does the silence around it."
 CAN_news_203_t:0 "COMMISSION TO RE-READ CONFEDERATION"
 CAN_news_203_d:0 "A royal commission will hear all nine provinces on the division of powers and revenues. The poor provinces and the rich ones alike expect to be told that they were right all along."
 CAN_news_204_t:0 "CONFERENCE COLLAPSES IN TWO DAYS"
 CAN_news_204_d:0 "Ontario, Alberta and British Columbia refuse the report. The adjustment grants die at the table, and Ottawa will take by wartime order what it could not obtain by agreement."
 CAN_news_205_t:0 "THE BANDS ORGANISE AT OHSWEKEN"
 CAN_news_205_d:0 "A returned lieutenant of the expeditionary force has founded a league of the bands, from the Grand River to the prairies. It asks for the vote without loss of status and for its own schools."
 CAN_news_206_t:0 "WOMEN ARE PERSONS, LONDON RULES"
 CAN_news_206_d:0 "The Judicial Committee reverses the Supreme Court of Canada. The word persons in section 24 includes women, and the British North America Act is called a tree capable of growth."
 CAN_news_207_t:0 "THIRTY THOUSAND OUT IN WINNIPEG"
 CAN_news_207_d:0 "The trades council has called a general strike. The committee licenses the milk and bread wagons, a citizens' committee speaks for order, and both sides claim to be the city itself."
 CAN_news_208_t:0 "MOUNTED POLICE CHARGE ON MAIN STREET"
 CAN_news_208_d:0 "The parade was silent when the horses came through it. Two men are dead, special constables hold the street, and the strike committee has called the whole thing off."
 CAN_news_209_t:0 "RIOT IN THE REGINA MARKET SQUARE"
 CAN_news_209_d:0 "Police moved to take the leaders of the trekkers at a public meeting. A city detective is dead, the square was fought over for hours, and some hundred and twenty men are in custody."
