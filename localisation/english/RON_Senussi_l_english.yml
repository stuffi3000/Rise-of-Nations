l_english:
 SEO_the_order_of_the_lodges:0 "The Order of the Lodges"
 SEO_the_order_of_the_lodges_desc:0 "A hundred and forty-six zawiyas from the Jebel Akhdar to Lake Chad, each one a school, a court, a caravanserai and a granary. There is no capital among them, and that is not an oversight."
 SEO_the_lodges_of_kanem:0 "The Lodges of Kanem"
 SEO_the_lodges_of_kanem_desc:0 "The southern march feeds the whole Order: salt north, slaves and ivory north, cloth and rifles south. It is also the one ring a European column can reach on foot."
 SEO_the_lodges_shall_not_be_forts:0 "The Lodges Shall Not Be Forts"
 SEO_the_lodges_shall_not_be_forts_desc:0 "Empty them before the column arrives. Five lodges lost and not one man, because a lodge is a school and a school that is defended is a fort, and a fort can be taken."
 SEO_hold_bir_alali:0 "Hold Bir Alali"
 SEO_hold_bir_alali_desc:0 "Stand and fight the French in the open. The southern ring keeps its caravans, and the Order has done the one thing it spent forty years not doing: presented a target."
 SEO_the_university_of_the_sands:0 "The University of the Sands"
 SEO_the_university_of_the_sands_desc:0 "Jaghbub teaches law, theology, astronomy and the desert. Every graduate founds a lodge, and every lodge founds a school, and that is the whole reproduction of the Order."
 SEO_the_pilgrim_road:0 "The Pilgrim Road"
 SEO_the_pilgrim_road_desc:0 "Every year the road to Mecca carries our men through Sudan and the Hejaz, and every year some of them stay and build. Our reach grows in countries we do not hold a metre of."
 SEO_the_sultans_firman:0 "The Sultan's Firman"
 SEO_the_sultans_firman_desc:0 "Constantinople acknowledges the Order as a partner rather than a subject. A suzerain a thousand miles away and unable to send a battalion is the cheapest sovereign anyone ever had."
 SEO_the_tithe_and_the_toll:0 "The Tithe and the Toll"
 SEO_the_tithe_and_the_toll_desc:0 "A tenth of the harvest and a levy on every caravan through our wells. It is not taxation, because there is no state to tax, and it pays for everything."
 SEO_the_caravans_of_wadai:0 "The Caravans of Wadai"
 SEO_the_caravans_of_wadai_desc:0 "The Benghazi-Wadai road is the last great trans-Saharan route still working, and we own every well on it. It works for exactly as long as the southern ring holds."
 SEO_the_tribes_answer_the_lodge:0 "The Tribes Answer the Lodge"
 SEO_the_tribes_answer_the_lodge_desc:0 "The sheikh calls and eight thousand men come with their own rifles and their own camels. In ninety days they go home again, and there is nothing anyone can do about that."
 SEO_the_succession_of_al_mahdi:0 "The Succession of al-Mahdi"
 SEO_the_succession_of_al_mahdi_desc:0 "The Grand Senussi is dead and his son is twelve. The nephew is thirty-eight and has commanded in the field. Neither answer is safe."
 SEO_the_nephew_who_can_lead:0 "The Nephew Who Can Lead"
 SEO_the_nephew_who_can_lead_desc:0 "Ahmed Sharif takes the Order. He is a soldier, he believes the brotherhood should fight, and under him it will never be anything but a brotherhood."
 SEO_the_son_of_the_mahdi:0 "The Son of the Mahdi"
 SEO_the_son_of_the_mahdi_desc:0 "The boy keeps the title and the ikhwan govern in council until he is grown. It is slow, it is quarrelsome, and it is the only arrangement nobody can behead."
 SEO_the_jihad_proclaimed:0 "The Jihad Proclaimed"
 SEO_the_jihad_proclaimed_desc:0 "Italy has landed and the Ottoman garrison has gone home. The Order becomes the actual government of Cyrenaica because there is nobody else left to be it."
 SEO_the_officers_from_stamboul:0 "The Officers from Stamboul"
 SEO_the_officers_from_stamboul_desc:0 "Enver's men bring a staff, field guns and a chain of command. All three make us stronger, and all three can be captured in an afternoon."
 SEO_we_fight_as_bedouin:0 "We Fight as Bedouin"
 SEO_we_fight_as_bedouin_desc:0 "No foreign cadres, no fixed positions, no depot worth a raid. We will never hold a line and we will never lose one."
 SEO_the_officers_who_stayed:0 "The Officers Who Stayed"
 SEO_the_officers_who_stayed_desc:0 "Constantinople signs at Ouchy and we do not. The staff stays, the guns stay, the depots stay, and the Order is a belligerent in its own name for the first time."
 SEO_the_blockade_runners:0 "The Blockade Runners"
 SEO_the_blockade_runners_desc:0 "The coast is Italian and the caravan toll is gone, so the goods come overland from Egypt in small parties. It replaces perhaps a third of what we lost."
 SEO_a_field_army_at_last:0 "A Field Army at Last"
 SEO_a_field_army_at_last_desc:0 "Five to ten thousand men in formation, with artillery and a supply train. It is the strongest the Order has ever been and the first time it can be destroyed in one battle."
 SEO_the_call_of_the_caliph:0 "The Call of the Caliph"
 SEO_the_call_of_the_caliph_desc:0 "Turn east and attack the British in Egypt. Our Egyptian lodges become a front, and a ring that becomes a front stops being a ring: they will be broken up, and they will not be rebuilt."
 SEO_strike_the_italian_first:0 "Strike the Italian First"
 SEO_strike_the_italian_first_desc:0 "Idris was right. The enemy is on our coast, not on the Nile, and the Egyptian lodges are worth more feeding this war than fighting one of their own."
 SEO_the_lodges_stay_shut:0 "The Lodges Stay Shut"
 SEO_the_lodges_stay_shut_desc:0 "No foreign war of any kind. The Order ends the world war with more zawiyas than it began with and not one line in anybody's despatches."
 SEO_the_sharif_holds_fast:0 "The Sharif Holds Fast"
 SEO_the_sharif_holds_fast_desc:0 "The Order stays what it has always been: a movement across four countries, answerable to no chancellery, capable of no treaty, and impossible to defeat."
 SEO_the_abdication_of_ahmed_sharif:0 "The Abdication of Ahmed Sharif"
 SEO_the_abdication_of_ahmed_sharif_desc:0 "The Egyptian campaign has ruined us and the Sharif goes into exile. Idris takes the Order and will negotiate, which is what he has wanted since 1916."
 SEO_the_modus_vivendi_of_acroma:0 "The Modus Vivendi of Acroma"
 SEO_the_modus_vivendi_of_acroma_desc:0 "Idris is recognised emir of Cyrenaica by the power occupying it. It is a real title, issued by somebody else, and it is the first thing the Order has ever owned that can be revoked."
 SEO_the_accord_of_al_rajma:0 "The Accord of al-Rajma"
 SEO_the_accord_of_al_rajma_desc:0 "A title, an autonomous administration, a police force and an Italian stipend. Everything the Order has never had, and every one of them a place for a hand to close."
 SEO_no_seal_no_stipend:0 "No Seal, No Stipend"
 SEO_no_seal_no_stipend_desc:0 "Refuse the title and the money with it. There will be no administration, no salary and no argument later about who was paying whom."
 SEO_the_call_from_tripolitania:0 "The Call from Tripolitania"
 SEO_the_call_from_tripolitania_desc:0 "The Tripolitanian republic offers Idris its emirate. A united Libya twenty-nine years early, and a war with Rome to hold it together."
 SEO_the_house_in_cairo:0 "The House in Cairo"
 SEO_the_house_in_cairo_desc:0 "The Order moves its seat for the third time in one lifetime, and for the first time it chooses. Exile is a place to work from, not a thing that happens to you."
 SEO_the_jaghbub_question:0 "The Jaghbub Question"
 SEO_the_jaghbub_question_desc:0 "London and Rome settle the Egyptian frontier between them and the founding oasis ends up on the Italian side. There is no battle to fight about it and no room we are in."
 SEO_the_jebel_is_our_fortress:0 "The Jebel Is Our Fortress"
 SEO_the_jebel_is_our_fortress_desc:0 "Caves, ravines and cisterns that only we know. Ambush, disperse, refuse the pitched battle, and let the ground do what an army would have to."
 SEO_the_tithe_that_feeds_the_jebel:0 "The Tithe That Feeds the Jebel"
 SEO_the_tithe_that_feeds_the_jebel_desc:0 "Every round, every sack of barley and every scrap of intelligence comes from the tribes below. It is the strength of the resistance and it is exactly what the camps are built to sever."
 SEO_treat_with_badoglio:0 "Treat with Badoglio"
 SEO_treat_with_badoglio_desc:0 "Talk, and the deportation of 1930 does not happen: a hundred thousand Bedouin are not marched to the coast and forty thousand of them do not die there. The war ends, the Order lives, and the man who signed carries it."
 SEO_no_terms_with_rome:0 "No Terms with Rome"
 SEO_no_terms_with_rome_desc:0 "Fight on. Everything that follows is on the record and none of it is a gain."
 SEO_the_last_citadel:0 "The Last Citadel"
 SEO_the_last_citadel_desc:0 "Kufra. The archives and the treasury go out into the desert by night while the oasis is held by men who know exactly how it ends."
 SEO_the_ledger_of_the_dead:0 "The Ledger of the Dead"
 SEO_the_ledger_of_the_dead_desc:0 "Count the camps, name the dead, record the herds destroyed. It is the only thing the Order can still produce, and in 1942 it will be the only thing anyone in London wants to see."
 SEO_the_men_of_the_camps:0 "The Men of the Camps"
 SEO_the_men_of_the_camps_desc:0 "The register stops counting buildings and starts counting people. Twenty thousand exiles in Egypt are what is left of a hundred and forty-six lodges."
 SEO_the_alms_of_the_faithful:0 "The Alms of the Faithful"
 SEO_the_alms_of_the_faithful_desc:0 "Egypt, Sudan and the Hejaz still send what they can to the house in Cairo. It is the last income the Order has and it arrives without a single condition attached."
 SEO_the_five_battalions:0 "The Five Battalions"
 SEO_the_five_battalions_desc:0 "Five battalions of exiles, paid, armed and rationed by the British Army. They will fight well, they will be owed a country, and the debt runs both ways."
 SEO_we_are_no_mans_askari:0 "We Are No Man's Askari"
 SEO_we_are_no_mans_askari_desc:0 "No foreign flag and no foreign wage. When the maps are redrawn we will owe nothing, and we will not be in the room."
 SEO_the_word_of_mr_eden:0 "The Word of Mr Eden"
 SEO_the_word_of_mr_eden_desc:0 "A public undertaking in the House of Commons that Cyrenaica shall not return to Italian rule. A promise, from a government, about a place: the Order has never had one of those."
 SEO_the_brotherhood_endures:0 "The Brotherhood Endures"
 SEO_the_brotherhood_endures_desc:0 "In 1949 the Order is what it was in 1900: lodges, schools, wells and a name that carries from Benghazi to Lake Chad. It has no state, and there has never been anything to seize."
 SEO_the_emirate_proclaimed:0 "The Emirate Proclaimed"
 SEO_the_emirate_proclaimed_desc:0 "Benghazi, a government, a prime minister and a flag. Fifty years of surviving by being ungraspable, ended by an announcement."
 SEO_the_three_provinces:0 "The Three Provinces"
 SEO_the_three_provinces_desc:0 "Cyrenaica, Tripolitania and the Fezzan under one crown. A country with a border, a budget and an army, which is three more things to lose than the Order has ever had."
 SEO_cyrenaica_alone:0 "Cyrenaica Alone"
 SEO_cyrenaica_alone_desc:0 "A small emirate that governs people it actually knows, and lets a patron handle the rest. It is modest, it is coherent, and it is somebody's client."
 SEO_idea_the_register_of_the_lodges:0 "The Register of the Lodges"
 SEO_idea_the_register_of_the_lodges_desc:0 "A hundred and forty-six zawiyas across five rings, three of them on other states' soil. This is the country: there is no other."
 SEO_idea_the_university_of_the_sands:0 "The University of the Sands"
 SEO_idea_the_university_of_the_sands_desc:0 "Jaghbub teaches and Jaghbub sends out, and the Order reproduces itself faster than any column can burn it down."
 SEO_idea_the_pilgrim_road:0 "The Pilgrim Road"
 SEO_idea_the_pilgrim_road_desc:0 "Our influence travels with the hajj and settles wherever it stops. None of it is on any map of our territory, because we have none."
 SEO_idea_a_suzerain_who_cannot_reach_us:0 "A Suzerain Who Cannot Reach Us"
 SEO_idea_a_suzerain_who_cannot_reach_us_desc:0 "Constantinople is our sovereign, a thousand miles away, and could not send a battalion here if it wished to."
 SEO_idea_the_collegial_regency:0 "The Collegial Regency"
 SEO_idea_the_collegial_regency_desc:0 "The ikhwan govern in council until the boy is grown. Nothing is decided quickly and nothing can be decided by killing one man."
 SEO_idea_the_tithe_and_the_toll:0 "The Tithe and the Toll"
 SEO_idea_the_tithe_and_the_toll_desc:0 "A tenth of the harvest and a levy on every caravan. It is not taxation, because there is no state here to levy it."
 SEO_idea_the_caravans_of_wadai:0 "The Caravans of Wadai"
 SEO_idea_the_caravans_of_wadai_desc:0 "The last working trans-Saharan route, and every well on it is ours."
 SEO_idea_we_fight_as_bedouin:0 "We Fight as Bedouin"
 SEO_idea_we_fight_as_bedouin_desc:0 "No cadres, no positions, no depot worth raiding. We will never hold a line and we will never lose one."
 SEO_idea_the_blockade_runners:0 "The Blockade Runners"
 SEO_idea_the_blockade_runners_desc:0 "Small parties out of Egypt by night, carrying about a third of what the toll used to bring."
 SEO_idea_the_stipend_of_al_rajma:0 "The Stipend of al-Rajma"
 SEO_idea_the_stipend_of_al_rajma_desc:0 "A title, an administration and a wage, all three issued by the power occupying the country."
 SEO_idea_no_seal_no_stipend:0 "No Seal, No Stipend"
 SEO_idea_no_seal_no_stipend_desc:0 "No title, no salary and no argument later about who was paying whom."
 SEO_idea_the_jebel_is_our_fortress:0 "The Jebel Is Our Fortress"
 SEO_idea_the_jebel_is_our_fortress_desc:0 "Caves, ravines and cisterns only we know. The ground does the work an army would have to."
 SEO_idea_the_tithe_that_feeds_the_jebel:0 "The Tithe That Feeds the Jebel"
 SEO_idea_the_tithe_that_feeds_the_jebel_desc:0 "Every round and every sack of barley comes up from the tribes below, which is precisely why the tribes will be moved."
 SEO_idea_the_truce_that_saved_the_tribes:0 "The Truce That Saved the Tribes"
 SEO_idea_the_truce_that_saved_the_tribes_desc:0 "A hundred thousand Bedouin were not marched to the coast. The Order stopped fighting to arrange it, and is reminded of both halves of that sentence daily."
 SEO_idea_the_house_in_cairo:0 "The House in Cairo"
 SEO_idea_the_house_in_cairo_desc:0 "A seat, a press, a treasury and a delegation, in a city nobody can besiege us in."
 SEO_idea_the_ledger_of_the_dead:0 "The Ledger of the Dead"
 SEO_idea_the_ledger_of_the_dead_desc:0 "Names, dates, camps and herds, written down while it was happening. It is all the Order has and it will turn out to be enough."
 SEO_idea_the_alms_of_the_faithful:0 "The Alms of the Faithful"
 SEO_idea_the_alms_of_the_faithful_desc:0 "Egypt, Sudan and the Hejaz send what they can, and attach nothing to it."
 SEO_idea_the_brotherhood_endures:0 "The Brotherhood Endures"
 SEO_idea_the_brotherhood_endures_desc:0 "No capital, no budget, no border and no standing army. Fifty years of powers trying, and nothing they could put a hand on."
 SEO_the_order_of_the_lodges_tt:0 "Opens the register: 146 lodges across five rings, statehood 5."
 SEO_the_lodges_of_kanem_tt:0 "Five lodges added to the southern march. Caravan revenue and strategic depth."
 SEO_the_lodges_shall_not_be_forts_tt:0 "Five lodges lost in the southern ring and no men at all. Statehood unchanged."
 SEO_hold_bir_alali_tt:0 "The southern ring keeps its caravans. Statehood +8, and a European army has seen the Order in the open."
 SEO_the_university_of_the_sands_tt:0 "Two lodges a year for as long as Jaghbub is held, and one advisor slot."
 SEO_the_pilgrim_road_tt:0 "Four lodges in the outer wing now, and one a year afterwards with no ceiling."
 SEO_the_sultans_firman_tt:0 "Statehood +5, the cheapest five in the tree. Ottoman opinion +50."
 SEO_the_tithe_and_the_toll_tt:0 "Political power scaled to the register, and the repeatable decision Found a Lodge."
 SEO_the_caravans_of_wadai_tt:0 "The southern ring's caravan yield doubles for as long as the ring holds."
 SEO_the_tribes_answer_the_lodge_tt:0 "An immediate free levy. It dissolves after ninety days and cannot be called again at will."
 SEO_the_succession_of_al_mahdi_tt:0 "No effect of its own: this is a door, not a gain."
 SEO_the_nephew_who_can_lead_tt:0 "Ahmed Sharif leads. Statehood is capped at forty for the rest of the game."
 SEO_the_son_of_the_mahdi_tt:0 "A collegial regency of the ikhwan: slower to decide, impossible to behead."
 SEO_the_jihad_proclaimed_tt:0 "Statehood +10 and twenty-five points of war support. The Order is now the government of Cyrenaica."
 SEO_the_officers_from_stamboul_tt:0 "Statehood +12. A staff, artillery and a chain of command, all three capturable."
 SEO_we_fight_as_bedouin_tt:0 "Desert mobility kept permanently. No defensive line will ever be held."
 SEO_the_officers_who_stayed_tt:0 "Statehood +15. The Order repudiates Ouchy and keeps the staff, the guns and the depots."
 SEO_the_blockade_runners_tt:0 "Roughly a third of the lost toll, carried overland from Egypt."
 SEO_a_field_army_at_last_tt:0 "Statehood +18. The strongest the Order has been, and the first time it can be destroyed in one battle."
 SEO_the_call_of_the_caliph_tt:0 "The Egyptian ring is razed and marked amputated. Nothing in this file rebuilds it."
 SEO_strike_the_italian_first_tt:0 "A tenth of the Jebel ring spent. The Egyptian ring is left whole to feed the war."
 SEO_the_lodges_stay_shut_tt:0 "No ring consumed and ten lodges added across the five. The Order stays unseizable."
 SEO_the_sharif_holds_fast_tt:0 "The Order remains transnational, and statehood stays capped at forty."
 SEO_the_abdication_of_ahmed_sharif_tt:0 "Idris takes the Order, and the cap on statehood lifts."
 SEO_the_modus_vivendi_of_acroma_tt:0 "Statehood +20. A title issued by the power occupying the country, and revocable by it."
 SEO_the_accord_of_al_rajma_tt:0 "Statehood +30 and five lodges spent. A title, an administration and a stipend, and a handle for each."
 SEO_no_seal_no_stipend_tt:0 "Statehood locked under thirty for the whole era. No stipend, and nothing to take."
 SEO_the_call_from_tripolitania_tt:0 "Statehood +20. A united Libya twenty-nine years early, and a war with Rome to hold it."
 SEO_the_house_in_cairo_tt:0 "A seat, a press and a treasury in a city nobody can besiege. Exile is played, not suffered."
 SEO_the_jaghbub_question_tt:0 "Six lodges lost in the oasis ring, by a treaty between two other powers."
 SEO_the_jebel_is_our_fortress_tt:0 "Ambush, dispersion and the ground. No pitched battle and no line held."
 SEO_the_tithe_that_feeds_the_jebel_tt:0 "Supply and manpower from the tribes below - which is what the camps of 1930 exist to cut."
 SEO_treat_with_badoglio_tt:0 "Statehood +10. The deportation does not happen, and the Order stops fighting to arrange it."
 SEO_no_terms_with_rome_tt:0 "The war continues. The 1930-1933 chain arms in full, and none of it is a gain."
 SEO_the_last_citadel_tt:0 "Eight lodges lost in the oasis ring. The archives and the treasury go out across the desert."
 SEO_the_ledger_of_the_dead_tt:0 "The camps counted and the dead named. The only asset the Order has left, and it is made of names."
 SEO_the_men_of_the_camps_tt:0 "The register counts men instead of buildings. Eight added to the Egyptian ring."
 SEO_the_alms_of_the_faithful_tt:0 "The last income, and the only one that arrives with no condition attached."
 SEO_the_five_battalions_tt:0 "Statehood +25 and five lodges spent. Paid, armed and fed by London, and owed to London."
 SEO_we_are_no_mans_askari_tt:0 "No foreign wage and no obligation. Statehood stays where it is."
 SEO_the_word_of_mr_eden_tt:0 "Statehood +15. A public undertaking, from a government, about a place."
 SEO_the_brotherhood_endures_tt:0 "Statehood set to 10. The Order ends as it began, and there was never anything to seize."
 SEO_the_emirate_proclaimed_tt:0 "Statehood +30. Benghazi, a government and a flag."
 SEO_the_three_provinces_tt:0 "Statehood +25. A country with a border, a budget and an army: three more things to lose."
 SEO_cyrenaica_alone_tt:0 "Statehood +10. A small, coherent emirate, and somebody's client."
