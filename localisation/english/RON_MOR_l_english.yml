l_english:

 ############################################################
 # RON_MOR - Morocco national focus trees (all five eras)
 # Source: docs/nations/maroc/02_SQUELETTE.md
 # New keys only. Nothing here overwrites RON_Morocco_l_english.yml,
 # which covers the legacy DNC_MOR_* tree and the MOR_debt* ideas.
 ############################################################

 ############################################################
 # ERA DNC (1900-1909) - RON_Maroc_DNC
 ############################################################

 MOR_dnc_the_tertib:0 "The Tertib"
 MOR_dnc_the_tertib_desc:0 "A single agricultural tax, assessed the same way from Oujda to the Sous, replacing the tangle of Quranic dues and arbitrary levies. It is the first modern fiscal instrument the Makhzen has ever owned. It is also the first that Europeans and their protected clients are exempt from paying, which means every dirham it raises is taken from a Moroccan and every dirham it fails to raise is a gift to a foreigner."
 MOR_dnc_the_tertib_tt:0 "A permanent tax base is established.\nEuropean residents and protege lists are exempt: consumer goods cost rises.\nUnlocks the repeatable decision Revoke a Protege List - one point of tax base recovered, one diplomatic crisis opened."

 MOR_dnc_the_sultans_harka:0 "The Sultan's Harka"
 MOR_dnc_the_sultans_harka_desc:0 "The old way. The tax comes in where the army camps and nowhere else, so the army marches, and the column that collects this year will have to collect again next year. It costs nothing to set up, it yields at once, and it teaches every tribe it visits exactly what the Sultan's authority is made of."
 MOR_dnc_the_sultans_harka_tt:0 "No permanent tax base: the levy must be repeated every year.\nUnlocks the repeatable decision Send the Harka - one state's tax against manpower, at the price of the throne's standing.\nTwo interior states fall into siba."

 MOR_dnc_the_customs_are_pledged:0 "The Customs Are Pledged"
 MOR_dnc_the_customs_are_pledged_desc:0 "A French consortium will advance the money. The security is sixty per cent of the customs receipts of the eight ports, collected at the quayside by agents who answer to Paris. The treasury is full tonight. The state has just stopped owning its own revenue."
 MOR_dnc_the_customs_are_pledged_tt:0 "Immediate cash, then Gage No. 1: the customs revenue leaves the budget.\nTrade efficiency falls and the national debt scale advances by two steps.\nSets the flag carried into the WW1 and INT eras: the customs are under gage."

 MOR_dnc_play_berlin_against_paris:0 "Play Berlin Against Paris"
 MOR_dnc_play_berlin_against_paris_desc:0 "The Kaiser came ashore at Tangier and said out loud that Morocco is independent. He did not say it for Morocco. But a second creditor is a second price, and a loan refinanced in Berlin is a gage lifted in Paris. The bill is not payable now. It is payable the day Europe goes to war."
 MOR_dnc_play_berlin_against_paris_tt:0 "The 1904 loan is refinanced in Berlin: one debt step removed, the customs gage lifted.\nOpinion with Germany rises sharply, opinion with France and Britain collapses.\nMorocco becomes a German war aim: the flag of Berlin patronage is set, and it will be read when the European war opens."

 MOR_dnc_the_act_of_algeciras:0 "The Act of Algeciras"
 MOR_dnc_the_act_of_algeciras_desc:0 "Thirteen powers meet to guarantee the independence of a country none of them intends to leave alone. The Act proclaims Moroccan sovereignty, creates a State Bank the Sultan does not control, opens the door to every trader on earth, and hands the policing of the eight ports to France and Spain. It cannot be refused. It can only be read carefully."
 MOR_dnc_the_act_of_algeciras_tt:0 "Sovereignty proclaimed, administration internationalised.\nOne further step down the debt scale; the throne's standing suffers.\nOpens the exclusive settlements that follow from the Act."

 MOR_dnc_the_open_door_turned_around:0 "The Open Door Turned Around"
 MOR_dnc_the_open_door_turned_around_desc:0 "The commercial open door was written to keep France from closing Morocco to others. Read the other way, it is an invitation the Sultan may address to whomever he likes. A third power in the ports is not a friend; it is a witness, and a witness is worth more than a friend to a state whose only weapon is the fact that everyone is watching."
 MOR_dnc_the_open_door_turned_around_tt:0 "A third power - the United States, Italy or Britain - receives a port concession outside the Franco-Spanish duo.\nOpinion with the chosen power rises sharply; one extra diplomatic slot.\nPrice: the State Bank stays foreign and the port police stay Franco-Spanish. The other two settlements of Algeciras close for good."

 MOR_dnc_the_conditional_baya:0 "The Conditional Bay'a"
 MOR_dnc_the_conditional_baya_desc:0 "The ulama of Fes will give their allegiance. They will give it in writing, and the writing has conditions: drive out the foreigners, abolish the tertib, contract no more loans. An allegiance that can be argued with is an allegiance that can be withdrawn. For as long as the promise is unkept, it is worth more than any act of government."
 MOR_dnc_the_conditional_baya_tt:0 "The oath of the ulama is subordinated to written undertakings.\nThe throne's standing rises for as long as none of the three paths below is taken: the promise is worth more than its execution.\nOpens the three exclusive settlements."

 MOR_dnc_drive_out_the_foreigners:0 "Drive Out the Foreigners"
 MOR_dnc_drive_out_the_foreigners_desc:0 "Keep the promise. The tertib is abolished, the loans are repudiated, the missions are put on ships. Morocco of 1912 will then have the one thing it will otherwise lack until 1944: a sovereign who signed nothing. It will have very little else."
 MOR_dnc_drive_out_the_foreigners_tt:0 "Tertib abolished, foreign loans repudiated, foreign missions expelled.\nThe throne's standing rises steeply; residency trust collapses.\nThe eight ports are blockaded and the debt freezes at the step reached.\nSets the flag read by A Sultan of War in the WW1 era."

 MOR_dnc_the_debts_of_my_brother:0 "The Debts of My Brother"
 MOR_dnc_the_debts_of_my_brother_desc:0 "Paris will recognise the new Sultan on one condition, and it is a condition it states plainly: he assumes every treaty and every debt of the man he replaced. He was raised to the throne on a promise to repudiate exactly these. He signs."
 MOR_dnc_the_debts_of_my_brother_tt:0 "French recognition obtained: residency trust rises sharply.\nTwo further steps down the debt scale; the throne's standing falls hard.\nSets the flag read by A Sultan Who Signs in the WW1 era."

 MOR_dnc_marrakesh_shall_submit:0 "Marrakesh Shall Submit"
 MOR_dnc_marrakesh_shall_submit_desc:0 "The Hafidiya is not accepted. The reigning Sultan marches south against the Glaoua and the notables who proclaimed his brother, and the battle that history records as a defeat is fought again. A sultan who crushes Marrakesh keeps his throne and stops preaching in anyone's name."
 MOR_dnc_marrakesh_shall_submit_tt:0 "The scripted partition of 1908 is cancelled: the country does not split.\nCivil war against the Glaoua, three states in siba, the treasury emptied.\nThe throne's standing falls hard.\nSets the flag that gives the WW1 era its alternative dynastic text."

 ############################################################
 # ERA WW1 (1910-1918) - RON_Maroc_WW1
 ############################################################

 MOR_ww1_the_sherifian_seal:0 "The Sherifian Seal"
 MOR_ww1_the_sherifian_seal_desc:0 "The Treaty of Fes did not depose the Sultan. It employed him. Every decree the Residency writes must carry the sherifian seal before it is law, which means the occupier needs the occupied, every single day, in writing. That is the whole of Morocco's remaining power, and this focus is the ledger in which it is kept."
 MOR_ww1_the_sherifian_seal_tt:0 "Establishes the register of dahirs and displays the two counters of the reign: the standing of the throne and the trust of the Residency.\nEvery decree demanded by the Residency becomes refusable, at the stated price.\nBypassed if no protecting power exists: with no Residency there is no decree to countersign."

 MOR_ww1_a_sultan_who_signs:0 "A Sultan Who Signs"
 MOR_ww1_a_sultan_who_signs_desc:0 "The historical road. The throne survives the occupation by consenting to it, receives a civil list, keeps its palaces and its protocol, and buys a modern state one signature at a time. Everything built this way is real. So is what it costs."
 MOR_ww1_a_sultan_who_signs_tt:0 "Residency trust rises sharply; a civil list adds monthly political power.\nThe ceiling on the throne's standing is held down for as long as the Lyautey doctrine holds.\nOpens the economic and military branches."

 MOR_ww1_a_sultan_of_war:0 "A Sultan of War"
 MOR_ww1_a_sultan_of_war_desc:0 "The askris of the sherifian army have not been paid and have been humiliated by the instructors sent to drill them. Three weeks after the treaty is signed, Fes rises. If the throne goes with the rising instead of ordering it suppressed, the Treaty of Fes dies younger than the ink on it."
 MOR_ww1_a_sultan_of_war_tt:0 "The Treaty of Fes is repudiated: the throne's standing rises steeply, residency trust collapses.\nThe capital moves inland to state 462; with no customs receipts the debt freezes at its maximum step.\nThe nationalist movement of the 1930s begins thirty years early, with the palace at its head.\nRequires the mutiny of the askris of 17 April 1912, or a throne that already promised expulsion in the previous era."

 MOR_ww1_rabat_not_fes:0 "Rabat, Not Fes"
 MOR_ww1_rabat_not_fes_desc:0 "The capital comes down from the imperial interior to the coast, where the ships are and where the Residency is. Work begins on the port of Casablanca. The country will be governed from the sea from now on, which is convenient for whoever owns the sea."
 MOR_ww1_rabat_not_fes_tt:0 "Infrastructure and coastal control rise in state 461; two extra civilian slots; the works of Casablanca harbour begin.\nThe ulama of Fes take note: the throne's standing falls.\nBypassed if the capital already sits on the coast."

 MOR_ww1_the_casablanca_fair:0 "The Casablanca Fair"
 MOR_ww1_the_casablanca_fair_desc:0 "While the metropole bleeds out in Picardy, the protectorate holds a trade fair. It works: the pavilions bring buyers, the buyers bring capital, and the capital brings settlers who need land and will get it. Every fair is a little more of the Chaouia and the Gharb in European hands."
 MOR_ww1_the_casablanca_fair_tt:0 "Construction speed and trade efficiency rise.\nEach fair draws settlers: one permanent step of land pressure, which cannot be removed."

 MOR_ww1_hold_the_shell_empty_the_core:0 "Hold the Shell, Empty the Core"
 MOR_ww1_hold_the_shell_empty_the_core_desc:0 "Paris orders the Resident-General to evacuate the interior and hold the ports. He refuses and holds the whole line with skeleton garrisons and bluff. For four years the map of French Morocco is a shell with almost nothing inside it, and anyone who looks closely can see that."
 MOR_ww1_hold_the_shell_empty_the_core_tt:0 "Reveals the true state of the interior garrisons and opens the two settlements below.\nNo bonus of its own: this is a window, not a gift."

 MOR_ww1_keep_the_peace_of_the_bled:0 "Keep the Peace of the Bled"
 MOR_ww1_keep_the_peace_of_the_bled_desc:0 "The Ottoman Caliph calls for jihad and the Sultan of Morocco, who is also a Commander of the Faithful, does not answer. The country stays quiet. The men leave for France. The ulama watch the throne stay quiet while the men leave, and they remember it."
 MOR_ww1_keep_the_peace_of_the_bled_tt:0 "Residency trust rises sharply and stability improves.\nThe throne's standing falls: it stayed quiet while the men were leaving.\nOpens The Regiments Sail."

 MOR_ww1_seize_the_empty_shell:0 "Seize the Empty Shell"
 MOR_ww1_seize_the_empty_shell_desc:0 "The best troops are in France, the line is held by men who are not there, and the metropole is looking the other way for the first time in a generation. The Zaian war is already open and El Herri has already happened. This is the window, and it is exactly four years wide."
 MOR_ww1_seize_the_empty_shell_tt:0 "The throne's standing rises steeply; simultaneous rising in the interior states.\nWar with France.\nThe promised German support arrives only as rifles, through Tangier and the Spanish zone, and it stops in November 1918."

 MOR_ww1_the_regiments_sail:0 "The Regiments Sail"
 MOR_ww1_the_regiments_sail_desc:0 "Two regiments of native infantry leave in August 1914, and the tirailleurs marocains are raised behind them. For the first time in its history, the principal export of Morocco is its infantry. Every man shipped is a claim written down somewhere, and a village that will be short of men at harvest."
 MOR_ww1_the_regiments_sail_tt:0 "First entry in the register of lent battalions: one claim token.\nThe throne's standing falls; manpower is drained from two home states and dissent rises in those same states.\nUnlocks the repeatable decision Send Another Contingent.\nBypassed if a contingent has already sailed."

 MOR_ww1_a_claim_written_in_blood:0 "A Claim Written in Blood"
 MOR_ww1_a_claim_written_in_blood_desc:0 "Between thirty-five and forty-five thousand Moroccans fought in Europe. The Residency has no intention of counting them and every intention of forgetting them. Counting them, publicly, in a document nobody in Paris can refuse to receive, turns dead men into a political instrument."
 MOR_ww1_a_claim_written_in_blood_tt:0 "Converts the tokens into a political claim usable after 1918: one further token, and the flag read by Redeem the Gage in the INT era.\nPermanent loss of stability in every state that was drained."

 MOR_ww1_the_riders_of_taza:0 "Abd al-Malik's Riders"
 MOR_ww1_the_riders_of_taza_desc:0 "The grandson of Abd el-Kader raises the Taza corridor with Berlin's money and Berlin's rifles, in the one place where French Morocco and Algeria are stitched together by a single road. Cut the corridor and the two colonies stop being one theatre."
 MOR_ww1_the_riders_of_taza_tt:0 "Unlocks the repeatable decision Arm the Taza Corridor: German supplies against one point of dissent in the Taza states per activation.\nWar with France.\nSets the flag that the Rif branch reads in the INT era."

 ############################################################
 # ERA INT (1919-1932) - RON_Maroc_INT
 ############################################################

 MOR_int_the_education_of_a_sultan:0 "The Education of a Sultan"
 MOR_int_the_education_of_a_sultan_desc:0 "Youssef dies in November 1927 and his seventeen-year-old son is proclaimed the following day. Of the three sons he was chosen because he seemed the most malleable. Whoever teaches him for the next ten years is deciding what the throne will be worth in 1947, and everyone involved knows it except, for the moment, the boy."
 MOR_int_the_education_of_a_sultan_tt:0 "Opens the reign and the counter that governs the whole second half of the game.\nThree exclusive orientations follow."

 MOR_int_the_french_preceptors:0 "The French Preceptors"
 MOR_int_the_french_preceptors_desc:0 "French tutors, a French curriculum, French advisers at the palace door. The Residency chose this boy for his supposed docility and now sets about producing it. He will be the best-informed sovereign Morocco has ever had, and the least able to speak in anyone's name but the Residency's."
 MOR_int_the_french_preceptors_tt:0 "Residency trust rises sharply; research speed improves; French advisers become available.\nThe ceiling on the throne's standing is fixed at 55 for the rest of the game."

 MOR_int_two_masters_one_pupil:0 "Two Masters, One Pupil"
 MOR_int_two_masters_one_pupil_desc:0 "Mornings with the preceptors, afternoons with the palace scholars. Neither side owns him and neither side lets go of him. He will be fluent in both languages of power and entirely trusted by neither, which is either the worst of both worlds or the only place a Moroccan sovereign can actually stand."
 MOR_int_two_masters_one_pupil_tt:0 "Both counters are capped at mid-course: the throne's standing and residency trust each stop at 70.\nNo camp quite holds him, no camp quite lets him go."

 MOR_int_the_scholars_of_qarawiyyin:0 "The Scholars of Qarawiyyin"
 MOR_int_the_scholars_of_qarawiyyin_desc:0 "He is taught in Fes, by the ulama of the oldest university in the world, in the tradition that made his ancestors Commanders of the Faithful. He will be able to say things no French-trained sultan could say and be believed. The Residency will spend twenty years regretting the appointment."
 MOR_int_the_scholars_of_qarawiyyin_tt:0 "The throne's standing has no ceiling; residency trust is capped at 45.\nNationalist decisions open one step earlier."

 MOR_int_the_mendoub_of_tangier:0 "The Mendoub of Tangier"
 MOR_int_the_mendoub_of_tangier_desc:0 "Tangier is administered by an international commission and the Sultan is represented there by a mendoub. It is one of the very few appointments he makes alone, and it gives Morocco something it has nowhere else: an address on neutral ground, where people who cannot be received in Rabat can be received."
 MOR_int_the_mendoub_of_tangier_tt:0 "The throne's standing rises: this is an act the Sultan takes by himself.\nA diplomatic antenna on international territory: one extra mission slot and a way round one embargo.\nSets the flag required by The Speech at the Mendoubia in the WW2 era.\nBypassed if Tangier is under no administration at all."

 MOR_int_the_sherifian_phosphate_office:0 "The Sherifian Phosphate Office"
 MOR_int_the_sherifian_phosphate_office_desc:0 "The phosphate under the Khouribga plateau is legally the personal property of the Sultan, and the Resident-General deliberately leaves it that way. It is the only Moroccan asset of world rank in the entire period. It is also, from this day, the thing the Residency will threaten whenever it wants a signature."
 MOR_int_the_sherifian_phosphate_office_tt:0 "Strategic resource and hard currency from state 462: the one Moroccan asset of world rank in the period.\nPrice: the mine becomes the lever of every residency bargain. Refusing the seal costs ten more points of trust each time, cumulatively.\nSets the flag read by Labonne's Plan and The Palace Purse in the WW2 era."

 MOR_int_redeem_the_gage:0 "Redeem the Gage"
 MOR_int_redeem_the_gage_desc:0 "The debt of 1860 and the loan of 1904 are still secured on the customs twenty years later. Phosphate money plus the political claim earned in France is, for the first time, enough to buy one of them back. Nothing will be built for three years. The country will own a revenue again."
 MOR_int_redeem_the_gage_tt:0 "Two debt steps removed and one real revenue returned to the budget.\nPrice: construction speed falls for three years and no new civilian factory may be built in that time.\nRequires the claim written in blood in 1918. Bypassed if nothing is under gage."

 MOR_int_the_settlers_bank:0 "The Settlers' Bank"
 MOR_int_the_settlers_bank_desc:0 "Agricultural credit for the colonat, secured on land registered under the Torrens system by the dahirs of 1913 and 1914. The money is real, the factories are real, and the mechanism by which four hundred thousand hectares change hands over forty years is now fully assembled and running."
 MOR_int_the_settlers_bank_tt:0 "Two civilian factories and a rise in residency trust.\nPrice: one step of land pressure, a fall in the throne's standing, and the debt untouched. The early economic bonus is a deferred debt."

 MOR_int_the_confederal_republic:0 "The Confederal Republic of the Rif"
 MOR_int_the_confederal_republic_desc:0 "Proclaimed at Ajdir in September 1921 with a capital, an assembly, a tax system, a regular army and the artillery taken at Annual. It is not a mountain revolt. It is a state, and it is the most serious answer anyone in the Maghreb gives to the question of what a modern Muslim polity looks like."
 MOR_int_the_confederal_republic_tt:0 "Switches to the Rifian sub-tag through the alias mechanism already in place: capital at Ajdir, the guns taken at Annual, a regular army.\nRequires the collapse of the Spanish line at Annual, or a rising already under way in the Taza corridor."

 MOR_int_an_assembly_at_ajdir:0 "An Assembly at Ajdir"
 MOR_int_an_assembly_at_ajdir_desc:0 "An assembly of tribal representatives, a treasury that actually collects, and a plan for a bank. The Rifian tax is real and it is paid. This is the part European observers refuse to see, and it is the part that makes the Republic dangerous rather than merely inconvenient."
 MOR_int_an_assembly_at_ajdir_tt:0 "Stability and conscription rise; consumer goods fall.\nThis is not a mountain revolt but a state, and the Rifian tax is real."

 MOR_int_concessions_for_recognition:0 "Concessions for Recognition"
 MOR_int_concessions_for_recognition_desc:0 "Mining rights in the Rif, offered in London and in Berlin, in exchange for something the Republic needs far more than money: somebody, anybody, treating it as a government. The buyers are interested. They will stay interested exactly as long as Paris and Madrid stay at odds."
 MOR_int_concessions_for_recognition_tt:0 "Arms imports through Tangier and rising opinion with the buyer.\nPrice: whoever buys, a forced event withdraws the arrangement the moment Paris and Madrid come to terms. The weapon does not outlive the agreement."

 MOR_int_the_line_at_ouergha:0 "The Line at the Ouergha"
 MOR_int_the_line_at_ouergha_desc:0 "Hold the north and go no further. Spain alone lost every year from 1921 to 1924, and Alhucemas was only possible because France came into the war. A Rif that keeps its line and sells its mines is still standing in 1936, which changes the Spanish war and everything after it."
 MOR_int_the_line_at_ouergha_tt:0 "France does not enter the war and the Alhucemas landing is not triggered in the window.\nPrice: Madrid commits two hundred thousand men and more, and the use of chemical weapons continues.\nSets the flag that keeps the Rif in existence into the WW2 era."

 MOR_int_march_on_fes:0 "March on Fes"
 MOR_int_march_on_fes_desc:0 "April 1925: the Rifian columns push south to within a few dozen kilometres of Fes. It is the boldest thing the Republic ever does and it is the thing that kills it, because it turns an exhausted enemy into a coalition of two empires with a shared landing beach."
 MOR_int_march_on_fes_tt:0 "Three states occupied at once, then war with France and the Alhucemas landing.\nAn exhausted adversary becomes a coalition."

 MOR_int_the_review_maghreb:0 "The Review Maghreb"
 MOR_int_the_review_maghreb_desc:0 "The Moroccan movement acquires a voice in Paris before it has one at home, because in Paris it may publish and at home it may not. Maghreb in 1932, then L'Action du Peuple in Fes. Everything the nationalists will do for the next twenty years starts on a printing press in the metropole."
 MOR_int_the_review_maghreb_tt:0 "Opens the nationalist press decisions: the throne's standing rises with each run, residency trust falls.\nSets the flag required by The Plan of Reforms in the WW2 era."

 ############################################################
 # ERA WW2 (1933-1948) - RON_Maroc_WW2
 ############################################################

 MOR_ww2_the_feast_of_the_throne:0 "The Feast of the Throne"
 MOR_ww2_the_feast_of_the_throne_desc:0 "The nationalists invent it, not the palace: an anniversary of the accession, celebrated as a national day. Within a few years the Residency understands what has happened. There is now one object in Morocco that every Moroccan is invited to be loyal to, and it is not France."
 MOR_ww2_the_feast_of_the_throne_tt:0 "The Sultan becomes the symbol of the country: the throne's standing rises every year, cumulatively.\nPrice: the Residency understands what is happening. Trust falls and every nationalist decision costs a quarter more."

 MOR_ww2_the_speech_at_the_mendoubia:0 "The Speech at the Mendoubia"
 MOR_ww2_the_speech_at_the_mendoubia_desc:0 "Tangier, 9 April 1947. The Sultan salutes Morocco's Arab and Islamic ties, calls for the territorial unity of the country, and does not praise France once. Nothing in the text is actionable and nothing in it is deniable. It is the loudest thing a man in his position has ever said without saying it."
 MOR_ww2_the_speech_at_the_mendoubia_tt:0 "The summit of the signature mechanic: the throne's standing rises sharply, residency trust collapses.\nOpens the Territorial Unity branch.\nRequires a mendoub in Tangier and a throne whose standing has passed 70 - the palier at which the throne may speak."

 MOR_ww2_bind_the_caids_to_the_throne:0 "Bind the Caids to the Throne"
 MOR_ww2_bind_the_caids_to_the_throne_desc:0 "Thami el-Glaoui and the Berber caids are a clientele, and a clientele belongs to whoever pays it. Buy them before the Residency does. Pashas are bought in cash and the cash comes out of everything else."
 MOR_ww2_bind_the_caids_to_the_throne_tt:0 "Stability rises. Heavy cost in political power and one economic step lost: pashas are paid in cash.\nHalf the states are removed from the defection foreseen at the ceiling crisis."

 MOR_ww2_the_alliance_of_the_atlas:0 "The Alliance of the Atlas"
 MOR_ww2_the_alliance_of_the_atlas_desc:0 "The other road, and it is genuinely playable: build the Juin-Glaoui axis instead of fighting it. Divisions, equipment, cadres, and a Residency that trusts you completely. You are assembling, with your own hands, the coalition that will depose you."
 MOR_ww2_the_alliance_of_the_atlas_tt:0 "Residency trust rises sharply; framed divisions and equipment arrive.\nArms the rival tag that will depose the Sultan at the ceiling crisis."

 MOR_ww2_the_years_of_requisition:0 "The Years of Requisition"
 MOR_ww2_the_years_of_requisition_desc:0 "The protectorate starts preparing for a war in France in 1937 and does not stop until 1944. Compulsory crops, fixed prices, requisitioned harvests shipped north. The ledgers balance. The countryside does not, and 1945 will present the account."
 MOR_ww2_the_years_of_requisition_tt:0 "Resources rise and transfers to the metropole begin.\nPrice: consumer goods fall hard and the scarcity counter starts running - it is what arms the Year of Hunger."

 MOR_ww2_labonnes_plan:0 "Labonne's Plan"
 MOR_ww2_labonnes_plan_desc:0 "Industrialisation and a mining boom in lead, cobalt and manganese. Real factories, real railways, real wages. And a European population crossing three hundred thousand, which is the number at which a protectorate stops being a temporary arrangement and starts being a settler colony."
 MOR_ww2_labonnes_plan_tt:0 "Three civilian factories, one military factory, and resources.\nPrice: two further steps of land pressure and a ceiling on the throne's standing lowered by ten points.\nRequires the Sherifian Phosphate Office."

 MOR_ww2_the_palace_purse:0 "The Palace Purse"
 MOR_ww2_the_palace_purse_desc:0 "The phosphate is the Sultan's personal property, so the phosphate money can go where the Sultan says. It goes to patronage, to the zaouias, to the famine of 1945 and to everyone who remembers who fed them. No factory is built with it. Something else is."
 MOR_ww2_the_palace_purse_tt:0 "The throne's standing and stability rise, and the decision Feed the Famine costs nothing from the treasury.\nPrice: no new factory and construction speed falls for the whole era.\nRequires the Sherifian Phosphate Office."

 MOR_ww2_the_tabors_sail_for_italy:0 "The Tabors Sail for Italy"
 MOR_ww2_the_tabors_sail_for_italy_desc:0 "Four groups of tabors, some twelve thousand goumiers: Tunisia in December 1942, Italy in November 1943, the Garigliano in the spring of 1944, then Provence, Alsace and Germany. Between eighty and a hundred thousand Moroccans in three years. The country pays its place in the world in infantry for the third time in thirty years."
 MOR_ww2_the_tabors_sail_for_italy_tt:0 "Third entry in the register of lent battalions: two claim tokens.\nThe throne's standing falls; manpower is drained from four states and dissent rises in those same states.\nOpens the two settlements below."

 MOR_ww2_under_our_own_colours:0 "Under Our Own Colours"
 MOR_ww2_under_our_own_colours_desc:0 "Not French units with Moroccan men in them: Moroccan units, under Moroccan colours, named in the despatches. The men come home from Europe with a military reputation and a political consciousness, and the second is what matters."
 MOR_ww2_under_our_own_colours_tt:0 "The throne's standing rises with every distinguished campaign, and army experience with it.\nPrice: every claim token is cancelled - France will not pay twice - and residency trust falls."

 MOR_ww2_the_claim_at_the_peace_table:0 "The Claim at the Peace Table"
 MOR_ww2_the_claim_at_the_peace_table_desc:0 "Spend the tokens. An observer's seat, an American ear, a British one. The country buys itself a voice in the settlement of the world by emptying its own villages, and everybody at the table knows the price and nobody says it out loud."
 MOR_ww2_the_claim_at_the_peace_table_tt:0 "Opinion with the United States and Britain rises; an observer's seat is obtained.\nPrice: the throne's standing falls further with every token spent.\nSets the flag on which the Territorial Unity branch depends in the CW era."

 MOR_ww2_the_plan_of_reforms:0 "The Plan of Reforms"
 MOR_ww2_the_plan_of_reforms_desc:0 "Not independence. The application of the Treaty of Fes, to the letter: a Moroccan government, elected assemblies, equality before the tax and before employment. It is unanswerable precisely because it asks for nothing that was not promised in writing in 1912. Nogues buries it anyway."
 MOR_ww2_the_plan_of_reforms_tt:0 "Demands the application of the Treaty of Fes: the throne's standing rises, residency trust falls.\nA forced event buries the plan in 1936-1937. The focus buys the legitimacy, not the result.\nRequires the nationalist press in the metropole."

 MOR_ww2_two_parties_two_papers:0 "Two Parties, Two Papers"
 MOR_ww2_two_parties_two_papers_desc:0 "The Comite d'action marocaine splits in 1937. Al-Fassi takes the National Party, Ouazzani takes the Popular Movement, and each keeps a newspaper. It halves the movement's effectiveness and it also halves what a single police operation can destroy."
 MOR_ww2_two_parties_two_papers_tt:0 "Nationalist decisions lose some effectiveness.\nBut the repression decapitates only one half: the deportation event removes one adviser in two."

 MOR_ww2_one_party_for_the_nation:0 "One Party for the Nation"
 MOR_ww2_one_party_for_the_nation_desc:0 "Hold al-Fassi and Ouazzani together. One organisation, one paper, one negotiating position, and one address for the Surete to raid. Unity is worth a great deal right up to the morning it is worth nothing at all."
 MOR_ww2_one_party_for_the_nation_tt:0 "Nationalist decisions gain a quarter in effectiveness and one adviser is added.\nPrice: the Residency has a single target. The deportation event removes the whole committee at once and the era loses its advisers until the exiles return."

 MOR_ww2_the_istiqlal:0 "The Independence Party"
 MOR_ww2_the_istiqlal_desc:0 "The manifesto of 11 January 1944 has sixty-six signatures, one of them a woman's, and copies go to the Residency, to the palace and to the American consulates. The party that grows out of it is the first Moroccan organisation that asks for the whole thing and asks in public."
 MOR_ww2_the_istiqlal_tt:0 "Monthly support for the national ideology rises and the exiles return from 1946.\nPrice: the credit for independence is shared. If the throne did not sign the manifesto, the ceiling on its standing drops by ten points.\nSets the flag read by The Throne and the Party in the CW era."

 MOR_ww2_the_caliphs_bargain:0 "The Caliph's Bargain"
 MOR_ww2_the_caliphs_bargain_desc:0 "Beigbeder courts Abdelkhalek Torres and the Tetouan reformists, and the dictatorship offers what the republic refused: Arabic newspapers, Arabic schools, funded pilgrimages, the beginnings of a Moroccan administration. Every concession is paid for in battalions shipped to Spain."
 MOR_ww2_the_caliphs_bargain_tt:0 "Real cultural concessions in the northern zone: press, schools, funded pilgrimage, an embryo of Moroccan administration.\nEach concession is paid in battalions sent to Spain: the throne's standing falls one step at a time.\nUnlocks the refusal option in the event The Army of Africa Sails."

 MOR_ww2_the_maghreb_bureau:0 "The Maghreb Bureau"
 MOR_ww2_the_maghreb_bureau_desc:0 "Abd el-Krim jumps ship at Port Said in May 1947, reaches Cairo, and by 1948 presides over the Liberation Committee of the Arab Maghreb. The Moroccan question stops being a French domestic matter and becomes an item on an agenda in a city France does not control."
 MOR_ww2_the_maghreb_bureau_tt:0 "External support rises and the United Nations pressure counter begins to run against France and Spain.\nPrice: France reclassifies the Moroccan question as a security threat and closes every bilateral negotiation for the rest of the game.\nSets the flag read by Franco at the Bar in the CW era."

 ############################################################
 # ERA CW (from 1949) - RON_Maroc_CW
 ############################################################

 MOR_cw_the_throne_and_the_party:0 "The Throne and the Party"
 MOR_cw_the_throne_and_the_party_desc:0 "Independence is coming and there are two claimants to the credit for it. The share-out decided here structures everything that follows, and it is not decided by argument: it is decided by how much standing the throne has left after forty years of signing things."
 MOR_cw_the_throne_and_the_party_tt_throne:0 "The throne's standing has held: the successor state is a monarchy and the Istiqlal sits in its government.\nThe verdict is now irreversible."
 MOR_cw_the_throne_and_the_party_tt_party:0 "The throne's standing has not held: the successor state is a republic and the reigning house leaves the game.\nA modern state was built and the dynasty that built it is gone. The verdict is now irreversible."

 MOR_cw_franco_at_the_bar:0 "Franco at the Bar"
 MOR_cw_franco_at_the_bar_desc:0 "General Assembly resolution 39(I) of 12 December 1946 withdraws ambassadors from Madrid and shuts Spain out of the agencies. A regime that wants back into the world can be made to pay for the ticket, and the northern zone is the only currency it has that Morocco wants."
 MOR_cw_franco_at_the_bar_tt:0 "Each tranche of United Nations pressure opens a redemption option on the northern zone.\nPrice: France sees the manoeuvre and hardens its own zone - trust falls and one permanent step of repression is added.\nRequires the Tangier speech and the Cairo bureau."

 MOR_cw_the_northern_zone_redeemed:0 "The Northern Zone Redeemed"
 MOR_cw_the_northern_zone_redeemed_desc:0 "Madrid will hand back the protectorate zone. It will not hand back Ceuta, Melilla or Ifni, and it wants that in writing before anything moves. The garrisons are bought out in currency and equipment. It is the only road to reunification in this period that does not go through a war."
 MOR_cw_the_northern_zone_redeemed_tt:0 "State 290 recovered by agreement; the garrisons are bought out in currency and equipment.\nPrice: written renunciation of Ceuta, Melilla and Ifni - a border left open, permanently, for the rest of the period.\nBypassed if state 290 is already held."

 MOR_cw_no_inch_conceded:0 "Not One Inch Conceded"
 MOR_cw_no_inch_conceded_desc:0 "Refuse to sign anything away. The claim covers the whole north and the presidios with it. The northern zone is where the army that made Franco was raised, and its garrison is sized accordingly."
 MOR_cw_no_inch_conceded_tt:0 "The throne's standing rises sharply; claims are pressed on states 290, 783, 1106, 699 and 1118 and on the presidios.\nWar with Spain."

 MOR_cw_ifni_and_the_sands:0 "Ifni and the Sands"
 MOR_cw_ifni_and_the_sands_desc:0 "Cape Juby occupied in 1916, Ifni taken by General Capaz in the spring of 1934, Rio de Oro and the sands behind it. These are Spanish sovereign territory, not protectorate, which is a separate legal lock and therefore a separate fight, state by state."
 MOR_cw_ifni_and_the_sands_tt:0 "States 783, 1106, 699 and 1118 fall under Spanish sovereignty proper, legally distinct from the protectorate: a separate lock, with its own political and military cost for each state.\nCores are added on the states recovered.\nBypassed state by state on those already held."
